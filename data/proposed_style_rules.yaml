# Proposed style rules awaiting editorial review.
# Populated automatically by tools/extract_learning.py (via GitHub Actions on push
# to data/feedback/). Review and promote/edit in the dashboard's 'Proposed style
# rules' section — accepted rules move to prompts/payments/style_rules.yaml.
- date: '2026-09-08'
  rule: 'When an abbreviation is introduced in parentheses on first use in the body,
    use it for

    subsequent references in that same piece. Do not introduce the parenthetical and
    then

    fail to use the short form again — if the abbreviation will recur, add the parenthetical;

    if it will not, omit it (per rule [13]). In this diff, "OCC" is introduced in
    parentheses

    because it recurs later in the body.'
- date: '2026-09-08'
  rule: 'Do not use an em-dash or en-dash to introduce a trailing participial or resultative
    clause

    at the end of a sentence when a comma integrates it more cleanly. For example,
    prefer

    "access Federal Reserve payment systems directly, ending its reliance on partner
    banks"

    over "access Federal Reserve payment systems directly – ending its reliance on
    partner banks".'
  supersedes: 33
- date: '2026-09-08'
  rule: 'Do not capitalise the individual words of a proposed or informal framework
    name when it

    is being described rather than cited as an official proper noun. Write "a BRICS+
    digital

    payments and open finance framework" rather than "a BRICS+ Digital Payments and
    Open

    Finance Framework" unless the name has been formally adopted and capitalised by
    the

    issuing body.'
- date: '2026-09-08'
  rule: 'Do not open a paragraph with a colon-introduced binary question when the
    sentence can be

    recast with a preposition. For example, prefer "face a strategic question about
    whether X

    or Y" over "face a strategic question: whether X or Y".'
  supersedes: 3
