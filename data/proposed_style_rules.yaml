# Proposed style rules awaiting editorial review.
# Populated automatically by tools/extract_learning.py (via GitHub Actions on push
# to data/feedback/). Review and promote/edit in the dashboard's 'Proposed style
# rules' section — accepted rules move to prompts/payments/style_rules.yaml.
- date: '2026-07-20'
  rule: In headlines, abbreviate million, billion and trillion to m, bn, and tn respectively
    — e.g. '$10m', '$10bn', '$10tn'.
- date: '2026-07-20'
  rule: Prefer 'say' (or 'said', 'says') over 'believe' or 'believes' when attributing
    views to individuals or organisations. Use verbs that report what people have
    stated rather than asserting their internal beliefs.
- date: '2026-07-20'
  rule: Do not include editorial notes about missing information — e.g. 'Whether this
    is a newly created position is not stated in the source' or 'The appointee's background
    was not available.' If information is absent, simply omit it; do not flag its
    absence in the text.
