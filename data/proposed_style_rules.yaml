# Proposed style rules awaiting editorial review.
# Populated automatically by tools/extract_learning.py (via GitHub Actions on push
# to data/feedback/). Review and promote/edit in the dashboard's 'Proposed style
# rules' section — accepted rules move to prompts/payments/style_rules.yaml.
- date: '2026-11-27'
  rule: Do not use "ongoing" to describe continuing discussions or processes. Prefer
    "continuing" — eg, "With trilogue discussions continuing" rather than "With trilogue
    discussions ongoing".
- date: '2026-11-27'
  rule: 'When an introductory sentence becomes overloaded with attribution, split
    it into two sentences: the first stating the news development, the second providing
    the attribution and source detail. For example, prefer "Subscription payments,
    one-click checkout and optional buyer protection are now available or imminent
    for Sparkassen customers using Wero. This follows an announcement on Monday (November
    24) by S-Payment…" over combining both into a single long sentence.'
