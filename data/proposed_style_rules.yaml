# Proposed style rules awaiting editorial review.
# Populated automatically by tools/extract_learning.py (via GitHub Actions on push
# to data/feedback/). Review and promote/edit in the dashboard's 'Proposed style
# rules' section — accepted rules move to prompts/payments/style_rules.yaml.
- date: '2026-07-13'
  rule: Do not use phrases such as 'The timing is notable', 'This is notable', or
    any equivalent sentence that announces notability or significance before making
    a point. Write the substantive point directly.
- date: '2026-07-13'
  rule: Use 'judgment' not 'judgement'.
- date: '2026-07-13'
  rule: Only include an abbreviation or initialism in parentheses after a term if
    that abbreviation is used again later in the same piece. If the short form never
    recurs, spell out the term in full without adding the abbreviation in brackets.
