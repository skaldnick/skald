# Proposed style rules awaiting editorial review.
# Populated automatically by tools/extract_learning.py (via GitHub Actions on push
# to data/feedback/). Review and promote/edit in the dashboard's 'Proposed style
# rules' section — accepted rules move to prompts/payments/style_rules.yaml.
- date: '2026-08-19'
  rule: Do not include stories that contain no new development, announcement, or meaningful
    change in status. A story must have a clear news hook — an event, decision, publication,
    or shift — not merely a topic of general interest. Reject items where the editor
    note or review concludes "No news".
- date: '2026-08-20'
  rule: 'Do not include stories that are duplicates of items already covered in the
    briefing. If a story

    covers the same development as one already selected, reject it rather than running
    both.'
- date: '2026-08-20'
  rule: 'Do not open a paragraph with a meta-observation that frames the story before
    making its point —

    eg, "The tie-up is pitched squarely at the account primacy problem" or "The integration
    reflects

    a broader pattern". Lead directly with the substantive claim or observation. Reserve
    framing

    sentences for the standfirst.'
- date: '2026-08-20'
  rule: 'Do not use the term "off-us" (or similar internal banking jargon) in body
    text without

    explanation. Replace with plain language — eg, "other" or "external" — unless
    the term has

    been defined earlier in the piece.'
- date: '2026-08-20'
  rule: 'Do not include information in the headline that merely restates a detail
    already implied or

    made clear by the headline''s main claim. Keep headlines concise — eg, "Modulr
    becomes direct

    participant in CHAPS" rather than "Modulr becomes direct participant in CHAPS,
    settling at the

    Bank of England" when the settlement detail is explained in the standfirst.'
- date: '2026-08-20'
  rule: 'When a specific month is available for a referenced event or product launch,
    include it rather

    than leaving the timing vague — eg, "since launching its bank-on-file product
    in June" rather

    than "since launching its bank-on-file product".'
  supersedes: 19
