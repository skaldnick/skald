# Proposed style rules awaiting editorial review.
# Populated automatically by tools/extract_learning.py (via GitHub Actions on push
# to data/feedback/). Review and promote/edit in the dashboard's 'Proposed style
# rules' section — accepted rules move to prompts/payments/style_rules.yaml.
- date: '2026-07-15'
  rule: When naming an individual on first reference, include their title immediately
    before their name as part of the name construction — e.g. 'chancellor Rachel Reeves'
    rather than 'Rachel Reeves, the chancellor' or 'Rachel Reeves' alone — when the
    title is needed for context.
- date: '2026-07-15'
  rule: Do not use 'The move is notable', 'The move is significant', or equivalent
    constructions that announce notability before making a substantive point. Write
    the substantive point directly.
- date: '2026-07-15'
  rule: Avoid vague temporal references such as 'earlier this year'. Use specific
    time periods (e.g. 'the last quarter of 2025 (April-June)') when referring to
    financial or business results.
- date: '2026-07-15'
  rule: When citing financial metrics such as profitability, qualify them with the
    basis of measurement in parentheses where relevant — e.g. '(based on adjusted
    Ebitda)' — so the claim is precise rather than unqualified.
