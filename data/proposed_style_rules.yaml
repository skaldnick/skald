# Proposed style rules awaiting editorial review.
# Populated automatically by tools/extract_learning.py (via GitHub Actions on push
# to data/feedback/). Review and promote/edit in the dashboard's 'Proposed style
# rules' section — accepted rules move to prompts/payments/style_rules.yaml.
- date: '2026-08-18'
  rule: In headlines, prefer a precise noun ("acquisition", "investment", "partnership")
    over the vague "deal" or "firm" when the nature of the transaction or the type
    of entity is known — eg, "Stripe agrees $7bn acquisition of AI gateway OpenRouter"
    rather than "Stripe agrees $7bn deal for AI gateway firm OpenRouter".
- date: '2026-08-18'
  rule: The standfirst must name the specific stakes or consequences of the story
    — naming the initiatives, programmes or competitive dynamics affected — rather
    than making a generic thematic claim. For example, prefer "The decline in cash
    acceptance among euro area businesses has stalled, challenging assumptions that
    underpin initiatives from Wero to the digital euro" over "Fresh survey findings
    challenge the assumption that the pandemic permanently shifted European businesses
    toward digital-only acceptance."
  supersedes: 40
- date: '2026-08-18'
  rule: When the standfirst opens without naming the organisation from the headline
    (per rule [1]), it may still use a short descriptive clause that identifies the
    action and its consequences directly. The standfirst should not be a vague scene-setter;
    it must anchor the reader in the specific development and name the affected parties
    or programmes where they add precision.
- date: '2026-08-18'
  rule: In the body, after introducing a company or product's core function, draw
    an explicit analogy to a well-known parallel where one exists — eg, "a function
    analogous to what Stripe itself does for payment methods" — to make the significance
    immediately legible to a payments-specialist audience without announcing it explicitly.
- date: '2026-08-18'
  rule: When covering a story about a company's latest move, situate it within a sequence
    of named prior actions in chronological order — eg, "The acquisition follows Stripe's
    earlier moves into AI-adjacent infrastructure, including its joint bid with Advent
    for PayPal, its partnership with AWS… and its $1 billion purchase of… in December
    2025" — rather than describing the deal in isolation.
- date: '2026-08-18'
  rule: Close the body with a forward-looking sentence that names the structural or
    competitive consequence for the European payments audience specifically, rather
    than a general observation about the industry. The final paragraph should make
    explicit who in the European market is affected and how.
- date: '2026-08-18'
  rule: Do not carry a story forward from an analysis or secondary commentary piece
    (eg, a "detailed assessment published by Global Banking & Finance Review") when
    the story is primarily a recap of existing regulation with no new primary source.
    Stories should be based on new primary data, announcements, or filings. Commentary
    and analysis pieces that restate known regulatory timelines without new information
    should be deprioritised.
- date: '2026-08-18'
  rule: Do not lead a story on a non-European market development primarily as a comparative
    lesson for European readers. If the development is relevant to a European audience,
    cover it on its own merits first. Framing the entire story as "what Europe can
    learn from X" reduces the story to an editorial opinion piece rather than a news
    item.
