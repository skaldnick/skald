# Proposed style rules awaiting editorial review.
# Populated automatically by tools/extract_learning.py (via GitHub Actions on push
# to data/feedback/). Review and promote/edit in the dashboard's 'Proposed style
# rules' section — accepted rules move to prompts/payments/style_rules.yaml.
- date: '2026-10-20'
  rule: When a parenthetical abbreviation is introduced (eg, "EU Digital Identity
    (EUDI)"), use that abbreviation on every subsequent occurrence in the same piece
    — do not revert to spelling out the full term again. The first use establishes
    the short form; all later references should use it consistently.
  supersedes: 9
- date: '2026-10-20'
  rule: When naming an individual on first reference, place the title as a prepositional
    phrase after the name — eg, "Jessica Rusu, chief data, information and intelligence
    officer at the Financial Conduct Authority (FCA)" — rather than using the possessive
    construction "the [Organisation]'s [title]". This applies particularly when the
    organisation name is long or will be abbreviated on subsequent reference.
  supersedes: 15
