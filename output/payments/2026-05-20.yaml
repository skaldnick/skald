title: OpenAI enters personal finance; Mastercard targets scam storefronts; NZ tax
  office explores open banking
social_post: OpenAI connecting ChatGPT to your bank account via Plaid is either the
  most useful or most unsettling fintech move of the year. That plus Mastercard's
  scam detection play and NZ's tax authority eyeing open banking in today's briefing.
  {link}
stories:
- headline: OpenAI connects ChatGPT to bank accounts via Plaid integration
  standfirst: OpenAI has launched a personal finance feature letting US users link
    bank accounts to ChatGPT through Plaid, marking a significant entry by a major
    AI platform into open banking-powered financial services.
  body: 'OpenAI is previewing a personal finance experience within ChatGPT that allows
    Pro subscribers to connect bank and financial accounts using Plaid''s open banking
    APIs, with Intuit support planned to follow. The feature lets users ask natural-language
    questions about their spending, balances and transactions, effectively turning
    a large language model into a financial dashboard.


    The move matters less for what it does today, which is relatively simple account
    aggregation, and more for what it signals. OpenAI is the first major generalist
    AI platform to integrate live financial data via open banking rails. That positions
    it as a potential distribution channel for financial services, sitting between
    consumers and their banks in a way that resembles third-party provider access
    under open banking frameworks but operates outside any financial regulatory perimeter.


    For European observers, the implications are worth tracking. If consumer AI assistants
    become a primary interface for financial data, the competitive dynamics of open
    banking shift considerably. Banks and fintechs that have built consumer-facing
    apps may find themselves disintermediated not by another financial services firm
    but by an AI platform with hundreds of millions of users.

    '
  editorial_note: A major AI company entering financial data aggregation through open
    banking APIs is a structurally significant development for the industry, even
    though the initial launch is US-only.
  sources: '[OpenAI launches personal finance experience preview in US](https://nationaltechnology.co.uk/OpenAI_launches_personal_finance_experience_preview_in_US.php)
    — National Technology'
- headline: Mastercard launches merchant verification tool to combat fake storefronts
  standfirst: Mastercard's new Merchant Trust Services gives banks and payment providers
    tools to identify fraudulent online storefronts before they process transactions,
    addressing a growing vector for authorised and unauthorised fraud.
  body: 'Mastercard has introduced Merchant Trust Services, a product designed to
    help acquirers, issuers and payment service providers detect and block scam merchants
    operating fake online stores. The service uses Mastercard''s network data and
    risk signals to flag suspicious storefronts, aiming to intervene before consumers
    are defrauded.


    Fake merchant sites have become a significant fraud channel, often used to harvest
    card details or take payment for goods that never arrive. They sit awkwardly across
    fraud categories, sometimes resulting in chargebacks and sometimes in authorised
    push payment losses, depending on how the payment is made. For acquirers, onboarding
    fraudulent merchants creates both financial and reputational risk.


    The launch reflects a broader pattern in which card networks are extending their
    role beyond transaction processing into trust and verification infrastructure.
    As account-to-account payments grow, the absence of equivalent network-level fraud
    detection in those channels becomes more conspicuous. Mastercard is, in effect,
    reinforcing one of the card rails'' key advantages: centralised counterparty risk
    management.

    '
  editorial_note: This is a meaningful product move from Mastercard that also illuminates
    the competitive gap between card-based and account-to-account payment fraud prevention.
  sources: '[Mastercard fires shots at fake online storefronts](https://www.finextra.com/newsarticle/47784/mastercard-fires-shots-at-fake-online-storefronts)
    — Finextra'
- headline: New Zealand's tax authority commissions open banking business case
  standfirst: New Zealand's Inland Revenue has engaged open banking provider Akahu
    to build a formal business case for using open banking in tax administration,
    an early example of a government agency actively exploring open banking as public
    infrastructure.
  body: 'New Zealand''s Inland Revenue Department has contracted Akahu, the country''s
    main open banking intermediary, to develop a business case for integrating open
    banking into tax processes. The engagement follows New Zealand''s recent introduction
    of a consumer data right framework, though the country has moved cautiously on
    full open banking implementation.


    The use case is straightforward in principle: open banking connections could allow
    taxpayers to share verified income and transaction data directly with the tax
    authority, reducing manual reporting and improving accuracy. But the significance
    lies in the signal. Government agencies becoming consumers of open banking data,
    rather than just regulators of it, changes the economics and adoption dynamics
    of the ecosystem.


    For European markets, where tax authorities such as HMRC have explored similar
    ideas without committing to them, New Zealand''s approach is worth monitoring.
    If a government agency demonstrates that open banking can materially reduce administrative
    costs and improve compliance, it strengthens the case for public-sector adoption
    elsewhere and creates a new category of demand for open banking infrastructure.

    '
  editorial_note: Government agencies actively building business cases around open
    banking consumption is a relatively novel development that could reshape how open
    banking ecosystems are valued and funded.
  sources: '[NZ Inland Revenue engages external support to build case for open banking
    use](https://www.globalgovernmentfinance.com/nz-inland-revenue-akahu-open-banking-business-case-support/)
    — Global Government Finance'
- headline: TikTok pursues financial services licences in Brazil and the UK
  standfirst: TikTok is expanding its financial services ambitions with a banking
    push in Brazil and a payments licence application in the UK, testing whether social
    commerce platforms can convert vast user bases into payment volumes.
  body: 'TikTok is pursuing financial services capabilities in two major markets simultaneously.
    In Brazil, the company is building out banking features, while in the UK it is
    seeking payments authorisation, according to Retail Banker International. The
    moves follow TikTok''s established in-app commerce model in Southeast Asia, where
    TikTok Shop has already integrated payments into the social media experience.


    The UK play is particularly relevant for European payments professionals. If TikTok
    secures a payments licence, it would join a growing set of non-financial platforms,
    such as Apple and Amazon, that are embedding payment capabilities within their
    ecosystems. The difference is scale and demographics: TikTok''s user base skews
    younger and is already habituated to in-app purchasing, potentially making it
    a more natural payments environment than traditional e-commerce.


    The strategic question is whether platforms with massive consumer attention can
    capture payment flows that currently run through conventional checkout infrastructure.
    For acquirers, payment service providers and card networks, the entry of another
    platform with its own payment rails represents both a distribution opportunity
    and a competitive threat.

    '
  editorial_note: A major social media platform actively pursuing payments licences
    in the UK signals growing platform ambition in European payments, with implications
    for incumbents and regulators alike.
  sources: '[TikTok expands financial ambitions through Brazil banking push and UK
    payments play](https://www.retailbankerinternational.com/analyst-comment/tiktok-expands-financial-ambitions-brazil-uk/)
    — Retail Banker International'
