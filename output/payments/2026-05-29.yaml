title: US open banking stalls; Mouro raises $400m; ClearBank builds digital asset
  rails
social_post: 'US open banking reform has gone quiet — and the reasons matter for anyone
  watching the global regulatory map. Plus: Mouro Capital''s $400m fintech bet and
  ClearBank''s stablecoin-to-SEPA bridge. {link}'
stories:
- headline: US open banking reform stalls as CFPB retreats and banks litigate
  standfirst: The US push for mandated open banking has effectively frozen, leaving
    the market to rely on bilateral data-sharing agreements rather than regulatory
    compulsion.
  body: 'The Consumer Financial Protection Bureau''s Section 1033 rulemaking, which
    would have required US financial institutions to share consumer data with authorised
    third parties, has been suspended indefinitely. The current administration''s
    broader push to scale back the CFPB''s authority has removed the rule''s institutional
    champion, and a legal challenge from banking trade groups remains unresolved.
    No replacement framework is on the horizon.


    The practical effect is that open banking in the US will continue to develop through
    commercial arrangements such as the Financial Data Exchange rather than regulation.
    For European firms operating transatlantically, or US fintechs accustomed to working
    within mandated frameworks elsewhere, this creates a growing divergence. Europe
    is moving towards PSD3 and a formal open finance regulation; the US is moving
    in the opposite direction.


    The contrast matters beyond the US market itself. Jurisdictions that looked to
    both Europe and the US as reference models now see them pulling apart, which complicates
    any push towards cross-border interoperability in open finance.

    '
  editorial_note: A substantive Finextra analysis of why US open banking reform has
    gone quiet — relevant for European professionals tracking the global regulatory
    landscape and cross-border implications.
  sources: '[What happened to open banking reform in the US?](https://www.finextra.com/the-long-read/1664/what-happened-to-open-banking-reform-in-the-us)
    — Finextra'
- headline: Mouro Capital raises $400m for fintech fund with open banking focus
  standfirst: Santander-backed Mouro Capital has closed a $400m fund targeting AI-driven
    fintech and open banking infrastructure, signalling continued institutional appetite
    for the sector despite a quieter venture market.
  body: 'Mouro Capital, the venture firm backed by Santander, has raised $400m for
    its latest fund, with a thesis centred on AI, open banking infrastructure and
    lending challengers. The portfolio already includes positions in firms such as
    Upgrade, Creditas and Klar, and the new fund will concentrate on capital-efficient
    models in financial services.


    The raise is notable for its size and timing. Fintech venture funding has contracted
    sharply from its 2021–2022 peak, and many generalist investors have stepped back.
    A $400m commitment from a bank-affiliated vehicle suggests that strategically
    positioned capital still sees opportunity in open banking and embedded finance
    infrastructure, particularly where AI can drive underwriting or operational efficiency.


    For the European market specifically, Mouro''s continued investment in open banking
    infrastructure providers reinforces the view that the plumbing layer — APIs, data
    connectivity, identity — remains an active area of institutional interest even
    as consumer-facing fintech valuations have cooled.

    '
  editorial_note: A significant fundraise in a subdued venture market, with direct
    relevance to open banking infrastructure investment trends.
  sources: '[Mouro Capital raises $400m to target AI and FinTech plays](https://fintech.global/2026/05/28/mouro-capital-raises-400m-to-target-ai-and-fintech-plays/)
    — Fintech Global'
- headline: ClearBank Europe launches digital asset rails with SEPA instant payouts
  standfirst: ClearBank Europe's new digital asset capability bridges programmable
    stablecoin liquidity with real-time euro payouts, offering a concrete use case
    for stablecoin-fiat interoperability in cross-border settlement.
  body: 'ClearBank Europe has launched what it calls Digital Asset Rails, enabling
    programmable liquidity for cross-border settlement with round-the-clock fiat payouts
    in euro via SEPA Instant. The service is designed to let clients hold and move
    stablecoins while converting to fiat at the point of payout, removing the need
    to pre-fund accounts in destination currencies.


    This sits at the intersection of two regulatory and infrastructure trends: the
    EU''s push to make SEPA Instant the default rail, and the emerging framework for
    regulated stablecoin use in payments. ClearBank, which holds a banking licence
    in the Netherlands, is positioning itself as a bridge between digital asset settlement
    and traditional payment infrastructure.


    The practical significance is in the settlement layer. Cross-border payments remain
    expensive partly because of trapped liquidity and pre-funding requirements. If
    stablecoins can serve as a programmable intermediary that converts to fiat on
    arrival via instant payment rails, the economics of correspondent banking change.
    Whether this scales depends on regulatory clarity around stablecoin reserves and
    redemption, but ClearBank''s move is an early attempt to build the connection.

    '
  editorial_note: A tangible product development at the intersection of stablecoins
    and instant payments infrastructure — relevant to the ongoing European debate
    about payment rails modernisation.
  sources: '[ClearBank launches digital asset rails](https://www.finextra.com/pressarticle/109974/clearbank-launches-digital-asset-rails)
    — Finextra'
- headline: FCA publishes sanctions controls findings across UK financial services
  standfirst: The FCA has set out detailed good and poor practice on sanctions screening
    and compliance controls, providing a de facto benchmark for firms ahead of expected
    enforcement action.
  body: 'The Financial Conduct Authority has published findings from its review of
    sanctions systems and controls across regulated firms, identifying significant
    gaps in screening processes, governance and record-keeping. The review covers
    payment firms and e-money institutions alongside banks and asset managers, making
    it directly relevant to the payments sector.


    The findings function as a practical compliance benchmark. The FCA identifies
    specific weaknesses such as firms failing to screen against the full consolidated
    list, inadequate processes for handling partial name matches and poor documentation
    of screening decisions. For payment processors and open banking providers handling
    high transaction volumes, the operational implications are material.


    The timing is deliberate. The UK sanctions regime has expanded significantly since
    2022, and the FCA has signalled that it expects firms to have matured their controls
    accordingly. Publishing detailed good and poor practice is typically a precursor
    to enforcement — firms that cannot demonstrate alignment with this guidance will
    find it difficult to argue they were unaware of expectations.

    '
  editorial_note: Directly relevant to payment firms and open banking providers operating
    under FCA supervision — functions as a compliance roadmap with enforcement implications.
  sources: '[Sanctions systems and controls in our firms: our findings](https://www.fca.org.uk/publications/good-and-poor-practice/sanctions-systems-and-controls-our-firms-our-findings)
    — FCA'
- headline: Paytm invests further €9m in Luxembourg subsidiary ahead of European launch
  standfirst: India's largest mobile payments firm has injected another €9m into its
    Luxembourg entity, confirming its intent to build a European payments operation
    from a euro-area base.
  body: 'Paytm has made a further €9m capital injection into its Luxembourg subsidiary,
    One 97 Europe Payments S.A., as it prepares to launch payment services in Europe.
    The investment follows earlier capitalisation of the entity and indicates that
    Paytm''s European ambitions remain active despite the company''s well-documented
    regulatory challenges in its home market.


    Luxembourg''s role as a licensing gateway into the EU single market makes it a
    natural base for non-European payment firms seeking passporting rights. Paytm
    joins a growing list of Asian payment platforms, such as PhonePe, that have established
    European subsidiaries in recent months. The pattern suggests that major emerging-market
    payment firms see Europe as a strategically important market, likely driven by
    diaspora remittance corridors and merchant services for cross-border commerce.


    The size of the investment is modest by European standards, but the signal matters.
    It confirms that Paytm is building operational capability rather than simply holding
    a dormant entity, and it adds another non-European competitor to an already crowded
    licensing pipeline.

    '
  editorial_note: A concrete step in the ongoing trend of Asian payment platforms
    establishing European operations — relevant to competitive dynamics and regulatory
    pipeline.
  sources: '[Paytm injects further €9m into Luxembourg subsidiary](https://www.luxtimes.lu/businessandfinance/paytm-injects-further-9m-into-luxembourg-subsidiary/153768732.html)
    — Luxembourg Times'
