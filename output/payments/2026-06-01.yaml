title: TrueLayer acquires In3; Visa counters sovereignty push; BIS tests LEIs in open
  finance
social_post: TrueLayer buying a BNPL provider is the clearest sign yet that open banking
  platforms need credit to compete at checkout. Plus Visa's €500m sovereignty play
  and BIS testing LEIs across borders. {link}
stories:
- headline: TrueLayer acquires Dutch BNPL firm to add credit at checkout
  standfirst: The acquisition of In3 signals that open banking payment networks now
    see embedded credit as essential to competing with cards at the point of sale.
  body: 'TrueLayer has acquired In3, a Dutch consumer credit fintech that offers buy
    now, pay later via bank payments. The company confirmed that BNPL will be its
    first credit product, with longer-term lending to follow. The deal gives TrueLayer
    something its pay-by-bank rails have lacked: the ability to offer deferred payment
    alongside instant debit at checkout.


    This is a strategically significant move for the account-to-account payments sector.
    Pay-by-bank networks have long struggled to match the consumer appeal of card-based
    checkout, where credit is built into the product. By combining open banking initiation
    with a credit layer, TrueLayer is attempting to close that gap directly rather
    than relying on merchants or third parties to bolt on financing.


    The acquisition also reflects broader consolidation pressure. Open banking infrastructure
    providers that launched as pure-play data or payment initiation firms are finding
    that the economics of initiation alone are thin. Adding credit, which carries
    margin and deepens the merchant relationship, is a logical next step. Whether
    TrueLayer can underwrite effectively in a regulated credit market will be the
    harder question.

    '
  editorial_note: This is the most consequential European open banking story of the
    day — it marks a structural shift in how account-to-account payment platforms
    compete with cards.
  sources: '[TrueLayer buys fintech In3, offering users debit and credit at checkout](https://www.finextra.com/pressarticle/109975/truelayer-buys-fintech-in3-offering-users-debit-and-credit-at-checkout)
    — Finextra | [TrueLayer adds split-payment capabilities with In3 acquisition](https://www.fintechfutures.com/m-a/truelayer-acquires-in3)
    — FinTech Futures'
- headline: Visa pledges €500m European investment as sovereignty debate intensifies
  standfirst: Visa's commitment to build local data processing infrastructure in Europe
    is a direct response to growing political pressure to reduce dependence on US
    payment networks.
  body: 'Visa has announced plans to invest €500 million in Europe, including the
    construction of a new local data processing centre. The move is explicitly framed
    as a response to the payments sovereignty debate that has gathered pace across
    the continent, with policymakers from the ECB and national central banks increasingly
    vocal about reducing reliance on non-European schemes.


    The timing is pointed. Just days after the Bank of Finland framed European payment
    autonomy as a geopolitical imperative, and with Wero and other domestic alternatives
    gaining political backing, Visa is positioning itself as a partner rather than
    a dependency risk. A local data processing centre addresses one of the most concrete
    sovereignty concerns: that European transaction data is routed through and stored
    on US infrastructure.


    Whether this mollifies policymakers remains to be seen. The sovereignty push is
    not primarily about data localisation — it is about control over payment infrastructure
    and the economic rents that flow from it. Visa''s investment buys goodwill, but
    it does not change the fundamental dynamic that transaction economics on European
    card payments flow to two US companies. For Wero and EPI backers, that structural
    argument persists regardless of where Visa puts its servers.

    '
  editorial_note: This directly advances the European payments sovereignty story,
    which is one of the defining strategic themes of 2026, and offers a concrete corporate
    response to political pressure.
  sources: '[As European payments sovereignty debate rages, Visa makes its case for
    place on continent](https://www.finextra.com/newsarticle/47831/as-european-payments-sovereignty-debate-rages-visa-makes-its-case-for-place-on-continent)
    — Finextra'
- headline: BIS and GLEIF prototype uses LEIs to streamline cross-border open finance
  standfirst: A joint BIS-GLEIF prototype demonstrates that legal entity identifiers
    embedded in open banking APIs can materially reduce KYC friction for SMEs making
    cross-border payments and opening foreign accounts.
  body: 'The Bank for International Settlements and the Global Legal Entity Identifier
    Foundation have built a working prototype showing how LEIs can be integrated into
    open banking and open finance APIs. The proof of concept focuses on two use cases:
    cross-border payment initiation and remote business account opening, both for
    SMEs. The core proposition is that a verified LEI, carried within the API call,
    reduces the need for duplicative KYC and anti-money laundering checks at each
    counterparty.


    This is a practical step in a problem that has resisted easy solutions. Cross-border
    SME payments remain disproportionately expensive and slow, largely because of
    compliance friction rather than technical limitations. If LEIs can serve as a
    portable, machine-readable trust anchor across jurisdictions, they could reduce
    the manual verification that inflates costs and processing times.


    The prototype sits alongside the BIS''s broader work on cross-border tokenisation,
    reported earlier this week. Together, they suggest the BIS is systematically testing
    the building blocks of a more interoperable cross-border payments architecture,
    with open finance APIs and standardised identifiers as complementary layers. Whether
    banks and fintechs adopt LEIs at sufficient scale to make this work commercially
    is the open question; LEI uptake among SMEs has historically been low, driven
    largely by regulatory mandates rather than voluntary adoption.

    '
  editorial_note: This advances the BIS cross-border work covered earlier in the week
    and introduces a concrete mechanism — LEIs in open finance APIs — that could have
    practical implications for European SME payments.
  sources: '[BIS and GLEIF team on LEIs in cross-border open finance prototype](https://www.finextra.com/pressarticle/109982/bis-and-gleif-team-on-leis-in-cross-border-open-finance-prototype)
    — Finextra'
