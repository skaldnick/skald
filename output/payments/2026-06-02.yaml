title: Mastercard joins TIPS pilot; OpenPayd eyes Nasdaq; NatWest automates invoice
  finance
social_post: Mastercard plugging into the ECB's cross-currency instant payments pilot
  is quietly significant — a card network embedding itself in account-to-account rails.
  Plus OpenPayd's SPAC route to Nasdaq and NatWest's open finance play. {link}
stories:
- headline: Mastercard joins ECB's cross-currency instant payments pilot on TIPS
  standfirst: The card network's participation in a central bank pilot for cross-currency
    instant settlement on TIPS signals its intent to compete on account-to-account
    rails, not just card ones.
  body: 'Mastercard is working with Danmarks Nationalbank and Sveriges Riksbank on
    a pilot to enable instant cross-currency payments via the ECB''s Target Instant
    Payment Settlement platform. The pilot connects Danish krone and Swedish krona
    payments through TIPS, which until now has handled only euro-denominated instant
    transfers. Mastercard''s role involves providing FX settlement capability alongside
    the instant payment leg.


    The significance is less about the pilot''s immediate scope and more about what
    it reveals. A card network embedding itself into central bank instant payment
    infrastructure marks a strategic shift. Mastercard is positioning to play in account-to-account
    cross-border flows, not merely defend its card volumes against them. With the
    Instant Payments Regulation mandating euro instant payment capability across the
    EU, cross-currency extension is the logical next frontier, and Mastercard is ensuring
    it has a seat at the table.


    For European banks and payment processors, the question is whether the card networks''
    involvement in these pilots accelerates or complicates the push for domestic payment
    sovereignty. The same week Visa pledged €500m in European investment, Mastercard
    is quietly integrating into the plumbing that some policymakers hoped would reduce
    dependence on the international card schemes.

    '
  editorial_note: A card network participating in a central bank instant payment pilot
    is a genuinely consequential development for European payments strategy, intersecting
    with the sovereignty debate and the expansion of TIPS beyond the eurozone.
  sources: '[Mastercard joins Tips cross-currency pilot](https://www.finextra.com/newsarticle/47839/mastercard-joins-tips-cross-currency-pilot)
    — Finextra | [Mastercard Joins European Cross-Border Instant Payments Pilot](https://www.pymnts.com/news/cross-border-commerce/cross-border-payments/2026/mastercard-joins-european-cross-border-instant-payments-pilot/)
    — PYMNTS | [Mastercard Pilots Instant Cross-Border Payments and FX Settlement](https://www.paymentsjournal.com/mastercard-pilots-instant-cross-border-payments-and-fx-settlement/amp/)
    — PaymentsJournal'
- headline: OpenPayd pursues Nasdaq listing via $1.15bn SPAC deal
  standfirst: The UK-headquartered embedded finance infrastructure provider is targeting
    a public listing through a SPAC merger, offering a rare market test of investor
    appetite for European banking-as-a-service platforms.
  body: 'OpenPayd has announced plans to list on Nasdaq through a merger with a special
    purpose acquisition company, in a deal valuing the combined entity at approximately
    $1.15bn. The transaction includes $276m in new capital. OpenPayd provides embedded
    accounts, FX, domestic and cross-border payments, open banking connectivity and
    stablecoin on- and off-ramps to business clients.


    The listing is notable for several reasons. European embedded finance providers
    have largely remained private, funded by venture capital. OpenPayd choosing the
    SPAC route to a US exchange, rather than a conventional IPO or a London listing,
    reflects both the difficulty of European fintech IPOs and the continued pull of
    US capital markets for infrastructure-layer businesses. It also tests whether
    public market investors see banking-as-a-service as a sustainable business model
    rather than a venture-stage bet.


    For the broader sector, the deal may set a valuation benchmark. If OpenPayd successfully
    lists, it creates a public comparable for other European embedded finance and
    payments infrastructure businesses considering exits or fundraising. If it struggles
    post-listing, it may reinforce caution among investors who have already cooled
    on fintech multiples since 2022.

    '
  editorial_note: A European payments infrastructure company going public via SPAC
    is a significant capital markets event for the sector, with implications for valuation
    benchmarks and exit options across embedded finance.
  sources: '[OpenPayd to Go Public via $276M SPAC Deal, Targets Nasdaq Listing](https://www.financemagnates.com/fintech/openpayd-to-go-public-via-276m-spac-deal-targets-nasdaq-listing/)
    — Finance Magnates | [OpenPayd Targets Nasdaq Listing in $1.15 Billion Deal](https://blockster.com/openpayd-targets-nasdaq-listing-in-115-billion-deal)
    — Blockster'
- headline: NatWest automates invoice finance data collection with Validis
  standfirst: NatWest's integration of automated financial data extraction into its
    invoice finance operations shows how open finance principles are reaching beyond
    consumer payments into commercial lending workflows.
  body: 'NatWest has partnered with Validis, a financial data automation platform,
    to automate the collection of client financial data within its invoice finance
    business. The integration replaces manual processes for gathering and verifying
    the accounting data that underpins lending decisions, reducing turnaround times
    and the operational burden on both the bank and its SME clients.


    Invoice finance has historically been paper-heavy and relationship-driven, with
    lenders relying on periodic manual submissions of management accounts and aged
    debtor reports. Automating this via direct connections to clients'' accounting
    systems applies the same logic as open banking, using API-based data sharing to
    replace manual document exchange, but in a commercial lending context that open
    banking''s retail-focused APIs do not currently reach.


    This matters because it illustrates where open finance value is being realised
    today. While regulatory frameworks such as PSD3 and the EU''s open finance proposals
    are still being finalised, banks are already building automated data pipelines
    for specific commercial use cases. For fintechs selling into trade finance and
    working capital, NatWest''s move confirms demand from tier-one banks for these
    capabilities.

    '
  editorial_note: A concrete example of a major bank applying open finance logic to
    commercial lending, relevant to readers tracking where open finance delivers tangible
    value ahead of regulatory mandates.
  sources: '[NatWest works with Validis to automate financial data collection within
    invoice finance](https://www.openbankingexpo.com/news/natwest-works-with-validis-to-automate-financial-data-collection-within-invoice-finance/)
    — Open Banking Expo'
- headline: Australia's fintechs push data standards body on open finance consistency
  standfirst: Industry feedback to Australia's Data Standards Body highlights implementation
    friction that European open finance frameworks will face as they expand beyond
    banking data.
  body: 'Australian fintechs have told the country''s Data Standards Body that clarity
    and consistency in technical standards are paramount as the Consumer Data Right
    framework extends from open banking into energy and broader financial services.
    The feedback, reported by Banking Day, reflects growing frustration with inconsistencies
    across sectors that share the same underlying data-sharing framework but implement
    it differently.


    Australia''s CDR is the most advanced multi-sector open data regime in operation,
    having launched open banking in 2020, open energy in 2022 and open finance from
    2025. The implementation challenges surfacing there are directly relevant to Europe,
    where the proposed Financial Data Access framework aims to extend data-sharing
    obligations beyond payment accounts. The Australian experience suggests that technical
    interoperability across sectors is harder to maintain than establishing it within
    a single one.


    For European product teams planning for open finance, the lesson is practical:
    standards divergence across data domains creates integration costs that erode
    the theoretical benefits of a unified framework. Getting the data standards architecture
    right early is materially cheaper than retrofitting consistency later.

    '
  editorial_note: Australia's CDR is the closest working model for Europe's planned
    open finance regime. Implementation feedback from that market offers practical
    foresight for European firms preparing for FIDA.
  sources: '[Fintechs tell Data Standards Body ''clarity and consistency are paramount''](https://www.bankingday.com/fintechs-tell-data-standards-body-clarity-and-consistency-are-paramount)
    — Banking Day'
