title: Airwallex acquires; Backbase integrates; Gov.UK Pay switches
social_post: 'Thin weekend for European payments news but still worth your time: Airwallex
  buys its way into reconciliation, Backbase plugs in Mastercard Move, and Gov.UK
  Pay quietly drops Stripe for Adyen. {link}'
stories:
- headline: Airwallex acquires Leapfin to automate reconciliation for cross-border
    merchants
  standfirst: The acquisition of a revenue recognition specialist signals that cross-border
    payment providers are competing on back-office automation, not just payment rails.
  body: 'Airwallex has acquired Leapfin, a financial data automation platform focused
    on revenue recognition and reconciliation. Financial terms were not disclosed.
    Leapfin''s software automates the matching of payment transactions to accounting
    records, a process that becomes significantly more complex when merchants operate
    across currencies and payment methods.


    For Airwallex, which serves businesses making and receiving payments across multiple
    markets, the deal addresses a persistent pain point: the operational burden of
    reconciling high-volume, multi-currency transaction flows. As cross-border commerce
    scales, the gap between moving money and accounting for it accurately has become
    a competitive differentiator for payment providers.


    The acquisition follows a pattern of payments companies building out adjacent
    financial operations capabilities rather than relying solely on payment processing
    margins. Adyen, Stripe and others have made similar moves into financial automation
    tooling, reflecting that merchants increasingly evaluate payment providers on
    end-to-end workflow, not transaction cost alone.

    '
  editorial_note: Airwallex's acquisition illustrates how cross-border payment providers
    are expanding into financial operations tooling, a trend with direct relevance
    to European merchants and the firms serving them.
  sources: '[Airwallex buys financial data automation platform Leapfin](https://www.finextra.com/newsarticle/47874/airwallex-buys-financial-data-automation-platform-leapfin)
    — Finextra'
- headline: Backbase integrates Mastercard Move to bring cross-border payments into
    banking OS
  standfirst: The integration gives banks using Backbase's platform a pre-built path
    to near real-time cross-border payments, reducing the integration effort that
    has kept smaller institutions on the sidelines.
  body: 'Backbase has integrated Mastercard Move, Mastercard''s cross-border money
    movement service, into its banking operating system. The collaboration, announced
    June 8, is designed to let financial institutions offer near real-time international
    payments without building bespoke connections to Mastercard''s infrastructure.


    The move is notable less for its novelty than for what it represents about how
    cross-border payment capabilities are being distributed. Large banks have long
    had direct integrations with network services such as Mastercard Move. Embedding
    these into a banking OS platform means mid-tier and regional banks can offer comparable
    services through configuration rather than custom development.


    This fits a broader pattern in which banking platform vendors are becoming the
    primary channel through which banks access payment network capabilities, shifting
    the competitive dynamic from direct bank-network relationships to platform-mediated
    access.

    '
  editorial_note: The integration illustrates how banking OS platforms are becoming
    distribution channels for payment network services, a structural shift relevant
    to European banks evaluating their cross-border payments strategy.
  sources: '[Backbase collaborates with Mastercard to simplify cross-border payments
    for banks](https://www.finextra.com/pressarticle/110047/backbase-collaborates-with-mastercard-to-simplify-cross-border-payments-for-banks)
    — Finextra | [Mastercard Teams With Backbase to Speed Cross-Border Payments](https://www.pymnts.com/mastercard/2026/mastercard-teams-with-backbase-to-speed-cross-border-payments/)
    — PYMNTS'
- headline: Gov.UK Pay replaces Stripe with Adyen as payment processor
  standfirst: The UK government's decision to switch from Stripe to Adyen for its
    central payments platform marks a significant public-sector processor change and
    extends Adyen's open banking role on Gov.UK Pay.
  body: 'The UK Government Digital Service has confirmed that Adyen has replaced Stripe
    as the payment processor for Gov.UK Pay, the centralised platform through which
    government departments and agencies accept online payments. The switch follows
    the announcement last week that Adyen would provide open banking payment initiation
    on the platform.


    Losing a government-wide contract is a notable setback for Stripe in the UK public
    sector. Gov.UK Pay processes payments across hundreds of government services,
    from visa applications to court fees, and the contract carries both revenue and
    reputational weight. The decision to consolidate both card processing and open
    banking initiation with a single provider suggests the government is looking for
    operational simplicity as it adds new payment methods.


    For Adyen, the contract cements a meaningful position in UK public-sector payments.
    The dual role, processing card payments while also providing the open banking
    layer, gives it visibility across the full payment mix on one of the UK''s highest-profile
    digital platforms.

    '
  editorial_note: 'The processor switch adds a material new detail to last week''s
    Adyen/Gov.UK Pay story: Stripe has lost the contract entirely, not just conceded
    the open banking layer. This is a competitively significant development.'
  sources: '[Adyen wins Gov.UK Pay contract](https://www.finextra.com/newsarticle/47872/adyen-wins-govuk-pay-contract)
    — Finextra'
