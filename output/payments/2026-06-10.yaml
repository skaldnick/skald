title: Nuvei-Payoneer deal; Getnet agentic payments; Lloyds-Stripe SME push; Monzo
  credit inclusion
social_post: 'Nuvei''s $2.7bn bid for Payoneer would create a cross-border payments
  heavyweight. Plus: Santander''s Getnet accepts AI agent-initiated payments, Lloyds
  partners with Stripe for SME tools, and Monzo pilots credit for excluded borrowers.
  {link}'
stories:
- headline: Nuvei in advanced talks to acquire Payoneer for $2.7 billion
  standfirst: A deal would combine Nuvei's merchant acquiring with Payoneer's cross-border
    payout network, creating a vertically integrated competitor in a segment where
    scale increasingly determines margin.
  body: 'Nuvei, the Canadian payments processor taken private by Advent International
    in 2024, is in advanced talks to buy Payoneer in a transaction valued at approximately
    $2.7 billion, according to Reuters. The deal would marry Nuvei''s card acquiring
    and alternative payment method processing with Payoneer''s established position
    in cross-border marketplace payouts and B2B payments, particularly in emerging
    markets.


    The timing reflects continued consolidation pressure in cross-border payments.
    Payoneer has built strong distribution among freelancers, SMEs and marketplace
    sellers in regions such as South and Southeast Asia, while Nuvei''s strength lies
    in regulated verticals and ecommerce acquiring. Under Advent''s ownership, Nuvei
    has the balance sheet flexibility to pursue acquisitions that a public listing
    might have constrained.


    For European payments firms, the combination is worth watching. Payoneer holds
    licences across multiple EU jurisdictions and has been expanding its B2B accounts
    payable and receivable capabilities. A merged entity would compete more directly
    with the likes of dLocal and Adyen in emerging-market merchant services, while
    strengthening Nuvei''s cross-border treasury and payout infrastructure.

    '
  editorial_note: A $2.7bn acquisition in cross-border payments signals ongoing consolidation
    in a segment directly relevant to European processors and fintechs competing for
    the same merchant and marketplace clients.
  sources: '[Nuvei in ''advanced'' talks over $2.7bn Payoneer acquisition - Reuters](https://www.finextra.com/newsarticle/47890/nuvei-in-advanced-talks-over-27bn-payoneer-acquisition---reuters)
    — Finextra'
- headline: Santander's Getnet launches agent-initiated payment acceptance for merchants
  standfirst: Getnet is the first major bank-owned acquirer to offer merchants the
    ability to accept payments triggered by AI agents, moving agentic commerce from
    proof-of-concept to production infrastructure.
  body: 'Getnet, Santander''s global merchant payments platform, has launched capabilities
    that allow merchants to accept payments initiated by AI agents. The system enables
    an AI agent acting on behalf of a consumer or business to authenticate, authorise
    and complete a transaction without direct human intervention at the point of payment.


    This follows ING, Worldline and Mastercard''s completion of what they described
    as Europe''s first agentic payment earlier this month. Where that was a controlled
    demonstration, Getnet''s announcement positions the capability as generally available
    to its merchant base. The distinction matters: agentic commerce requires not just
    a functioning payment rail but merchant-side acceptance infrastructure, and acquirers
    are now building that layer.


    The practical implications are still emerging. Agent-initiated payments raise
    questions around authentication, liability and dispute resolution that existing
    card scheme rules were not designed for. But the pace of announcements from major
    players suggests the industry expects AI agents to become a meaningful payment
    initiation channel, and is moving to establish early positions before standards
    crystallise.

    '
  editorial_note: Getnet productising agent-initiated payments marks a step-change
    from the proof-of-concept stage, with direct relevance to European acquirers and
    scheme operators considering how to handle AI-initiated transactions.
  sources: '[Santander''s Getnet helps businesses accept agent-initiated payments](https://www.finextra.com/pressarticle/110084/santanders-getnet-helps-businesses-accept-agent-initiated-payments)
    — Finextra'
- headline: Lloyds partners with Stripe to deliver payment tools to small businesses
  standfirst: Lloyds Banking Group is embedding Stripe's payment technology into its
    SME banking proposition, a notable instance of a major high-street bank using
    a fintech's infrastructure rather than building or buying its own.
  body: 'Lloyds is working with Stripe to offer a suite of payment tools to its small
    business customers. The partnership gives Lloyds'' SME clients access to Stripe''s
    online payment acceptance, invoicing and payment link capabilities through the
    bank''s existing business banking channels.


    The move is striking for what it says about build-versus-partner decisions at
    large banks. Lloyds has 1.2 million business banking customers. Rather than develop
    proprietary merchant services or acquire a processor, it has opted to embed an
    established fintech''s stack. This mirrors a broader pattern in which banks act
    as distribution channels for specialist payment technology, accepting a platform
    role rather than attempting full vertical integration.


    For Stripe, the deal extends its reach into a segment — UK micro and small businesses
    — where bank relationships still dominate. It also follows the recent loss of
    the Gov.UK Pay contract to Adyen, making this Lloyds partnership a timely reinforcement
    of Stripe''s UK presence. The arrangement effectively turns Lloyds into a reseller,
    an increasingly common model but one that carries strategic risk if the bank''s
    payment proposition becomes dependent on a single external provider.

    '
  editorial_note: A tier-one UK bank choosing to embed Stripe rather than build its
    own SME payment tools illustrates a structural shift in how banks approach payment
    services, with implications for the competitive dynamics between banks and fintechs.
  sources: '[Lloyds deliver new payment tech to SMEs in partnership with Stripe](https://www.finextra.com/newsarticle/47883/lloyds-deliver-new-payment-tech-to-smes-in-partnership-with-stripe)
    — Finextra'
- headline: Monzo and Fair4All Finance pilot credit card for financially excluded
    borrowers
  standfirst: Monzo's Flex Build card, developed with Fair4All Finance, targets consumers
    locked out of mainstream credit, testing whether a digital bank can serve this
    segment profitably where traditional lenders have retreated.
  body: 'Monzo has launched a pilot credit product called Flex Build, developed in
    partnership with Fair4All Finance, aimed at consumers who cannot access standard
    credit cards. The product is designed as a credit-building tool with lower limits
    and structured repayment, intended to help users establish or repair a credit
    history.


    The pilot sits at the intersection of two regulatory priorities: financial inclusion
    and the FCA''s broader push toward open finance as a mechanism for better lending
    decisions. Monzo''s existing use of transaction data and open banking feeds to
    assess affordability gives it a potential advantage in underwriting borrowers
    that traditional credit scoring would reject. Whether that translates into sustainable
    unit economics at scale is the open question.


    Fair4All Finance, which uses dormant assets funding to support financial inclusion,
    has backed similar initiatives before, but this is its most prominent partnership
    with a digital bank. The product''s success or failure will be closely watched
    as a signal of whether fintechs can profitably serve excluded segments, or whether
    inclusion remains dependent on subsidy.

    '
  editorial_note: This pilot connects financial inclusion, open banking-enabled underwriting
    and digital bank strategy in a way that is directly relevant to the FCA's open
    finance agenda and the broader question of who serves credit-excluded consumers.
  sources: '[Monzo and Fair4All Finance pilot Flex Build card for excluded borrowers](https://www.electronicpaymentsinternational.com/news/monzo-and-fair4all-finance-pilot-flex-build-card-for-excluded-borrowers/)
    — Electronic Payments International'
