title: Rabobank migrates iDEAL to Wero; VoP delays raise fraud concerns; Swiss open
  finance expands
social_post: 'Rabobank migrating iDEAL to Wero is one of the first real tests of whether
  EPI can absorb a dominant national scheme. Plus: VoP delays and their fraud consequences,
  and Switzerland quietly extending open finance into pensions. {link}'
stories:
- headline: Rabobank begins migrating iDEAL to Wero in major test for EPI
  standfirst: One of the Netherlands' largest banks is shifting its iDEAL payment
    traffic onto the European Payments Initiative's Wero platform, providing the first
    significant test of whether EPI can absorb a dominant national payment scheme
    at scale.
  body: 'Rabobank has selected ACI Worldwide to power its migration of iDEAL transactions
    to Wero, the account-to-account instant payment system backed by EPI. iDEAL processes
    the vast majority of Dutch e-commerce payments, making this one of the highest-volume
    national schemes to move onto Wero''s rails.


    The migration matters beyond the Netherlands. EPI''s strategy depends on persuading
    banks to replace entrenched domestic schemes with a pan-European alternative.
    iDEAL is a strong brand with near-universal adoption among Dutch consumers and
    merchants, so Rabobank''s willingness to migrate is a meaningful signal of confidence.
    If the transition goes smoothly, it strengthens EPI''s case to banks in other
    markets still weighing the costs of switching.


    ACI''s role as the processing layer for both this migration and EPI''s broader
    merchant acceptance infrastructure, announced last week, positions it as a central
    piece of Wero''s technical stack. The practical question now is execution: whether
    Rabobank can move high-volume, low-friction payment flows onto a new platform
    without disrupting merchants or consumers.

    '
  editorial_note: This is a concrete step in EPI's strategy of absorbing national
    payment schemes — the first major bank publicly migrating a dominant domestic
    scheme to Wero, which tests a thesis the industry has been debating for years.
  sources: '[ACI Worldwide Powers Rabobank''s Wero Instant Payments, Advancing Europe''s
    Real-Time Payments Transformation](https://www.stocktitan.net/news/ACIW/aci-worldwide-powers-rabobank-s-wero-instant-payments-advancing-8hlk8ougsnvl.html)
    — Stock Titan | [Rabobank taps ACI Worldwide for Wero instant payments migration](https://www.streetinsider.com/Corporate%2BNews/Rabobank%2Btaps%2BACI%2BWORLDWIDE%2Bfor%2BWero%2Binstant%2Bpayments%2Bmigration/26649484.html)
    — StreetInsider | [ACI Worldwide Powers Rabobank''s Wero Instant Payments](https://finance.yahoo.com/markets/currencies/articles/aci-worldwide-powers-rabobank-wero-050000549.html)
    — Yahoo Finance'
- headline: Verification of payee delays leave European instant payments exposed to
    fraud
  standfirst: Uneven implementation of verification of payee across European banks
    is creating a window for APP fraud to accelerate alongside the instant payments
    mandate, according to analysis by FinTech Global.
  body: 'As the SEPA instant payments regulation pushes all euro-denominated credit
    transfers towards real-time settlement, the accompanying requirement for verification
    of payee is not keeping pace. FinTech Global reports that many banks have yet
    to implement the name-matching checks that are intended to catch misdirected or
    fraudulently initiated payments before funds move irrevocably.


    The gap is not hypothetical. The UK''s experience with Faster Payments demonstrated
    that speed without pre-transaction verification creates fertile ground for authorised
    push payment fraud. European regulators included VoP in the instant payments regulation
    precisely to avoid repeating that pattern, but staggered compliance timelines
    mean some banks will be sending instant payments without the corresponding safeguard.


    For payment service providers and their fraud teams, the practical implication
    is that the risk window is now, during the transition period when instant settlement
    is live but VoP coverage remains patchy. Banks that have implemented VoP will
    bear a disproportionate share of the friction, while those that have not may inadvertently
    facilitate fraud flows across the network.

    '
  editorial_note: This connects two threads the audience is tracking — the instant
    payments mandate and APP fraud — and highlights a specific operational gap that
    has practical consequences for banks and PSPs right now.
  sources: '[VoP delays: the fraud risks banks can''t ignore](https://fintech.global/2026/06/16/vop-delays-the-fraud-risks-banks-cant-ignore/)
    — FinTech Global'
- headline: BLIK positions itself as Europe's payment sovereignty model ahead of EPI
    expansion
  standfirst: Poland's BLIK, which now handles the majority of domestic digital payments,
    is being held up as a template for how national payment schemes can coexist with
    — or resist — pan-European alternatives.
  body: 'Disruption Banking profiles BLIK''s trajectory from a bank-consortium mobile
    payment tool to a system that dominates Polish e-commerce and peer-to-peer transfers,
    processing volumes that dwarf card-based alternatives in its home market. The
    piece positions BLIK alongside the digital euro and Wero as competing visions
    for European payment sovereignty.


    BLIK''s relevance beyond Poland lies in the strategic question it poses for EPI.
    Where Wero''s model requires national schemes to be absorbed into a single European
    brand, BLIK demonstrates that a domestically owned, bank-backed system can achieve
    near-universal adoption without pan-European ambitions. For Polish banks evaluating
    whether to join Wero, BLIK''s dominance makes the cost-benefit calculation different
    from markets with weaker national alternatives.


    The tension between national success and European integration is not new, but
    it is sharpening as Wero signs up banks and the digital euro moves towards a potential
    launch. Markets with strong domestic schemes — Poland, the Netherlands, the Nordics
    — will be the hardest for any pan-European system to penetrate, and BLIK''s example
    will inform how those negotiations play out.

    '
  editorial_note: This illuminates a structural tension in European payments strategy
    — between national scheme success and pan-European consolidation — that is directly
    relevant as Wero expands and the digital euro progresses.
  sources: '[Can BLIK Make Poland Europe''s Payment Sovereignty Champion?](https://www.disruptionbanking.com/2026/06/16/can-blik-make-poland-europes-payment-sovereignty-champion/)
    — Disruption Banking'
- headline: Switzerland extends open finance framework to cover pension data
  standfirst: Swiss financial infrastructure body SFTI has published a standard for
    digital pension certificates, expanding the country's open finance protocols into
    retirement savings for the first time.
  body: 'The Swiss Financial Technology Innovations association has introduced a new
    standard enabling digital exchange of pension certificate data, covering both
    vested benefits and Pillar 3a retirement accounts. The framework builds on Switzerland''s
    existing open finance technical standards, extending API-based data sharing from
    banking and investment accounts into the pension system.


    Switzerland has pursued open finance through industry-led standardisation rather
    than regulatory mandate, an approach that contrasts with the EU''s legislative
    path under PSD2 and the forthcoming financial data access regulation. Adding pensions
    to the scope is a practical test of whether voluntary standards can drive adoption
    in sectors where data portability has traditionally been minimal.


    For the broader European market, the Swiss move illustrates where open finance
    is heading once the initial focus on payment accounts and transaction data matures.
    Pensions, insurance and investment data are the next frontier, and Switzerland
    is among the first jurisdictions to publish concrete technical standards for pension
    portability. How quickly pension providers adopt the standard will indicate whether
    industry-led approaches can match the pace of regulation-driven ones.

    '
  editorial_note: This is a concrete expansion of open finance into pensions — a sector
    widely discussed as the next phase but where few jurisdictions have published
    actual standards. It offers a useful reference point for the EU's own open finance
    trajectory.
  sources: '[Switzerland Introduces New Standard for Digital Pension Certificates](https://fintechnews.ch/roboadvisor_onlinewealth/swiss-digital-pension-certificate-vvs-sfti/84186/)
    — Fintech News Switzerland'
- headline: EBAday poll finds 78% back data sharing as top fraud defence
  standfirst: A live poll at this week's EBAday conference showed overwhelming support
    among payments executives for cross-institutional data sharing as the most effective
    fraud mitigation tool, reinforcing pressure for regulatory frameworks that enable
    it.
  body: 'At EBAday 2026 in Barcelona, 78% of attendees polled identified data sharing
    between financial institutions as the most effective approach to strengthening
    fraud risk mitigation. The poll was conducted during afternoon sessions focused
    on actionable fraud management and payments technology.


    The result aligns with a direction regulators are already moving. The EU''s forthcoming
    payment services regulation includes provisions for fraud-related data sharing,
    and industry bodies such as the Euro Banking Association have been advocating
    for frameworks that allow banks to pool signals without falling foul of data protection
    rules. The gap between consensus and implementation remains wide, however. GDPR
    constraints, competitive sensitivities and inconsistent technical standards continue
    to slow progress.


    A conference poll is not a market study, but the strength of the consensus among
    a senior payments audience is notable. It suggests the industry has moved past
    debating whether data sharing is desirable and is now focused on the practical
    and legal obstacles to making it work.

    '
  editorial_note: EBAday is the EBA's flagship conference and the poll captures practitioner
    sentiment on a live policy question — how to operationalise fraud data sharing
    under the new regulatory framework.
  sources: '[EBAday 2026: 78% consider data sharing most effective way to strengthen
    fraud risk mitigation](https://www.finextra.com/newsarticle/47936/ebaday-2026-78-consider-data-sharing-most-effective-way-to-strengthen-fraud-risk-mitigation)
    — Finextra'
