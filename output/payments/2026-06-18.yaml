title: Access PaySuite acquires Ordo; BIS cross-border open finance; PayPal shuts
  VC arm
social_post: 'Ordo''s open banking tech gets a second life, the BIS prototypes cross-border
  open finance, and PayPal kills its venture unit. Today''s briefing: {link}'
stories:
- headline: Access PaySuite picks up Ordo's open banking infrastructure after Neonomics
    shutdown
  standfirst: The acquisition salvages open banking payment initiation and variable
    recurring payment technology that Neonomics abandoned less than a year after buying
    the UK fintech.
  body: 'Access PaySuite, the payments division of The Access Group, has agreed to
    acquire Ordo''s open banking infrastructure. Ordo built payment initiation and
    request-to-pay capabilities, and was among the earlier UK fintechs to develop
    variable recurring payment functionality. Neonomics, the Norwegian open banking
    firm, acquired Ordo in January 2025 as part of a UK expansion strategy but shut
    the business down roughly eight months later.


    The deal gives Access PaySuite established open banking rails to complement its
    existing billing and payment collection products, which serve sectors such as
    housing, utilities and local government. For the broader UK open banking market,
    the transaction is a small but telling data point: the technology Ordo built retains
    commercial value even after the company itself failed to survive as an independent
    entity.


    It also underlines a pattern of consolidation among smaller UK open banking firms,
    where the gap between building viable technology and building a viable business
    has proved difficult to bridge. Access PaySuite, backed by a larger enterprise
    software group, is better positioned to absorb the integration costs and find
    distribution for the product.

    '
  editorial_note: This story tracks consolidation among UK open banking providers
    and illustrates the ongoing gap between technical capability and commercial sustainability
    in the sector.
  sources: '[Access PaySuite acquires Ordo''s open banking technology infrastructure](https://www.finextra.com/newsarticle/47938/access-paysuite-acquires-ordos-open-banking-technology-infrastructure)
    — Finextra'
- headline: BIS completes Project Aperta to prototype cross-border open finance interoperability
  standfirst: The Bank for International Settlements and the UAE central bank have
    finished a prototype that links open finance networks across jurisdictions, a
    step towards making domestic data-sharing frameworks work internationally.
  body: 'Project Aperta, led by the BIS Innovation Hub and the Central Bank of the
    UAE, has completed its proof-of-concept phase. The project builds a trusted interoperability
    layer designed to connect separate national open finance frameworks, allowing
    cross-border data sharing and financial service delivery without requiring each
    jurisdiction to adopt identical standards.


    The practical problem Aperta addresses is straightforward: open finance regimes
    are proliferating, but they are being built domestically. A third-party provider
    authorised in one country cannot easily use its data access rights to serve customers
    across borders. Aperta''s approach creates a network of trust between national
    frameworks rather than attempting to harmonise them, an architecture that mirrors
    how cross-border payment systems have typically evolved.


    For European observers, the project carries direct relevance. The EU''s forthcoming
    Financial Data Access regulation will establish an open finance framework across
    the single market, but interconnection with non-EU regimes remains an open question.
    Aperta offers one model for how that might work, and the UAE''s participation
    signals that Gulf states intend to be early movers in cross-border open finance
    rather than passive adopters.

    '
  editorial_note: This BIS-led project is the most concrete attempt yet to solve the
    cross-border interoperability problem for open finance, with implications for
    how the EU's FIDA framework might eventually connect to other regimes.
  sources: '[CBUAE Completes BIS-Led Project Aperta to Advance Cross-Border Open Finance
    Interoperability](https://techafricanews.com/2026/06/17/cbuae-completes-bis-led-project-aperta-to-advance-cross-border-open-finance-interoperability/)
    — TechAfrica News | [UAE Central Bank project could cut delays for firms trading
    overseas](https://gulfnews.com/business/banking/uae-central-bank-project-could-cut-delays-for-firms-trading-overseas-1.500577128)
    — Gulf News'
- headline: PayPal shuts down venture capital arm under new CEO's restructuring
  standfirst: PayPal is closing its venture unit as CEO Enrique Lores narrows the
    company's focus amid competitive pressure and reported takeover interest.
  body: 'PayPal has confirmed it is winding down its venture capital division, a move
    that fits a broader pattern of large payment companies pulling back from strategic
    investing to concentrate on core operations. The decision comes under Enrique
    Lores, who has been reshaping PayPal since taking the CEO role, with the company
    facing intensifying competition from Apple Pay, Stripe and buy-now-pay-later providers.


    Corporate venture arms in payments have had a mixed record. At their best, they
    provide early visibility into adjacent technologies and potential acquisition
    targets. But they also consume management attention and capital that investors
    increasingly want directed at defending market share. Block scaled back similar
    activities in 2024; PayPal''s move suggests the trend is continuing.


    The closure also reflects PayPal''s changed strategic posture. The company is
    reportedly fielding takeover interest, a context in which maintaining a portfolio
    of minority stakes in startups becomes harder to justify. For the European fintech
    ecosystem, where PayPal Ventures was an occasional investor, the exit removes
    one source of late-stage funding at a time when European fintech valuations remain
    under pressure.

    '
  editorial_note: PayPal shuttering its VC arm signals a broader retreat by large
    payment companies from strategic investing, with knock-on effects for European
    fintech funding.
  sources: '[PayPal winds down venture unit](https://www.finextra.com/newsarticle/47945/paypal-winds-down-venture-unit)
    — Finextra'
- headline: Malta's MFSA sets minimum expectations for PSD3 preparedness
  standfirst: The Maltese financial regulator has published specific preparedness
    requirements for payment service providers and e-money institutions ahead of PSD3
    reauthorisation, making it one of the first national authorities to set concrete
    expectations.
  body: 'The Malta Financial Services Authority has published guidance detailing minimum
    expectations for firms preparing for PSD3 and the Payment Services Regulation.
    The requirements include steps towards reauthorisation, which payment service
    providers and e-money institutions must complete within 27 months of PSD3''s publication
    in the EU Official Journal.


    While the directive and regulation are still moving through the final stages of
    European adoption, the MFSA''s move is notable for its specificity. Most national
    competent authorities have so far limited their public communications to general
    awareness-raising. By setting out concrete preparedness steps now, Malta is signalling
    to its licensed firms — a disproportionate number of which are fintechs and e-money
    institutions that chose Malta as their EU licensing jurisdiction — that the transition
    timeline will be enforced actively.


    For firms licensed in Malta that passport across the EU, this guidance effectively
    sets the pace. Other national regulators may follow with their own preparedness
    frameworks, but the MFSA''s early move gives its supervised entities less room
    to defer planning.

    '
  editorial_note: Malta is one of the first EU member states to publish specific PSD3
    preparedness requirements, relevant because of its outsized role as a licensing
    jurisdiction for fintechs operating across Europe.
  sources: '[MFSA publishes minimum expectations on PSD3 preparedness](https://www.deloitte.com/mt/en/Industries/banking-capital-markets/perspectives/mfsa-publishes-minimum-expectations-on-psd3-preparedness.html)
    — Deloitte Malta'
- headline: Stripe and AWS build payment layer for AI agents accessing web content
  standfirst: Stripe will power payments within a new AWS Web Application Firewall
    capability that lets AI agents pay for gated content, extending the emerging infrastructure
    for autonomous agent commerce.
  body: 'Stripe is providing the payments infrastructure for a new AWS capability
    that enables AI agents to pay for access to web content on behalf of their users.
    The feature, built into the AWS Web Application Firewall, allows content owners
    and publishers to gate their material behind a paywall that AI agents can transact
    against programmatically.


    This follows Visa''s partnership with OpenAI announced last week and reflects
    a rapid build-out of the commercial plumbing needed for agentic AI. The difference
    here is the focus on content rather than consumer purchases: Stripe and AWS are
    addressing the specific problem of AI agents that need to access paywalled information
    — research, media, data — as part of completing a task for a user.


    For European payment providers, the pattern is becoming clearer. The major US
    platform and infrastructure companies are moving quickly to define how AI agents
    will authenticate, authorise and settle payments. The standards and commercial
    norms being established now will shape whether European payment methods and providers
    are included in agentic commerce flows or bypassed by them.

    '
  editorial_note: Coming days after the Visa-OpenAI announcement, this Stripe-AWS
    integration accelerates the build-out of agentic payment infrastructure, a trend
    European payments firms need to track closely.
  sources: '[Stripe and AWS enable AI agent payments for content owners and publishers](https://www.finextra.com/newsarticle/47940/stripe-and-aws-enable-ai-agent-payments-for-content-owners-and-publishers)
    — Finextra'
