title: Cipollone on digital euro; UK regulators bill; Deluxe acquires Celero
social_post: 'ECB''s Cipollone makes the case for a digital euro that complements
  private payments. Plus: UK Lords flag risks in regulators bill, and Deluxe bets
  $625m on SME payments. {link}'
stories:
- headline: Cipollone sets out ECB's case for digital euro as complement to private
    payments
  standfirst: A new speech from the ECB executive board member responsible for the
    digital euro project articulates the central bank's positioning as it prepares
    for a possible political green light.
  body: 'Piero Cipollone, the ECB executive board member overseeing the digital euro
    programme, published a speech on June 18 laying out the rationale for a public
    digital currency alongside private payment solutions. The speech, titled "Digital
    euro: the future of money," arrives as the ECB''s preparation phase continues
    and the European Parliament and Council weigh the legislative proposal.


    The timing is notable. With EPI''s Wero rolling out across several markets and
    the instant payments regulation now in force, the speech positions the digital
    euro not as a competitor to private-sector schemes but as a foundational layer
    that ensures public money remains usable in a digital economy. For payments executives
    tracking the interplay between Wero, card schemes and a potential CBDC, the framing
    matters: the ECB is signalling continuity of its political case even as private
    alternatives gain traction.


    The full text, published as a PDF on the ECB''s website, is worth reading directly
    for its treatment of merchant acceptance obligations and offline functionality,
    both of which carry significant implications for scheme design and distribution
    models.

    '
  editorial_note: Cipollone's speech is primary-source material from the ECB official
    steering the digital euro, arriving at a moment when the project's relationship
    to private payment schemes is under active debate.
  sources: '[Digital euro: the future of money](https://www.ecb.europa.eu//press/key/date/2026/html/ecb.sp260618~da08e71469.en.pdf)
    — European Central Bank'
- headline: House of Lords warns UK financial services bill could weaken regulator
    accountability
  standfirst: The upper chamber has flagged concerns that proposed reforms to the
    Payment Systems Regulator and other bodies risk diluting oversight, as the bill
    approaches its next legislative stage.
  body: 'The House of Lords has raised concerns that the UK''s financial services
    bill could weaken the accountability framework governing regulators such as the
    Payment Systems Regulator, the Financial Ombudsman Service and the Senior Managers
    and Certification Regime. The warning, reported by MLex on June 18, comes as the
    bill moves through parliamentary scrutiny.


    The PSR is already undergoing significant change. Its remit has been questioned
    since the government''s 2025 decision to fold some of its functions and the ongoing
    debate about APP fraud reimbursement rules. The Lords'' intervention adds a constitutional
    dimension: whether the bill''s reforms give ministers too much latitude to direct
    regulators without adequate parliamentary checks.


    For payments firms, the practical question is whether the PSR''s enforcement posture
    and rulemaking independence will shift as a result. Any weakening of the regulator''s
    autonomy could affect how actively it pursues interventions on interchange, scheme
    fees or fraud policy in the years ahead.

    '
  editorial_note: The UK payments regulatory landscape is in flux, and this parliamentary
    challenge to the financial services bill has direct implications for the PSR's
    future independence and remit.
  sources: '[UK financial services bill risks weakening regulators'' accountability,
    upper chamber warns](https://www.mlex.com/articles/2491178/uk-financial-services-bill-risks-weakening-regulators-accountability-upper-chamber-warns)
    — MLex'
- headline: Deluxe agrees $625 million acquisition of payment processor Celero
  standfirst: The cheque-printing company turned payments business is making its largest
    acquisition to date, deepening its position in SME payment processing in North
    America.
  body: 'Deluxe has agreed a $625 million all-cash deal to acquire Celero Commerce,
    a US-based payment processor serving small and mid-sized businesses. The acquisition,
    announced on June 19, is the most significant transaction in Deluxe''s ongoing
    pivot from its legacy cheque-printing business toward payments and data services.


    Celero processes payments for SMEs across multiple channels and verticals. For
    Deluxe, the deal brings scale in integrated payments at a time when the SME acquiring
    market is consolidating rapidly. The transaction follows a pattern seen across
    the industry: established financial services firms using M&A to build out payment
    processing capabilities rather than developing them organically.


    The $625 million price tag signals the valuations that SME payment processors
    continue to command despite broader fintech valuation compression. European observers
    will note the parallel with consolidation trends in their own markets, where acquirers
    and payment facilitators serving smaller merchants remain attractive targets.

    '
  editorial_note: A $625 million acquisition in SME payments processing reflects ongoing
    consolidation in the sector and is material for anyone tracking competitive dynamics
    in merchant acquiring.
  sources: '[Deluxe agrees $625m acquisition of payment processor Celero](https://www.finextra.com/newsarticle/47956/deluxe-agrees-625m-acquisition-of-payment-processor-celero)
    — Finextra'
- headline: Hong Kong pilots wholesale CBDC for derivatives margin in live market
  standfirst: The HKMA has moved its wholesale CBDC programme from sandbox to live
    trading, using tokenised central bank money for after-hours derivatives margin
    payments.
  body: 'The Hong Kong Monetary Authority is piloting the use of a wholesale central
    bank digital currency for advance margin payments in after-hours derivatives trading,
    marking a shift from experimental sandbox environments to a live market application.
    The pilot, reported on June 18, uses the e-HKD infrastructure developed through
    the HKMA''s earlier Project e-HKD+ work.


    The use case is specific but consequential. Derivatives margin calls outside standard
    settlement hours are a genuine pain point, and using tokenised central bank money
    to meet them addresses both timing and counterparty risk in ways that commercial
    bank money cannot easily replicate. It is one of the clearest demonstrations yet
    of a wholesale CBDC solving an identifiable market problem rather than searching
    for one.


    For European policymakers and market infrastructure operators, the Hong Kong pilot
    adds to the evidence base as the ECB and Bank of England continue their own wholesale
    CBDC explorations. The contrast with the retail digital euro debate is instructive:
    wholesale applications are advancing with less political friction and more immediate
    operational justification.

    '
  editorial_note: A wholesale CBDC pilot in a live market environment is a meaningful
    step beyond experimentation, and directly relevant to European central banks pursuing
    similar programmes.
  sources: '[Hong Kong pilots wholesale application of CBDC in a live market environment](https://www.finextra.com/newsarticle/47953/hong-kong-pilots-wholesale-application-of-cbdc-in-a-live-market-environment)
    — Finextra'
