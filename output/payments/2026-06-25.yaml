- headline: FCA signals it may facilitate open finance data sharing and AI supervision
  standfirst: The FCA's chief executive has outlined how the regulator is rethinking
    its approach for the AI era, explicitly referencing a facilitating role in open
    finance and competition law considerations for commercial variable recurring payments.
  body: 'In a speech published on June 24, FCA CEO Nikhil Rathi set out a broad agenda
    for adapting financial regulation to artificial intelligence. The most pointed
    section for the payments and open banking sector was his acknowledgement that
    the FCA has "considered the case for beneficial collaboration under competition
    law, so commercial Variable Recurring Payments can get off the ground" and that
    it is "open to other areas where we may need to play a facilitating role" in open
    finance data sharing.


    This is notable because the UK''s open finance agenda has lacked a clear regulatory
    push since the CMA''s open banking order expired. The FCA has published research
    questions on how open finance might reshape financial services market structure,
    but has not committed to a regulatory framework. Rathi''s language stops short
    of announcing one, but positions the FCA as willing to intervene where market
    coordination alone is insufficient.


    The speech also flagged the FCA''s interest in supervising AI-driven financial
    services, including agentic AI. For payments firms building AI-powered products,
    the signal is that the FCA intends to be active rather than reactive in this space.

    '
  editorial_note: The FCA publicly acknowledging a facilitating role in open finance
    and VRP competition issues is a meaningful signal for an industry that has been
    waiting for clearer regulatory direction in the UK.
  sources: '[Rethinking regulation for the age of AI](https://www.fca.org.uk/news/speeches/rethinking-regulation-age-ai)
    — FCA'
