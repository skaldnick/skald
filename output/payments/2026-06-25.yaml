title: Iceland joins TIPS; FCA rethinks AI-era regulation; Worldpay outage; PayPoint
  acquires open banking CRA
social_post: 'Iceland joins Europe''s instant payment settlement system, the FCA wants
  to rethink regulation for AI, and Worldpay goes down during England v Ghana. Today''s
  briefing: {link}'
stories:
- headline: Iceland signs up to TIPS, extending euro instant payments infrastructure
    beyond the eurozone
  standfirst: The ECB and Iceland's central bank have agreed to connect the Icelandic
    króna to TIPS from 2028, making Iceland the latest non-euro country to join Europe's
    instant settlement infrastructure.
  body: 'The agreement, announced on June 24, will allow payments in Icelandic króna
    to settle instantly in central bank money through the Eurosystem''s TARGET Instant
    Payment Settlement system. Iceland joins Denmark and Sweden, which connected to
    TIPS as part of the ECB''s cross-currency instant payments initiative launched
    earlier this month.


    The move reflects the ECB''s strategy of positioning TIPS as a pan-European settlement
    layer that extends well beyond the euro area. For Iceland, it brings domestic
    instant payments onto shared infrastructure rather than building in isolation.
    The 2028 go-live date suggests a substantial technical integration ahead, but
    the political commitment is now formal.


    The broader pattern is clear: TIPS is becoming the default instant settlement
    backbone for European currencies, euro or otherwise. Each new entrant strengthens
    the network effects that make it harder for alternative approaches to compete.

    '
  editorial_note: This extends a significant trend in European payment infrastructure
    — TIPS expanding beyond the eurozone — and follows directly from the ECB's recent
    cross-currency pilot with Denmark and Sweden.
  sources: '[Iceland joins TIPS for instant payments](https://www.ecb.europa.eu//press/pr/date/2026/html/ecb.pr260624_1~ce8e85127f.en.html)
    — European Central Bank | [Iceland to join Target Instant Payment Settlement System](https://www.finextra.com/newsarticle/47983/iceland-to-join-target-instant-payment-settlement-system)
    — Finextra'
  verification:
    verified: false
    warnings:
    - The cross-currency instant payments initiative was not what brought Denmark
      and Sweden to TIPS; they joined TIPS separately (Sweden Feb 2024, Denmark April
      2025). The cross-currency service enabling payments between their currencies
      launched later (Oct 2025, formally activated June 8, 2026).
- headline: FCA chief signals open banking collaboration and AI as priorities in regulatory
    rethink
  standfirst: The FCA has set out its thinking on how regulation must adapt to AI,
    with specific implications for open banking, open finance and competition policy.
  body: 'In a speech published on June 24, the FCA addressed how artificial intelligence
    is reshaping the case for regulatory intervention. The regulator explicitly referenced
    open banking, noting that it has "considered the case for beneficial collaboration
    under competition law, so commercial Variable Recurring Payments can get off the
    ground." That framing — treating VRP adoption as a problem partly of coordination,
    not just competition — marks a notable shift in tone.


    The speech also positioned open finance as an area where the FCA sees a facilitation
    role for itself, suggesting the regulator views data-sharing frameworks as requiring
    active stewardship rather than purely market-led development. This aligns with
    the FCA''s earlier open finance roadmap but adds specificity around AI''s intersection
    with those frameworks.


    For firms building on open banking rails or preparing for open finance requirements,
    the speech signals that the FCA is willing to flex competition norms where it
    sees coordination failures holding back adoption. That has practical consequences
    for how industry bodies and scheme operators structure VRP rollouts.

    '
  editorial_note: The FCA explicitly linking competition law flexibility to VRP adoption
    is a substantive regulatory signal, not just a restatement of existing positions.
    It matters for anyone involved in commercial VRP deployment.
  sources: '[Rethinking regulation for the age of AI](https://www.fca.org.uk/news/speeches/rethinking-regulation-age-ai)
    — FCA'
  verification:
    verified: false
    warnings:
    - Cannot verify the specific quote about 'beneficial collaboration under competition
      law' for cVRPs appears in the June 24 speech - search results show only excerpts
      on AI, agentic systems, and tokenisation, not detailed discussion of open banking
- headline: Worldpay outage disrupts UK card payments during World Cup match
  standfirst: Worldpay suffered a service outage on the evening of June 24, leaving
    some UK merchants unable to process card payments during the England v Ghana World
    Cup game.
  body: 'The outage hit pubs and retailers during a peak spending window, with reports
    of failed card transactions across multiple locations. Worldpay, owned by Global
    Payments following its 2025 acquisition from GTCR, is one of the UK''s largest
    payment processors and handles a significant share of in-store card volume.


    High-profile outages during major events expose the concentration risk inherent
    in payment processing. The UK''s reliance on a small number of acquirers and processors
    means that a single point of failure can have outsized effects on commerce. The
    incident will likely feed into ongoing industry discussions about resilience standards
    and the case for diversifying payment acceptance methods, including account-to-account
    alternatives that bypass card processing infrastructure entirely.

    '
  editorial_note: A Worldpay outage during a major national event is operationally
    significant and politically visible. It reinforces the resilience argument that
    underpins several current UK policy discussions, from UKPI to pay-by-bank adoption.
  sources: '[Worldpay suffers outage during England vs Ghana World Cup game](https://www.finextra.com/newsarticle/47988/worldpay-suffers-outage-during-england-vs-ghana-world-cup-game)
    — Finextra'
  verification:
    verified: false
    warnings:
    - Worldpay acquisition described as '2025 acquisition' but deal actually closed
      January 12, 2026—at time of outage, Global Payments owned Worldpay for ~5.5
      months
- headline: PayPoint completes AperiData acquisition to build open banking into credit
    data
  standfirst: PayPoint has completed its acquisition of AperiData, a UK credit reference
    agency with an open banking platform, following a previous strategic investment.
  body: 'The deal gives PayPoint direct ownership of a real-time credit data capability
    built on open banking rails. AperiData''s platform allows lenders and other organisations
    to access bank transaction data for affordability assessments and creditworthiness
    checks, combining traditional credit reference agency functions with open banking
    data ingestion.


    The acquisition sits within a broader consolidation pattern in the UK open banking
    data market. As open banking matures from payment initiation into data-driven
    decisioning, firms that can combine regulated credit data with real-time bank
    account information hold an increasingly valuable position. PayPoint''s move reflects
    the commercial logic of vertically integrating these capabilities rather than
    relying on third-party open banking providers.

    '
  editorial_note: This acquisition illustrates how open banking data is being absorbed
    into adjacent sectors such as credit referencing, a practical indicator of where
    open banking's commercial value is consolidating.
  sources: '[PayPoint completes AperiData acquisition to strengthen Open Banking capabilities](https://www.openbankingexpo.com/news/paypoint-completes-aperidata-acquisition-to-strengthen-open-banking-capabilities/)
    — Open Banking Expo | [PayPoint acquires Aperidata](https://www.finextra.com/newsarticle/47980/paypoint-acquires-aperidata)
    — Finextra'
  verification:
    verified: true
    warnings: []
- headline: Mastercard and PrivatBank complete Ukraine's first AI agent payment
  standfirst: Mastercard's Agent Pay product has been used to execute Ukraine's first
    payment initiated by an AI agent, extending the technology's deployment into a
    new European market.
  body: 'The transaction, completed in partnership with PrivatBank, Ukraine''s largest
    retail bank, used Mastercard''s Agent Pay framework to allow an AI agent to initiate
    and complete a payment autonomously. The announcement follows Mastercard''s earlier
    agentic payment demonstration with ING and Worldline in early June, and Visa''s
    parallel partnership with OpenAI.


    Agentic payments are moving rapidly from concept to live deployment. The pace
    of market-by-market rollouts suggests the card networks view AI-initiated transactions
    as a near-term product category rather than a long-horizon experiment. The choice
    of Ukraine, a market with high digital payment adoption driven partly by the conflict,
    underscores how agentic commerce is being tested across diverse conditions rather
    than confined to Western European pilot markets.

    '
  editorial_note: The speed at which agentic payments are moving from first European
    pilot (ING/Worldline, early June) to deployment in additional markets is notable,
    and signals this is becoming a competitive priority for the card networks.
  sources: '[Mastercard and PrivatBank complete Ukraine''s first payment executed
    by an AI agent](https://www.finextra.com/pressarticle/110244/mastercard-and-privatbank-complete-ukraines-first-payment-executed-by-an-ai-agent)
    — Finextra'
  verification:
    verified: true
    warnings: []
