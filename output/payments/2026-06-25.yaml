- headline: PSR proposes financial reporting requirements for Mastercard and Visa
  standfirst: The UK Payment Systems Regulator has opened a consultation on rules
    that would require the card schemes to submit detailed financial performance data,
    a step towards greater transparency on scheme economics.
  body: 'The PSR is consulting on proposals to mandate that Mastercard and Visa report
    financial information covering their UK operations. The move follows the regulator''s
    long-running scrutiny of card scheme and processing fees, which has already produced
    market reviews and remedies targeting interchange and scheme fee transparency.


    Requiring the schemes to report standardised financial data would give the PSR
    a more systematic view of how scheme economics are evolving, rather than relying
    on ad hoc information requests during specific reviews. For merchants and acquirers,
    the prospect of published or regulator-held data on scheme financial performance
    could shift the dynamics of fee negotiations and regulatory complaints.


    The consultation is at an early stage, and the scope of what would be reported,
    whether data would be published or held confidentially, and the compliance burden
    on the schemes are all open questions. But the direction of travel is clear: the
    PSR wants standing visibility into card scheme finances, not just periodic snapshots.

    '
  editorial_note: Structural reporting obligations on Mastercard and Visa would represent
    a step change in UK card scheme oversight, relevant to acquirers, merchants and
    the schemes themselves.
  sources: '[UK PSR proposes new reporting rules for Mastercard and Visa](https://www.msn.com/en-us/news/technology/uk-psr-proposes-new-reporting-rules-for-mastercard-and-visa/ar-AA23OZzj)
