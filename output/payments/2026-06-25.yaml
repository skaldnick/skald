title: Iceland joins TIPS; FCA rethinks AI regulation; PSR targets card scheme reporting
social_post: 'Iceland signs up for TIPS instant payments in króna. The FCA floats
  competition-law carve-outs for VRPs. And the PSR wants Visa and Mastercard to open
  up their books. Today''s briefing: {link}'
stories:
- headline: Iceland signs agreement to settle króna payments through TIPS from 2028
  standfirst: The ECB and Seðlabanki Íslands have agreed to connect Iceland's payment
    infrastructure to TIPS, extending the Eurosystem's instant settlement platform
    to a non-euro, non-EU currency for the first time.
  body: 'Iceland will become the first country outside the EU and EEA''s euro area
    to settle its domestic currency through TIPS, the Eurosystem''s instant payment
    settlement infrastructure. Under the agreement announced June 24, Icelandic króna
    payments will be settled in central bank money from 2028, alongside the euro,
    Swedish krona and Danish krone already live on the platform.


    The move reflects TIPS''s evolution from a euro-area utility into a broader European
    settlement backbone. For Iceland, it means domestic instant payments will settle
    with the finality and resilience of central bank infrastructure rather than commercial
    bank systems. ECB president Christine Lagarde framed it as reinforcing the integration
    of Europe''s financial infrastructure.


    The practical effect is that Iceland''s banks and payment providers will gain
    access to the same settlement speed and interoperability already available to
    their Nordic and European counterparts, without adopting the euro. It also strengthens
    the ECB''s position as the operator of choice for instant settlement across the
    continent, at a time when the Instant Payments Regulation is pushing mandatory
    adoption among EU payment service providers.

    '
  editorial_note: A non-EU, non-euro country connecting its domestic currency to TIPS
    is a structural expansion of the Eurosystem's reach and relevant to anyone tracking
    European instant payment infrastructure.
  sources: '[Iceland joins TIPS for instant payments](https://www.ecb.europa.eu//press/pr/date/2026/html/ecb.pr260624_1~ce8e85127f.en.html)
    — ECB | [Iceland to join Target Instant Payment Settlement System](https://www.finextra.com/newsarticle/47983/iceland-to-join-target-instant-payment-settlement-system)
    — Finextra'
  verification:
    verified: false
    warnings:
    - Headline claim 'first country outside EU and EEA eurozone' is inaccurate—Sweden
      and Denmark (both EEA but outside eurozone) already settled their currencies
      on TIPS before Iceland
- headline: FCA signals willingness to facilitate competition-law collaboration on
    open banking
  standfirst: The FCA's chief executive has publicly acknowledged the case for allowing
    beneficial collaboration under competition law to help commercial variable recurring
    payments reach scale.
  body: 'In a speech on rethinking regulation for AI, FCA chief executive Nikhil Rathi
    made a notable aside on open banking, stating the regulator has "considered the
    case for beneficial collaboration under competition law, so commercial Variable
    Recurring Payments can get off the ground." The comment, in a speech published
    June 24, suggests the FCA recognises that competitive dynamics alone may not be
    sufficient to drive adoption of commercial VRPs.


    The remark is significant because it points to a willingness to create a framework
    where competing firms can coordinate on standards, pricing or technical integration
    without falling foul of competition rules. Commercial VRPs have been live in the
    UK since Modulr''s launch under the new UKPI scheme earlier this month, but merchant
    and bank adoption remains nascent. Industry participants have repeatedly flagged
    the difficulty of achieving multilateral agreement on commercial terms without
    some form of regulatory facilitation.


    Rathi also signalled openness to a broader facilitating role on open finance data
    sharing, though without committing to specific timelines or mechanisms. For payments
    firms and banks navigating VRP strategy, the speech is the clearest indication
    yet that the FCA sees itself as an active enabler rather than a passive observer
    of commercial open banking.

    '
  editorial_note: The FCA chief executive publicly acknowledging a possible competition-law
    carve-out for VRP collaboration is a meaningful signal for firms trying to build
    commercial models around open banking payments.
  sources: '[Rethinking regulation for the age of AI](https://www.fca.org.uk/news/speeches/rethinking-regulation-age-ai)
    — FCA'
  verification:
    verified: true
    warnings: []
- headline: PSR proposes new financial reporting requirements for Mastercard and Visa
  standfirst: The UK Payment Systems Regulator has launched a consultation on requiring
    Mastercard and Visa to disclose detailed financial data, as it deepens scrutiny
    of card scheme economics.
  body: 'The PSR has proposed new reporting rules that would require Mastercard and
    Visa to provide detailed financial information about their UK operations. The
    consultation, reported on June 23, follows the regulator''s long-running market
    review of card scheme and processing fees, which found that scheme fees had risen
    significantly without clear competitive pressure.


    The proposed requirements would give the PSR regular, structured visibility into
    how the two networks generate revenue in the UK, going beyond the ad hoc information
    requests used in previous reviews. For the card schemes, this represents a shift
    toward ongoing regulatory transparency obligations of the kind more commonly associated
    with regulated utilities.


    The move sits alongside the PSR''s broader programme of work on interchange and
    scheme fees, and comes as account-to-account payment alternatives such as Wero
    and commercial VRPs position themselves as lower-cost alternatives to card rails.
    Increased transparency on card economics could sharpen the comparative case for
    these alternatives, particularly for merchants weighing the cost of acceptance.

    '
  editorial_note: Ongoing PSR scrutiny of card scheme economics is directly relevant
    to the competitive dynamics between card and account-to-account payment models
    in the UK.
  sources: '[UK PSR proposes new reporting rules for Mastercard and Visa](https://www.msn.com/en-us/news/technology/uk-psr-proposes-new-reporting-rules-for-mastercard-and-visa/ar-AA23OZzj)
    — MSN'
  verification:
    verified: false
    warnings:
    - Draft states consultation was 'reported on June 23' but PSR published the proposed
      direction on May 21, 2026, with news coverage on May 22, 2026 — the event is
      approximately one month old, not recent
- headline: PayPoint completes AperiData acquisition to build open banking credit
    data business
  standfirst: PayPoint has closed its acquisition of credit reference agency and open
    banking platform AperiData, consolidating real-time financial data capabilities
    into its payments and commerce infrastructure.
  body: 'PayPoint has completed the acquisition of AperiData, a UK-based credit reference
    agency that uses open banking data to provide real-time affordability and creditworthiness
    assessments. The deal follows a previous £1 million strategic investment and brings
    AperiData''s platform fully under PayPoint''s ownership.


    The acquisition positions PayPoint at the intersection of open banking data and
    credit decisioning, a space where demand is growing from lenders, landlords and
    regulated sectors such as gambling that require affordability checks. AperiData''s
    platform ingests bank transaction data via open banking APIs to generate credit
    scores and income verification in real time, bypassing the lag inherent in traditional
    credit bureau data.


    For the broader market, the deal illustrates how open banking is creating value
    not just in payments initiation but in the data layer that sits around it. Credit
    reference and affordability assessment represent one of the more commercially
    proven use cases for open banking data, and PayPoint''s move to own rather than
    partner suggests it sees meaningful revenue potential in this segment.

    '
  editorial_note: This acquisition is a concrete example of open banking data commercialisation
    beyond payments, showing where incumbents see growth in the UK open banking ecosystem.
  sources: '[PayPoint completes AperiData acquisition to strengthen Open Banking capabilities](https://www.openbankingexpo.com/news/paypoint-completes-aperidata-acquisition-to-strengthen-open-banking-capabilities/)
    — Open Banking Expo | [PayPoint acquires Aperidata](https://www.finextra.com/newsarticle/47980/paypoint-acquires-aperidata)
    — Finextra'
  verification:
    verified: true
    warnings: []
- headline: Worldpay outage during England World Cup match exposes processor concentration
    risk
  standfirst: A Worldpay system failure during England's World Cup match against Ghana
    left consumers unable to make card payments at pubs and retailers, highlighting
    the fragility of single-processor dependence.
  body: 'Worldpay experienced a service outage on the evening of June 24, coinciding
    with England''s World Cup group stage match against Ghana. The failure prevented
    card payments at pubs, shops and other venues during one of the highest-traffic
    periods for UK hospitality, though the duration and root cause have not yet been
    publicly disclosed.


    The timing amplified the impact and visibility of what might otherwise have been
    a routine operational incident. For merchants relying solely on Worldpay for card
    acceptance, the outage meant lost revenue during a peak trading window with no
    fallback payment rail available.


    Processor outages are not new, but they recur often enough to raise questions
    about resilience planning and the concentration of UK card acquiring through a
    small number of large processors. The incident may add weight to arguments for
    payment diversity at the point of sale, whether through multi-acquirer strategies
    or the availability of alternative rails such as account-to-account payments that
    route around card processing infrastructure entirely.

    '
  editorial_note: A high-profile processor outage during a major public event is a
    recurring prompt for discussion of payment resilience and acquirer concentration
    in the UK market.
  sources: '[Worldpay suffers outage during England vs Ghana World Cup game](https://www.finextra.com/newsarticle/47988/worldpay-suffers-outage-during-england-vs-ghana-world-cup-game)
    — Finextra'
  verification:
    verified: false
    warnings:
    - Draft states outage occurred 'June 24' but England vs Ghana match and Worldpay
      outage occurred on June 23, 2026 (Tuesday evening)
