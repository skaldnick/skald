- headline: PayPoint completes AperiData acquisition to add open banking and credit
    data
  standfirst: PayPoint has closed its acquisition of AperiData, a UK credit reference
    agency with an open banking platform, adding real-time income and expenditure
    verification to its payments and retail services business.
  body: 'The deal follows a previous £1 million strategic investment by PayPoint in
    AperiData. AperiData operates as a credit reference agency that uses open banking
    data to provide real-time affordability and creditworthiness assessments, serving
    lenders, landlords and other organisations that need to verify an applicant''s
    financial position.


    For PayPoint, the acquisition extends its capabilities beyond payment acceptance
    and retail services into data-driven financial verification. The combination of
    open banking connectivity and credit reference status is relatively unusual in
    the UK market, where most open banking platforms do not hold CRA licences. PayPoint
    has indicated that the acquisition will support its broader open banking operations,
    though specific product plans have not been detailed.


    The deal is modest in scale but illustrative of how open banking data is being
    absorbed into adjacent business lines such as credit decisioning and affordability
    checks, rather than remaining confined to payment initiation.

    '
  editorial_note: This acquisition illustrates the practical convergence of open banking
    data and credit reference services, a trend worth tracking as open finance discussions
    advance in the UK.
  sources: '[PayPoint completes AperiData acquisition to strengthen Open Banking capabilities](https://www.openbankingexpo.com/news/paypoint-completes-aperidata-acquisition-to-strengthen-open-banking-capabilities/)
    — Open Banking Expo | [PayPoint acquires Aperidata](https://www.finextra.com/newsarticle/47980/paypoint-acquires-aperidata)
