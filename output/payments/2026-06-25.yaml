title: Iceland joins TIPS; FCA on AI regulation; PayPoint's open banking acquisition;
  Worldpay outage
social_post: 'Iceland signs up for euro-area instant payments in króna. The FCA rethinks
  regulation for AI. And Worldpay went down during the World Cup. Today''s briefing:
  {link}'
stories:
- headline: Iceland signs agreement to settle króna payments through TIPS from 2028
  standfirst: The ECB and Seðlabanki Íslands have agreed to connect Iceland's króna
    to the Eurosystem's instant payment settlement infrastructure, extending TIPS
    to its second non-euro currency.
  body: 'Iceland will become the latest non-eurozone country to settle its domestic
    currency through TIPS, following Sweden''s connection of the krona in 2024. The
    agreement, announced on June 24, means payments in Icelandic króna will be settled
    instantly in central bank money from 2028.


    The move reflects a broader pattern of TIPS expanding beyond its original euro-settlement
    role into a multi-currency instant payment backbone for European countries outside
    the eurozone. For Iceland, it replaces the need to build or maintain standalone
    domestic instant payment infrastructure, instead plugging into the ECB''s existing
    platform.


    ECB president Christine Lagarde framed the agreement as reinforcing European financial
    integration. For the payments industry, the more practical signal is that TIPS
    is consolidating its position as the default settlement layer for instant payments
    across Europe, whether or not a country uses the euro.

    '
  editorial_note: TIPS expanding to another non-euro currency is a meaningful infrastructure
    development, reinforcing the system's trajectory as a pan-European settlement
    utility.
  sources: '[Iceland joins TIPS for instant payments](https://www.ecb.europa.eu//press/pr/date/2026/html/ecb.pr260624_1~ce8e85127f.en.html)
    — ECB | [Iceland to join Target Instant Payment Settlement System](https://www.finextra.com/newsarticle/47983/iceland-to-join-target-instant-payment-settlement-system)
    — Finextra'
  verification:
    verified: true
    warnings: []
- headline: FCA signals willingness to facilitate open finance collaboration under
    competition law
  standfirst: The FCA's chief executive has outlined a regulatory approach to AI that
    includes considering beneficial collaboration in open banking and open finance,
    marking a notable shift in the regulator's posture.
  body: 'In a speech published on June 24, FCA chief executive Nikhil Rathi set out
    how the regulator is rethinking its approach for an AI-driven financial services
    environment. Among several areas covered, Rathi noted the FCA has "considered
    the case for beneficial collaboration under competition law, so commercial Variable
    Recurring Payments can get off the ground" and signalled openness to playing a
    facilitating role in data sharing for open finance.


    The speech positions the FCA as actively exploring where it may need to enable
    coordination between firms rather than simply enforcing market rules. On open
    finance specifically, the regulator is asking how its introduction might reshape
    financial services sector structure, a question it plans to explore through a
    formal research agenda over the next five years.


    For payments and open banking firms, the practical implication is that the FCA
    appears willing to provide regulatory cover for the kind of industry coordination
    that VRPs and broader open finance require to scale. Whether that translates into
    concrete safe harbours or guidance remains to be seen, but the direction is clear.

    '
  editorial_note: The FCA chief executive publicly acknowledging the need for regulatory
    facilitation of open finance and VRP collaboration is a substantive policy signal
    for UK open banking participants.
  sources: '[Rethinking regulation for the age of AI](https://www.fca.org.uk/news/speeches/rethinking-regulation-age-ai)
    — FCA'
  verification:
    verified: false
    warnings:
    - verification response could not be parsed
- headline: PayPoint completes AperiData acquisition to deepen open banking and credit
    data offering
  standfirst: PayPoint has completed its acquisition of AperiData, a UK credit reference
    agency and open banking platform, building on a prior £1 million strategic investment.
  body: 'The acquisition brings AperiData''s real-time credit referencing and open
    banking data capabilities in-house at PayPoint, which has been steadily expanding
    beyond its legacy cash and bill payment network into digital services. PayPoint
    said the deal will strengthen its open banking operations and make it easier for
    client organisations to access credit and affordability data.


    The transaction is modest in scale but illustrative of a broader trend: established
    payment and financial services companies acquiring specialist open banking firms
    to integrate data-driven decisioning into their core platforms. PayPoint''s trajectory
    from a physical payment network to a digitally-enabled services business mirrors
    a wider shift across the UK payments landscape.

    '
  editorial_note: A useful example of how mid-market UK payment companies are using
    acquisitions to build open banking capabilities rather than developing them in-house.
  sources: '[PayPoint completes AperiData acquisition to strengthen Open Banking capabilities](https://www.openbankingexpo.com/news/paypoint-completes-aperidata-acquisition-to-strengthen-open-banking-capabilities/)
    — Open Banking Expo | [PayPoint acquires Aperidata](https://www.finextra.com/newsarticle/47980/paypoint-acquires-aperidata)
    — Finextra'
  verification:
    verified: true
    warnings: []
- headline: Worldpay outage during World Cup match exposes processor concentration
    risk
  standfirst: An outage at Worldpay during the England–Ghana World Cup match on June
    24 left consumers unable to make card payments at pubs and shops across the UK.
  body: 'The timing could hardly have been worse. Worldpay''s systems went down during
    a high-profile World Cup fixture, precisely the kind of peak-demand moment when
    payment reliability is most visible to consumers. Reports indicated that card
    payments failed at multiple retailers and hospitality venues, forcing customers
    to find cash or abandon transactions.


    Processor outages are not uncommon, but they tend to generate outsized public
    attention when they coincide with major events. For the payments industry, the
    incident is a reminder of the concentration risk inherent in the UK''s acquiring
    market, where a small number of processors handle the vast majority of card transaction
    volume. Any single point of failure in that chain has immediate, widespread consumer
    impact.

    '
  editorial_note: A high-profile operational failure at a major processor during a
    nationally significant event — raises persistent questions about resilience and
    concentration in UK card acquiring.
  sources: '[Worldpay suffers outage during England vs Ghana World Cup game](https://www.finextra.com/newsarticle/47988/worldpay-suffers-outage-during-england-vs-ghana-world-cup-game)
    — Finextra'
  verification:
    verified: true
    warnings: []
- headline: PSR consults on new financial reporting requirements for Mastercard and
    Visa
  standfirst: The UK Payment Systems Regulator has proposed requiring Mastercard and
    Visa to report financial data on their UK card scheme operations, extending regulatory
    oversight of scheme economics.
  body: 'The PSR''s consultation, published this week, would oblige both card schemes
    to submit financial information covering their UK operations. The regulator has
    been steadily increasing its scrutiny of scheme fees and interchange economics,
    and mandatory reporting would give it a more granular and consistent evidence
    base for future interventions.


    The proposal sits within the PSR''s broader programme of work on card fees, which
    has already produced market reviews and data collection exercises. Requiring routine
    financial reporting would formalise what has so far been an ad hoc process, giving
    the regulator standing access to the data it needs to assess whether scheme fees
    remain proportionate. For Mastercard and Visa, it represents another layer of
    UK regulatory oversight on top of the EU''s existing interchange fee regulation.

    '
  editorial_note: Formalising financial reporting obligations for the card schemes
    is a meaningful extension of PSR oversight, with direct implications for scheme
    fee economics in the UK.
  sources: '[UK PSR proposes new reporting rules for Mastercard and Visa](https://www.msn.com/en-us/news/technology/uk-psr-proposes-new-reporting-rules-for-mastercard-and-visa/ar-AA23OZzj)
    — MSN'
  verification:
    verified: true
    warnings: []
