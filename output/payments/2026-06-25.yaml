- headline: Worldline becomes first European acquirer to enable Click to Pay for recurring
    payments
  standfirst: Worldline has extended EMVCo's Click to Pay tokenisation standard to
    subscription and recurring payment flows, a first among European acquirers that
    could reduce friction and failed payments for merchants with recurring billing.
  body: 'Click to Pay replaces manual card entry with tokenised credentials stored
    across the card network, allowing consumers to check out without re-entering card
    details. Worldline''s extension of this to recurring payments means that subscribers
    and membership customers can be enrolled using Click to Pay at the point of initial
    signup, with subsequent charges processed against the stored token.


    The practical benefit for merchants is a potential reduction in involuntary churn
    caused by expired or replaced card numbers. When a consumer''s card is reissued,
    network-level tokenisation can update the credential automatically, whereas a
    merchant storing raw card numbers would face a failed payment and need to prompt
    the customer to re-enter details. This is a well-understood problem in subscription
    commerce.


    Worldline''s first-mover position among European acquirers is worth noting, though
    the competitive advantage depends on how quickly others follow. The underlying
    Click to Pay infrastructure is network-operated, so the barrier to entry for other
    acquirers is integration effort rather than proprietary technology.

    '
  editorial_note: Extending Click to Pay to recurring payments addresses a real pain
    point in subscription commerce and signals broader European acquirer adoption
    of network tokenisation.
  sources: '[Worldline brings Click to Pay to recurring payments in Europe](https://thepaypers.com/payments/news/worldline-brings-click-to-pay-to-recurring-payments-in-europe)
    — The Paypers'
