title: Iceland joins TIPS; FCA on AI and open finance; PayPoint acquires AperiData
social_post: 'Iceland''s króna will be the fifth currency on TIPS. The FCA is rethinking
  regulation for AI — and nudging open finance forward. Plus: PSR eyes new card scheme
  reporting rules and PayPoint bolts on open banking capability. {link}'
stories:
- headline: Iceland joins TIPS, bringing a fifth currency to euro instant payment
    rails
  standfirst: The ECB and Iceland's central bank have agreed to settle Icelandic króna
    instant payments through TIPS from 2028, extending the Eurosystem's infrastructure
    to a non-EU, non-euro economy.
  body: 'The króna will become the fifth currency available on TIPS, joining the euro,
    Swedish krona, Danish krone and Norwegian krone. The agreement, announced on June
    24, means Icelandic banks will be able to settle domestic instant payments in
    central bank money through shared European infrastructure rather than building
    or maintaining a standalone system.


    Iceland is not an EU member but participates in the European Economic Area. Its
    inclusion follows the pattern set by the Scandinavian central banks that connected
    their currencies to TIPS between 2024 and 2026. For the ECB, each additional currency
    reinforces TIPS as a pan-European utility rather than a eurozone-only service.
    For Iceland, it provides access to settlement infrastructure that would be disproportionately
    expensive to replicate domestically for a market of roughly 380,000 people.


    The operational go-live is set for 2028. The agreement covers settlement only;
    Icelandic payment service providers will still need to build or adapt front-end
    services to deliver instant payments to end users.

    '
  editorial_note: A non-EU currency joining TIPS is a concrete expansion of the Eurosystem's
    instant payment infrastructure beyond the eurozone, relevant to anyone tracking
    European payment consolidation.
  sources: '[Iceland joins TIPS for instant payments](https://www.ecb.europa.eu//press/pr/date/2026/html/ecb.pr260624_1~ce8e85127f.en.html)
    — European Central Bank | [Iceland to join Target Instant Payment Settlement System](https://www.finextra.com/newsarticle/47983/iceland-to-join-target-instant-payment-settlement-system)
    — Finextra'
