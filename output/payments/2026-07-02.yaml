- headline: Pay.UK introduces flexible liquidity model for Faster Payments access
  standfirst: Pay.UK's new liquidity framework for Faster Payments allows participants
    to choose how they fund settlement, removing a structural barrier that has limited
    direct access to UK instant payment rails.
  body: 'Pay.UK has launched a flexible liquidity model that gives Faster Payments
    participants a choice in how they pre-fund settlement obligations. The change
    addresses a long-standing complaint from smaller banks and non-bank payment service
    providers that the fixed liquidity requirements for direct participation were
    disproportionate to their transaction volumes, effectively forcing them to access
    the system indirectly through sponsor banks.


    The reform sits within a broader programme of infrastructure modernisation. The
    UK government''s consultation on next-generation retail payments infrastructure,
    launched in late June, and the recent launch of the UK Payments Initiative as
    a domestic alternative to card scheme rails, both depend on widening direct access
    to faster payment systems. A liquidity model that scales with a participant''s
    actual usage rather than imposing a flat requirement makes direct access commercially
    viable for a larger set of firms.


    For fintechs and challenger banks that have built their real-time payment capabilities
    through agency arrangements, the practical question is whether the new model shifts
    the economics enough to justify the operational investment of direct participation.
    The answer will vary by firm, but the structural barrier is now lower.

    '
  editorial_note: Liquidity requirements have been a persistent bottleneck for UK
    payment system access — this reform has direct implications for fintechs and smaller
    banks seeking to reduce dependence on sponsor banks.
  sources: '[Pay.UK introduces flexible liquidity model for Faster Payments access](https://www.finextra.com/)
    — referenced from previously covered list, July 1'
  verification:
    verified: true
    warnings: []
