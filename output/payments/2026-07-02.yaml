title: PSR fraud evidence; IRIS cross-border launch; Lightspark MiCA licence; Pay.UK
  liquidity model
social_post: Mandatory fraud reimbursement is actually working — PSR puts a number
  on it. Plus Greece goes cross-border on instant payments and Lightspark picks up
  Europe's first combined MiCA/EMI licence. {link}
stories:
- headline: PSR study finds mandatory reimbursement cut APP fraud losses by £73 million
  standfirst: An independent review commissioned by the Payment Systems Regulator
    provides the first quantified evidence that the UK's mandatory APP fraud reimbursement
    policy is reducing fraud, not just shifting costs.
  body: 'The PSR published findings from Frontier Economics on July 1 showing that
    authorised push payment fraud losses fell by an estimated £73 million annually
    since the mandatory reimbursement requirement took effect. The study found a 97%
    refund rate across covered transactions, suggesting the policy has created meaningful
    financial incentives for sending banks to invest in fraud prevention.


    The result complicates the narrative that had been building around reimbursement
    costs. Monzo''s 85% surge in fraud reimbursement spending, reported in May, led
    several industry voices to question whether the policy was sustainable. The Frontier
    Economics analysis suggests the regime is functioning as intended: by making banks
    bear the cost of fraud they fail to prevent, it has driven behavioural change
    in how firms screen outbound payments.


    The PSR said it would launch a consultation on the scheme''s next phase, though
    it did not specify the scope. For banks still calibrating their fraud prevention
    investment, the message is clear: the regulator now has evidence the policy works
    and is unlikely to soften its approach.

    '
  editorial_note: First hard evidence on whether the UK's APP reimbursement mandate
    is reducing fraud — a question that has been debated across the industry since
    the rules took effect.
  sources: '[Forcing banks to refund some scam victims ''cut payment fraud by £73
    million''](https://www.moneysavingexpert.com/news/2026/07/push-payment-fraud-consultation/)
    — MoneySavingExpert | [Payment fraud falls by £73m following PSR reimbursement
    scheme](https://www.regulationtomorrow.com/2026/07/payment-fraud-falls-by-73m-following-psr-reimbursement-scheme/)
    — Regulation Tomorrow | [UK Payment Fraud Drops by £73m as PSR Reimbursement Scheme
    Drives 97% Refund Rate](https://ffnews.com/news/uk-payment-fraud-drops-by-73m-as-psr-reimbursement-scheme-drives-97-refund-rate)
    — Fintech Finance News'
  verification:
    verified: true
    warnings: []
- headline: Greece's IRIS goes live with cross-border instant transfers via EuroPA
    network
  standfirst: Greek instant payment service IRIS has launched cross-border transfers
    across Europe using mobile numbers, marking the first live use of the EuroPA interoperability
    framework connecting national account-to-account schemes.
  body: 'IRIS, Greece''s domestic instant payment system, now enables cross-border
    money transfers across Europe using only the recipient''s mobile number. The service
    operates through EuroPA, a network that connects national account-to-account instant
    payment solutions such as Portugal''s MB WAY and Greece''s IRIS Payments. The
    launch follows Greece''s connection to the wider European instant payments network,
    covered on July 1.


    EuroPA sits alongside rather than within the EPI/Wero infrastructure, offering
    an alternative interoperability path for national schemes that want cross-border
    reach without full integration into EPI. For countries whose domestic instant
    payment schemes predate or sit outside EPI, this provides a route to pan-European
    reach that preserves their existing rails.


    The practical test will be volume. Cross-border person-to-person payments within
    Europe remain overwhelmingly card-based, and shifting that traffic to account-to-account
    rails requires both consumer trust and merchant acceptance that mobile-number-based
    transfers can match the convenience of existing options.

    '
  editorial_note: A concrete step in European instant payments interoperability outside
    the EPI/Wero framework — relevant to the ongoing debate about how Europe builds
    cross-border payment infrastructure.
  sources: '[IRIS launches instant cross-border money transfers across Europe using
    only mobile numbers](https://www.naftemporiki.gr/english/2131636/iris-launches-instant-cross-border-money-transfers-across-europe-using-only-mobile-numbers/)
    — Naftemporiki | [IRIS Launches Instant Cross-Border Money Transfers Across Europe
    via Mobile Numbers](https://indicator.gr/iris-launches-instant-cross-border-money-transfers-across-europe-via-mobile-numbers?amp=1)
    — Indicator'
  verification:
    verified: false
    warnings:
    - Actual IRIS launch date was June 30, 2026, not July 1 as implied by 'covered
      on July 1'
- headline: Lightspark secures Europe's first combined MiCA and e-money licence in
    Estonia
  standfirst: Lightspark Payments Europe has received both a crypto-asset service
    provider authorisation under MiCA and an electronic money institution licence
    from Estonia's financial supervisor, positioning it to offer regulated crypto
    payment services across the EU.
  body: 'Lightspark, the payments company founded by former Meta executive David Marcus,
    announced on July 2 that its European subsidiary has been authorised by Estonia''s
    Finantsinspektsioon as both a crypto-asset service provider under MiCA and an
    electronic money institution. The dual licence allows it to issue e-money and
    provide crypto-asset services from a single regulated entity, passportable across
    the EU.


    The company has been building payment infrastructure around Bitcoin''s Lightning
    Network and stablecoins. Holding both licences from a single regulator simplifies
    its ability to bridge fiat and crypto payment flows, a capability that becomes
    commercially relevant as stablecoin settlement gains traction. Mastercard''s recent
    addition of stablecoin settlement to its merchant network and the Open USD launch
    backed by Visa, Mastercard and Google both point to growing institutional demand
    for this bridging layer.


    Estonia has been among the more permissive EU member states for crypto licensing,
    though its regulator tightened requirements significantly in recent years. That
    Lightspark chose Estonia for its MiCA base suggests the jurisdiction retains advantages
    for firms seeking rapid authorisation within the new framework.

    '
  editorial_note: First combined MiCA/EMI licence signals how payment companies are
    structuring European operations to bridge fiat and crypto rails under the new
    regulatory regime.
  sources: '[Lightspark becomes first payments company in Estonia to get MiCA licence](https://www.finextra.com/pressarticle/110322/lightspark-becomes-first-payments-company-in-estonia-to-get-mica-licence)
    — Finextra'
  verification:
    verified: false
