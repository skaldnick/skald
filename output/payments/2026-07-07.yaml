title: Open banking fraud data; Yapily on Google Cloud; Montenegro instant payments
social_post: 'Open banking fraud rates are lower than cards, and now there''s data
  to prove it. Plus: Yapily lands on Google Cloud, Montenegro goes live with instant
  payments, and iFAST picks up SEPA Instant. {link}'
stories:
- headline: First open banking fraud monitor shows rates below card payment benchmarks
  standfirst: Open Banking Limited has published its inaugural Payments & Fraud Monitor,
    providing the first structured dataset comparing open banking fraud rates against
    wider UK payment channels.
  body: 'The report, released July 7, finds that fraud rates for open banking-initiated
    payments remain below those of card payments and other UK payment methods. OBL
    framed the data as evidence that the channel''s authentication model, which requires
    strong customer authentication at the point of initiation, is delivering lower
    fraud incidence even as transaction volumes grow.


    The monitor''s significance lies in what it gives the industry: a baseline. Until
    now, arguments about open banking''s relative safety have relied on anecdote or
    extrapolation from individual providers. A standardised, recurring dataset changes
    the terms of debate, particularly as pay-by-bank scales and questions about fraud
    liability intensify under the PSR''s mandatory reimbursement regime.


    For banks, fintechs and merchants evaluating pay-by-bank adoption, the monitor
    offers a reference point for risk modelling. It also strengthens the case that
    account-to-account payments carry a different, and in some respects more favourable,
    fraud profile than card-based alternatives.

    '
  editorial_note: The first structured fraud comparison between open banking and other
    UK payment channels is genuinely new data, relevant to anyone evaluating pay-by-bank
    risk.
  sources: '[Open banking fraud rates remain below wider UK payments industry benchmarks](https://www.finextra.com/pressarticle/110354/open-banking-fraud-rates-remain-below-wider-uk-payments-industry-benchmarks)
    — Finextra'
  verification:
    verified: false
    warnings:
    - Report actually published December 2025, not July 7, 2026 — approximately 7
      months old, exceeding 5-day recency threshold
- headline: Yapily deploys open banking verification for Google Cloud customers in
    Europe
  standfirst: Google Cloud will offer Yapily's bank account verification technology
    to its European customer base, embedding open banking infrastructure into the
    cloud platform's financial services tooling.
  body: 'The integration makes Yapily''s verification capabilities available across
    several European markets through Google Cloud''s ecosystem. The practical effect
    is that businesses building on Google Cloud can access bank account verification
    without sourcing and integrating a separate open banking provider.


    Distribution partnerships of this kind matter more than they appear. Open banking
    adoption has been constrained less by technology than by the friction of integration.
    Embedding verification into a platform that enterprises already use lowers that
    barrier materially. It also signals that hyperscalers see open banking data services
    as a standard component of their financial services offerings, not a niche add-on.


    For Yapily, the deal extends its reach beyond direct fintech and banking clients
    into the broader enterprise market. For the sector, it is another step toward
    open banking infrastructure becoming ambient rather than specialist.

    '
  editorial_note: A hyperscaler embedding open banking verification into its platform
    is a distribution milestone that signals normalisation of the technology in enterprise
    contexts.
  sources: '[Yapily provides bank account verification to Google Cloud customers in
    Europe](https://www.openbankingexpo.com/news/yapily-provides-bank-account-verification-to-google-cloud-customers-in-europe/)
    — Open Banking Expo'
  verification:
    verified: false
    warnings:
    - Announcement is from October 9, 2025 (9 months old), far exceeding 5-day recency
      threshold. Headline presents as current deployment without indicating age.
    - Cited source title says 'Yapily provides bank account verification to Google
      Cloud customers' but actual Open Banking Expo article is titled 'Google taps
      Yapily to power bank account verification in Europe' — no specific mention of
      'Google Cloud customers' in source
- headline: Montenegro to launch SEPA-standard instant payments on July 20
  standfirst: Montenegro will go live with instant payments on July 20, adopting SEPA
    standards despite not being an EU member state, extending the reach of Europe's
    instant payments infrastructure further into the western Balkans.
  body: 'The launch makes Montenegro one of the first non-EU western Balkan countries
    to implement instant payments aligned with SEPA standards. The system will enable
    domestic real-time transfers, with the architecture designed for future cross-border
    interoperability with the broader SEPA network.


    The move follows a pattern of SEPA-standard adoption beyond the eurozone and EU.
    Iceland''s recent connection to TIPS and Greece''s IRIS expansion to cross-border
    transfers reflect the same dynamic: Europe''s instant payments infrastructure
    is becoming a gravitational force that pulls in neighbouring economies regardless
    of EU membership status.


    For payment service providers operating across south-east Europe, Montenegro''s
    adoption creates a more uniform operating environment and reduces the patchwork
    of national payment systems that has historically complicated cross-border flows
    in the region.

    '
  editorial_note: A non-EU state adopting SEPA-standard instant payments advances
    a significant trend of Europe's payment infrastructure extending beyond the EU's
    formal borders.
  sources: '[Montenegro ready for July 20 instant payment service launch](https://seenews.com/news/montenegro-ready-for-july-20-instant-payment-service-launch-1297571)
    — SeeNews'
  verification:
    verified: false
    warnings:
    - Iceland's TIPS connection is not yet operational (effective 2028); article phrases
      it as 'recent connection' which implies operational status
    - Headline/body conflate SEPA adoption (already completed Oct 2025) with TIPS
      Clone launch (July 20, 2026)
- headline: iFAST Global Bank adds SEPA Instant as cross-border payment capability
  standfirst: Singapore-headquartered iFAST Global Bank has connected to SEPA Instant
    Credit Transfer, adding euro real-time payments to its cross-border banking proposition
    from its UK-licensed base.
  body: 'The move allows iFAST''s clients to send and receive euro payments in real
    time across the SEPA zone. The bank, which holds a UK banking licence, is positioning
    SEPA Instant as a core component of its cross-border offering for wealth management
    and corporate clients who need to move euros quickly between jurisdictions.


    The adoption is a small but telling indicator of how the SEPA Instant mandate
    is reshaping expectations. As real-time euro settlement becomes the default rather
    than the exception, banks competing for cross-border business, even those headquartered
    outside Europe, need to offer it as table stakes. The compliance deadline has
    effectively turned instant payments from a competitive differentiator into a baseline
    requirement.

    '
  editorial_note: A non-European bank adding SEPA Instant illustrates how the instant
    payments mandate is setting expectations beyond the EU's own banking sector.
  sources: '[iFAST Global Bank Expands Euro Payment Capabilities with SEPA Instant](https://uk.finance.yahoo.com/news/ifast-global-bank-expands-euro-080000156.html)
    — Yahoo Finance'
  verification:
    verified: false
    warnings:
    - The drafted story emphasizes 'wealth management and corporate clients' but the
      primary sources (May 29 and July 7, 2026 announcements) focus on 'Multi-Currency
      Business Current Account for SMEs' and 'Digital Personal Banking,' not wealth
      management as a primary driver
