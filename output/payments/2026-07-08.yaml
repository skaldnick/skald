title: Open banking fraud data; Gambling Commission acts; Yapily extends verification;
  data pricing debate
social_post: Open banking fraud rates come in below wider UK benchmarks — useful ammunition
  or a ceiling? Plus the Gambling Commission finally confirms financial risk checks,
  and the data pricing debate sharpens. {link}
stories:
- headline: Open banking fraud rates sit below wider UK payment benchmarks
  standfirst: Open Banking Limited's first payments and fraud monitor shows open banking
    fraud at roughly one in 6,000 transactions, below industry-wide rates, as payment
    volumes continue to climb.
  body: 'The monitor, published by Open Banking Limited, provides the first dedicated
    dataset on fraud within open banking payment flows. The one-in-6,000 rate compares
    favourably to broader UK payment fraud benchmarks, though OBL acknowledged a slight
    uptick in 2026 as volumes have scaled. The data covers payments initiated through
    open banking APIs and is intended to be published regularly.


    The timing matters. Open banking payments are being adopted in higher-risk contexts
    such as gambling affordability checks and government services, where fraud performance
    data has been conspicuously absent. A dedicated monitor gives the ecosystem something
    concrete to point to when regulators and merchants ask whether the channel is
    safe enough for mainstream use.


    The figures also feed into the commercial case for pay-by-bank at checkout. Card
    scheme fraud rates are well-documented; open banking has lacked an equivalent
    public benchmark. Whether one-in-6,000 holds as volumes scale further, particularly
    into e-commerce, is the question that matters next.

    '
  editorial_note: First dedicated fraud benchmark for open banking payments — fills
    an important data gap as the channel moves toward mainstream adoption.
  sources: '[Open Banking Maintains Lower Fraud Rates Than the Wider Payments Industry,
    New Monitor Shows](https://financialit.net/news/open-banking/open-banking-maintains-lower-fraud-rates-wider-payments-industry-new-monitor-shows)
    — Financial IT | [Open banking fraud rates remain below wider UK payments industry
    benchmarks](https://www.finextra.com/pressarticle/110354/open-banking-fraud-rates-remain-below-wider-uk-payments-industry-benchmarks)
    — Finextra | [Open Banking Fraud Rates Beat Industry Benchmarks Despite Rising
    Scam Sophistication](https://ffnews.com/news/open-banking-fraud-rates-beat-industry-benchmarks-despite-rising-scam-sophistication)
    — FF News'
  verification:
    verified: true
    warnings: []
- headline: Gambling Commission confirms financial risk assessments using open banking
  standfirst: The UK Gambling Commission has confirmed it will require operators to
    conduct financial risk assessments on customers, with open banking as one of the
    approved methods for data collection.
  body: 'The Commission''s announcement ends a prolonged period of industry uncertainty
    about how affordability checks will work in practice. Operators will be able to
    use open banking data or request documents directly from customers to assess financial
    risk. The largest operators will be required to implement the checks first, with
    a phased rollout to follow.


    The gambling industry has resisted financial checks for years, arguing they drive
    customers to unregulated offshore sites. Open banking has been positioned as a
    less intrusive alternative to document-based checks, since it can provide a real-time
    view of a customer''s financial position without requiring manual evidence gathering.
    The Commission''s decision to include it as an approved method validates that
    argument, at least in principle.


    How operators implement these checks will determine whether open banking''s role
    in gambling regulation is substantive or cosmetic. The consent experience, data
    scope and frequency of checks all remain to be tested at scale.

    '
  editorial_note: Resolves a long-running regulatory question and confirms open banking's
    role in a high-profile, contested use case outside mainstream payments.
  sources: '[Gambling Commission confirms introduction of financial risk assessments](https://www.gamingintelligence.com/legal/233006-uk-gambling-commission-confirms-introduction-of-financial-risk-assessments/)
    — Gaming Intelligence'
  verification:
    verified: false
    warnings:
    - Draft misleadingly presents open banking as a primary approved method; sources
      confirm it's only for ~1 in 1,000 edge cases, with credit reference data being
      the main mechanism
    - Headline claims 'confirms open banking' but sources show open banking is not
      the main implementation pathway—credit reference agencies are
- headline: Yapily extends open banking account verification to Google Cloud across
    Europe
  standfirst: Yapily has made open banking-based bank account verification available
    to Google Cloud business customers in eleven European markets, embedding financial
    data checks into cloud infrastructure.
  body: 'The integration allows Google Cloud customers to verify bank account ownership
    through open banking APIs without building direct connections to banks themselves.
    Yapily provides the connectivity layer across eleven markets, covering the major
    eurozone economies and the UK.


    The deal is less about Yapily''s product than about the distribution channel.
    Embedding open banking verification into a hyperscaler''s marketplace shifts the
    buyer from fintech teams to broader enterprise procurement. For account verification
    specifically, this positions open banking as a cloud-native utility rather than
    a specialist financial service.


    It also signals how open banking infrastructure providers are competing on distribution
    rather than connectivity alone. API coverage across European banks is increasingly
    commoditised; the differentiator is where and how easily those APIs can be consumed.

    '
  editorial_note: Shows open banking verification moving into enterprise cloud distribution
    — a meaningful shift in how the infrastructure reaches non-financial buyers.
  sources: '[Yapily expands bank account verification for Google Cloud](https://thepaypers.com/fintech/news/yapily-brings-bank-account-verification-to-google-cloud-in-europe)
    — The Paypers'
  verification:
    verified: true
    warnings: []
- headline: Paytm secures Luxembourg licence to build European payments operation
  standfirst: India's Paytm has obtained a payment institution licence from Luxembourg's
    CSSF, giving it a regulatory base to offer payment services across the European
    Economic Area.
  body: 'Paytm Europe Payments SA will use the Luxembourg licence to passport payment
    services into other EU member states. The move marks Paytm''s formal entry into
    European regulated payments, building on its domestic position as India''s largest
    digital payments platform.


    The licence is notable for what it represents about the direction of Indian fintech
    expansion. Paytm joins a growing list of non-European payment firms, such as Airwallex
    and PhotonPay, using EEA licences to access the single market. Luxembourg continues
    to be the preferred jurisdiction for these entries, given its regulatory familiarity
    with complex cross-border structures.


    Whether Paytm builds a meaningful European business or simply uses the licence
    to serve Indian diaspora and cross-border corridors remains to be seen. The licence
    itself is the enabling step, not the strategy.

    '
  editorial_note: A major Indian payments player entering European regulation signals
    continued non-European interest in the EEA payments market.
  sources: '[Paytm secures Luxembourg licence to expand European payments](https://thepaypers.com/payments/news/paytm-secures-luxembourg-licence-to-expand-european-payments)
    — The Paypers'
  verification:
    verified: false
    warnings:
    - PhotonPay does not appear to use EEA licences for EU access; search confirms
      UK FCA, Polish KNF, and UAE DFSA authorizations but no evidence of EEA passporting
      license like Airwallex
    - Paytm licence became effective July 2, 2026 (6 days old as of July 8, 2026 —
      exceeds 5-day recency threshold)
- headline: JPMorgan and Bank of America explore acquiring Fiserv's debit network
  standfirst: Two of the largest US banks are in discussions to buy Fiserv's STAR
    debit network, a move that could reshape card network ownership and competition
    in the US.
  body: 'The Wall Street Journal reported that Fiserv has held discussions with JPMorgan
    and Bank of America, among others, about a potential sale of its debit payments
    network. STAR is one of the largest PIN debit networks in the US, routing transactions
    for thousands of financial institutions.


    Bank ownership of a major debit network would represent a structural shift in
    US payments. The Durbin amendment requires merchants to have access to at least
    two unaffiliated debit networks on every card, making STAR''s routing volume commercially
    significant. If a bank-led consortium acquired it, the competitive dynamics between
    bank-owned and independent networks would change materially.


    For European observers, the deal is worth watching because it echoes the sovereignty
    and ownership debates playing out around EPI and domestic scheme alternatives
    to Visa and Mastercard. The question of who owns payment rails, and what incentives
    that creates, is not unique to Europe.

    '
  editorial_note: A potential structural shift in US debit network ownership with
    direct parallels to European debates about payment rail sovereignty.
  sources: '[JPMorgan and BofA explore acquisition of Fiserv debit network - WSJ](https://www.finextra.com/newsarticle/48052/jpmorgan-and-bofa-explore-acquisition-of-fiserv-debit-network---wsj)
    — Finextra'
  verification:
    verified: true
    warnings: []
