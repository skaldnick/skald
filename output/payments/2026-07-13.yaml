title: 'Australia expands open banking; Mastercard eyes Vocalink sale; Economist weighs
  US financial supremacy

  '
social_post: 'Australia pulls non-bank lenders into open banking from November. Meanwhile,
  Mastercard may sell its Vocalink stake just as the UK builds a domestic scheme to
  replace it. Plus: The Economist on cracks in US financial supremacy. {link}

  '
stories:
- headline: 'Australia brings non-bank lenders into open banking from November

    '
  standfirst: 'Australia''s Consumer Data Right now covers non-bank lenders, extending
    mandatory data sharing to a sector that holds a significant share of the country''s
    mortgage and consumer credit markets.

    '
  body: 'From July 13, eligible non-bank lenders in Australia must begin sharing product
    information under the Consumer Data Right (CDR) framework. Full consumer data
    sharing obligations follow from November. The expansion brings into scope a sector
    that has grown substantially since the CDR launched with the four major banks
    in 2020 and was extended to energy providers in 2022.


    The move is significant beyond Australia. European and UK policymakers wrestling
    with the scope of open finance frameworks face a similar question: whether to
    extend data-sharing obligations beyond deposit-taking institutions to non-bank
    credit providers. Australia''s phased approach, beginning with product data before
    requiring consumer-level data sharing, offers one model for managing the compliance
    burden on smaller lenders.


    For European observers, the Australian experience will be instructive on two fronts:
    whether non-bank participation meaningfully improves switching and price competition
    in lending markets, and how smaller institutions manage the technical burden of
    compliance.

    '
  editorial_note: 'Australia extending open banking to non-bank lenders is a live
    policy question in Europe and the UK under PSD3/open finance proposals. The phased
    rollout offers a useful comparison point for this audience.

    '
  sources: '[Non-bank lenders brought into <b>open banking</b> regime from November
    | Australian Broker](https://www.google.com/url?rct=j&sa=t&url=https://www.brokernews.com.au/news/breaking-news/nonbank-lenders-brought-into-open-banking-regime-from-november-289643.aspx&ct=ga&cd=CAIyGjVmNjkxZDEzNTU2NWU1MTc6Y29tOmVuOlVT&usg=AOvVaw1-KmXO63ULmfRQT2Tu890d)
