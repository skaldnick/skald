title: 'Mansion House open finance; Stripe bids for PayPal; ECB digital euro pilot

  '
social_post: 'UK chancellor commits to open finance consultation by 2027, Stripe tables
  a $53bn bid for PayPal, and the ECB names 36 providers for the digital euro pilot.
  Today''s briefing: {link}

  '
stories:
- headline: 'UK chancellor commits to open finance consultation focused on SME lending

    '
  standfirst: 'Rachel Reeves used her Mansion House speech to confirm that the government
    will consult on an open finance regulatory framework in 2027, with small business
    lending as the initial use case.

    '
  body: 'Rachel Reeves, the UK chancellor, announced plans to expand regulated data-sharing
    beyond payments accounts into a broader open finance framework, with a consultation
    now scheduled for 2027. The immediate focus is on SME lending, where standardised
    access to business financial data could reduce friction in credit decisions and
    cut the time and cost of underwriting.


    The announcement was accompanied by an expansion of the British Business Bank''s
    Growth Guarantee Scheme, positioning open finance as a tool for accelerating capital
    access rather than a purely consumer-facing initiative. Reeves framed the push
    as part of a wider competitiveness agenda for UK financial services.


    The 2027 timeline gives the FCA room to build on its existing open finance roadmap,
    published in April, which set a 2030 target for broader implementation and flagged
    investment data as an early priority. The Mansion House commitment adds political
    weight and narrows the initial scope to a use case where demand from lenders and
    small businesses is already well documented.

    '
  editorial_note: 'This is a material policy commitment from the UK chancellor, giving
    open finance a concrete timeline and political sponsorship beyond the FCA''s existing
    roadmap — a genuine advancement of the story covered in April.

    '
  sources: '[Financial and Professional Services: Mansion House Sp](https://hansard.parliament.uk/commons/2026-07-15/debates/26071525000015/FinancialAndProfessionalServicesMansionHouseSpeech)
    — Hansard'
  verification:
    verified: false
    warnings:
    - 'Story duplicates coverage from 2026-07-14 entry in previously-covered list
      (same event: Reeves'' Mansion House open finance announcement)'
    - Draft incorrectly states investment data was FCA's early priority; the roadmap
      flags SME lending and mortgages as initial high-impact priorities, with investment
      data as later priority
- headline: 'Stripe and Advent table joint bid to acquire PayPal for $53 billion

    '
  standfirst: 'A potential acquisition of PayPal by Stripe and private equity firm
    Advent International would reshape the competitive landscape for online payments
    and digital wallets globally.

    '
  body: 'Stripe and Advent International have made a joint offer to acquire PayPal
    in a deal valuing the company at more than $53 billion. PayPal has been under
    sustained pressure from investors and competitors, and its new CEO has already
    begun restructuring, shutting down the company''s venture capital arm in June.


    The combination would bring together Stripe''s developer-led merchant platform
    with PayPal''s consumer wallet, branded checkout and Venmo, creating a payments
    group with reach across both sides of the transaction. For European open banking
    and account-to-account payments providers, a consolidated Stripe-PayPal entity
    would represent a significantly more formidable competitor at checkout.


    The deal is far from certain. Regulatory scrutiny would be intense given the combined
    market share in online payments, and the valuation implies a significant premium
    to PayPal''s recent trading levels. But the approach signals that Stripe, which
    has historically grown organically, sees acquisition as necessary to compete at
    scale against card networks and emerging payment methods.

    '
  editorial_note: 'A $53 billion payments acquisition would be the largest in the
    sector''s history and has direct implications for European merchants, open banking
    providers and the competitive dynamics of online checkout.

    '
  sources: '[Stripe and Advent table bid for PayPal](https://www.finextra.com/newsarticle/48095/stripe-and-advent-table-bid-for-paypal?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: true
    warnings: []
- headline: 'ECB selects 36 payment providers for digital euro pilot phase

    '
  standfirst: 'The selection marks the first concrete step toward testing digital
    euro infrastructure with live participants, as the European Parliament advances
    its own negotiating mandate.

    '
  body: 'The ECB has named 36 payment service providers to participate in the digital
    euro''s pilot phase, covering banks, payment institutions and e-money issuers.
    The selection follows the European Parliament''s ECON committee vote in June to
    back a negotiating mandate for the digital euro regulation, which moved to a full
    Parliament vote in July.


    The pilot will test distribution, onboarding and payment flows before any political
    decision on whether to issue a digital euro. The breadth of participants, spanning
    incumbent banks and newer payment firms, is designed to test interoperability
    across different business models and technical architectures.


    The selection arrives amid ongoing debate about how a digital euro would interact
    with private-sector payment rails. Industry bodies such as the European Payments
    Initiative and open banking providers have raised concerns about the digital euro''s
    potential to crowd out commercial innovation. The ECB has positioned the currency
    as a complement to private payments, but the pilot phase will be the first practical
    test of that claim.

    '
  editorial_note: 'This is the ECB''s own announcement and advances the digital euro
    from legislative debate to practical testing with named participants — a distinct
    new phase beyond the Parliament vote already covered.

    '
  sources: '[ECB selects 36 payment service providers to join digital euro pilot](https://www.ecb.europa.eu//press/pr/date/2026/html/ecb.pr260714~8cd07d9d45.en.html)
    — ECB'
  verification:
    verified: false
    warnings:
    - Draft states ECON committee backed 'negotiating mandate' in June, but the June
      23 committee vote adopted the committee position (43-14-1); the negotiating
      mandate was formally backed by full Parliament on July 9 (416-169-22)
- headline: 'OECD publishes framework for AI deployment within open finance ecosystems

    '
  standfirst: 'The OECD''s new paper on artificial intelligence and open finance sets
    out principles for responsible AI use in data-sharing environments, as regulators
    grapple with the intersection of the two agendas.

    '
  body: 'The OECD has published a paper examining how artificial intelligence interacts
    with open finance frameworks, addressing risks around data concentration, algorithmic
    bias and consumer protection as data-sharing regimes expand. The paper aims to
    support policymakers in setting guardrails for AI innovation within regulated
    data ecosystems.


    The timing aligns with parallel moves by national regulators. The FCA published
    its own AI review in July with open finance and agentic payments explicitly in
    scope, while the Euro Banking Association mapped agentic AI''s role in open finance
    in June. The OECD paper provides an international policy layer, offering common
    principles that could shape how national frameworks evolve.


    For payments and open banking firms, the practical implications centre on how
    AI-driven decisioning, such as automated credit assessment or fraud detection
    using shared financial data, will be regulated. The paper does not prescribe specific
    rules, but its framing of responsible deployment criteria is likely to inform
    supervisory expectations across OECD member states.

    '
  editorial_note: 'The OECD paper fills a gap in the policy landscape by connecting
    AI governance directly to open finance — relevant as both the FCA and EBA have
    recently moved on the same intersection, and firms are already deploying AI on
    open banking data.

    '
  sources: '[Artificial intelligence and open finance](https://www.oecd.org/en/publications/artificial-intelligence-and-open-finance_eb511c3c-en.html)
    — OECD'
  verification:
    verified: true
    warnings: []
- headline: 'UK BNPL regulation takes effect with open banking data flagged as compliance
    edge

    '
  standfirst: 'New FCA rules requiring affordability assessments and pre-contract
    disclosures for buy now, pay later lending came into force on July 15, with industry
    voices highlighting open banking data as a differentiator for compliance.

    '
  body: 'The FCA''s buy now, pay later regulations took effect on July 15, bringing
    previously unregulated deferred-payment credit under the consumer credit regime.
    Lenders must now conduct affordability assessments, provide standardised pre-contract
    information and offer dispute resolution through the Financial Ombudsman Service.


    Industry reaction emphasised the role of real-time financial data in meeting the
    new requirements. Several commentators noted that lenders relying solely on credit
    bureau data would be working with an incomplete picture of a borrower''s financial
    position, and that open banking data, which captures income, spending patterns
    and existing commitments in near real time, offers a more accurate basis for affordability
    checks.


    The regulations apply to UK-authorised firms and cover agreements where repayment
    is deferred beyond the end of the billing period or split into instalments. The
    FCA confirmed the July 15 start date in June, giving the industry roughly three
    weeks of lead time from confirmation to go-live.

    '
  editorial_note: 'The go-live of UK BNPL regulation is a concrete regulatory event
    with direct relevance to open banking data providers, who stand to gain from new
    affordability assessment requirements — advancing the story previously covered
    at the confirmation stage.

    '
  sources: '[UK BNPL regulations come into effect: Industry reaction](https://www.retailbankerinternational.com/news/bnpl-regulations-industry-reaction/)
    — Retail Banker International'
  verification:
    verified: false
    warnings:
    - Draft states FCA confirmed July 15 start date in June giving industry 'roughly
      three weeks' notice. FCA actually confirmed the final start date in PS26/1 on
      11 February 2026, giving industry ~5 months lead time, not 3 weeks from a June
      confirmation
