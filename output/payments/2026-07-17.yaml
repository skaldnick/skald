- headline: 'Thredd joins Visa''s agentic payments programme for European issuers

    '
  standfirst: 'The issuer processor''s participation in Visa''s Agentic Ready programme
    allows European card issuers to support AI agent-initiated payments without rebuilding
    their infrastructure.

    '
  body: 'Thredd, the issuer processing platform, has joined Visa''s Agentic Ready
    programme, enabling its issuer clients across Europe to participate in agent-initiated
    payments. The integration means issuers using Thredd''s processing can accept
    payments initiated by AI agents without significant infrastructure changes.


    Agentic payments — where AI agents autonomously initiate and authorise transactions
    on behalf of consumers or businesses — have moved rapidly from concept to early
    deployment in 2026. Visa launched its agentic payments capability in Europe in
    early July, and Mastercard, ING and Worldline completed what they described as
    Europe''s first agentic payment in June. The infrastructure layer is now catching
    up: processor-level support from firms such as Thredd is necessary to move agentic
    payments from pilot to scale.


    The speed at which the card networks are building agentic ecosystems reflects
    a competitive dynamic. Both Visa and Mastercard are positioning their rails as
    the default infrastructure for AI-initiated commerce, potentially pre-empting
    account-to-account alternatives before they mature.

    '
  editorial_note: 'Advances the agentic payments story from network-level announcements
    to the processor layer, which is where practical scalability for European issuers
    is determined.

    '
  sources: '[Thredd joins Visa''s Agentic Ready programme](https://www.finextra.com/pressarticle/110439/thredd-joins-visas-agentic-ready-programme?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
