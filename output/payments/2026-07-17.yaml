- headline: 'UK chancellor announces open banking governance overhaul at Mansion House

    '
  standfirst: 'Rachel Reeves has set out changes to the Open Banking Future Entity
    and the long-term regulatory framework, signalling a shift from the current transitional
    governance arrangements.

    '
  body: 'Rachel Reeves, the UK chancellor, used her Mansion House speech on July 16
    to announce changes to the governance and regulatory framework for open banking.
    The announcements included updates to the Open Banking Future Entity, the industry
    body intended to take over stewardship from the CMA''s original open banking implementation
    structure.


    The speech forms part of a broader set of Mansion House reforms and follows the
    chancellor''s commitment earlier this month to an open finance consultation focused
    on SME lending. The governance question has been a persistent friction point:
    the Future Entity''s funding model, mandate and relationship with the FCA have
    been unresolved for over a year, creating uncertainty for providers building commercial
    products on open banking rails.


    The detail of what precisely changes in the Future Entity''s structure and powers
    will matter more than the headline commitment. Previous Mansion House speeches
    have announced open banking ambitions that subsequently stalled in implementation.

    '
  editorial_note: 'Follows up on the July 14 chancellor open finance commitment with
    specific governance announcements — a new stage in the long-running Future Entity
    question that directly affects UK open banking providers.

    '
  sources: '[UK Chancellor makes announcements on ''evolution'' of Open Banking in
    Mansion House reforms](https://www.openbankingexpo.com/news/uk-chancellor-makes-announcements-on-evolution-of-open-banking-in-mansion-house-reforms/)
    — Openbankingexpo'
