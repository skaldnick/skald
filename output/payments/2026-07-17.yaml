title: 'Mansion House reforms; Stripe–PayPal bid; HMT payments consultation; Thredd
  joins Visa agentic programme

  '
social_post: 'Reeves rewrites the UK open banking playbook at Mansion House, HMT opens
  a sweeping payments regulation consultation, and Stripe tables a $53bn bid for PayPal.
  Today''s briefing: {link}

  '
stories:
- headline: 'Reeves announces Mansion House reforms to accelerate UK open banking

    '
  standfirst: 'The chancellor''s speech signals structural changes to the Open Banking
    Future Entity and the long-term regulatory framework, moving open banking closer
    to open finance.

    '
  body: 'Rachel Reeves, the UK chancellor, used her Mansion House speech on July 16
    to announce a package of reforms aimed at the next phase of open banking. The
    measures address the governance of the Open Banking Future Entity and set out
    a longer-term regulatory pathway intended to support new payment and data-sharing
    use cases, including variable recurring payments.


    The announcements sit within the government''s broader National Payments Vision
    and follow Reeves''s July 14 commitment to an open finance push focused on SME
    lending. Taken together, the two interventions mark a shift from aspiration to
    structural detail, with the Future Entity''s mandate and regulatory underpinning
    now under active redesign rather than industry self-governance.


    For payments firms and banks, the practical question is how quickly the updated
    framework translates into new commercial permissions. The speech acknowledged
    that adjustments may be needed to support emerging open banking payment and data
    use cases, but specifics on timelines and scope remain subject to the parallel
    HMT consultation.

    '
  editorial_note: 'This follows the July 14 chancellor announcement on open finance
    for SME lending but adds new detail on the Open Banking Future Entity and regulatory
    framework, making it a distinct and material development.

    '
  sources: '[UK Chancellor makes announcements on ''evolution'' of Open Banking in
    Mansion House reforms](https://www.openbankingexpo.com/news/uk-chancellor-makes-announcements-on-evolution-of-open-banking-in-mansion-house-reforms/)
    — Openbankingexpo'
  verification:
    verified: false
    warnings:
    - Draft states speech was on July 16, but Reeves' Mansion House speech was delivered
      on the evening of Tuesday 14 July 2026 — a 2-day discrepancy
- headline: 'HM Treasury consults on modernising UK payments, stablecoins and open
    banking rules

    '
  standfirst: 'A wide-ranging consultation proposes a future-proof regulatory framework
    covering payment services, stablecoins and open banking, with responses due by
    October 6.

    '
  body: 'HM Treasury has opened a consultation on modernising the UK''s payments regulation,
    covering payment services, stablecoins and open banking within a single framework.
    The consultation, published on July 16, forms part of the National Payments Vision
    and follows the planned absorption of the Payment Systems Regulator into the FCA.


    The scope is broad. HMT is considering whether the existing regulatory perimeter
    needs adjusting to accommodate new open banking payment and data use cases, alongside
    questions about stablecoin oversight and broader payment services rules. The FCA,
    PSR and Bank of England are all listed as co-engaged regulators.


    Responses are due by October 6. For the industry, this is the formal mechanism
    through which the Mansion House commitments will take concrete regulatory shape.
    Firms with positions on variable recurring payments, open banking licensing or
    stablecoin treatment will need to engage directly.

    '
  editorial_note: 'The previously covered item from June 26 was a separate UK consultation
    on next-generation retail payments infrastructure. This is a distinct HMT consultation
    on the payments regulatory framework itself, covering stablecoins and open banking
    — a broader and more consequential scope.

    '
  sources: '[HM Treasury consults on a future-proof framework for payments, stablecoins
    and Open Banking](https://www.lewissilkin.com/insights/2026/07/16/hm-treasury-consults-on-a-future-proof-framework-for-payments-stablecoins-and-op-102nc2h)
    — Lewissilkin | [HMT consults on Modernising Payment Services Regulation](https://www.regulationtomorrow.com/2026/07/hmt-consults-on-modernising-payment-services-regulation/)
    — Regulationtomorrow | [HMT consults on Modernising Payment Services Regulation](https://www.regulationtomorrow.com/2026/07/hmt-consults-on-modernising-payment-services-regulation/)
    — Regulationtomorrow | [HMT consults on Modernising Payment Services Regulation](https://www.regulationtomorrow.com/2026/07/hmt-consults-on-modernising-payment-services-regulation/)
    — Regulationtomorrow'
  verification:
    verified: false
    warnings:
    - Consultation published July 14, not July 16 per GOV.UK official source
- headline: 'Stripe and Advent table joint bid to acquire PayPal for $53 billion

    '
  standfirst: 'A potential deal would reshape the European and global payments landscape
    by combining Stripe''s merchant platform with PayPal''s consumer wallet and checkout
    network.

    '
  body: 'Stripe and private equity firm Advent International have tabled a joint bid
    to acquire PayPal in a deal valued at approximately $53 billion. The approach,
    first reported on July 16, would represent one of the largest transactions in
    payments history.


    PayPal has been restructuring under CEO Alex Chriss, who took over in September
    2023. The company shut down its venture capital arm in June and has been refocusing
    on core payment processing and checkout. A combination with Stripe would unite
    two of the largest online payment processors, with significant overlap in merchant
    acquiring and divergent strengths in consumer wallets and developer infrastructure.


    The deal''s outcome is far from assured — regulatory review across multiple jurisdictions,
    including the EU and UK, would be extensive given the combined market share in
    online payments. For European payments firms, the prospect of a merged Stripe-PayPal
    entity raises competitive questions for acquirers, pay-by-bank providers and alternative
    checkout networks alike.

    '
  editorial_note: 'A $53 billion acquisition bid combining two of the world''s largest
    payment processors is among the most consequential potential transactions in the
    industry''s history, with direct implications for European acquiring, checkout
    and open banking competition.

    '
  sources: '[UK Chancellor makes announcements on ''evolution'' of Open Banking in
    Mansion House reforms](https://www.openbankingexpo.com/news/uk-chancellor-makes-announcements-on-evolution-of-open-banking-in-mansion-house-reforms/)
    — Openbankingexpo'
  verification:
    verified: false
    warnings:
    - Draft states 'CEO Alex Chriss, who took over in September 2023' but Chriss was
      replaced by Enrique Lores as CEO effective March 1, 2026. Chriss no longer heads
      PayPal.
    - Draft states deal was 'first reported on July 16' but multiple sources show
      it was reported/submitted on July 15, 2026.
    - Story appears to duplicate 2026-07-16 entry already in previously covered list.
- headline: 'Thredd joins Visa''s agentic payments programme for European issuers

    '
  standfirst: 'The issuer processor''s participation in Visa''s Agentic Ready programme
    gives European card issuers a route into agent-initiated payments without rebuilding
    their infrastructure.

    '
  body: 'Thredd, the issuer processing platform, has joined Visa''s Agentic Ready
    programme, enabling its issuer clients across Europe to support payments initiated
    by AI agents. The arrangement lets issuers participate in the emerging agentic
    commerce layer without replacing existing payment infrastructure.


    Agentic payments — where AI agents initiate and authorise transactions on behalf
    of consumers or businesses — have moved rapidly from concept to early production
    in 2026. Visa launched its own agentic payments capabilities in Europe in late
    June, and Mastercard, ING and Worldline completed Europe''s first agentic payment
    in early June. Thredd''s integration extends this capability to a wider set of
    European issuers through a processing layer rather than direct scheme membership.


    The announcement is one of a growing number of infrastructure-level moves positioning
    European payment firms for agentic commerce. The pace of programme enrolments
    suggests the industry expects agent-initiated transactions to reach meaningful
    volume sooner than many initially anticipated.

    '
  editorial_note: 'This is a vendor announcement, but it illuminates a broader trend:
    agentic payments infrastructure is now being built out at the processor level
    across Europe, signalling the technology is moving from pilot to production readiness.

    '
  sources: '[Thredd joins Visa''s Agentic Ready programme](https://www.finextra.com/pressarticle/110439/thredd-joins-visas-agentic-ready-programme?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: false
    warnings:
    - Draft states 'Visa launched its own agentic payments capabilities in Europe
      in late June' but sources show live agentic commerce transactions were announced
      on July 2, 2026 (early July)
- headline: 'Linux Foundation rallies 40 firms behind internet-native payments protocol
    x402

    '
  standfirst: 'The initiative to standardise machine-to-machine payments over the
    internet draws backing from finance and technology companies, signalling growing
    demand for a protocol-level payment layer.

    '
  body: 'The Linux Foundation has assembled 40 finance and technology firms behind
    x402, an open protocol designed to enable payments to be sent natively over the
    internet. The protocol targets machine-to-machine and automated payment flows,
    areas where existing card and bank transfer rails were not designed to operate.


    The x402 protocol — named after the HTTP 402 "Payment Required" status code that
    has existed since the early web but was never widely implemented — aims to create
    a standardised way for software to request and send payments as part of web interactions.
    The coalition''s breadth, spanning finance and technology, suggests the initiative
    is positioning itself as infrastructure rather than a single-vendor product.


    For the European payments industry, x402 intersects with several live debates:
    agentic commerce, open banking payment initiation and the role of stablecoins
    as settlement instruments. Whether the protocol gains traction depends on whether
    it can offer something that existing payment APIs and account-to-account rails
    cannot — namely, a universal, protocol-level payment primitive that works across
    schemes and jurisdictions.

    '
  editorial_note: 'A 40-firm coalition backing an open internet payments protocol
    is significant infrastructure news, particularly given the rapid development of
    agentic and machine-to-machine payment use cases across Europe.

    '
  sources: '[Finance and tech firms unite around Internet payments protocol x402](https://www.finextra.com/newsarticle/48105/finance-and-tech-firms-unite-around-internet-payments-protocol-x402?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: true
    warnings: []
