title: 'Stripe-PayPal bid; Mansion House open banking; Modulr European hires

  '
social_post: 'Stripe and Advent table a $53bn bid for PayPal. The chancellor rewires
  open banking governance. Modulr staffs up for Europe. Plus HMT''s payments regulation
  overhaul. {link}

  '
stories:
- headline: 'Stripe and Advent table joint $53 billion bid to acquire PayPal

    '
  standfirst: 'A combined offer from Stripe and private equity firm Advent International
    would, if completed, reshape the competitive landscape for online payments in
    Europe and the US.

    '
  body: 'Stripe and Advent International have tabled a joint bid to acquire PayPal
    for approximately $53 billion. The approach comes as PayPal has been restructuring
    under its current leadership, having shut down its venture capital arm and refocused
    on core payments and commerce.


    A deal of this scale would consolidate two of the largest independent online payments
    businesses globally. Stripe''s strength in developer-facing infrastructure and
    merchant acquiring would combine with PayPal''s consumer wallet, checkout presence
    and Braintree processing arm. For European payments, the implications are material:
    PayPal recently joined the European Payments Council, and Stripe is an increasingly
    prominent acquirer across the continent.


    Whether the bid progresses to a formal offer remains uncertain. Regulatory scrutiny
    in both the US and EU would be extensive given the combined market share in online
    checkout. The structure of a joint bid with Advent suggests a possible plan to
    separate or divest parts of PayPal''s business post-acquisition.

    '
  editorial_note: 'A potential $53bn acquisition combining two of the largest independent
    payments platforms is the most consequential M&A development in the sector this
    year, with direct implications for European market structure.

    '
  sources: '[Joint taskforce continues crack down on misleading car finance claims
    adverts](https://www.fca.org.uk/news/press-releases/joint-taskforce-continues-crack-down-misleading-car-finance-claims-adverts)
    — FCA'
