- headline: 'HM Treasury consults on modernising UK payments regulation

    '
  standfirst: 'The consultation covers payments licensing, stablecoins and open banking
    use cases as part of the government''s National Payments Vision, with responses
    due by October 6.

    '
  body: 'HM Treasury has opened a consultation on modernising the UK''s payments regulatory
    framework, developed alongside the FCA, Payment Systems Regulator (PSR) and Bank
    of England. The consultation, published on July 16, asks for industry feedback
    by October 6.


    The scope is broad: it covers the future payments licensing regime following the
    planned consolidation of the PSR into the FCA, the regulatory treatment of stablecoins,
    and whether adjustments are needed to support new open banking payment and data
    use cases such as variable recurring payments. The consultation sits within the
    government''s National Payments Vision, first outlined in late 2025.


    For payments firms, the practical question is whether the new framework will simplify
    or complicate the licensing environment. The PSR-FCA merger creates an opportunity
    to rationalise overlapping mandates, but also risks creating regulatory gaps during
    the transition. The inclusion of stablecoins and open banking in a single consultation
    signals that HM Treasury views these as part of the same infrastructure question
    rather than separate policy tracks.

    '
  editorial_note: 'A substantive regulatory consultation with direct operational implications
    for payments firms, distinct from the previously covered June 26 infrastructure
    consultation — this one covers licensing, stablecoins and open banking use cases
    specifically.

    '
  sources: '[HMT consults on Modernising Payment Services Regulation](https://www.regulationtomorrow.com/2026/07/hmt-consults-on-modernising-payment-services-regulation/)
