title: 'Mansion House open banking reforms; Stripe–PayPal bid; Thredd joins Visa agentic
  programme

  '
social_post: 'Rachel Reeves reshapes UK open banking governance at Mansion House,
  Stripe tables a $53bn PayPal bid, and Thredd plugs into Visa''s agentic payments
  programme. Today''s briefing: {link}

  '
stories:
- headline: 'Reeves announces open banking governance overhaul in Mansion House reforms

    '
  standfirst: 'The UK chancellor has set out changes to the Open Banking Future Entity
    and the long-term regulatory framework, moving open banking''s governance closer
    to formal regulatory oversight.

    '
  body: 'Rachel Reeves, the UK chancellor, used her Mansion House speech on July 16
    to announce a package of reforms to the UK''s open banking framework. The changes
    address the governance of the Open Banking Future Entity and signal the direction
    of the long-term regulatory settlement, including how variable recurring payments
    and new data-sharing use cases will be supervised.


    The announcements sit alongside HM Treasury''s broader consultation on modernising
    payment services regulation, published the same day with a response deadline of
    October 6. That consultation, which also covers stablecoins and the planned absorption
    of the Payment Systems Regulator into the FCA, forms part of the government''s
    National Payments Vision. It asks whether adjustments are needed to support emerging
    open banking payment and data use cases.


    Taken together, the Mansion House speech and the HMT consultation represent the
    most concrete articulation yet of how the UK government intends to bridge the
    gap between the CMA''s original open banking mandate and the broader open finance
    agenda. For firms building on open banking rails, the regulatory framework that
    emerges from this consultation will shape what products are commercially viable
    and on what terms.

    '
  editorial_note: 'Follow-up to the July 14 coverage of the chancellor''s open finance
    push focused on SME lending — the Mansion House speech adds specifics on governance
    reform and the Future Entity, and the HMT consultation is a new regulatory action
    with a defined timeline.

    '
  sources: '[UK Chancellor makes announcements on ''evolution'' of Open Banking in
    Mansion House reforms](https://www.openbankingexpo.com/news/uk-chancellor-makes-announcements-on-evolution-of-open-banking-in-mansion-house-reforms/)
    — Openbankingexpo | [HM Treasury consults on a future-proof framework for payments,
    stablecoins and Open Banking](https://www.lewissilkin.com/insights/2026/07/16/hm-treasury-consults-on-a-future-proof-framework-for-payments-stablecoins-and-op-102nc2h)
    — Lewissilkin | [HMT consults on Modernising Payment Services Regulation](https://www.regulationtomorrow.com/2026/07/hmt-consults-on-modernising-payment-services-regulation/)
    — Regulationtomorrow'
  verification:
    verified: false
    warnings:
    - Draft states speech was 'on July 16' but official GOV.UK source confirms Rachel
      Reeves delivered her Mansion House speech 'on the evening of Tuesday 14 July
      2026'
- headline: 'Stripe and Advent table $53 billion joint bid to acquire PayPal

    '
  standfirst: 'A joint approach by Stripe and Advent International for PayPal would,
    if completed, reshape the competitive landscape for online payments and merchant
    acquiring globally.

    '
  body: 'Stripe and Advent International, the private equity firm, have tabled a joint
    bid to acquire PayPal for approximately $53 billion, according to reports on July
    16. The approach comes as PayPal''s new leadership has been restructuring the
    business, having recently shut down its venture capital arm and refocused on core
    payment processing.


    A deal of this scale would consolidate two of the largest independent online payment
    platforms under common ownership. Stripe''s strength in developer-led merchant
    acquiring and PayPal''s consumer wallet and checkout presence are largely complementary,
    though the overlap in online merchant payments would draw regulatory scrutiny
    in multiple jurisdictions. Advent''s involvement suggests the financial structure
    may involve significant leverage and a potential future re-listing or break-up.


    For European payments specifically, the combination would create a platform with
    deep reach across both account-to-account and card-based rails. PayPal recently
    joined the European Payments Council and has been expanding its BNPL offering
    in the UK, while Stripe has built partnerships with banks such as Lloyds and with
    government clients. Whether the bid progresses to a formal offer remains uncertain,
    but the strategic logic — and the antitrust complexity — will define industry
    discussion for months.

    '
  editorial_note: 'A $53bn acquisition attempt involving two of Europe''s most significant
    payment processors is material for any audience in this space, with direct implications
    for merchant acquiring, checkout competition and regulatory review.

    '
  sources: '[The future of consumer payments: Cards, Pay by Bank & the evolution of
    the multi-rail bank](https://www.finextra.com/event-info/624/the-future-of-consumer-payments-cards-pay-by-bank--the-evolution-of-the-multi-rail-bank?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: false
    warnings:
    - Story claims Stripe 'has built partnerships with banks such as Lloyds and with
      government clients' - while Lloyds partnership is current (June 2026), Stripe
      was replaced as UK government payment processor by Adyen in June 2026, so describing
      current government client relationships is inaccurate
- headline: 'Thredd joins Visa''s agentic payments programme across Europe

    '
  standfirst: 'The issuer processor''s participation in Visa''s Agentic Ready programme
    lets European card issuers support AI agent-initiated payments without rebuilding
    existing infrastructure.

    '
  body: 'Thredd, the issuer processing platform, announced on July 16 that it is joining
    Visa''s Agentic Ready programme. The integration enables issuers across Europe
    that process through Thredd to participate in agent-initiated payments — transactions
    where an AI agent acts on a consumer''s behalf — without needing to overhaul their
    payments stack.


    Agentic payments have moved rapidly from concept to early production in 2026.
    Visa launched its own agentic payments capability in Europe in early July, and
    competitors such as Mastercard and ING completed Europe''s first agentic payment
    in June. The infrastructure layer is now catching up: processor-level support
    from firms such as Thredd means the capability can scale beyond pilot banks to
    a broader issuer base.


    For the European market, the question is shifting from whether agentic payments
    will arrive to how quickly the supporting infrastructure — authorisation, fraud
    controls, consent management — can be standardised. Thredd''s move suggests that
    established processors see enough near-term demand to invest in readiness now,
    rather than waiting for regulatory frameworks to settle.

    '
  editorial_note: 'Thredd''s announcement is a useful signal that agentic payments
    infrastructure is moving beyond the card networks and pilot banks into the processor
    layer, which is where scalability is determined.

    '
  sources: '[Thredd joins Visa''s Agentic Ready programme](https://www.finextra.com/pressarticle/110439/thredd-joins-visas-agentic-ready-programme?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: false
    warnings:
    - Draft states announcement was 'on July 16' but press release was issued July
      15, 2026
- headline: 'Linux Foundation rallies 40 firms behind internet-native payments protocol

    '
  standfirst: 'The x402 protocol, backed by a coalition of finance and technology
    companies, aims to embed payment capability directly into internet infrastructure
    — a potentially significant shift in how machines and AI agents settle transactions
    online.

    '
  body: 'The Linux Foundation has assembled 40 finance and technology firms to support
    x402, a protocol designed to enable payments to be sent natively over the internet.
    The initiative, reported on July 16, repurposes the long-dormant HTTP 402 "Payment
    Required" status code as the basis for a standardised machine-to-machine payment
    layer.


    The protocol is designed for scenarios where automated systems — including AI
    agents — need to pay for access to web content, APIs or services without human
    intervention. Unlike existing payment integrations, which rely on merchant-specific
    checkout flows, x402 would function as a transport-layer standard, making payment
    a built-in capability of web requests rather than an application bolted on top.


    The breadth of the coalition and the Linux Foundation''s involvement lend the
    initiative more credibility than a typical startup protocol proposal. If x402
    gains adoption, it could become foundational infrastructure for agentic commerce,
    where AI agents transact autonomously. For European payment providers, it raises
    questions about which rails — card, account-to-account, stablecoin — will plug
    into the protocol layer and capture this emerging transaction flow.

    '
  editorial_note: 'The x402 protocol is relevant because it addresses the infrastructure
    gap for machine-to-machine payments that the agentic commerce trend is creating.
    The 40-firm coalition gives it substance beyond a whitepaper exercise.

    '
  sources: '[Finance and tech firms unite around Internet payments protocol x402](https://www.finextra.com/newsarticle/48105/finance-and-tech-firms-unite-around-internet-payments-protocol-x402?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: false
    warnings:
    - Story body says initiative 'reported on July 16' but actual announcement was
      July 14, 2026 (3 days old, within threshold but date is incorrect in article).
      Headline frames this as 'Linux Foundation rallies 40 firms' but the more accurate
      framing is that Coinbase created the protocol and transferred it to the Linux
      Foundation's governance structure, which then brought in 40 member organizations.
