title: 'iDEAL-to-Wero migration; ECB digital euro pilot; PayPal bid standoff

  '
social_post: 'Dutch banks and PSPs agree the next phase of the iDEAL-to-Wero migration
  — the biggest live test yet for Europe''s domestic payment sovereignty ambitions.
  Plus: ECB digital euro pilot selections, and PayPal''s board digs in. {link}

  '
stories:
- headline: 'Dutch banks and PSPs agree next phase of iDEAL migration to Wero

    '
  standfirst: 'The transition from the Netherlands'' dominant online payment method
    to Wero is moving into its most consequential phase, with major acquirers now
    committed to a joint roadmap.

    '
  body: 'The European Payments Initiative, Dutch banks such as ABN Amro, ING and Rabobank,
    and a group of payment service providers such as Adyen, Mollie, Buckaroo and MultiSafepay
    have agreed the roadmap for the next major stage of transitioning iDEAL to Wero.
    The announcement follows what EPI described as a successful first step in the
    migration.


    The Netherlands is the critical test market for Wero''s ambition to replace entrenched
    national payment schemes with a pan-European alternative. iDEAL processes the
    vast majority of Dutch e-commerce payments, making it the highest-volume national
    scheme Wero has attempted to absorb. The involvement of major acquirers, not just
    issuing banks, signals that the merchant-side plumbing is now being addressed
    — a necessary condition for the migration to succeed at checkout.


    The agreement comes as Wero continues expanding across Europe, with Austria joining
    as its fifth market last month. How smoothly the Dutch transition proceeds will
    shape the willingness of other countries to fold their own national schemes into
    EPI''s infrastructure.

    '
  editorial_note: 'This advances the Rabobank/iDEAL-to-Wero story previously covered
    on June 17 — the new angle is the formal agreement of a joint roadmap involving
    acquirers such as Adyen and Mollie, moving the transition from a single-bank pilot
    to a market-wide commitment.

    '
  sources: '[EPI embarks on next phase of iDeal transition to Wero](https://www.finextra.com/pressarticle/110453/epi-embarks-on-next-phase-of-ideal-transition-to-wero?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: false
    warnings:
    - Draft says Austria is 'fifth market', but sources confirm Austria is the sixth
      market for Wero expansion
- headline: 'ECB selects 36 providers for digital euro pilot as Parliament clears
    path

    '
  standfirst: 'With the European Parliament having voted to advance the digital euro
    to final negotiations, the ECB''s selection of pilot participants marks the shift
    from legislative debate to operational testing.

    '
  body: 'ECB executive board member Piero Cipollone has set out the cooperative principles
    underpinning the digital euro''s design, speaking as the central bank prepares
    to work with 36 payment providers selected for its pilot phase. The speech, published
    on July 17, frames the digital euro as a public good intended to complement rather
    than displace private payment solutions.


    The pilot selections, announced on July 15, followed the European Parliament''s
    vote on July 10 to advance the digital euro regulation to trilogue negotiations.
    The two events together represent the most concrete progress on the project since
    the ECB''s investigation phase concluded. Cipollone''s emphasis on cooperation
    appears designed to address industry concerns — raised publicly by trade bodies
    — that the digital euro could marginalise existing open banking and payment providers.


    The pilot phase will test distribution models, offline functionality and merchant
    acceptance. Which of the 36 selected providers are banks versus fintechs or payment
    schemes has not been fully disclosed, though the breadth of the selection suggests
    the ECB is seeking to demonstrate broad ecosystem participation rather than a
    bank-only model.

    '
  editorial_note: 'Cipollone''s speech (ID 1) adds substance to the previously covered
    pilot selection and Parliament vote, articulating the ECB''s positioning on the
    digital euro''s relationship with private payment providers — a live concern for
    the open banking industry.

    '
  sources: '[Piero Cipollone: The cooperative spirit at the heart of the digital euro](https://www.ecb.europa.eu//press/key/date/2026/html/ecb.sp260717~b6a156dc40.en.html)
    — ECB'
  verification:
    verified: false
    warnings:
    - Draft says pilot selections announced July 15, but ECB official announcement
      and multiple sources confirm July 14, 2026
- headline: 'PayPal board holds firm against Stripe-Advent $53bn takeover approach

    '
  standfirst: 'PayPal''s board considers the joint bid from Stripe and Advent International
    too low and expects regulatory obstacles, setting up a prolonged standoff over
    the largest potential payments acquisition in history.

    '
  body: 'PayPal''s board views the $53 billion takeover offer from Stripe and Advent
    as undervaluing the company and believes the deal would face significant regulatory
    scrutiny, according to Reuters. The board has not formally rejected the bid but
    regards the proposed price as inadequate.


    A completed deal would reshape the global payments landscape, combining Stripe''s
    infrastructure-led model with PayPal''s consumer wallet, merchant network and
    checkout presence. The regulatory dimension is substantial: the combined entity
    would dominate online payment processing in the US and Europe, raising competition
    concerns in multiple jurisdictions. PayPal''s recent restructuring under its current
    leadership — shutting its venture arm and refocusing on core payments — suggests
    the board believes it can deliver shareholder value independently.


    Whether Stripe and Advent return with a higher offer remains uncertain. PayPal
    shares had already reflected acquisition speculation, and the board''s stance
    signals that any deal would need to clear a materially higher price threshold
    as well as antitrust review on both sides of the Atlantic.

    '
  editorial_note: 'Advances the Stripe-Advent/PayPal story previously covered on July
    16 and 20 — the new detail is the board''s explicit reasoning (valuation and regulatory
    risk), reported via Reuters, which provides the first substantive indication of
    PayPal''s negotiating position.

    '
  sources: '[PayPal board considers $53bn Stripe-Advent offer inadequate - Reuters](https://www.finextra.com/newsarticle/48116/paypal-board-considers-53bn-stripe-advent-offer-inadequate---reuters?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: true
    warnings: []
- headline: 'HSBC joins Asian working group on standards for agentic payments

    '
  standfirst: 'The formation of a cross-industry working group focused on agentic
    commerce standards reflects how quickly AI-initiated payments are moving from
    proof-of-concept to an interoperability problem.

    '
  body: 'HSBC is joining the Emerging Payments Association Asia''s new AI and Agentic
    Payments Working Group as a founding member. The group brings together banks,
    payment networks, fintechs and technology platforms to define standards for AI
    agent-initiated commerce across the Asia-Pacific region.


    Agentic payments — where AI systems autonomously initiate and authorise transactions
    — have moved rapidly from concept to early production in Europe, with Crédit Agricole,
    ING and Visa all completing live or pilot transactions in recent months. The formation
    of a dedicated standards body in Asia-Pacific signals that the industry is beginning
    to grapple with the interoperability and governance questions that arise when
    machines, not humans, are the payment initiators. Authentication, liability allocation
    and consent frameworks all require new thinking when the customer is absent from
    the transaction flow.


    HSBC''s involvement is notable given the bank''s scale across both European and
    Asian markets. Standards developed in one region will inevitably influence regulatory
    expectations elsewhere, making this working group relevant beyond its Asia-Pacific
    remit.

    '
  editorial_note: 'While Asia-focused, HSBC''s involvement and the cross-regional
    implications for agentic payment standards make this relevant to European professionals
    tracking the rapid development of AI-initiated commerce infrastructure.

    '
  sources: '[HSBC joins EPAA agentic AI working group as founding member](https://www.finextra.com/pressarticle/110454/hsbc-joins-epaa-agentic-ai-working-group-as-founding-member?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: true
    warnings: []
