title: 'PayPal rebuffs Stripe bid; BBVA joins Swift retail scheme; ACI weighs billing
  sale

  '
social_post: 'PayPal''s board says $53bn isn''t enough. Plus: BBVA goes live on Swift''s
  retail payments scheme, and ACI Worldwide eyes a breakup. Today''s European payments
  briefing → {link}

  '
stories:
- headline: 'PayPal board rejects Stripe-Advent $53 billion bid as too low

    '
  standfirst: 'PayPal''s directors believe the joint offer undervalues the company
    and could face regulatory obstacles, keeping alive the largest potential deal
    in payments history.

    '
  body: 'PayPal''s board considers the $53 billion takeover approach from Stripe and
    Advent International inadequate, according to Reuters. Directors believe the offer
    undervalues the payments company and have flagged likely regulatory pushback as
    a further concern.


    The bid, first reported on July 16, would represent the largest acquisition in
    the payments industry. A combined Stripe-PayPal entity would bring together two
    of the biggest online payment processors globally, raising immediate questions
    about market concentration in checkout and merchant acquiring. Stripe''s core
    strength in developer-led commerce and PayPal''s consumer wallet and branded checkout
    would overlap significantly in several segments.


    PayPal has been restructuring under CEO Alex Chriss, who shut down the company''s
    venture capital arm in June and has been narrowing focus on core payments and
    commerce. Whether the board''s stance is a negotiating position or a firm rejection
    remains unclear, but the signal that $53 billion falls short sets a high bar for
    any revised approach.

    '
  editorial_note: 'This moves the Stripe-Advent bid story forward materially: the
    board''s formal view that the offer is inadequate is the first substantive response
    since the bid was reported, and shapes what happens next in the most consequential
    potential deal in payments.

    '
  sources: '[PayPal board considers $53bn Stripe-Advent offer inadequate - Reuters](https://www.finextra.com/newsarticle/48116/paypal-board-considers-53bn-stripe-advent-offer-inadequate---reuters?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: false
    warnings:
    - Draft states Alex Chriss shut down the venture capital arm in June, but Chriss
      departed as CEO in February 2026 and was replaced by Enrique Lores on March
      1, 2026. The venture capital arm shutdown occurred under Lores, not Chriss
    - Draft states the bid was 'first reported on July 16' but the bid was first reported
      on July 15, 2026. The board's rejection was reported on July 16
- headline: 'BBVA becomes first Spanish bank live on Swift''s retail payments scheme

    '
  standfirst: 'The launch extends Swift''s new retail rulebook into Spain, adding
    momentum to an initiative designed to make cross-border payments for individuals
    and SMEs faster and more predictable.

    '
  body: 'BBVA has gone live on Swift''s new global retail payments scheme from its
    launch, becoming the first Spanish bank to join the initiative. The scheme establishes
    a common rulebook for international payments aimed at individuals and small businesses,
    with commitments around speed, transparency, predictability and round-the-clock
    availability.


    Swift launched the retail scheme to bring cross-border payments closer to the
    experience users expect from domestic instant transfers. Barclays, HSBC, Lloyds
    and NatWest adopted the framework earlier this month, and BBVA''s participation
    signals the scheme is gaining traction beyond its initial Anglo-Saxon base. Spain
    is a significant corridor for remittances and cross-border commerce, particularly
    with Latin America.


    The scheme sits alongside other efforts to improve cross-border retail payments,
    such as the ECB''s recent cross-currency instant payments pilot on TIPS and Citi''s
    expansion of its correspondent banking instant payments network. For European
    banks, the question is how these overlapping initiatives coexist as each scales.

    '
  editorial_note: 'BBVA''s adoption extends the Swift retail payments scheme to a
    new market and follows the UK bank cohort covered on July 3, making this a genuine
    progression of the cross-border retail payments story.

    '
  sources: '[BBVA becomes first Spanish bank to launch Swift’s new global retail payments
    scheme](https://www.finextra.com/pressarticle/110445/bbva-becomes-first-spanish-bank-to-launch-swifts-new-global-retail-payments-scheme?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: true
    warnings: []
- headline: 'ACI Worldwide considers selling its billing division

    '
  standfirst: 'A potential divestiture would narrow ACI''s focus toward real-time
    payments infrastructure at a time when the company is processing instant payments
    for EPI and expanding through acquisitions such as Payment Components.

    '
  body: 'ACI Worldwide is exploring a sale of its billing division, according to PYMNTS.
    The billing unit handles biller payment solutions, a business line that sits alongside
    ACI''s core real-time payments processing and fraud prevention operations.


    ACI was selected in June to process instant payments for the European Payments
    Initiative across Europe, and last year acquired Payment Components, a financial
    messaging and open banking solutions provider. Shedding the billing business would
    concentrate ACI''s portfolio on the infrastructure layer for real-time and account-to-account
    payments, where demand is growing as SEPA instant payment mandates take effect
    and schemes such as Wero scale.


    The move follows a broader pattern in payments infrastructure, where companies
    are narrowing their focus through selective divestitures. Pollen Street''s carve-out
    of Finastra''s Universal Banking business in June and Mastercard''s reported consideration
    of selling Vocalink reflect similar portfolio discipline. Whether ACI finds a
    buyer at an acceptable price will depend on the billing unit''s standalone economics,
    which remain undisclosed.

    '
  editorial_note: 'ACI''s potential divestiture is significant given the company''s
    growing role in European instant payments infrastructure (EPI processing, Payment
    Components acquisition) and fits a wider trend of payments firms trimming non-core
    units.

    '
  sources: '[ACI Worldwide Considers Putting Billing Division Up For Sale](https://www.pymnts.com/back-office/accounts-receivable/2026/aci-worldwide-considers-putting-billing-division-up-for-sale/)
    — PYMNTS.com'
  verification:
    verified: true
    warnings: []
- headline: 'Euroclear appoints Usman Ahmad to lead digital assets strategy

    '
  standfirst: 'Europe''s largest securities settlement house has hired a dedicated
    digital assets head as tokenised securities move closer to production use across
    the continent''s capital markets.

    '
  body: 'Euroclear has appointed Usman Ahmad as head of digital assets. The role places
    Ahmad at the centre of the settlement infrastructure operator''s efforts to position
    itself for tokenised securities, an area where European regulators and market
    participants are moving from proof-of-concept to pilot-stage work.


    The appointment comes as tokenised real-world assets and distributed ledger technology
    gain regulatory attention across Europe. The BIS completed Project Aperta in June
    to prototype cross-border open finance interoperability, and Swift is preparing
    live transactions on its shared ledger with 17 banks. For Euroclear, which settles
    more than €1 trillion in securities transactions daily, the strategic question
    is whether tokenised instruments will flow through existing central securities
    depositories or bypass them entirely.


    Whether this is a newly created position or a replacement is not stated in the
    source. Ahmad''s background and previous role were not detailed in the available
    information.

    '
  editorial_note: 'Euroclear is critical infrastructure for European capital markets;
    a dedicated digital assets leadership appointment signals that tokenised settlement
    is moving from experimentation toward operational planning at the continent''s
    core plumbing.

    '
  sources: '[Euroclear Appoints Usman Ahmad as Head of Digital Assets](https://fintechnews.ch/blockchain_bitcoin/euroclear-usman-ahmad-digital-assets/84735/)
    — Fintech News Switzerland'
  verification:
    verified: false
    warnings:
    - Draft states Euroclear 'settles more than €1 trillion in securities transactions
      daily' - cannot verify this specific daily figure from available sources. Recent
      Euroclear data reports quarterly/annual turnover and collateral figures, not
      daily settlement at €1 trillion.
    - Project Aperta completion date (June 17-18, 2026) is 33 days old, exceeding
      the 5-day recency threshold.
    - Swift announcement (July 9, 2026) is 11 days old, exceeding the 5-day recency
      threshold.
