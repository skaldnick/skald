title: 'Montenegro goes live; iDEAL-Wero migration advances; HSBC backs agentic payments
  standards

  '
social_post: 'Montenegro flips the switch on instant payments, the iDEAL-to-Wero migration
  gets its next-phase roadmap, and HSBC helps set agentic payment standards in APAC.
  Today''s briefing: {link}

  '
stories:
- headline: 'Montenegro goes live with SEPA-aligned instant payments

    '
  standfirst: 'Montenegro''s instant payments system launched on July 20, making it
    the latest non-EU country to adopt SEPA standards for domestic real-time transfers.

    '
  body: 'The Central Bank of Montenegro activated the country''s instant payments
    infrastructure on July 20, enabling consumers and businesses to send and receive
    payments in seconds. The system operates to European SEPA standards, a requirement
    of Montenegro''s EU accession process.


    Marija Šuković, director of the Association of Banks of Montenegro, confirmed
    that the service is available to citizens and businesses in real time. The World
    Bank''s vice president for Europe attended the launch, underscoring the initiative''s
    alignment with the country''s broader European integration agenda.


    Montenegro follows a pattern of aspirant and neighbouring states adopting SEPA-compatible
    infrastructure ahead of EU membership. The launch extends the geographic reach
    of Europe''s instant payments network into the western Balkans, adding another
    real-time corridor for cross-border settlement as the EU''s own instant payments
    regulation beds in across member states.

    '
  editorial_note: 'This is the actual go-live following the previously covered announcement
    that Montenegro would launch on July 20. The prior coverage reported the planned
    date; this confirms operational launch, which is a genuinely subsequent stage.

    '
  sources: '[CBCG: Instant payments in Montenegro from today, money arrives in a few
    seconds](https://en.vijesti.me/news-b/economy-d/818514/cbcg-from-today-instant-payments-in-Montenegro-money-arrives-in-a-few-seconds)
    — Vijesti | [Association of Banks: Instant payments in the country in real time
    available to citizens and ...](https://en.vijesti.me/news-b/economy-d/818503/Association-of-banks-makes-instant-payments-in-the-country-available-to-citizens-and-businesses-in-real-time)
    — En'
  verification:
    verified: false
    warnings:
    - Cannot verify that World Bank vice president attended the July 20 launch event;
      found video message participation at October 2025 SEPA launch but no evidence
      of attendance at July 20 instant payments activation.
- headline: 'Dutch banks and PSPs agree next phase of iDEAL-to-Wero migration

    '
  standfirst: 'EPI, major Dutch banks and payment service providers have published
    a joint roadmap for the next stage of migrating iDEAL transactions to Wero, advancing
    Europe''s most significant test of domestic scheme consolidation.

    '
  body: 'The European Payments Initiative, alongside ABN Amro, ING, Rabobank and Dutch
    payment service providers such as Adyen, Mollie, Buckaroo and CM.com, has agreed
    on the roadmap for the next major phase of transitioning iDEAL to Wero. The announcement
    follows a first migration step that EPI described as successful.


    The Netherlands is the critical proving ground for Wero''s commercial viability.
    iDEAL handles the vast majority of Dutch e-commerce payments, and its migration
    represents the first time EPI has attempted to absorb an entrenched national scheme
    with mass consumer adoption. The participation of major acquirers and payment
    service providers alongside the banks signals that the commercial terms and technical
    integration paths are sufficiently resolved to proceed.


    How smoothly this next phase runs will shape EPI''s credibility as it expands
    Wero into further markets. Austria joined as the fifth EPI market in June, and
    the initiative needs a clean Dutch migration to maintain momentum with banks and
    merchants elsewhere in Europe.

    '
  editorial_note: 'Previously covered was the initial announcement that Rabobank was
    beginning iDEAL-to-Wero migration, plus the Dutch roadmap agreement. This is a
    follow-up confirming the next phase is formally agreed with a broader set of PSPs
    named, moving the story from plan to execution.

    '
  sources: '[EPI embarks on next phase of iDeal transition to Wero](https://www.finextra.com/pressarticle/110453/epi-embarks-on-next-phase-of-ideal-transition-to-wero?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: true
    warnings: []
- headline: 'HSBC joins Asia-Pacific working group setting agentic payment standards

    '
  standfirst: 'HSBC''s role as founding member of a new APAC working group on agentic
    AI payments adds institutional weight to the push for cross-border standards before
    the technology scales.

    '
  body: 'The Emerging Payments Association Asia has launched an AI and Agentic Payments
    Working Group with HSBC as its founding member. The group aims to bring together
    banks, payment networks, fintechs and technology platforms to define standards
    for agentic commerce across the Asia-Pacific region.


    The formation of the group reflects a growing recognition that agentic payments,
    where AI agents initiate and authorise transactions on behalf of users, need shared
    rules before they reach production scale. Europe has seen a flurry of agentic
    payment announcements in recent months, from ING, Worldline and Mastercard completing
    Europe''s first agentic payment in June to Visa and Santander launching their
    own agent-initiated products. HSBC''s involvement signals that major global banks
    are now investing in the standards layer, not just individual pilots.


    The APAC focus is relevant for European payments professionals because agentic
    commerce will inevitably operate across borders. Standards set in one region will
    influence or constrain interoperability with others, making early participation
    a strategic consideration for banks and networks with global ambitions.

    '
  editorial_note: 'While APAC-focused, HSBC''s involvement and the standards-setting
    angle are directly relevant to European payments professionals tracking the agentic
    payments trend. This adds an institutional governance dimension to a topic that
    has so far been dominated by individual pilot announcements.

    '
  sources: '[HSBC joins EPAA agentic AI working group as founding member](https://www.finextra.com/pressarticle/110454/hsbc-joins-epaa-agentic-ai-working-group-as-founding-member?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  verification:
    verified: true
    warnings: []
- headline: 'Salt Edge and Domopay launch pay-by-bank rent collection in Italy

    '
  standfirst: 'The partnership introduces account-to-account rent payments in the
    Italian property market, extending open banking into a sector where direct debits
    and bank transfers have dominated.

    '
  body: 'Salt Edge and Domopay are partnering to offer what they describe as Italy''s
    first open banking rent collection service, enabling landlords and property managers
    to receive rent via instant account-to-account transfers rather than traditional
    bank transfers or direct debits.


    The Italian rental market has been slow to adopt digital payment innovation, with
    most transactions still relying on manual bank transfers. Pay-by-bank rent collection
    reduces reconciliation friction for property managers and gives tenants a payment
    experience closer to what open banking has enabled in other recurring-payment
    contexts such as utilities and subscriptions.


    The move illustrates how open banking rails are expanding beyond their initial
    strongholds in e-commerce and lending into sectors with large, recurring payment
    flows. Property is a natural fit: high-value, predictable transactions where both
    parties benefit from faster confirmation and lower processing costs compared with
    card-based alternatives.

    '
  editorial_note: 'A vendor partnership, but one that opens a new vertical for open
    banking payments in a major European market. The Italian rental sector is a meaningful
    use case for account-to-account payments, and the story illustrates how pay-by-bank
    is expanding beyond e-commerce into recurring-payment verticals.

    '
  sources: '[Salt Edge and Domopay Launch Italy''s First Open Banking Rent Collection
    Solution](https://ffnews.com/news/salt-edge-and-domopay-launch-italys-first-open-banking-rent-collection-solution)
