title: 'Augustus pivots to stablecoin clearing; Montenegro banks go live on TIPS

  '
social_post: 'A former open banking startup raises $180m to become a stablecoin clearing
  bank. Plus Montenegro''s banks go live on instant payments, and the BIS charts open
  finance''s global spread. {link}

  '
stories:
- headline: 'Augustus raises $180m to build clearing bank for stablecoins

    '
  standfirst: 'The company formerly known as Ivy, once focused on open banking payments,
    is repositioning as dedicated clearing infrastructure for stablecoins, reflecting
    where venture capital sees the next layer of payment plumbing being built.

    '
  body: 'Augustus has raised $180 million to develop a clearing bank purpose-built
    for stablecoin settlement. The company, which previously operated as Ivy with
    a focus on global open banking payments, raised a $20 million Series A in August
    2023 before pivoting to its current model.


    The fundraise comes as stablecoin infrastructure attracts growing institutional
    interest. Mastercard added stablecoin settlement to its merchant network in June,
    Visa and Google backed the Open USD stablecoin launch on July 1, and Lightspark
    secured Europe''s first combined MiCA and e-money licence earlier this month.
    Augustus is betting that as stablecoin volumes scale, the clearing and settlement
    layer will require dedicated banking infrastructure rather than being bolted onto
    existing rails.


    The pivot from open banking to stablecoin clearing is itself instructive. It suggests
    that some early open banking infrastructure players see greater commercial opportunity
    in the emerging stablecoin stack than in competing for account-to-account payment
    volumes, where margins remain thin and incumbents such as Plaid and TrueLayer
    have established positions.

    '
  editorial_note: 'A company pivoting from open banking to stablecoin clearing infrastructure
    illustrates where capital is flowing and how the payments plumbing landscape is
    shifting, relevant to readers tracking both open banking and digital asset infrastructure.

    '
  sources: '[Augustus Raises $180 Million to Build Clearing Bank for Stablecoins](https://www.pymnts.com/news/investment-tracker/2026/augustus-raises-180-million-to-build-clearing-bank-for-stablecoins/)
    — PYMNTS.com'
  verification:
    verified: false
    warnings:
    - Draft states Visa and Google backed Open USD launch on July 1, but the announcement
      was June 30, 2026; it was not a 'launch' but announcement of future launch
    - Draft claims Lightspark secured 'Europe's first' combined MiCA and e-money licence,
      but sources confirm it is 'Estonia's first' - no evidence it is Europe's first
      overall
- headline: 'Montenegrin banks go live on TIPS as instant payments launch

    '
  standfirst: 'Multiple Montenegrin banks have activated instant payments on the ECB''s
    TIPS infrastructure, marking the first live transactions following the country''s
    July 20 launch date.

    '
  body: 'Adriatic Bank and Lovćen Banka have gone live with instant payments connected
    to TIPS, the ECB''s settlement platform, following Montenegro''s scheduled launch
    on July 20. The go-live makes Montenegro the latest non-eurozone country to connect
    to TIPS, after Iceland signed up to the platform in June.


    Adriatic Bank described the service as operational for both domestic and cross-border
    euro-denominated transfers, settling in seconds around the clock. Lovćen Banka
    confirmed it is running what it calls a "TIPS Clone" implementation, indicating
    it has deployed a local instance of the TIPS architecture. Both banks framed the
    launch as part of broader alignment with European payment standards.


    Montenegro''s adoption extends the geographic reach of Europe''s instant payments
    infrastructure into the Western Balkans. The country''s use of the euro as its
    de facto currency, despite not being an EU member, makes TIPS connectivity a practical
    step toward interoperability with the single euro payments area rather than a
    purely aspirational alignment.

    '
  editorial_note: 'This advances the previously covered story of Montenegro''s instant
    payments law (July 7) to the go-live stage, with named banks confirming live transactions
    — a genuinely new development in the expansion of Europe''s instant payments footprint.

    '
  sources: '[Adriatic Bank successfully introduced instant payments: Transfer money
    in just a few seconds](https://en.vijesti.me/marketing/business-marketing/818699/Adriatic-Bank-successfully-introduced-instant-payments--money-transfer-in-just-a-few-seconds-promo)
    — Vijesti | [Lovćen Banka launches instant payments TIPS Clone](https://en.vijesti.me/marketing/business-marketing/818652/Lovcen-Bank-launches-instant-payments-tips-clone-promo)
    — Vijesti'
  verification:
    verified: false
    warnings:
    - Draft says banks are connected to 'TIPS, the ECB's settlement platform,' but
      Montenegro's system is TIPS Clone (developed by Banca d'Italia), not the ECB's
      TIPS. Iceland signed an agreement to join TIPS in 2028, while Montenegro deployed
      TIPS Clone on July 20, 2026 — these are distinct platforms and arrangements.
- headline: 'BIS reports rapid scaling of open finance adoption globally

    '
  standfirst: 'A new Bank for International Settlements assessment finds open finance
    adoption accelerating across jurisdictions, providing an authoritative benchmark
    as European and UK policymakers push their own frameworks forward.

    '
  body: 'The Bank for International Settlements has published findings indicating
    that open finance adoption is scaling rapidly across multiple jurisdictions, driven
    by the growth of digital payments and expanding regulatory frameworks. The assessment
    covers the broadening of data-sharing regimes beyond traditional banking into
    areas such as insurance, pensions and investments.


    The timing aligns with a concentrated period of policy activity. The UK chancellor
    announced an open finance push focused on SME lending on July 14, the FCA published
    its AI review with open finance in scope on July 7, and Switzerland extended its
    open finance framework to cover pension data in June. The BIS assessment provides
    a cross-jurisdictional view that contextualises these individual national efforts.


    For European payments professionals, the BIS findings reinforce the direction
    of travel: open finance is moving from a policy aspiration to an operational reality
    in a growing number of markets, with regulatory frameworks increasingly reaching
    beyond payment accounts into broader financial data.

    '
  editorial_note: 'A BIS assessment on global open finance adoption provides an authoritative
    cross-jurisdictional benchmark at a moment when multiple European and UK frameworks
    are moving from consultation to implementation.

    '
  sources: '[Bank for International Settlements Says Open Finance Adoption is Rapidly
    Scaling](https://coinfomania.com/bank-for-international-settlements-says-open-finance-adoption-is-rapidly-scaling/)
    — Coinfomania'
  verification:
    verified: false
    warnings:
    - FCA published Mills Review on July 6, 2026, not July 7 as stated
    - UK Chancellor SME lending announcement occurred July 12, 2026; Mansion House
      speech where it was discussed was July 14
- headline: 'UK parliamentary group investigates £1bn in rejected crypto transactions

    '
  standfirst: 'A UK parliamentary inquiry into banking barriers for crypto firms has
    surfaced data showing over £1 billion in rejected transactions, including those
    initiated through open banking, raising questions about proportionality in financial
    crime controls.

    '
  body: 'A UK parliamentary group is investigating barriers that crypto firms face
    in accessing banking services, with evidence submitted showing approximately £1
    billion in rejected transactions. The figure covers both card payments and transfers
    initiated through open banking that were declined or blocked by banks.


    The inquiry touches on a tension familiar across the payments industry: the balance
    between fraud prevention obligations and legitimate access to payment infrastructure.
    Banks have increasingly applied blanket restrictions on crypto-related transactions,
    citing anti-money laundering requirements, but the scale of rejections documented
    in the parliamentary evidence suggests the approach may be disproportionate.


    The investigation comes as UK regulators are recalibrating their approach to digital
    assets more broadly. The Bank of England dropped individual holding caps in its
    stablecoin regulatory rethink in June, and HM Treasury''s July consultation on
    modernising payments regulation explicitly includes stablecoins in scope. Whether
    parliamentary scrutiny of debanking practices translates into regulatory guidance
    remains to be seen, but the scale of rejected transactions now has a public figure
    attached to it.

    '
  editorial_note: 'The parliamentary inquiry quantifies crypto debanking at £1bn in
    rejected transactions — including open banking-initiated ones — at a moment when
    UK policy on digital assets and payments regulation is actively being rewritten.

    '
  sources: '[UK parliamentary group probes banking barriers for crypto firms](https://es.tradingview.com/news/cointelegraph:6a7cce6de094b:0-uk-parliamentary-group-probes-banking-barriers-for-crypto-firms/)
    — TradingView | [UK Crypto Debanking: Parliament Investigates as £1B in Transactions
    Rejected](https://www.techtimes.com/articles/321149/20260721/uk-crypto-debanking-parliament-investigates-1b-transactions-rejected.htm)
    — Techtimes'
  verification:
    verified: true
    warnings: []
