title: 'Augustus pivot; Montenegro instant payments go live; BIS on open finance

  '
social_post: 'A former open banking startup raises $180m to become a stablecoin clearing
  bank. Plus: Montenegro''s banks go live on TIPS, and the BIS tracks open finance''s
  global scaling. {link}

  '
stories:
- headline: 'Augustus raises $180m to pivot from open banking to stablecoin clearing

    '
  standfirst: 'The company formerly known as Ivy has abandoned its open banking payments
    network to build clearing infrastructure for stablecoins, marking a notable shift
    in where venture capital sees opportunity.

    '
  body: 'Augustus, which operated as Ivy until its rebrand, has raised $180 million
    to build a clearing bank for stablecoins. The company previously raised $20 million
    in a 2023 Series A to expand a global open banking payments network but has since
    repositioned itself entirely around stablecoin settlement infrastructure.


    The pivot reflects a broader pattern in payments venture funding, where capital
    is moving from open banking connectivity towards stablecoin and tokenised money
    infrastructure. Augustus is betting that stablecoins will need dedicated clearing
    and settlement services analogous to the correspondent banking layer in traditional
    payments, rather than relying on the crypto exchange infrastructure that handles
    most stablecoin flows today.


    The raise is substantial for a company at this stage and suggests investor conviction
    that regulated stablecoin clearing will become a distinct infrastructure category.
    European regulatory frameworks such as MiCA, combined with the proliferation of
    bank-issued and consortium-backed stablecoins, are creating demand for institutional-grade
    settlement that sits between issuers and payment networks.

    '
  editorial_note: 'A company pivoting from open banking to stablecoin clearing, with
    a significant funding round, illustrates where capital is flowing and how the
    payments infrastructure landscape is shifting.

    '
  sources: '[Augustus Raises $180 Million to Build Clearing Bank for Stablecoins](https://www.pymnts.com/news/investment-tracker/2026/augustus-raises-180-million-to-build-clearing-bank-for-stablecoins/)
    — PYMNTS.com'
  verification:
    verified: true
    warnings: []
- headline: 'Montenegrin banks go live on TIPS as instant payments launch

    '
  standfirst: 'Two Montenegrin banks have activated instant payments on the ECB''s
    TIPS infrastructure, following the country''s adoption of SEPA-aligned instant
    payments legislation on July 20.

    '
  body: 'Adriatic Bank and Lovćen Banka have both launched instant payments services
    connected to the ECB''s TARGET Instant Payment Settlement (TIPS) platform, making
    Montenegro the latest non-eurozone country to go live on European instant payments
    infrastructure. The launches follow Montenegro''s instant payments law, which
    took effect on July 20.


    Montenegro uses the euro as its currency without being a eurozone member, which
    simplifies its integration with TIPS but makes the regulatory alignment with SEPA
    standards a deliberate policy choice rather than an obligation. The country joins
    Iceland, which connected to TIPS in June, in extending the reach of European instant
    payments infrastructure beyond the currency union''s formal borders.


    For the broader European instant payments ecosystem, each new country connection
    strengthens the network effect that underpins the regulation''s ambition of pan-European
    reach. Montenegro''s integration is a practical step, but the accumulating momentum
    of non-eurozone connections to TIPS signals that the infrastructure is becoming
    a de facto standard beyond its original jurisdictional scope.

    '
  editorial_note: 'This advances the previously covered story of Montenegro''s instant
    payments law (July 7) to actual go-live, with named banks now processing transactions
    on TIPS — a genuinely subsequent stage.

    '
  sources: '[Adriatic Bank successfully introduced instant payments: Transfer money
    in just a few seconds](https://en.vijesti.me/marketing/business-marketing/818699/Adriatic-Bank-successfully-introduced-instant-payments--money-transfer-in-just-a-few-seconds-promo)
    — Vijesti | [Lovćen Banka launches instant payments TIPS Clone](https://en.vijesti.me/marketing/business-marketing/818652/Lovcen-Bank-launches-instant-payments-tips-clone-promo)
    — Vijesti'
  verification:
    verified: false
    warnings:
    - Headline states Montenegro banks went 'live on TIPS' but they actually went
      live on TIPS Clone (a Banca d'Italia platform), not the ECB's TARGET Instant
      Payment Settlement system
    - Draft states Iceland 'connected to TIPS in June' but Iceland only signed an
      agreement in June 2026; actual TIPS connection is scheduled for 2028
- headline: 'BIS reports rapid scaling of open finance adoption globally

    '
  standfirst: 'A new Bank for International Settlements assessment finds open finance
    adoption accelerating across multiple jurisdictions, providing a data point for
    policymakers and industry participants tracking the shift from open banking to
    broader data-sharing frameworks.

    '
  body: 'The Bank for International Settlements has published findings indicating
    that open finance adoption is scaling rapidly, driven by growth in digital payments
    and expanding regulatory frameworks. The assessment covers the broadening of data-sharing
    mandates beyond traditional bank account information into areas such as insurance,
    investments and pensions.


    The BIS report lands as several jurisdictions are actively extending their frameworks.
    Switzerland recently expanded its open finance regime to cover pension data, the
    UK chancellor has announced an open finance consultation focused on SME lending,
    and the EU''s investor data-sharing proposal applies open finance logic to capital
    markets. The BIS assessment provides cross-jurisdictional evidence that these
    individual moves reflect a global trend rather than isolated national experiments.


    For European payments and open banking professionals, the BIS''s institutional
    endorsement of the scaling trend carries weight with policymakers and may accelerate
    regulatory timelines. The report''s framing of open finance as a natural extension
    of digital payment growth, rather than a standalone regulatory initiative, reinforces
    the case that data-sharing infrastructure is becoming embedded in the payments
    value chain.

    '
  editorial_note: 'A BIS assessment on open finance scaling is material for the European
    audience given active legislative programmes in the UK, EU and Switzerland; the
    BIS''s institutional authority makes this more than routine commentary.

    '
  sources: '[Bank for International Settlements Says Open Finance Adoption is Rapidly
    Scaling](https://coinfomania.com/bank-for-international-settlements-says-open-finance-adoption-is-rapidly-scaling/)
    — Coinfomania'
  verification:
    verified: false
    warnings:
    - Core BIS report was published March 30, 2026 (84 days old, exceeds 5-day recency
      threshold)
    - UK Chancellor's announcement (July 14, 2026) commits to consult in 2027, not
      to launch consultation now
    - Switzerland's pension data expansion (June 17, 2026) was over a month ago, contradicting
      'recently expanded' framing
- headline: 'UK parliamentary inquiry examines £1bn in rejected crypto transactions

    '
  standfirst: 'A UK all-party parliamentary group is investigating banking barriers
    facing cryptocurrency firms, with evidence showing over £1 billion in rejected
    payments including transactions initiated through open banking.

    '
  body: 'A UK parliamentary group is examining the scale of banking access problems
    for cryptocurrency businesses, with evidence indicating that more than £1 billion
    in transactions have been rejected. The blocked payments span both card transactions
    and transfers initiated through open banking, raising questions about whether
    de-banking practices are creating systemic barriers to lawful crypto activity
    in the UK.


    The inquiry sits alongside the UK government''s broader payments modernisation
    agenda, which includes consultations on stablecoin regulation and open banking
    reform. The Bank of England recently dropped individual holding caps in its stablecoin
    regulatory framework, signalling a more accommodating stance towards digital assets,
    but the parliamentary evidence suggests that bank-level risk appetite has not
    shifted to match.


    The tension between regulatory liberalisation at the policy level and conservative
    risk management at the bank level is a recurring theme across European markets.
    For open banking providers, the investigation highlights that payment initiation
    services can be caught in the same de-risking sweep as direct banking relationships,
    potentially limiting open banking''s utility as an alternative funding rail for
    digital asset businesses.

    '
  editorial_note: 'The intersection of crypto de-banking with open banking payment
    rejection is directly relevant to the audience; parliamentary scrutiny may influence
    how banks apply risk policies to open banking-initiated payments.

    '
  sources: '[UK parliamentary group probes banking barriers for crypto firms](https://es.tradingview.com/news/cointelegraph:6a7cce6de094b:0-uk-parliamentary-group-probes-banking-barriers-for-crypto-firms/)
    — TradingView | [UK Crypto Debanking: Parliament Investigates as £1B in Transactions
    Rejected](https://www.techtimes.com/articles/321149/20260721/uk-crypto-debanking-parliament-investigates-1b-transactions-rejected.htm)
    — Techtimes'
  verification:
    verified: true
