title: 'Georgia open finance; Saudi open banking; Wero expansion; digital euro costs

  '
social_post: 'Georgia taps the Bank of Korea for open finance expertise, Saudi Arabia
  hits 33 licensed payment firms, and banks quietly count the cost of the digital
  euro. Today''s briefing: {link}

  '
stories:
- headline: 'Georgia''s central bank partners with Bank of Korea on open finance design

    '
  standfirst: 'The National Bank of Georgia is drawing on Korean expertise to build
    its open finance framework, formalising a bilateral agreement announced this week.

    '
  body: 'The National Bank of Georgia (NBG) and the Bank of Korea have signed a bilateral
    agreement under the Knowledge Partnership Program to develop an open finance ecosystem
    in Georgia. Korean experts will work alongside the NBG team on the concept and
    design of the framework.


    Georgia has been active in digital financial infrastructure this year, having
    partnered with the Bank of Korea in June on a separate central bank digital currency
    initiative and launched a lari-backed stablecoin with Tether in May. The open
    finance agreement extends this relationship into data-sharing infrastructure,
    an area where South Korea''s regulatory experience — particularly its MyData framework
    — offers a relatively mature reference model.


    For a small economy with an ambitious fintech agenda, the choice of partner is
    telling. Georgia is looking to jurisdictions with functioning open finance regimes
    rather than defaulting to European or US models, both of which remain works in
    progress.

    '
  editorial_note: 'This follows the previously covered Georgia-Korea partnership but
    covers a materially new development — the open finance bilateral agreement, distinct
    from the earlier CBDC cooperation.

    '
  sources: '[NBG, Bank of Korea sign bilateral agreement within Knowledge Partnership
    Program](https://1tv.ge/lang/en/news/nbg-bank-of-korea-sign-bilateral-agreement-within-knowledge-partnership-program/)
    — 1TV'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst: ''formalising a bilateral agreement announced this week'' — uses
      vague temporal reference ''this week'' when a specific date should be used per
      house style rules on temporal references'
    - 'Body: ''having partnered with the Bank of Korea in June on a separate central
      bank digital currency initiative'' — uses vague temporal reference ''in June''
      when a specific date is available; should use precise date (eg, ''on June 15'')
      per house style rules'
    - 'Headline and body: ''open finance'' — abbreviation/acronym not spelled out
      on first use; while ''open finance'' may be a standard term, if it''s treated
      as requiring definition elsewhere in the piece, consider whether it needs introduction'
    - 'Body: ''particularly its MyData framework'' — introduces ''MyData framework''
      without spelling out what MyData stands for on first reference, inconsistent
      with the rule requiring abbreviations/acronyms to be spelled out in full on
      first use'
  verification:
    verified: false
    stale: false
    duplicate: true
    warnings:
    - Draft claims Georgia partnered with Bank of Korea on CBDC initiative in June
      2026, but search finds only an open finance/cashless payments partnership (no
      CBDC agreement). Georgia's CBDC work (Digital Lari) is partnered with Ripple,
      not Bank of Korea. Story also appears in previously covered list dated 2026-07-23
      as same event.
  revision:
    replaced: false
    summary:
    - Flagged as duplicate coverage but no unused candidate was available — kept as-is,
      editor should review.
- headline: Saudi Arabia licences 33rd payment firm as open banking regime scales
  standfirst: SAMA's authorisation of Malaa Company for open banking services brings
    the total number of licensed payment firms in the kingdom to 33.
  body: 'The Saudi Central Bank (SAMA) has licensed Malaa Company for Information
    Technology to provide open banking services, bringing the total number of licensed
    payment services companies in Saudi Arabia to 33.


    Saudi Arabia''s open banking framework, launched in 2022, has moved through its
    phases more quickly than many Gulf peers. The kingdom''s approach has been to
    license a broad range of providers — account information and payment initiation
    — while keeping regulatory oversight centralised under SAMA. At 33 licensed firms,
    the regime is generating genuine commercial interest rather than remaining a regulatory
    showcase.


    The Gulf''s open banking landscape is increasingly competitive. Bahrain was the
    early mover, but Saudi Arabia''s larger market and steady licensing pace are drawing
    more providers. For European open banking firms eyeing international expansion,
    the Saudi market''s regulatory clarity and scale make it one of the more plausible
    entry points in the region.'
  editorial_note: Saudi Arabia's open banking licensing milestones are relevant to
    a European audience tracking international open finance expansion and potential
    market opportunities beyond PSD2/PSD3 jurisdictions.
  sources: '[SAMA Licenses Malaa Company for Information Technology to Provide Open
    Banking Services](https://www.spa.gov.sa/en/N2639494) — Spa'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst: ''marks steady expansion'' — this announces significance before
      making a substantive point. Rewrite directly with the substantive claim (e.g.,
      ''Malaa Company''s licence brings the total...'' or similar).'
    - 'Body, paragraph 2: ''Reaching 33 licensed firms signals that the regime is
      generating genuine commercial interest rather than remaining a regulatory showcase.''
      — This is hedged analysis (''signals that'') rather than a direct statement.
      State the substantive point directly without the qualifying language.'
    - 'Body, paragraph 3: ''Saudi Arabia''s larger market and more aggressive licensing
      pace are drawing more providers.'' — Avoid vague comparison (''more aggressive'').
      Either quantify the pace or describe it directly without comparative language
      that isn''t substantiated in the text.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    summary:
    - Standfirst rewritten to lead with the substantive fact ('brings the total number
      of licensed payment firms in the kingdom to 33') rather than announcing significance
      with 'marks steady expansion'.
    - 'Body paragraph 2: replaced hedged ''Reaching 33 licensed firms signals that
      the regime is generating genuine commercial interest'' with direct statement
      ''At 33 licensed firms, the regime is generating genuine commercial interest''.'
    - 'Body paragraph 3: replaced unsubstantiated comparative ''more aggressive licensing
      pace'' with ''steady licensing pace'' to avoid vague comparison not supported
      by data in the text.'
- headline: 'Banks weigh implementation costs as digital euro pilot phase begins

    '
  standfirst: 'With 36 providers selected for the ECB''s digital euro pilot, banks
    are now confronting the practical question of whether the investment case justifies
    the cost.

    '
  body: 'As the ECB''s digital euro moves into its pilot phase with 36 selected payment
    providers, a quieter debate is intensifying among banks about the cost-benefit
    calculus of participation. Industry analysis from Tieto and others highlights
    that banks face significant technology investment to support the digital euro
    alongside existing instant payment infrastructure, with limited clarity on the
    revenue model.


    The European Parliament''s ECON committee voted in July to advance the digital
    euro regulation to final negotiations, giving the project political momentum.
    But political momentum and commercial viability are different things. Banks must
    build new systems for offline capability, holding limits and privacy controls
    while also completing their SEPA instant payments migration under the EU''s 2025
    regulation. The parallel implementation burden is substantial.


    Trade bodies have already warned that the digital euro''s design could lock out
    open banking providers from key payment flows. For banks, the concern is more
    fundamental: mandatory distribution of a product with capped holdings, no interest
    and regulated fees creates an infrastructure obligation without a clear return.
    The pilot phase will sharpen these calculations considerably.

    '
  editorial_note: 'Builds on earlier coverage of the ECON vote and pilot selection
    by surfacing the commercial cost question banks are now actively grappling with
    — a dimension not previously covered.

    '
  sources: '[Digital euro nears reality but banks weigh cost vs reward](https://fintech.global/2026/07/22/digital-euro-nears-reality-but-banks-weigh-cost-vs-reward/)
    — FinTech Global'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst: ''36 providers selected'' contradicts the body which states ''36
      selected payment providers'' — this is near-verbatim repetition of the same
      phrasing across standfirst and body that should be avoided.'
    - 'Body: ''Industry analysis from Tieto and others highlights'' — ''Tieto'' is
      introduced without explanation of what it is (organization type, role, etc.),
      making it unclear to readers unfamiliar with the entity.'
    - 'Body: ''under the EU''s 2025 regulation'' — vague temporal reference; should
      specify the deadline more precisely (e.g., ''by 2025'') or provide the specific
      date if available.'
    - 'Body: ''The parallel implementation burden is substantial'' — this announces
      significance before making the substantive point rather than stating the point
      directly; the sentence should lead with the concrete impact rather than declaring
      burden to be ''substantial''.'
  verification:
    verified: false
    stale: true
    duplicate: true
    warnings:
    - ECON committee voted June 23, 2026, not July. July 9 was full Parliament plenary
      vote.
    - Core event (ECB selects 36 providers) announced July 14, 2026 - nine days old,
      exceeds 5-day recency threshold
    - Duplicate of 2026-07-15 and 2026-07-16 coverage of ECB's 36-provider selection
      announcement
  revision:
    replaced: false
    summary:
    - Flagged as stale but no unused candidate was available — kept as-is, editor
      should review.
- headline: Viva.com integrates Wero wallet as EPI adds acquiring-side distribution
  standfirst: The Greek-founded payments group's adoption of Wero signals EPI's push
    beyond issuing banks into the merchant acceptance layer.
  body: 'Viva.com, the payments platform in which JPMorgan holds a 48.5% stake, is
    integrating Wero wallet functionality, becoming one of the first acquirer-side
    platforms to adopt the European Payments Initiative''s digital wallet. The move
    extends Wero''s reach beyond the issuing bank relationships that have driven its
    rollout so far.


    EPI''s expansion has followed a deliberate sequence: launch in core markets such
    as Germany and France, build person-to-person payment volumes, then move into
    online and point-of-sale commerce. Viva.com''s integration represents progress
    on the commerce side, giving Wero a route to merchant acceptance across the 24
    European markets where Viva.com operates.


    Wero''s commercial viability depends on merchant adoption, not just consumer uptake.
    With Rabobank beginning iDEAL-to-Wero migration in the Netherlands and Austrian
    banks joining EPI in June, the scheme is building breadth. Adding acquiring infrastructure
    is the piece that turns a wallet into a payment method merchants will accept at
    scale.'
  editorial_note: Wero's expansion into acquirer-side distribution through Viva.com
    is a meaningful new dimension beyond the issuing-bank and P2P rollouts previously
    covered.
  sources: '[Viva.com adds Wero wallet after joining European Payments Initiative](https://finance.yahoo.com/markets/currencies/articles/viva-com-adds-wero-wallet-074624419.html)
    — Yahoo Finance'
  style_check:
    compliant: false
    warnings:
    - 'Body paragraph 3 opens with ''The acquirer angle matters because'' — this is
      a significance-flagging construction that announces importance before making
      the substantive point. The rule states: ''Never flag significance explicitly.
      Do not write sentences that announce importance before explaining it.'' Rewrite
      to lead with the substantive claim directly, such as: ''Wero''s commercial viability
      depends on merchant adoption, not just consumer uptake, making the acquirer
      angle critical.'''
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Story states 'Viva.com, the payments platform owned by JPMorgan since 2024'
      but JPMorgan acquired 48.5% stake in Jan 2022 (closed Dec 2022), not since 2024,
      and does not own the company outright (WeRealize owns 51.5%)
  revision:
    replaced: false
    summary:
    - 'Corrected JPMorgan ownership claim: changed ''owned by JPMorgan since 2024''
      to ''in which JPMorgan holds a 48.5% stake'', reflecting the minority stake
      acquired (closed December 2022) rather than outright ownership.'
    - Removed significance-flagging opener 'The acquirer angle matters because' from
      paragraph 3 and led directly with the substantive claim about Wero's commercial
      viability depending on merchant adoption.
