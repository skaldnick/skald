title: 'CFPB confirmation hearing; FCA picks Anthropic; hotel chains adopt open banking
  cards

  '
social_post: 'CFPB confirmation hearing puts open banking fees centre stage, FCA taps
  Anthropic for its AI sandbox, and hotel chains are quietly building open banking
  into travel spending. Today''s briefing: {link}

  '
stories:
- headline: 'CFPB confirmation hearing puts open banking fees and AI oversight in
    focus

    '
  standfirst: 'Brian Johnson''s Senate hearing to lead the CFPB is testing whether
    the bureau''s rewritten open banking rule, with its controversial data fees for
    fintechs, will survive political scrutiny.

    '
  body: 'The Senate Banking Committee held a confirmation hearing on July 22 for Brian
    Johnson, nominated to serve as permanent director of the Consumer Financial Protection
    Bureau. Open banking data fees, a centrepiece of the bureau''s revised rule published
    in late June under acting director Russell Vought, featured prominently in questioning.


    The revised rule narrowed the scope of data banks must share and introduced fees
    that fintechs would pay to access consumer information, a significant departure
    from the original 2024 rule that prohibited such charges. Industry trade groups
    representing credit unions have pressed for a voice in shaping how the final framework
    works in practice, while fintech lobbies have argued the fee structure violates
    the Trump administration''s own executive order on reducing regulatory costs.


    Johnson''s confirmation will determine whether the CFPB pursues this fee-based
    model or revisits it. For European observers, the US approach is diverging sharply
    from the EU and UK frameworks, where API access costs have been a persistent friction
    point but outright data fees on third-party providers remain outside the regulatory
    conversation.

    '
  editorial_note: 'The CFPB confirmation hearing is the next material stage in the
    US open banking saga, following the rule rewrite covered in late June. The hearing
    itself — and the political pressure around data fees — is a genuinely new development
    with direct relevance to how European professionals benchmark their own regulatory
    models.

    '
  sources: '[CFPB director nomination hearing 2026: Live coverage](https://www.americanbanker.com/live-blog/cfpb-director-nomination-hearing-2026-live-coverage)
    — American Banker | [CONSUMER FINANCIAL PROTECTION BUREAU—DCUC wants a voice at
    CFPB ...](https://www.vitallaw.com/news/consumer-financial-protection-bureau-dcuc-wants-a-voice-at-cfpb-confirmation-hearing/blw01273c6e86bc2c4466b632a05d4644320b)
    — VitalLaw.com'
  verification:
    verified: false
    warnings:
    - Story states hearing 'held' on July 22, but Senate Banking Committee hearing
      scheduled for July 23, 2026
    - Story claims revised rule 'published in late June' but as of June 26, 2026 rule
      was still in development with planned release for July
- headline: 'FCA selects Anthropic for second phase of its AI regulatory sandbox

    '
  standfirst: 'The UK regulator''s decision to partner with Anthropic signals a shift
    from broad AI policy statements to hands-on testing, with implications for how
    AI is supervised in payments and financial services.

    '
  body: 'The Financial Conduct Authority is partnering with Anthropic, the US AI firm
    behind the Claude model, for the second phase of its AI sandbox. The programme
    is designed to let the regulator test how AI tools function in supervised financial
    services settings before writing formal rules.


    The FCA published its AI review earlier in July, placing open finance and agentic
    payments squarely within scope. Selecting Anthropic — rather than a European AI
    developer — as the sandbox partner suggests the regulator is prioritising capability
    over provenance in its testing work. The choice also reflects the reality that
    the most advanced large language models used in financial services originate outside
    Europe.


    For payments firms exploring agentic commerce and AI-driven processes, the sandbox''s
    findings will shape what the FCA considers acceptable use. The second phase is
    expected to examine how AI interacts with regulated activities such as payment
    initiation, risk assessment and customer communications.

    '
  editorial_note: 'This moves forward the FCA''s AI-in-financial-services agenda reported
    in early July. The specific selection of Anthropic is new and consequential —
    it determines the practical direction of the sandbox and has direct bearing on
    payments firms building AI-driven products under FCA supervision.

    '
  sources: '[LATEST: FCA taps Anthropic for AI sandbox second phase](https://www.amlintelligence.com/2026/07/fca-taps-anthropic-for-ai-sandbox-second-phase/)
    — AML Intelligence'
  verification:
    verified: true
    warnings: []
- headline: 'Major hotel chains launch open banking debit cards for UK travellers

    '
  standfirst: 'Hilton, Marriott and IHG have each launched UK debit cards built on
    open banking rails, using Currensea''s infrastructure to offer real-time exchange
    rates and loyalty integration at the point of spend.

    '
  body: 'Three of the world''s largest hotel groups — Hilton, Marriott and IHG — have
    launched co-branded debit cards in the UK that use open banking connections to
    customers'' existing bank accounts rather than requiring a separate prepaid balance
    or credit facility. The cards are built on infrastructure from Currensea, a UK
    fintech that links directly to users'' current accounts.


    The model bypasses traditional card issuance entirely. Customers connect their
    bank account via open banking, and the Currensea-powered card draws funds in real
    time, offering foreign exchange rates as low as 0.5% on the top-tier product.
    Loyalty points accrue directly on spending, creating a proposition that competes
    with travel credit cards from the major banks.


    The convergence of three competing hotel brands on the same open banking model
    is notable not for the individual launches but for what it reveals about where
    embedded finance is finding traction. Travel spending — high-value, cross-border,
    loyalty-driven — is proving a natural fit for open banking distribution beyond
    the pure fintech segment.

    '
  editorial_note: 'This is a concrete, commercially significant example of open banking
    infrastructure being adopted by major non-financial brands in a way that directly
    challenges incumbent card propositions. It illustrates where embedded open banking
    is gaining real consumer-facing traction.

    '
  sources: '[Hilton, Marriott, and IHG Have All Launched UK Debit Cards. Here''s Why.](https://skift.com/2026/07/22/hilton-marriott-and-ihg-have-all-launched-uk-debit-cards-heres-why/)
    — Skift'
  verification:
    verified: false
    warnings:
    - IHG uses Revolut's ecosystem, not Currensea's open banking model as the draft
      implies. Draft states all three use 'open banking connections to customers'
      existing bank accounts' but Skift source clarifies IHG 'taps Revolut's 75-million-customer
      ecosystem as a customer acquisition channel' while only Hilton and Marriott
      use Currensea
- headline: 'Georgia''s central bank partners with Bank of Korea on open finance framework

    '
  standfirst: 'The National Bank of Georgia is working with South Korean counterparts
    to design an open finance ecosystem, extending a bilateral relationship that already
    produced the country''s lari-backed stablecoin initiative.

    '
  body: 'The National Bank of Georgia and the Bank of Korea have signed a bilateral
    agreement under which Korean experts will help design an open finance framework
    for Georgia. The collaboration falls within the Knowledge Partnership Program,
    a longer-standing arrangement between the two institutions.


    Georgia has been building its digital financial infrastructure at an unusual pace
    for its size. The country launched a lari-backed stablecoin with Tether in May,
    and the central bank is now looking to establish the data-sharing rules and technical
    standards needed for an open finance ecosystem. South Korea''s own open banking
    system, which has seen rapid consumer adoption since its 2019 launch, provides
    a relatively mature model to draw from.


    The partnership illustrates how open finance frameworks are spreading through
    bilateral technical cooperation rather than solely through EU or UK regulatory
    influence. For European providers, Georgia''s emerging infrastructure represents
    both a potential market and a test of whether open finance models can be adapted
    outside the EU''s regulatory perimeter.

    '
  editorial_note: 'Georgia is building an unusually ambitious digital finance stack
    for a country of its size, and the Korean partnership adds a new dimension. The
    story is relevant because it shows open finance frameworks propagating through
    non-EU channels, which has strategic implications for European providers and standard-setters.

    '
  sources: '[NBG, Bank of Korea sign bilateral agreement within Knowledge Partnership
    Program](https://1tv.ge/lang/en/news/nbg-bank-of-korea-sign-bilateral-agreement-within-knowledge-partnership-program/)
    — 1TV'
  verification:
    verified: false
    warnings:
    - Draft states Georgia 'launched' a lari-backed stablecoin in May. Sources confirm
      May 25, 2026 announcement of plans to launch GEL₮, but result index 10-1 states
      'As of May 2026, no official launch date for GEL₮ has been publicly confirmed'
      — inaccuracy in launch vs. announcement
