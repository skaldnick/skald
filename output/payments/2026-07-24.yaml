title: 'FDATA write access; ECB card data; Viva adds Wero; FCA sandbox phase two

  '
social_post: 'FDATA wants to govern write access before open finance runs ahead of
  itself. Plus: euro area card payments hit record highs, and the FCA''s AI sandbox
  gets its second cohort. {link}

  '
stories:
- headline: 'FDATA proposes principles-led framework for open finance write access

    '
  standfirst: 'The Financial Data and Technology Association is pushing regulators
    to adopt a governance model for payment initiation and other write functions before
    open finance mandates expand further.

    '
  body: 'The Financial Data and Technology Association (FDATA) has published a framework
    calling for principles-based regulation of write access in open finance, arguing
    that the current read-focused model needs a structured extension before new use
    cases such as variable recurring payments and account switching scale across markets.


    Steve Boms, FDATA''s executive director, framed the proposal as an effort to give
    consumers and small business owners "meaningful control over their financial lives"
    while avoiding the prescriptive, country-specific rules that have slowed earlier
    phases of open banking implementation. The framework advocates for consistent
    liability allocation, clear consent models and interoperability standards that
    would apply across payment initiation and data-sharing functions.


    The timing aligns with several parallel developments. HM Treasury''s consultation
    on UK payments regulation proposes creating a statutory access right for variable
    recurring payments, and the European Commission''s Payment Services Regulation
    work is addressing similar questions about third-party access to payment accounts.
    FDATA''s intervention aims to shape those conversations before the legislative
    detail is settled.

    '
  editorial_note: 'Write access governance is an under-discussed but critical policy
    question as open finance expands beyond read-only data sharing; FDATA''s framework
    is a concrete industry proposal ahead of live regulatory consultations in the
    UK and EU.

    '
  sources: '[FDATA calls for a principles-led framework for the next generation of
    Open Finance](https://www.openbankingexpo.com/news/fdata-calls-for-a-principles-led-framework-for-the-next-generation-of-open-finance/)
    — Openbankingexpo'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst: ''The Financial Data and Technology Association is pushing regulators''
      — the body text uses the abbreviation FDATA immediately on first mention without
      spelling it out in full first, violating the rule that abbreviations must be
      spelled out in full with abbreviation in parentheses on first use in the body,
      even if mentioned in the standfirst.'
    - 'Body: ''The timing aligns with several parallel developments.'' — This is a
      scene-setting subordinate clause that should be moved later in the sentence
      or reframed to lead with the substantive point rather than announcing that timing
      is notable, which violates the rule against explicitly flagging significance.'
