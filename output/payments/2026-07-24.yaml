- headline: 'FCA names second cohort for AI regulatory sandbox with Anthropic support

    '
  standfirst: 'The Financial Conduct Authority''s second AI sandbox group includes
    open banking and crypto-adjacent firms, with Anthropic providing technical infrastructure
    for testing.

    '
  body: 'The Financial Conduct Authority (FCA) has published details of the second
    cohort of its AI regulatory sandbox, with Anthropic providing technical support
    for the testing programme. Participants include TrueLayer, the open banking payments
    platform, and Sardine, a fraud detection firm with crypto-adjacent operations,
    among others working at the intersection of AI and regulated financial services.


    The sandbox is designed to let firms test AI applications against regulatory requirements
    in a controlled environment before deploying them commercially. The FCA''s decision
    to partner with Anthropic, one of the leading foundation model developers, signals
    a preference for working directly with AI infrastructure providers rather than
    relying solely on in-house technical capacity to evaluate submissions.


    The FCA flagged AI''s intersection with open finance and agentic payments as a
    priority area in a review published earlier this month. The sandbox programme
    is the operational mechanism through which the regulator intends to build its
    understanding of how these technologies behave in practice, rather than relying
    solely on desk-based policy analysis.

    '
  editorial_note: 'Builds on the previously covered FCA AI review by identifying the
    specific firms and AI partner involved in the second sandbox cohort — a concrete
    step in the regulator''s approach to AI in financial services.

    '
  sources: '[FCA reveals details of second Supercharged Sandbox group with support
    from Anthropic](https://www.openbankingexpo.com/news/fca-reveals-details-of-second-supercharged-sandbox-group-with-support-from-anthropic/)
    — Openbankingexpo'
  style_check:
    compliant: false
    warnings:
    - Body text uses 'has published' (simple present) instead of 'is publishing' (present
      continuous) for a newly announced action, violating the tense preference rule
      for newly announced arrangements.
    - Body text uses 'among others' after named examples introduced without 'such
      as', which is vague; the rule requires either 'such as' for non-exhaustive lists
      or specific counts.
    - 'The phrase ''The FCA''s decision to partner with Anthropic... signals a preference''
      announces significance before making the substantive point, violating the rule
      against flagging significance explicitly. Consider: ''By partnering with Anthropic
      rather than relying solely on in-house technical capacity, the FCA signals a
      preference for working directly with AI infrastructure providers.'''
