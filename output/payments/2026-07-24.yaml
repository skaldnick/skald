- headline: Viva adds Wero wallet payments as EPI broadens merchant acceptance
  standfirst: Viva's integration of Wero illustrates EPI's strategy of reaching merchants
    through existing acquirers rather than building direct relationships.
  body: 'Viva is integrating Wero wallet payments for its merchant base after joining
    the European Payments Initiative (EPI). The integration gives EPI''s wallet access
    to Viva''s network of merchants across multiple European markets, extending Wero''s
    reach beyond the bank-to-consumer transfers that have formed its initial use case.


    EPI''s merchant acceptance strategy depends heavily on partnerships with established
    acquirers and payment processors rather than signing merchants directly. Viva''s
    addition follows similar integrations by other processors and illustrates how
    EPI is attempting to build the ubiquity that a consumer-facing payment method
    requires to compete with card networks. Austrian banking groups joined EPI in
    June, making it live in five markets.


    Whether merchant acceptance translates into consumer usage is unresolved. Wero''s
    transaction volumes remain far below those of card networks, and the wallet must
    demonstrate a compelling checkout experience to shift behaviour. Rabobank''s ongoing
    migration of iDEAL transactions to Wero in the Netherlands is the most significant
    live test of that proposition.'
  editorial_note: Follows up on previous Viva/Wero coverage with the Yahoo Finance
    source confirming the integration; chosen because each new acquirer integration
    is a concrete data point on EPI's merchant rollout strategy.
  sources: '[Viva.com adds Wero wallet after joining European Payments Initiative](https://finance.yahoo.com/markets/currencies/articles/viva-com-adds-wero-wallet-074624419.html)
    — Yahoo Finance'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst: ''The Greek-headquartered payment processor'' — use the person''s
      name and title on first reference rather than a descriptor. The standfirst should
      identify Viva or its leadership by name.'
    - 'Body: ''Viva.com is integrating'' — first mention uses full branded name ''Viva.com'',
      but headline uses short form ''Viva''. Establish which form is the recognisable
      short form and use it consistently after first mention. The short form should
      be used in the body''s first sentence if ''Viva'' is the recognisable short
      form.'
    - 'Body: ''The move gives EPI''s wallet access'' — this is a vague temporal phrase
      that announces development before explaining substance. Lead directly with the
      substantive point about merchant reach rather than ''The move''.'
    - 'Body: ''The practical test remains whether merchant acceptance translates into
      consumer usage.'' — this hedges the substantive point with a scene-setter. Lead
      directly with the substantive claim about the relationship between merchant
      acceptance and consumer usage.'
    - 'Body: ''Wero''s current transaction volumes are modest relative to card networks''
      — ''modest'' is vague and judgmental. Use specific metrics or remove the qualifier
      to state the fact directly.'
    - 'Body: ''Austrian banking groups joined EPI in June'' — use specific date (eg,
      ''on June 15'') rather than vague month reference when available. If only the
      month is known, note that; ''in June'' is acceptable only if the specific date
      cannot be established.'
