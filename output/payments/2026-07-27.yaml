- headline: Mastercard broadens virtual card platform for B2B payments
  standfirst: Enhancements to Mastercard's In Control platform reflect continued investment
    in virtual card infrastructure as card networks defend B2B territory against account-to-account
    alternatives.
  body: 'Mastercard has announced a series of enhancements to its In Control virtual
    card number platform, expanding functionality for corporate buyers and their suppliers.
    The updates are designed to make virtual cards more scalable for B2B payment flows.


    Account-to-account competition in B2B payments is intensifying. NMI''s acquisition
    of Dwolla, PaidBy''s partnership with Mastercard itself on cross-border account-to-account
    payments, and the broader push toward instant payment rails for business transactions
    all represent alternatives to card-based B2B settlement. Mastercard''s response
    is to deepen the virtual card proposition rather than cede the segment.


    Virtual cards have gained traction in corporate travel, procurement and accounts
    payable because they offer controls, data and reconciliation advantages over traditional
    invoicing. The platform investment suggests Mastercard treats B2B virtual cards
    as a durable revenue line, not a transitional product.'
  editorial_note: Selected because Mastercard's B2B virtual card investment illustrates
    how card networks are defending commercial payment volumes against the account-to-account
    alternatives gaining ground in Europe.
  sources: '[Mastercard expands virtual card programme](https://www.finextra.com/pressarticle/110490/mastercard-expands-virtual-card-programme?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
