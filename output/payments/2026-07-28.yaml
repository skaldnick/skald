- headline: 'Monzo takes pension transfer speed campaign to Parliament

    '
  standfirst: 'The neobank is lobbying MPs to mandate faster pension transfers, applying
    consumer fintech pressure to a sector where delays of weeks remain standard.

    '
  body: 'Monzo has brought its campaign for faster pension transfers to Parliament,
    pressing MPs to address an area where processing times of several weeks remain
    common despite digitalisation across most other financial services. The initiative
    targets what Monzo frames as an unnecessary friction point for consumers seeking
    to consolidate retirement savings.


    Pension transfers sit at the intersection of open finance ambitions and practical
    consumer experience. The FCA''s open finance roadmap, published in April, explicitly
    includes investment and pension data within its 2030 scope, and the chancellor''s
    July announcement on open finance flagged SME lending but left pensions as an
    area where progress has been slower than in payments or current account data sharing.


    Monzo''s parliamentary engagement reflects a broader pattern of neobanks using
    their consumer brand and lobbying capacity to push policy change in adjacent financial
    services, moving beyond their core payments and banking products. Whether Parliament
    acts on transfer speeds will depend on the pensions industry''s response and the
    regulatory appetite at both the FCA and the Pensions Regulator.

    '
  editorial_note: 'Monzo''s parliamentary lobbying on pension transfers connects directly
    to the UK''s open finance agenda and illustrates how fintechs are expanding their
    policy influence beyond core payments.

    '
  sources: '[Cansen Ergun (DefineX): ''Open finance is reshaping the financial services
    sector''](https://www.consultancy-me.com/news/amp/13883/cansen-ergun-definex-open-finance-is-reshaping-the-financial-services-sector)
    — Consultancy-me'
