stories:
- headline: 'Wise refiles US bank charter application after OCC rejection

    '
  standfirst: 'The renewed application signals Wise''s determination to secure direct
    access to US payment rails, even as it shifts its primary listing from London
    to New York.

    '
  body: 'Wise has submitted a fresh application for a US bank charter to the Office
    of the Comptroller of the Currency (OCC), following an earlier rejection. A charter
    would give the cross-border payments firm direct access to US clearing and settlement
    infrastructure rather than relying on banking partners, reducing costs and improving
    control over its payments corridor.


    The refiling comes as Wise prepares to move its primary stock market listing from
    London to the US, a decision announced in April. Together, the two moves amount
    to a strategic reorientation toward the US market, where Wise sees its largest
    growth opportunity in both consumer and business payments. Direct access to the
    Federal Reserve''s payment systems would strengthen its competitive position against
    incumbents and newer entrants alike.


    The OCC''s reasons for the initial rejection have not been made public. Securing
    a US bank charter remains a difficult path for fintechs, with regulators maintaining
    high capital and compliance thresholds, though the current administration has
    signalled a more accommodating stance toward fintech applications.

    '
  editorial_note: 'Wise''s second attempt at a US bank charter, combined with its
    listing move, marks a significant strategic pivot for one of Europe''s most prominent
    payments fintechs and has implications for the broader fintech-to-bank trajectory.

    '
  sources: '[Cansen Ergun (DefineX): ''Open finance is reshaping the financial services
    sector''](https://www.consultancy-me.com/news/amp/13883/cansen-ergun-definex-open-finance-is-reshaping-the-financial-services-sector)
    — Consultancy-me'
