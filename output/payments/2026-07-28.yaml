- headline: 'Lloyds and Barclays customers hit by online payments outage

    '
  standfirst: 'A second major UK payments disruption in a month underscores persistent
    infrastructure fragility, coming weeks after a Worldpay outage during a World
    Cup match.

    '
  body: 'Customers of Lloyds Banking Group and Barclays reported widespread problems
    making online payments on July 27, with the disruption lasting several hours.
    The banks confirmed the issue but have not disclosed its cause or whether it was
    linked to shared infrastructure.


    The outage is the second significant UK payments failure in recent weeks, following
    a Worldpay disruption on June 25 that knocked out card payments during a high-profile
    sporting event. Repeated outages strengthen the case being made by Pay.UK and
    the Treasury in their ongoing consultation on next-generation retail payments
    infrastructure, where resilience is a central theme.


    For an industry promoting pay-by-bank and instant payments as alternatives to
    cards, reliability failures at major banks are a reputational problem. Consumer
    confidence in account-to-account payments depends on the underlying banking infrastructure
    working consistently, and each outage makes that harder to demonstrate.

    '
  editorial_note: 'The second UK payments outage in a month is directly relevant to
    ongoing infrastructure consultations and to the credibility of pay-by-bank as
    a card alternative.

    '
  sources: '[Outage leaves UK bank customers unable to make payments](https://www.finextra.com/newsarticle/48151/outage-leaves-uk-bank-customers-unable-to-make-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst: ''coming weeks after'' should be moved later in the sentence per
      rule on subordinate clauses. Lead with the substantive news (second major disruption
      underscores fragility) before scene-setting.'
    - 'Body: ''account-to-account payments'' should be spelled out as ''account-to-account
      (A2A) payments'' on first use per abbreviation rules, since A2A does not recur
      in the piece and is non-standard.'
    - 'Body: ''account-to-account payments'' - this is a non-standard abbreviation
      that should be spelled out without parentheses since A2A never appears again
      in the text per the rule ''Only include an abbreviation or initialism in parentheses
      after a term if that abbreviation is used again later in the same piece.'''
