- headline: PayPoint reports steady open banking revenue as merchant services dip
  standfirst: First-quarter results show PayPoint's open banking and digital payments
    division growing 4.1% while merchant services and Love2shop declined, underscoring
    uneven performance across the group's payment lines.
  body: 'PayPoint reported first-quarter results showing its digital payments and
    open banking division generated £3.2 million in revenue, up 4.1% year on year
    from £3.1 million. Nick Wiles, PayPoint''s chief executive, pointed to a growing
    pipeline of new business in the segment. Merchant services fell 6.1% to £7.7 million,
    while the Love2shop voucher business dropped 10.3% to £7.0 million.


    The divergence across PayPoint''s divisions reflects a pattern visible elsewhere
    in UK payments: open banking-adjacent revenue streams are growing modestly but
    consistently, while traditional merchant acquiring faces pricing and volume pressure.
    PayPoint''s open banking revenues remain small in absolute terms, but the segment
    is now the only one of the group''s three main divisions posting growth.


    PayPoint completed its acquisition of AperiData in June, giving it additional
    capabilities in open banking. Access PaySuite separately acquired Ordo''s open
    banking infrastructure on June 17, adding request-to-pay and payment initiation
    capabilities. The real test for PayPoint''s open banking ambitions is whether
    the AperiData deal accelerates growth in subsequent quarters.'
  editorial_note: PayPoint's Q1 results offer a useful real-world data point on the
    commercial trajectory of open banking in the UK — modest but positive growth set
    against declines in traditional payment segments.
  sources: '[1st Quarter Results](https://www.globenewswire.com/news-release/2026/07/29/3334974/0/en/1st-quarter-results.html)
    — GlobeNewswire | [1st Quarter Results](https://finance.yahoo.com/markets/stocks/articles/1st-quarter-results-060000068.html)
    — Yahoo Finance'
