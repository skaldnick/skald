- headline: 'Visa cuts 2,600 jobs as AI reshapes its operating model

    '
  standfirst: 'Technology and product roles bear the brunt of a 7% workforce reduction
    as Visa restructures around AI-driven operations.

    '
  body: 'Visa is cutting approximately 2,600 positions, representing 7% of its global
    workforce, with technology and product teams most affected. The restructuring
    reflects the company''s shift towards AI-driven operations across fraud detection,
    network management and product development.


    The cuts come during a period of strategic repositioning for Visa in Europe. The
    company pledged €500 million in European investment earlier this year as the sovereignty
    debate intensified, and has launched agentic payment capabilities and a threat
    intelligence platform in the region. Reducing headcount while investing in AI
    capacity suggests Visa sees automation as central to defending margins as account-to-account
    alternatives gain ground.


    For European payments professionals, the restructuring signals that the major
    card networks are entering a phase where AI deployment is not an add-on but a
    driver of organisational design. Visa''s willingness to cut deeply into its technical
    workforce, rather than trimming support functions, indicates the company views
    its current technology stack as due for replacement rather than augmentation.

    '
  editorial_note: 'Visa''s restructuring is the largest headcount move by a major
    network this year and carries implications for European operations, vendor relationships
    and the broader competitive dynamic between card networks and emerging payment
    rails.

    '
  sources: '[Tech jobs go as Visa cuts workforce by 7%](https://www.finextra.com/newsarticle/48161/tech-jobs-go-as-visa-cuts-workforce-by-7?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
