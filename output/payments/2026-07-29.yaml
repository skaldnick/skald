- headline: 'UK open banking crosses one billion payments as VRPs accelerate

    '
  standfirst: 'The milestone confirms open banking''s shift from regulatory experiment
    to mainstream payment rail, with variable recurring payments driving the latest
    surge.

    '
  body: 'Open banking payments in the UK have passed one billion cumulative transactions,
    a threshold reached as variable recurring payments (VRPs) gain traction alongside
    single immediate payments. The growth trajectory has steepened markedly since
    the UK Payments Initiative launched earlier this year, giving open banking a domestic
    scheme structure for the first time.


    VRPs, which allow consumers to authorise ongoing payments within agreed parameters,
    are proving to be the mechanism that moves open banking beyond one-off use cases.
    Their expansion into subscription billing, sweeping and utility payments is adding
    repeatable volume that single payments alone could not sustain.


    The billion-payment mark arrives as the Treasury consults on modernising payments
    regulation and the FCA signals that open banking data will play a growing role
    in affordability assessments and mortgage checks. For banks and payment providers,
    the volume now flowing through open banking rails is large enough to influence
    infrastructure planning and commercial strategy in ways that were theoretical
    even 18 months ago.

    '
  editorial_note: 'A concrete volume milestone that quantifies the maturation of UK
    open banking infrastructure, relevant to any European professional tracking the
    competitive position of account-to-account payments.

    '
  sources: '[1st Quarter Results](https://www.globenewswire.com/news-release/2026/07/29/3334974/0/en/1st-quarter-results.html)
    — GlobeNewswire | [1st Quarter Results](https://finance.yahoo.com/markets/stocks/articles/1st-quarter-results-060000068.html)
    — Yahoo Finance'
