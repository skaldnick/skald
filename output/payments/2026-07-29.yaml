- headline: Nexi reports steady first-half growth with open banking in digital mix
  standfirst: The European payment processor's half-year results show its digital
    banking and open banking segment contributing 11% of group revenue, buoyed by
    Single Euro Payments Area clearing volumes.
  body: 'Nexi''s digital banking solutions segment, which includes open banking, network
    services and Single Euro Payments Area (SEPA) clearing, accounted for 11% of group
    revenues in the first half of 2026, benefiting from rising transaction volumes
    across those services. Group revenue grew steadily and cash generation was strong
    amid slower economic growth in several of its core European markets.


    The results come as Nexi''s shareholder structure remains in flux. Italy''s state
    lender Cassa Depositi e Prestiti has signalled its intent to increase its stake
    in the company, while private equity interest in parts of Nexi''s business has
    been reported. The combination of stable operating performance and active ownership
    manoeuvring makes Nexi a bellwether for how Europe''s largest independent payment
    processors are navigating the current environment.


    Open banking''s contribution to Nexi''s digital segment remains a relatively small
    share of a business still dominated by card acquiring and issuing processing.
    Its inclusion as a named growth driver in investor materials, though, shows open
    banking moving from peripheral to structural within major European processors.'
  editorial_note: Nexi is the largest independent payment processor in Europe; its
    half-year results and the explicit mention of open banking as a growth contributor
    offer a market-level signal about where volume is building.
  sources: '[Nexi H1 2026 slides: steady growth, strong cash amid macro headwinds](https://www.investing.com/news/company-news/nexi-h1-2026-slides-steady-growth-strong-cash-amid-macro-headwinds-93CH-4818743)
    — Investing.com'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst: ''SEPA clearing volumes'' – abbreviation ''SEPA'' used without
      spelling out in full. Rule requires spell-out-plus-parenthetical on first use
      in standfirst for non-common abbreviations, or should be spelled out as ''Single
      Euro Payments Area'' if not using the abbreviation rule.'
    - 'Body: ''SEPA clearing'' – abbreviation ''SEPA'' used without spelling out in
      full on first mention in body text. Rule requires ''Single Euro Payments Area
      (SEPA)'' on first use in body, even though it appeared in standfirst.'
    - 'Body opening sentence nearly replicates standfirst structure and content: both
      lead with ''Nexi'' + first-half results + growth/revenue information. Rule requires
      the body opening to be substantively different from the standfirst, not a near-identical
      restatement.'
    - 'Body: ''what it described as macroeconomic headwinds'' – vague temporal/causal
      framing. The phrase softens the substantive claim; should state directly what
      headwinds existed rather than attributing Nexi''s characterization of them.'
    - 'Body final paragraph: ''But its inclusion as a named growth driver...'' – This
      sentence announces significance (''reflects how open banking is moving from
      peripheral to structural'') in a way that flags importance before making the
      point. Should state the substantive development directly without the framing
      verb ''reflects how''.'
