- headline: Nexi posts steady first-quarter growth with open banking contributing
    to digital segment
  standfirst: Nexi's digital banking and open banking segment now represents 11% of
    group revenues, with open banking and SEPA clearing volumes among the drivers
    lifting the unit in the first quarter of 2026.
  body: 'Nexi''s first-quarter 2026 results show its digital banking and open banking
    segment contributing 11% of group revenues, with growth driven by SEPA clearing
    volumes, open banking services, network infrastructure and PagoPA bill payment
    processing. The company reported steady overall growth and strong cash generation
    despite what it described as macroeconomic headwinds.


    Continued speculation about Nexi''s ownership structure adds a strategic dimension
    to these results. Italy''s state lender Cassa Depositi e Prestiti is reportedly
    considering increasing its stake, and private equity firms are circling the company.
    How Nexi allocates investment between its merchant acquiring business and its
    digital infrastructure operations, including open banking, will be shaped partly
    by whichever ownership configuration prevails.


    For the broader European market, Nexi''s open banking revenues illustrate that
    processor-scale economics are beginning to flow through open banking rails, even
    if the segment remains a minority contributor. As SEPA instant payments mandates
    take full effect, processors with established clearing infrastructure stand to
    benefit disproportionately.'
  editorial_note: Nexi is Europe's largest payment processor; its earnings provide
    a useful read on how open banking is scaling within incumbent infrastructure businesses,
    not just fintechs.
  sources: '[Nexi H1 2026 slides: steady growth, strong cash amid macro headwinds](https://www.investing.com/news/company-news/nexi-h1-2026-slides-steady-growth-strong-cash-amid-macro-headwinds-93CH-4818743)
