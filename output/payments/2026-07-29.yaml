- headline: Visa cuts 2,600 jobs as it restructures for AI-driven operations
  standfirst: The payments network is eliminating 7% of its workforce, with technology
    and product roles bearing the heaviest losses as it redirects investment toward
    AI capabilities.
  body: 'Visa is cutting approximately 2,600 positions, representing 7% of its global
    workforce, with technology and product teams most affected. The restructuring
    is framed as a reconfiguration for what the company describes as the AI era, shifting
    resources away from legacy technology functions toward automation and AI-driven
    product development.


    The cuts come during a period of heavy AI investment across the payments industry.
    Visa has launched an agentic payments programme in Europe, partnered with OpenAI,
    and built a threat intelligence platform — all within the past year. Reducing
    headcount in traditional technology roles while scaling AI capabilities is consistent
    with that direction, though the scale of cuts suggests cost discipline is also
    a factor.


    Even the largest incumbents are now compressing their technology organisations
    rather than simply adding AI on top. Payment processors and banks building their
    own AI strategies should expect similar workforce rebalancing across the industry
    as automation reshapes how payments technology is built and maintained.'
  editorial_note: A major workforce reduction at one of the two dominant card networks,
    explicitly tied to AI restructuring, has direct relevance to European payments
    infrastructure and competitive dynamics.
  sources: '[Tech jobs go as Visa cuts workforce by 7%](https://www.finextra.com/newsarticle/48161/tech-jobs-go-as-visa-cuts-workforce-by-7?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
