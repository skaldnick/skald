- headline: PayPoint posts steady open banking revenue as merchant services soften
  standfirst: First-quarter results show open banking holding at £3.2m while the merchant
    services line contracts, underscoring divergent trajectories within the group.
  body: 'PayPoint''s digital payments and open banking segment grew 5.7% year on year
    to £3.2 million in the first quarter, against group revenue of £35.7 million.
    Merchant services declined 6.1% to £7.7 million, and the Love2shop voucher business
    fell 9.8% to £7 million.


    Nick Wiles, chief executive of PayPoint, said the pipeline for new open banking
    business continues to grow. The company completed its acquisition of AperiData
    in June, bringing open banking-powered credit data capabilities into its product
    set. That deal positions PayPoint to offer lenders and merchants a combined payments
    and creditworthiness proposition built on real-time bank data.


    Legacy transaction processing across several UK payment firms is under pressure
    from margin compression and competition, while open banking revenues are the segment
    showing consistent forward momentum. PayPoint''s quarter neatly captures that
    divergence.'
  editorial_note: PayPoint's quarterly numbers offer a useful data point on how open
    banking revenue is performing inside an established UK payments company, and the
    divergence from legacy lines is instructive.
  sources: '[1st Quarter Results](https://www.globenewswire.com/news-release/2026/07/29/3334974/0/en/1st-quarter-results.html)
    — GlobeNewswire | [1st Quarter Results](https://finance.yahoo.com/markets/stocks/articles/1st-quarter-results-060000068.html)
    — Yahoo Finance'
