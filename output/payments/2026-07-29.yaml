title: 'UK open banking hits one billion payments; Visa cuts 2,600 jobs; PayPoint
  steady

  '
social_post: 'UK open banking crosses one billion payments — but single domestic payments
  are actually declining. Plus: Visa cuts 7% of staff for the AI era, and what PayPoint''s
  Q1 says about merchant services. {link}

  '
stories:
- headline: UK open banking crosses one billion payments as VRPs drive growth
  standfirst: Open Banking Limited reports the ecosystem has passed one billion cumulative
    payments and 100 billion API calls, with variable recurring payments now the primary
    growth engine as single domestic payments decline.
  body: 'The UK open banking ecosystem has surpassed one billion payments, according
    to Open Banking Limited, the entity overseeing CMA9 bank compliance. The milestone
    is accompanied by 100 billion cumulative API calls, reflecting both payment initiation
    and data-sharing activity across the ecosystem.


    The composition of that growth is shifting. Single domestic payments fell 1.2%
    month on month, while variable recurring payments (VRPs) rose 6.7% over the same
    period. That divergence suggests the initial use case that drove open banking
    adoption, one-off account-to-account transfers, may be plateauing, with recurring
    payment mandates becoming the more dynamic segment. VRP growth aligns with the
    commercial VRP frameworks now being rolled out through the UK Payments Initiative
    and individual providers.


    The billion-payment figure is cumulative rather than annualised, so it measures
    adoption history rather than current throughput. For context, UK card payments
    numbered 31.4bn in 2024. Open banking payments remain a small fraction of total
    UK payment volumes, but the rate of acceleration, and the shift toward VRPs, matters
    more than the headline number for those building commercial propositions on these
    rails.'
  editorial_note: 'A concrete adoption milestone for UK open banking that reveals
    an important compositional shift: VRPs are now the growth driver while single
    payments flatten, which has direct implications for product strategy.'
  sources: '[Open Banking Reaches 1 Billion Payment Milestone in the UK](https://www.pymnts.com/news/banking/2026/open-banking-reaches-1-billion-payment-milestone-in-the-uk/)
    — PYMNTS.com | [UK Open Banking Hits Landmark One Billion Payments and 100 Billion
