title: 'UK open banking milestone; ECB digital euro accessibility; Plend raises £50m

  '
social_post: 'UK open banking just crossed one billion payments and 100 billion API
  calls. Plus: ECB sets accessibility standards for the digital euro app, and Plend
  raises £50m on the back of open banking credit models. {link}

  '
stories:
- headline: 'UK open banking passes one billion payments and 100 billion API calls

    '
  standfirst: 'The milestone underscores open banking''s shift from regulatory experiment
    to scaled payment infrastructure, though the path to open finance remains uncertain.

    '
  body: 'Open banking payments in the UK have crossed the one billion mark, with cumulative
    API calls surpassing 100 billion, according to data reported this week. Variable
    recurring payments are a growing contributor, with the UK Payments Initiative
    now operating a commercial scheme and firms such as Modulr already live with commercial
    VRP products.


    The raw numbers confirm that open banking has reached genuine scale as a payment
    rail. But volume growth alone does not resolve the structural questions around
    the ecosystem''s next phase. The UK''s open finance consultation, announced by
    chancellor Rachel Reeves on July 14, is still at an early stage, and the commercial
    model for broader data sharing beyond payments remains undefined. The Financial
    Conduct Authority''s roadmap targets 2030 for investment data, but intermediary
    steps – particularly around liability, standards and consent – are largely unresolved.


    For infrastructure operators and third-party providers, the billion-payment threshold
    is operationally significant: it raises the bar on API resilience, token security
    and real-time monitoring at a scale that the original Open Banking Implementation
    Entity framework was not designed to handle.

    '
  editorial_note: 'A concrete milestone that quantifies the maturity of UK open banking
    infrastructure – relevant to anyone building on or competing with these rails.

    '
  sources: '[Open banking payments exceed one billion mark](https://www.computerweekly.com/news/366646532/Open-banking-payments-exceed-one-billion-mark)
    — Computer Weekly | [UK Open Banking Hits 100B API Calls and 1B Payments Milestone](https://www.bobsguide.com/uk-open-banking-hits-100b-api-calls-and-1b-payments-milestone/)
    — bobsguide'
  style_check:
    compliant: false
    warnings:
    - Headline starts with 'UK' and body opening starts with 'Open banking payments
      in the UK' – these are too similar in structure and opening; vary the body's
      opening sentence per the rule against starting headline, standfirst, and body
      opening with the same word or phrase.
    - 'Body text: ''the UK Payments Initiative now operating a commercial scheme''
      – use present continuous ''is now operating'' instead of simple present ''now
      operating'' to signal currency.'
    - 'Body text: ''the billion-payment threshold is operationally significant: it
      raises the bar'' – the phrase ''is operationally significant'' announces significance
      before making the substantive point; write the substantive point directly and
      let readers recognise its significance.'
  verification:
    verified: false
    stale: false
    duplicate: true
    warnings:
    - Story reports same core event as previously covered entry from 2026-07-29 (UK
      open banking crosses one billion payments milestone)
    - Open finance 'consultation announced by chancellor Rachel Reeves on July 14'
      is inaccurate - government announced it will CONSULT in 2027, not that consultation
