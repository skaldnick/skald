title: 'Equals acquires OFX; Ozone launches cVRP product; MoonPay enables agentic
  payments

  '
social_post: 'Equals swoops for OFX in a cross-border payments consolidation play,
  Ozone opens cVRP to non-CMA9 banks, and Plend backs its credit models with a £50m
  facility. Today''s briefing: {link}

  '
stories:
- headline: 'Equals agrees all-cash acquisition of Australia''s OFX

    '
  standfirst: 'The deal would create a combined cross-border payments group with significant
    SME and corporate reach across the UK, Australia and Asia-Pacific.

    '
  body: 'Equals Group is acquiring 100% of OFX Group, the ASX-listed international
    payments company, in an all-cash transaction. The acquisition follows a strategic
    review OFX announced on February 5 this year, which has now concluded with the
    signing of a transaction process deed.


    The combination would give Equals a larger footprint in cross-border business
    payments, a segment where consolidation has accelerated. OFX serves corporate
    and SME clients across Australia, New Zealand, Asia and North America, complementing
    Equals'' UK-centred operation. The deal sits alongside a series of recent acquisitions
    in the cross-border space, including Nuvei''s reported pursuit of Payoneer and
    Airwallex''s purchase of Leapfin.


    The transaction remains subject to OFX shareholder approval and regulatory clearance
    in Australia. Terms were not disclosed in the initial announcement.

    '
  editorial_note: 'Cross-border payments M&A continues to intensify, and this deal
    is a concrete example of mid-market consolidation between a UK acquirer and an
    Asia-Pacific target, relevant to European payments professionals tracking competitive
    dynamics.

    '
  sources: '[Equals to acquire OFX](https://www.finextra.com/pressarticle/110537/equals-to-acquire-ofx?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the organisation (Equals) also named in the headline.
      Should begin with the substantive point instead — e.g., ''The deal would create…''
      rather than ''The deal would create…'' Fix: remove subject reference and lead
      with ''Would create a combined cross-border payments group…'' or similar. Breaches:
      ''In the standfirst, do not open by naming the organisation that is also named
      in the headline.'''
    - 'Body text uses ''February 5 this year'' which is a vague temporal reference.
      Should use specific date format ''on February 5'' or similar without ''this
      year''. Breaches: ''Avoid vague temporal references such as "in June" or "last
      month" when a specific date is available.'''
    - 'Body text states ''The combination would give Equals a larger footprint in
      cross-border business payments, a segment where consolidation has accelerated.''
      This is near-verbatim repetition of the standfirst''s substantive point about
      creating ''a combined cross-border payments group'' without sufficient differentiation
      or added depth. The two sentences convey the same idea in similar structure.
      Breaches: ''Avoid near-verbatim repetition of the same phrasing across headline,
      standfirst, and body.'''
