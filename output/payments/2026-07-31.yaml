- headline: Ozone API launches cVRP product for non-CMA9 UK banks
  standfirst: Commercial variable recurring payments infrastructure is extending beyond
    the nine largest UK banks, a step toward broader VRP adoption.
  body: 'Ozone API has launched a commercial variable recurring payments (cVRP) product
    designed for UK banks and building societies outside the CMA9, the group of institutions
    originally mandated to support open banking. The product is compliant with the
    Open Banking Limited 4.0 standard and integrates with an institution''s existing
    technology stack.


    Until now, cVRP capability has been concentrated among the largest UK banks. Bank-side
    coverage across a wider set of institutions is what will determine whether merchants
    and billers adopt VRPs as a payment method at scale. Modulr began processing commercial
    VRPs under the UK Payments Initiative scheme on June 18, but broad uptake depends
    on smaller banks having the infrastructure to participate.


    The product launch comes as UK open banking has crossed one billion payments,
    with VRPs identified as a key growth driver. Making cVRP infrastructure available
    as an off-the-shelf product for smaller banks lowers the barrier to participation
    and could accelerate the payment method''s reach across recurring billing and
    subscription use cases.'
  editorial_note: VRP adoption beyond the CMA9 is a critical bottleneck for pay-by-bank
    scaling in the UK. This product addresses a specific infrastructure gap and is
    relevant to the broader trajectory of open banking payments.
  sources: '[Ozone API launches cVRP product for non-CMA9 UK banks](https://www.openbankingexpo.com/news/ozone-api-launches-cvrp-product-for-non-cma9-uk-banks/)
    — Open Banking Expo'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation ('The product') that is also the
      subject of the headline ('Ozone API launches'). Should open with the substantive
      point instead — eg, 'Commercial variable recurring payments infrastructure is
      extending beyond the nine largest UK banks…' to avoid redundant repetition of
      the subject.
    - Body text uses 'late June' (vague temporal reference) when a specific date may
      be available. Rule requires specific dates (eg, 'on June 28') or month names;
      reserve 'late June' only when the precise date cannot be established.
    - Body text contains 'Extending it to a wider set of institutions is a practical
      requirement if VRPs are to scale as a payment method.' This is near-verbatim
      repetition of the standfirst's point ('extends…beyond the nine largest UK banks,
      a step toward broader VRP adoption') in the same wording and structure, violating
      the rule against near-verbatim repetition across standfirst and body.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Draft states Modulr began processing cVRP 'in late June' — search evidence shows
      announcement on June 18, 2026 (mid-June)
  revision:
    replaced: false
    summary:
    - Revised standfirst to open with the substantive point ('Commercial variable
      recurring payments infrastructure is extending…') rather than 'The product',
      avoiding redundant repetition of the headline subject.
    - Changed 'in late June' to 'on June 18' per search evidence indicating the Modulr
      announcement date was June 18, not late June.
    - Rewrote the second paragraph's opening sentences to avoid near-verbatim repetition
      of the standfirst's point about extending beyond the nine largest banks, while
      preserving the substance.
- headline: 'Plend secures £50m lending facility backed by open banking credit models

    '
  standfirst: 'The facility signals growing institutional confidence in open banking-derived
    creditworthiness data as a basis for lending decisions at scale.

    '
  body: 'Plend, the UK lender that uses open banking transaction data to assess creditworthiness,
    has secured a £50 million lending facility. The funding will support the expansion
    of its loan book, which targets borrowers who may be underserved by traditional
    credit scoring models.


    Plend''s approach uses real-time income and spending data accessed through open
    banking APIs to build affordability assessments, bypassing reliance on credit
    reference agency scores. Securing a facility of this size suggests the capital
    markets are becoming more comfortable with open banking data as collateral-grade
    underwriting input, not just a supplementary signal.


    The development sits within a broader pattern of open banking data moving from
    identity verification and account aggregation into core lending infrastructure.
    PayPoint''s acquisition of AperiData and the FCA''s signals on open banking mortgage
    affordability checks point in the same direction.

    '
  editorial_note: 'Institutional capital backing open banking credit models is a meaningful
    indicator that the technology is maturing from innovation to bankable infrastructure,
    directly relevant to the European open finance trajectory.

    '
  sources: '[Let''s open our bank accounts, SALNs, solon dares colleagues](https://tribune.net.ph/2026/07/30/lets-open-our-bank-accounts-salns-solon-dares-colleagues)
    — Daily Tribune'
  verification:
    verified: false
    stale: false
    duplicate: true
    warnings:
    - Cited source is also cited by another story in this briefing — likely a wrong
      or duplicate source_id
    - Story is duplicate of July 30 entry in previously covered list
    - Cited source (Daily Tribune article about SALNs/bank account disclosures) does
      not appear to report on Plend's funding announcement
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the subject (open banking) that is also central to
      the headline. The standfirst should open with the substantive point or action
      — e.g., 'Growing institutional confidence in open banking-derived creditworthiness
