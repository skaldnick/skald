title: 'Partior atomic settlement; FT letter on UK payments sovereignty

  '
social_post: 'Thin pickings today but two stories worth your time: Partior proves
  atomic settlement across stablecoins and tokenised deposits, and an FT letter sharpens
  the UK payments sovereignty debate. {link}

  '
stories:
- headline: Partior proves atomic settlement across stablecoins and tokenised deposits
  standfirst: Regulated stablecoins, tokenised deposits and digital assets can settle
    atomically on shared infrastructure, advancing the case for interoperable digital
    money in wholesale markets.
  body: 'Partior, the bank-backed global settlement platform, and digital asset infrastructure
    provider OpenAssets are completing a joint proof of concept demonstrating atomic
    delivery-versus-payment across three forms of digital money: digital assets, regulated
    stablecoins and commercial tokenised deposits. The test shows these instruments
    can settle simultaneously on a single transaction, eliminating the settlement
    risk that persists when legs of a trade clear at different times or on different
    rails.


    The result lands as European and global policymakers are actively debating how
    different forms of tokenised money should interact. The Euro Banking Association
    published adoption criteria for tokenised money in June, and the BIS completed
    Project Aperta on cross-border open finance interoperability the same month. A
    working proof that stablecoins and bank-issued tokenised deposits can coexist
    in one settlement flow addresses a key concern for central banks and regulators
    weighing whether these instruments complement or compete with one another.


    For wholesale market participants, atomic settlement removes the need for intermediaries
    to manage counterparty risk between execution and settlement. If the model scales
    to production, it could reshape how banks, asset managers and payment platforms
    approach cross-border and cross-asset transactions.'
  editorial_note: ''
  sources: '[Partior and OpenAssets PoC proves stablecoins and tokenised deposits
