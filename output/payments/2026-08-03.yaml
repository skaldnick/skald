      editor should review.
- headline: 'Cover Genius acquires Friendsurance to embed insurance via open banking
    rails

    '
  standfirst: 'The deal gives Cover Genius access to PSD2-based infrastructure connecting
    directly to European bank accounts, extending embedded finance beyond payments.

    '
  body: 'Cover Genius, an embedded insurance platform, is acquiring German insurtech
    Friendsurance to expand across the DACH banking market. Friendsurance''s platform
    is built on PSD2 open banking infrastructure, using API connections to bank accounts
    to distribute and manage insurance products within banking apps. The acquisition
    gives Cover Genius an established architecture for accessing European bank data
    and embedding protection products alongside existing financial services.


    The deal illustrates how open banking rails are being repurposed beyond their
    original payments and account-information use cases. Friendsurance''s model uses
    bank connectivity not to initiate payments but to integrate insurance distribution
    into digital banking environments, leveraging the same regulatory and technical
    framework that underpins pay-by-bank and account aggregation. The GDPR compliance
    layer built into Friendsurance''s platform, designed specifically for the German
    regulatory environment, adds operational value in a market where data protection
    requirements are strictly enforced.


    For European banks evaluating their embedded finance strategies, the acquisition
    signals that open banking infrastructure is becoming a shared foundation for multiple
    product categories, not just payments. As PSD2''s successor framework takes shape,
    the range of commercial models built on top of bank connectivity continues to
    widen.

    '
  editorial_note: 'An acquisition that uses PSD2 open banking infrastructure for non-payments
    embedded finance is a concrete example of how open banking rails are being extended
    into adjacent product categories, relevant to banks and fintechs considering their
    platform strategies.

    '
  sources: '[Cover Genius to accelerate embedded protection across European banking
    ...](https://www.reinsurancene.ws/cover-genius-to-accelerate-embedded-protection-across-european-banking-with-friendsurance-acquisition/)
    — Reinsurance News | [Cover Genius acquires Friendsurance to expand DACH banking](https://fintech.global/2026/08/03/cover-genius-acquires-friendsurance-to-expand-dach-banking/)
    — FinTech Global'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'The deal gives Cover Genius access' but the headline
      names Cover Genius and describes the acquisition — this violates the rule against
      naming the organisation in both headline and standfirst opening. The standfirst
      should open with the substantive point (e.g., 'PSD2-based infrastructure can
      now be used to embed insurance in banking apps') rather than restating that
      Cover Genius gained access.
    - 'Body paragraph 2, sentence 2: ''The GDPR compliance layer built into Friendsurance''s
      platform, designed specifically for the German regulatory environment, adds
      operational value in a market where data protection requirements are strictly
      enforced.'' — This sentence uses hedging language (''adds operational value'')
      that announces significance before making the substantive point. State directly
      what the compliance capability enables or what problem it solves.'
    - 'Body paragraph 3, sentence 1: ''For European banks evaluating their embedded
      finance strategies, the acquisition signals that open banking infrastructure
      is becoming a shared foundation for multiple product categories, not just payments.''
      — This is an example of stating significance explicitly (''signals that'') before
      the substantive claim. Rewrite to state the substantive point directly, e.g.,
      ''Open banking infrastructure is becoming a shared foundation for multiple product
      categories beyond payments, as illustrated by this acquisition.'''
