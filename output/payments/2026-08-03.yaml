title: 'TrueLayer infrastructure call; Partior atomic settlement; Cover Genius open
  banking acquisition

  '
social_post: 'TrueLayer''s CEO makes the case for UK-owned payments infrastructure
  in the FT. Plus: Partior proves atomic settlement, and Cover Genius buys its way
  into European open banking rails. {link}

  '
stories:
- headline: 'TrueLayer CEO calls for UK ownership of payments infrastructure

    '
  standfirst: 'A published letter argues that domestic control of payment rails is
    essential if open banking is to fulfil its competitive promise.

    '
  body: 'Francesco Simoneschi, CEO of TrueLayer, has written in the Financial Times
    that the UK can no longer afford to depend on foreign-owned payments networks
    if it wants a genuinely competitive and resilient market. The letter frames infrastructure
    ownership as a precondition for the open banking ecosystem to scale, arguing that
    reliance on overseas operators leaves the UK exposed.


    The intervention lands at a moment when UK payments infrastructure is under active
    review. The Treasury opened a consultation on modernising payments regulation
    in July, and the UK Payments Initiative launched in June with backing from the
    country''s largest banks, explicitly positioned as a domestic alternative to Visa
    and Mastercard. Simoneschi''s letter adds a fintech voice to a debate that has
    so far been driven primarily by banks, regulators and policymakers.


    The argument is not new in substance, but its articulation by a prominent open
    banking company in a national newspaper sharpens the political dimension. It echoes
    themes raised by the Bank of Finland and the French Banking Federation earlier
    this year, both of which framed payment sovereignty as a strategic priority. The
    question of who owns and operates the rails underpinning account-to-account payments
    is becoming harder for regulators to sideline.

    '
  editorial_note: 'A named CEO of a major open banking firm making a public infrastructure-ownership
    argument in the FT advances the UK payments sovereignty debate, which has been
    building through UKPI''s launch and the Treasury consultation.

    '
  sources: '[Letter: UK can no longer rely on foreign-owned payments networks](https://www.ft.com/content/9fa438e5-8da7-4835-9f81-9ba1c8768ebf)
    — Financial Times'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the substantive point ('A published letter argues')
      rather than the named individual and their action. Per the house style rule
      on standfirsts, this should lead with 'Francesco Simoneschi, CEO of TrueLayer,
      has argued in a letter that…' to personalise and name the actor before stating
      the theme.
    - 'Body text uses ''account-to-account'' in full when this is a non-standard abbreviation
      that should be spelled out on first use with the abbreviation in parentheses:
      ''account-to-account (A2A)'' — though the rule also states to prefer spelling
      out such abbreviations, so ''account-to-account payments'' alone is acceptable;
      however, if it recurs elsewhere or is a key term, the parenthetical form should
      be used.'
    - 'The phrase ''The intervention lands at a moment when'' is vague temporal framing.
      The specific dates provided (July for the Treasury consultation, June for the
      UK Payments Initiative) should be embedded directly rather than using ''at a
      moment when''. Revise to: ''The intervention follows the Treasury''s July consultation
      on modernising payments regulation and the June launch of the UK Payments Initiative…'''
    - The phrase 'It echoes themes raised by the Bank of Finland and the French Banking
      Federation earlier this year' uses the vague temporal reference 'earlier this
      year'. Per house style, specific dates or months should be used instead — e.g.,
      'in the first quarter of 2025' or specific month names if available.
  verification:
    verified: true
    stale: false
    duplicate: true
    warnings:
    - 'This story reports the same event as the previously covered entry from 2026-08-03:
      ''TrueLayer CEO argues UK must own its payments infrastructure'' - identical
      subject matter with slightly reworded headline'
  revision:
    replaced: false
    summary:
