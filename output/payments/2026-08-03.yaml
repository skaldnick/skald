- headline: 'FT letter argues UK must own its payments infrastructure

    '
  standfirst: 'An open banking payments firm uses the Financial Times letters page
    to press the case that UK payment sovereignty requires domestic ownership of core
    infrastructure.

    '
  body: 'A letter published in the Financial Times argues that the UK can no longer
    rely on foreign-owned payments networks if it is serious about building a competitive
    and resilient payments market. The letter, from an open banking payments company,
    frames domestic ownership of infrastructure as a prerequisite for the kind of
    payments autonomy that policymakers have been debating with increasing urgency.


    The intervention follows several months of intensifying discussion around UK payments
    sovereignty. The UK Payments Initiative launched in June as a domestic alternative
    to Visa and Mastercard, the Treasury opened a consultation on modernising payments
    regulation in July, and Mastercard has been exploring a sale of its Vocalink stake.
    Visa''s €500 million European investment pledge earlier this year was itself a
    response to the sovereignty debate on the continent.


    The letter''s appearance in the FT signals that open banking firms see the current
    political moment as an opportunity to position account-to-account payments as
    a domestically owned alternative to card network dominance, not just a cheaper
    rail but a strategically important one.

    '
  editorial_note: 'The letter crystallises the UK payments sovereignty debate at a
    moment when multiple policy consultations and industry initiatives are actively
    reshaping the landscape, making it timely despite its brevity.

    '
  sources: '[Letter: UK can no longer rely on foreign-owned payments networks](https://www.ft.com/content/9fa438e5-8da7-4835-9f81-9ba1c8768ebf)
    — Financial Times'
