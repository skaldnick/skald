      editor should review.
- headline: 'Partior and OpenAssets prove atomic settlement across stablecoins and
    tokenised deposits

    '
  standfirst: 'A proof of concept demonstrates delivery-versus-payment across regulated
    stablecoins, digital assets and commercial tokenised deposits on shared infrastructure.

    '
  body: 'Partior, the bank-backed settlement platform, and digital asset infrastructure
    provider OpenAssets have completed a joint proof of concept demonstrating atomic
    delivery-versus-payment across regulated stablecoins, commercial tokenised deposits
    and digital assets. The test showed that different forms of tokenised money can
    settle simultaneously on a single transaction, eliminating the settlement risk
    that arises when legs of a trade complete at different times.


    The proof of concept builds on Partior''s earlier work, which has focused on cross-border
    wholesale settlement using distributed ledger technology. Adding stablecoins and
    tokenised deposits to the same atomic settlement flow addresses a practical problem:
    as multiple forms of digital money proliferate, interoperability between them
    becomes a prerequisite for institutional adoption rather than a theoretical nicety.


    The result aligns with broader industry efforts. The BIS completed Project Aperta
    in June to prototype cross-border open finance interoperability, and Swift is
    preparing to pilot live transactions on its shared ledger. The Partior-OpenAssets
    work narrows the gap between prototype and production for multi-asset atomic settlement,
    though commercial deployment remains some distance away.

    '
  editorial_note: 'Follows up on the previously covered Partior story from August
    3 with the same underlying event but now with the full Finextra source providing
    sufficient detail to write substantively. The atomic settlement of multiple tokenised
    money forms is a concrete step in wholesale infrastructure evolution relevant
    to European banks and payment providers.

    '
  sources: '[Partior and OpenAssets PoC proves stablecoins and tokenised deposits
    can settle atomically](https://www.finextra.com/newsarticle/48180/partior-and-openassets-poc-proves-stablecoins-and-tokenised-deposits-can-settle-atomically?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens with ''A proof of concept demonstrates'' but headline names
      ''Partior and OpenAssets'' — the standfirst should lead with who did what (the
      companies and their action) rather than the generic ''A proof of concept''.
      Rule: standfirst should lead with specific, concrete finding or action naming
      who did what.'
    - 'Body opens with ''Partior, the bank-backed settlement platform, and digital
      asset infrastructure provider OpenAssets have completed'' — this repeats the
      headline''s core naming and action. Vary the opening in at least one element
      between headline and body opening sentence. Rule: do not start headline and
      body opening sentence with the same word or phrase.'
    - 'Abbreviation ''DLT'' used in body (''distributed ledger technology'') without
      spelling out in full on first use followed by abbreviation in parentheses. Rule:
      on first use of an abbreviation that must be retained, spell it out in full
      followed by the abbreviation in parentheses.'
    - 'Editorial note included in final output (''Follows up on the previously covered
      Partior story...''). Rule: do not include editorial notes in the copy itself
      — these are internal guidance only.'
  verification:
    verified: false
    stale: false
    duplicate: true
    warnings:
    - Story reports same event as previously covered entry from 2026-08-03; also,
      article states 'BIS completed Project Aperta in June' but Project Aperta report
      was published May 29, 2026
  revision:
    replaced: false
    summary:
