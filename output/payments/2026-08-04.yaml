- headline: Infinios goes live with Mastercard stablecoin settlement in the Middle
    East
  standfirst: Live stablecoin settlement has begun through Mastercard's network in
    Bahrain, extending the card scheme's digital asset strategy beyond its initial
    US rollout.
  body: 'Infinios, a Bahrain-based digital financial infrastructure company, has gone
    live with stablecoin settlement on Mastercard''s network. The deployment marks
    the first production use of Mastercard''s stablecoin settlement capabilities in
    the Middle East, following the network''s announcement in June that it would enable
    stablecoin-based merchant settlement.


    Mastercard''s stablecoin settlement programme initially focused on US-based partners.
    Infinios going live in Bahrain extends the capability into a region where regulators
    have been actively courting digital asset infrastructure – the Central Bank of
    Bahrain was among the first Gulf regulators to establish a dedicated crypto-asset
    licensing framework.


    Mastercard''s stablecoin rails are scaling geographically faster than many expected.
    With MiCA now in force and several European stablecoin issuers holding licences,
    the question is when – not whether – similar production deployments appear in
    EU markets.'
  editorial_note: Follows the June story on Mastercard enabling stablecoin merchant
    settlement with a concrete production deployment, showing geographic expansion
    of the capability beyond the US.
  sources: '[Infinios goes live with Mastercard on stablecoin settlement](https://www.finextra.com/pressarticle/110553/infinios-goes-live-with-mastercard-on-stablecoin-settlement?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the organisation (Infinios) that is also named in
      the headline. Rule: ''In the standfirst, do not open by naming the organisation
      that is also named in the headline. Instead, begin with the substantive point
      or action.'' Suggested fix: Open with ''Live stablecoin settlement has begun
      through Mastercard''s network in Bahrain…'' or similar.'
    - 'Body text uses ''vague temporal reference'' – ''in June'' – when more precision
      may be available. Rule: ''Avoid vague temporal references such as "in June"
      or "last month" when a specific date is available. Use the precise date (eg,
      "on July 9").'' If the exact date of the Mastercard announcement in June is
      known, it should be used.'
    - 'The final paragraph (''For European observers…'') opens with a thematic framing
      (''the deployment is a data point'') rather than leading with a concrete substantive
      claim. While not explicitly flagged as a rule violation, this weakens the paragraph''s
      opening. Consider: ''Mastercard''s stablecoin rails are scaling geographically''
      (direct claim) rather than ''is a data point on how quickly…'' (thematic announcement
      of relevance).'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    summary:
    - Revised standfirst to open with the substantive action ('Live stablecoin settlement
      has begun…') rather than naming Infinios, which is already in the headline.
    - Could not confirm the exact date of Mastercard's June announcement from the
