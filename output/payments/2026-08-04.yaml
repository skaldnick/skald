title: 'FDATA agentic governance; Partior atomic settlement; Mastercard open finance;
  Teya instant settlement

  '
social_post: 'FDATA wants governance rules for AI agents in finance, Partior proves
  atomic settlement across stablecoins and tokenised deposits, and Mastercard frames
  open finance as a global infrastructure play. Today''s briefing: {link}

  '
stories:
- headline: 'FDATA publishes governance framework for AI agents in open finance

    '
  standfirst: 'The proposals set out principles for how autonomous AI agents should
    operate within regulated financial data-sharing frameworks, ahead of anticipated
    rulemaking in the UK and EU.

    '
  body: 'The Financial Data and Technology Association (FDATA) has published a white
    paper outlining a governance framework for agentic fintech, addressing how AI
    agents that initiate financial transactions or access account data on behalf of
    consumers should be supervised, authenticated and held accountable.


    The paper arrives as policymakers in both the UK and EU are developing open finance
    rules that will need to account for AI-enabled financial services. The FCA''s
    July AI review explicitly placed agentic payments within its supervisory scope,
    and the Euro Banking Association published its own mapping of agentic AI''s role
    in open finance in June. FDATA''s framework attempts to pre-empt fragmented national
    approaches by proposing common principles around consent delegation, liability
    and audit trails for agent-initiated actions.


    The white paper closes with a set of recommendations directed at regulators and
    standard-setting bodies, arguing that existing open banking consent models were
    not designed for autonomous agents and will require adaptation rather than simple
    extension. Whether regulators adopt FDATA''s framing or develop their own remains
    to be seen, but the trade body''s intervention adds specificity to a debate that
    has so far been largely conceptual.

    '
  editorial_note: 'FDATA''s July 24 framework proposal was previously covered at headline
    level; this white paper adds substantive detail on agentic governance principles
    and arrives as multiple regulators actively scope AI-agent oversight, making it
    timely for the audience.

    '
  sources: '[FDATA white paper outlines agentic fintech governance](https://thepaypers.com/fintech/news/fdata-calls-for-agentic-fintech-governance-framework)
    — The Paypers'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the organisation (FDATA) that is also the subject
      of the headline. Rule: ''In the standfirst, do not open by naming the organisation
      that is also named in the headline.'' Revise to open with the substantive point
      — eg, ''Proposals set out principles for how autonomous AI agents should operate
      within regulated financial data-sharing frameworks…'''
    - Body text uses em-dash (—) instead of en-dash (–) in 'addressing how AI agents
      that initiate financial transactions or access account data on behalf of consumers
      should be supervised, authenticated and held accountable.' This appears to be
      a stylistic choice but the rule requires en-dashes in body text.
    - 'FDATA is introduced as an abbreviation without being spelled out in full on
      first mention in the body. Rule requires: ''On first use of an abbreviation
      that must be retained, spell it out in full followed by the abbreviation in
      parentheses.'' Should be ''The Financial Data and Technology Association (FDATA)
      has published'' — wait, it is spelled out. However, check: ''FDATA''s framework
      attempts'' and ''FDATA''s intervention'' use the abbreviation without the full
      spelling immediately preceding it on first use in body. Actually, the abbreviation
      IS introduced in full in the opening sentence. This is compliant.'
