      weaken body''s opening sentence in order to avoid repetition with standfirst;
      revise standfirst instead).'
    - 'Paragraph 3 contains ''The move puts pressure on incumbent acquirers'' — this
      is a hedging scene-setter that delays the substantive point. Should lead directly
      with the substantive claim about acquirer business models (rule: do not open
      paragraph with hedging scene-setters; lead directly with substantive claim).'
