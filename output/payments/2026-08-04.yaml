title: 'Partior atomic settlement; Teya instant payouts; Mastercard open finance push

  '
social_post: 'Atomic settlement across stablecoins and tokenised deposits, Teya''s
  instant merchant payouts, and Mastercard''s global open finance pitch — today''s
  briefing covers the infrastructure bets shaping European payments. {link}

  '
stories:
- headline: 'Partior and OpenAssets prove atomic settlement across stablecoins and
    tokenised deposits

    '
  standfirst: 'A proof-of-concept has demonstrated delivery-versus-payment across
    regulated stablecoins, digital assets and commercial tokenised deposits on shared
    settlement infrastructure.

    '
  body: 'Partior, the bank-backed global settlement platform, and digital asset infrastructure
    provider OpenAssets have completed a joint proof-of-concept demonstrating atomic
    delivery-versus-payment between digital assets, regulated stablecoins and commercial
    tokenised deposits. The test showed that different forms of tokenised money can
    settle simultaneously and irrevocably on shared infrastructure, eliminating the
    settlement risk inherent in sequential processing.


    The proof-of-concept builds on Partior''s earlier work with the Bank for International
    Settlements on cross-border tokenisation. Where that project demonstrated wholesale
    settlement between central bank digital currencies, this latest test extends the
    principle to privately issued digital money – the forms most likely to reach commercial
    scale in the near term under frameworks such as MiCA.


    For European banks and payment processors, the result is concrete evidence that
    interoperability between different token types is technically feasible. The question
    shifts from whether atomic settlement can work to how quickly the commercial and
    regulatory conditions will support production deployment.

    '
  editorial_note: 'Advances the tokenised settlement story beyond the BIS prototype
    covered in May, with a new proof-of-concept that brings in stablecoins and tokenised
    deposits – the forms of digital money most relevant to commercial payments.

    '
  sources: '[Partior and OpenAssets PoC proves stablecoins and tokenised deposits
    can settle atomically](https://www.finextra.com/newsarticle/48180/partior-and-openassets-poc-proves-stablecoins-and-tokenised-deposits-can-settle-atomically?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
