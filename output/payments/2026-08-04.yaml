- headline: 'Teya launches card terminals with instant merchant settlement across
    Europe

    '
  standfirst: 'Instant payouts to merchants at point of sale challenge the standard
    T+1 or longer settlement cycle that card acquirers have maintained for decades.

    '
  body: 'Teya has launched card payment terminals that settle funds to merchants instantly
    across multiple European markets. The product eliminates the one-day or longer
    settlement delay that has been standard in card acquiring, giving merchants immediate
    access to sales revenue.


    Instant merchant settlement has been a perennial promise in European payments
    but has struggled to gain traction beyond niche providers. Teya''s launch across
    multiple markets rather than a single pilot territory suggests the operational
    and liquidity requirements are now manageable at scale – aided by the maturing
    SEPA instant payments infrastructure that provides the underlying rails.


    The move puts pressure on incumbent acquirers who have historically used the settlement
    float as a revenue line or funding source. If instant settlement becomes a competitive
    expectation rather than a premium feature, it will force a rethink of acquiring
    economics across the European market.

    '
  editorial_note: 'Instant merchant settlement has been discussed for years but rarely
    deployed at scale in Europe. A multi-market launch signals the concept is becoming
    commercially viable, with implications for acquirer business models.

    '
  sources: '[The future of consumer payments: Cards, Pay by Bank & the evolution of
    the multi-rail bank](https://www.finextra.com/event-info/624/the-future-of-consumer-payments-cards-pay-by-bank--the-evolution-of-the-multi-rail-bank?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens with ''Instant payouts to merchants at point of sale challenge
      the standard T+1 or longer settlement cycle'' — this is a general thematic claim
      about what the story ''advances'' rather than a specific, concrete finding or
      action. Should lead with ''Teya has launched card payment terminals that settle
      funds to merchants instantly across multiple European markets'' or similar concrete
      action (rule: standfirst should lead with specific finding or action, not general
      theme).'
    - 'Body opening sentence ''Teya has launched card payment terminals that settle
      funds to merchants instantly across multiple European markets'' repeats the
      headline''s core action too closely. While the body must be self-contained,
      the first sentence is the most important and should not be weakened to avoid
