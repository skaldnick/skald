- headline: Teya launches card machine with instant merchant settlement across Europe
  standfirst: Teya Pro processes most transactions in 1.7 seconds and settles funds
    to merchant accounts immediately, bundling instant settlement as a default feature
    rather than a premium add-on.
  body: 'European SME acquirers are under growing pressure to differentiate beyond
    price, and Teya is responding with hardware that makes instant settlement standard.
    The company has launched Teya Pro, a card machine that completes the majority
    of transactions in 1.7 seconds and moves funds to merchants'' accounts at the
    point of sale. The product is available across the European markets where Teya
    operates.


    Instant settlement for merchants has historically been offered as an optional,
    fee-bearing service by acquirers. Teya''s decision to bundle it into its standard
    hardware proposition reflects competitive dynamics in the European SME acquiring
    market. It also aligns with the broader infrastructure shift driven by the EU''s
    instant payments regulation, which is normalising real-time money movement across
    the payments chain.


    For incumbent acquirers, the implication is clear: as instant settlement becomes
    table stakes at the point of sale, the traditional float-based revenue model for
    merchant services comes under further pressure.'
  editorial_note: ''
  sources: '[Teya unveils new payments card machine](https://www.finextra.com/pressarticle/110547/teya-unveils-new-payments-card-machine?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens with ''Sub-two-second transaction speeds'' – a specific detail
      about Teya Pro – rather than leading with who did what and what the result was.
      The standfirst should open with a concrete action by a named entity (e.g., ''Teya
      has launched a card machine that...'') before explaining the broader significance.
      This violates the rule: ''The standfirst should lead with a specific, concrete
      finding or action — naming who did what and what the result was — rather than
      opening with a general thematic claim.'''
    - 'Headline and standfirst both open with the same subject (Teya/its launch and
      instant settlement), violating the rule: ''Do not start the headline, standfirst,
      and body opening sentence with the same word or phrase. Vary the opening in
      at least one of the elements.'' Headline: ''Teya launches...''; Standfirst:
      ''Sub-two-second...'' (describing Teya''s feature); Body: ''Teya has launched...''
      – all three present the same core action without variation.'
    - 'Paragraph 2 contains ''The move also aligns with...'' which is a substantive
      point but the preceding sentence ''Teya''s decision to bundle it into its standard
      hardware proposition reflects competitive pressure...'' could be read as explaining
      the move''s significance before the substantive detail. More critically, avoid
      near-verbatim repetition: the standfirst says ''paired with immediate fund transfers''
      and the body repeats ''transfers funds to merchants'' accounts instantly'' in
      the first sentence. While some repetition is acceptable for clarity, the phrasing
      is very similar.'
    - The editorial note repeats the core claim from the body ('bundling instant settlement
      as standard') without adding new substantive information. Per house style, editorial
      notes about the story's significance should not be included if they merely restate
      what is already in the copy.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    summary:
    - Rewrote standfirst to lead with the specific, concrete action by a named entity
      (Teya Pro) rather than opening with a general thematic claim about transaction
      speeds.
    - Varied the body opening so it no longer starts with 'Teya has launched' — now
      opens with a market-context framing sentence before introducing the launch,
      avoiding near-identical openings across headline, standfirst and body.
    - Revised body first paragraph to reduce near-verbatim repetition of the standfirst's
      phrasing about instant fund transfers.
    - Removed editorial note content as it merely restated what was already conveyed
      in the body.
