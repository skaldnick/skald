- headline: 'Mastercard frames open finance as global infrastructure beyond domestic
    plumbing

    '
  standfirst: 'The card network is positioning its open finance capabilities as cross-border
    commercial infrastructure, signalling a strategic shift beyond its domestic data-sharing
    roots.

    '
  body: 'Mastercard is making the case that open finance should function as scalable
    global infrastructure rather than a set of country-by-country domestic data-sharing
    regimes. The argument, reported by Valor International, positions the network''s
    open finance investments – including its acquisition of Finicity and its broader
    data services – as tools for cross-border use cases such as credit portability
    and identity verification.


    The framing matters because open finance has so far developed along national lines,
    with each jurisdiction building its own standards, consent frameworks and regulatory
    requirements. Mastercard''s pitch is that a network-level layer can bridge these
    differences, much as card scheme rules standardised cross-border card acceptance
    decades ago.


    For European banks and fintechs operating under PSD3 and the Financial Data Access
    framework, Mastercard''s positioning raises a familiar tension: whether cross-border
    interoperability is best achieved through public infrastructure and regulatory
    alignment, or through private network effects. The European Payments Initiative
    and the digital euro project represent one answer; Mastercard is offering another.

    '
  editorial_note: 'Mastercard''s strategic framing of open finance as global rather
    than domestic infrastructure has direct implications for the European debate about
    payment sovereignty and the role of international card networks.

    '
  sources: '[Global systems make open finance scalable and efficient, Mastercard says](https://valorinternational.globo.com/business/news/2026/08/03/global-systems-make-open-finance-scalable-and-efficient-mastercard-says.ghtml)
    — Valorinternational'
  style_check:
    compliant: false
    warnings:
    - 'Body text: ''The framing matters because'' – This explicitly flags significance
      before making the substantive point, violating the rule against never flagging
      significance explicitly. Revise to begin directly with ''Open finance has so
      far developed along national lines...'''
    - 'Body text: ''PSD3 and the Financial Data Access framework'' – On first use
      in body, ''PSD3'' must be spelled out in full with abbreviation in parentheses
      (e.g., ''Payment Services Directive 3 (PSD3)''), as the abbreviation recurs
      later in the piece.'
    - 'Standfirst: ''signalling a strategic shift'' – Use present continuous ''is
      signalling'' instead of the participle ''signalling'' to signal currency of
      the announcement.'
  verification:
