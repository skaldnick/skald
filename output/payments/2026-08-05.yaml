- headline: NatWest replaces payslips with open banking for mortgage income checks
  standfirst: NatWest is now accepting open banking data to verify mortgage income,
    making it one of the first major UK lenders to move the technology from a theoretical
    use case to production reality.
  body: 'NatWest is using a service called Verification Exchange to let mortgage applicants
    connect their bank account and pull transaction-level income data directly, removing
    the need to upload or post physical documents. The deployment replaces traditional
    payslips with live data feeds for income verification.


    The FCA signalled in June that open banking data would reshape mortgage affordability
    checks, and NatWest''s deployment makes it one of the first major UK lenders to
    put that principle into production. The practical benefit is speed – eliminating
    manual document handling and the back-and-forth that delays applications – but
    the deeper shift is structural. Once income verification moves from static documents
    to live data feeds, the same infrastructure can support ongoing affordability
    monitoring, not just point-in-time checks.


    For the open banking ecosystem, mortgage lending represents a high-value use case
    that extends into data-sharing and identity verification, not just transaction
    initiation. Each mortgage application verified through open banking rails reinforces
    the commercial case for data-sharing infrastructure and widens the base of consumers
    who have actively consented to bank data access.'
  editorial_note: ''
  sources: '[NatWest Drops Payslip Requirement: Open Banking Now Verifies UK Mortgage
    Income](https://www.techtimes.com/articles/322992/20260804/natwest-drops-payslip-requirement-open-banking-now-verifies-uk-mortgage-income.htm)
    — Techtimes'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens with ''The shift from document-based to data-driven income
      verification'' – this is a thematic/general claim rather than a specific, concrete
      finding or action. Should open with who did what (e.g., ''NatWest is now accepting
      open banking data to verify mortgage income''), per the rule: ''The standfirst
      should lead with a specific, concrete finding or action… rather than opening
      with a general thematic claim.'''
    - Body's opening sentence repeats the standfirst's core point ('open banking data'
      for 'income verification') using near-identical phrasing without meaningful
      development. While restating the standfirst's point in the body is acceptable,
      this risks redundancy. Consider revising the standfirst to lead with the concrete
      action and let the body expand contextually.
    - The phrase 'goes well beyond payments' in the final paragraph uses vague language
      without specifying what 'beyond' entails or why it matters. This weakens the
      claim; be more concrete about the value proposition.
    - The editorial note itself should not appear in the copy – it is metadata for
      internal use only and should be removed before publication.
  verification:
