    - Body paragraph 3 states 'Whether Bybit can convert its exchange user base into
      a meaningful payments operation remains to be seen, but the licensing step is
      a concrete one.' This opens with hedging ('Whether X remains to be seen') per
      the house style rule against leading with 'The deal is far from certain' or
      equivalent scene-setters. Lead directly with the substantive claim.
    - Editorial note flagging 'This is a notable regulatory and strategic development'
