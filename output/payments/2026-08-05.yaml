title: 'Bybit''s EU licence; Deutsche Bank API overhaul; NatWest open banking mortgages

  '
social_post: 'Crypto exchange Bybit secures an Austrian e-money licence, Deutsche
  Bank consolidates on Apigee, and NatWest drops payslips for open banking mortgage
  checks. Today''s briefing: {link}

  '
stories:
- headline: Bybit secures Austrian e-money licence to build EU payments arm
  standfirst: A standalone payments entity, structurally separate from Bybit's existing
    EU operation, gives the crypto exchange a regulated basis for card products, merchant
    tools and open banking across the European Economic Area.
  body: 'Bybit has obtained an electronic money institution licence in Austria, creating
    a standalone payments entity – Bybit Payments GmbH – separate from its existing
    EU operation, Bybit EU GmbH, which does not operate a crypto-asset trading platform.
    Both will operate under a single customer login at Bybit.eu, but the structural
    split gives the exchange a regulated basis for services including person-to-person
    payments, card products, merchant tools and open banking functionality.


    Other crypto-native firms have taken a similar approach, seeking to bridge digital
    asset services and conventional payments within the EU''s regulatory perimeter.
    Zodia Custody secured a Luxembourg payment institution licence in June, and Lightspark
    obtained a combined Markets in Crypto-Assets Regulation and e-money licence in
    Estonia in July. For Bybit, the Austrian licence provides passporting rights across
    the European Economic Area, offering a pathway to scale payment services continent-wide.


    Institutional appetite for regulated crypto infrastructure in Europe continues
    to build. A recent Fireblocks survey found near-universal support among European
    institutions for crypto regulation, with firms citing MiCA as a catalyst for early
    commitments. The licensing step is a concrete one, though converting an exchange
    user base into a meaningful payments operation is a different challenge.'
  editorial_note: ''
  sources: '[Bybit''s EU payments arm secures Austrian e-money license](https://www.tradingview.com/news/cointelegraph:bb413195e094b:0-bybit-s-eu-payments-arm-secures-austrian-e-money-license/)
    — TradingView | [Bybit Splits Crypto and Payments Into Two Austrian Entities.
    Bybit.eu Will Run Both Under One Login](https://www.tradingview.com/news/financemagnates:cc4b3043b094b:0-bybit-splits-crypto-and-payments-into-two-austrian-entities-bybit-eu-will-run-both-under-one-login/)
    — Tradingview | [Bybit Splits Crypto and Payments Into Two Austrian Entities.
    Bybit.eu Will Run Both Under One Login](https://www.financemagnates.com/cryptocurrency/exchange/bybit-splits-crypto-and-payments-into-two-austrian-entities-bybiteu-will-run-both-under-one-login/)
    — Financemagnates | [Bybit Expands European Footprint With Austrian EMI License](https://news.bitcoin.com/exchanges/bybit-expands-european-footprint-with-austrian-emi-license/)
    — Bitcoin News | [Bybit secures Austria EMI license for EU payments](https://crypto.news/bybit-secures-austria-emi-license-for-eu-payments/)
    — Crypto News'
