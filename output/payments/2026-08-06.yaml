- headline: Bybit secures Austrian e-money licence to expand crypto payments across
    Europe
  standfirst: Fiat payment capabilities including transfers, merchant payments, open
    banking services and card programmes can now sit alongside Bybit's existing crypto
    trading operations under a single European platform.
  body: 'Bybit''s European subsidiary, Bybit.eu, has obtained an electronic money
    institution (EMI) licence from Austria''s Financial Market Authority. The authorisation
    allows the exchange to offer person-to-person transfers, merchant payment acceptance,
    open banking connectivity and prepaid or debit card products across the European
    Economic Area.


    The licence is distinct from Bybit''s existing Markets in Crypto-Assets Regulation
    (MiCA) registration, which covers its crypto trading and custody operations. By
    combining both authorisations under one platform, Bybit can bridge fiat and crypto
    payment flows in a way that most crypto exchanges cannot yet match in Europe.
    The company said it plans to integrate both service lines through the Bybit.eu
    platform.


    Crypto exchanges have historically struggled to secure banking and payments licences
    in Europe. Bybit''s success follows Lightspark''s combined MiCA and e-money licence
    in Estonia, granted in July. The trend suggests European regulators are becoming
    more willing to licence crypto-native firms for traditional payment activities,
    provided they meet the same prudential and conduct standards as incumbent payment
    institutions.'
  editorial_note: ''
  sources: '[Bybit EU payments unit secures Austria e-money licence](https://www.digitaltoday.co.kr/en/view/89667/bybit-eu-payments-unit-secures-austria-e-money-licence)
    — Digitaltoday | [Bybit.eu broadens European offering with Austrian EMI licence](https://www.electronicpaymentsinternational.com/news/bybit-eu-austrian-emi-licence/)
    — Electronicpaymentsinternational'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'The licence allows Bybit's EU subsidiary' but the headline
      names Bybit; rule requires opening with the substantive point rather than repeating
      the organisation. Revise to lead with the action/consequence (e.g., 'Bybit can
      now offer transfers, merchant payments...' or 'The move allows Bybit to bridge...').
    - 'Body text uses ''Markets in Crypto-Assets Regulation (MiCA)'' on first mention;
      per abbreviation rules, this should be ''Markets in Crypto-Assets Regulation
      (MiCA)'' only if MiCA recurs later in the body. It does recur in the same paragraph
      (''MiCA and e-money licence''), so this is correct, but check: MiCA appears
      again in ''combined MiCA and e-money licence'', confirming the parenthetical
      is warranted.'
    - Editorial note states 'A crypto exchange securing a full EMI licence in Europe
      signals a regulatory trend worth tracking' – this is editorial commentary that
      should not appear in the editorial note field. Editorial notes should flag missing
      information, source concerns, or factual queries only. This note is asserting
      significance and framing, which should be removed or revised to a factual query
      if needed.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
