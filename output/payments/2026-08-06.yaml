title: 'CFPB open banking rewrite; Wero delays Luxembourg; Mastercard tests programmable
  settlement

  '
social_post: 'The CFPB''s rewritten open banking rule lands at the White House — with
  fees for fintechs and tighter data limits. Plus Wero slips in Luxembourg and Mastercard
  tests programmable A2A for property. {link}

  '
stories:
- headline: CFPB submits rewritten open banking rule to White House for review
  standfirst: The revised proposal would let banks charge fintechs for data access
    and narrow the scope of shareable consumer information, marking a sharp departure
    from the Biden-era original.
  body: 'The Consumer Financial Protection Bureau (CFPB) has sent a reworked version
    of its open banking rule to the White House Office of Information and Regulatory
    Affairs for review. The revised proposal is expected to introduce a tolling framework
    allowing banks to charge third parties for accessing consumer financial data,
    and to impose tighter restrictions on which data fields fall within scope.


    CFPB director Russell Vought had signalled the rewrite at a Senate hearing in
    July, describing the Biden-era rule as overreaching. The original rule, finalised
    in late 2024, was designed to give consumers portable access to their financial
    data and had drawn legal challenges from banking trade groups. A US court paused
    those challenges in May while the CFPB prepared its revision.


    If banks can charge for API access, the economics of open banking shift materially,
    particularly for smaller fintechs and aggregators that rely on free or low-cost
    data feeds. European observers will note the contrast with PSD2 and the forthcoming
    PSD3 framework, where the principle of free access to payment account data has
    been a regulatory baseline. The rule''s final shape will depend on White House
    review and a subsequent public comment period.'
  editorial_note: The CFPB's rewritten open banking rule reaching White House review
    is a concrete new development in a story European professionals are tracking for
    its potential to diverge from or converge with PSD3/open finance approaches.
  sources: '[CFPB Sends Open-Banking Rule Redo To White House](https://www.law360.com/compliance/articles/2509963/cfpb-sends-open-banking-rule-redo-to-white-house?about=compliance)
    — Law360 | [What we know about the CFPB''s forthcoming open-banking rule](https://www.americanbanker.com/news/what-we-know-about-the-cfpbs-forthcoming-open-banking-rule)
    — American Banker | [CFPB''s Open Banking Proposal Heads to White House for Review](https://news.bloombergtax.com/financial-accounting/cfpbs-open-banking-proposal-heads-to-white-house-for-review)
    — News'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the CFPB, which is also named in the headline. Per
      house style, the standfirst should begin with the substantive point (the revised
      proposal''s changes) rather than naming the organisation: revise to open with
      ''The revised proposal would let banks charge...'' instead of implying CFPB
      action first.'
    - Body text uses em-dash (—) in 'financial data – and to impose' where an en-dash
      (–) should be used per house style rules for dashes in body text.
    - Phrase 'If banks can charge for API access, the economics of open banking shift
      materially' is preceded by 'The fee mechanism is the most consequential change,'
      which announces notability before making the substantive point. Per house style,
      write the substantive point directly without the scene-setting announcement.
