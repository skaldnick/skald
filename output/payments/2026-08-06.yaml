    replaced: false
    summary:
    - Revised standfirst to lead with the substantive point ('Fiat payment capabilities…')
      rather than repeating the organisation named in the headline.
    - MiCA abbreviation usage confirmed correct — it is introduced with full spelling
      and parenthetical on first use in the body and recurs later in the same text.
