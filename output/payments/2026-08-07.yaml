- headline: Deutsche Bank group completes full Wero rollout with norisbank launch
  standfirst: All three of Deutsche Bank's retail brands now support Wero, completing
    the largest single banking group deployment of EPI's payment rail.
  body: 'Deutsche Bank has completed its group-wide rollout of Wero with the launch
    at norisbank, its direct banking subsidiary. The move follows earlier deployments
    at Deutsche Bank''s main retail brand and Postbank, making the group the first
    to bring all its consumer banking units onto the European Payments Initiative''s
    (EPI) account-to-account instant payment rail.


    The rollout is the largest by a single banking group to date and gives Wero access
    to a substantial share of Germany''s retail banking customer base. Germany is
    EPI''s largest market by population, and Deutsche Bank''s scale there means the
    completion has practical significance for Wero''s transaction volumes and merchant
    adoption prospects. EPI has been expanding across Europe, with Austrian banks
    joining and the Netherlands progressing its iDEAL-to-Wero migration.


    Wero''s Luxembourg launch, originally expected this summer, has been pushed back
    to June 2026 for customer availability, with merchant migration from Payconiq
    targeted for completion by September 2026, according to The Paypers. EPI''s market-by-market
    expansion remains uneven, even as its largest banking group participant reaches
    full deployment.'
  editorial_note: ''
  sources: '[norisbank Launch Completes Deutsche Bank Group''s Full Adoption of Wero](https://www.techtimes.com/articles/323389/20260806/norisbank-launch-completes-deutsche-bank-groups-full-adoption-wero.htm)
    — Tech Times | [Wero delays Luxembourg launch to 1 September 2026](https://thepaypers.com/payments/news/wero-delays-luxembourg-launch-to-1-september)
    — The Paypers'
