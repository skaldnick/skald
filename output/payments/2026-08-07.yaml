- headline: Abound partners with ClearScore's D-One to widen open banking lending
  standfirst: Access to 3.5 million additional users via ClearScore's open banking
    data service extends Abound's real-time income-based credit assessments beyond
    traditional scoring.
  body: 'Abound, the UK-based lender that underwrites using open banking and machine
    learning, is partnering with D-One, the open banking services arm of ClearScore
    Group, to extend its credit products to a larger pool of borrowers. The integration
    connects Abound to D-One''s 3.5 million users, allowing it to offer loans based
    on real-time transaction data rather than static credit bureau scores.


    Abound''s model analyses bank transaction data to assess affordability and repayment
    capacity, targeting borrowers who may be underserved by conventional scoring,
    including gig workers, the self-employed and those with thin credit files. The
    partnership with D-One, which provides open banking connectivity within ClearScore''s
    credit marketplace, effectively embeds Abound''s lending products where consumers
    are already checking their creditworthiness.


    Open banking data is steadily moving from payments into lending decisions. The
    Financial Conduct Authority''s signal that open banking data could reshape mortgage
    affordability checks, and chancellor Rachel Reeves''s announcement of an open
    finance push focused on SME lending, both point toward regulatory endorsement
    of transaction-data-based credit assessment. Abound''s expansion through D-One
    applies that logic commercially, reaching borrowers at the point where they are
    already engaging with their financial data.'
  editorial_note: This partnership is a concrete example of open banking data being
    used for lending at meaningful scale, connecting to the FCA's and Treasury's recent
    policy signals on open finance and credit assessment.
  sources: '[Abound Partners with D•One to Expand Open Banking Credit Access for 3.5
    Million Users](https://ffnews.com/news/abound-partners-with-done-to-expand-open-banking-credit-access-for-35-million-users)
