- headline: Mastercard and Pexa test programmable settlement for UK homebuying
  standfirst: Programmable account-to-account payments could synchronise the multiple
    fund transfers involved in property chains, applying non-card settlement logic
    to one of the UK's most manually coordinated transaction types.
  body: 'Mastercard is working with Pexa, the Australian property exchange platform
    that entered the UK market in 2022, to test programmable account-to-account payments
    for synchronised settlement in homebuying. The aim is to use programmable logic
    to coordinate the multiple simultaneous fund transfers involved in property chains,
    where a single delayed payment can collapse an entire sequence of linked transactions.


    Property completion in England and Wales remains one of the few high-value consumer
    transactions still reliant on manual payment coordination, typically involving
    solicitors initiating individual bank transfers and confirming receipt by phone.
    Pexa''s platform already handles electronic property settlement in Australia,
    and the Mastercard collaboration applies programmable payment capabilities to
    the problem.


    For Mastercard, the project extends its account-to-account ambitions beyond retail
    payments and into a domain where card rails have no presence. It also intersects
    with the UK government''s broader smart data agenda, which has already produced
    the Centre for Finance, Innovation and Technology Open Property roadmap published
    in May. Whether the approach can scale in the UK depends on integration with the
    Land Registry and conveyancing workflows, neither of which is straightforward.'
  editorial_note: ''
  sources: '[Mastercard and Pexa explore synchronised settlement for homebuying](https://www.finextra.com/newsarticle/48200/mastercard-and-pexa-explore-synchronised-settlement-for-homebuying?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
