title: 'CFPB refiles open banking rule; Deutsche Bank completes Wero rollout; Mastercard
  tests programmable settlement

  '
social_post: 'CFPB sends its rewritten open banking rule to the White House, Deutsche
  Bank group completes its full Wero rollout, and Mastercard tests programmable A2A
  settlement for UK homebuying. Today''s briefing: {link}

  '
stories:
- headline: CFPB submits rewritten open banking rule to White House for review
  standfirst: The revised Section 1033 proposal moves closer to replacing the Biden-era
    rule after the bureau sent it to the Office of Information and Regulatory Affairs
    on August 6.
  body: 'The Consumer Financial Protection Bureau (CFPB) has submitted a new version
    of its open banking regulation to the Office of Information and Regulatory Affairs
    (OIRA), the White House body that reviews proposed federal rules before publication.
    The submission, made on August 6, marks a concrete step toward replacing the original
    Section 1033 rule finalised under the Biden administration, which CFPB director
    Russell Vought signalled in June would be substantially rewritten.


    The revised proposal follows the bureau''s June announcement that it would impose
    limits on the types of data covered and introduce fees that fintechs would pay
    to access bank-held consumer information. Those provisions drew sharp criticism
    from fintech trade groups, who argued the fee structure would undermine the rule''s
    purpose. OIRA review typically takes 90 days but can be extended, meaning a final
    rule is unlikely before the end of 2026.


    For European observers, the US rulemaking trajectory remains relevant as a point
    of comparison. The original Section 1033 rule drew heavily on open banking models
    pioneered in the UK and EU. A narrower US rule, with fees layered onto data access,
    would represent a distinct approach and could influence how other jurisdictions
    outside Europe frame their own open finance regimes.'
  editorial_note: This advances the US open banking regulatory story meaningfully
    from the June rewrite announcement, with the rule now formally entering White
    House review — a concrete procedural milestone relevant to European firms watching
    transatlantic regulatory divergence.
  sources: '[CFPB Submits New Section 1033 “Open Banking” Proposal to OIRA for Review](https://news.vaquill.com/item/6ed06c6a-4c8e-439d-9466-b6b3ac367c9f)
    — News | [What we know about the CFPB''s forthcoming open-banking rule | Business
    Information & News](https://today.westlaw.com/Document/I8ecdc2f0911b11f18e07b0e11951504f/View/FullText.html?transitionType=CategoryPageItem&contextData=(sc.Default))
    — FE | [Mutual advocates hope new rules can halt sector''s long slide—and more
    in Bankers'' Hours](https://www.linkedin.com/pulse/what-we-know-cfpbs-forthcoming-open-banking-rule-mutual-pscce)
    — Linkedin'
