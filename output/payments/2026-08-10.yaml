    stale: false
    duplicate: false
    warnings:
    - 'verification response could not be parsed: "I''ll fact-check this story about
      US banks and fintechs escalating lobbying as the CFPB''s open banking rule nears
      approval. Let me search for informati"'
  revision:
    replaced: false
