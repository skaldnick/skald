title: 'US open banking lobbying; LemFi stablecoin remittances; Malaysia open finance
  launch

  '
social_post: 'US banks and fintechs are spending big to shape the CFPB''s open banking
  rule before it leaves the White House. Plus: stablecoin-settled remittances and
  Malaysia''s open finance push. {link}

  '
stories:
- headline: US banks and fintechs escalate lobbying as open banking rule nears approval
  standfirst: A revised open banking proposal has reached the White House review stage,
    triggering an intense and well-funded lobbying push from both incumbents and fintechs.
  body: 'The Consumer Financial Protection Bureau (CFPB) has sent its revised open
    banking rule to the Office of Information and Regulatory Affairs for White House
    review, a procedural step that typically precedes finalisation. The revised proposal,
    which followed the agency''s June rewrite introducing data-sharing limits and
    fintech access fees, has prompted a surge in lobbying from both sides of the debate.


    Traditional banks and their trade groups are pushing to retain provisions that
    would impose costs on fintechs accessing consumer data, while fintech firms and
    advocacy groups are lobbying to ensure the rule preserves broad, low-friction
    data access. Both camps have reportedly spent millions in recent months, reflecting
    the commercial stakes involved. The rule''s outcome will shape how US consumers
    share financial data with third parties, with direct implications for account
    aggregators, neobanks and open banking infrastructure providers.


    For European firms, the trajectory of US open banking regulation remains material.
    Several major European open banking and account-to-account payments companies
    have US operations or ambitions, and the shape of the CFPB rule will determine
    the competitive landscape they enter. The contrast with Europe''s more prescriptive
    regulatory approach – where PSD2 mandated access and PSD3 will refine it – continues
    to sharpen.'
  editorial_note: Relevant to European firms with US exposure.
  sources: '[Open Banking Policy Fight Intensifies as Banks and Fintechs Ramp Up Lobbying](https://www.kucoin.com/news/flash/open-banking-policy-fight-intensifies-as-banks-and-fintechs-ramp-up-lobbying)
    — KuCoin | [Open banking policy fight sees big spending from traditional banks
    and fintechs](https://cryptobriefing.com/open-banking-lobbying-banks-fintechs/)
    — Crypto Briefing | [Vault: Open banking players near the finish line](https://punchbowl.news/article/vault/open-banking-cfpb/)
    — Punchbowl News'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the CFPB, which is also the subject of the headline
      (''US banks and fintechs escalate lobbying as open banking rule nears approval''
      is about the CFPB''s rule). Per house style, the standfirst should begin with
      the substantive point (the White House review stage and lobbying) rather than
      naming the organisation: suggest opening with ''The revised open banking proposal
      has reached...'' or ''An intense and well-funded lobbying push...'''
    - Body text uses 'account-to-account' instead of the preferred 'account-to-account
      (A2A)' on first mention (if A2A recurs, which it doesn't, so this should be
      spelled out without abbreviation per the rule about only including abbreviations
      if they recur).
    - Editorial note included text 'Advances the US open banking rule story materially
      from the June 30 CFPB rewrite' — editorial notes should not be included in the
      copy submitted for style review; this appears to be metadata that should be
      removed.
  verification:
