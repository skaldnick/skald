- headline: Brazil's central bank signals plan to connect Pix to foreign instant payment
    networks
  standfirst: Cross-border linkages between national instant payment systems could
    offer an alternative model to correspondent banking, with implications for European
    schemes pursuing similar interoperability.
  body: 'Brazil''s central bank has indicated with increased confidence that it intends
    to link its instant payment system, Pix, to equivalent platforms in other countries.
    A report published on August 10 outlined how such connections could lower cross-border
    transaction costs, accelerate settlement and broaden access for consumers and
    businesses on both sides.


    Pix processed nearly 80 billion transactions domestically in 2025 and has become
    the dominant retail payment method in Brazil. Connecting it to foreign instant
    payment systems would test whether bilateral or multilateral linkages between
    domestic schemes can function as a viable alternative to traditional correspondent
    banking for cross-border retail and remittance flows.


    The ambition mirrors efforts elsewhere. The ECB''s cross-currency instant payments
    pilot on TIPS, which launched in June connecting the euro area with Denmark and
    Sweden, and the mBridge project – now governed by its participating central banks
    after the BIS exited in October 2024 – both pursue variations of the same idea.
    Brazil''s move adds another major economy to the list of countries actively building
    cross-border instant payment corridors, reinforcing the trajectory away from card
    networks and correspondent banks as the default international payment rails.'
  editorial_note: Brazil's Pix internationalisation is relevant to European professionals
    because it tests the same cross-border instant payment interoperability model
    the ECB and EPI are pursuing. Adds a major non-European data point to a core European
    debate.
  sources: '[Brazil Signals Surging Confidence in Plan to Export Pix Globally](https://www.pymnts.com/news/payment-methods/2026/brazil-signals-surging-confidence-in-plan-to-export-pix-globally/)
