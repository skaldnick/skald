title: 'CFPB open banking rewrite; NatWest mortgage verification; Brazil''s Pix goes
  global

  '
social_post: 'The CFPB''s open banking rewrite puts data-access fees at the centre
  of a lobbying battle. Plus: NatWest uses open banking to verify mortgage income,
  and Brazil moves to export Pix internationally. {link}

  '
stories:
- headline: CFPB open banking rewrite centres on data-access fees for fintechs
  standfirst: Banks could soon charge fintechs for consumer data access under a revised
    Section 1033 rule heading to the White House for review, reshaping the economics
    of the US open banking market.
  body: 'The Consumer Financial Protection Bureau (CFPB) has sent a rewritten version
    of its open banking rule to the Office of Information and Regulatory Affairs for
    White House review. The revision is expected to narrow the scope of data that
    banks must share and introduce a framework under which banks could charge third
    parties for access, a sharp departure from the original rule''s emphasis on free
    data portability.


    The fee question has become the central fault line. Banks and credit unions, represented
    by groups including the Consumer Bankers Association, have argued that the original
    rule effectively mandated an open banking framework that went beyond the statute''s
    intent. Fintechs counter that introducing fees would undermine the competitive
    dynamics that Section 1033 was designed to enable, and some have flagged potential
    conflicts with the Trump administration''s own executive order on reducing regulatory
    costs.


    The rewrite arrives during the August congressional recess, but industry lobbying
    on both sides has intensified. The outcome will determine whether the US adopts
    a model closer to Europe''s free-access approach or one that compensates data
    holders, with implications for any fintech business model built on open banking
    connectivity.'
  editorial_note: 'This advances the previously covered CFPB open banking story with
    a materially new development: the revised rule has been sent to OIRA, and the
    fee framework has emerged as the defining issue. Directly relevant to European
    firms watching US regulatory divergence.'
  sources: '[CFPB Open Banking Rewrite Could Put Data-Access Fees at Center of Section
    1033 Fight](https://www.pymnts.com/legal/bank-regulation/2026/cfpb-open-banking-rewrite-could-put-data-access-fees-at-center-of-section-1033-fight/)
    — Pymnts | [Interchange Fight, Open Banking Rule Loom Over Credit Unions During
    August Recess](https://www.cutoday.info/Fresh-Today/Interchange-Fight-Open-Banking-Rule-Loom-Over-Credit-Unions-During-August-Recess)
    — Cutoday | [Main Street Ledger: What''s at Stake as the CFPB Reconsiders Its
    Personal Financial Data ...](https://consumerbankers.com/blog/main-street-ledger-whats-at-stake-as-the-cfpb-reconsiders-its-personal-financial-data-rights-rule/)
    — Consumerbankers'
