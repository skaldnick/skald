- headline: 'Belvo launches protocol connecting AI agents to open finance data in
    Latin America

    '
  standfirst: 'The Model Context Protocol integration gives AI agents structured access
    to banking data across multiple Latin American markets, an early implementation
    of the agentic finance pattern European regulators are beginning to examine.

    '
  body: 'Belvo has launched a Model Context Protocol (MCP) integration that allows
    AI agents, including those built on platforms such as ChatGPT, to access open
    finance data across Latin American banking systems. The infrastructure layer lets
    AI agents retrieve account balances, transaction histories and other financial
    data with user consent, enabling personalised financial interactions without requiring
    users to navigate individual banking apps.


    MCP, originally developed by Anthropic, provides a standardised way for AI models
    to interact with external data sources. Belvo''s implementation applies this to
    its existing open finance connectivity across markets including Mexico, Brazil
    and Colombia, effectively turning its API infrastructure into an agentic-ready
    data layer.


    The launch is an early commercial implementation of a pattern European regulators
    and industry bodies are actively exploring. The Euro Banking Association published
    its mapping of agentic AI''s role in open finance in June, and the FCA''s July
    AI review placed agentic payments within its regulatory scope. Belvo''s move in
    Latin America offers a live reference point for how AI agents might interact with
    open finance rails at scale.

    '
  editorial_note: 'While geographically Latin American, this is the first production-grade
    MCP integration for open finance and directly relevant to the agentic payments
    and open finance discussions underway at the EBA, FCA and ECB.

    '
  sources: '[Belvo launches MCP to connect AI to financial data in LatAm](https://www.openbankingexpo.com/news/belvo-launches-mcp-to-connect-ai-to-financial-data-in-latam/)
    — Open Banking Expo | [Belvo Launches MCP to Bridge AI Agents and Open Finance
