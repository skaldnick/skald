- headline: 'NatWest adopts open banking income verification for mortgage applications

    '
  standfirst: 'Partnering with Equifax, the bank is using open banking data to verify
    applicant income in real time, replacing manual document checks in mortgage underwriting.

    '
  body: 'NatWest is using open banking to verify mortgage applicants'' income and
    employment status, working with Equifax to pull transaction data directly from
    applicants'' bank accounts with their consent. The approach replaces the manual
    submission and review of payslips and bank statements that have long defined mortgage
    underwriting in the UK.


    The integration allows NatWest to cross-reference declared income against actual
    payment patterns, reducing both processing time and the scope for document fraud.
    Equifax''s role is to aggregate and structure the open banking data into formats
    that fit the bank''s existing affordability models.


    This follows the Financial Conduct Authority''s (FCA) signal in June that open
    banking data would reshape mortgage affordability assessments. NatWest''s adoption
    suggests that shift is now moving from regulatory expectation to operational reality.
    For open banking providers, mortgage verification represents a high-value, high-volume
    use case that goes well beyond payments.

    '
  editorial_note: 'Concrete evidence of open banking penetrating mortgage underwriting
    at a major UK bank, following the FCA''s June signal on this topic. Advances the
    regulatory-to-implementation narrative.

    '
  sources: '[How NatWest & Equifax Combat Mortgage Fraud via Open Banking](https://fintechmagazine.com/articles/how-natwest-equifax-combat-mortgage-fraud-via-open-banking)
    — FinTech Magazine'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming Equifax, the partner organisation, rather than leading
      with the substantive action or finding. Should open with ''The bank is using…''
      or ''NatWest is integrating…'' to avoid redundancy with the headline''s naming
