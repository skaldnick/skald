    - Replaced 'It adds another data point to the global trend of instant payment
      schemes seeking cross-border reach' with a direct statement of the trend ('Domestic
      instant payment schemes are increasingly seeking cross-border reach') that lets
      Pix illustrate it without hedging language.
- headline: RBC and BMO sell Moneris to Francisco Partners for C$2bn
  standfirst: The sale of Canada's largest merchant acquirer to a private equity buyer
    for C$2bn in cash extends a pattern of bank divestiture in payments processing
    that has reshaped the European market.
  body: 'Royal Bank of Canada and Bank of Montreal have agreed to sell Moneris, their
    jointly owned payments processing business, to private equity firm Francisco Partners
    for C$2 billion in cash. Moneris is Canada''s largest merchant acquirer, processing
    payments for businesses across the country.


    The sale follows a pattern of bank-owned acquiring businesses being divested to
    specialist buyers. European parallels are clear: Credit Agricole recently took
    full ownership of its Worldline merchant payments venture, while Nexi and Worldline
    have themselves been shaped by successive rounds of bank divestiture and PE-backed
    consolidation. Large banks have increasingly concluded that merchant acquiring,
    while adjacent to their core business, requires specialist investment and operating
    models that sit more naturally outside a universal banking structure.


    Francisco Partners, which focuses on technology investments, is likely to pursue
    a growth and efficiency strategy typical of PE ownership in payments. Financial
    sponsors continue to show strong appetite for merchant payments assets even as
    the sector becomes highly consolidated – a dynamic European acquirers and processors
    will recognise.'
  editorial_note: Major bank divestiture of a payments processor to PE is a recurring
    theme in European payments consolidation. The Moneris sale provides a direct parallel
    and signals continued buyer appetite.
  sources: '[RBC and BMO agree C$2bn Moneris sale](https://www.finextra.com/newsarticle/48228/rbc-and-bmo-agree-c2bn-moneris-sale?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (Canada's largest merchant payment
      processor) rather than the substantive action. Should open with 'Royal Bank
      of Canada and Bank of Montreal have agreed to sell...' or similar action-first
      phrasing, avoiding redundancy with the headline which already identifies RBC
      and BMO.
    - Body text uses em-dash (—) instead of en-dash (–) in 'Credit Agricole recently
      took full ownership of its Worldline merchant payments venture, while Nexi and
      Worldline have themselves been shaped by successive rounds of bank divestiture
      and PE-backed consolidation — The deal reflects' (should be en-dash).
    - Sentence 'The deal reflects a broader judgment by large banks that merchant
      acquiring...' begins a paragraph that announces the significance/judgment before
      making the substantive point directly. This violates the rule against flagging
      significance explicitly. Rewrite to lead with the substantive observation directly.
    - Phrase 'The transaction signals continued appetite from financial sponsors'
      uses 'signals' in a way that hedges or announces significance. Lead directly
      with the substantive claim about buyer appetite without the signaling language.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    summary:
    - Revised standfirst to open with the substantive action ('The sale of…') rather
      than naming the organisation redundantly with the headline.
    - No em-dash was present in the original body text, but reviewed all dashes for
      compliance; replaced one instance with an en-dash where appropriate.
    - Rewrote the sentence beginning 'The deal reflects a broader judgment…' to lead
      with the substantive observation ('Large banks have increasingly concluded…')
      rather than announcing significance.
    - Rewrote the final sentence to state buyer appetite directly ('Financial sponsors
      continue to show strong appetite…') rather than using 'signals' framing.
- headline: Belvo launches MCP servers for agentic open finance in Latin America
  standfirst: Belvo has released three Model Context Protocol servers that give AI
    agents structured access to open finance data, building production-ready infrastructure
    for agentic finance in the region.
  body: 'Belvo has launched three Model Context Protocol (MCP) servers designed to
    let AI agents access and analyse open finance data across Latin America. The servers
    provide structured interfaces through which AI agents can retrieve financial information,
    moving agentic finance from conceptual discussion toward production-ready infrastructure.


    MCP, developed by Anthropic, is emerging as a standard protocol for connecting
    AI models to external data sources and tools. Belvo''s implementation applies
    this specifically to open finance, enabling agents to query bank accounts, categorise
    transactions and perform financial analysis through standardised API connections.
    FactSet launched an MCP server for financial data in December 2025, but Belvo''s
    deployment is among the first to target open finance APIs specifically.


    European open banking and open finance providers face the same architectural question
    Belvo is addressing: how AI agents will interact with financial data APIs. As
    agentic payments and finance gain traction in Europe, with live pilots from ING,
    Credit Agricole and others already completed, the infrastructure layer enabling
    agents to consume financial data reliably becomes a competitive differentiator.
    Belvo''s implementation demonstrates one way to build that layer, using a standardised
    protocol to bridge AI agents and regulated financial data sources.'
  editorial_note: Agentic payments and finance are a live topic in European open banking.
    Belvo's MCP implementation is one of the first production-grade attempts to build
    the data access layer for AI agents in financial services.
  sources: '[Belvo launches MCP servers for agentic open finance](https://thepaypers.com/fintech/news/belvo-launches-mcp-servers-for-agentic-open-finance)
    — The Paypers'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens with ''Purpose-built infrastructure'' rather than a specific,
      concrete action or finding. Rule: ''The standfirst should lead with a specific,
      concrete finding or action — naming who did what and what the result was — rather
      than opening with a general thematic claim.'' Revise to begin with ''Belvo has
      launched...'' or similar concrete action.'
    - 'Body text uses ''It is one of the first dedicated deployments of MCP for financial
      data access'' — this is a vague claim introduced without concrete support. Rule:
      ''Do not describe a development as "one of a growing number" in a way that hedges
      its significance.'' Remove hedging language or replace with a direct, unqualified
      statement.'
    - 'Body text states ''Belvo''s approach offers an early reference point for how
      that layer might be built'' — this is a hedged, speculative claim. Rule: ''Do
      not open a paragraph with "The deal is far from certain" or equivalent hedging
      scene-setters that delay the substantive point.'' State directly what Belvo''s
      approach demonstrates or enables rather than hedging with ''offers an early
      reference point.'''
    - 'Editorial note should not be included in the copy for review. Rule: ''Do not
      include editorial notes about missing information.'' However, if this note is
      metadata, it should be disregarded; but if it forms part of the published content,
      it violates the rule against including editorial commentary.'
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Draft claims Belvo is 'one of the first dedicated deployments of MCP for financial
      data access' but FactSet launched an MCP server for financial data in December
      2025, preceding Belvo's August 2026 launch
  revision:
    replaced: false
    summary:
    - Revised standfirst to open with a specific, concrete action ('Belvo has released
      three Model Context Protocol servers…') rather than a general thematic claim.
    - Removed the unsupported claim that Belvo's deployment is 'one of the first dedicated
      deployments of MCP for financial data access' and replaced it with a direct
      comparison noting FactSet's earlier MCP server for financial data, while clarifying
      Belvo's focus on open finance APIs specifically.
    - Replaced the hedged closing sentence ('offers an early reference point for how
      that layer might be built') with a direct statement of what Belvo's implementation
      demonstrates.
    - Editorial note left unchanged as it is metadata rather than published content.
