title: 'Apple Pay chief departs; Pix eyes cross-border; Moneris sold; Belvo builds
  agentic open finance

  '
social_post: 'Apple''s payments chief is out after 23 years, Brazil wants Pix to go
  global, and Canada''s biggest merchant acquirer gets sold to PE. Today''s briefing:
  {link}

  '
stories:
- headline: Apple Pay chief Jennifer Bailey to leave after more than 25 years
  standfirst: Banks, payment networks and fintechs that have built around or competed
    against Apple's payments ecosystem face uncertainty about strategic direction
    at a pivotal moment for mobile payments.
  body: 'Jennifer Bailey, Apple''s vice president of payment and wallet services,
    is leaving the company after more than 25 years. Bailey led the launch and expansion
    of Apple Pay, Apple Wallet and Apple Card, building the infrastructure that made
    Apple a central player in consumer payments globally.


    Her exit comes as Apple faces intensifying regulatory and competitive pressure
    on multiple fronts. The EU''s Digital Markets Act has already forced Apple to
    open iPhone NFC access to rival wallets, and similar moves are under consideration
    in other jurisdictions. Apple Pay''s dominance at the point of sale is also being
    tested by the rise of pay-by-bank alternatives and agentic payment models that
    bypass traditional card and wallet rails entirely.


    Apple has not named a successor or indicated whether Bailey''s portfolio will
    be restructured. For banks, payment networks and fintechs that have built around
    or competed against Apple''s payments ecosystem, the transition creates a period
    of uncertainty about the pace and direction of Apple''s next moves in the space.'
  editorial_note: Bailey is one of the most consequential figures in consumer payments
    over the past decade. Her departure affects anyone building products that interact
    with Apple's payments stack.
  sources: '[Apple Pay and Wallet chief Bailey to leave](https://www.finextra.com/newsarticle/48232/apple-pay-and-wallet-chief-bailey-to-leave?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'The departure of the executive' — this violates the rule
      against opening by naming the organisation also named in the headline. The standfirst
      should open with the substantive point (the strategic uncertainty or regulatory
      pressure), not repeat the subject from the headline. Revise to lead with the
      concrete impact.
    - Standfirst uses 'opens questions about' — a vague framing that announces significance
      before making a substantive point. Replace with a direct statement of what the
      uncertainty or challenge is.
    - Editorial note states 'Her departure is significant for anyone building products'
      — this violates the rule against flagging significance explicitly. Do not announce
      importance; if it belongs in the story, integrate it as substantive content
      in the body instead of flagging it in an editorial note.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
