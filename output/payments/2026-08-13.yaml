- headline: PSR issues final directions on card scheme transparency and consults on
    payee verification
  standfirst: Two regulatory actions in a single day tighten oversight of card schemes
    and signal further expansion of confirmation of payee requirements.
  body: 'The Payment Systems Regulator (PSR) has published policy statement PS26/1,
    issuing two final specific directions requiring card schemes to provide enhanced
    information and improve transparency around their pricing and practices. The directions
    follow the PSR''s market review, which proposed mandatory UK profit reporting
    for Visa and Mastercard.


    Separately, the PSR has published consultation paper CP26/2 proposing amendments
    to specific direction 17, which governs confirmation of payee (CoP). The consultation
    considers extending and expanding CoP requirements, potentially broadening the
    range of payment service providers that must participate in payee name-checking
    before payments are sent.


    The two publications arrive in the same week that UK fraud losses were reported
    at £1.3 billion, with authorised push payment scams rebounding sharply. Expanding
    CoP coverage addresses one of the most straightforward fraud-prevention tools
    available, while the card scheme transparency directions continue the PSR''s sustained
    pressure on interchange and scheme fee economics. Together, they represent the
    regulator pressing on both the account-to-account and card sides of UK payments
    simultaneously.'
  editorial_note: ''
  sources: '[UK PSR Market Review: Final Directions To Card Schemes On Information,
    Transparency ...](https://www.jdsupra.com/legalnews/uk-psr-market-review-final-directions-8548597/)
    — Jdsupra | [UK PSR Consults On Extending And Expanding CoP Specific Direction
    17](https://www.jdsupra.com/legalnews/uk-psr-consults-on-extending-and-2135809/)
    — JD Supra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (PSR) that is also named in the
      headline. Rule requires opening with the substantive point instead — revise
      to begin with 'Two regulatory actions in a single day tighten oversight...'
      or similar, avoiding 'The Payment Systems Regulator'
    - Body text uses 'earlier this year' which is a vague temporal reference. Rule
      requires specific time periods — replace with the actual month or quarter when
      the market review proposed mandatory UK profit reporting
    - Body text uses 'account-to-account' as a spelled-out term but should use 'A2A'
      abbreviation per house style, or this should be 'A2A (account-to-account)' on
      first use in body if the abbreviation recurs. Check if A2A is used again; if
      not, the current spelling is acceptable but the rule prefers the abbreviation
      form
    - Editorial note should not be included in the copy check output as per instructions
      — notes about missing information or editorial context should not appear in
      final text
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
