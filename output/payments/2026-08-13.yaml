title: 'BoE digital pound phase two; N26 adds Wero; PSR tightens card scheme oversight

  '
social_post: 'Bank of England brings stablecoins and the digital pound into trade
  finance. Plus: N26 rolls out Wero, and the PSR issues final directions on card scheme
  transparency. {link}

  '
stories:
- headline: 'Bank of England tests stablecoin and digital pound interoperability in
    trade finance pilot

    '
  standfirst: 'Phase two of the Digital Pound Lab is exploring how regulated stablecoins
    and a potential digital pound could work together in cross-border SME trade finance,
    with open finance data feeding automated credit decisions.

    '
  body: 'The Bank of England has selected Polygon Labs to lead a workstream in the
    second phase of its Digital Pound Lab, testing how stablecoins and a future digital
    pound could interoperate within cross-border trade payment flows. A separate workstream,
    led by NOBO with Dun & Bradstreet and Polygon, will attempt to generate reusable
    credit profiles for small and medium-sized businesses by combining consent-based
    wallet transaction data, open finance information and commercial intelligence.


    The trial builds on the Bank''s earlier finding that distributed ledger technology
    presents "significant trade-offs" for wholesale settlement. Phase two narrows
    the focus to a practical use case – trade finance – where programmable payments
    and automated credit assessment could reduce friction for SMEs that struggle with
    traditional documentary credit processes. Smart contracts on Polygon''s infrastructure
    would govern the settlement logic.


    The open finance component is worth watching. If the pilot demonstrates that consent-driven
    transaction data from multiple sources can produce a bankable credit profile,
    it offers a template for how open finance rails might extend beyond consumer lending
    into business credit – a gap that the UK''s forthcoming open finance framework
    is expected to address.

    '
  editorial_note: 'This advances the Bank of England''s digital pound work into a
    concrete, use-case-specific phase, and the integration of open finance data into
    SME credit profiling is directly relevant to the UK''s open finance policy trajectory.

    '
