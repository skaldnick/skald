- headline: N26 launches Wero in Germany and France as EPI widens its retail footprint
  standfirst: Wero now reaches retail customers at N26 alongside ING, BoursoBank and
    Viva, widening EPI's effort to build a pan-European payment method that bypasses
    card networks.
  body: 'N26 is rolling out Wero, the European Payments Initiative''s (EPI) digital
    wallet and instant payment solution, directly within its app in Germany and France.
    Customers can send and receive money in seconds using a phone number or email
    address, without sharing an IBAN.


    Daniel Lappas, N26''s chief product and business officer, said instant payments
    without an IBAN had been a core feature since the bank''s inception. The Wero
    integration replaces N26''s proprietary person-to-person transfer with a scheme-level
    solution that is interoperable across participating banks and markets. EPI has
    been steadily expanding its reach: ING brought Wero to 10 million German customers
    in June, BoursoBank has announced plans to integrate it by the end of 2026, Austrian
    banking groups joined in late June, and Rabobank began migrating iDEAL volumes
    to Wero in the Netherlands.


    The accumulation of launches matters less for any single bank''s scale than for
    the pattern it establishes. Wero is moving from pilot curiosity to a product with
    genuine multi-bank, multi-market presence. Whether that translates into merchant
    acceptance at the point of sale, rather than just person-to-person transfers,
    remains the harder test.'
  editorial_note: The steady drumbeat of Wero integrations across banks and markets
    is the most consequential ongoing story in European payment scheme development.
    N26's launch adds a major neobank to the roster.
  sources: '[N26 Expands Instant Payment Offer With Introduction of European Digital
    Payment Solution Wero](https://financialit.net/news/payments/n26-expands-instant-payment-offer-introduction-european-digital-payment-solution-wero)
    — Financialit | [N26 adds Wero instant payment solution to its app](https://thepaypers.com/payments/news/n26-adds-wero-instant-payment-solution-to-its-app)
    — The Paypers | [N26 Rolls Out Wero for Instant Transfers Across Germany and France](https://fintechnews.ch/fintechgermany/n26-wero/84988/)
    — Fintechnews | [N26 Launches Wero Digital Wallet for IBAN-Free Instant Payments
    in Germany and France](https://ffnews.com/news/n26-expands-instant-payment-offer-with-introduction-of-european-digital-payment--850215b3)
    — Ffnews | [N26 adds Wero payments to app](https://www.finextra.com/pressarticle/110635/n26-adds-wero-payments-to-app?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'The neobank's integration marks another step in EPI's
      effort' — this repeats the subject (EPI) named in the headline. Per house style,
      the standfirst should begin with a substantive point rather than restating the
      headline's subject. Revise to lead with the concrete finding (e.g., 'Wero now
      reaches retail customers at N26 alongside ING, BoursoBank and Viva, widening
      EPI's…').
    - 'Body text contains ''N26''s addition is significant less for its individual
      scale than for what the accumulation of launches signals.'' This explicitly
      announces significance before making the substantive point, violating the rule
      against ''This matters because'' or equivalent framing. Rewrite directly: ''N26''s
      addition matters less for its individual scale than for what the accumulation
      of launches signals'' or simply remove the significance flag and lead with the
      substantive claim.'
    - 'Body text contains ''Whether that translates into merchant acceptance at the
      point of sale – rather than just person-to-person transfers – remains the harder
      test.'' This uses an em-dash (–) in mid-sentence parenthetical; house style
      requires commas for this construction. Replace with commas: ''Whether that translates
      into merchant acceptance at the point of sale, rather than just person-to-person
      transfers, remains the harder test.'''
    - 'The standfirst refers to ''recent launches at ING, BoursoBank and Viva'' but
      the body specifies timing: ''in June'', ''the same month'', and ''late June''.
      Per house style, avoid vague temporal references in standfirst; use specific
      dates or months. Replace ''recent launches'' with ''launches in June'' or similar
      precision.'
    - 'The headline and standfirst both start with the same subject framing (N26/neobank
      + EPI). Vary the opening: either revise the standfirst to lead with the concrete
      action/finding as noted above, or adjust the headline.'
