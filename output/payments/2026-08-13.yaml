- headline: Jennifer Bailey to leave Apple after leading Apple Pay for over a decade
  standfirst: One of the most influential figures shaping how consumers interact with
    payment credentials on mobile devices is stepping down, removing the architect
    of Apple's payments and wallet business at a moment of regulatory and competitive
    flux in Europe.
  body: 'Jennifer Bailey, Apple''s head of payment and wallet services, is leaving
    the company after more than 25 years. Bailey oversaw the launch and growth of
    Apple Pay, which has become the dominant mobile wallet in most European markets
    and a critical piece of infrastructure for card issuers, payment networks and
    merchants alike.


    Her departure comes at a point when Apple''s payments position is under regulatory
    and competitive pressure in Europe. The Digital Markets Act forced Apple to open
    NFC access on iPhones to third-party wallets, ending the exclusive position Apple
    Pay held at the point of sale. The European Payments Initiative''s Bluecode launched
    NFC payments on iOS via the Discover network in June, and card schemes are exploring
    alternatives to Apple''s wallet for credential storage.


    Who replaces Bailey – and whether Apple reorganises the payments function or treats
    it as a continuation role – will matter to every European issuer and scheme that
    has built distribution strategy around Apple Pay''s reach.'
  editorial_note: Bailey's role shaped mobile payment infrastructure across Europe.
    Her exit affects issuers, schemes and fintechs whose strategies depend on Apple's
    wallet ecosystem, particularly as regulatory changes are reshaping that ecosystem.
  sources: '[Apple Pay and Wallet chief Bailey to leave](https://www.finextra.com/newsarticle/48232/apple-pay-and-wallet-chief-bailey-to-leave?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the subject ('The departure of the executive') rather
      than leading with the substantive point or action. Should open with what happened
      (e.g., 'Jennifer Bailey is leaving Apple after…') to avoid the redundancy rule
      breach of opening with the organisation/subject already named in the headline.
    - 'Body text uses ''EPI''s Bluecode'' without spelling out ''EPI'' in full on
      first use. Rule requires: ''Electronic Payment Initiative (EPI)'' or similar
      on first mention in body, even if the abbreviation appeared in standfirst.'
    - Editorial note states 'Her exit is material for issuers, schemes and fintechs'
      – this is flagging significance explicitly ('is material') before making the
      substantive point, breaching the rule against phrases that announce importance
      before explaining it. Remove 'is material' and state the substantive consequences
      directly.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Draft states Bailey leaving 'after 23 years' but sources consistently state
      'more than 25 years' at Apple
  revision:
    replaced: false
    summary:
    - Corrected tenure from '23 years' to 'more than 25 years' per source evidence.
    - Revised standfirst to open with the substantive point rather than naming the
      subject already identified in the headline.
    - Spelled out 'EPI' as 'the European Payments Initiative' on first use in body
      text. Abbreviation not parenthesised as it does not recur.
    - Removed 'is material' from editorial note and restated the point directly to
      avoid flagging significance explicitly.
