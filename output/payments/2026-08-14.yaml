- headline: Canada publishes first technical specifications for open finance data
    portability
  standfirst: Forty-five days of public review are now open on draft standards that
    give Canadian institutions their first concrete blueprint for implementing consumer-directed
    data sharing.
  body: 'Draft technical specifications for open finance data portability in Canada
    have been published by the Digital Governance Standards Institute and the Open
    Finance Network of Canada. The documents are open for a 45-day public review period.


    Canada''s open banking framework has moved slowly relative to the UK, Australia
    and the EU. The country passed enabling legislation and designated a lead entity,
    but has lacked the detailed technical standards that firms need to build against.
    These draft specifications begin to close that gap, covering how consumer-permissioned
    financial data should be structured, transmitted and secured.


    For European firms operating or expanding in North America, the specifications
    are worth tracking. Canada''s standards choices, particularly around API design
    and authentication, will shape whether cross-border open finance interoperability
    becomes practical or remains aspirational. The Bank for International Settlements''
    recent Project Aperta work on cross-border open finance makes the Canadian approach
    directly relevant to the European discussion.'
  editorial_note: Canada publishing concrete open finance technical specs is a regulatory
    milestone with implications for cross-border interoperability, relevant to European
    firms watching North American market access.
  sources: '[DGSI, OFNC publish draft technical specifications on Open Finance data
    portability in Canada](https://www.openbankingexpo.com/news/dgsi-ofnc-publish-draft-technical-specifications-on-open-finance-data-portability-in-canada/)
    — Openbankingexpo'
  style_check:
    compliant: false
    warnings:
