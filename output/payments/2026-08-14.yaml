- headline: 'Flywire and Trustly extend open banking payments to North America

    '
  standfirst: 'Applying European-tested open banking infrastructure to US and Canadian
    education and healthcare payments, the partnership signals account-to-account
    methods gaining ground in verticals where card costs are high.

    '
  body: 'Flywire has expanded its partnership with Trustly to offer open banking payments
    across the US and Canada. The arrangement lets payers in Flywire''s core verticals
    – education, healthcare and travel – pay directly from bank accounts, bypassing
    card networks.


    Trustly built its account-to-account payments business in Europe, where open banking
    regulation provided the regulatory and technical foundations. Extending the same
    infrastructure to North America, where no equivalent regulatory mandate exists,
    requires a different approach: Trustly connects to US and Canadian banks through
    a combination of legacy ACH rails, the RTP network and bilateral integrations
    rather than standardised APIs.


    For Flywire, the appeal is straightforward. Education and healthcare payments
    tend to be high-value, low-frequency transactions where card interchange fees
    are a significant cost. Open banking payments in these verticals carry lower fraud
    risk than retail e-commerce and offer better conversion than wire transfers, which
    require manual effort from payers. The expansion reflects a pattern seen across
    several European open banking infrastructure providers now pushing into North
    America, including TrueLayer and Plaid.

    '
  editorial_note: 'A European-built open banking provider scaling its infrastructure
    into North America illustrates how the model is being exported beyond regulated
    markets into verticals where the economics favour account-to-account.

    '
  sources: '[Flywire expands Trustly partnership to deliver Open Banking payments
    in North America](https://www.openbankingexpo.com/news/flywire-expands-trustly-partnership-to-deliver-open-banking-payments-in-north-america/)
    — Openbankingexpo | [Flywire expands payment support in US and Canada with Trustly](https://www.electronicpaymentsinternational.com/news/flywire-trustly-us-canada-payments/)
