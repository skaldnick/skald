- headline: 'Zilch builds membership model on open banking data and salary advances

    '
  standfirst: 'New paid tiers and an open-banking-powered salary advance product mark
    a shift from pure BNPL toward a broader consumer finance platform monetising transaction
    data.

    '
  body: 'Zilch has launched two membership tiers – Zilch Extra at £2.99 per month
    and Zilch Plus – alongside two new features: Zilch Advance, an open-banking-powered
    salary advance, and Pay Monthly, which lets customers spread purchases over up
    to 12 months. The company describes it as its most significant product expansion
    since launch.


    Zilch Extra uses an open banking connection to deliver spending insights, cashback
    rewards and sharper merchant offers. Zilch Advance uses open banking income verification
    combined with AI-driven affordability assessment to offer eligible customers early
    access to earned wages. Both products sit under customers'' existing regulated
    credit agreements.


    The expansion illustrates a broader pattern among BNPL providers: using open banking
    not merely as a payment initiation channel but as the data layer underpinning
    credit decisions, personalisation and new revenue streams. Zilch is effectively
    monetising the open banking connection itself through a subscription model, rather
    than treating it as back-end plumbing. With UK BNPL regulation now in force since
    July 15, the timing positions Zilch''s credit products within the new regulatory
    perimeter from launch.

    '
  editorial_note: 'Zilch''s use of open banking as the commercial foundation of a
    membership model – not just a payment rail – is a concrete example of how open
    banking data is being monetised beyond payments.

    '
  sources: '[Zilch launches new membership tiers](https://www.finextra.com/pressarticle/110633/zilch-launches-new-membership-tiers?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra | [Zilch launches new membership tiers](https://www.finextra.com/pressarticle/110633/zilch-launches-new-membership-tiers)
    — Finextra Research'
