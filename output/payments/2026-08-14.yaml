title: 'Wero expands merchant and neobank reach; Canada drafts open finance specs;
  BoE tests stablecoin interoperability

  '
social_post: 'Wero picks up two more deployments in a week, Canada publishes its first
  open finance technical specs, and the BoE puts stablecoins and a digital pound on
  the same rail. Today''s briefing: {link}

  '
stories:
- headline: N26 integrates Wero as EPI builds neobank distribution across Europe
  standfirst: Wero gains its first major neobank deployment, extending EPI's reach
    beyond incumbent banks into a segment with over seven million customers in Germany
    and France.
  body: 'N26 has launched Wero directly within its mobile app, enabling its more than
    seven million customers in Germany and France to send and receive instant payments
    using only a phone number or email address, without sharing an IBAN. The integration
    went live on August 12.


    Wero''s distribution strategy has so far relied on incumbent banking groups –
    ING in Germany, BoursoBank in France, and Austrian cooperatives. Adding N26, which
    operates as a fully licensed bank but with a digital-native user base skewing
    younger, tests whether Wero can gain traction outside traditional banking relationships.
    N26''s customers are precisely the demographic most likely to default to card-linked
    wallets from Apple or Google.


    Separately, finby, a European payment service provider and acquirer, announced
    it is deploying Wero for its e-commerce merchants, marking another step in EPI''s
    push to move beyond person-to-person payments and into online checkout. The two
    announcements in the same week suggest EPI is accelerating distribution across
    both consumer and merchant sides simultaneously.'
  editorial_note: Wero's neobank expansion sharpens EPI's competitive positioning
    against card networks and big-tech wallets; the finby merchant deployment adds
    a second front.
  sources: '[N26 adds Wero payments to app](https://www.finextra.com/pressarticle/110635/n26-adds-wero-payments-to-app?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra | [finby boosts Wero to support the future of pan-European payments](https://www.finextra.com/pressarticle/110638/finby-boosts-wero-to-support-the-future-of-pan-european-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
