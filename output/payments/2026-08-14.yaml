- headline: Bank of England to test stablecoin and digital pound interoperability
    in trade finance
  standfirst: Cross-border settlement using stablecoins alongside a potential digital
    pound will be trialled in a second phase of the BoE's digital pound lab, with
    SME credit profiling built on open finance data.
  body: 'The Bank of England (BoE) is launching a second phase of its digital pound
    experimentation programme, selecting NOBO Finance, Dun & Bradstreet and Polygon
    Labs to build and test trade finance use cases. The project will trial interoperability
    between regulated stablecoins and a potential digital pound for cross-border settlement.


    A separate workstream within the same programme aims to construct a portable SME
    "bankable profile" by combining wallet transaction data, open finance information
    and commercial intelligence from Dun & Bradstreet. The goal is to give small businesses
    a reusable, data-rich credit identity that could reduce friction in trade finance
    applications – a segment where SMEs routinely face rejection due to thin credit
    files.


    The BoE''s earlier digital pound work focused primarily on retail use cases. Pivoting
    toward trade finance and SME lending suggests the central bank sees wholesale
    and business applications as a more compelling near-term justification for the
    infrastructure, particularly given political caution around a retail central bank
    digital currency.'
  editorial_note: The BoE moving its digital pound lab into trade finance and open-finance-based
    SME profiling is a shift from retail experimentation, with direct implications
    for stablecoin regulation and SME lending.
  sources: '[Bank of England to trial stablecoin, digital pound in trade finance](https://thepaypers.com/crypto-web3-and-cbdc/news/bank-of-england-to-trial-stablecoin-digital-pound-in-trade-finance)
    — The Paypers'
  style_check:
