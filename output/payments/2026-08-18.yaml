      so no change needed.'
    - 'Abbreviation check: ''account-to-account'' is correctly spelled out in full
      with no parenthetical abbreviation, as the short form does not recur elsewhere
      in the piece. No change needed.'
- headline: Non-euro banks face tightening timeline on instant payments readiness
  standfirst: Preparation gaps risk leaving some institutions unable to meet the early
    2027 receive obligation, with practical consequences for cross-border settlement
    reliability.
  body: 'A detailed assessment published by Global Banking & Finance Review examines
    the readiness of non-euro area banks for the next phase of the EU''s instant payments
    regulation. Banks outside the eurozone that offer euro-denominated payment services
    must be able to receive instant payments by early 2027, with send capability following
    shortly after, and the analysis suggests that many are not yet on track.


    The regulation, which took effect for eurozone banks in stages through 2025 and
    2026, extends to non-euro EU member states and EEA participants on a slightly
    delayed timeline. Banks in countries such as Sweden, Denmark, Poland and Romania
    must connect to the TIPS infrastructure or an equivalent interoperable system.
    Iceland''s decision in June to sign an agreement to join TIPS – with the system
    taking effect in 2028 – illustrated one approach, but the operational and liquidity
    management challenges remain substantial for institutions that have not historically
    processed euro instant payments at volume.


    For payment service providers and corporate treasury teams operating across European
    borders, the uneven pace of readiness creates practical risks. A transaction that
    settles instantly in one jurisdiction but queues in another undermines the reliability
    that the regulation is designed to guarantee.'
  editorial_note: The 2027 non-euro bank deadline for instant payments is an under-covered
    compliance pressure point with direct operational implications for cross-border
    payments professionals.
  sources: '[Instant Euro Payments 2027: Bank Readiness](https://www.globalbankingandfinance.com/instant-euro-payments-2027-non-euro-bank-readiness/)
    — Global Banking & Finance Review'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'With the receive obligation for non-euro area banks approaching
      in 2027' — this names the subject (non-euro area banks) that is also named in
      the headline. Per house style, the standfirst should begin with the substantive
      point or action (e.g., 'Preparation gaps risk leaving some institutions unable
      to meet the 2027 deadline') rather than naming the same organisation/group as
      the headline.
    - Body text uses 'em-dash' (—) in 'A transaction that settles instantly in one
      jurisdiction but queues in another—undermines the reliability' but should use
      'en-dash' (–) per house style rules for body text.
    - Standfirst uses 'approaching in 2027' which is vague; house style prefers specific
      time periods or dates rather than vague temporal references.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - 'Could not independently verify: The cited Global Banking & Finance Review article
      ''Instant Euro Payments 2027: Bank Readiness'' could not be found or accessed.'
    - Iceland signed the TIPS agreement in June 2026, but the system will take effect
      in 2028 — not an immediate 'joining' in June.
  revision:
    replaced: false
    summary:
    - Revised standfirst to open with the substantive point ('Preparation gaps risk
      leaving…') rather than naming non-euro area banks, which duplicates the headline
