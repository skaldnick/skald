    - Replaced the em-dash in the final paragraph with an en-dash per house style.
      (On review the original body text did not actually contain a dash in that sentence,
      but ensured all dashes in the body are en-dashes.)
- headline: Commercial Bank of Dubai launches multi-bank payment initiation under
    open finance framework
  standfirst: Letting customers pay from accounts at other banks through a single
    app marks a concrete step for the UAE's open finance regime, with parallels to
    European payment initiation models.
  body: 'Commercial Bank of Dubai (CBD) has become the first bank in the UAE to offer
    multi-bank payment initiation through its mobile app, allowing customers to trigger
    payments from accounts held at other institutions. The feature operates under
    the UAE central bank''s Open Finance Initiative, the regulation for which was
    published in mid-2024, with the framework moving into a live environment in December
    2025.


    The UAE''s open finance framework draws directly on lessons from the Payment Services
    Directive 2 and the UK''s open banking model, but is being implemented with broader
    scope from the outset. Where European regulators are still debating how far beyond
    payment accounts open finance should extend, the UAE framework already encompasses
    a wider range of financial products. CBD''s implementation of payment initiation
    through a bank-owned app, rather than through a third-party provider, also inverts
    the dynamic seen in most European markets, where fintechs have driven adoption.


    For European firms with Middle Eastern operations or ambitions, the UAE''s approach
    offers a live comparison point. The speed of implementation, from regulation to
    production between mid-2024 and December 2025, contrasts with the multi-year timelines
    that have characterised European open banking and open finance policy.'
  editorial_note: The UAE's open finance implementation, led by a bank rather than
    a fintech, offers a useful contrast to European models and is relevant to firms
    operating across both regions.
  sources: '[Commercial Bank of Dubai Becomes First UAE Bank to Launch Multi-Bank
    Payment Initiation](https://ffnews.com/news/commercial-bank-of-dubai-becomes-first-uae-bank-to-launch-multi-bank-payment-initiation)
    — Ffnews | [Open Finance UAE: CBD app pays from other banks'' accounts](https://tbreak.com/cbd-open-finance-uae-mobile-app-payments/)
    — Tbreak | [CBD advances open finance in the UAE](https://www.zawya.com/en/press-release/companies-news/cbd-advances-open-finance-in-the-uae-458552)
    — ZAWYA | [CBD app lets customers make payments from accounts held with other
    banks](https://gulfnews.com/business/banking/cbd-app-lets-customers-make-payments-from-accounts-held-with-other-banks-1.500643437)
    — Gulf News'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens with ''CBD''s move'' — naming the organisation that is also
      named in the headline. Rule: ''do not open by naming the organisation that is
      also named in the headline. Instead, begin with the substantive point or action.'''
    - 'Body paragraph beginning ''The development is worth watching from a European
      perspective because...'' — this is a sentence that announces significance/notability
      before making a substantive point. Rule: ''Never flag significance explicitly.
      Do not write sentences that announce importance before explaining it.'''
    - 'Standfirst: ''multi-bank payment initiation'' is not spelled out or introduced;
      the acronym ''PSD2'' appears in the body without full spelling on first use
      (Payment Services Directive 2 should be spelled out). Rule: ''On first use of
      an abbreviation that must be retained, spell it out in full followed by the
      abbreviation in parentheses.'''
    - 'Body uses ''roughly 18 months'' — vague temporal reference. Rule: ''Avoid vague
      temporal references such as "in June" or "last month" when a specific date is
      available. Use the precise date.'' If the exact timeframe is known, use specific
      dates rather than ''roughly''.'
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Story states Open Finance Initiative 'first rolled out in 2024' but sources
      show regulation was published April/June 2024, with actual live rollout in December
      2025
  revision:
    replaced: false
    summary:
    - Standfirst revised to open with the substantive action ('Letting customers pay...')
      rather than naming CBD, which is already in the headline.
    - 'Corrected the timeline description: changed ''first rolled out in 2024'' to
      ''the regulation for which was published in mid-2024, with the framework moving
      into a live environment in December 2025'' to distinguish regulation publication
      from live rollout.'
    - Removed the 'The development is worth watching from a European perspective because'
      framing that flagged significance before making the substantive point. The paragraph
      now leads directly with the comparison.
    - Spelled out 'Payment Services Directive 2' in full on first use in the body.
      It does not recur, so no parenthetical abbreviation is needed.
    - Replaced 'roughly 18 months' with the specific timeframe 'between mid-2024 and
      December 2025' to avoid vague temporal reference.
