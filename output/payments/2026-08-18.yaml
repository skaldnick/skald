title: 'Stripe bids for OpenRouter; ECB cash data; instant payments readiness

  '
social_post: 'Stripe drops $7bn on an AI gateway. The ECB finds businesses still love
  cash. And non-euro banks face a 2027 instant payments cliff edge. Today''s briefing:
  {link}

  '
stories:
- headline: Stripe agrees $7bn deal for AI gateway firm OpenRouter
  standfirst: Acquiring a key routing layer for AI model access would extend Stripe's
    infrastructure play well beyond payments.
  body: 'Stripe is acquiring OpenRouter, an AI gateway platform that routes requests
    across multiple large language models, for $7 billion, according to Bloomberg.
    The deal would represent Stripe''s largest acquisition by a wide margin, dwarfing
    its $1.1 billion purchase of Bridge in 2024.


    OpenRouter acts as middleware between developers and AI model providers, handling
    authentication, billing and model selection. For Stripe, which already processes
    payments for AI-native businesses and recently built a payment layer for AI agents
    with AWS, the acquisition would embed it deeper into the commercial infrastructure
    of AI. Controlling the gateway through which developers access and pay for AI
    models places Stripe between buyers and sellers at the point of transaction –
    the same position it occupies in payments.


    The deal points to a broader convergence between payments infrastructure and AI
    orchestration. As agentic commerce moves from prototype to production, the firms
    that control authentication, billing and settlement layers for machine-to-machine
    interactions are the same ones positioned to process the resulting transaction
    flows. Stripe is paying $7 billion for a routing layer – a price that reflects
    how directly the largest payments companies now see AI orchestration as an extension
    of their core business.'
  editorial_note: A $7 billion acquisition by Europe's most valuable fintech (with
    deep European operations) is significant in its own right, and the AI-payments
    infrastructure convergence it represents is directly relevant to the audience.
  sources: '[Stripe agrees $7bn takeover of AI firm OpenRouter - Bloomberg](https://www.finextra.com/newsarticle/48258/stripe-agrees-7bn-takeover-of-ai-firm-openrouter---bloomberg?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation also named in the headline ('Stripe').
      Revise to begin with the substantive point — eg, 'The acquisition would give
      control of a key routing layer...' — rather than 'The acquisition would give
      Stripe control...'
    - Body paragraph 2 contains the phrase 'a logical extension of Stripe's core competency'
      which signals significance before making a direct point. Replace with direct
      substantive framing.
    - Body paragraph 3 opens with 'The deal also signals a broader convergence' —
      the word 'also' suggests continuation from the standfirst rather than the body
      standing alone as self-contained. Revise to strengthen standalone framing.
    - Body paragraph 3 contains 'The firms that control authentication, billing and
      settlement layers... stand to capture significant value' — this announces significance
      ('stand to capture significant value') before making the substantive point.
      State the substantive development directly without the significance-announcing
      phrasing.
    - Body paragraph 3 ends with 'Stripe's willingness to pay $7 billion for a routing
      layer underscores how seriously the largest payments companies are taking this
      shift' — 'underscores how seriously' announces significance before the point.
      State the substantive claim directly.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    summary:
    - Standfirst revised to avoid opening with 'Stripe', which is already named in
      the headline. Now leads with the substantive action.
    - 'Body paragraph 2: replaced ''is a logical extension of Stripe''s core competency:
      sitting between buyers and sellers at the point of transaction'' with direct
