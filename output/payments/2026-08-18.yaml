    - 'Body paragraph 3: removed ''also'' from opening sentence to ensure body stands
      alone, changed ''signals'' to ''points to''.'
    - 'Body paragraph 3: replaced ''stand to capture significant value'' with a direct
      substantive claim about positioning relative to transaction flows.'
    - 'Body paragraph 3: replaced ''underscores how seriously the largest payments
      companies are taking this shift'' with a direct statement about how payments
      companies view AI orchestration.'
- headline: ECB data shows businesses still prefer cash over digital payments
  standfirst: Fresh survey findings challenge the assumption that the pandemic permanently
    shifted European businesses toward digital-only acceptance.
  body: 'The European Central Bank has published new data showing that the decline
    in cash acceptance observed during and after the Covid-19 pandemic has stalled.
    Businesses across the euro area continue to prefer cash as a payment method, reversing
    expectations that digital payment adoption would follow a one-way trajectory.


    The findings arrive as the ECB advances its digital euro programme, with the European
    Parliament voting in July to move the legislation to final negotiations and 36
    payment providers selected for the pilot phase. A persistent preference for cash
    among businesses complicates the narrative that a central bank digital currency
    would meet unmet demand. The instant payments regulation assumes growing digital
    payment volumes will justify the compliance costs banks face ahead of the 2027
    deadline, an assumption the data calls into question.


    Merchant behaviour in much of Europe remains stubbornly analogue, despite years
    of investment in account-to-account and card-based digital payments by processors
    and fintechs. Product strategies premised on rapid cash displacement may need
    to account for a longer transition than anticipated.'
  editorial_note: ECB primary data on business payment preferences is directly relevant
    to European payments strategy and challenges widely held assumptions about the
    pace of digital adoption.
  sources: '[Companies prefer cash over digital payments - ECB](https://www.finextra.com/newsarticle/48255/companies-prefer-cash-over-digital-payments---ecb?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'European businesses' when the headline already identifies
      the ECB subject; the standfirst should open with the substantive finding instead
      — revise to lead with 'Fresh survey findings challenge the assumption that the
      pandemic permanently shifted European businesses toward digital-only acceptance'
      or similar direct statement of the finding rather than describing what the findings
      do
    - 'Body paragraph 2: ''It also matters for the instant payments regulation'' —
      this is a flagged significance sentence announcing importance before making
      the substantive point; replace with a direct statement of how the data affects
      instant payments regulation'
    - 'Body paragraph 3: ''the data is a reminder that merchant behaviour in much
      of Europe remains stubbornly analogue'' — this announces significance before
      the substantive point; lead directly with the substantive claim about merchant
      behaviour without framing it as a ''reminder'''
    - 'Abbreviation ''A2A'' used in body text as ''account-to-account'' — rule requires
      spelling out non-standard abbreviations, which this text does correctly, so
      no violation here. However, verify: is ''A2A'' used elsewhere in the piece?
      If not, the spelling-out is correct and no parenthetical abbreviation should
      be added per the rule about only including abbreviations in parentheses if they
      recur'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    summary:
    - 'Body paragraph 2: Replaced ''It also matters for the instant payments regulation,
