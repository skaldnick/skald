    - Removed 'is significant for European payments professionals because it' from
      the editorial note, stating the substantive point directly.
- headline: ECB data shows businesses still prefer cash over digital payments
  standfirst: The decline in cash acceptance among euro area businesses has stalled,
    challenging assumptions that underpin initiatives from Wero to the digital euro.
  body: 'Cash acceptance among euro area businesses, which dropped sharply during
    the Covid-19 pandemic, has stabilised rather than continuing to fall. New ECB
    survey data show that companies across the region continue to prefer cash as a
    payment method, contradicting the narrative that digital payment adoption is on
    a one-way trajectory.


    The findings arrive as policymakers push competing agendas. The ECB''s digital
    euro project, still in its preparation phase ahead of an operational pilot expected
    in the second half of 2027, is premised partly on the idea that cash use is declining
    and a public digital alternative is needed. Simultaneously, the European Payments
    Initiative''s Wero is expanding across European markets as a digital wallet for
    real-time payments. Both initiatives assume growing consumer and merchant appetite
    for non-cash instruments.


    For payment providers and scheme operators, the data complicates the business
    case for displacing cash at the point of sale. If merchant preference for cash
    proves sticky rather than transitional, the adoption curve for pay-by-bank, wallets
    and the digital euro is likely to be slower than projected, particularly among
    smaller businesses where cash handling costs are lower relative to digital payment
    fees.'
  editorial_note: ECB primary data on business payment preferences is directly relevant
    to the commercial assumptions underpinning multiple European payment initiatives,
    from Wero to the digital euro.
  sources: '[Companies prefer cash over digital payments - ECB](https://www.finextra.com/newsarticle/48255/companies-prefer-cash-over-digital-payments---ecb?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'Fresh survey results' rather than the substantive point;
      this violates the rule that standfirsts should begin with the interpretive point
      or action, not a generic descriptor. Consider opening with 'The decline in cash
      acceptance among businesses has stalled' or similar.
    - Body opening repeats the headline's subject (ECB/businesses and cash/digital
      payments) too closely. The headline names 'ECB' and 'cash over digital payments';
      the body opens 'The European Central Bank has published new data showing that
      the decline in cash acceptance...'. Vary the opening of at least one element
      to avoid this repetition.
    - In the body, 'EPI's Wero' uses an abbreviation (EPI) that does not recur in
      the remainder of the piece. Per the rule, spell out the abbreviation in full
      on first use only if it recurs later; since EPI appears only once, write 'European
      Payments Initiative's Wero' or another full form without parentheses.
    - The phrase 'the data complicates the business case for displacing cash' in the
      final paragraph uses 'the data' without a clear antecedent in the immediately
      preceding context; however, the main rule violation here is that 'the adoption
      curve for pay-by-bank, wallets and even the digital euro may be slower than
      projected' introduces uncertainty with 'may be', which softens the substantive
      claim. Consider strengthening to 'the adoption curve...will likely be slower'
      or similar to avoid hedging.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings:
    - Digital euro pilot is in development phase, not operational pilot phase yet;
      operational pilot starts H2 2027
  revision:
    replaced: false
    summary:
    - Rewrote standfirst to lead with the substantive point ('The decline in cash
      acceptance...has stalled') rather than the generic descriptor 'Fresh survey
      results'.
    - Varied the body opening to avoid repeating the headline's subject too closely;
      the body now leads with 'Cash acceptance among euro area businesses' rather
      than 'The European Central Bank has published new data showing'.
    - Corrected digital euro project status from 'pilot phase with 36 selected providers'
      to 'preparation phase ahead of an operational pilot expected in the second half
      of 2027'.
    - Spelled out 'European Payments Initiative' in full instead of the abbreviation
      'EPI', which did not recur in the piece.
    - Strengthened 'may be slower than projected' to 'is likely to be slower than
      projected' to reduce hedging; also removed 'even' before 'the digital euro'
      for cleaner phrasing.
- headline: Ingenico secures €150m from PIMCO-led investors to reset capital structure
  standfirst: Fresh capital provides financial headroom after a prolonged period of
    ownership uncertainty and competitive pressure from software-based acceptance.
  body: 'Ingenico has agreed a capital structure reset anchored by a €150 million
    investment from a group of global investors led by PIMCO. The fresh capital is
    intended to stabilise the company''s balance sheet after years of transition since
    its take-private by Apollo-backed Poseidon in 2022.


    The terminal industry is under pressure from multiple directions. Software-based
    acceptance, including tap-to-pay on smartphones, is eroding demand for dedicated
    hardware, while integrated payment platforms such as Adyen and Stripe offer merchants
    end-to-end solutions that bypass traditional terminal economics. Ingenico''s European
    competitors, including Worldline, which sold its terminals business to Apollo
    Funds in 2022, have been restructuring around similar pressures.


    The investment suggests Ingenico''s backers see enough remaining value in its
    installed base and enterprise relationships to justify recapitalisation rather
    than sale or wind-down. European merchants and acquirers depend on Ingenico as
    a significant provider of in-store acceptance infrastructure across the region,
    making its financial stability a material consideration for the physical payments
    supply chain.'
  editorial_note: A €150 million recapitalisation of one of Europe's largest terminal
    providers is a concrete data point on the financial health and strategic direction
    of physical payment acceptance infrastructure.
  sources: '[Ingenico secures €150 million in fresh capital](https://www.finextra.com/pressarticle/110649/ingenico-secures-150-million-in-fresh-capital?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'The recapitalisation gives the payment terminal maker'
      — this names the subject (payment terminal maker/Ingenico) which is also named
      in the headline. Should begin with the substantive point (eg, 'Financial headroom
      follows...') to avoid redundant repetition across headline and standfirst.
    - Body paragraph three opens with 'For European merchants and acquirers, Ingenico's
      financial stability matters because...' — this is a 'This matters because' construction
      that announces significance explicitly before making the substantive point.
      Should lead directly with the substantive claim instead (eg, 'European merchants
      and acquirers depend on Ingenico as a significant provider...').
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Draft says take-private by 'Poseidon in 2020' - Apollo/Poseidon took Ingenico
      private in October 2022, not 2020
    - Draft says Worldline 'sold its terminal business to Dedalus in 2023' - Worldline
      sold TSS/Ingenico to Apollo Funds (deal closed October 2022), no Dedalus involvement
      found
  revision:
    replaced: false
    summary:
    - Corrected take-private date from 2020 to 2022 per Apollo/Poseidon acquisition
      timeline.
    - 'Corrected Worldline terminal sale: changed buyer from ''Dedalus'' to ''Apollo
      Funds'' and date from 2023 to 2022, reflecting the actual transaction.'
    - Revised standfirst to open with 'Fresh capital provides…' rather than naming
      the payment terminal maker, avoiding redundant repetition of the headline's
      subject.
    - Rewrote final paragraph's second sentence to lead with the substantive claim
      ('European merchants and acquirers depend on Ingenico…') rather than using a
      'matters because' construction that announces significance before stating it.
- headline: Thunes and Fiserv partner on cross-border merchant payouts
  standfirst: The collaboration is connecting Thunes's cross-border payment network
    to Fiserv's merchant ecosystem, targeting platforms and marketplaces that need
    to settle with international sellers.
  body: 'Thunes is partnering with Fiserv to handle international payouts for global
    platforms and marketplaces within Fiserv''s merchant ecosystem. The arrangement
    allows merchants and sellers connected through Fiserv to receive cross-border
    disbursements via Thunes''s network, which covers more than 140 countries through
    direct connections to mobile wallets, bank accounts and card networks.


    Cross-border payouts for marketplace sellers remain a fragmented and operationally
    complex segment. Most large acquirers and payment service providers handle the
    inbound collection side but rely on third parties for outbound disbursements,
    particularly in emerging markets where local payment methods dominate. Thunes
    has built its business specifically on this outbound corridor, competing with
    Payoneer, Hyperwallet (PayPal) and Airwallex.


    European platforms operating global marketplaces stand to benefit directly, given
    Fiserv processes a substantial volume of European merchant transactions. Reduced
    settlement times and costs for cross-border seller payouts would shape how European
    marketplace operators choose their payment stack.'
  editorial_note: ''
  sources: '[Thunes to support payouts for Fiserv''s merchant ecosystem](https://www.finextra.com/pressarticle/110653/thunes-to-support-payouts-for-fiservs-merchant-ecosystem?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisations also named in the headline ('Thunes'
      and 'Fiserv'), violating the rule to avoid redundant repetition of the subject.
      Should begin with the substantive point instead — eg, 'The collaboration connects...'
      rather than repeating the companies.
    - 'Body text uses ''is partnering'' (present continuous) correctly, but the standfirst
      uses ''connects'' (simple present) for a newly announced arrangement. Should
      use present continuous: ''is connecting'' to signal currency.'
    - Final paragraph weakens the opening with 'could influence' and hedging language
      ('If the integration reduces...'), which delays the substantive point. This
      approaches the violation of not opening with scene-setting hedges.
    - Editorial note should not be included in the copy check output — it is metadata
      and should be removed or not flagged as part of the story itself.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Draft states Thunes covers 'more than 130 countries', but official sources state
      network reaches 'over 140 countries'
  revision:
    replaced: false
    summary:
    - Corrected country coverage from 'more than 130 countries' to 'more than 140
      countries' per official sources.
    - Changed standfirst verb from 'connects' (simple present) to 'is connecting'
      (present continuous) to reflect a newly announced arrangement.
    - Removed redundant naming of Thunes and Fiserv from standfirst opening, now begins
