title: 'Stripe''s OpenRouter deal; ECB cash data; Ingenico recapitalisation

  '
social_post: 'Stripe drops $7bn on AI gateway OpenRouter, the ECB finds businesses
  still prefer cash, and Ingenico secures €150m to reset its balance sheet. Today''s
  briefing: {link}

  '
stories:
- headline: Stripe agrees $7bn acquisition of AI gateway OpenRouter
  standfirst: Control of the routing layer through which developers connect applications
    to large language models would extend Stripe's infrastructure ambitions beyond
    payments.
  body: 'Stripe is acquiring OpenRouter, the AI model gateway, for $7 billion, according
    to Bloomberg. OpenRouter acts as an intermediary that lets developers route API
    calls to competing large language models through a single integration, a function
    analogous to what Stripe itself does for payment methods.


    The acquisition follows Stripe''s earlier moves into AI-adjacent infrastructure,
    including its joint bid with Advent for PayPal, its partnership with AWS to build
    a payment layer for AI agents, and its $1 billion purchase of billing platform
    Metronome in December 2025. Owning a model-routing layer would position Stripe
    at the intersection of AI compute and commerce, letting it capture billing and
    metering revenue as AI-native applications scale.


    For European payment providers and fintechs building on or competing with Stripe,
    the next battleground is not just payment rails but the infrastructure layer connecting
    AI systems to commercial transactions. If AI agents increasingly initiate purchases,
    the firm that controls both the routing of model calls and the payment execution
    has a structural advantage.'
  editorial_note: A $7 billion acquisition by Stripe of an AI infrastructure company
    accelerates Stripe's pivot toward owning the full AI-to-commerce stack, with competitive
    implications for European acquirers and payment platforms.
  sources: '[Stripe agrees $7bn takeover of AI firm OpenRouter - Bloomberg](https://www.finextra.com/newsarticle/48258/stripe-agrees-7bn-takeover-of-ai-firm-openrouter---bloomberg?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'The deal would give Stripe control' but the headline
      names Stripe — this violates the rule against opening the standfirst by naming
      the organisation also named in the headline. Should open with the substantive
      point instead, e.g., 'Control of the routing layer through which developers
      connect applications to large language models would extend Stripe's infrastructure
      ambitions beyond payments.'
    - Body paragraph 3 states 'the deal signals that the next battleground is not
      just payment rails but the infrastructure layer' — this is flagged significance
      explicitly before making the substantive point, violating the rule against sentences
      that announce importance. Rewrite to lead directly with the substantive claim.
    - Editorial note contains 'is significant for European payments professionals'
      — this flags significance explicitly, which should not appear in editorial notes
      either. Remove the significance announcement and state the substantive point
      directly.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Draft states Stripe made a '$335 million purchase of billing platform Orb earlier
      this year,' but Adyen (not Stripe) acquired Orb for $335 million in June 2026.
      Stripe acquired Metronome for $1 billion in December 2025.
  revision:
    replaced: false
    summary:
    - Corrected '$335 million purchase of billing platform Orb earlier this year'
      to '$1 billion purchase of billing platform Metronome in December 2025' per
      fact-check noting Orb was acquired by Adyen, not Stripe, and Stripe acquired
