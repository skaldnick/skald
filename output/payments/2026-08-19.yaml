title: 'Agentic payments alliance; Banca d''Italia on stablecoins; PSR annual report;
  UK mobile wallets

  '
social_post: 'Visa and Mastercard team up on agentic payments standards, Banca d''Italia
  pours cold water on stablecoin remittances, and the PSR publishes its annual scorecard.
  Today''s briefing: {link}

  '
stories:
- headline: Visa and Mastercard join agentic payments alliance with over 25 founding
    members
  standfirst: A new cross-industry body to set standards for AI-initiated commerce
    marks the clearest signal yet that card networks view agentic payments as an infrastructure
    category, not a research project.
  body: 'More than 25 companies have launched the Agentic Payments Alliance (APA),
    a coalition aimed at guiding the development of commerce initiated by AI agents.
    Founding members include Visa, Mastercard, Fiserv, Circle, Solana and Remitly,
    among others. The group''s formation follows a run of individual agentic payments
    announcements from its members over the past six months, from Visa''s partnership
    with OpenAI to Mastercard''s work with ING and Worldline on Europe''s first agentic
    transaction.


    Moving from bilateral pilots to a multi-stakeholder body suggests the industry
    recognises that agentic commerce will require shared protocols for authentication,
    liability and settlement rather than proprietary schemes. That both major card
    networks are founding members, alongside a stablecoin issuer and a blockchain
    platform, signals the alliance intends to be rail-agnostic rather than card-centric.


    For European payments firms, the APA''s composition is worth watching. The inclusion
    of Circle and Solana alongside the card networks points to an assumption that
    agentic payments will span both traditional and token-based rails. Whether the
    alliance produces binding standards or remains a talking shop will depend on whether
    it attracts banks and regulators as participants.'
  editorial_note: The formation of a formal industry alliance around agentic payments,
    with both major card networks as founders, is a structural development that moves
    the agentic payments story from bilateral announcements to collective standard-setting.
  sources: '[Visa and Mastercard back new Agentic Payments Alliance](https://www.finextra.com/newsarticle/48265/visa-and-mastercard-back-new-agentic-payments-alliance?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Headline starts with 'Visa' and body opens with 'Visa, Mastercard…' — violates
      rule against starting headline and body with same word/phrase. Vary the opening
      in at least one element.
    - Body text uses 'six' for the number of founding members when the headline already
      states this count — near-verbatim repetition of the same phrasing across headline
      and body. While restating is expected, this is redundant enumeration of the
      same detail.
    - Standfirst opens with 'The creation' and body's second paragraph opens with
      'The shift' — both starting with 'The', which risks monotonous phrasing structure
      across these key sections.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Story claims 'six founding members' (Visa, Mastercard, Fiserv, Circle, Solana,
      Remitly) but sources list 26+ founding members including those six plus many
      others
  revision:
    replaced: false
    summary:
    - Corrected founding member count from six to 'over 25' in headline and body to
