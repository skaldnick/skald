- headline: 'Banca d''Italia finds stablecoins offer no cost or speed edge for remittances

    '
  standfirst: 'Research from Italy''s central bank challenges the narrative that stablecoins
    can undercut traditional remittance channels, with implications for MiCA-era business
    models and the digital euro debate.

    '
  body: 'Researchers at Banca d''Italia have concluded that stablecoins show no systematic
    cost advantage over traditional remittance channels for cross-border payments.
    The finding, published on August 19, directly challenges one of the most commonly
    cited use cases for regulated stablecoins under the Markets in Crypto-Assets Regulation
    (MiCA).


    The research arrives as several European stablecoin ventures position themselves
    for cross-border payments, including the Visa- and Mastercard-backed Open USD
    launched on July 1 and AllUnity''s Swedish krona stablecoin announced earlier
    this year. If the cost and speed claims that underpin these business cases do
    not hold up under central bank scrutiny, the commercial logic for stablecoin remittance
    corridors narrows considerably.


    The timing also feeds into the digital euro debate. The European Central Bank
    has framed the digital euro partly as a response to private stablecoin growth.
    If stablecoins prove less disruptive to existing payment flows than assumed, it
    could shift the policy rationale for a central bank digital currency toward sovereignty
    arguments rather than competitive necessity.

    '
  editorial_note: 'A European central bank publishing evidence against the stablecoin
    remittance thesis is directly relevant to MiCA-era business models and the digital
    euro policy debate.

    '
  sources: '[Stablecoins offer little cost or speed advantage for remittances - Banca
    d''Italia](https://www.finextra.com/newsarticle/48266/stablecoins-offer-little-cost-or-speed-advantage-for-remittances---banca-ditalia?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Headline opens with 'Banca d'Italia' and standfirst opens with 'Research from
      Italy's central bank' — both name the same organisation. Per rule [1], the standfirst
      should open with the substantive point (the challenge to the stablecoin narrative)
      rather than naming the organisation.
    - Body text uses 'Markets in Crypto-Assets Regulation (MiCA)' but the standfirst
      uses 'MiCA' without spelling it out. Per rule [23], abbreviations in the standfirst
      must still be spelled out on first use in the body with the abbreviation in
      parentheses.
    - Sentence 'The timing also feeds into the digital euro debate' uses vague temporal
      framing. The research was published on August 19, but the sentence announces
      notability ('The timing also feeds into') before stating the substantive point.
      Per rule [16], write the substantive point directly without announcing significance.
    - The phrase 'If the cost and speed claims that underpin these business cases
      do not hold up under central bank scrutiny' opens a paragraph with hedging ('If...do
      not hold up') that delays the substantive point. Per rule [29], lead directly
      with the substantive claim rather than hedging scene-setters.
  verification:
    verified: false
    stale: true
    duplicate: false
    warnings:
    - Banca d'Italia paper published July 30, 2026, not August 19 as headline implies
      - event is 20 days old
  revision:
    replaced: false
    summary:
