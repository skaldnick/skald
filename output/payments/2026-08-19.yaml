- headline: PSR publishes annual report covering fraud reimbursement and market oversight
  standfirst: The Payment Systems Regulator's 2025-26 annual report provides its first
    full-year assessment since mandatory APP fraud reimbursement took effect, alongside
    updates on its card scheme market review.
  body: 'The Payment Systems Regulator (PSR) published its annual report and accounts
    for 2025-26 on August 17. The report covers the regulator''s first full operating
    year since mandatory authorised push payment fraud reimbursement came into force,
    and follows its July finding that the regime cut APP fraud losses by £73 million
    in its initial period.


    The annual report also covers the PSR''s ongoing market review of card scheme
    fees, which in the first half of 2025 led to a proposal requiring Visa and Mastercard
    to report UK profit figures. That work continues alongside the broader UK government
    consultation on modernising payments regulation, which opened in July and could
    reshape the PSR''s own mandate.


    The report, covering a full year of regulatory activity across fraud, competition
    and open banking, provides a useful benchmark for industry participants tracking
    UK regulatory direction.'
  editorial_note: The PSR's annual report is a primary regulatory document covering
    fraud reimbursement outcomes and card scheme oversight, both active policy areas
    for UK payments professionals.
  sources: '[PSR Annual Report and Accounts 2025-26](https://www.regulationtomorrow.com/2026/08/psr-annual-report-and-accounts-2025-26/)
    — Global Regulation Tomorrow'
  style_check:
    compliant: false
    warnings:
    - Body text contains 'earlier this year' – use specific time periods instead (e.g.,
      'in the second quarter of 2025')
    - Body text contains 'The report is published through the law firm Ashurst's regulatory
      blog rather than directly from the PSR's website in the feed' – this editorial
      observation about publication method belongs in an editorial note, not the news
      body, and distracts from the substantive content
    - Body text uses 'million pounds' – should be '£73 million' to match house style
      for currency amounts
    - Standfirst uses 'mandatory APP fraud reimbursement' but body spells it out as
      'mandatory authorised push payment (APP) fraud reimbursement' – abbreviation
      should not be in parentheses in standfirst per rule about common abbreviations,
      but if used must be consistent
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - The report was published directly from the PSR's website (psr.org.uk) on August
      17, 2026, contradicting the claim it was published 'through the law firm Ashurst's
      regulatory blog rather than directly from the PSR's website'
  revision:
    replaced: false
    summary:
    - Removed the paragraph claiming the report was published through Ashurst's regulatory
      blog rather than directly from the PSR's website, as the report was published
      on psr.org.uk. The editorial observation about publication method has been removed
      from the body entirely.
    - Replaced 'earlier this year' with 'in the first half of 2025' to use a specific
      time period per house style.
    - Changed '73 million pounds' to '£73 million' to match house style for currency
      amounts.
    - Removed the parenthetical '(APP)' abbreviation from its first use in the body
      since the abbreviation is not reused later in the body text, keeping the standfirst's
      use of APP unchanged as common abbreviations do not need spelling out in the
      standfirst.
- headline: UK mobile wallet registrations reach 57% of adults
  standfirst: Fresh industry data shows mobile wallets are gaining ground against
    physical cards in the UK, though card payments still dominate overall volumes.
  body: 'Mobile wallets are reshaping where consumer loyalty sits in UK payments,
    with 57% of adults now registered with at least one provider, according to the
    latest industry data reported by Finextra. Cards continue to dominate UK payment
    volumes, but mobile wallet adoption is accelerating as contactless NFC payments
    become routine at the point of sale.


    The figures sharpen the competitive challenge facing pay-by-bank services. As
    mobile wallets become the default interface for card payments, account-to-account
    alternatives must compete not just on cost but on the convenience of a wallet
    experience that consumers already use daily. The UK Payments Initiative and commercial
    variable recurring payments face the same challenge: matching an embedded user
    experience that more than half the adult population already relies on.


    For card networks, the wallet layer, rather than the plastic card, is increasingly
    where consumer attachment forms. That makes partnerships with Apple Pay, Google
    Pay and Samsung Pay as strategically important as the underlying scheme relationships
    with issuing banks.'
  editorial_note: Mobile wallet adoption data provides concrete context for the competitive
    dynamics between card-based and account-to-account payment methods in the UK market.
  sources: '[Mobile wallets gain traction in the UK](https://www.finextra.com/newsarticle/48268/mobile-wallets-gain-traction-in-the-uk?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Body opening sentence 'Nearly two thirds of the UK population are now registered
      with at least one mobile wallet provider, according to the latest industry data
      reported by Finextra.' repeats the headline's core claim too closely without
      adding new information or development. The standfirst already establishes the
      adoption figure; the body should open with a stronger substantive point or develop
      the story differently.
    - Phrase 'open banking-based alternatives' uses 'open banking' without spelling
      it out on first use in the body, violating the abbreviation rule. Should be
      'open banking (OB)' if the abbreviation recurs, or simply spell out fully.
    - Phrase 'The UK Payments Initiative and commercial variable recurring payments
      need to match this embedded user experience' states significance indirectly
      through a need/implication rather than making a direct substantive claim about
      competitive positioning or market dynamics.
    - Editorial note contains 'account-to-account' which should be spelled out as
      'account-to-account' not abbreviated as 'A2A' per house style preference, though
      this is in the editorial note rather than the story itself.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Latest UK Finance data from 2024 shows 57% of UK adults registered for mobile
      wallets, not 'nearly two thirds' (~67%)
  revision:
    replaced: false
    summary:
    - Corrected 'nearly two thirds of the UK population' to '57% of adults' per UK
      Finance 2024 data.
    - Rewrote body opening sentence to lead with a substantive point about consumer
      loyalty rather than repeating the headline's core claim.
    - Replaced 'open banking-based alternatives' with 'account-to-account alternatives'
      to avoid unnecessary jargon and sidestep the abbreviation issue, since 'open
      banking' is not used elsewhere in the body.
    - Rewrote the sentence about UK Payments Initiative and commercial VRP to make
      a direct substantive claim about their competitive challenge rather than stating
      significance indirectly through implication.
    - Editorial note already uses 'account-to-account' spelled out in full, so no
      change needed there.
- headline: 'PPRO partners with Blik to develop agentic commerce for Polish payments

    '
  standfirst: 'The partnership extends the agentic payments trend into central Europe''s
    largest domestic payment scheme, connecting Blik''s 35 million users to emerging
    AI-initiated commerce flows.

    '
  body: 'PPRO is partnering with Blik to develop agentic commerce capabilities for
    local payments in Poland. The collaboration aims to connect Blik, which dominates
    Polish digital payments, with the emerging ecosystem of AI agent-initiated transactions.


    Poland''s payments market is distinctive in Europe for the dominance of a single
    domestic scheme. Blik processed over three billion transactions in 2025 and is
    embedded in virtually every Polish banking app. Connecting this infrastructure
    to agentic commerce flows could give Poland an early-mover position in a part
    of Europe where card network alternatives already have less grip.


    The deal follows a pattern of European domestic schemes positioning for agentic
    payments. Wero, Blik and iDEAL have all taken steps to ensure they are not bypassed
    as AI-initiated commerce develops. For payment orchestrators like PPRO, these
    partnerships are a way to ensure their merchant clients can accept agentic transactions
    across fragmented European payment methods.

    '
  editorial_note: 'Blik''s move into agentic commerce is notable because it extends
    the agentic payments trend to a major domestic European scheme, complementing
    the broader alliance story covered above.

    '
  sources: '[PPRO partners with Blik to enable agentic commerce for local payments
    in Poland](https://www.finextra.com/pressarticle/110669/ppro-partners-with-blik-to-enable-agentic-commerce-for-local-payments-in-poland?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the action/consequence ('The partnership extends')
      rather than the organisation from the headline, which is correct per rule 1,
      but the standfirst then repeats 'agentic commerce' and 'agentic payments trend'
      which appears in the body's opening sentence ('agentic commerce capabilities'),
      creating near-verbatim repetition across standfirst and body that violates the
      rule against such repetition.
    - Body text uses 'three billion' but per the numbers rule should spell out 'three'
      as a word and use digits from 10 upward; however, 'three billion' is correctly
      written. No violation here.
    - Editorial note states 'Blik's move into agentic commerce is notable because
      it extends the agentic payments trend to a major domestic European scheme' —
      this flags notability explicitly before making the substantive point, which
      violates the rule against 'The move is notable' or equivalent constructions.
      Per rule on never flagging significance explicitly, this editorial note should
      not announce notability; it should state the substantive point directly.
    - 'Standfirst uses ''cVRP'' equivalent structure concern: the standfirst names
      ''agentic commerce'' which is used throughout but is not an abbreviation issue.
      However, the rule about not starting headline, standfirst and body opening sentence
      with the same word or phrase: Headline starts ''PPRO partners'', Standfirst
      starts ''The partnership'', Body starts ''PPRO is partnering'' — these are varied
      sufficiently. No violation.'
    - The editorial note is instructional/meta content ('is notable because') which
      violates the rule forbidding explicit significance flagging. The note should
      be removed or rewritten to state the substantive point without announcing its
      notability.
  verification:
    verified: false
    stale: true
    duplicate: false
    warnings:
    - Draft states 'over three billion transactions in 2025'; sources indicate 2.9
      billion or 'nearly 3 billion' — 'over' technically means exceeding 3 billion,
      not 2.9 billion
  revision:
    replaced: false
    summary:
    - Flagged as stale but no unused candidate was available — kept as-is, editor
      should review.
