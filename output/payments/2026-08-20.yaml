- headline: Modulr becomes direct participant in CHAPS, settling at the Bank of England
  standfirst: Settling directly at the Bank of England removes the need for correspondent
    banking relationships and gives the payments platform end-to-end control over
    liquidity across all three core UK interbank schemes.
  body: 'Modulr has become a direct participant in CHAPS, the UK''s same-day high-value
    payment system, enabling it to settle directly at the Bank of England. The change
    eliminates the need for an intermediary bank to process CHAPS transactions on
    its behalf.


    Direct participation in CHAPS has historically been confined to a small group
    of major banks. Modulr, which holds an electronic money institution licence and
    is a founding shareholder of the UK Payments Initiative, already had direct access
    to Faster Payments and Bacs. Adding CHAPS completes its access to the three core
    UK interbank payment schemes, giving it end-to-end control over payment routing
    and settlement timing.


    For Modulr''s client base of platforms, fintechs and businesses that embed payments
    into their operations, direct CHAPS access means faster and more predictable settlement
    for high-value transactions. Non-bank payment firms securing direct clearing access
    remains uncommon, but each new entrant reinforces a gradual structural shift in
    how UK payment infrastructure is governed and accessed.'
  editorial_note: ''
  sources: '[London Based Fintech Modulr Gains Direct Access To Major UK Payment Systems](https://www.crowdfundinsider.com/2026/08/298858-london-based-fintech-modulr-gains-direct-access-to-major-uk-payment-systems/)
    — Crowdfundinsider | [Modulr becomes Chaps direct participant](https://www.finextra.com/pressarticle/110686/modulr-becomes-chaps-direct-participant?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
