- headline: Cyprus prepares proxy-based payments to replace IBAN for domestic transfers
  standfirst: The rollout would make Cyprus one of the smaller euro area markets to
    adopt phone-number-based addressing, building on an instant payments network that
    already ranks among Europe's largest relative to population.
  body: 'Cyprus is preparing to let consumers and businesses send payments using a
    mobile phone number instead of an IBAN, according to local reports. The shift
    to proxy-based addressing is part of the country''s broader build-out of instant
    payments infrastructure, which has already produced one of Europe''s densest acceptance
    networks relative to the size of the economy.


    Instant payments in Cyprus reached significant volumes through June 2026, reflecting
    rapid adoption since the country connected to European instant payment rails.
    Proxy lookup services – which map a phone number or email address to a bank account
    – are a key component of the EU''s instant payments regulation, designed to reduce
    friction and error rates in initiating transfers.


    The move aligns Cyprus with markets such as the Netherlands, Finland and France
    that have already implemented or are rolling out proxy-based payment initiation.
    For smaller euro area economies, proxy services are particularly consequential:
    they lower the barrier to instant payment adoption by eliminating the need for
    payers to know or correctly enter a 24-character IBAN.'
  editorial_note: This is a new development not previously covered. It advances the
    European instant payments story by showing a smaller euro area market implementing
    proxy-based addressing, which is a practical requirement of the instant payments
    regulation. Source is a Cypriot news outlet (Kathimerini English edition) with
    specific detail on the country's instant payment volumes and infrastructure.
  sources: '[Goodbye, IBAN: Cyprus prepares to send money by phone number](https://knews.kathimerini.com.cy/en/business/goodbye-iban-cyprus-prepares-to-send-money-by-phone-number)
    — Knews'
  style_check:
    compliant: false
    warnings:
    - 'Body opening: ''Cyprus is preparing to let consumers and businesses send payments
      using a mobile phone number instead of an IBAN'' – this repeats the headline''s
      core claim too directly. The body''s first sentence should be stronger and more
      substantive; consider revising the standfirst instead to avoid this near-verbatim
      repetition across headline and body.'
    - 'Body paragraph 2: ''Instant payments in Cyprus reached significant volumes
      through June 2026'' – avoid vague temporal references. Use a specific date (e.g.,
      ''by June 30, 2026'') or clarify whether this is a quarterly figure.'
    - 'Body paragraph 3: ''The move aligns Cyprus with markets such as...'' – This
      sentence announces the point before making it substantively. Lead with the substantive
      claim (e.g., ''Proxy services lower the barrier to instant payment adoption
      for smaller economies by eliminating the need for payers to know or correctly
      enter a 24-character IBAN''), then reference the comparable markets.'
    - 'Body paragraph 3: ''For smaller euro area economies, proxy services are particularly
      consequential'' – This is a notability announcement. Remove this framing and
      lead directly with the substantive consequence about reducing barriers to adoption.'
