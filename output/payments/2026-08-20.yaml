      data'' — this repeats the substance of the headline (''Personetics integrates
      Plaid open banking data'') without adding interpretive context or explanation.
      The standfirst should add context, not restate the headline''s action in different
      words. Consider opening with the competitive consequence instead: ''The move
      lets incumbents...'' or ''This addresses a specific problem for...'''
    - 'Body paragraph 2 states ''The partnership addresses a specific competitive
      problem for incumbent banks'' — this is a near-verbatim restatement of the standfirst''s
      framing (''sharpening the contest for account primacy''). While the body develops
      the point in more depth, the opening of this paragraph should be stronger and
      more direct rather than echoing the standfirst''s interpretive claim. Lead with
      the substantive claim: ''Customers increasingly spread their financial activity
      across multiple providers...'''
