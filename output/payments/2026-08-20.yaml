    - 'Paragraph three states ''It also positions Modulr alongside a small number
      of non-bank payment firms...'' — this uses ''a small number'' which is vague
      hedging similar to ''one of a growing number''. Per rule on avoiding hedging:
      state the trend directly. Either name the firms or remove the hedging qualifier.'
    - 'Editorial note included in submission. Per rule: do not include editorial notes
