title: 'Personetics-Plaid tie-up; Modulr joins CHAPS; Midnite adds pay-by-bank

  '
social_post: 'Personetics taps Plaid''s open banking data to help banks fight for
  account primacy. Plus: Modulr settles directly at the BoE, and pay-by-bank keeps
  spreading into gambling. {link}

  '
stories:
- headline: 'Personetics integrates Plaid open banking data to sharpen bank personalisation

    '
  standfirst: 'The partnership gives banks and credit unions a combined view of on-us
    and off-us customer activity, sharpening the contest for account primacy as open
    finance widens the data pool.

    '
  body: 'Personetics, an AI-driven banking personalisation platform, is integrating
    Plaid''s open banking connectivity to offer financial institutions a fuller picture
    of customer finances through a single integration. The combined data set merges
    a bank''s own transaction records with account information held at competing institutions,
    feeding Personetics'' models that generate insights, alerts and product triggers.


    The tie-up is pitched squarely at the account primacy problem. As open finance
    regulations widen data access, banks risk losing visibility of customers who spread
    balances and spending across multiple providers. By ingesting off-us data alongside
    proprietary records, banks can identify behavioural patterns, such as salary deposits
    shifting to a rival or recurring payments moving elsewhere, and respond with targeted
    engagement.


    The integration reflects a broader pattern: banks treating open banking not just
    as a compliance obligation but as a competitive intelligence layer. It also illustrates
    how the personalisation market is converging with open finance infrastructure,
    turning data aggregation into a prerequisite for AI-driven customer engagement
    rather than a standalone service.

    '
  editorial_note: 'This partnership illustrates how open banking data is being operationalised
    beyond payments into bank retention strategies, a development relevant to any
    institution grappling with account primacy in an open finance environment.

    '
  sources: '[Personetics integrates Plaid open banking data to offer banks wider customer
    view](https://app.dealroom.co/news/feed/personetics-integrates-plaid-open-banking-data-to-offer-banks-wider-customer-view)
