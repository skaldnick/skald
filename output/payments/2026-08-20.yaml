- headline: Sports betting platform Midnite launches pay-by-bank via TrueLayer
  standfirst: UK gambling operators are steadily adopting open banking payments as
    the sector adjusts to regulatory pressure around affordability and responsible
    gambling, and this latest integration illustrates the trend's commercial momentum.
  body: 'Pay-by-bank is gaining another foothold in UK gambling. Midnite, the sports
    betting platform, is launching deposits and withdrawals through TrueLayer''s open
    banking infrastructure, letting players fund accounts and receive winnings without
    entering card details, with transactions processed through direct bank connections.


    UK gambling has become a conspicuous growth sector for pay-by-bank adoption. Open
    banking rails offer operators faster settlement, lower processing costs and, critically,
    a data layer that can support the financial risk assessments now required by the
    UK Gambling Commission. The commission confirmed in July that open banking data
    can be used for affordability checks, and operators have been moving to integrate
    the capability into their payment flows.


    For TrueLayer, the deal extends its presence in a vertical where it already counts
    several UK operators as clients. The gambling sector''s regulatory environment,
    which demands both frictionless deposits and responsible spending controls, makes
    it a natural testing ground for pay-by-bank''s ability to combine payments with
    data-driven compliance.'
  editorial_note: UK gambling continues to be one of the most active verticals for
    open banking payment adoption, driven by regulatory requirements around affordability.
    This deal builds on previously covered themes (Gambling Commission confirmation,
    TrueLayer's growth) and shows continued commercial momentum.
  sources: '[Sports betting platform Midnite launches Pay by Bank in the UK via TrueLayer](https://www.openbankingexpo.com/news/sports-betting-platform-midnite-launches-pay-by-bank-in-the-uk-via-truelayer/)
    — Openbankingexpo | [Midnite Adds TrueLayer Pay by Bank](https://igamingfuture.com/midnite-adds-truelayer-pay-by-bank/)
    — iGaming Future'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst: ''adds to a growing list'' – do not describe a development as ''one
      of a growing number'' in a way that hedges its significance. State the trend
      directly and let the specific item illustrate it.'
    - 'Body, paragraph 2: ''critically, a data layer'' – replace dash used to introduce
      a consequence or parenthetical mid-sentence with a comma.'
    - 'Body, paragraph 3: ''For TrueLayer, the deal extends'' – do not start the headline,
      standfirst, and body opening sentence with the same word or phrase. The headline
      starts with ''Sports betting platform Midnite'', the standfirst with ''The integration'',
      but this paragraph opens a new subject with ''For TrueLayer''. However, the
      body''s opening sentence (''Midnite, the UK sports betting platform, is launching...'')
      does not vary sufficiently from the headline''s opening subject. The body should
      open more directly and distinctly.'
