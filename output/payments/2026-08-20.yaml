- headline: Modulr becomes direct CHAPS participant, settling at the Bank of England
  standfirst: Direct settlement access to the UK's high-value payment scheme gives
    a non-bank payments platform participation in all three main interbank schemes
    alongside Faster Payments and the UK Payments Initiative.
  body: 'Modulr has become a direct participant in CHAPS, the UK''s same-day high-value
    payment system, settling directly at the Bank of England. The move gives the payments
    automation platform direct access to all three of the UK''s main interbank payment
    schemes alongside Faster Payments and Bacs.


    For Modulr''s client base of fintechs, platforms and embedded finance providers,
    direct CHAPS participation removes the need to route high-value transactions through
    a sponsor bank. That reduces counterparty risk and latency for payments that exceed
    Faster Payments thresholds. As a founding shareholder of the UK Payments Initiative
    (UKPI), Modulr is also among the first providers offering commercial variable
    recurring payments, giving it a broad position across the UK payments stack.


    Modulr joins a small but growing group of non-bank payment service providers settling
    directly at the central bank, a trend the Bank of England has actively encouraged
    as part of its push to diversify the payments landscape. Banks'' exclusive hold
    on direct scheme access continues to erode as more non-bank providers meet the
    operational and regulatory requirements for direct participation.'
  editorial_note: A non-bank gaining direct CHAPS access is still relatively rare
    and signals the continuing diversification of UK payments infrastructure participation
    beyond traditional banks, relevant to the ongoing debate about scheme access and
    competition.
  sources: '[Modulr becomes Chaps direct participant](https://www.finextra.com/pressarticle/110686/modulr-becomes-chaps-direct-participant?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra | [London Based Fintech Modulr Gains Direct Access To Major UK Payment
    Systems](https://www.crowdfundinsider.com/2026/08/298858-london-based-fintech-modulr-gains-direct-access-to-major-uk-payment-systems/)
    — Crowdfundinsider'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'Direct settlement access to the UK's high-value payment
      scheme marks a significant step' — this violates the rule against flagging significance
      explicitly. The phrase 'marks a significant step' announces importance before
      explaining substantive consequences. Revise to lead with the substantive point
      directly.
    - Body text contains 'The broader pattern here is the continued erosion of banks'
      exclusive hold on direct scheme access.' This violates the rule against starting
      paragraphs with scene-setting that delays the substantive point. Lead directly
      with the substantive claim rather than announcing a pattern first.
    - 'Standfirst uses ''marks a significant step'' which violates the rule: ''Never
      flag significance explicitly. Do not write sentences that announce importance
      before explaining it.'''
