title: 'Personetics-Plaid integration; Modulr gains CHAPS access; Midnite adopts pay-by-bank

  '
social_post: 'Personetics taps Plaid''s open banking data to help banks fight for
  account primacy. Plus: Modulr settles directly at the BoE, and pay-by-bank lands
  in UK sports betting. {link}

  '
stories:
- headline: Personetics integrates Plaid open banking data to sharpen bank personalisation
  standfirst: The integration lets incumbents use external account data as a competitive
    input, sharpening the contest for account primacy against challengers and non-bank
    financial apps.
  body: 'Personetics, the AI-based banking personalisation platform, is integrating
    Plaid''s open banking connectivity to give financial institutions a fuller picture
    of their customers'' financial lives. The combined offering lets banks ingest
    data from accounts held elsewhere and run it through Personetics'' AI models to
    generate personalised insights, triggers and recommendations.


    Customers increasingly spread their financial activity across multiple providers,
    and without visibility of that external behaviour, banks struggle to offer relevant
    products or retain primacy. By pulling in open banking data alongside on-us transaction
    records, Personetics says it can identify patterns, such as subscription leakage
    or salary diversion, that would otherwise be invisible to the primary bank.


    The integration is available to banks and credit unions already using either platform.
    It positions open banking data not as a compliance exercise or a fintech-facing
    API but as a competitive input for incumbents trying to hold ground against challengers
    and non-bank financial apps.'
  editorial_note: 'This illustrates a maturing use case for open banking data: banks
    deploying it defensively to retain customers, not just fintechs using it to acquire
    them. The partnership between a major data aggregator and an AI personalisation
    vendor signals that open finance is becoming a core input for incumbent strategy.'
  sources: '[Personetics partners with Plaid to help banks win account primacy with
    Open Finance](https://www.openbankingexpo.com/news/personetics-partners-with-plaid-to-help-banks-win-account-primacy-with-open-finance/)
    — Openbankingexpo | [Personetics integrates Plaid open banking data](https://finance.yahoo.com/technology/ai/articles/personetics-integrates-plaid-open-banking-112241523.html)
    — Yahoo Finance | [Personetics integrates Plaid open banking data to offer banks
    wider customer view](https://app.dealroom.co/news/feed/personetics-integrates-plaid-open-banking-data-to-offer-banks-wider-customer-view)
    — App | [Personetics Partners with Plaid to Help Banks Win Account Primacy with
    Open Finance Intelligence](https://glenbrook.com/payments_news/personetics-partners-with-plaid-to-help-banks-win-account-primacy-with-open-finance-intelligence/)
    — Glenbrook'
  style_check:
    compliant: false
    warnings:
