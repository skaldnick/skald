- headline: 'UK mobile wallet registrations reach nearly two thirds of adults

    '
  standfirst: 'Fresh industry data shows cards remain dominant but mobile wallet penetration
    has crossed a threshold that reshapes how banks and fintechs think about digital
    checkout.

    '
  body: 'Nearly two thirds of UK adults are now registered with at least one mobile
    wallet provider, according to the latest industry data, though cards continue
    to dominate overall payment volumes. The figure marks a steady acceleration from
    the 57% reported in the previous data release.


    The growth reflects both the normalisation of contactless NFC payments at the
    point of sale and the expansion of wallet functionality into online checkout,
    transit and in-app purchases. Apple Pay, Google Pay and Samsung Pay account for
    the bulk of registrations, but the rising penetration creates competitive pressure
    on card networks and issuers to ensure their products are provisioned into wallets
    by default.


    For pay-by-bank advocates, the data presents a mixed picture. Wallet adoption
    entrenches card-based payment habits at the point of sale, even as account-to-account
    alternatives gain traction in e-commerce and recurring payments. The challenge
    for open banking-based propositions is that wallet UX has set consumer expectations
    that direct bank payment flows have yet to match consistently.

    '
  editorial_note: 'Updated mobile wallet penetration data is relevant context for
    the competitive dynamics between card-based and account-to-account payment methods
    in the UK, a core theme for the audience.

    '
  sources: '[Mobile wallets gain traction in the UK](https://www.finextra.com/newsarticle/48268/mobile-wallets-gain-traction-in-the-uk?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
