- headline: Midnite launches pay-by-bank deposits and withdrawals via TrueLayer
  standfirst: Gambling's emergence as a proving ground for pay-by-bank at scale gains
    another data point as open banking payments go live for both deposits and withdrawals
    on a UK sports betting platform.
  body: 'Midnite, a UK sports betting platform, is launching pay-by-bank for both
    deposits and withdrawals through TrueLayer''s open banking infrastructure. The
    integration allows players to fund accounts and receive winnings directly from
    and to their bank accounts without entering card details.


    Gambling has become one of the most active verticals for pay-by-bank adoption
    in the UK, driven by a combination of regulatory pressure and commercial incentive.
    The Gambling Commission''s confirmation in July that financial risk assessments
    can use open banking data has given operators a reason to integrate the rails.
    For platforms like Midnite, pay-by-bank also reduces card processing fees and
    the chargebacks that are common in the sector.


    TrueLayer has been building its position in gambling payments since launching
    its bank-on-file product. The intersection of open banking and gambling has drawn
    scrutiny from both consumer advocates concerned about affordability checks and
    industry bodies pushing back against them.'
  editorial_note: Gambling continues to be a key vertical for UK pay-by-bank adoption,
    and this story extends the thread from the Gambling Commission's July confirmation
    of open banking-based affordability checks.
  sources: '[Midnite Adds TrueLayer Pay by Bank](https://igamingfuture.com/midnite-adds-truelayer-pay-by-bank/)
    — iGaming Future | [Sports betting platform Midnite launches Pay by Bank in the
    UK via TrueLayer](https://www.openbankingexpo.com/news/sports-betting-platform-midnite-launches-pay-by-bank-in-the-uk-via-truelayer/)
    — Openbankingexpo'
