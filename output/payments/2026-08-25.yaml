title: 'OpenPayd joins Circle network; stablecoin rails meet embedded finance

  '
social_post: 'OpenPayd plugs into Circle''s stablecoin network for instant fiat payouts
  — another sign embedded finance firms are building around stablecoin rails, not
  just traditional ones. Today''s briefing: {link}

  '
stories:
- headline: 'OpenPayd connects to Circle network for stablecoin-settled fiat payouts

    '
  standfirst: 'The integration marks another embedded finance provider building settlement
    infrastructure around stablecoin rails rather than relying solely on traditional
    correspondent banking.

    '
  body: 'OpenPayd is integrating with the Circle Payments Network to offer near-instant
    global fiat payouts to its business clients, using USDC-settled rails to bypass
    the delays and costs of conventional cross-border payment routing. The integration
    allows OpenPayd''s clients to receive payouts in local fiat currencies while settlement
    occurs via Circle''s stablecoin infrastructure.


    OpenPayd, founded in 2018 by Ozan Ozerk, already provides embedded accounts, FX,
    domestic and international payments, open banking and stablecoin on- and off-ramps.
    The Circle integration extends its cross-border payout capabilities rather than
    introducing an entirely new product line. The company disclosed plans for a Nasdaq
    listing via a $1.15 billion SPAC deal in June, signalling ambitions well beyond
    its European embedded finance base.


    The move sits within a broader pattern of payment infrastructure firms adopting
    stablecoin settlement as a practical routing layer for B2B payouts. ClearBank
    Europe launched digital asset rails with SEPA instant payouts earlier this year,
    and Mastercard added stablecoin settlement to its merchant network in June. For
    embedded finance providers competing on speed and cost of cross-border payouts,
    stablecoin rails are becoming a standard part of the toolkit rather than an experimental
    add-on.

    '
  editorial_note: 'Illustrates how stablecoin settlement is being adopted as practical
    plumbing by regulated embedded finance providers, reinforcing a pattern that European
    payments professionals need to track.

    '
  sources: '[OpenPayd Live on Circle Payments Network for Instant Fiat Payouts](https://coinlaw.io/openpayd-circle-payments-network-instant-fiat-payouts/)
    — CoinLaw | [OpenPayd integrates with Circle Payments Network to enable near-instant
    global fiat ...](https://markets.businessinsider.com/news/currencies/openpayd-integrates-with-circle-payments-network-to-enable-near-instant-global-fiat-payments-to-businesses-1036489235)
    — Markets'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'The integration' which repeats the subject (OpenPayd's
      integration with Circle) already named in the headline. Per rule [1], the standfirst
      should open with the substantive point, not re-identify the organisation/action.
      Revise to open with something like 'Stablecoin settlement is becoming...' or
      'The move signals...'
    - Body text contains 'earlier this year' (in the sentence 'ClearBank Europe launched
      digital asset rails with SEPA instant payouts earlier this year'). Per the rule
      against vague temporal references, use a specific time period or date instead.
    - Body text contains 'in June' (in the sentence 'Mastercard added stablecoin settlement
      to its merchant network in June'). Per the rule against vague temporal references
      when a specific date is available, use a precise date (e.g., 'on June X') rather
      than just the month.
    - The standfirst makes a generic thematic claim ('embedded finance provider building
      settlement infrastructure around stablecoin rails') without naming specific
      stakes or programmes affected. Per rule [standfirst specificity], name the initiatives
      or competitive dynamics affected — e.g., reference specific competitors or programmes
      OpenPayd is positioning against.
    - Body paragraph 2 contains 'signalling ambitions well beyond its European embedded
      finance base' which could be read as announcing significance/notability. While
      not egregiously phrased, consider whether 'signalling' implies the reader should
      find this notable before substantive point is made.
  verification:
    verified: false
    stale: true
    duplicate: false
    warnings:
    - The core OpenPayd-Circle partnership announcement dates to June 17, 2025, over
      14 months ago—well beyond the 5-day threshold for recency
  revision:
    replaced: false
    summary:
    - Flagged as stale but no unused candidate was available — kept as-is, editor
      should review.
- headline: 'Itau receives preliminary US national bank approval from OCC

    '
  standfirst: 'Brazil''s largest private bank is establishing a directly chartered
    US presence, reflecting a wave of non-US banks seeking full national bank status
    to serve cross-border clients.

    '
  body: 'The Office of the Comptroller of the Currency has granted Itau BBA Nassau
    Branch, a subsidiary of Itau Unibanco, preliminary approval to establish a US
    national bank. The approval requires the new entity to hold $507 million in capital,
    underscoring the scale of the planned operation.


    Itau is the largest private bank in Latin America and already operates in the
    US through branch and representative office structures. A full national bank charter
    would give it direct access to US payment rails and deposit-taking powers, removing
    its reliance on correspondent banking arrangements for dollar-denominated activity.
    The move comes as several large non-US banks – including European institutions
    – are reassessing how they access the US market amid shifting regulatory signals
    from the OCC.


    For European payments and banking professionals, Itau''s charter pursuit is relevant
    on two fronts. It reflects growing competition from Latin American banks in cross-border
    corridors that European institutions also serve. And it tests the OCC''s appetite
    for chartering foreign-owned national banks at a time when the agency recently
    rejected Wise''s own US bank charter application, which the company has since
    refiled.

    '
  editorial_note: 'Relevant to the European audience because it tests OCC chartering
    appetite for foreign-owned banks – directly comparable to Wise''s rejected and
    refiled application – and signals competitive dynamics in cross-border payment
    corridors.

    '
  sources: '[OCC grants Itaú preliminary nod for US national bank](https://www.fintechfutures.com/regulatory-actions/occ-grants-itau-preliminary-nod-for-us-national-bank)
    — FinTech Futures'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation ('Brazil's largest private bank')
      that is also the subject of the headline ('Itau'). Per rule [1], the standfirst
      should open with the substantive point or action — eg, 'is establishing a directly
      chartered US presence' — rather than naming the organisation first.
    - Body text uses 'United States' instead of 'US' in the phrase 'The Office of
      the Comptroller of the Currency has granted Itau BBA Nassau Branch...preliminary
      approval to establish a United States national bank.' Per rule [4], use 'US'
      not 'United States' in body text.
    - The paragraph beginning 'For European payments and banking professionals...'
      is a scene-setter that frames the story as a comparative lesson for European
      readers ('relevant on two fronts'). Per rule on non-European market development,
      the story should cover the development on its own merits first rather than leading
      with editorial framing about why Europeans should care.
    - Decimal place used in '$507 million' should be written without decimals. Per
      rule on decimal places, write '$507 million' not '$507.0 million' — though this
      appears correct as written; however, verify the original source to ensure precision
      matching.
    - The phrase 'For European payments and banking professionals, Itau's charter
      pursuit is relevant on two fronts' announces relevance before making substantive
      points. Per the rule against 'This matters because' constructions, write the
      substantive point directly rather than prefacing with 'is relevant'.
  verification:
    verified: false
    stale: true
    duplicate: false
    warnings:
    - Draft says 'Itau BBA Nassau Branch' but OCC approval is for 'Itau Bank, National
      Association' — these are different entities. Itau BBA Nassau Branch is an existing
      Bahamas operation.
    - Story core event is 8 days old (August 17 announcement, August 25 today), exceeding
      5-day freshness threshold.
  revision:
    replaced: false
    summary:
    - Flagged as stale but no unused candidate was available — kept as-is, editor
      should review.
- headline: 'Survey finds majority of firms planning open banking and AI fraud investment

    '
  standfirst: 'New data suggests identity automation and open banking connectivity
    are converging as near-term priorities for payments firms, driven by fraud prevention
    rather than checkout innovation alone.

    '
  body: 'A PYMNTS survey has found that 59% of firms plan to adopt or expand secure
    bank connectivity or open banking within the next year, with the same proportion
    planning near-term investment in AI-based fraud detection. The convergence of
    these two priorities points to open banking data being valued increasingly for
    its role in identity verification and fraud prevention, not solely as a payment
    initiation channel.


    The findings align with developments in the UK and European markets, where open
    banking data is being adopted for affordability checks in mortgage lending and
    gambling regulation, and where regulators including the Financial Conduct Authority
    have flagged open banking''s fraud rates as sitting below wider payment benchmarks.
    The survey results suggest this pattern extends beyond regulatory mandates into
    voluntary commercial adoption.


    The framing is notable because it positions open banking alongside AI-driven fraud
    tools as complementary infrastructure rather than competing priorities. For European
    firms weighing investment in either area, the data supports the case that they
    are converging into a single identity and risk layer underpinning payment flows.

    '
  editorial_note: 'Quantifies the commercial momentum behind open banking as fraud
    infrastructure – a narrative that has been building through UK regulatory moves
    but now has broader survey evidence behind it.

    '
  sources: '[Identity Automation Moves Up the Payments Agenda](https://www.pymnts.com/authentication/2026/identity-automation-moves-up-the-payments-agenda/)
    — PYMNTS.com'
  style_check:
    compliant: false
    warnings:
    - Opening sentence starts with 'A PYMNTS survey' — avoid starting body with digits
      or acronyms. Rephrase to lead with the substantive claim (e.g., 'Fifty-nine
      per cent of firms plan...' or 'The majority of firms surveyed plan...').
    - 'Write ''nine'' as a word, not a digit: ''59%'' should be ''fifty-nine per cent''.'
    - The phrase 'The framing is notable because' in the third paragraph violates
      the rule against announcing notability before making a substantive point. Rewrite
      to state the substantive claim directly — e.g., 'Open banking is positioned
      alongside AI-driven fraud tools as complementary infrastructure rather than
      competing priorities.'
    - Standfirst uses 'near-term priorities' and body repeats 'near-term investment'
      in the same phrasing across standfirst and body opening. While some repetition
      of the standfirst's point in the body is expected, this near-verbatim phrasing
      should be varied — e.g., use 'investment planned within the next year' or similar
      alternative in the body.
  verification:
    verified: false
    stale: true
    duplicate: false
    warnings:
    - Story reports PYMNTS survey published ~August 11, 2026 (14 days ago), exceeding
      5-day recency threshold
    - Claim that 'regulators including the Financial Conduct Authority have flagged
      open banking's fraud rates' is unsupported - Open Banking Limited published
      these fraud rate findings, not the FCA
  revision:
    replaced: false
    summary:
