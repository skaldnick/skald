- headline: Noggin HQ raises £2.3m to build open banking credit scoring infrastructure
  standfirst: An alternative credit scoring model built on permissioned open banking
    data has attracted seed funding, targeting borrowers underserved by traditional
    bureau systems.
  body: 'Noggin HQ, a UK startup founded by Evangeline Atkinson and Laura Mills, has
    raised £2.3 million in seed funding to develop credit scoring infrastructure that
    uses permissioned open banking data as its primary input. The company''s model
    aims to assess creditworthiness using real-time transaction data rather than relying
    solely on traditional credit bureau records.


    The approach addresses a well-documented gap in conventional credit scoring: borrowers
    with thin or non-existent bureau files – including younger consumers, recent migrants
    and those who have historically operated outside mainstream credit – are routinely
    declined despite demonstrable ability to repay. Open banking data, which captures
    actual income, spending patterns and financial behaviour, provides a richer and
    more current picture than static bureau reports.


    Plend, ClearScore and others have already explored open banking-powered credit
    assessment, and the seed raise reflects continued investor appetite for the category.
    The FCA''s open finance roadmap and chancellor Rachel Reeves''s SME lending push
    both point toward a regulatory environment that will increasingly expect lenders
    to use richer data sources. Scaling these models to the point where they earn
    institutional trust sufficient to complement bureau scoring remains the central
    challenge.'
  editorial_note: A small but illustrative funding round that speaks directly to how
    open banking data is being applied beyond payments, relevant to the open finance
    trajectory the audience is tracking.
  sources: '[Noggin HQ Raises £2.3M in Seed Funding](https://www.finsmes.com/2026/08/noggin-hq-raises-2-3m-in-seed-funding.html)
    — FinSMEs'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the action ('The seed round funds') rather than the
      substantive point. Per rule [1], the standfirst should not open by naming the
      organisation from the headline; it should begin with the substantive point.
      Revise to open with the significance of the development (e.g., 'An alternative
      credit scoring model built on...' or similar) rather than 'The seed round funds'.
    - Body text uses '£2.3 million' with a decimal point for a round number. Per rule
      on decimals, write '£2.3 million' only if the figure is genuinely 2.3; if it
      is a round figure, remove the decimal. Clarify whether this is exactly £2.3m
      or should be rendered differently.
    - The sentence 'Whether open banking credit models can achieve the scale and institutional
      trust needed to complement or displace bureau scoring remains an open question'
      is a hedging scene-setter that delays the substantive point. Per rule on avoiding
      hedging, lead directly with a substantive claim rather than introducing uncertainty
      upfront.
    - The phrase 'Noggin HQ is not the first company to pursue this model' functions
      as a hedging device before the substantive point. Per rule on avoiding 'one
      of a growing number' constructions, state the broader trend directly rather
      than hedging significance with comparative phrasing.
  verification:
