- headline: Scalable Capital launches AI-driven investing feature with agentic integration
  standfirst: The German digital wealth manager is connecting its investment platform
    to external AI assistants, reflecting a growing pattern among European fintechs
    of embedding intelligence directly into financial interfaces.
  body: 'Scalable Capital has launched what it describes as Europe''s first agentic
    investing feature, enabling customers to connect their Scalable Capital investment
    accounts to external AI assistants. The product allows AI tools to access a user''s
    portfolio data and generate personalised investment recommendations and portfolio
    adjustments based on their holdings.


    The launch sits at the intersection of two trends that European regulators are
    actively shaping: the extension of data-sharing principles into investment products
    under emerging open finance frameworks, and the application of AI to regulated
    financial advice. The FCA''s July AI review explicitly placed agentic payments
    and open finance within its supervisory scope, and the European Commission''s
    investor data-sharing proposal is designed to enable exactly this kind of cross-sector
    data use.


    For the wealth management sector, the move illustrates how platform APIs are being
    opened to third-party AI services as a distribution and engagement layer. Scalable
    Capital, which manages assets for more than one million customers in Germany,
    Austria and other European markets, is well positioned to test whether consumers
    will trust AI-driven advice built on their investment data. The regulatory and
    liability questions around automated investment recommendations remain unresolved,
    but the direction of travel is clear.'
  editorial_note: A concrete product launch that demonstrates investment platform
    data being opened to AI assistants – directly relevant to European open finance
    regulation and the FCA's AI review.
  sources: '[Itaú Unibanco Secures Preliminary OCC Approval for US National Bank Charter](https://ffnews.com/news/preliminary-approval-for-the-establishment-of-a-national-bank-in-the-united-stat-12639c98)
    — Ffnews'
