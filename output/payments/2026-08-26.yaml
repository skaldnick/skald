    - Body paragraph 1 opens with 'Salt Edge has published a report' — this repeats
      the organisation named in the standfirst and delays the substantive point. Should
      lead with the finding itself, not the report's publication.
    - Phrase 'the point at which that shift has become mainstream rather than experimental'
      in paragraph 2 uses 'experimental' which echoes 'experiment' from the standfirst,
      creating near-verbatim repetition of phrasing across standfirst and body.
    - Final sentence 'the commercial dynamics of API monetisation will become more
      consequential' uses hedging language ('will become') that weakens a substantive
      claim about current competitive dynamics; should state the dynamics directly.
