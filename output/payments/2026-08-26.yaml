title: 'Premium APIs gain traction; Noggin HQ seed round; Scalable Capital launches
  AI-open banking platform

  '
social_post: 'Most of Europe''s biggest banks now monetise premium APIs beyond compliance
  — plus a UK credit scoring startup raises seed funding using open banking data.
  Today''s briefing: {link}

  '
stories:
- headline: 'Most large European banks now earn revenue from premium APIs

    '
  standfirst: 'A new Salt Edge report finds that premium API monetisation has moved
    from experiment to established practice among Europe''s largest banks, reinforcing
    the commercial case for open finance beyond regulatory compliance.

    '
  body: 'Salt Edge has published a report examining how Europe''s largest banks are
    commercialising premium APIs – services that go beyond the data-sharing mandated
    by regulation to offer value-added products such as enriched transaction data,
    identity verification and payment initiation with enhanced features. The report
    finds that a majority of these institutions are now generating revenue from such
    services.


    The shift from compliance-driven API provision to commercial API strategies has
    been anticipated since PSD2 first required banks to open access to account data.
    What the report captures is the point at which that shift has become mainstream
    rather than experimental. Banks that initially treated API infrastructure as a
    cost centre are increasingly treating it as a revenue line, competing with third-party
    providers on data quality and reliability.


    For fintechs and payment service providers, the development is double-edged. Premium
    APIs from banks can improve service quality and reduce friction, but they also
    signal that banks intend to compete directly in the data layer rather than cede
    it to intermediaries. As open finance regulation expands the scope of shared data
    across pensions, insurance and investments, the commercial dynamics of API monetisation
    will become more consequential.

    '
  editorial_note: 'Advances the previously covered story on premium API monetisation
    with a new industry report providing supporting evidence, relevant as open finance
    frameworks expand the commercial opportunity.

    '
  sources: '[New Salt Edge report explores the commercial potential of premium APIs](https://www.openbankingexpo.com/news/new-salt-edge-report-explores-the-commercial-potential-of-premium-apis/)
    — Openbankingexpo'
  style_check:
    compliant: false
    warnings:
