      — the flagged issue appears to have been based on a misreading of the draft.
- headline: Bundesbank urges banks to take more active role in European payments development
  standfirst: The intervention adds institutional weight to the payment sovereignty
    debate as Wero expands and the digital euro advances through the European Parliament.
  body: 'The Deutsche Bundesbank has called on banks and payment service providers
    to engage more actively in developing Europe''s payments infrastructure. The intervention,
    reported by The Banker, comes amid intensifying debate over European payment autonomy
    and the role of domestic schemes versus global card networks.


    Germany is a critical market for several overlapping European payments initiatives.
    Wero, the European Payments Initiative''s digital wallet, went live for German
    customers through ING in August 2025 and is expanding to further banks. The digital
    euro advanced to trilogue negotiations in July after the European Parliament''s
    vote. In both cases, bank participation and investment are prerequisites for success
    – and the Bundesbank''s public nudge suggests the pace of engagement from the
    German banking sector has not matched the ambition of the policy framework.


    The statement echoes similar calls from the Bank of Finland and the French Banking
    Federation, both of which framed European payment sovereignty as a strategic priority.
    The Bundesbank''s voice carries particular weight given the size of the German
    payments market and the historically cautious posture of its banking sector toward
    pan-European payment projects.'
  editorial_note: ''
  sources: '[Reg Wrap: US kills targeted credit programme guidance](https://www.thebanker.com/content/0278b427-84f3-44a3-87e7-5115b1e81b21)
    — The Banker'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'Germany's central bank' which is also identified
      in the headline as 'Bundesbank' — this violates rule [1] about not opening the
      standfirst by naming the organisation also named in the headline. The standfirst
      should begin with the substantive point (e.g., 'The intervention adds institutional
      weight…') rather than identifying the source.
    - Body text uses 'earlier this year' without a specific date when referring to
      Wero going live for German customers — violates rule on avoiding vague temporal
      references and using specific time periods when available.
    - Editorial note is included stating 'The Bundesbank publicly urging banks to
      step up on European payments infrastructure is a meaningful addition to the
      sovereignty debate' — violates rule against including editorial notes about
      the story's significance or interpretation. Editorial notes should contain only
      factual context about sourcing or missing information, not editorial judgment.
    - Body uses 'The digital euro advanced to trilogue negotiations in July' — this
      uses only month without specific date when 'July' is the only time reference.
      The rule requires specific dates where available (e.g., 'July 9'). If only the
      month is known, that is acceptable, but the phrasing suggests a specific date
      may be available.
  verification:
    verified: false
    stale: false
    duplicate: false
