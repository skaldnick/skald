title: 'Equifax acquires AccountScore; Trustly posts Q2; Siirto links e-invoicing
  to instant payments

  '
social_post: 'Equifax buys its way into open banking data, Trustly reports Q2, and
  Finland wires e-invoicing to instant payments. Today''s briefing: {link}

  '
stories:
- headline: 'Equifax acquires AccountScore to embed open banking data in credit decisions

    '
  standfirst: 'The acquisition gives one of the world''s three major credit bureaux
    direct ownership of open banking analytics capability, signalling that transaction
    data is becoming core infrastructure for credit assessment rather than a supplementary
    input.

    '
  body: 'Equifax has acquired AccountScore, a UK-based open banking data analytics
    firm. The deal brings AccountScore''s transaction categorisation and income verification
    tools inside a global credit bureau operation, integrating permissioned bank data
    directly into Equifax''s decisioning products.


    AccountScore has built its business on turning raw open banking feeds into structured
    affordability and creditworthiness signals – the kind of enrichment layer that
    lenders increasingly expect alongside traditional credit files. For Equifax, the
    acquisition removes a dependency on third-party open banking intermediaries and
    positions it to offer combined bureau-plus-bank-data products as a single service.


    The deal fits a broader pattern of credit data incumbents acquiring open banking
    capability rather than building it. PayPoint completed its acquisition of AperiData
    in June for similar reasons. As open finance regulation widens the data pools
    available – pensions, investments, insurance – the commercial logic of owning
    the analytics layer, not just accessing the pipes, becomes harder for the major
    bureaux to ignore.

    '
  editorial_note: 'A major credit bureau acquiring open banking analytics capability
    is a structural shift in how credit data markets are organised, relevant to any
    European lender or fintech building on open banking data.

    '
  sources: '[Equifax acquires Open Banking and Data analytics company…](https://ffnews.com/newsarticle/equifax-acquires-open-banking-and-data-analytics-company-accountscore)
    — Fintech Finance News'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'one of the world's three major credit bureaux' which
      is a descriptive reference to Equifax (the organisation named in the headline).
      Per rule [1], the standfirst should open with the substantive point or action
      rather than identifying the organisation from the headline. Revise to open with
      'The acquisition gives direct ownership of open banking analytics capability
      to a major credit bureau, signalling that transaction data is becoming core
      infrastructure for credit assessment rather than a supplementary input.'
    - 'Body text uses ''June'' without a specific date. Per rule on vague temporal
      references, use the precise date (eg, ''on June X'') or, if only the month is
      known, format as ''in June 2025'' or similar with year context. Currently reads:
      ''PayPoint completed its acquisition of AperiData in June for similar reasons.'''
    - The editorial note states 'A major credit bureau acquiring open banking analytics
      capability is a structural shift in how credit data markets are organised, relevant
      to any European lender or fintech building on open banking data.' This is editorial
      commentary flagging significance/relevance rather than describing factual content.
      Per the rule against including editorial notes about missing information or
      editorial framing, remove this note entirely.
  verification:
