- headline: Revolut launches MiCA-compliant euro stablecoin as competition intensifies
  standfirst: A euro-backed stablecoin, EURR, makes Revolut one of the first major
    neobanks to issue a regulated token in Europe, entering a market where Circle,
    Societe Generale and now multiple fintechs are competing for position.
  body: 'Revolut has launched EURR, a euro-backed stablecoin issued under the EU''s
    Markets in Crypto-Assets (MiCA) regulation. The token is designed to serve as
    a bridge between fiat and crypto, enabling Revolut''s users to move between the
    two without leaving the platform.


    The launch places Revolut alongside Circle, Societe Generale''s Forge and a small
    but growing group of regulated euro stablecoin issuers. MiCA''s stablecoin provisions,
    which took effect in mid-2024, created a licensing framework that has encouraged
    incumbents and fintechs alike to enter the market. Revolut''s scale – it reports
    more than 80 million customers globally – gives it immediate distribution that
    most crypto-native issuers lack. The launch also follows Visa, Mastercard and
    Google backing the launch of Open USD, a dollar-denominated stablecoin, underscoring
    how quickly the competitive landscape is shifting.


    Euro stablecoins remain primarily crypto trading instruments, but MiCA compliance
    gives issuers optionality to expand into settlement and payment rails as the regulatory
    environment matures. Revolut''s positioning of EURR as a "bridge" suggests it
    sees the token''s near-term utility in crypto markets rather than merchant payments.'
  editorial_note: Revolut is among the first major neobanks to issue a MiCA-regulated
    stablecoin, alongside incumbents such as Societe Generale and crypto-native issuers
    including Circle.
  sources: '[Revolut Launches EURR Stablecoin: A New MiCA-Compliant Bridge Between
    Fiat and Crypto](https://ffnews.com/news/revolut-rolls-out-its-first-euro-backed-stablecoin-eurr-creating-a-new-bridge-be-37595cf1)
    — Ffnews'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'The euro-backed token, EURR, makes Revolut one of the
      first major neobanks' — this violates rule [1] by not beginning with the substantive
      point. Should open with the action/consequence (e.g., 'Revolut has launched…'
      or 'A euro stablecoin has entered the market…') rather than naming the token
      as the subject.
    - Body paragraph 3 contains 'For European payments professionals, the question
      is whether euro stablecoins will remain primarily crypto trading instruments
      or develop into viable settlement and payment rails' — this violates the rule
      against flagging significance explicitly. The sentence announces 'the question
      is' before making a substantive point, functioning as editorial framing rather
      than reporting. Write the substantive claim directly.
    - Editorial note states 'A major European neobank entering the regulated stablecoin
      market is a significant competitive development' — this violates the rule prohibiting
      editorial notes that flag significance or notability. Editorial notes should
      provide factual context only, not commentary on what makes the story significant.
