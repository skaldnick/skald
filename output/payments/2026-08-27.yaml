- headline: Bundesbank urges banks to take more active role in European payments
  standfirst: Banks and payment service providers must engage more actively in European
    payments infrastructure, the Bundesbank has said, with direct implications for
    Wero, the digital euro and the broader sovereignty debate.
  body: 'The Deutsche Bundesbank has called on banks and payment service providers
    to play a more active part in developing European payments infrastructure. The
    intervention, reported on August 26, frames participation in European payment
    initiatives as a strategic imperative rather than a regulatory compliance exercise.


    The statement echoes positions taken in the first half of 2025 by the Bank of
    Finland and the French Banking Federation, both of which have explicitly linked
    payment infrastructure to European strategic autonomy. The Bundesbank''s voice
    carries particular weight given Germany''s role as the largest eurozone economy
    and the fact that Wero – the European Payments Initiative''s consumer-facing product
    – has its deepest market penetration in Germany, where roughly 600,000 of ING''s
    10 million current account holders had activated the platform by June.


    The timing coincides with several parallel developments: the European Parliament
    voted in July to advance the digital euro regulation to final negotiations, Visa
    pledged 500 million euros in European investment amid the sovereignty debate,
    and the Dutch iDEAL-to-Wero migration roadmap was agreed in July. The Bundesbank''s
    intervention adds institutional pressure on banks that have so far remained on
    the sidelines of these initiatives, particularly smaller institutions yet to commit
    to Wero or engage with digital euro preparations.'
  editorial_note: The Bundesbank adding its voice to the European payments sovereignty
    debate builds on previously covered statements from the Bank of Finland and French
    Banking Federation.
  sources: '[Reg Wrap: US kills targeted credit programme guidance](https://www.thebanker.com/content/0278b427-84f3-44a3-87e7-5115b1e81b21)
    — The Banker'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the consequence ('The call reinforces...') rather
      than the substantive action. Per rule [1], the standfirst should open with the
      action itself — e.g., 'Banks and payment service providers must play a more
      active role in developing European payments infrastructure, the Bundesbank has
      said, framing...' — to avoid making the headline and standfirst feel like separate
      editorial statements rather than headline + explanatory context.
    - Body text uses 'earlier this year' (vague temporal reference). Per rule on temporal
      references, use specific time periods or dates. Replace with 'in the first half
      of 2025' or the specific months/quarters when the Bank of Finland and French
      Banking Federation made their statements.
    - Editorial note flags significance ('meaningful escalation') which violates the
      rule against including editorial judgment in editorial notes. Editorial notes
      should record factual context only, not editorial assessment.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - ING did not bring 10 million customers onto Wero in June—approximately 600,000
      customers (about 15% of ING's 10 million current account holders in Germany)
      had activated Wero as of June 2026. In June 2026, ING expanded its offering
      to include online payments, not P2P-only.
