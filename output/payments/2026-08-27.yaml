title: 'UK remit for BoE innovation; Revolut euro stablecoin; Bundesbank on payments
  sovereignty

  '
social_post: 'UK government hands the Bank of England a formal innovation mandate
  for payments and stablecoins — plus Revolut''s MiCA-compliant euro stablecoin and
  the Bundesbank''s push for European payments autonomy. {link}

  '
stories:
- headline: UK government adds innovation mandate to Bank of England's payments remit
  standfirst: A new statutory responsibility will require the central bank to actively
    support innovation in payment systems and digital money, including stablecoins
    – a concrete step in the broader payments modernisation consultation launched
    in July.
  body: 'The UK government is directing the Bank of England (BoE) to take on a formal
    responsibility for supporting innovation in payment systems and digital money
    such as stablecoins. The move, announced on August 27, extends the central bank''s
    existing role beyond stability and resilience to include an explicit innovation
    objective.


    The mandate sits within the wider payments regulatory overhaul that chancellor
    Rachel Reeves set in motion with the Treasury''s consultation published on July
    14. That consultation proposed bringing stablecoins, open banking and payments
    regulation under a modernised framework. Adding an innovation duty to the BoE''s
    remit gives institutional weight to what had previously been a policy aspiration
    – and aligns the UK more closely with approaches in jurisdictions such as Singapore,
    where the central bank carries a dual mandate covering both stability and development.


    For payment firms and fintechs, the practical question is whether the BoE will
    interpret this mandate narrowly – focusing on its existing oversight of the Clearing
    House Automated Payment System (CHAPS) and the real-time gross settlement system
    – or use it as a basis for more active engagement with emerging payment technologies.
    The framing around stablecoins suggests the latter, and follows the Bank''s decision
    in June to drop individual holding caps from its stablecoin regulatory proposals.'
  editorial_note: This advances the UK payments modernisation story covered in July
    by adding a specific institutional mechanism – a statutory innovation mandate
    for the BoE – that was not part of the earlier consultation coverage.
  sources: '[UK Government tasks Bank of England to support payment systems innovation](https://www.openbankingexpo.com/news/uk-government-tasks-bank-of-england-to-support-payment-systems-innovation/)
    — Openbankingexpo | [UK Government tells Bank of England to support innovation
    in payment systems](https://www.finextra.com/newsarticle/48313/uk-government-tells-bank-of-england-to-support-innovation-in-payment-systems?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'the BoE' when the headline names 'Bank of England'
      – this violates the rule against opening the standfirst by naming the organisation
      also named in the headline. The standfirst should open with the substantive
      point (the innovation mandate requirement) rather than restating the subject.
    - Standfirst uses 'BoE' abbreviation without spelling it out on first use. Per
      the rules, abbreviations must be spelled out in full followed by the abbreviation
      in parentheses on first use in body text, and common abbreviations in the standfirst
      should not use the parenthetical form — but 'BoE' should not appear in the standfirst
      at all given rule 1.
    - Body text uses 'CHAPS' without spelling it out on first use. The rule requires
      abbreviations to be spelled out in full followed by the abbreviation in parentheses
      — eg, 'Clearing House Automated Payment System (CHAPS)'.
    - Vague temporal reference 'in June' should be replaced with a specific date if
      available, per the rule against vague temporal references.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Story states Treasury consultation was 'published on July 17' but it was published
      on July 14, 2026
  revision:
    replaced: false
    summary:
    - Corrected Treasury consultation date from 'July 17' to 'July 14' per the issue's
      stated correct date.
    - Revised standfirst to open with 'A new statutory responsibility' rather than
