title: 'Stripe-Advent bid collapses; BoE gets payments innovation mandate; EU landscape
  report

  '
social_post: 'Stripe and Advent walk away from PayPal. The UK government rewrites
  the Bank of England''s job description. And a new EU payments report maps the regulatory
  reshaping ahead. Today''s briefing: {link}

  '
stories:
- headline: Stripe and Advent abandon $53bn bid for PayPal
  standfirst: PayPal faces renewed pressure on its standalone strategy under CEO Enrique
    Lores, while Stripe's pivot to targeted acquisitions such as OpenRouter signals
    a preference for capability-building over transformative M&A.
  body: 'PayPal shares fell more than 13% on August 28 after reports emerged that
    Stripe and Advent International have withdrawn their joint takeover bid. The $53
    billion approach, first reported in July, would have created a payments group
    of extraordinary scale, combining Stripe''s developer-led infrastructure with
    PayPal''s merchant and consumer network.


    PayPal''s board had rejected the initial offer as too low, and neither side appears
    to have reached terms that could bridge the gap. For Stripe, the withdrawal comes
    shortly after its $7 billion acquisition of AI gateway OpenRouter – a deal that
    signals a preference for targeted capability-building over transformative M&A.


    For PayPal, the collapsed bid leaves CEO Enrique Lores defending a standalone
    strategy at a point when the company''s competitive position in both consumer
    wallets and merchant checkout is under sustained pressure from account-to-account
    alternatives and card network moves into agentic commerce. The share price drop
    suggests investors had been pricing in at least some probability of a deal, and
    with Stripe now unlikely to return, that premium has evaporated.'
  editorial_note: The collapse of the largest proposed payments acquisition is a defining
    moment for the sector's competitive structure and directly relevant to European
    players watching consolidation dynamics.
  sources: '[PayPal shares sink on reported collapse of Stripe-Advent takeover deal](https://www.finextra.com/newsarticle/48322/paypal-shares-sink-on-reported-collapse-of-stripe-advent-takeover-deal?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'The collapse of the largest proposed acquisition in payments
      history' — this is a generic thematic claim rather than naming the specific
      stakes or consequences. The standfirst must name the specific initiatives, programmes
      or competitive dynamics affected, per rule on standfirst specificity.
    - Body text uses 'account-to-account' instead of spelling it out as 'account-to-account'
      on first use — this is non-standard and should be spelled out in full, per rule
      on abbreviations/acronyms.
    - The phrase 'the failed bid intensifies questions about the company's path' uses
      vague language ('intensifies questions') rather than stating the substantive
      point directly. This risks hedging significance; the rule requires direct statement
      of the substantive claim.
    - In the headline, opening with 'Stripe and Advent abandon' and then in the standfirst
      opening with 'The collapse' creates repetitive framing of the same core action
      across headline and standfirst. While not identical wording, the headline and
      standfirst should not both lead with the abandonment/collapse — per rule to
      vary opening across headline, standfirst and body opening sentence.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Draft states 'under CEO Alex Chriss' but Enrique Lores has been CEO since March
      1, 2026. Alex Chriss is the former CEO.
  revision:
    replaced: false
    summary:
    - Replaced 'Alex Chriss' with 'Enrique Lores' as CEO of PayPal, per the issue
      stating Lores has been CEO since March 1, 2026.
    - Rewrote standfirst to name specific stakes — PayPal's standalone strategy under
      Lores and Stripe's pivot to targeted acquisitions such as OpenRouter — rather
      than making a generic thematic claim about the largest proposed acquisition.
    - Standfirst no longer opens with 'The collapse', varying the framing from the
