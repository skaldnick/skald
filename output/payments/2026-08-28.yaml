title: 'UK remit for Bank of England; Swift extends ISO 20022 deadline; Banca d''Italia
  on digital payments

  '
social_post: 'The UK government just told the Bank of England to start caring about
  payments innovation. Plus Swift buys banks more time on ISO 20022 addresses, and
  Italy''s digital payments data tells a nuanced story. {link}

  '
stories:
- headline: UK government adds payments innovation mandate to Bank of England remit
  standfirst: The UK government is directing the Bank of England to support innovation
    in payment systems and digital money, marking a shift in how it engages with stablecoins
    and new payment infrastructure.
  body: 'The UK government is directing the Bank of England (BoE) to take on a new
    responsibility to support innovation in payment systems, including digital money
    such as stablecoins. The instruction, disclosed on August 27, extends the central
    bank''s role beyond its traditional focus on stability and resilience.


    The move follows the Treasury''s consultation on modernising payments regulation,
    which proposed consolidating the Payment Systems Regulator''s functions into the
    Financial Conduct Authority (FCA). Adding an explicit innovation mandate signals
    that the government wants the BoE to play a more active role in shaping – not
    just overseeing – how payment infrastructure evolves. It also positions the BoE
    more directly in the stablecoin regulatory space, where it has until now focused
    primarily on systemic risk assessment.


    The practical effect will depend on how the BoE interprets the mandate alongside
    its stability objectives. The tension between encouraging new entrants and protecting
    the integrity of systemically important payment systems has been a recurring theme
    in the Treasury''s broader payments reform agenda.'
  editorial_note: This advances the UK payments regulatory reform story materially
    – the government is now actively reshaping the BoE's mandate, not just consulting
    on it. It follows on from the July consultation but represents a concrete new
    step.
  sources: '[UK Government tells Bank of England to support innovation in payment
    systems](https://www.finextra.com/newsarticle/48313/uk-government-tells-bank-of-england-to-support-innovation-in-payment-systems?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra | [UK Government tasks Bank of England to support payment systems innovation](https://www.openbankingexpo.com/news/uk-government-tasks-bank-of-england-to-support-payment-systems-innovation/)
    — Openbankingexpo | [Government pushes Bank of England to innovate on payments
    and digital currencies](https://www.cityam.com/government-pushes-bank-of-england-to-innovate-on-payments-and-digital-currencies/)
    — Cityam'
  style_check:
    compliant: false
    warnings:
