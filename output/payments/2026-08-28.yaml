- headline: Swift extends structured address migration deadline for ISO 20022 messages
  standfirst: A number of banks requested more time to move from unstructured to structured
    postal addresses in cross-border payment messages, prompting a reprieve from the
    November deadline.
  body: 'Swift is extending the deadline for migrating from unstructured to structured
    postal addresses in ISO 20022 payment messages, after a number of banks requested
    more time to comply. The original November 2026 cut-off had been set as part of
    the broader ISO 20022 transition for cross-border payments.


    The structured address requirement is one of the more operationally burdensome
    elements of the migration. Banks must update customer records and payment processing
    systems to replace free-text address fields with standardised components – town,
    street, postcode – that enable straight-through processing and reduce manual intervention.
    Many institutions, particularly mid-tier and regional banks, have struggled to
    clean legacy data at the pace required.


    Swift''s decision to accommodate the request reflects a pragmatic judgment that
    enforcing the deadline rigidly would generate compliance failures rather than
    better data quality.'
  editorial_note: ISO 20022 migration is core infrastructure for European cross-border
    payments. A deadline extension for structured addresses is operationally significant
    for banks still working through the transition.
  sources: '[Swift accepts request to extend structured address migration for ISO
    20022 messages](https://www.finextra.com/newsarticle/48318/swift-accepts-request-to-extend-structured-address-migration-for-iso-20022-messages?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Body opening: ''Swift is extending the deadline'' repeats the headline''s subject
      and action. The body''s first sentence should be strong and direct but avoid
      near-verbatim repetition of headline phrasing — revise the standfirst instead
      if repetition is the concern.'
    - 'Body paragraph 3: ''The extension is unlikely to surprise anyone close to the
      migration'' is a hedging scene-setter that delays the substantive point. Lead
      directly with the substantive claim rather than announcing lack of surprise.'
    - 'Body paragraph 3: ''risidly'' is a typographical error (should be ''rigidly'').'
    - 'Body paragraph 3: ''The new deadline has not yet been specified in the available
      sources'' is an editorial note about missing information flagging absence in
      the text. Omit this sentence entirely; do not flag what information is absent.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    summary:
    - Revised the standfirst to avoid opening with the same subject and action as
      the headline, so the body's strong opening sentence no longer creates near-verbatim
