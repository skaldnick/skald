      substantive claim: ''leaves CEO Enrique Lores defending a standalone strategy''.'
    - Body text already used 'account-to-account' spelled out in full; no abbreviation
      was present, so no change was needed on that point.
- headline: 'UK government adds payments innovation to Bank of England''s mandate

    '
  standfirst: 'A new statutory responsibility for payments innovation and digital
    money gives the BoE a formal role in shaping the UK''s competitive position against
    European and US rivals.

    '
  body: 'The UK government is expanding the Bank of England''s remit to include a
    responsibility to support innovation in payment systems and digital money, including
    stablecoins. The change, announced on August 28, gives the central bank an explicit
    mandate alongside its existing objectives of financial stability and resilience.


    The move follows a sustained period of policy activity. Chancellor Rachel Reeves
    launched a consultation on modernising payments regulation in July, and the Treasury
    has been signalling for months that the UK''s post-Brexit regulatory framework
    needs to do more to encourage competition and technological development. Adding
    innovation to the BoE''s formal mandate converts that rhetoric into institutional
    obligation.


    The practical implications will depend on how the Bank interprets the new responsibility.
    Its recent consultation on extending CHAPS settlement hours and its cautious findings
    on distributed ledger technology for wholesale settlement suggest an institution
    that is methodical rather than expansive. A formal innovation mandate could accelerate
    decisions on stablecoin oversight, digital pound architecture and access to settlement
    infrastructure – or it could simply provide political cover for work already under
    way.

    '
  editorial_note: 'This follows up on the previously covered story about the BoE innovation
    mandate with new reporting from City A.M. and Finextra; the institutional and
    policy implications merit coverage as the mandate moves from announcement to interpretation.

    '
  sources: '[Government pushes Bank of England to innovate on payments and digital
    currencies](https://www.cityam.com/government-pushes-bank-of-england-to-innovate-on-payments-and-digital-currencies/)
    — Cityam | [UK Government tells Bank of England to support innovation in payment
    systems](https://www.finextra.com/newsarticle/48313/uk-government-tells-bank-of-england-to-support-innovation-in-payment-systems?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming ''BoE'' without spelling it out on first use. Rule:
      ''Do not apply the abbreviation-in-parentheses rule to the standfirst. In the
      standfirst, common and recognisable abbreviations (such as FCA, EPI) may be
      used on first mention without spelling them out.'' – However, ''BoE'' is not
      listed among the common abbreviations that may be used without spelling out
      (FCA, EPI, US, UK, UN are the examples given). Spell out as ''Bank of England
      (BoE)'' or use ''Bank of England'' in full.'
    - 'Body text uses ''CHAPS'' without spelling it out on first use. Rule: ''On first
      use of an abbreviation that must be retained, spell it out in full followed
      by the abbreviation in parentheses.'' CHAPS appears only once, so per the rule
      ''If the short form never recurs, spell out the term in full without adding
      the abbreviation in brackets,'' write the full term without parentheses.'
    - 'Body text uses ''distributed ledger technology'' without the standard abbreviation.
      Rule states to spell out in full followed by abbreviation in parentheses on
      first use: should be ''distributed ledger technology (DLT)''.'
  verification:
    verified: false
    stale: false
    duplicate: true
    warnings:
    - 'Draft states ''announced on August 28'' but HM Treasury announcement was made
      on 27 August 2026. This story appears to duplicate the entry from 2026-08-28
      in Previously Covered list: ''UK government adds payments innovation mandate
      to Bank of England remit'''
  revision:
    replaced: false
    summary:
    - Flagged as duplicate coverage but no unused candidate was available — kept as-is,
      editor should review.
- headline: PA EU and Deloitte map regulatory and structural shifts across EU payments
  standfirst: Converging regulatory programmes – the instant payments mandate, finalised
    PSD3 texts and the digital euro proposal – are reshaping competitive dynamics
    across European payments simultaneously.
  body: 'Three major EU regulatory programmes are now advancing on overlapping timelines,
    and a joint report from PA Consulting''s EU practice and Deloitte attempts to
    map how they interact. The Instant Payments Regulation entered into force in April
    2024 but implementation is phased: eurozone banks must be able to send and receive
    instant payments by October 2025, with other providers following by April 2027.
    Final texts of PSD3 and the Payment Services Regulation were agreed on April 23,
    2026. The digital euro proposal, meanwhile, secured the European Parliament''s
    full negotiating position on July 9.


    The report examines how these initiatives compound one another in practice. The
    instant payments mandate is forcing banks to revisit liquidity management and
    fraud screening capabilities. PSD3''s scope – including tighter rules on access
    to payment systems and expanded open banking obligations – has been finalised
    against a backdrop where non-bank providers already hold significant market share.
    The digital euro continues to raise questions about the role of private-sector
    payment schemes.


    For payments strategists, the report offers a reference point for planning across
    multiple regulatory timelines. The EU payments market has several large-scale
    regulatory programmes running in parallel, each with different implementation
    dates and compliance requirements, and the interactions between them create dependencies
    that cut across individual compliance workstreams.'
  editorial_note: A substantive landscape report from PA EU and Deloitte provides
    a useful framing of how converging EU regulatory programmes are reshaping the
    payments sector simultaneously – relevant context for strategic planning.
  sources: '[PA EU, Deloitte report on EU payments landscape](https://thepaypers.com/payments/news/pa-eu-deloitte-and-the-paypers-launch-eu-payments-report)
    — The Paypers'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'A new report' rather than the substantive point.
      Per rule [1], avoid opening with the organization/action being reported; instead
      begin with the interpretive point. Should open with 'The sector is entering
      a period where...' or similar, naming the stakes directly.
    - Body opening 'PA Consulting's EU practice and Deloitte have published a joint
      report' repeats the standfirst's framing nearly verbatim ('A new report' → 'have
      published a joint report'). Per rule [6], avoid near-verbatim repetition across
      standfirst and body opening. Strengthen the body's opening with a substantive
      claim.
    - Sentence 'The report's value lies less in any single finding than in its attempt
      to map how these initiatives interact.' announces significance before making
      a point. Per rule [5], write the substantive point directly without phrases
      that flag importance. Revise to state directly what the report maps or argues.
    - Sentence 'Understanding how they intersect is a practical necessity, not an
      academic exercise.' explicitly frames significance. Per rule [5], avoid announcing
      importance; state the substantive point directly without this framing.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Instant Payments Regulation is not universally 'fully in effect' — it entered
      force in April 2024 but implementation is phased (Eurozone banks required to
      send/receive by October 2025; other providers until April 2027)
    - 'Digital euro status overstated: Parliament confirmed full negotiating position
      on July 9, 2026 (not merely ''cleared committee stage'' on June 24)'
    - 'PSD3/PSR status understates progress: final versions agreed April 23, 2026
      (not merely ''advancing'')'
  revision:
    replaced: false
    summary:
    - 'Corrected Instant Payments Regulation status: now states it entered into force
      in April 2024 with phased implementation (eurozone banks by October 2025, others
      by April 2027) rather than claiming it is ''fully in effect''.'
    - 'Corrected PSD3/PSR status: now states final texts were agreed on April 23,
      2026 rather than merely ''advancing''.'
    - 'Corrected digital euro status: now states Parliament confirmed full negotiating
      position on July 9 rather than ''cleared committee stage''.'
    - Revised standfirst to open with the substantive point ('Converging regulatory
      programmes…') rather than 'A new report'.
    - Revised body opening to lead with a substantive claim about the three programmes
      rather than repeating the standfirst's framing.
    - Removed 'The report's value lies less in any single finding than in its attempt
      to map…' sentence that announced significance before making a point; replaced
      with direct statement of what the report does.
    - Removed 'Understanding how they intersect is a practical necessity, not an academic
