    summary:
    - Rewrote headline to lead with the substantive finding ('Digital payments in
      Italy more than doubled') rather than opening with 'Banca d'Italia reports',
      resolving the repeated-opening-word issue across headline, standfirst and body.
    - Revised standfirst to open with the substantive point ('Rapid growth in electronic
