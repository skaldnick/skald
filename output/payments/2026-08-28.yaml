      point.
- headline: Digital payments in Italy more than doubled between 2018 and 2025
  standfirst: Rapid growth in electronic payments alongside nascent open banking adoption
    offers a benchmark for how southern European markets are shifting.
  body: 'Banca d''Italia has published data showing that digital payments in Italy
    more than doubled between 2018 and 2025. The central bank notes that open banking
    services have grown in recent years, representing what it calls "an innovative
    component of the payment system" aimed at fostering competition and efficiency.


    Italy has historically lagged northern European markets in electronic payment
    adoption, with cash remaining dominant well into the 2020s. The doubling over
    seven years suggests a structural shift rather than a temporary pandemic effect,
    though the base was low. Open banking''s contribution remains modest in absolute
    terms but is growing from a near-standing start.


    The data arrives as the European Commission pursues enforcement of the instant
    payments regulation and the digital euro moves through legislative negotiations.
    Italy''s trajectory matters for both: a market that is digitising rapidly but
    still has significant cash usage presents both the strongest case for new payment
    infrastructure and the greatest implementation challenge.'
  editorial_note: Source is Banca d'Italia published data. The specific report or
    dataset from which the doubling figure and open banking characterisation are drawn
    was not identified in the original draft.
  sources: '[Bank of Italy: Digital payments more than doubled between 2018 and 2025](https://www.agenzianova.com/en/news/bankitalia-i-pagamenti-digitali-sono-piu-che-raddoppiati-tra-il-2018-e-il-2025/)
    — Agenzia Nova'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'Italy's central bank' when the headline names 'Banca
      d'Italia' — this violates the rule against opening the standfirst by naming
      the organisation that is also named in the headline. The standfirst should begin
      with the substantive point (e.g., 'Digital payments in Italy more than doubled
      between 2018 and 2025') rather than re-naming the source.
    - Headline starts with a company/organisation name 'Banca d'Italia reports' and
      body opens with 'Banca d'Italia has published data' — this violates the rule
      against starting the headline, standfirst, and body opening sentence with the
      same word or phrase. At least one element must vary its opening.
    - Body text uses 'em-dash' (—) in 'a market that is digitising rapidly but still
      has significant cash usage presents both the strongest case for new payment
      infrastructure and the greatest implementation challenge' — should use en-dash
      (–) instead.
    - Editorial note states 'Italian digital payments data from the central bank provides
      a useful southern European benchmark' — this is flagged as editorial commentary
      about the story's purpose rather than information about missing or added content.
      However, the editorial note itself should not characterise the story's significance;
      it should only flag missing information or context. Remove or rephrase to avoid
      editorial assertion.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
