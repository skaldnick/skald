    - 'Body text uses ''July'' without a specific date. Per rule on vague temporal
      references: ''Use the precise date (eg, "on July 9") or, where only a month
      is known, the month name.'' Should either provide the full date or specify ''in
      July 2024'' or similar year context.'
    - 'Headline and standfirst both open with references to Asia-Pacific/the region
