stories:
- headline: PayPal shares drop 13% as Stripe-Advent takeover bid collapses
  standfirst: The prospect of the largest payments acquisition in history has evaporated,
    leaving PayPal facing renewed questions about its standalone trajectory after
    the reported withdrawal of the $53bn offer.
  body: 'Shares in PayPal fell more than 13% on August 28 after reports that Stripe
    and Advent International have abandoned their takeover bid for the payments group.
    The consortium had tabled a $53 billion offer in July, which PayPal''s board rejected
    as too low.


    The collapse ends a saga that had dominated payments M&A speculation for weeks.
    A deal of that scale would have created a combined entity handling a significant
    share of global online commerce, raising inevitable competition concerns. Its
    failure leaves both sides in familiar positions – Stripe privately held and acquisitive,
    PayPal publicly listed and under pressure from investors to articulate a growth
    strategy after shutting its venture arm and undergoing leadership-driven restructuring.


    For the broader industry, the episode underscores a widening gap between the valuations
    acquirers are willing to pay and what target boards expect. PayPal''s share price
    decline suggests the market had been pricing in some deal premium, and its removal
    forces a reassessment of PayPal''s standalone value proposition in a market where
    account-to-account payments and agentic commerce are eroding traditional checkout
    economics.'
  editorial_note: Follows the previously covered bid and rejection with a materially
    new development – the deal's collapse – and its market impact.
  sources: '[PayPal shares sink on reported collapse of Stripe-Advent takeover deal](https://www.finextra.com/newsarticle/48322/paypal-shares-sink-on-reported-collapse-of-stripe-advent-takeover-deal?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
