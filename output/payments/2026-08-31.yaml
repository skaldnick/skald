- headline: Bank of America highlights Asia-Pacific as benchmark for cross-border
    speed
  standfirst: Domestic real-time payment systems across the region are pulling cross-border
    expectations upward, exposing the gap between what treasurers in Europe and North
    America can access and what Asian corridors already deliver.
  body: 'Bank of America has pointed to the Asia-Pacific region as the emerging benchmark
    for cross-border payment speed, arguing that the pace of domestic real-time systems
    in markets such as India, Thailand and Singapore is reshaping corporate expectations
    for international flows. The bank said that companies operating across the region
    increasingly expect cross-border payments to match the speed of domestic commerce,
    creating friction where treasury practices, regulations and operating conventions
    have not kept pace.


    The framing reflects a pattern visible in several recent infrastructure moves.
    Citi expanded its cross-border instant payments network to 300 partner banks earlier
    this year, and Swift''s retail payments scheme has been gaining European bank
    participants. But the structural challenge Bank of America identifies is less
    about any single platform and more about the mismatch between always-on domestic
    rails and batch-oriented correspondent banking processes that still underpin much
    of cross-border settlement.


    European corporates face a version of the same tension. The SEPA instant payments
    mandate is compressing domestic settlement times, but cross-border euro payments
    to non-SEPA jurisdictions remain slower. As Asian corridors demonstrate what near-continuous
    settlement looks like in practice, the pressure on European infrastructure to
    deliver equivalent speed for outbound flows will intensify.'
  editorial_note: Bank of America's assessment frames a competitive infrastructure
    gap relevant to European treasurers and payment strategists tracking cross-border
    modernisation.
  sources: '[Bank of America Says APAC Redefines Cross-Border Money Movement](https://www.pymnts.com/news/cross-border-payments/2026/bank-of-america-says-apac-redefines-cross-border-money-movement/)
    — PYMNTS'
  style_check:
