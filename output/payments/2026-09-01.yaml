- headline: 'Danmarks Nationalbank governor makes resilience case for PSD3 implementation

    '
  standfirst: 'Ulrik Noedgaard''s speech positions operational resilience – not innovation
    – as the central concern for Denmark''s approach to the next payments directive.

    '
  body: 'Ulrik Noedgaard, governor of Danmarks Nationalbank, has delivered a speech
    on PSD3 and open banking that frames operational resilience as the defining priority
    for the next phase of European payments regulation. Speaking at a PSD3 and open
    banking conference on August 31, Noedgaard set out the Danish central bank''s
    perspective on how resilient payment infrastructure should be maintained as the
    regulatory framework evolves.


    The speech arrives as PSD3 negotiations continue through the European legislative
    process and as Denmark''s own payments landscape faces particular pressures. Denmark''s
    participation in the ECB''s cross-currency instant payments pilot, launched in
    June, links its krone-denominated system to euro area infrastructure – creating
    new interdependencies that make resilience questions more concrete than they might
    be for a purely eurozone member.


    Central bankers across Europe have increasingly emphasised resilience alongside
    innovation in payments policy. The Bank of Finland framed payment autonomy as
    a geopolitical imperative earlier this year, and the UK government has added a
    payments innovation mandate to the Bank of England''s remit. Noedgaard''s intervention
    adds a Nordic voice to a debate that has been dominated by eurozone and UK perspectives,
    and underscores that PSD3''s operational requirements may matter as much as its
    data-sharing provisions for the countries that must implement it.

    '
  editorial_note: 'A central bank governor''s speech on PSD3 resilience provides a
    primary-source perspective on how non-eurozone EU members are approaching the
    next payments directive – a less-covered angle in a debate that tends to focus
    on eurozone and UK dynamics.

    '
  sources: '[Governor Ulrik Nødgaard''s presentation at PSD3 & Open Banking](https://www.nationalbanken.dk/en/news-and-knowledge/publications-and-speeches/speeches/2026/governor-ulrik-noedgaards-presentation-at-psd3-open-banking-resilient-payments-from-danmarks-nationalbanks-point-of-view)
    — Danmarks Nationalbank'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming individual (Ulrik Noedgaard) rather than leading
      with the substantive point or action. Per rule [1], avoid opening by naming
      the organisation/individual also named in the headline; begin with the substantive
      development instead — e.g., 'Operational resilience – not innovation – is positioned
      as the central concern…' rather than 'Ulrik Noedgaard's speech positions…'
    - Body text uses 'The speech arrives as' which is a vague scene-setter that delays
      the substantive point. Per rule on hedging, lead directly with the substantive
      claim rather than opening with a hedging construction.
    - Body text states 'earlier this year' when describing the Bank of Finland's intervention.
      Per rule on temporal references, avoid vague phrases like 'earlier this year'
      and use specific time periods instead — e.g., 'in the first quarter of 2025
      (January-March)'.
    - Editorial note should not be included in the copy submission. Per rule on editorial
      notes, do not include them as part of the story text; such contextual guidance
      should be separate from the final copy.
