title: 'EMVCo agentic framework; Shinhan-Visa stablecoin deal; MoonPay PayBox in Grok

  '
social_post: 'EMVCo drafts the rulebook for card-based agentic payments. Plus: Shinhan
  signs for Visa''s stablecoin platform and MoonPay''s AI payment vault goes live
  in Grok. {link}

  '
stories:
- headline: EMVCo drafts framework for card-based agentic payments
  standfirst: Codifying how AI agents can initiate card transactions marks the first
    formal attempt to bring agentic commerce within existing card network governance.
  body: 'A draft framework published by EMVCo sets out how card-based payments initiated
    by AI agents should be structured, authenticated and authorised. The framework
    addresses the core challenge that agentic commerce poses for card networks: how
    to maintain cardholder authentication and liability rules when the entity initiating
    a transaction is software rather than a person.


    The draft arrives as agentic payments move rapidly from concept to early production.
    Visa, Mastercard and several European banks have already run pilot agentic transactions
    in recent months, but each has operated within bespoke arrangements. A standardised
    EMVCo framework would provide the interoperability layer that card-based agentic
    payments currently lack, potentially giving card networks a structural advantage
    over alternative rails – including account-to-account – in capturing agentic commerce
    volumes.


    The Euro Banking Association mapped agentic AI''s role in open finance in a report
    published earlier in 2025, and Visa and Mastercard have backed a recently formed
    agentic payments alliance. Whether EMVCo''s framework becomes the dominant standard
    will depend on how quickly issuers and acquirers adopt it, and whether it accommodates
    the range of agent architectures now emerging across the industry.'
  editorial_note: EMVCo setting standards for agentic card payments is a structural
    development that will shape how the card networks compete for agentic commerce
    – a segment moving from pilots to production across Europe.
  sources: '[Instant payments success decided by ecosystems, not infrastructure](https://www.digitaltoday.co.kr/en/view/98796/instant-payments-success-decided-by-ecosystems-not-infrastructure)
    — Digitaltoday | [3 Archetypes of Instant Payment Adoption](https://fintechnews.ch/payments/3-archetypes-of-instant-payment-adoption/85175/)
    — Fintech Schweiz Digital Finance News'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming EMVCo ('The standards body's move') when EMVCo is
      already named in the headline. Per rule 1, the standfirst should open with the
      substantive point or action instead, avoiding redundant repetition.
    - Body text uses 'account-to-account' when the house style prefers spelled-out
      form 'account-to-account (A2A)' or similar. Per rule 2, non-standard abbreviations
      should be spelled out; here the abbreviation is used but not introduced with
      the full form.
    - Standfirst uses vague temporal reference 'earlier this year' without specific
      dates or quarters. Per rule about avoiding vague temporal references, specific
      time periods should be used when referring to business activities.
    - The phrase 'The timing aligns with parallel efforts' in the body is a notability
      announcement that delays the substantive point. Per the rule against opening
      paragraphs with hedging scene-setters or notability framers, the substantive
      claim should lead directly.
    - The body does not spell out 'account-to-account' with the abbreviation 'A2A'
      on first use. Per rule on abbreviations, non-standard abbreviations must be
      spelled out in full followed by the abbreviation in parentheses on first use
      in the body.
    - Headline, standfirst, and body opening sentence all begin with references to
      EMVCo/the standards body/EMVCo. Per rule on varying openings across headline,
      standfirst, and body, at least one element should vary its opening.
