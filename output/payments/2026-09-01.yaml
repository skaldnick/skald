- headline: Singapore proposes legislation to regulate stablecoins under payments
    law
  standfirst: The consultation would embed existing stablecoin regulatory requirements
    into statute, giving Singapore one of the first comprehensive legislative regimes
    for the asset class.
  body: 'The Monetary Authority of Singapore (MAS) has published a consultation paper
    proposing amendments to the Payment Services Act 2019 that would give its stablecoin
    regulatory framework the force of legislation. MAS introduced administrative guidelines
    for stablecoins in 2023 and has since operated a licensing regime; the proposed
    changes would codify reserve, redemption and disclosure requirements directly
    in law.


    The move comes as jurisdictions compete to set the regulatory baseline for stablecoins.
    The EU''s Markets in Crypto-Assets regulation has been in force since mid-2024,
    and the UK is developing its own regime following the Bank of England''s consultation
    on systemic stablecoins. In US federal legislation, stablecoins remain stalled.
    Singapore''s approach – upgrading an existing administrative framework into statute
    – offers a model that avoids starting from scratch while providing the legal certainty
    issuers and institutional users require.


    For European payments professionals, the consultation is relevant on two fronts.
    Singapore is a major hub for cross-border stablecoin settlement, with Visa already
    piloting stablecoin projects there. And the legislative architecture MAS proposes
    – anchoring stablecoin rules within existing payments law rather than creating
    a standalone regime – mirrors the approach several European regulators have considered
    for integrating digital assets into existing frameworks.'
  editorial_note: Singapore is formalising stablecoin rules in statute while both
    Europe and the UK are still finalising their own regimes. The approach of amending
    existing payments legislation rather than creating bespoke crypto law is one several
    European policymakers have considered.
  sources: '[Singapore central bank proposes legislative framework for stablecoins](https://www.finextra.com/pressarticle/110762/singapore-central-bank-proposes-legislative-framework-for-stablecoins?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
