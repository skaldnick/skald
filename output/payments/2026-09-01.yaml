title: 'EMVCo agentic framework; MAS stablecoin legislation; Danmarks Nationalbank
  on PSD3 resilience

  '
social_post: 'EMVCo drafts the rulebook for card-based agentic payments, Singapore
  moves stablecoins into law, and Denmark''s central bank governor makes the case
  for payments resilience under PSD3. Today''s briefing: {link}

  '
stories:
- headline: EMVCo drafts framework for card-based agentic payments
  standfirst: A first attempt by the card industry's technical body to set interoperability
    standards for AI agents making payments on behalf of consumers, the draft framework
    aims to prevent fragmentation before the market scales.
  body: 'EMVCo has published a draft framework designed to promote secure, interoperable
    and scalable card-based agentic payments. The document, now open for industry
    feedback, addresses how AI agents can initiate and authorise card transactions
    while maintaining the security guarantees that underpin EMV specifications.


    Agentic payments – where software agents transact autonomously on a user''s behalf
    – have moved rapidly from concept to early production in 2026. Visa and Mastercard
    have both launched agentic programmes, and card-based agentic pilots have appeared
    in Europe through ING, Worldline and Credit Agricole. But card-based agentic payments
    have lacked a shared technical specification, leaving individual schemes and processors
    to define their own approaches.


    EMVCo''s intervention is an effort to prevent fragmentation before the market
    scales. By proposing a common framework now, the body is signalling that card
    networks intend to compete for agentic commerce rather than cede the space to
    account-to-account or stablecoin alternatives. The feedback period will shape
    how authentication, liability and consent are handled when no human is present
    at the point of sale.'
  editorial_note: EMVCo setting standards for agentic payments is a significant infrastructure
    development that has so far operated through bilateral arrangements.
  sources: '[EMVCo reqests feedback on framework for card-based agentic payments](https://www.finextra.com/pressarticle/110761/emvco-reqests-feedback-on-framework-for-card-based-agentic-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra | [EMVCo reqests feedback on framework for card-based agentic payments](https://www.finextra.com/pressarticle/110760/emvco-reqests-feedback-on-framework-for-card-based-agentic-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
