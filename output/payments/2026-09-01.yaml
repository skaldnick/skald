      when the headline already identifies 'Singapore' as the subject. Per rule [1],
      the standfirst should begin with the substantive point (the legislative codification)
      rather than repeating the entity from the headline. Revise to open with something
      like 'The consultation would embed existing stablecoin regulatory requirements
