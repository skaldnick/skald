- headline: TD Bank completes tokenised payment using Project Agora platform
  standfirst: Real US dollar funds have moved through the BIS-backed multi-currency
    tokenisation platform, advancing the project from prototype to live settlement.
  body: 'TD Bank has carried out a tokenised payment moving real US dollar funds through
    Project Agora, the Bank for International Settlements-backed platform exploring
    how tokenised commercial bank deposits can interoperate with wholesale central
    bank money for cross-border settlement. The transaction marks a progression from
    the proof-of-concept stage that the BIS reported on in March.


    Project Agora brings together seven central banks – including the Banque de France,
    Bank of Korea and the Swiss National Bank – with a consortium of private-sector
    financial institutions. The platform tests whether tokenised deposits, held on
    a shared ledger, can settle cross-border payments more efficiently than correspondent
    banking. TD''s transaction demonstrates that the infrastructure can handle real
    value, not just test tokens.


    The European dimension is direct. The Banque de France and Swiss National Bank
    are both participants, and the project''s design principles overlap with the ECB''s
    own work on wholesale settlement using distributed ledger technology (DLT). The
    Bank of England''s 2025 assessment, published in May, found "significant trade-offs"
    in DLT for wholesale settlement; Agora''s incremental progress with real funds
    offers a counterpoint to that caution and will inform European policy decisions
    on whether tokenised settlement belongs in production infrastructure.'
  editorial_note: Moving from prototype to real-value settlement on the BIS's flagship
    tokenisation project is a meaningful step. With multiple European central banks
    involved, the result feeds directly into policy discussions on wholesale DLT settlement
    across the continent.
  sources: '[TD tests tokenised payments through Project Agorá](https://www.finextra.com/newsarticle/48326/td-tests-tokenised-payments-through-project-agor?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'The transaction moved' when the headline names TD Bank.
      Per rule [1], the standfirst should not open by naming the organisation in the
      headline; instead begin with the substantive point. Revise to open with the
      action/consequence, e.g., 'Real US dollar funds have moved through...' or similar.
    - 'Body text: ''the BIS reported on earlier this year'' — vague temporal reference.
      Per rule on avoiding vague temporal references, use a specific date or month,
      not ''earlier this year''.'
    - 'Body text: ''the Bank of England''s 2025 assessment'' — this phrasing is ambiguous.
      Was the assessment published in 2025, or does it relate to 2025 projections?
      Clarify with a specific date or month.'
    - Editorial note should not be included in the copy submitted for editing. Per
      house style, editorial notes are metadata for internal use, not part of the
      story to be flagged for compliance.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Bank of England's DLT report was published in May 2026, not 2025, though it
      was labeled '2025 assessment'
  revision:
