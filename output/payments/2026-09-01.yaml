    - 'Body text uses ''the US'' but house style requires ''US'' without ''the''.
      Quote: ''In the US, stablecoin legislation remains stalled'' should be ''In
      US federal legislation, stablecoins remain…'' or similar.'
    - 'Editorial note should not be included in the output for copy-editing review.
      Per instructions, you are checking headline, standfirst, body and editorial
