- headline: 'Singapore proposes legislation to regulate stablecoins under payments
    law

    '
  standfirst: 'The bill would make Singapore one of the first major financial centres
    to embed stablecoin oversight within its payments regulatory framework, offering
    a contrasting model to the EU''s MiCA regime.

    '
  body: 'The Monetary Authority of Singapore has proposed legislation that would bring
    stablecoin issuance and operations under the country''s existing payments services
    regulatory framework. The move formalises the regulatory sandbox approach MAS
    has used since 2023, converting interim guidelines into binding statutory requirements.


    The proposed law requires stablecoin issuers to hold reserves equivalent to the
    outstanding token supply in segregated, high-quality liquid assets, and to submit
    to regular independent audits. It also mandates redemption at par value within
    specified timeframes – provisions broadly comparable to MiCA''s reserve and redemption
    requirements but administered under a payments licence rather than a separate
    crypto-asset regime.


    Singapore''s approach matters beyond Asia because it tests whether stablecoins
    can be governed effectively through payments law alone, without the standalone
    regulatory architecture the EU chose with MiCA. For European stablecoin issuers
    and payment firms operating across jurisdictions, the Singaporean model will shape
    expectations around interoperability, equivalence and cross-border passporting.

    '
  editorial_note: 'Singapore''s legislative move provides a direct comparator to MiCA
    for European payments professionals and could influence how cross-border stablecoin
    interoperability develops between Asia and Europe.

    '
  sources: '[Instant payments success decided by ecosystems, not infrastructure](https://www.digitaltoday.co.kr/en/view/98796/instant-payments-success-decided-by-ecosystems-not-infrastructure)
    — Digitaltoday'
