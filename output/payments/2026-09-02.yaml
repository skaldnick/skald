- headline: Twenty-one global banks commit to joint stablecoin venture with euro token
    as priority
  standfirst: Eight European lenders – including Deutsche Bank, Lloyds and Credit
    Agricole – are among the institutions planning a dollar-backed stablecoin for
    2027, with a euro-denominated token next in line and MiCA compliance built in
    from the start.
  body: 'A consortium of 21 financial institutions announced on September 1 that they
    will establish a new company in the second half of 2026 to issue stablecoins for
    payments and digital asset settlement. The venture will begin with a US dollar-denominated
    token, targeting a market launch in the first half of 2027, and has identified
    a euro stablecoin as its immediate expansion priority. The group said the product
    is intended to comply with the GENIUS Act in the US and the Markets in Crypto-Assets
    regulation in the EU.


    The European contingent is substantial: Banco Santander, BBVA, Commerzbank, Credit
    Agricole, Deutsche Bank, Lloyds Banking Group, Rabobank and UBS have all committed.
    North American members include Bank of America, Citi, Goldman Sachs, Wells Fargo
    and Fidelity Investments, with MUFG Bank, Standard Bank and others rounding out
    the roster across Asia, the Middle East and Africa. JPMorgan is absent – the bank
    has said it will deepen its existing JPM Coin and Kinexys deposit token infrastructure
    rather than join the consortium.


    The venture enters a market dominated by Tether and Circle, but its competitive
    logic rests on the participating banks'' existing customer relationships, compliance
    infrastructure and payment network access. A separate group of 37 institutions
    has formed Qivalis to launch a euro-denominated stablecoin later this year, with
    BBVA participating in both initiatives. The ECB has warned that privately issued
    stablecoins could pose risks to monetary policy and financial stability – concerns
    that will sharpen as bank-backed tokens move closer to everyday payments.'
  editorial_note: 'This is a genuinely new story from September 1. While there have
    been previous stablecoin stories in the briefing (AllUnity, Visa/Mastercard/Google
    Open USD, Augustus pivot), this is a materially different development: 21 major
    banks formally committing to a joint venture entity, with eight European banks
    involved and an explicit euro stablecoin as the next priority. The euro-denominated
    ambition, MiCA compliance framing, and the competitive tension with the separate
    Qivalis euro stablecoin initiative give it clear European payments relevance.
    Source is the consortium''s own press release via PR Newswire.'
  sources: '[Group of leading international financial institutions to establish stablecoin
    enterprise](https://www.prnewswire.com/news-releases/group-of-leading-international-financial-institutions-to-establish-stablecoin-enterprise-302866318.html)
    — PR Newswire'
