title: 'Mollie closes GoCardless deal; global banks plan euro stablecoin; Allica eyes
  Sweden

  '
social_post: 'Mollie swallows GoCardless to build a pan-European payments group, global
  banks eye a joint euro stablecoin, and Allica heads for Sweden. Today''s briefing:
  {link}

  '
stories:
- headline: 'Mollie completes €1.1bn GoCardless acquisition, creating pan-European
    payments group

    '
  standfirst: 'The deal combines Mollie''s merchant payments platform with GoCardless''s
    account-to-account network, producing a combined entity with scale across card,
    direct debit and pay-by-bank rails.

    '
  body: 'Mollie has completed its acquisition of GoCardless for €1.1 billion, bringing
    together two of the largest independent European payment companies outside the
    card schemes. The combined group spans card acceptance, direct debit collection
    and open banking-initiated payments across more than 30 markets, with a particularly
    strong footprint in the UK, Netherlands, Germany and France.


    The deal marks a consolidation point in the European merchant payments market.
    GoCardless had only recently reached its first profitable quarter, reporting payment
    volumes that had doubled year on year. Mollie, which has built its business primarily
    on SME card acceptance in continental Europe, gains a recurring payments engine
    and deeper account-to-account capabilities – a combination that positions it to
    compete more directly with Adyen, Stripe and the card networks on multi-rail checkout.


    For the broader market, the acquisition illustrates how account-to-account payments
    infrastructure is being absorbed into full-stack merchant platforms rather than
    remaining standalone. As pay-by-bank volumes grow and commercial variable recurring
    payments gain traction in the UK, the strategic logic of pairing direct debit
    expertise with broader merchant services has become harder to ignore.

    '
  editorial_note: 'A major European payments consolidation deal closing – combining
    two well-known independent players – reshapes the competitive landscape for merchant
    payments and account-to-account infrastructure.

    '
  sources: ''
  style_check:
