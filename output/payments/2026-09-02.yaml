- headline: 'Partior proves atomic settlement across stablecoins and tokenised deposits

    '
  standfirst: 'The successful test demonstrates that different forms of digital money
    can settle simultaneously in a single transaction, addressing a core fragmentation
    risk in tokenised finance.

    '
  body: 'Partior, the blockchain-based clearing and settlement network backed by JPMorgan,
    DBS and Temasek, has completed atomic settlement across stablecoins and tokenised
    bank deposits. The proof of concept shows that two distinct digital money instruments
    – one issued by a commercial bank, the other a regulated stablecoin – can be exchanged
    in a single, indivisible transaction with no settlement lag.


    The test addresses one of the persistent objections to tokenised money: that competing
    token types would create new forms of settlement risk rather than eliminating
    them. By proving that different token standards can interoperate atomically, Partior
    strengthens the case for multi-instrument digital settlement platforms – a model
    the ECB, BIS and several national central banks have been exploring through their
    own projects.


    European banks watching tokenised deposit and stablecoin developments will note
    that Partior''s architecture is designed to plug into existing payment rails,
    not replace them. That makes it a potential settlement layer alongside TIPS or
    TARGET rather than a rival to them.

    '
  editorial_note: 'Atomic cross-asset settlement between stablecoins and tokenised
    deposits is a meaningful technical milestone, directly relevant to European debates
    around the digital euro, MiCA-regulated stablecoins and wholesale DLT settlement.

    '
  sources: '[Instant payments success decided by ecosystems, not infrastructure](https://www.digitaltoday.co.kr/en/view/98796/instant-payments-success-decided-by-ecosystems-not-infrastructure)
    — Digitaltoday'
