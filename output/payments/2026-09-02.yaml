- headline: Mollie completes €1.1bn GoCardless acquisition, creating pan-European
    payments group
  standfirst: The deal unites card acquiring and bank payment infrastructure under
    a single platform serving 350,000 businesses, marking a further round of consolidation
    in European mid-market payments.
  body: 'Mollie, the Amsterdam-based payments provider, completed its acquisition
    of GoCardless on September 1. The deal, first announced in December 2025 and valued
    at €1.1 billion, was structured with more than 90% of the consideration paid in
    shares. The combined group now serves over 350,000 businesses across more than
    30 markets, with a combined valuation of roughly €3 billion. Mollie chief executive
    Koen Koppen leads the enlarged group, while GoCardless co-founder Hiroki Takeuchi
    continues to run GoCardless as a separately branded unit – operating as "GoCardless,
    a Mollie company".


    The acquisition brings together Mollie''s card and local payment method capabilities
    with GoCardless''s bank payment infrastructure, which covers direct debit and
    open banking pay-by-bank services in 38 countries. The €1.1 billion price tag
    represents roughly half of GoCardless''s $2.1 billion peak valuation from 2022
    – a measure of how far fintech valuations have corrected since the pandemic-era
    highs. GoCardless had recently reached its first profitable quarter following
    a period of cost-cutting that included reducing its workforce by roughly a fifth.


    The deal fits a pattern across European payments: mid-market providers combining
    card acquiring, account-to-account payments and adjacent financial services to
    compete with larger integrated platforms such as Adyen and Stripe. For GoCardless''s
    open banking and direct debit merchants, the integration into Mollie''s broader
    platform could accelerate cross-sell into card acceptance and business financing.
    How quickly the two platforms are technically integrated will determine whether
    the combined group can deliver on that promise.'
  editorial_note: The acquisition was announced in December 2025 and has been covered
    in passing (GoCardless profitability story in April, GoCardless joining UKPI in
    June), but the completion of the deal on September 1, 2026 is a genuinely new
    event – the subsequent stage of a continuing story. The €1.1bn deal is one of
    the largest European payments M&A transactions this year and reflects broader
    consolidation trends. Source is The Paypers' September 1 completion report, cross-referenced
    with the GoCardless blog announcement and BusinessCloud's reporting on the deal
    value and terms.
  sources: '[Mollie completes GoCardless acquisition](https://thepaypers.com/mergers-aquisitions-and-investments/news/mollie-finalises-gocardless-acquisition-to-expand-payments-offer)
    — The Paypers'
