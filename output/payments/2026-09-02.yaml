- headline: Allica Bank applies for Swedish licence as first step into European SME
    lending
  standfirst: A Swedish banking licence would give the UK challenger a passport to
    serve small businesses across the European Economic Area, adding to a growing
    list of UK fintechs seeking EU footholds.
  body: 'Allica Bank has applied to Finansinspektionen, Sweden''s financial regulator,
    for a banking licence that would mark its first expansion outside the UK. The
    bank has established a Swedish legal entity and appointed a local leadership team
    headed by Rickard Westlund, with Javier Ubillos as chief technology officer, Victor
    Ramstrom as chief product and operating officer and Samuel Tawadros as chief financial
    officer.


    Allica focuses on businesses with between five and 250 employees – a segment it
    says generates around a third of UK GDP but remains underserved by incumbents.
    CEO Richard Davies said Sweden was chosen for its digital economy, concentrated
    banking market and the opportunity to serve similar businesses. The bank has lent
    more than £4 billion to UK businesses since securing its UK licence in 2019 and
    reported £37 million in statutory pre-tax profit last year. The move follows a
    $155 million Series D round in February that valued Allica at close to $1.2 billion.


    A Swedish licence would also allow Allica to passport services into other EU markets
    over time. Davies has said the Netherlands and Ireland are among the next targets.
    Lucy Rigby, economic secretary to the Treasury, welcomed the expansion as evidence
    of the UK''s position as a base for financial services firms. Allica joins a pattern
    of UK-authorised fintechs seeking EU banking access – Zilch acquired Finland''s
    Fjord Bank earlier in 2026 to achieve a similar outcome.'
  editorial_note: Fresh story published August 31/September 1, 2026. Allica is a significant
    UK SME digital bank (unicorn-valued), and the Swedish licence application illustrates
    a continuing pattern of UK fintechs establishing EU footholds post-Brexit. The
    Treasury's public endorsement and the explicit EU passporting ambition give this
    broader sectoral and policy relevance. Not previously covered.
  sources: '[Allica Bank applies for banking licence in Sweden](https://www.retailbankerinternational.com/news/allica-bank-sweden-banking-licence/)
    — Retail Banker International'
