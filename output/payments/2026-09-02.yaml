title: 'Wero reaches French merchants; EMVCo drafts agentic card framework

  '
social_post: 'Orange becomes the first French merchant to accept Wero for recurring
  bill payments — a meaningful step from peer-to-peer to commercial use. Plus EMVCo''s
  new agentic payments framework and more in today''s briefing. {link}

  '
stories:
- headline: Orange signs on as first French merchant to offer Wero for bill payments
  standfirst: A commercial turning point for EPI's pan-European payment scheme, as
    the move from peer-to-peer transfers into recurring merchant billing reaches its
    first named retailer in France.
  body: 'Orange, the French telecoms group, has agreed to accept Wero for subscription
    bill payments – the first merchant in France to sign up for the capability. The
    European Payments Initiative (EPI) developed Wero initially for person-to-person
    transfers, and extending it to recurring merchant billing represents the scheme''s
    clearest step yet toward becoming a viable alternative to card networks at the
    point of sale. Wero''s subscription payment features are not yet live; EPI has
    indicated they are planned for 2027, making Orange''s commitment a statement of
    intent rather than an operational launch.


    France is EPI''s home market and second-largest by user base after Germany. ING
    expanded Wero in June to include online retail payments for existing users who
    had activated peer-to-peer functionality since August 2025. BoursoBank announced
    a partnership agreement the same month to integrate Wero by the end of 2026, and
    Credit Agricole completed France''s first production agentic payment via the scheme.
    Orange''s agreement signals that the bill-payment use case – critical for proving
    Wero can handle commercial volume – is building institutional support even before
    recurring payments go live.


    Recurring billing is a natural entry point for account-to-account schemes competing
    with card-on-file, because the payment relationship is already established and
    consumer friction is lower than at checkout. Broader e-commerce adoption remains
    uncertain, but a household brand like Orange committing to the option normalises
    the scheme for French consumers in a way that peer-to-peer alone could not.'
  editorial_note: Wero's expansion from P2P into merchant billing is a material development
    in EPI's commercialisation trajectory and directly relevant to European professionals
    tracking card-alternative schemes.
  sources: '[Orange becomes first merchant in Fance to offer Wero for bill payments](https://www.finextra.com/newsarticle/48337/orange-becomes-first-merchant-in-fance-to-offer-wero-for-bill-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
