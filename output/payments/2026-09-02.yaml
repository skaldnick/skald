title: 'EMVCo agentic framework; Partior atomic settlement; Singapore stablecoin law

  '
social_post: 'Slim pickings today, but the stories that matter: EMVCo drafts agentic
  payment rules for cards, Partior proves atomic cross-asset settlement, and Singapore
  moves to regulate stablecoins under payments law. {link}

  '
stories:
- headline: 'EMVCo drafts card-based framework for agentic payments

    '
  standfirst: 'The standard-setting body''s move to define how AI agents initiate
    card transactions marks the first formal attempt to bring agentic commerce under
    existing payment card infrastructure rules.

    '
  body: 'EMVCo has published a draft framework setting out how card-based payments
    initiated by AI agents should be authenticated, authorised and processed. The
    framework addresses a gap that has widened as agentic commerce pilots have multiplied
    across Europe and Asia without a consistent set of technical standards governing
    how autonomous software agents interact with card rails.


    Several major networks – Visa, Mastercard and their partners – have run agentic
    payment pilots over the past year, but each has operated under bespoke arrangements.
    EMVCo''s intervention provides a reference architecture that could unify these
    efforts under the same certification and interoperability regime that governs
    conventional card-present and card-not-present transactions.


    For issuers and acquirers, the practical question is whether existing terminal
    and gateway infrastructure can accommodate the additional authentication layers
    the framework proposes, or whether a more material upgrade cycle lies ahead. The
    draft is open for industry comment, and a finalised specification is expected
    to feed into network rules over the next 12 to 18 months.

    '
  editorial_note: 'EMVCo setting formal standards for agentic card payments is a structural
    development – it moves the agentic commerce conversation from individual pilots
    to an industry-wide rules framework, with direct implications for issuers, acquirers
    and gateway providers.

    '
  sources: '[Instant payments success decided by ecosystems, not infrastructure](https://www.digitaltoday.co.kr/en/view/98796/instant-payments-success-decided-by-ecosystems-not-infrastructure)
    — Digitaltoday'
