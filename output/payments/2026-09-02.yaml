- headline: 'Global banks commit to joint stablecoin venture with euro token first

    '
  standfirst: 'A consortium of international banks is planning a shared stablecoin
    platform, prioritising a euro-denominated token as its first product – a direct
    response to growing private-sector stablecoin issuance led by US firms.

    '
  body: 'A group of global banks has committed to building a joint stablecoin venture,
    with a euro-denominated token as its initial priority. The initiative reflects
    growing concern among established financial institutions that stablecoin infrastructure
    is being shaped primarily by crypto-native firms and US technology companies,
    with Tether and Circle dominating issuance volumes.


    A bank-led euro stablecoin would sit alongside the European Central Bank''s digital
    euro project but serve a different function – targeting wholesale settlement,
    cross-border corporate payments and tokenised asset transactions rather than retail
    point-of-sale use. The consortium''s structure and governance arrangements have
    not yet been fully disclosed.


    The venture arrives as European regulators finalise the Markets in Crypto-Assets
    framework and the digital euro legislation moves through Parliament. Banks backing
    a euro stablecoin are effectively hedging against both outcomes: if the digital
    euro proceeds slowly, they have a private-sector alternative; if MiCA creates
    a permissive stablecoin regime, they are positioned to operate within it rather
    than cede the market to non-bank issuers.

    '
  editorial_note: 'A bank consortium committing to a euro stablecoin represents a
    strategic shift in how incumbent institutions engage with tokenised money – directly
    relevant to digital euro, MiCA and wholesale settlement debates.

    '
  sources: ''
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the subject ('A consortium of international banks')
      which duplicates the headline's reference to 'Global banks'. Per rule 1, the
      standfirst should open with the substantive point or action instead — eg, 'A
      shared stablecoin platform is being planned' or 'The move signals…' — to avoid
      redundant repetition.
    - Body text uses 'US' in the phrase 'US technology companies' but the rule states
      to use 'US' not 'United States' — however, the text already complies with this.
      No breach here.
    - Abbreviation 'MiCA' is used in the body without being spelled out on first use.
      Per the rules, non-standard abbreviations must be spelled out in full followed
      by the abbreviation in parentheses on first use — should be 'Markets in Crypto-Assets
      (MiCA)' when first introduced in body text (it appears in standfirst but standfirst
      abbreviations do not cover body first use per rule on abbreviations).
    - The phrase 'Banks backing a euro stablecoin are effectively hedging against
      both outcomes' uses hedging language that delays the substantive point. Per
      rule on hedging scene-setters, the sentence should lead directly with the substantive
      claim rather than framing it as hedging behaviour.
