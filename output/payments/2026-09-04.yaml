- headline: Revolut wins conditional US bank charter with product restrictions attached
  standfirst: The OCC has granted preliminary approval to establish Revolut Bank US
    in Stamford, Connecticut – but four product lines require separate regulatory
    sign-off before launch, an unusual condition not applied to other charters this
    year.
  body: 'The Office of the Comptroller of the Currency granted conditional approval
    on September 3 for Revolut to establish a US national bank, the first European
    neobank of its scale to reach this stage of the US chartering process. The proposed
    bank, Revolut Bank US, N.A., would be headquartered in Stamford, Connecticut,
    with roughly $95 million in capital and no physical branches. The product roadmap
    includes checking accounts, installment loans, credit cards, foreign exchange
    and a stablecoin – though the OCC held back four of those product lines behind
    separate supervisory approvals, a condition that advisory firm FS Vector says
    it has not seen applied to other recent charter approvals.


    Revolut still needs FDIC deposit insurance and Federal Reserve clearance, plus
    final OCC authorisation, before the bank can open. It is targeting a 2027 launch.
    Revolut currently serves around one million US customers through partner banks
    including Lead Bank and Cross River Bank; a charter would allow it to bring those
    relationships in-house.


    The approval fits a broader pattern of European fintechs seeking direct US banking
    access – Itau received its own preliminary national bank approval from the OCC
    in August. For Revolut, which has collected bank licences in France, Australia
    and the UK during 2026, the US charter would close the most significant gap in
    its global regulatory footprint.'
  editorial_note: 'Story selected as a significant development for European payments
    audience: Revolut is Europe''s largest neobank and this is the first conditional
    US charter approval for a fintech of its scale. The American Banker source adds
    the material detail that four product lines were gated behind separate sign-offs
    – described as unprecedented among this year''s OCC approvals. Not previously
    covered in the briefing.'
  sources: '[Revolut wins US charter with limits on four products](https://www.americanbanker.com/news/revolut-wins-us-charter-with-limits-on-four-products)
    — American Banker'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming ''The OCC'' which is also the subject of the headline''s
      implicit action. Rule 1 requires opening with the substantive point (the conditional
      approval and product restrictions) rather than naming the regulator. Revise
      to: ''Conditional approval to establish Revolut Bank US in Stamford, Connecticut
      has been granted – but four product lines require separate regulatory sign-off
      before launch, an unusual condition not applied to other charters this year.'''
    - Body text uses 'OCC' on first mention without spelling out in full. Rule on
      abbreviations requires 'Office of the Comptroller of the Currency (OCC)' on
      first use in the body, then 'OCC' subsequently.
    - 'Paragraph beginning ''The approval fits a broader pattern...'' uses the hedging
      construction ''fits a broader pattern'' which weakens the substantive claim.
      State the trend directly: ''European fintechs are seeking direct US banking
      access – Itau received its own preliminary national bank approval from the OCC
      in August, and Revolut''s approval...'''
    - The phrase 'close the most significant gap in its global regulatory footprint'
      is vague and announces significance without stating the substantive point directly.
      Revise to explain concretely what the gap was and why closing it matters operationally,
      rather than flagging its significance.
