stories:
- headline: BNP Paribas and HSBC complete first corporate payment on Swift's shared
    ledger
  standfirst: Swift's blockchain-based multi-bank ledger moves from prototype to production,
    with the first corporate treasury use case executed on live rails for Siemens.
  body: 'BNP Paribas and HSBC have completed the first corporate treasury payment
    on Swift''s shared ledger, executing a transaction on behalf of Siemens. The milestone
    moves the ledger – which Swift has been developing as a shared settlement layer
    across its member banks – from the pilot phase announced on July 9 into a live
    production environment.


    Swift had previously outlined plans for banks to begin piloting live transactions
    on the ledger, and several major institutions had signed up to test the infrastructure.
    The BNP Paribas-HSBC transaction is the first to involve a corporate end-user,
    with Siemens acting as the counterparty. The involvement of a major industrial
    treasury – and one whose treasury chief has been vocal about the need for better
    corporate payment infrastructure – gives the initiative a practical anchor beyond
    interbank experimentation.


    The ledger represents Swift''s effort to retain relevance as tokenised settlement
    platforms and stablecoin-based alternatives multiply. Whether the shared ledger
    can attract sufficient bank participation to become a genuine multi-bank utility
    – rather than a bilateral proof of concept – remains the central question.'
  editorial_note: This advances the Swift shared ledger story from pilot commitments
    (covered July 9) to first live corporate transaction, a material new stage involving
    named counterparties.
  sources: '[BNP Paribas and HSBC complete first corporate treasury transaction on
    Swift''s blockchain ledger](https://www.finextra.com/newsarticle/48347/bnp-paribas-and-hsbc-complete-first-corporate-treasury-transaction-on-swifts-blockchain-ledger?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
