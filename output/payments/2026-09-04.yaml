      avoid redundant repetition.
    - Body contains 'For European payments professionals, the ledger represents Swift's
      effort...' which frames a paragraph around its relevance to European readers
      with an audience-address clause. Per the house style rules, state the European
      dimension directly as part of the narrative without prefacing it with 'For European
      payments professionals'.
    - 'Body references ''the pilot phase announced in July'' which is a vague temporal
      reference. The editorial note specifies ''July 9'', so the body should use the
      precise date: ''announced on July 9''.'
