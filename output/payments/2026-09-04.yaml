- headline: 'Brazil and ECB talks on Pix-euro instant payments link gain momentum

    '
  standfirst: 'Technical teams from Brazil''s central bank and the ECB are exploring
    whether Pix could interconnect with European instant payment infrastructure, in
    what would be the first cross-border extension for either system.

    '
  body: 'Reuters reports that technical teams from Brazil''s central bank and the
    European Central Bank are actively studying how to link Pix, Brazil''s domestic
    instant payment system, with euro area instant payment infrastructure. The discussions
    are at an exploratory stage, with no confirmed timeline or architecture, but represent
    the first serious effort to connect either system to a counterpart outside its
    home jurisdiction.


    Pix processes over four billion transactions a month domestically and has become
    a model for real-time payment adoption. A successful link to European rails would
    create a high-volume corridor for remittances and trade payments between the two
    regions. The ECB''s involvement is notable given its broader push on cross-currency
    instant payments – it launched a pilot connecting euro, Danish krone and Swedish
    krona settlement via TIPS in June.


    Any link would need to resolve substantial technical and regulatory questions,
    including settlement finality across time zones, anti-money laundering obligations
    and currency conversion. But the discussions signal that both central banks see
    bilateral instant payment interoperability as a viable alternative to correspondent
    banking for high-volume corridors.

    '
  editorial_note: 'Previously covered on September 4, but today''s Reuters source
    (ID 38) provides the primary reporting. The story warrants inclusion because the
    Pix-TIPS link would be a first-of-kind cross-border instant payments connection
    with direct European relevance.

    '
  sources: '[Brazil, ECB studying instant payments link in potential first cross-border
    move for Pix, sources say](https://www.reuters.com/world/americas/brazil-ecb-studying-instant-payments-link-potential-first-cross-border-move-pix-2026-09-03/)
    — Reuters | [Brazil, ECB studying instant payments link in potential first cross-border
    move for Pix, sources say](https://www.thestar.com.my/tech/tech-news/2026/09/04/brazil-ecb-studying-instant-payments-link-in-potential-first-cross-border-move-for-pix-sources-say)
    — Thestar | [Brazil, ECB Studying Instant Payments Link in Potential First Cross-Border
    Move for Pix, Sources Say](https://ground.news/article/bc-negotiates-to-link-pix-to-the-european-payment-system-02-09-2026)
    — Ground | [Brazil''s Pix Could Link Up With The ECB''s Instant Payments](https://finimize.com/content/brazils-pix-could-link-up-with-the-ecbs-instant-payments)
    — Finimize'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'Brazil's central bank and the ECB' which duplicates
      the headline's identification of these organisations. Per rule [1], the standfirst
      should open with the substantive point (eg, 'Technical teams are exploring whether...')
      rather than naming the organisations again.
    - Body text contains 'The ECB's involvement is notable given its broader push
      on cross-currency instant payments' which explicitly flags significance before
      making the substantive point. Per rule [11], remove the notability announcement
      and state the substantive claim directly — eg, 'The ECB has been pushing on
      cross-currency instant payments, having launched a pilot...'
    - Body text uses 'four billion' instead of the correct numerical format. Per rule
      [6], numbers ten and above should use digits; this should read 'over 4 billion
      transactions'.
