- headline: Revolut wins conditional US bank charter after OCC rejects Wise and Bunq
  standfirst: Conditional approval from the OCC clears the hardest regulatory hurdle
    for Revolut's planned 2027 US bank launch – a path that two other European fintechs
    failed to secure this year.
  body: 'The US Office of the Comptroller of the Currency granted Revolut preliminary
    conditional approval on September 2 to establish Revolut Bank US, National Association,
    a branchless digital bank headquartered in Stamford, Connecticut. CEO Nik Storonsky
    described it as a first step toward bringing the company''s full product range
    to the US market. The proposed bank would offer deposits, personal loans, credit
    cards and stablecoin-based remittances, with an initial capital contribution of
    roughly $95 million. Revolut must still secure deposit insurance from the Federal
    Deposit Insurance Corporation, approval from the Federal Reserve and a final sign-off
    from the OCC before the bank can open. The company is targeting the first half
    of 2027.


    The approval arrives after the OCC denied charter applications from both Wise
    in July and Bunq in August, raising questions about the agency''s appetite for
    foreign fintech applicants. Revolut''s review took 176 days from its March filing
    – longer than the OCC''s 120-day target and slower than the 121-day review for
    Brazil''s Nubank. The conditional approval excludes retail foreign exchange, merchant
    acquiring and correspondent banking for foreign banks, each of which requires
    a separate supervisory non-objection – an unusual restriction that distinguishes
    this charter from others issued this year.


    Revolut serves more than 80 million customers globally and has accumulated banking
    licences in the UK, France, Australia and Mexico. A federal US charter would replace
    the company''s current reliance on partner banks for deposits and payment processing,
    giving it direct access to Fedwire and ACH. With Wise forced to refile and Bunq
    turned away, Revolut is now the European fintech closest to operating as a fully
    licensed US bank.'
  editorial_note: 'This story is from September 3 (OCC decision dated September 2)
    and has not been previously covered. It is a genuinely significant regulatory
    milestone for Europe''s largest neobank by customer count, with broader implications
    for European fintech expansion into the US. The contrast with Wise''s and Bunq''s
    rejected applications provides useful context on the OCC''s evolving posture toward
    foreign fintechs. The Fintech Futures article is cited as the primary source,
    supplemented by detail from the OCC''s published Corporate Decision #1390 and
    TechTimes analysis.'
  sources: '[Revolut wins conditional approval for US bank charter](https://www.fintechfutures.com/regulatory-actions/revolut-wins-conditional-approval-for-us-bank-charter)
    — Fintech Futures'
