- headline: Pay.UK warns AI-driven fraud is the fastest-moving threat to UK payments
  standfirst: David Crawford, Pay.UK's chief strategy and transformation officer,
    frames AI-generated fraud as outpacing current defences and links it to the proposed
    merger of the PSR into the FCA.
  body: 'David Crawford, Pay.UK''s chief strategy and transformation officer, has
    identified AI-driven fraud as the most rapidly evolving risk facing the UK payments
    system. Crawford said the speed and sophistication of AI-generated scams are advancing
    faster than the industry''s capacity to detect them, creating a widening gap between
    attackers and defenders.


    Crawford placed the fraud challenge alongside broader structural shifts, including
    the proposed merger of the Payment Systems Regulator into the Financial Conduct
    Authority under the Financial Services and Markets Bill. That consolidation –
    still subject to parliamentary scrutiny – would reshape how fraud policy and payments
    oversight interact in the UK.


    The warning reinforces a pattern visible across European payments: as instant
    payment volumes grow and new rails such as open banking expand the attack surface,
    the fraud tooling question becomes increasingly urgent. UK fraud losses rose to
    £1.3 billion in the most recent reporting period, with authorised push payment
    scams rebounding sharply after mandatory reimbursement rules took effect.'
  editorial_note: A named payments infrastructure figure connecting AI fraud risk
    to live regulatory reform gives this weight beyond a generic fraud warning. Relevant
    to the ongoing UK regulatory restructuring debate.
  sources: '[Pay.UK''s David Crawford: AI fraud Is The Fastest-Moving Shift](https://thefintechtimes.com/pay-uks-david-crawford-ai-fraud-is-the-fastest-moving-shift/)
    — The Fintech Times'
