- headline: Wero goes live in Luxembourg with first in-store payments capability
  standfirst: The launch makes Luxembourg EPI's fifth market and – through the Payconiq
    migration – the first where Wero supports point-of-sale acceptance, a milestone
    in the scheme's progression beyond peer-to-peer and e-commerce.
  body: 'The European Payments Initiative (EPI) held a press conference in Luxembourg
    on September 2 to mark the start of the Payconiq-to-Wero migration. Throughout
    September, Wero is becoming progressively available to Luxembourg consumers and
    merchants as the country''s five participating banks – BGL BNP Paribas, Banque
    Internationale a Luxembourg, Raiffeisen, Spuerkeess and Post Luxembourg – move
    through the different phases of the transition. Payconiq''s platform will shut
    permanently on September 30, giving users and merchants a single month to switch.


    The migration matters beyond Luxembourg''s 300,000 Payconiq users because it introduces
    a capability Wero has lacked elsewhere: in-store payments. In Germany, France
    and Belgium, Wero has operated as a peer-to-peer and e-commerce tool. By absorbing
    Payconiq''s established QR-code merchant network, Luxembourg becomes the first
    market where Wero functions at the physical point of sale. Existing Payconiq QR
    codes on invoices and in shops will remain scannable via the Wero app until the
    end of 2026, with merchants required to replace them with Wero-branded codes by
    the end of September.


    Hakan Sekulu, chief executive of Worldline in Luxembourg, said success depends
    on strong customer adoption, easy integration and frictionless checkout. The compressed
    timetable – one month of parallel running before Payconiq closes – will test whether
    EPI''s approach of coordinated, market-wide switchovers can deliver a smoother
    transition than the gradual rollouts seen in its other markets.'
  editorial_note: This is a genuinely new development beyond the August 26 story ('Payconiq
    to Wero migration gets firm dates in Luxembourg'), which covered the announced
    timeline. The September 2 press conference marks the actual go-live, with EPI
    confirming that Luxembourg is the first market where Wero supports in-store POS
    payments via the Payconiq QR network migration. Source is chronicle.lu's report
    from the EPI press event.
  sources: '[Payconiq Payment System Officially Transitions to Wero Platform in Luxembourg](https://www.chronicle.lu/category/banking/63148-payconiq-payment-system-officially-transitions-to-wero-platform-in-luxembourg)
    — Chronicle.lu'
