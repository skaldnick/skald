title: 'Swift ledger goes live; Pay.UK on AI fraud; ECB-Pix link advances

  '
social_post: 'BNP Paribas and HSBC run the first corporate treasury transaction on
  Swift''s shared ledger. Plus: Pay.UK''s fraud chief on AI-driven scams and the ECB-Pix
  interlinking story moves forward. {link}

  '
stories:
- headline: BNP Paribas and HSBC complete first corporate payment on Swift's shared
    ledger
  standfirst: The shift from pilot to production use of Swift's distributed ledger
    – marked by a Siemens treasury transaction – is a milestone for banks exploring
    tokenised settlement infrastructure.
  body: 'BNP Paribas and HSBC have executed the first corporate treasury payment on
    Swift''s blockchain-based shared ledger, processing a transaction for Siemens.
    The move takes the ledger – first announced in September 2025 and opened to live
    bank pilots in July – from controlled testing into live corporate use.


    Swift had previously confirmed that banks would begin piloting live transactions
    on the platform, but the involvement of a major corporate treasury operation gives
    the initiative a practical reference point. Siemens treasury chief Joerg Bermuller
    has been among the most vocal corporate advocates for open banking standards in
    payments infrastructure, and the company''s participation signals genuine demand
    from the buy side.


    The transaction demonstrates that Swift''s approach – layering distributed ledger
    technology onto existing correspondent banking relationships – can handle real
    corporate flows. The gap between prototype and production has narrowed, though
    whether this model scales to high-volume treasury operations remains an open question.'
  editorial_note: 'Follows up on the July 9 story about banks piloting live transactions
    on Swift''s shared ledger, with a material new development: the first completed
    corporate treasury payment involving named counterparties.'
  sources: '[BNP Paribas and HSBC complete first corporate treasury transaction on
    Swift''s blockchain ledger](https://www.finextra.com/newsarticle/48347/bnp-paribas-and-hsbc-complete-first-corporate-treasury-transaction-on-swifts-blockchain-ledger?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
