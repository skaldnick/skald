- headline: PayTabs agrees $100m deal to acquire Amazon's MENA payments operations
  standfirst: The acquisition gives PayTabs Amazon's regional payment infrastructure
    and merchant relationships, reshaping the competitive landscape for digital payments
    across the Middle East.
  body: 'Amazon has agreed to transfer its Middle East and North Africa payments operations
    to Saudi Arabia-based PayTabs in a deal worth $100 million. The transaction hands
    PayTabs the technology stack and merchant relationships that Amazon built to support
    its e-commerce platform across the region.


    PayTabs, which provides payment processing and gateway services to merchants across
    MENA, gains a significant boost in scale and credibility. Amazon''s payments operation
    in the region – built initially to serve its own marketplace after acquiring Souq.com
    – includes local acquiring capabilities and integrations with regional payment
    methods that would have taken years to replicate organically.


    The deal signals that the region''s payment infrastructure is consolidating around
    local and regional players rather than global platforms. Amazon''s decision to
    exit the payments side of its MENA business mirrors a broader pattern of global
    technology companies selectively retreating from payment operations in markets
    where local regulatory and commercial dynamics favour domestic specialists.'
  editorial_note: ''
  sources: '[PayTabs to acquire Amazon Payments Mena operations](https://www.finextra.com/newsarticle/48356/paytabs-to-acquire-amazon-payments-mena-operations?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
