- headline: Pay.UK warns AI-driven fraud is the fastest-moving threat to UK payments
  standfirst: Artificial intelligence has been identified as the most rapidly evolving
    fraud vector facing UK payments, with implications for how banks and fintechs
    design real-time defences.
  body: 'Pay.UK has flagged AI-driven fraud as the most urgent and fastest-moving
    threat facing the UK payments system. The warning comes as total fraud losses
    reached £1.3 billion in the latest full-year figures, with authorised push payment
    scam losses accounting for £576.4 million, and as the Payment Systems Regulator''s
    (PSR) mandatory reimbursement regime puts increasing financial pressure on sending
    banks.


    The concern centres on AI''s capacity to generate convincing social engineering
    attacks at scale – deepfake voice and video, personalised phishing and real-time
    manipulation of victims during payment journeys. Pay.UK''s assessment is that
    the sophistication of these attacks is outpacing the industry''s ability to deploy
    countermeasures, particularly where detection relies on static rules rather than
    adaptive models.


    The warning reinforces the case being made by several UK banks and regulators
    that fraud prevention must shift from transaction-level screening to system-wide
    intelligence sharing. It also adds urgency to the ongoing Treasury consultation
    on modernising payments regulation, which includes proposals to expand Pay.UK''s
    role and mandate.'
  editorial_note: 'Pay.UK''s assessment carries weight as the operator of Faster Payments
    and Bacs. The AI fraud warning connects directly to several live policy threads
    – the Treasury''s payments modernisation consultation, the PSR''s reimbursement
    regime, and the Financial Conduct Authority''s AI review – making it relevant
    to a broad professional audience. Note: the cited source does not support this
    story (it covers an unrelated ECB-Brazil payments system link). The correct source
    for Pay.UK''s AI fraud warning must be identified before publication.'
  sources: '[ECB explores link between Tips and Brazil''s Pix](https://www.finextra.com/newsarticle/48350/ecb-explores-link-between-tips-and-brazils-pix?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
