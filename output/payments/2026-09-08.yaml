      or duplicate source_id
    - Article states APP losses 'rebounded to £1.3 billion' but UK Finance 2026 report
      (June 2026) shows APP fraud losses at £576.4 million; £1.3 billion refers to
      total payment fraud losses, not APP specifically
    - Article describes Pay.UK as operator of 'the incoming UK Payments Initiative'
      but UKPI is an independent, industry-owned scheme formed by Token.io and other
