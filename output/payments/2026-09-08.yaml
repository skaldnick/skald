title: 'Swiss stablecoin expands; FCA mortgage sprint; CPMI cyber toolkit

  '
social_post: 'SIX and Twint join Switzerland''s bank-backed stablecoin project, the
  FCA explores open finance for mortgages, and global standard-setters publish new
  cyber resilience guidance for payment infrastructures. Today''s briefing: {link}

  '
stories:
- headline: SIX and Twint join Swiss franc stablecoin project backed by major banks
  standfirst: The addition of Switzerland's core exchange infrastructure and dominant
    mobile payment platform broadens a bank-led stablecoin initiative that could shape
    how tokenised money develops in a major European financial centre.
  body: 'SIX, the operator of Switzerland''s financial market infrastructure, and
    Twint, the country''s most widely used mobile payment service, are joining a Swiss
    franc stablecoin project promoted by several of the country''s largest banks.
    The addition of both the exchange infrastructure and the consumer-facing payment
    network significantly extends the initiative''s potential reach.


    Switzerland has moved faster than most European jurisdictions on tokenised assets,
    with SIX Digital Exchange already operating a regulated platform for digital securities.
    Adding a CHF stablecoin with broad institutional backing would create a domestic
    settlement asset that sits alongside the digital euro initiatives taking shape
    in the eurozone. Twint''s involvement suggests the consortium sees a retail dimension,
    not just wholesale settlement.


    A global consortium of 21 banks spanning North America, Europe, East Asia, the
    Middle East and Africa separately committed last week to a joint stablecoin venture
    with a euro token as an early priority. Switzerland''s initiative is distinct
    but parallel, reflecting a broader trend in which incumbent financial institutions
    are moving to occupy tokenised money territory before stablecoin-native firms
    establish dominance.'
  editorial_note: The entry of SIX and Twint materially expands a Swiss bank stablecoin
    effort that now spans infrastructure, retail payments and major domestic lenders,
    relevant as tokenised money initiatives accelerate globally.
  sources: '[SIX and Twint join Swiss bank stablecoin project](https://www.finextra.com/newsarticle/48360/six-and-twint-join-swiss-bank-stablecoin-project?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'Switzerland's dominant exchange and mobile payment platform
      are joining' — this repeats the substantive action from the headline ('SIX and
      Twint join') rather than opening with a distinct interpretive point or context.
      Per rule on standfirst function, the standfirst should add context, interpretation,
      or summary distinct from the headline's core claim.
    - Body paragraph 3 states 'The project arrives as European banks are separately
      committing to a joint stablecoin venture' — this uses 'The project arrives as'
      which is a weak temporal connector. The sentence should lead directly with the
      substantive point about European banks' parallel commitment rather than framing
      it as a temporal coincidence.
    - Standfirst names 'six banks' without naming them specifically, then body text
      also references 'six of the country's largest banks' without naming them. Per
      rule on specificity, if the banks are material to the story, they should be
      named. If they cannot be named, the phrasing should avoid a specific count ('such
      as six major banks') rather than stating 'six' precisely.
    - Editorial note refers to 'six major banks' but the headline and body text say
      'six of the country's largest banks' — this is a minor inconsistency in phrasing,
      though not a house style violation per se.
    - Standfirst contains vague phrasing 'could shape how tokenised money develops'
      — this is somewhat weaker than the body's more direct claim about what the initiative
      represents. However, the standfirst does name the specific stakes (tokenised
      money development in Switzerland as a major European financial centre), so this
      passes the rule on naming specific stakes.
