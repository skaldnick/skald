- headline: Pay.UK warns AI-driven fraud is the fastest-moving threat to UK payments
  standfirst: AI-enabled scams are advancing faster than the rule-based defences most
    UK banks rely on, sharpening the case for coordinated industry investment in real-time,
    AI-powered detection.
  body: 'Pay.UK has identified AI-driven fraud as the most rapidly evolving threat
    to the UK payments system, signalling that the sophistication and speed of AI-enabled
    attacks are outpacing the detection capabilities currently deployed across the
    sector.


    The warning arrives against a backdrop of rising UK fraud losses. Total payment
    fraud losses reached £1.3 billion in figures published in June, with authorised
    push payment scams accounting for £576.4 million of that total. The Payment Systems
    Regulator''s mandatory reimbursement regime has shifted the financial burden squarely
    onto sending banks. AI is accelerating that problem: deepfake voice and video
    scams, AI-generated phishing and automated social engineering are all becoming
    harder to intercept with rule-based monitoring systems.


    Pay.UK''s position as operator of Faster Payments gives its assessment particular
    weight. The organisation''s framing of AI fraud as a systemic rather than institution-level
    risk adds pressure on banks and payment service providers to invest in real-time,
    AI-powered defences – and exposes gaps in regulatory frameworks that were designed
    around older, slower forms of financial crime.'
  editorial_note: Pay.UK's explicit identification of AI fraud as the fastest-moving
    systemic threat to UK payments is new and carries weight given the operator's
    central role. Relevant to ongoing debates about fraud liability, reimbursement
    costs and defensive AI investment.
  sources: '[ECB and Brazil explore cross-border link between TIPS and Pix](https://paymentsindustryintelligence.com/ecb-and-brazil-explore-cross-border-link-between-tips-and-pix/)
    — Paymentsindustryintelligence'
  verification:
