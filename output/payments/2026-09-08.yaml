- headline: FCA explores open finance for mortgage affordability in policy sprint
  standfirst: A policy sprint examined what conditions would need to hold for open
    finance data to improve mortgage journeys, moving the regulator's earlier signals
    into practical territory.
  body: 'The Financial Conduct Authority has published findings from a policy sprint
    examining how open finance could reshape mortgage affordability assessments. The
    exercise explored what would need to be true for transaction-level banking data,
    shared with borrower consent, to replace or supplement the manual income and expenditure
    checks that currently slow mortgage applications.


    The FCA signalled in June that open banking data would reshape mortgage affordability
    checks. This sprint moves beyond that signal into specifics, bringing together
    lenders, brokers, technology providers and consumer groups to stress-test the
    practical barriers: data standardisation, liability frameworks, and the risk of
    excluding borrowers whose financial lives do not fit neatly into algorithmic assessment.


    Open finance in mortgages has long been cited as a high-value use case. The FCA''s
    willingness to convene structured policy work around it, rather than leaving it
    to market experimentation, suggests the regulator sees it as close enough to viability
    to warrant active shaping. For lenders, the question is whether the resulting
    framework will be permissive enough to justify investment in integration.'
  editorial_note: Advances the FCA's June signal on open banking in mortgages into
    a concrete policy sprint with published findings, relevant to lenders and open
    finance providers tracking regulatory direction.
  sources: '[Nearly 881000 borrowers secured mortgage deals early in H1, FCA finds](https://theintermediary.co.uk/2026/09/nearly-881000-borrowers-secured-mortgage-deals-early-in-h1-fca-finds/)
    — The Intermediary | [Open finance meets mortgages: the FCA sets out its vision
    – but the hard work starts now](https://www.tlt.com/insights-and-events/insight/open-finance-meets-mortgages-the-fca-sets-out-its-vision---but-the-hard-work-starts-now)
    — Tlt'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'FCA' which is also the organisation named in the
      headline. Per rule [1], the standfirst should begin with the substantive point
      (eg, 'The sprint examined…') rather than naming the FCA. Revise to avoid redundant
      repetition of the subject across headline and standfirst.
    - Standfirst uses 'FCA' without spelling it out. Per rule [22], common and recognisable
      abbreviations may be used on first mention in the standfirst without spelling
      them out, so this is acceptable. However, the opening breach of rule [1] remains.
    - Body text uses 'The FCA signalled in June' with vague temporal reference. Per
      rule [25], avoid vague temporal references such as 'in June' when a specific
      date is available. The standfirst mentions 'June' specifically, but the body
      should use a precise date (eg, 'on June 15') or qualify it more clearly if the
      exact date cannot be established.
  verification:
