- headline: Global standard-setters publish cyber resilience toolkit for payment infrastructures
  standfirst: A new toolkit and discussion paper address third-party concentration
    risk and operational resilience at financial market infrastructures, with direct
    implications for payment system operators.
  body: 'The Committee on Payments and Market Infrastructures (CPMI) and the International
    Organization of Securities Commissions (IOSCO) have published a cyber resilience
    toolkit for financial market infrastructures, accompanied by a discussion paper
    on the risks of third-party service provider reliance. The publications give payment
    system operators and central counterparties a structured framework for assessing
    and managing cyber threats.


    The toolkit addresses a gap that has widened as critical payment infrastructure
    increasingly depends on a concentrated set of cloud providers and technology vendors.
    The accompanying discussion paper on third-party concentration risk reflects concerns
    that have been raised by the Bank of England, ECB and other central banks over
    the past two years but have lacked a coordinated international treatment.


    The guidance arrives as the instant payments regulation drives more transaction
    volume onto always-on rails, raising the stakes of any outage or compromise. It
    also aligns with the EU''s Digital Operational Resilience Act, which took effect
    in January 2025, providing an international reference point that may influence
    how national supervisors assess compliance.'
  editorial_note: Commissioned because CPMI-IOSCO guidance on cyber resilience and
    third-party concentration risk is directly relevant to the European payments audience
    given rising instant payment volumes and regulatory expectations under DORA.
  sources: '[Global standard-setting bodies publish toolkit for cyber resilience at
    FMIs](https://www.finextra.com/pressarticle/110829/global-standard-setting-bodies-publish-toolkit-for-cyber-resilience-at-fmis?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming CPMI and IOSCO, which are the organisations identified
      in the headline. Per rule [1], the standfirst should begin with the substantive
      point or action instead — e.g., 'A new toolkit addresses…' rather than opening
      with the organisation names.
    - 'Body paragraph three begins: ''For European payment operators, the guidance
      arrives as…'' This frames the European dimension by opening with an audience-address
      clause (''For European payment operators''). Per rule [22], the European dimension
      should be stated directly as part of the narrative without prefacing it with
      an audience-address construction.'
    - Body paragraph two states 'a small number of cloud providers and technology
      vendors' without specifying how many, yet the phrasing 'a small number of' implies
      a precise but unspecified count. This risks vagueness; if examples are to follow,
      use 'such as' or 'including' rather than asserting 'a small number' without
      definition.
    - 'The editorial note reads: ''International standard-setting guidance on cyber
      resilience at payment infrastructures is directly relevant as European instant
      payment volumes grow…'' Per rule [17], do not include editorial notes about
      the story''s relevance or reasoning in the editorial note field itself if it
      duplicates the standfirst''s role. The editorial note should explain the commissioning
      rationale, not restate the story''s newsworthiness.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Standfirst rewritten to open with 'A new toolkit and discussion paper' rather
      than naming CPMI and IOSCO, avoiding redundant repetition of the headline's
      subject per rule [1].
    - Body paragraph three rewritten to remove the audience-address clause 'For European
      payment operators' per rule [22]; the European dimension is now stated directly
      in the narrative.
    - Replaced 'a small number of cloud providers and technology vendors' with 'a
      concentrated set of cloud providers and technology vendors' to avoid implying
      a precise but unspecified count.
    - Editorial note rewritten to state the commissioning rationale rather than restating
      the story's newsworthiness.
- headline: Ukraine builds instant payments and digital identity infrastructure amid
    conflict
  standfirst: The country has launched instant payments and aligned its digital identity
    framework with the EU's eIDAS standards, positioning its financial infrastructure
    for eventual European integration.
  body: 'Kyiv has moved to close the gap between its financial infrastructure and
    European standards, deploying a domestic instant payments capability and bringing
    its digital identity systems into line with the EU''s eIDAS framework. The effort
    has accelerated since Ukraine''s EU candidate status was confirmed, with both
    workstreams forming part of a broader convergence programme.


    The instant payments rollout gives Ukraine a domestic capability that mirrors
    what SEPA instant provides across the eurozone, though interoperability with European
    systems remains a future step. The eIDAS alignment is arguably more immediately
    consequential: it creates a pathway for Ukrainian digital identities to be recognised
    across EU member states, with implications for cross-border account opening, KYC
    and payment authentication.


    Ukraine represents both a future market and a test case for how quickly a non-EU
    country can converge on European payment and identity standards under political
    pressure. The infrastructure work being done now will shape the terms on which
    Ukrainian banks and fintechs eventually connect to European payment networks.'
  editorial_note: ''
  sources: '[Ukraine: Building the Future of Finance During a War](https://thefintechtimes.com/ukraine-building-the-future-of-finance-during-a-war/)
    — The Fintech Times'
  style_check:
    compliant: false
    warnings:
    - 'Body opening: ''Ukraine has deployed instant payments infrastructure and aligned
      its digital identity systems with the EU''s eIDAS framework'' — this near-verbatim
      repeats the standfirst''s phrasing. While the body must be self-contained, avoid
      this level of identical repetition. Revise to vary the wording meaningfully
      while retaining the substantive point.'
    - Paragraph 3 opens with 'For European payments firms, Ukraine represents…' —
      this violates the rule against framing a paragraph's relevance to European readers
      by opening with an audience-address clause. State the European dimension directly
      as part of the narrative without prefacing it with 'For European payments professionals'
      or equivalent constructions.
    - Editorial note included — editorial notes about missing information or contextual
      framing should not be included in the submitted copy. This note should be removed
      or the relevant substantive point integrated into the body if it strengthens
      the story.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Rewrote the body's opening sentence to vary wording from the standfirst while
      retaining the substantive point, leading with 'Kyiv has moved to close the gap'
      rather than near-verbatim repetition.
    - Removed the audience-address clause 'For European payments firms' from the opening
      of paragraph 3, stating the point directly.
    - Removed the editorial note as instructed.
