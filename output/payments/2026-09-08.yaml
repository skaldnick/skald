- headline: Revolut secures conditional US bank charter from OCC
  standfirst: Conditional approval to form a national bank clears the hardest regulatory
    hurdle for Europe's most valuable fintech, setting up a direct presence in the
    world's largest financial market by 2027.
  body: 'The US Office of the Comptroller of the Currency granted Revolut preliminary
    conditional approval on September 2 to organise as a branchless digital bank headquartered
    in Stamford, Connecticut, under the name Revolut Bank US, National Association.
    The charter, published as Corporate Decision #1390, would allow Revolut to hold
    federally insured deposits, issue credit cards and personal loans, and access
    Federal Reserve payment systems directly – ending its reliance on partner banks
    for US operations.


    Revolut filed its charter application in March, led by US CEO Cetin Duransoy,
    a former Capital One and Raisin US executive appointed when the application was
    submitted. The OCC''s conditional approval letter requires an initial capital
    contribution of at least $95 million. Revolut, which serves more than 80 million
    customers globally and is valued at $75 billion, has said it expects to launch
    the US bank in the first half of 2027.


    Conditional approval is not a final green light. Revolut must still obtain deposit
    insurance from the Federal Deposit Insurance Corporation and approval from the
    Federal Reserve before the bank can open. Clearing the OCC stage is widely regarded
    as the most demanding part of the process – and comes after Wise, another London-based
    fintech, had its own US trust charter application rejected by the OCC earlier
    this year on anti-money-laundering grounds.'
  editorial_note: Story selected because Revolut's US bank charter is a material development
    for Europe's largest neobank and has direct competitive implications for the European
    payments sector. It has not been previously covered and the September 3 news is
    recent enough to qualify. The Wise OCC rejection (previously covered July 28)
    provides useful context. Primary source is the FinTech Futures report from September
    4, supplemented by Bloomberg and Crowdfund Insider reporting.
  sources: '[Revolut wins conditional approval for US bank charter](https://www.fintechfutures.com/regulatory-actions/revolut-wins-conditional-approval-for-us-bank-charter)
    — FinTech Futures'
