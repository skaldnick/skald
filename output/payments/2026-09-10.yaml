title: 'EPC delays address migration; Mastercard launches Wallet Pay; World Bank targets
  emerging market payments

  '
social_post: 'EPC pushes back the structured address deadline, Mastercard bundles
  wallet interoperability tools, and the World Bank enlists the card networks for
  emerging market risk-sharing. Today''s briefing: {link}

  '
stories:
- headline: EPC delays structured address migration deadline for SEPA schemes
  standfirst: The extension gives banks more time to adopt structured address formats
    across all five EPC payment scheme rulebooks, easing pressure on a migration that
    has already tested operational readiness.
  body: 'The European Payments Council (EPC) has decided to delay the planned November
    2026 end date for the unstructured address format under all five of its payment
    scheme rulebooks. The decision follows Swift''s own extension of its structured
    address migration deadline for ISO 20022 messages, announced in August.


    The original November cutoff would have required all SEPA payment messages to
    carry structured address fields, a change that demands updates to payment engines,
    customer databases and onboarding workflows. Many banks and payment service providers
    have been flagging readiness concerns, particularly smaller institutions with
    legacy infrastructure.


    The EPC has not yet confirmed a revised end date. The delay aligns the council''s
    timeline more closely with Swift''s, reducing the risk of mismatched standards
    between domestic euro payments and cross-border messaging. The reprieve does not
    remove the obligation; the direction of travel remains unchanged.'
  editorial_note: ''
  sources: '[EPC delays address format migration timeline](https://www.finextra.com/pressarticle/110873/epc-delays-address-format-migration-timeline?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'EPC' which is also the primary subject of the headline
      — 'The extension gives banks' should open the standfirst instead, per rule on
      avoiding redundant repetition of the subject across headline and standfirst.
    - 'Body paragraph 2: ''Many banks and payment service providers had flagged readiness
      concerns'' — uses ''had flagged'' (simple past) instead of present continuous;
      should use ''have been flagging'' or similar to signal currency for a newly
      announced arrangement, per rule on preferring present continuous tense.'
    - 'Body paragraph 3: ''For compliance and operations teams, the reprieve is welcome
      but does not remove the obligation'' — this frames relevance to European readers
      by opening with an audience-address clause (''For compliance and operations
      teams''), which should be avoided per rule on not framing paragraphs around
      their relevance to readers.'
    - Editorial note should not be included in the copy itself per house style rules
      — editorial notes are metadata, not to be published with the story.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - 'Could not independently verify: Headline and body state ''EPC has decided''
      to delay November 2026 deadline, but official EPC sources as of Sept 3-9, 2026
      indicate the decision was pending a PSMB meeting on Sept 9. No public announcement
      of final EPC decision found. Story may be written prospectively or the decision
      may not yet be publicly confirmed.'
  revision:
    replaced: false
    resolved: true
    summary:
    - Standfirst already opens with 'The extension gives banks' rather than naming
      EPC, so no change was needed — the issue description appears to have been based
