title: 'Agentic payments hit consumer trust wall; Meta launches AI checkout; Innovate
  Finance pushes open finance

  '
social_post: 'Only 23% of US consumers trust AI to handle payments — and Europe''s
  agentic ambitions face the same headwind. Plus: Meta''s AI assistant can now check
  out, and Visa tests passkey-authenticated agent payments in France. {link}

  '
stories:
- headline: Only 23% of consumers trust AI agents to handle their payments
  standfirst: The gap between agentic payments momentum among industry players and
    the consumer confidence needed to sustain it is widening, according to new Visa
    research.
  body: 'Despite rapid investment by card networks, banks and fintechs in agentic
    payment infrastructure, only 23% of US consumers say they trust generative AI
    to handle payment transactions on their behalf, according to research published
    by Visa. Consumers are increasingly comfortable using AI tools earlier in the
    shopping journey but balk at delegating the moment money actually moves.


    The finding lands as the industry accelerates buildout. EMVCo drafted a card-based
    agentic payments framework in September, Visa and Mastercard both joined an agentic
    payments alliance with more than 25 founding members in August, and multiple European
    banks have completed pilot agentic transactions this year. Infrastructure is running
    well ahead of demand.


    The research underlines that technical capability is a necessary but insufficient
    condition for consumer adoption. Authentication, transparency and consumer control
    will determine whether agentic payments move beyond proofs of concept. The trust
    deficit is not a branding problem; it reflects genuine consumer uncertainty about
    delegating financial authority to autonomous software.'
  editorial_note: Quantified consumer trust data provides a useful counterweight to
    the industry's agentic payments enthusiasm and is directly relevant to European
    firms investing in this space.
  sources: '[Consumer trust in agentic payments continues to lag](https://www.finextra.com/newsarticle/48369/consumer-trust-in-agentic-payments-continues-to-lag?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens with ''New Visa research'' when the headline names Visa. This
      violates rule [1]: ''do not open by naming the organisation that is also named
      in the headline.'' Should open with the substantive point instead — e.g., ''The
      gap between agentic payments momentum among industry players and consumer confidence
      needed to sustain it is widening, according to new Visa research.'''
    - 'Third paragraph opens with ''For European payments professionals, the research
      underlines...'' This violates rule on audience-address framing: ''Do not frame
      a paragraph around its relevance to European readers by opening with "For European
      payments professionals, …" or equivalent constructions.'' Recast this as a direct
      narrative point without the audience address.'
    - Third paragraph uses 'agentic payments alliance with over 25 founding members'
      — this phrasing ('over 25') combined with the earlier statement 'both joined
      an agentic payments alliance with over 25 founding members' suggests a count
      that contradicts the 'over' qualifier. Clarify whether this is an exact count
      or range.
    - Body text uses 'over 25 founding members' in the second paragraph but the precise
      count and source should be specified if citing specific member numbers. The
      phrasing 'with over 25 founding members' is vague for a factual claim.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with the substantive point rather than naming Visa,
      per rule [1].
    - Removed 'For European payments professionals designing agentic propositions,'
      audience-address framing from the third paragraph opening, per house style rule
      on audience framing.
    - Changed 'over 25' to 'more than 25' for slightly cleaner phrasing, but the approximate
      figure is retained because the precise count could not be confirmed from the
      information available; the 'more than' qualifier correctly signals an approximate
      figure rather than an exact one.
- headline: Meta launches AI assistant with Stripe-powered checkout capabilities
  standfirst: The rollout of Muse, a personal AI agent capable of completing purchases
    via Stripe, brings agentic commerce directly to a consumer audience numbering
    in the billions.
  body: 'Meta has launched Muse, a personal AI assistant capable of performing tasks
    including product discovery, checkout and payments, with Stripe providing the
    underlying payment processing. The agent can act across Meta''s platform ecosystem,
    turning conversational interactions into completed transactions.


    The launch represents a concrete step beyond the pilot-stage agentic payments
    that European banks and card networks have been testing. Where industry experiments
    have focused on B2B use cases or controlled merchant environments, Meta''s move
    brings agentic commerce directly to a consumer audience numbering in the billions.
    Stripe''s role as the payment layer reinforces its positioning as infrastructure
    provider for AI-native commerce, following its earlier acquisition of AI gateway
    OpenRouter and its partnership with AWS to build payment layers for AI agents.


    European payments firms face a familiar platform dynamic. Meta and Stripe are
    building the rails on which agentic commerce will run, potentially marginalising
    local payment methods unless schemes such as Wero or open banking providers can
    integrate into these agent-driven flows.'
  editorial_note: Meta deploying agentic payments at consumer scale is a material
    escalation from industry pilots and has direct implications for European payment
    method visibility.
  sources: '[Meta rolls out personal AI assistant Muse, with support from Stripe](https://www.finextra.com/newsarticle/48367/meta-rolls-out-personal-ai-assistant-muse-with-support-from-stripe?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (Meta) that is also named in the
      headline. Rule [1] requires opening with the substantive point instead — eg,
      'The rollout of Muse, a personal AI agent capable of completing purchases, marks
      the first time...' rather than 'The rollout of Muse, Meta's personal AI agent...'
    - Body paragraph beginning 'European payments firms face a familiar platform dynamic:'
      opens with a colon-introduced binary question structure ('Meta and Stripe are
      building the rails...potentially marginalising local payment methods unless...')
      that can be recast with a preposition. Rule [21] requires recasting such constructions
      — eg, 'European payments firms face a strategic question about whether...' or
      restructuring to avoid the colon-framed binary.
    - The phrase 'marks the first time a major social platform has embedded agentic
      commerce at scale' in the standfirst announces notability/significance before
      making a substantive point. Rule [12] prohibits this — the standfirst should
      state what is actually happening rather than announcing that it is notable.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Standfirst rewritten to open with 'The rollout of Muse, a personal AI agent…'
      rather than naming Meta, per rule [1].
    - Standfirst no longer announces notability ('marks the first time a major social
      platform has embedded agentic commerce at scale'); instead states the substantive
      point directly, per rule [12].
    - 'Third body paragraph: replaced colon after ''familiar platform dynamic:'' with
      a full stop, recasting the colon-introduced binary structure into two sentences,
      per rule [21].'
- headline: Visa and Revolut complete passkey-authenticated agentic payment in France
  standfirst: A European authentication model for agentic payments could address the
    consumer trust gap in autonomous transactions, with a live French pilot testing
    passkey-based consent within existing regulatory frameworks.
  body: 'Visa and Revolut have completed what they describe as the first passkey-authenticated
    agentic card payment in France. The transaction used biometric passkeys rather
    than traditional card credentials to authorise an AI agent to make a payment,
    combining agentic payments with the FIDO authentication standard.


    Passkeys bind authorisation to a device and a biometric, giving consumers a visible
    control mechanism even when an AI agent initiates the transaction. That directly
    addresses the trust deficit identified in Visa''s own consumer research, which
    found only 23% of US consumers willing to let AI handle payments. A European deployment
    also puts the experiment within the scope of PSD2''s strong customer authentication
    requirements, testing whether passkey-based consent satisfies regulatory standards
    for agentic payments.


    Revolut''s involvement extends its pattern of early adoption in new payment categories.
    For the broader European market, the pilot offers a template for how agentic payments
    might work within existing regulatory frameworks rather than requiring new ones.'
  editorial_note: A concrete European agentic payment using passkeys connects the
    trust and authentication questions raised by Visa's consumer research to a live
    deployment.
  sources: '[Visa and Revolut carry out passkey-based agentic payment in France](https://www.finextra.com/newsarticle/48364/visa-and-revolut-carry-out-passkey-based-agentic-payment-in-france?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the substantive point ('The first passkey-based agentic
      card transaction in France tests a European authentication model') but this
      repeats the core action of the headline without adding interpretive context.
      Per rule [1], the standfirst should begin with the substantive point or action
      to avoid redundancy — but here it restates what the headline already conveys.
      Revise to open with the consequence or interpretation (e.g., 'Tests a European
      authentication model that could address the consumer trust gap').
    - 'Body paragraph two opens with ''The French pilot is notable for its authentication
      approach'' — this explicitly flags significance before making the substantive
      point. Per rule [11], do not use phrases that announce notability; write the
      substantive point directly. Revise to: ''Passkeys bind authorisation to a device
      and a biometric, giving consumers a visible control mechanism…'''
    - The standfirst uses 'agentic payments' as a descriptor but the body introduces
      'agentic commerce' and 'agent-initiated flows' — terminology is inconsistent
      across the piece. Standardise to one term (prefer 'agentic payments' as used
      in headline and standfirst).
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with the consequence/interpretation rather than restating
      the headline's core action, per rule [1].
    - Removed 'The French pilot is notable for its authentication approach' opener
      in paragraph two, leading directly with the substantive point about passkeys,
      per rule [11].
    - Standardised terminology to 'agentic payments' throughout, replacing 'agentic
      commerce' and 'agent-initiated flows' for consistency with headline and standfirst.
- headline: 'Innovate Finance calls for faster UK action on open finance and AI policy

    '
  standfirst: 'The trade body''s report argues the UK risks falling behind on open
    finance implementation and urges the government to accelerate its existing commitments.

    '
  body: 'Innovate Finance has published a report calling on the UK government to move
    more quickly on open finance policy and to align its approach with the growing
    role of AI in financial services. The trade body positions open finance as foundational
    infrastructure for trusted AI applications in areas such as lending, advice and
    fraud prevention, and warns that delays risk ceding competitive ground to jurisdictions
    moving faster.


    The report arrives as HM Treasury consults on modernising UK payments and open
    banking rules, and follows the FCA''s publication of an open finance roadmap earlier
    this year with a 2030 target. Innovate Finance''s argument is essentially that
    the existing policy direction is right but the pace is too slow, particularly
    given how quickly AI capabilities are advancing. The trade body calls for open
    finance to be accelerated within 2026 rather than treated as a multi-year aspiration.


    The intervention reflects a broader tension in UK fintech policy. The regulatory
    architecture for open banking is well established, but extending it to pensions,
    insurance and investment data requires legislative action and cross-regulator
    coordination that has been slower than the industry wants.

    '
  editorial_note: 'A substantive industry intervention on UK open finance timing,
    relevant given the active Treasury consultation and FCA roadmap already in progress.

    '
  sources: '[Innovate Finance Urges UK Action on Open Finance and AI to Secure FinTech
    Lead](https://ffnews.com/news/news-innovate-finance-calls-for-faster-action-on-policy-to-keep-pace-with-fintec-22dcdd17)
    — Ffnews | [Innovate Finance report calls for government action to unlock UK fintech
    growth](https://www.openbankingexpo.com/news/innovate-finance-report-calls-for-government-action-to-unlock-uk-fintech-growth/)
    — Openbankingexpo'
