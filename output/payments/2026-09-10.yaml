    - 'Editorial note: cleared the editorial note field as it is metadata and should
      not be included in published copy.'
- headline: Mastercard launches Wallet Pay to drive mobile wallet interoperability
  standfirst: The aim is to standardise the fragmented mobile wallet experience for
    consumers and merchants, extending Mastercard's reach beyond card-on-file into
    wallet-native commerce.
  body: 'Mastercard has launched Wallet Pay, a portfolio of products designed to support
    the interoperability and reach of mobile wallet payments. The suite addresses
    a persistent friction point: the lack of standardisation across the growing number
    of digital wallets that consumers encounter at checkout, in-app and in-store.


    The launch comes as mobile wallet adoption accelerates across Europe. In the UK,
    wallet registrations reached 65% of adults in 2025. Yet fragmentation between
    wallet providers, varying merchant acceptance and inconsistent user experiences
    have slowed the transition from registration to habitual use. Mastercard''s approach
    bundles tokenisation, acceptance tools and cross-wallet compatibility into a single
    framework.


    The move positions Mastercard to capture wallet-based transaction volume that
    might otherwise flow through account-to-account rails or closed-loop wallet ecosystems
    such as Wero. It also reflects the network''s broader strategy of embedding itself
    into non-card payment flows rather than defending card dominance alone.'
  editorial_note: ''
  sources: '[Mastercard to boost digital wallet uptake with Wallet Pay](https://www.finextra.com/newsarticle/48376/mastercard-to-boost-digital-wallet-uptake-with-wallet-pay?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming Mastercard's product ('A new suite of products')
      when Mastercard is already named in the headline. Per rule [1], the standfirst
      should open with the substantive point or action (e.g., 'This aims to standardise…')
      rather than naming the organisation or its product first.
    - Body text uses 'account-to-account' instead of the preferred abbreviated form
      'A2A'. Per rule [2], non-standard abbreviations should be spelled out, but 'account-to-account'
      is the correct full form here; however, if abbreviating, use the standard form
      consistently.
    - Vague temporal reference 'earlier this year' used in second paragraph. Per rule
      [avoid vague temporal references], use specific time periods (e.g., 'in the
      first quarter of 2025') when referring to business metrics.
    - Editorial note present in submission. Per rule [do not include editorial notes],
      editorial notes should not appear in the copy sent for checking; this should
      be removed before publication.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - UK mobile wallet registration figure of 57% is from 2024, not 'earlier this
      year' (2026). Latest data shows 65% in 2025
  revision:
    replaced: false
    resolved: true
    summary:
    - Updated UK wallet registration figure from 57% to 65% and replaced vague 'earlier
      this year' with 'in 2025' per the corrected data provided in the issue.
    - Revised standfirst to open with 'The aim is to standardise…' rather than naming
      Mastercard's product first, avoiding redundant repetition of the headline subject
      per rule [1].
    - Retained 'account-to-account' in body text as it is the correct full form and
      is used only once, so no abbreviation is needed.
    - Removed editorial note as it should not appear in published copy.
- headline: 'Visa and Mastercard back World Bank risk-sharing for emerging market
    payments

    '
  standfirst: 'Both card networks are supporting a new initiative to help local financial
    institutions in developing economies expand digital payment acceptance by sharing
    the commercial risk.

    '
  body: 'Visa and Mastercard are backing a new World Bank risk-sharing initiative
    designed to help local financial institutions expand digital payments in emerging
    markets. The programme targets economies where limited merchant acceptance and
    high deployment costs have constrained the shift from cash.


    The initiative addresses a structural gap: in many developing markets, the economics
    of card acceptance do not work for small merchants or rural areas without some
    form of risk mitigation. By absorbing a share of the commercial risk alongside
    the World Bank, the two networks lower the barrier for local acquirers and banks
    to invest in acceptance infrastructure.


    European payments firms with cross-border ambitions should take note. The programme
    could accelerate digital payment penetration in markets that feed into cross-border
    corridors, potentially increasing volume on rails that European processors and
    fintechs are building out. It also extends the networks'' influence in regions
    where mobile money and domestic instant payment schemes have been gaining ground
    independently.

    '
  editorial_note: 'Relevant to European payments professionals tracking how the card
    networks are positioning themselves in markets where alternative rails are growing
    fast, and where cross-border payment flows intersect with European infrastructure.

    '
  sources: '[World Bank targets more digital payments in emerging markets](https://www.finextra.com/newsarticle/48373/world-bank-targets-more-digital-payments-in-emerging-markets?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'style check response could not be parsed: ''```json {   "compliant": false,   "warnings":
      [     "Standfirst opens by naming the organisation (\''Both card networks\'')
      that is also named in the head'''
