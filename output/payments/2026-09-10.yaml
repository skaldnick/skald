- headline: Canadian securities regulators flag open banking gaps in data portability
    review
  standfirst: Gaps in KYC processes and incomplete open banking coverage identified
    in a Canadian data portability report offer a useful comparison point as European
    regulators advance their own open finance frameworks.
  body: 'The Canadian Securities Administrators (CSA) have published a report on data
    portability in financial services that identifies significant gaps in KYC processes
    and open banking coverage. The report examines how investor data moves between
    institutions and finds that the absence of a fully implemented open banking regime
    creates friction in account transfers and onboarding.


    Canada''s Consumer-Driven Banking framework, which began rolling out in phases,
    has so far focused on deposit accounts and basic payment data. The CSA report
    notes that extending data portability to investment accounts raises distinct challenges
    around data standardisation, consent management and liability, echoing debates
    that European regulators are navigating under the EU''s proposed Financial Data
    Access regulation.


    The distinction between payment account data and investment data portability is
    one that European policymakers have drawn explicitly. The EU''s Financial Data
    Access regulation, proposed in June 2023, takes a separate legislative track from
    PSD3 and the open finance regulation. Canada''s experience suggests that even
    jurisdictions with established open banking frameworks face implementation friction
    when scope expands beyond banking.'
  editorial_note: ''
  sources: '[CSA data portability report flags KYC hurdles and open banking gaps](https://www.wealthprofessional.ca/news/industry-news/csa-data-portability-report-flags-kyc-hurdles-and-open-banking-gaps/393479)
    — Wealth Professional'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'CSA' (the organisation also named in the headline
      as 'Canadian Securities Regulators'), violating rule 1. Should open with the
      substantive point about gaps in data portability rather than naming the CSA
      first.
    - Body text uses 'CSA' without spelling it out on first use. Rule requires 'Canadian
      Securities Administrators (CSA)' on first mention in body, but the acronym appears
      alone in the standfirst and then spelled out in the body opening — the spelling-out
      should occur in the body's first use regardless of standfirst usage.
    - Editorial note should not be included in the output provided to copy editor
      — it appears to be metadata for internal use, not part of the story to be checked
      against house style rules.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Story states EU investor data-sharing proposal was 'advanced in May' but FiDA
      was originally published 28 June 2023; May 2026 references are to commentary
      on the existing proposal, not a new advancement
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with the substantive point ('Gaps in KYC processes…')
      rather than naming the CSA, avoiding redundant repetition of the organisation
      named in the headline per rule 1.
    - CSA was already spelled out as 'Canadian Securities Administrators (CSA)' on
      first use in the body; no change needed there. Removed bare 'CSA' from the standfirst
      per the rule that the body must introduce abbreviations independently.
    - Corrected 'advanced in May' to 'proposed in June 2023', reflecting the actual
      publication date of the Financial Data Access regulation (FiDA) on June 28,
      2023, and named the regulation explicitly.
    - Removed editorial note from output as it is internal metadata, not part of the
      published story.
