title: 'Blik agentic payment; EPC delays address migration; UK payments vision doubts

  '
social_post: 'Blik runs Poland''s first agentic payment, the EPC pushes back its address
  format deadline, and UK industry backs the National Payments Vision but doubts delivery.
  Today''s briefing: {link}

  '
stories:
- headline: Blik completes Poland's first agentic payment transaction
  standfirst: A live agentic transaction on domestic account-to-account rails extends
    the technology's footprint into a market with one of Europe's strongest national
    payment schemes.
  body: 'Blik has run its first agentic payment transaction, in which a user authorised
    an AI agent to search for a specific product and complete the purchase when it
    became available. The transaction moves agentic payments from the domain of card
    networks and global fintechs into a domestic account-to-account scheme with deep
    consumer penetration in Poland.


    Agentic payments have gathered momentum across 2026, with Visa, Mastercard, ING,
    Credit Agricole and others completing pilot transactions. Most activity so far
    has centred on card-based rails or pan-European schemes. Blik''s entry is different
    because it operates as a bank-owned mobile payment standard that accounts for
    more than 60% of Polish e-commerce transactions, giving it a direct path to consumer-scale
    adoption that card-network pilots have yet to demonstrate.


    The transaction follows PPRO''s partnership with Blik, announced in August, to
    develop agentic commerce capabilities for the Polish market. Whether domestic
    schemes can define their own agentic standards or will defer to global frameworks
    such as EMVCo''s draft specification remains an open question, but Blik''s move
    suggests at least some national schemes intend to compete rather than wait.'
  editorial_note: Agentic payments are a running theme, but Blik's transaction is
    the first from a domestic account-based scheme rather than a card network, testing
    whether national payment ecosystems can set their own terms for agent-initiated
    commerce.
  sources: '[Blik records first agentic payment transaction](https://www.finextra.com/newsarticle/48379/blik-records-first-agentic-payment-transaction?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
