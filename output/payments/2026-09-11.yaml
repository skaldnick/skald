    warnings:
    - Standfirst opens with 'Nine firms including SIX and Twint' — this breaches the
      rule against stating a specific count of participants when examples are introduced
      with 'including', which signals the list isn't exhaustive. The precise count
      contradicts the non-exhaustive phrasing.
    - Body opening sentence 'Switzerland's CHF stablecoin sandbox has entered its
      live testing phase' repeats the core action from the headline ('begin live stablecoin
      testing') using near-identical phrasing and the same subject framing. This violates
      the rule against starting headline, standfirst and body opening sentence with
      the same word or phrase — vary the opening in at least one element.
    - Standfirst contains 'The underlying token, CHFD, has been technically live since
      the end of June' — this is an example of the body bleeding into the standfirst.
      The standfirst should add interpretive context or summary, not introduce factual
      claims that belong in the body's self-contained explanation.
