- headline: Mastercard launches Wallet Pay to drive interoperability across digital
    wallets
  standfirst: The product portfolio targets fragmentation in mobile wallet payments
    by standardising how Mastercard credentials work across wallet providers and merchants.
  body: 'Mastercard has launched Wallet Pay, a portfolio of products designed to support
    interoperability and reach across mobile wallet payments. The suite aims to standardise
    how Mastercard credentials are provisioned, authenticated and accepted across
    different wallet providers and merchant environments.


    Digital wallet penetration in Europe continues to grow. UK mobile wallet registrations
    reached 65% of adults in the first half of 2025, and wallet-based payments are
    a core distribution channel for both card networks and emerging schemes such as
    Wero. The challenge for Mastercard is that wallet fragmentation, with different
    technical implementations across Apple Pay, Google Pay, Samsung Pay and bank-owned
    wallets, creates friction for merchants and limits the network''s ability to guarantee
    a consistent experience.


    Wallet Pay positions Mastercard as the interoperability layer between wallet providers
    and merchants rather than a competitor to individual wallets. As wallet penetration
    deepens and new payment surfaces such as agentic commerce and in-car payments
    proliferate, that interoperability role is a strategic prize. Mastercard''s approach
    parallels the network''s broader strategy of embedding its infrastructure into
    new payment surfaces rather than owning the consumer-facing interface directly.'
  editorial_note: As wallet penetration deepens and new payment surfaces (agentic,
    IoT) proliferate, Mastercard is positioning itself as the connective layer rather
    than competing with individual wallets.
  sources: '[Mastercard to boost digital wallet uptake with Wallet Pay](https://www.finextra.com/newsarticle/48376/mastercard-to-boost-digital-wallet-uptake-with-wallet-pay?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
