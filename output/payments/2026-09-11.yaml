- headline: EPC delays structured address migration beyond November deadline
  standfirst: All five SEPA payment scheme rulebooks are affected, extending the transition
    period for participants still using unstructured address formats beyond November
    2026.
  body: 'The European Payments Council (EPC) has decided to delay the planned November
    2026 end date for the unstructured address format across all five of its payment
    scheme rulebooks. The original deadline would have required all SEPA payment service
    providers to send and receive only structured address data in line with ISO 20022
    messaging standards.


    The decision mirrors the pattern set by Swift, which extended its own structured
    address migration deadline for cross-border ISO 20022 messages earlier this year.
    Both delays reflect persistent implementation challenges among smaller banks and
    payment service providers that have struggled to clean and restructure address
    data across legacy systems. The EPC has not yet confirmed a revised end date.


    Participants that have already completed structured address compliance now face
    uncertainty about when the operational benefits of consistent data quality will
    materialise. Those still behind gain breathing room but not relief from the underlying
    obligation.'
  editorial_note: The EPC's address format migration is a practical compliance burden
    for every SEPA participant. A delay across all five rulebooks is operationally
    significant and follows a similar Swift extension, suggesting a broader pattern
    of ISO 20022 migration slippage.
  sources: '[EPC delays address format migration timeline](https://www.finextra.com/pressarticle/110873/epc-delays-address-format-migration-timeline?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
