      about regulatory-insider preference.
- headline: Swiss banks begin live stablecoin testing as SIX and Twint join sandbox
  standfirst: Nine firms including SIX and Twint are testing a franc-pegged stablecoin
    in a controlled live environment, exploring programmable payments use cases that
    could shape Switzerland's digital money infrastructure.
  body: 'Switzerland''s CHF stablecoin sandbox has entered its live testing phase,
    with financial market infrastructure operator SIX and mobile payment service Twint
    joining the initiative as new partners. The sandbox, first announced in April
    by UBS, PostFinance, Sygnum, Raiffeisen, Zuercher Kantonalbank, Banque Cantonale
    Vaudoise and Swiss Stablecoin AG, now includes nine participants testing use cases
    on a platform operated by CHFD Infrastruktur AG, a subsidiary of Swiss Stablecoin
    AG. The underlying token, CHFD, has been technically live since the end of June
    and maintains a one-to-one peg to the Swiss franc.


    The tests go beyond conventional institutional use cases such as interbank transfers
    and tokenised asset settlement. Participants are exploring whether programmable
    payments can reduce fraud on online marketplaces, improve fairness in event-ticket
    allocation and make public fund disbursement more efficient. The sandbox operates
    under defined safeguards, with a restricted participant pool and capped transaction
    amounts.


    The test phase is expected to continue until the end of the year with an open
    outcome. SIX brings financial market infrastructure expertise while Twint, Switzerland''s
    dominant consumer payment app, adds a retail payments dimension. The initiative
    runs in parallel with Europe''s broader push toward regulated stablecoins, though
    Switzerland''s approach is industry-led rather than central bank-mandated.'
  editorial_note: This story fills the gap left by the dropped EPC FRIDA consultation
    piece. It is a genuinely new development from September 8, involving major Swiss
    financial infrastructure players and connecting to the broader European stablecoin
    and programmable payments narrative. It has not been previously covered — the
    September 2 story about global banks committing to a joint stablecoin venture
    with a euro token is a separate initiative. The Swiss sandbox is notable for combining
    major banks with consumer payment infrastructure (Twint) and a national exchange
    operator (SIX) in live testing of practical programmable payments use cases.
  sources: '[CHF stablecoin sandbox enters test phase and adds SIX and TWINT as new
    partners](https://www.sygnum.com/news/chf-stablecoin-sandbox-enters-test-phase-and-adds-six-and-twint-as-new-partners/)
    — Sygnum Bank'
  style_check:
