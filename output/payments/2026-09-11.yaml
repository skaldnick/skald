- headline: EPC opens consultation on pan-European fraud data-sharing rulebook
  standfirst: Draft rules for the Fraud Information Distribution Arrangement would
    require payment providers across SEPA to exchange fraud intelligence under a common
    scheme, ahead of obligations in the Payment Services Regulation.
  body: 'The European Payments Council (EPC) has launched a public consultation on
    the proposed rulebook for its Fraud Information Distribution Arrangement (FRIDA)
    scheme, running from September 11 to December 10. The rulebook would govern how
    payment service providers exchange fraud data related to account-to-account payments
    across SEPA, establishing binding inter-provider rules, practices and standards
    for sharing suspicious activity indicators.


    FRIDA is designed to anticipate the fraud data-sharing obligations set out in
    Articles 83 and 83a of the Payment Services Regulation, which is expected to take
    effect by mid-2028. The scheme envisages a federated model, connecting existing
    national fraud-sharing platforms through a central hub to create pan-European
    interoperability. The EPC issued a request for information in January to identify
    potential operators for that central platform and has been developing the rulebook
    through its FRIDA task force since 2025.


    The three-month consultation marks the point at which the scheme moves from design
    to formal market scrutiny. For payment providers already operating national fraud-sharing
    arrangements, FRIDA will set the terms on which those systems must interoperate.
    For those without such arrangements, it will define the baseline they must meet.'
  editorial_note: 'Genuinely new development published today (September 11): the EPC
    has moved from the earlier RFI stage (January 2026, which sought platform providers)
    to the rulebook consultation stage, which is a materially subsequent step putting
    the draft scheme rules themselves out for market comment. Not previously covered
    in the briefing. Strong regulatory/policy significance given PSR fraud data-sharing
    obligations approaching.'
  sources: '[Contributing to the future of payments in Europe](https://www.europeanpaymentscouncil.eu/)
    — European Payments Council'
