title: 'UK open banking governance; EPC fraud data consultation; industry confidence
  gap

  '
social_post: 'The UK''s open banking Future Entity finally has a chair — but industry
  confidence in the broader National Payments Vision is lukewarm at best. Plus: EPC
  opens fraud data-sharing consultation. {link}

  '
stories:
- headline: Ezechi Britton named chair of UK open banking Future Entity
  standfirst: A named leader for the long-delayed body is the first concrete step
    toward operationalising it, though its scope and funding model remain unsettled.
  body: 'Ezechi Britton has been appointed independent chair of the steering group
    designing the UK''s open banking Future Entity, the FCA-regulated body intended
    to take over API standard-setting from the current Open Banking Implementation
    Entity. Britton, most recently CEO of the Centre for Finance, Innovation and Technology
    (CFIT), will lead the group responsible for scoping the new organisation''s remit,
    governance and commercial model.


    The Future Entity has been in gestation for several years, with successive delays
    as the industry and regulators debated whether the body should confine itself
    to maintaining existing open banking API standards or extend into commercial variable
    recurring payments (VRP) facilitation and broader open finance coordination. The
    Treasury''s July consultation on modernising payments regulation flagged the Future
    Entity as a priority, but left key questions about mandate and funding unresolved.


    Britton brings experience spanning fintech entrepreneurship and financial-inclusion
    policy. The steering group''s output will shape whether the UK''s open banking
    infrastructure evolves under a single, commercially viable standard-setter or
    fragments across competing initiatives such as the UK Payments Initiative and
    individual bank schemes.'
  editorial_note: The Future Entity is a critical piece of UK open banking governance
    that has been stalled for years. A named chair is the first concrete step toward
    operationalising it, making this relevant to anyone building on UK open banking
    rails.
  sources: '[Chair named to steer UK open banking standard setter](https://www.thebanker.com/content/40cc5a49-adae-488c-97c9-a8c44523b4c1)
    — The Banker | [Ezechi Britton Appointed Independent Chair to Lead Design of UK
    Open Banking ''Future Entity''](https://www.bobsguide.com/ezechi-britton-appointed-independent-chair-to-lead-design-of-uk-open-banking-future-entity/)
    — Bobsguide'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'the long-delayed successor to the Open Banking Implementation
      Entity' which is essentially naming the organisation also identified in the
      headline as 'UK open banking Future Entity'. This violates the rule to 'not
      open by naming the organisation that is also named in the headline'. The standfirst
      should open with the substantive point (the appointment and its significance)
      rather than restating what the Future Entity is.
    - Body text uses 'commercial VRP facilitation' but earlier in the same sentence
      introduces 'commercial variable recurring payments' without spelling it out
      in full with the standard abbreviation on first use. Per house style, it should
      be introduced as 'commercial variable recurring payments (VRP)' on first mention
      in the body, even though VRP may have been mentioned before.
    - The phrase 'Britton's FCA background signals a preference for someone who understands
      the regulatory architecture from the inside' uses vague attribution ('signals
      a preference') rather than stating directly what the appointment demonstrates
      or what stakeholders have said about it. This weakens the substantive claim.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - 'Ezechi Britton was not ''formerly chief technology innovation officer at the
      FCA''. Available sources show his career as: software developer, co-founder/CTO
      of Neyber, co-founder of Code Untapped, founding member/principal/CTO-in-residence
      at Impact X Capital Partners, and CEO of CFIT (2023-2025). No FCA role is documented.'
  revision:
    replaced: false
    resolved: true
    summary:
    - 'Corrected Britton''s biography: removed incorrect claim that he was formerly
      chief technology innovation officer at the FCA; replaced with ''most recently
      CEO of the Centre for Finance, Innovation and Technology (CFIT)'', consistent
      with available sources.'
    - Revised standfirst to open with the substantive point ('A named leader for the
