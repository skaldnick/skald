- headline: Bank of Ireland partners with Stripe on digital transformation
  standfirst: A partnership with a major Irish lender extends Stripe's footprint among
    tier-one European banks, following its recent work with the UK Government Digital
    Service and Lloyds Banking Group.
  body: 'Bank of Ireland has announced a partnership with Stripe that the bank describes
    as a key milestone in its digital transformation programme. The deal will see
    Stripe''s payment infrastructure integrated into Bank of Ireland''s digital services,
    though the precise scope of the engagement has not been detailed publicly.


    Stripe has been steadily building its presence among large European incumbent
    banks. The UK Government Digital Service replaced its previous processor with
    Stripe-rival Adyen in June, but Stripe secured a partnership with Lloyds Banking
    Group in the same month to deliver payment tools to small businesses. Bank of
    Ireland''s selection suggests Stripe is making inroads with tier-one lenders in
    markets beyond the UK.


    The partnership signals a willingness to use a fintech payments stack rather than
    relying solely on legacy acquiring infrastructure. The choice of Stripe over a
    traditional European acquirer reflects the bank''s priorities around developer
    tooling, e-commerce integration and speed of deployment.'
  editorial_note: Stripe's growing roster of major European bank partnerships is a
    trend worth tracking; Bank of Ireland is another data point showing incumbent
    lenders choosing fintech infrastructure over traditional acquirers for digital
    modernisation.
  sources: '[Bank of Ireland and Stripe strike digital transformation deal](https://www.finextra.com/newsarticle/48394/bank-of-ireland-and-stripe-strike-digital-transformation-deal?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
