title: 'Worldline backs agentic commerce protocol; Bank of Ireland picks Stripe; Tarabut
  raises $50m

  '
social_post: 'Worldline becomes one of Europe''s first processors to support the Universal
  Commerce Protocol for agentic payments. Plus: Bank of Ireland picks Stripe, Tarabut
  raises $50m, and Sokin connects payments to AI via MCP. {link}

  '
stories:
- headline: 'Worldline launches payment handler for agentic commerce protocol

    '
  standfirst: 'The processor is among the first in Europe to support the Universal
    Commerce Protocol, an open standard co-developed by Google that enables AI agents
    to initiate and complete purchases.

    '
  body: 'Worldline has launched a payment handler for the Universal Commerce Protocol
    (UCP), an open standard for agentic commerce co-developed by Google and other
    industry partners. The move positions Worldline as one of the earliest European
    acquirers to offer merchants a standardised way to accept payments initiated by
    AI agents rather than human users.


    UCP is designed to give AI agents a common interface through which to discover,
    negotiate and pay for goods and services without requiring bespoke integrations
    for each merchant or processor. For acquirers, supporting the protocol is a bet
    that agentic commerce will move from pilot to production quickly enough to justify
    early investment in infrastructure.


    The announcement follows a rapid sequence of agentic payments developments across
    Europe in recent months, including Visa''s partnership with OpenAI, ING''s completion
    of the continent''s first agentic payment with Worldline and Mastercard, and the
    formation of a 25-member agentic payments alliance. Worldline''s UCP handler suggests
    the company sees standardisation, not proprietary integration, as the route to
    scale for this emerging channel.

    '
  editorial_note: 'Worldline backing an open agentic commerce standard signals that
    European acquirers are moving beyond bilateral pilots toward protocol-level infrastructure
    for AI-initiated payments, a meaningful step in the agentic commerce narrative.

    '
  sources: '[Worldline enables agentic commerce payments via Universal Commerce Protocol](https://www.finextra.com/pressarticle/110896/worldline-enables-agentic-commerce-payments-via-universal-commerce-protocol?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
