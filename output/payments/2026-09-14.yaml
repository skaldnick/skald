- headline: Tarabut raises $50m from Saudi backers as open banking expands beyond
    data
  standfirst: The funding round, led by Saudi banks and business groups, reflects
    deepening institutional commitment to open finance infrastructure in the Gulf
    as Tarabut moves beyond data access into payments.
  body: 'Tarabut has raised $50 million from Saudi institutional investors as it deepens
    its focus on the Kingdom''s market. The round signals growing institutional appetite
    in the Gulf for open banking infrastructure backed by domestic capital rather
    than solely international venture funding.


    Tarabut''s Saudi products have moved beyond the original open banking proposition
    of permissioned data access. The company is now building payment initiation and
    broader financial services capabilities, mirroring the trajectory seen in European
    markets where open banking providers have expanded from read-only data into payment
    execution and lending.


    The raise comes as Saudi Arabia''s open banking framework matures and regional
    regulators push financial institutions toward API-based data sharing. The Gulf''s
    open banking build-out represents both a potential expansion market for European
    firms and a testing ground for business models that depend on regulatory mandates
    to drive bank participation.'
  editorial_note: Tarabut's $50m raise from Saudi institutional investors is a substantive
    signal that Gulf open banking is moving from regulatory ambition to funded infrastructure,
    relevant to European firms eyeing MENA expansion.
  sources: '[Tarabut secures $50M from Saudi banks and business groups as it deepens
    Kingdom focus](https://www.fwdstart.me/p/tarabut-secures-50m-from-saudi-banks-and-business-groups-as-it-deepens-kingdom-focus)
    — Fwdstart'
  style_check:
    compliant: false
    warnings:
    - Headline uses '$50m' but body uses '50 million dollars' — inconsistent currency
      formatting. Per house style, body text must spell out 'million' in full, so
      use '50 million dollars' or '$50 million', not '50 million dollars'.
    - 'Body paragraph opening: ''For European payments professionals, the Gulf''s
