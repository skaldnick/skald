- headline: ECB invites merchants to join digital euro pilot scheme
  standfirst: The call for e-commerce and mobile commerce participants marks the first
    direct merchant engagement in the pilot, expanding testing beyond the 36 payment
    providers selected in July.
  body: 'The European Central Bank has opened a call for expressions of interest from
    e-commerce and mobile commerce merchants operating in the euro area to participate
    in the digital euro pilot. The move extends the pilot''s scope beyond the payment
    service providers already enrolled, bringing the merchant side of the transaction
    chain into structured testing for the first time.


    The ECB selected 36 payment providers for the pilot phase in July. Adding merchants
    to the process addresses a gap that industry participants, including open banking
    providers, have flagged: that the digital euro''s viability depends on acceptance
    infrastructure, not just issuance and distribution. The European Parliament voted
    in July to advance the digital euro regulation to final negotiations, and merchant-side
    testing will feed into the practical design questions that remain open as those
    talks proceed.


    The expression of interest is open to merchants already operating in euro area
    e-commerce and mobile commerce, suggesting the ECB is prioritising digital channels
    over in-store payments in this phase of testing.'
  editorial_note: This is a genuinely new development in the digital euro timeline
    — the ECB had previously selected payment providers (covered July 15-16) but this
    is the first merchant-side call, representing a subsequent stage. It advances
    a continuing story with a materially new step. Source is Finextra reporting the
    ECB's call directly.
  sources: '[ECB calls on merchants to join digital euro pilot scheme](https://www.finextra.com/newsarticle/48402/ecb-calls-on-merchants-to-join-digital-euro-pilot-scheme?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
