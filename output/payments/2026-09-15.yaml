- headline: KBC launches delegated fraud review for four million Belgian customers
  standfirst: Letting a trusted contact review flagged payments before execution offers
    a novel approach to authorised push payment fraud prevention that shifts intervention
    from the bank to the customer's own network.
  body: 'KBC has rolled out a fraud prevention feature called "guardian angel" to
    more than four million customers in Belgium, following a pilot with 2,000 users.
    The tool allows customers to designate a trusted person — a family member or friend
    — who receives a notification and can review suspicious payments before they are
    executed.


    The model is distinctive because it places a human check outside the bank''s own
    fraud detection systems. Rather than relying solely on algorithmic flags or friction-inducing
    warnings, KBC is effectively crowdsourcing a layer of oversight to people who
    know the customer personally. For vulnerable customers — elderly account holders
    or those susceptible to social engineering — this could prove more effective than
    generic warning screens that many users click through without reading.


    Authorised push payment (APP) fraud prevention across Europe has focused heavily
    on confirmation of payee, transaction monitoring and mandatory reimbursement rules.
    KBC''s approach introduces a complementary mechanism that addresses a known weakness:
    the moment between a customer being deceived and the payment leaving their account.
    Other banks'' adoption of similar models may depend on how effectively the pilot
    data demonstrates reduced fraud losses.'
  editorial_note: KBC's delegated review mechanism is a genuinely novel approach to
    APP fraud prevention with potential applicability across European markets grappling
    with social engineering scams.
  sources: '[KBC brings ''guardian angel'' to more than 4 million customers in Belgium](https://www.finextra.com/newsarticle/48401/kbc-brings-guardian-angel-to-more-than-4-million-customers-in-belgium?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
