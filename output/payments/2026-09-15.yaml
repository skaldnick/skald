- headline: Ez Britton appointed to lead UK open finance future entity design
  standfirst: A named leader has been appointed for the first time to chair the programme
    designing a successor to Open Banking Limited, after months of structural uncertainty
    about the UK's open finance governance.
  body: 'The Future Entity Design Steering Group has appointed Ezechi (Ez) Britton
    to chair the programme responsible for designing the governance body that will
    succeed Open Banking Limited. The appointment was announced by OBL in its capacity
    as neutral facilitator of the design process.


    The UK''s open finance architecture has lacked a clear institutional anchor since
    the FCA published its roadmap in April 2024 with a 2030 target. While the FCA
    and Treasury have set broad direction — most recently with chancellor Rachel Reeves''s
    July announcement of an open finance push focused on SME lending — the question
    of who runs the day-to-day infrastructure has remained unresolved. Britton''s
    appointment is the first visible sign that the future entity programme is moving
    from consultation to active design.


    Britton''s background and the scope of the role will shape whether the successor
    body operates as a narrow technical standards organisation or takes on a broader
    mandate encompassing commercial variable recurring payments (VRP) frameworks,
    data quality and dispute resolution. The steering group''s output will need to
    satisfy both the FCA''s regulatory expectations and Treasury''s ambitions for
    open finance as a driver of SME credit access.'
  editorial_note: The appointment determines who will shape the governance, mandate
    and operational scope of the body replacing Open Banking Limited, with direct
    consequences for commercial VRP frameworks, data standards and the FCA's 2030
    open finance target.
  sources: '[Ez Britton appointed to steer UK open finance blueprint](https://www.finextra.com/pressarticle/110891/ez-britton-appointed-to-steer-uk-open-finance-blueprint)
    — Finextra Research'
