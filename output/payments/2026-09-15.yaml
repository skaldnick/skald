- headline: Air France, Decathlon and Fnac Darty join Wero as France's e-commerce
    rollout begins
  standfirst: The formal launch of Wero for Merchants in France brings Europe's sovereign
    payment scheme into direct competition with card networks and digital wallets
    at major e-commerce checkouts.
  body: 'BNP Paribas hosted a press event in Paris on September 8 to announce the
    first merchant deployments of Wero''s e-commerce payment solution in France and
    across Europe. Air France, Decathlon, Fnac Darty and Orange are among the brands
    that have committed to accepting Wero for online payments, with BNP Paribas acting
    as acquirer via its Axepta merchant services unit across five European markets.


    Decathlon went live on Wero in Germany and Belgium with BNP Paribas on July 20,
    making it one of the earliest cross-border merchant deployments. Orange''s mobile
    brand Sosh has been offering Wero for subscription bill payments since September
    1. Air France, which described Wero''s pan-European interoperability as a strategic
    advantage for an airline operating across multiple countries, is the first carrier
    to adopt the scheme. Fnac Darty plans to launch Wero on fnac.com in early 2027,
    with physical stores and other European markets to follow.


    Wero now serves 57 million registered users for peer-to-peer payments across France,
    Germany, Belgium and Luxembourg. The transition into merchant e-commerce is the
    step EPI has long signalled as the test of whether the scheme can move beyond
    transfers between individuals and compete for transaction volumes currently dominated
    by Visa, Mastercard and PayPal. With Belgium''s e-commerce rollout already under
    way and the Netherlands and Luxembourg scheduled to follow, this French launch
    fills the largest remaining gap in Wero''s initial market coverage.'
  editorial_note: This advances the Wero story beyond the September 2 Orange item
    (first French merchant live) to the broader formal launch of Wero for Merchants
    in France, with multiple new brands (Air France, Decathlon, Fnac Darty) confirmed
    at a BNP Paribas press event on September 8. The Paypers covered it on September
    14; the primary details come from the Banking 4.0 article reproducing the BNP
    Paribas press release.
  sources: '[BNP Paribas supports the accelerated rollout of Wero to merchant and
    retail customers across Europe. Air France, Decathlon and Orange among leading
    merchants commited to offer Wero payments.](https://banking40.ro/bnp-paribas-supports-the-accelerated-rollout-of-wero-to-merchant-and-retail-customers-across-europe-air-france-decathlon-and-orange-among-leading-merchants-commited-to-offer-wero-payments/)
    — Banking 4.0'
