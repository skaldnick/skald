- headline: Moldova's instant payments system nears one million users
  standfirst: The platform has expanded into business-to-business and QR code payments
    as it approaches the one million user threshold.
  body: 'Moldova''s Moldovan Instant Account (MIA) instant payments system, developed
    by the National Bank of Moldova, has registered 985,000 users and launched two
    new capabilities: instant payments between businesses and QR code-initiated payments.
    The additions extend MIA beyond its initial person-to-person and consumer payment
    use cases.


    For a country of roughly 2.6 million people, 985,000 users represents substantial
    penetration in under two years of operation. The expansion into business-to-business
    (B2B) payments and QR codes follows a pattern seen in more mature instant payment
    markets, where initial consumer adoption creates the base for commercial services.
    Moldova''s trajectory echoes elements of the Pix playbook in Brazil, albeit at
    a far smaller scale.


    Montenegro went live on July 20 and Greece connected IRIS to the European instant
    payments network in July, as several non-eurozone European countries connect to
    or build instant payment infrastructure aligned with SEPA standards. Moldova''s
    domestically built system takes a different path but reflects the same underlying
    shift toward real-time settlement as baseline infrastructure.'
  editorial_note: A notable milestone for a smaller European market that illustrates
    how instant payments adoption is spreading beyond the eurozone core, with B2B
    and QR extensions showing maturation of the platform.
  sources: '[Moldova''s MIA Launches Instant B2B and QR Code Payments](https://logos-pres.md/en/news/the-mia-system-is-launching-instant-payments-for-businesses-and-qr-code-payments/)
    — Logos Press'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming ''National Bank of Moldova''s MIA platform'', the
      same organisation identified in the headline as ''Moldova''s instant payments
      system''. Per rule [1], the standfirst should open with the substantive point
      (the expansion into B2B and QR payments) rather than naming the organisation.
      Revise to begin: ''The platform has expanded into business-to-business and QR
      code payments after crossing the one million user threshold.'''
    - Body text uses 'B2B' without spelling it out on first use. Per rule [8], on
      first use of an abbreviation that must be retained, spell it out in full followed
      by the abbreviation in parentheses — eg, 'business-to-business (B2B)'. The text
      reads 'instant payments between businesses and QR code-initiated payments' in
      the first sentence, then 'The expansion into B2B payments' in the second paragraph.
    - 'Standfirst applies abbreviations without spelling them out. Rule [20] states:
      ''Do not apply the abbreviation-in-parentheses rule to the standfirst.'' However,
      rule [8] requires abbreviations to be spelled out on first use in the body.
      ''MIA'' appears in the standfirst without spelling it out, but then recurs in
      the body (''Moldova''s MIA instant payments system''). The body must introduce
      ''MIA'' with its full form on first use if the abbreviation recurs.'
    - Paragraph opening 'The move comes as several other non-eurozone European countries
      are connecting to or building instant payment infrastructure aligned with SEPA
      standards.' This announces a connection or comparison without leading with the
      substantive point. Per rule [11], do not open paragraphs with hedging scene-setters;
      lead directly with the substantive claim. Restructure to lead with the specific
      development rather than framing it as contextual comparison.
    - 'Editorial note included in submission. Per instruction guidelines, editorial
      notes should not appear in the copy to be checked; they are metadata. However,
      if flagging the note''s content: it uses ''A notable milestone'' and ''illustrates
      how'', which could suggest the story itself flags significance. The body avoids
      explicit significance flagging, so this is compliant in the copy itself.'
