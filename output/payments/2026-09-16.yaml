      move marks a shift from infrastructure assembly to real-world commerce testing
      ahead of a targeted 2029 launch.'''
    - Standfirst uses vague temporal reference 'earlier this year' when referring
      to the PSP selection. Per rule on vague temporal references, use the specific
      date or month. The editorial note indicates this occurred on 'July 15-16', so
      write 'in July' or the specific date.
    - 'Body paragraph 2: ''the first quarter of 2027'' should follow the house style
      for specific time periods. The rule requires formats like ''(April-June)'' for
      clarity. Write ''the first quarter of 2027 (January-March)''.'
    - 'Body paragraph 3 uses ''Merchant adoption is widely regarded as the commercial
      question'' — this frames significance before stating substance. Per the rule
      against explicit significance flags, state the substantive point directly without
      the framing ''is widely regarded as''. Suggest: ''Merchant adoption will determine
      the currency''s viability, a point underlined by the ECB''s decision to structure
      the pilot around real checkout flows rather than simulated environments alone.'''
