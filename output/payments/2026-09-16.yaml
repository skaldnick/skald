title: 'Swiss open pension pilot; Moldova instant payments; Fin.com emerges; Saudi
  open banking scales

  '
social_post: 'Switzerland quietly connects pension data to live banking. Moldova hits
  1m instant payment users. And a new cross-border payments startup emerges with $20m.
  Today''s briefing: {link}

  '
stories:
- headline: Swiss open pension pilot connects fund data to retail banking
  standfirst: A live integration marks the first practical test of Switzerland's SFTI-led
    open finance framework applied to retirement savings, connecting occupational
    pension data to a retail banking platform.
  body: 'The Swiss Fintech Innovations association (SFTI) has completed a pilot connecting
    pension data from provider Profond to Zuercher Kantonalbank''s eBanking platform
    through standardised APIs. The integration allows bank customers to view their
    occupational pension holdings alongside their regular accounts, without manual
    document uploads or separate logins.


    Switzerland decided in June to extend its open finance framework to cover pension
    data, a move that went further than most European jurisdictions at the time. This
    pilot translates that policy decision into a working product. SFTI says it demonstrates
    that standardised interfaces can deliver tangible consumer utility, not just regulatory
    compliance.


    The pension application is a useful bellwether for open finance adoption beyond
    payments and current accounts. If customers engage with aggregated pension views
    inside their banking apps, the case for expanding data-sharing to other asset
    classes strengthens. If they do not, the policy ambition may outrun consumer demand.'
  editorial_note: Follows up on the June 2026 Swiss open finance pension extension
    with the first concrete implementation, showing how policy is translating into
    live product.
  sources: '[Swiss Open Pension Pilot Connects Profond Data To ZKB''s eBanking](https://fintechnews.ch/open-banking/sfti-open-pension-pilot-switzerland/85629/)
    — Fintechnews'
