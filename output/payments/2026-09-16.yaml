- headline: Fin.com emerges from stealth with $20m to bridge stablecoin and local-currency
    payments
  standfirst: A white-label infrastructure play converts stablecoins to local currencies,
    targeting businesses that move money across multiple corridors.
  body: 'Fin.com has emerged from stealth with $20 million in funding, positioning
    itself as a white-label infrastructure layer that lets businesses convert stablecoins
    into local currencies and move money across borders through a single integration.
    The platform connects stablecoin settlement with local payment rails, offering
    conversion and payout services rather than competing on any single corridor.


    The approach reflects a broader trend in cross-border payments: rather than building
    on traditional correspondent banking alone, newer entrants are integrating stablecoin
    settlement directly into their infrastructure stack. This model has gained traction
    as stablecoins have matured into viable settlement options alongside local instant
    payment schemes.


    The company has been building product in stealth before seeking attention, and
    the competitive landscape is crowded. Established players such as Airwallex, Thunes
    and TerraPay all operate in adjacent territory, alongside bank-led initiatives.
    Fin.com''s ability to differentiate will depend on execution rather than concept.'
  editorial_note: A new entrant in cross-border payments that builds white-label infrastructure
    for stablecoin-to-local-currency conversion, illustrating how the infrastructure
    stack is evolving.
  sources: '[Payments infrastructure startup Fin.com emerges from stealth with $20m
    funding](https://www.finextra.com/newsarticle/48408/payments-infrastructure-startup-fincom-emerges-from-stealth-with-20m-funding?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organization ('The startup') that is also named
      in the headline ('Fin.com'). Per rule [1], the standfirst should begin with
      the substantive point or action instead — eg, 'The platform connects local payment
      rails…' rather than 'The startup is building…'
    - Body paragraph 3 opens with 'The $20 million raise is modest by current standards,
      but the stealth period suggests the company has been building product before
      seeking attention.' This is a hedging scene-setter that delays the substantive
      point. Per the rule against opening paragraphs with hedging, lead directly with
      the substantive claim — eg, 'The company has been building product in stealth
      before seeking attention' or focus on competitive differentiation directly.
    - Body paragraph 3 contains 'Whether Fin.com can differentiate will depend on
      execution rather than concept.' This is a colon-introduced binary question recast
      as a whether-clause. Per rule [7], this should be recast with a preposition
      — eg, 'Fin.com's ability to differentiate will depend on execution rather than
      concept.'
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - 'Company description overstates scope: sources emphasize stablecoin-to-local-currency
      conversion via white-label infrastructure, not multi-rail orchestration. No
      mention of Swift or ''USD virtual accounts'' in primary reporting.'
  revision:
    replaced: false
    resolved: true
    summary:
    - Removed references to Swift and USD virtual accounts, which were not supported
      by primary reporting. Reframed the company as a white-label stablecoin-to-local-currency
      conversion infrastructure play per source material.
    - Revised standfirst to open with the substantive point ('A white-label infrastructure
      play…') rather than naming the organisation from the headline.
    - Restructured paragraph 3 to lead with the substantive claim about building in
      stealth, removing the hedging scene-setter.
    - Recast 'Whether Fin.com can differentiate will depend on…' to 'Fin.com's ability
      to differentiate will depend on…' per rule against colon-introduced binary questions.
    - Updated editorial note to reflect corrected company description.
- headline: ECB invites online merchants to join digital euro pilot across 19 countries
  standfirst: The merchant call, following the selection of 36 payment service providers
    earlier this year, moves the digital euro project from infrastructure assembly
    to real-world commerce testing ahead of a targeted 2029 launch.
  body: 'The European Central Bank has opened a call for expressions of interest from
    e-commerce and mobile commerce merchants to participate in its digital euro pilot.
    Eligible merchants must be established in the EU and operate across at least two
    of the 19 pilot locations, which span the euro area from Austria to Spain. Applications
    close on October 27, with an information session scheduled for October 6.


    Selected merchants will process transactions using a simulated "beta digital euro"
    that mirrors the proposed currency''s technical and functional design but carries
    no legal tender status. Merchant selection will take place between the final quarter
    of 2026 and the first quarter of 2027, with onboarding and integration running
    through to the pilot''s operational launch in the second half of 2027. The pilot
    itself will run for 12 months. Participants will not be paid for taking part,
    nor will they be charged fees by the 36 payment service providers already selected
    for the exercise.


    The call marks a shift in the ECB''s pilot from assembling payment infrastructure
    to testing whether the digital euro works for the merchants who would need to
    accept it. Merchant adoption is widely regarded as the commercial question that
    will determine the currency''s viability — a point underlined by the ECB''s decision
    to structure the pilot around real checkout flows rather than simulated environments
    alone.'
  editorial_note: 'Genuinely new development: the ECB published this merchant call
    on September 15, a distinct and subsequent stage from the PSP selection covered
    on July 15-16. The previously covered story was about selecting 36 PSPs; this
    story is the merchant-side call for expressions of interest, which is the next
    phase of the same pilot programme.'
  sources: '[ECB Invites Online Merchants to Trial the Digital Euro](https://fintechnews.ch/payments/ecb-digital-euro-pilot-merchants/85676/)
    — Fintech News Switzerland'
  style_check:
