title: 'Trustly cuts 200 jobs; FCA backs SME open finance; Tarabut raises $50m

  '
social_post: 'Trustly cuts 200 staff after losing major clients — a reality check
  for pay-by-bank at scale. Plus the FCA doubles down on SME open finance and Tarabut
  raises $50m in Saudi Arabia. {link}

  '
stories:
- headline: Trustly cuts 200 jobs after losing major clients
  standfirst: Scale in open banking payments does not yet guarantee commercial durability,
    as the Swedish pay-by-bank provider's restructuring makes plain.
  body: 'Trustly is cutting roughly 200 staff, approximately a quarter of its global
    workforce, as the Swedish fintech refocuses its business after losing significant
    clients. The company, headquartered in Stockholm with offices in London, Helsinki,
    Ottawa and San Carlos, had built one of Europe''s largest open banking payments
    operations.


    The reductions come at a moment when pay-by-bank is attracting heavy investment
    across Europe. Mollie completed its 1.1 billion euro acquisition of GoCardless
    earlier this month, and several providers have secured fresh funding or expanded
    their product lines. Trustly''s contraction stands in contrast to that momentum
    and raises questions about unit economics and client retention in a market where
    switching costs remain low and competition from card networks, Wero and new entrants
    is intensifying.


    The episode illustrates that transaction volume growth alone does not insulate
    providers from client concentration risk. How Trustly repositions after the cuts
    will be closely watched, particularly in its core Nordic and European markets.'
  editorial_note: A major open banking payments provider cutting a quarter of its
    workforce is a notable market signal, particularly given the current wave of consolidation
    and investment in pay-by-bank across Europe.
  sources: '[Trustly cuts 200 jobs as Swedish fintech refocuses after losing major
    clients](https://app.dealroom.co/news/feed/trustly-cuts-200-jobs-as-swedish-fintech-refocuses-after-losing-major-clients)
    — Dealroom.co'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation also named in headline ('The Swedish
      pay-by-bank provider' refers to Trustly). Per rule [1], should begin with the
      substantive point instead — eg, 'Scale in open banking payments does not yet
      guarantee commercial durability.' Trustly should be named after establishing
      the interpretive point.
    - Body paragraph 3 opens with 'For the broader open banking payments sector, the
      episode illustrates...' This frames the paragraph around relevance to a sector
      perspective with a prefatory clause. Per rule [23], avoid framing with 'For
      X, ...' constructions; state the point directly as part of the narrative.
    - Editorial note included in submitted content. Per instructions, editorial notes
      should not be flagged as compliance issues within the story itself, but this
      note explicitly announces significance ('a significant market signal') which
      violates rule [5] — never flag significance explicitly.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with the substantive point ('Scale in open banking
      payments does not yet guarantee commercial durability') rather than naming the
      organisation from the headline, per rule [1].
    - Removed 'For the broader open banking payments sector,' prefatory clause from
      paragraph 3 opening, per rule [23]. The paragraph now opens directly with the
      substantive point.
    - Revised editorial note to remove 'a significant market signal' phrasing that
      explicitly flags significance, per rule [5]. Replaced with 'notable market signal'
      — though this remains borderline, the editorial note is metadata rather than
      published copy.
- headline: FCA outlines steps to improve small business access to finance
  standfirst: SME lending is now an explicit open finance priority for the UK regulator,
    with digital identity and alternative data use cases under active consideration.
  body: 'The Financial Conduct Authority (FCA) has set out measures to support small
    business access to finance, with open finance identified as a central mechanism.
    The regulator said it is prioritising SME lending as a key use case for open finance
    and is monitoring industry work on whether digital identity tools can streamline
    onboarding and credit decisions.


    The announcement builds on the FCA''s broader open finance roadmap, published
    in April, which set a 2030 target for extending data-sharing beyond payments accounts.
    By singling out SME lending, the regulator is moving from general ambition to
    specific application, a shift that lenders, credit platforms and data providers
    will need to respond to. Chancellor Rachel Reeves announced a parallel open finance
    push focused on SME lending in July, giving the FCA''s latest steps a clear political
    tailwind.


    For banks and alternative lenders, the practical implication is that open finance-enabled
    credit assessment is moving from experimental to expected. Firms building products
    in this space now have a clearer signal of regulatory support, though the operational
    detail of how data-sharing obligations will extend to business accounts remains
    to be defined.'
  editorial_note: The FCA naming SME lending as an explicit open finance priority
    advances the UK's open finance agenda from general roadmaps to concrete use cases,
    with direct implications for lenders and data providers.
  sources: '[FCA Sets Out Steps To Support Small Businesses'' Access To Finance](https://www.crowdfundinsider.com/2026/09/310851-fca-sets-out-steps-to-support-small-businesses-access-to-finance/)
    — Crowdfund Insider'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the FCA, which is also named in the headline. Per
      rule [1], the standfirst should begin with the substantive point instead of
      'Open finance for SME lending is now an explicit FCA priority' — consider opening
      with 'SME lending is now an explicit open finance priority' or similar to avoid
      redundant repetition of the subject.
    - 'Body text uses ''Rachel Reeves, the UK chancellor'' on first reference. Per
      rule [18], when naming an individual on first reference, the title should be
      included immediately — this is correctly done here, so no breach. However, the
      phrasing could follow the preferred format more consistently: ''Chancellor Rachel
      Reeves'' or ''Rachel Reeves, the chancellor'' are both acceptable; the current
      phrasing is acceptable.'
    - 'Headline, standfirst, and body opening sentences all begin with similar emphasis
      on the FCA''s action/priority. Per rule [45], do not start the headline, standfirst,
      and body opening sentence with the same word or phrase. Headline: ''FCA outlines
      steps''; Standfirst: ''Open finance for SME lending is now''; Body: ''The Financial
      Conduct Authority has set out measures''. While not identical words, the opening
      concepts are heavily aligned—consider varying the standfirst opening further.'
    - Vague temporal reference 'in July' used without a specific date. Per rule [34],
      avoid vague temporal references such as 'in June' or 'last month' when a specific
      date is available. The text states 'Rachel Reeves, the UK chancellor, announced
      a parallel open finance push focused on SME lending in July' — a specific date
      should be provided if available.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with 'SME lending' rather than naming the FCA, avoiding
      redundant repetition of the subject already named in the headline (rule 1) and
      further varying the opening concept across headline, standfirst and body (rule
      45).
    - Changed 'Rachel Reeves, the UK chancellor' to 'Chancellor Rachel Reeves' for
      a slightly tighter construction on first reference, consistent with rule 18.
    - Could not provide a specific date for the July reference because the issue flags
      the vagueness but does not supply the correct date; replacing 'in July' with
      a guess would risk introducing an error. Left as 'in July'.
    - Added '(FCA)' after first use of 'Financial Conduct Authority' because the abbreviation
      recurs later in the body.
- headline: Saudi banks back Tarabut's $50m embedded finance round
  standfirst: Saudi institutional investors are backing the largest disclosed open
    banking funding round in the Middle East, as the kingdom accelerates its open
    finance regime.
  body: 'Tarabut has secured 50 million dollars in strategic financing from Saudi
    banking investors, including Riyad Bank and Zamil Group, to scale its embedded
    finance platform. The Bahrain-headquartered open banking provider operates across
    several Gulf states and has positioned itself as infrastructure for the region''s
    emerging open finance frameworks.


    Saudi Arabia has been building out its open banking regulations since 2022, with
    the Saudi Central Bank progressively expanding the scope of data-sharing requirements.
    The round reflects growing institutional commitment to open banking infrastructure
    in the kingdom, with incumbent banks investing directly rather than waiting for
    third-party ecosystems to develop independently.


    The investment also illustrates how open banking funding dynamics are shifting
    geographically. European open banking firms face consolidation pressure, including
    Trustly''s cuts and Mollie''s acquisition of GoCardless, while Gulf-based providers
    are attracting fresh capital from domestic financial institutions building toward
    mandated open finance regimes.'
  editorial_note: A $50 million round backed by Saudi banks is a data point for open
    banking's geographic expansion and signals how Gulf institutions are approaching
    open finance differently from their European counterparts.
  sources: '[Saudi banks back Tarabut''s $50m embedded finance push](https://fintech.global/2026/09/17/saudi-banks-back-tarabuts-50m-embedded-finance-push/)
    — FinTech Global | [Tarabut secures $50 million in strategic financing](https://www.finextra.com/pressarticle/110922/tarabut-secures-50-million-in-strategic-financing)
    — Finextra Research'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the raise/action ('The raise is') rather than the
      substantive point or consequence. Per rule 1, the standfirst should open with
      the substantive development — eg, 'Saudi institutional investors are backing
      Tarabut's $50m embedded finance round, the largest disclosed open banking funding
      round in the Middle East, as the kingdom accelerates its open finance regime.'
      This avoids making the standfirst a generic scene-setter.
    - Body paragraph 3 uses 'While European open banking firms face consolidation
      pressure, as Trustly's cuts and Mollie's acquisition of GoCardless demonstrate'
      — this is a dash-introduced clause that should be recast with a preposition
      or integrated more cleanly. Per rule on dash usage, prefer 'European open banking
      firms face consolidation pressure, including Trustly's cuts and Mollie's acquisition
      of GoCardless' or similar.
    - Editorial note states 'A $50 million round backed by Saudi banks is a notable
      data point' — this explicitly flags significance using 'notable', which violates
      the rule against announcing notability. The editorial note should state the
      substance directly without framing it as significant.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with the substantive point ('Saudi institutional
      investors are backing…') rather than 'The raise is', avoiding redundant repetition
      of the headline subject per rule 1.
    - Recast body paragraph 3 to remove the 'While… as X demonstrate' construction,
      replacing it with 'including Trustly's cuts and Mollie's acquisition of GoCardless'
      integrated more cleanly into the sentence.
    - Removed 'notable' from the editorial note to avoid explicitly flagging significance
      per house style rules.
- headline: Mifundo partners with Yapily to extend cross-border credit data across
    Europe
  standfirst: The partnership combines open banking account data with credit bureau
    records, targeting a gap that European lenders face when assessing borrowers across
    jurisdictions.
  body: 'Mifundo is partnering with Yapily to integrate open banking data into its
    cross-border credit assessment platform. The arrangement pairs Yapily''s account
    data connectivity across European markets with Mifundo''s existing credit bureau
    aggregation, giving lenders a combined view of applicants'' financial positions
    across multiple countries.


    Cross-border credit assessment remains fragmented in Europe. Credit bureau coverage
    varies widely between member states, and open banking data has been deployed unevenly
    for lending decisions. The partnership addresses a practical bottleneck for lenders
    serving mobile European populations or expanding into new markets, where domestic
    credit files alone may be insufficient.


    The tie-up sits alongside the Financial Conduct Authority''s focus on open finance
    for lending and the European Commission''s broader data-sharing proposals. It
    also follows Yapily''s deal extending open banking account verification to Google
    Cloud. For Yapily, the Mifundo arrangement extends its positioning beyond payments
    initiation into the credit infrastructure layer, where open banking data has been
    slower to gain traction.'
  editorial_note: Cross-border credit data is a persistent European problem, and this
    partnership represents a concrete attempt to combine open banking and bureau data
    to address it, relevant to lenders and data providers across the continent.
  sources: '[Mifundo Taps Yapily to Widen Its Cross-Border Credit Data Platform](https://fintechnews.ch/p2plending/mifundo-yapily-open-banking-partnership/85762/)
    — Fintechnews'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the substantive point ('The partnership combines...')
      rather than avoiding redundant naming of the organisations in the headline.
      However, the rule requires avoiding opening by naming the organisation also
      named in the headline. Here the standfirst correctly avoids naming Mifundo or
      Yapily at the outset, so this is actually compliant—no warning needed on this
      point.
    - Body paragraph 3 states 'It also follows Yapily's recent deal extending open
      banking account verification to Google Cloud.' This uses vague temporal reference
      'recent' without a specific date. Rule requires specific dates or 'Reserve "last
      month" only when the specific date cannot be established.' This should use a
      precise date if available.
    - Headline starts with 'Mifundo', body starts with 'Mifundo is partnering', and
      standfirst starts with 'The partnership'. While the body and standfirst differ,
      the headline and body opening both lead with Mifundo/Mifundo. Rule states 'Do
      not start the headline, standfirst, and body opening sentence with the same
      word or phrase.' This is borderline but compliant as standfirst uses 'The partnership'
      differently.
    - 'Standfirst references ''the FCA'' and ''the European Commission'' without spelling
      out. Per rule on abbreviations in standfirst: ''common and recognisable abbreviations
      (such as FCA, EPI) may be used on first mention without spelling them out.''
      FCA is common enough, so this is compliant.'
    - 'Body introduces ''FCA'' without a parenthetical expansion on first mention
      in body text. Rule requires ''On first use of an abbreviation that must be retained,
      spell it out in full followed by the abbreviation in parentheses.'' However,
      the rule also states ''This rule can be ignored for some very common abbreviations
      (eg, US, UK, UN).'' FCA recurs later in the sentence, so the abbreviation should
      be expanded: ''Financial Conduct Authority (FCA)'' rather than used bare.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Spelled out 'FCA' to 'Financial Conduct Authority' in body paragraph 3, since
      the abbreviation does not recur later in the body and therefore does not need
      the parenthetical form, per the rule that abbreviations should only be parenthesised
      if they recur.
    - Removed vague temporal reference 'recent' before 'deal extending open banking
      account verification to Google Cloud' in body paragraph 3. A specific date for
      the Yapily-Google Cloud arrangement is not available to us, so the reference
      was simplified to remove the vague qualifier rather than guess at a date.
