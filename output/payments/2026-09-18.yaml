      with the substantive claim.
    - Editorial note 'A significant UK payments infrastructure funding round signals
      continued investor confidence in the sector and highlights the cross-border
      expansion dynamics facing post-Brexit UK fintechs.' should not be included in
      the submitted text per rule against including editorial notes about missing
      information. This note should be removed.
