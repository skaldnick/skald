title: 'FCA open finance roadmap; NatWest income verification; Ryft Series B

  '
social_post: 'FCA puts open finance at the centre of its SME lending strategy, NatWest
  digitises mortgage income checks, and Ryft raises £20m for a European push. Today''s
  briefing: {link}

  '
stories:
- headline: FCA positions open finance as central to SME lending reform
  standfirst: SME lending is identified as the priority use case for the regulator's
    open finance programme, alongside planned Consumer Credit Act reforms.
  body: 'The Financial Conduct Authority (FCA) has published a feedback statement
    setting out steps to improve small business access to finance, placing open finance
    prominently within its strategy. SME lending is identified as the leading use
    case within the FCA''s broader open finance agenda, with the regulator signalling
    it will prioritise work to unlock data-sharing that can streamline credit decisions
    for smaller firms.


    The statement also flags planned reforms to the Consumer Credit Act as part of
    the same package. The FCA says it will monitor industry efforts to explore whether
    existing open banking infrastructure can be extended to support commercial lending
    workflows, and will consider regulatory intervention if voluntary progress stalls.


    The publication follows the FCA''s open finance roadmap released in April, which
    set a 2030 target and brought investment data into scope. By naming SME lending
    as the first priority, the regulator is giving the market a clear signal about
    where it expects commercial momentum to build. The feedback statement narrows
    the field of regulatory expectation considerably for banks and fintechs positioning
    products around open finance-enabled credit.'
  editorial_note: 'This advances a continuing regulatory story: the FCA''s April open
    finance roadmap now has a concrete priority use case in SME lending, giving the
    market a sharper steer on where to focus.'
  sources: '[FCA cites Open Finance among next steps to support SME access to finance](https://www.openbankingexpo.com/news/fca-cites-open-finance-among-next-steps-to-support-sme-access-to-finance/)
    — Openbankingexpo | [FCA publishes feedback statement on supporting SME access
    to finance](https://www.regulationtomorrow.com/2026/09/fca-publishes-feedback-statement-on-supporting-sme-access-to-finance/)
    — Regulationtomorrow | [FCA Unveils Strategic Roadmap to Boost SME Access to Finance
    via Open Finance and ...](https://ffnews.com/news/fca-sets-out-steps-to-support-small-businesses-access-to-finance-5804f678)
    — FF News'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'the regulator' which refers to the FCA already named
      in the headline. Per rule 1, the standfirst should begin with the substantive
      point rather than restating the subject. Revise to open with something like
      'SME lending is identified as the priority use case...' instead of 'A new feedback
      statement names SME lending...'
    - Body text uses 'FCA' on first mention without spelling it out. Per rule 8, on
      first use of an abbreviation that must be retained, spell it out in full followed
      by the abbreviation in parentheses — eg, 'Financial Conduct Authority (FCA)'.
      The opening sentence should read 'The Financial Conduct Authority (FCA) has
      published...'
    - 'Sentence ''For banks and fintechs positioning products around open finance-enabled
      credit, the feedback statement narrows the field of regulatory expectation considerably.''
      violates rule 22: do not frame a paragraph around its relevance by opening with
      ''For [audience]...'' Rewrite to state the substantive point directly without
      the audience-address clause.'
