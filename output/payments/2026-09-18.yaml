      is gaining traction…') rather than the vague 'The move', avoiding both naming
      the headline's subject and using an unanchored reference.
    - Rewrote the body's opening sentence to lead with Equifax's platform and the
      integration action rather than near-verbatim repeating the headline's 'NatWest
      has adopted Equifax's… platform' construction, per rule [7].
- headline: Ryft raises £20m to take UK payments infrastructure into Europe
  standfirst: A Series B round, described as the UK's largest in payments this year,
    funds expansion into European and US markets.
  body: 'Ryft, a UK payments infrastructure platform, is raising £20 million in a
    Series B round that it says is the largest payments-focused Series B in the UK
    this year. The Manchester-based company is targeting expansion into European and
    US markets with the proceeds.


    Ryft provides payment processing and orchestration tools aimed at platforms and
    marketplaces. European payments infrastructure is consolidating, with larger players
    acquiring specialist providers and smaller firms needing scale capital to remain
    competitive. Investor appetite for payments infrastructure businesses has held
    up despite broader fintech funding constraints.


    European expansion for UK-based payments firms has taken on added significance
    since Brexit introduced regulatory complexity for cross-border services. Ryft''s
    ambition to operate across both European and US markets will require navigating
    multiple licensing regimes simultaneously.'
  editorial_note: ''
  sources: '[Ryft secures £20m in UK''s largest payments Series B](https://fintech.global/2026/09/17/ryft-secures-20m-in-uks-largest-payments-series-b/)
    — FinTech Global | [UK payments firm Ryft raises £20m for European push](https://www.finextra.com/newsarticle/48426/uk-payments-firm-ryft-raises-20m-for-european-push?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation ('The Manchester-based platform')
      that is also named in the headline ('Ryft'). Per rule [1], avoid redundant repetition
      of the subject across headline and standfirst; instead begin with the substantive
      point or action — e.g., 'The Series B round, described as the UK's largest in
      payments this year, funds expansion…'
    - Body opening sentence 'Ryft, a UK payments infrastructure platform, has raised
      £20 million in a Series B round that it says is the largest payments-focused
      Series B in the UK this year.' uses 'has raised' (simple present) when the rule
      prefers 'is raising' (present continuous) to signal currency for a newly announced
      arrangement.
    - Sentence 'The fundraise comes during a period of consolidation in European payments
      infrastructure, with larger players acquiring specialist providers and smaller
      firms needing scale capital to remain competitive.' announces significance ('The
      fundraise comes during a period of consolidation') before making the substantive
      point. Per rule on not flagging significance explicitly, state the substantive
      claim directly.
    - Sentence 'The round suggests investor appetite for payments infrastructure businesses
      remains intact despite broader fintech funding constraints.' announces notability
