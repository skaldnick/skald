- headline: NatWest adopts Equifax platform for open banking mortgage checks
  standfirst: Digital income verification is gaining traction among major UK mortgage
    lenders as the FCA's open finance agenda moves closer to operational reality.
  body: 'Equifax''s Verification Exchange platform is being integrated into NatWest''s
    mortgage application process to digitise income verification. The platform uses
    open banking data to automate checks that have traditionally relied on manual
    document review, reducing processing time and friction for applicants.


    Digital income verification is an expanding segment within the broader affordability-data
    market. Several credit reference agencies and open banking providers now offer
    competing products, but adoption among the UK''s largest mortgage lenders has
    been uneven. NatWest''s decision to integrate an Equifax-built solution rather
    than developing in-house capabilities suggests that the buy-versus-build question
    is tilting toward established data providers, at least for mainstream mortgage
    use cases.


    The adoption comes as the FCA has been actively exploring how open finance data
    can reshape mortgage affordability assessments, including through a recent policy
    sprint that convened 80 industry stakeholders. NatWest''s move gives that policy
    direction a tangible commercial anchor.'
  editorial_note: A top-four UK lender embedding open banking data into mortgage workflows
    is a concrete signal that the FCA's open finance mortgage agenda is translating
    into operational change.
  sources: '[NatWest Adopts Equifax Verification Exchange for Mortgage Income Checks](https://thefintechtimes.com/natwest-adopts-equifax-verification-exchange-for-mortgage-income-checks/)
    — Thefintechtimes'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming ''the move'' without first establishing what the
      move is. Per rule [1], the standfirst should not open by naming the organisation
      from the headline (NatWest), but it should open with the substantive point or
      action — not a vague reference (''The move''). Rewrite to open with: ''Digital
      income verification is expanding among UK mortgage lenders as...'' or similar.'
    - Standfirst uses 'FCA's open finance vision' without spelling out the abbreviation.
      Per rule [13], common abbreviations such as FCA may be used in the standfirst
      without spelling out, so this is acceptable — no violation.
    - Body text uses 'buy-versus-build' with hyphens. Per rule [30], do not use an
      em-dash or en-dash to introduce a trailing clause, but this is a hyphenated
      compound adjective used attributively ('the buy-versus-build question'), which
      is standard and not a violation of that rule.
    - 'The body''s opening sentence repeats the structure and subject (''NatWest has
      adopted Equifax''s Verification Exchange platform'') almost identically to the
      headline''s core claim (''NatWest adopts Equifax platform''). Per rule [27],
      ''Do not weaken the body''s opening sentence in order to avoid repetition with
      the standfirst'' — but the stronger concern here is that the body opening mirrors
      the headline too directly. However, per rule [7], near-verbatim repetition across
      headline and body is flagged as a violation. The headline ''adopts Equifax platform''
      and the body ''NatWest has adopted Equifax''s Verification Exchange platform''
      are very close. Consider revising the body to lead with a different angle: ''Equifax''s
      Verification Exchange platform, now integrated into NatWest''s mortgage workflow,
      uses open banking data to automate income checks...'' or similar.'
  verification:
    verified: false
