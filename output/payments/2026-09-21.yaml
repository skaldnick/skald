- headline: UK Payments Delivery Company opens £50m equity raise to fund infrastructure
    build
  standfirst: Nineteen banks and payment firms are backing the formal fundraise, moving
    Britain's next-generation retail payments programme from consultation into capitalisation.
  body: 'The UK Payments Delivery Company (UK PDC) launched an equity capital raise
    on September 15, inviting eligible organisations across the payments ecosystem
    to become shareholders in the industry-owned entity tasked with building the country''s
    next retail payments infrastructure. The raise follows a call for initial funders
    in the fourth quarter of 2025, which brought 19 organisations together to support
    the programme''s mobilisation. Backers include the four largest high-street banks
    – Barclays, HSBC, Lloyds Banking Group and NatWest Group – alongside Citi, JPMorgan
    Chase, Nationwide, PayPal and Wise. Ernst & Young is administering expressions
    of interest on behalf of UK Finance.


    The reported funding target of roughly £50 million, first disclosed by Sky News,
    would finance the PDC through incorporation and mobilisation until 2028. Further
    capital will be needed to build the infrastructure itself. The Bank of England’s
    Retail Payments Infrastructure Board published a design consultation on June 25,
    with responses due by September 11; the resulting high-level blueprint is expected
    in the first quarter of 2027.


    The equity raise marks a concrete step beyond the policy declarations that preceded
    it. The Treasury’s National Payments Vision set the strategic direction, and the
    Bank of England established the governance model, but the PDC is the vehicle that
    must now translate ambition into engineering. The breadth of the initial backer
    group – spanning incumbent banks, US correspondent banks, a building society and
    fintechs – reflects the cross-industry consensus that underpins the programme,
    though questions remain about how governance and commercial incentives will be
    structured as the shareholder base widens.'
  editorial_note: The UK PDC equity raise, launched September 15, is a genuinely subsequent
    stage of the UK retail payments infrastructure story previously covered in May-June
    (initial announcements, consultation launch). The new material facts are the formal
    equity raise, the £50m target, the named 19-backer group, and the Q1 2027 blueprint
    timeline. Source is the FinTech Futures report from September 18, which draws
    on the UK PDC’s own announcement and Sky News reporting.
  sources: '[UK PDC opens fundraising for national payments system](https://www.fintechfutures.com/paytech/uk-payments-delivery-company-opens-fundraising-for-new-national-payments-system)
    — FinTech Futures'
