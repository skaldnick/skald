- headline: Danske Bank completes agentic payment with Mastercard
  standfirst: The first publicly reported agentic payment involving a Nordic bank
    signals the use case is spreading beyond early movers in France and southern Europe.
  body: 'Danske Bank and Mastercard have completed a payment in which an AI agent,
    acting on behalf of a consumer, carried out both the purchase and the payment.
    The transaction represents the first publicly reported agentic payment involving
    a Nordic bank.


    Agentic payments, in which AI systems autonomously initiate and complete transactions
    on a user''s behalf, have moved from concept to live execution over the past six
    months. Credit Agricole completed France''s first production agentic payment in
    June; ING, Worldline and Mastercard ran Europe''s first earlier that month. Danske
    Bank''s completion extends the geographic footprint into the Nordics and adds
    another issuing bank to the live roster.


    Mastercard has been the most active card network in building out agentic infrastructure,
    having launched its Agent Pay framework and partnered with multiple European banks
    and fintechs. Visa has taken a parallel path through its partnership with OpenAI
    and its own European pilots. The competitive dynamic between the two networks
    is shaping how agentic commerce will settle, with implications for whether card
    rails or account-to-account alternatives ultimately carry the volume.'
  editorial_note: Agentic payments are rapidly moving from pilot to production across
    Europe; Danske Bank's involvement extends the use case to the Nordics and adds
    another data point to the Mastercard-Visa competitive dynamic.
  sources: '[Danske Bank performs AI agent transaction with Mastercard](https://www.finextra.com/pressarticle/110960/danske-bank-performs-ai-agent-transaction-with-mastercard?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Body text uses ''account-to-account'' instead of spelling it out per house
      style rule on non-standard abbreviations. The rule states: ''Prefer spelling
      out non-standard abbreviations/acronyms, such as "account-to-account" instead
