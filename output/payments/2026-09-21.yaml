- headline: 'Riverty opens Luxembourg bank to scale European payments

    '
  standfirst: 'The new banking licence gives the Bertelsmann-owned fintech direct
    access to euro payment infrastructure and a platform to expand consumer finance
    across multiple markets.

    '
  body: 'Riverty has opened Riverty Bank in Luxembourg, securing a banking licence
    that provides direct access to euro-denominated payment systems and the regulatory
    passport to operate across the European Economic Area. The entity will serve as
    the platform for expanding Riverty''s payments and consumer finance products across
    Europe.


    Riverty, owned by Bertelsmann, has been building out its position in European
    buy-now-pay-later and payment services. A full banking licence in Luxembourg,
    a jurisdiction favoured by fintechs for its passporting reach and regulatory familiarity
    with payment institutions, gives Riverty the balance sheet flexibility and infrastructure
    access that a payment institution licence alone does not.


    The move follows a pattern of European fintechs securing banking licences to reduce
    reliance on partner banks and access clearing and settlement systems directly.
    Revolut, Mollie (through its GoCardless acquisition) and others have pursued similar
    strategies. For Riverty, the licence also supports its ambitions in consumer credit,
    where holding deposits and lending on its own balance sheet provides structural
    advantages over intermediated models.

    '
  editorial_note: 'Riverty''s Luxembourg bank opening is a concrete step in the broader
    trend of European fintechs obtaining banking licences to gain infrastructure access
    and reduce intermediation costs.

    '
  sources: '[Riverty opens bank in Luxembourg](https://www.finextra.com/pressarticle/110949/riverty-opens-bank-in-luxembourg?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'The new banking licence' which restates the headline's
      core action ('opens Luxembourg bank'). Per rule 1, the standfirst should begin
      with a substantive point not already named in the headline. Recast to open with
      the consequence or strategic point — eg, 'Direct access to euro payment infrastructure
      and a regulatory passport give Riverty…'
    - Body opening sentence 'Riverty has opened Riverty Bank in Luxembourg' repeats
      the headline's core claim verbatim. Per rule on avoiding near-verbatim repetition,
      the body must be self-contained and not duplicate the headline's phrasing. Recast
      — eg, 'The new entity provides direct access to euro clearing and settlement
      systems, and grants Riverty a regulatory passport to operate across the European
      Economic Area.'
    - Paragraph 2 opens with 'The move follows a pattern…' which is a scene-setter
      that delays the substantive point. Per rule on not opening paragraphs with hedging
      scene-setters, lead directly with the substantive claim — eg, 'European fintechs
      including Revolut and Mollie (through its GoCardless acquisition) have secured
      banking licences to reduce reliance on partner banks and access clearing and
      settlement systems directly.'
    - Editorial note included in submission. Per house style rules, do not include
      editorial notes in the story submission; notes about context or background belong
      in your communication to editors, not in the formatted copy.
