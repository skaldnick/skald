title: 'ECB launches Pontes; Danske Bank completes agentic payment; Riverty opens
  Luxembourg bank

  '
social_post: 'ECB''s Project Pontes goes live, Danske Bank runs an agentic payment
  with Mastercard, and Riverty opens a Luxembourg bank to scale European payments.
  Today''s briefing: {link}

  '
