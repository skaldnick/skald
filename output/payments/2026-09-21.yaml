      (A2A)'' on first use.'
    - Standfirst opens with 'A Nordic bank' rather than the substantive point. Per
      rule [1], the standfirst should not open by naming the organisation that is
      also named in the headline (Danske Bank). Instead, begin with the substantive
      point or action — eg, 'The completion signals...' rather than 'A Nordic bank
      joining...'
    - Body text contains 'earlier the same month' which is a vague temporal reference.
      Per house style, avoid vague references like 'earlier this month' and use specific
      dates instead — e.g., 'on June [specific date]'.
