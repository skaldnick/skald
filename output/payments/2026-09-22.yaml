- headline: Moldova explores connecting its instant payments system to the ECB's TIPS
    platform
  standfirst: Connecting the country's MIA system to TIPS would enable instant euro
    transfers between Moldova and EU member states, extending Europe's real-time payments
    infrastructure to a second non-EU country this year.
  body: 'The National Bank of Moldova has begun exploring the technical and regulatory
    steps needed to integrate its domestic instant payment system, MIA, with the ECB''s
    TARGET Instant Payment Settlement platform. If completed, Moldovan citizens and
    businesses would be able to make cross-border euro transfers to and from EU countries
    in seconds rather than relying on traditional correspondent banking channels.


    Moldova joined SEPA in February, giving its banks access to standard euro credit
    transfers across 36 countries. A TIPS connection would go further, enabling real-time
    settlement at a fraction of the cost of existing cross-border routes. The central
    bank says remaining hurdles include automatic on-the-fly currency conversion between
    the Moldovan leu and the euro, alignment of cybersecurity protocols and full compliance
    with Eurosystem rules. The two platforms currently operate in isolation within
    their respective currency zones.


    The initiative sits in a broader pattern of TIPS expanding beyond the eurozone
    and EEA. Iceland connected to TIPS in June, and the ECB has exploration or realisation
    phases under way to interlink TIPS with Switzerland''s instant payments system
    and India''s Unified Payments Interface. For Moldova, an EU candidate country,
    instant payments integration serves a dual purpose: reducing remittance costs
    for the large Moldovan diaspora in the EU and aligning the country''s financial
    infrastructure with European standards ahead of accession.'
  editorial_note: New story not duplicated in the previously covered list. Iceland
    joining TIPS was covered on June 25 but Moldova is a distinct country and a separate
    development. The source is a Moldovan news outlet that appears to draw on official
    National Bank of Moldova communications. The story connects to the broader TIPS
    expansion theme and Moldova's EU candidate status, giving it wider significance
    for European payments professionals.
  sources: '[Moldova''s MIA Instant Payment System Could Join EU TIPS Platform](https://logos-pres.md/en/news/the-mia-system-is-being-integrated-with-the-european-tips/)
    — Logos Press'
  style_check:
    compliant: false
    warnings:
