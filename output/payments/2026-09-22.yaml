    - 'Standfirst does not name the organisation that appears in the headline (ECB),
      but this is correct per rule [1]. However, the standfirst''s opening ''The decision
      to become a direct investor'' is a vague temporal/thematic reference rather
      than anchoring the reader in the specific development. Rule: ''The standfirst
      must name the specific stakes or consequences of the story — naming the initiatives,
      programmes or competitive dynamics affected — rather than making a generic thematic
      claim.'''
    - 'Body text uses ''distributed ledger technology transactions'' on first mention
