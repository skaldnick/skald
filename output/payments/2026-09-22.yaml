      the country's MIA system to TIPS would enable…' — rather than restating the
      agent. This violates the rule against opening the standfirst by naming the organisation
      identified in the headline.
    - 'Standfirst uses ''MIA'' without spelling it out on first mention. Per the rule
      on abbreviations in standfirsts, common and recognisable abbreviations may be
      used without spelling out, but ''MIA'' (Moldova''s Instant payments system)
      is non-standard and not widely recognised. The standfirst should spell it out:
      ''its domestic instant payment system, MIA'' or introduce it differently to
      establish what it is.'
    - Body text includes 'TARGET Instant Payment Settlement platform' with the abbreviation
      'TIPS' but does not apply the rule correctly. The abbreviation should be introduced
      on first use in the body as 'TARGET Instant Payment Settlement (TIPS) platform'
      since TIPS recurs later in the piece ('TIPS connection', 'TIPS expanding', 'TIPS
      with Switzerland's'). The full form must appear on first use in the body, even
      if TIPS was mentioned in the standfirst.
