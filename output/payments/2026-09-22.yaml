- headline: 'Estonia''s Mifundo partners with Yapily for cross-border credit scoring

    '
  standfirst: 'The partnership connects open banking account data from multiple European
    markets into a single credit profile, testing whether cross-border data aggregation
    can underpin pan-European lending decisions.

    '
  body: 'Mifundo, a Tallinn-based credit data platform, is partnering with Yapily
    to integrate open banking data from across Europe into its cross-border credit
    profiles. The arrangement gives Mifundo access to Yapily''s bank connectivity
    across several European markets, with a particular focus on SME and corporate
    account coverage.


    Cross-border credit assessment has long been constrained by the fragmentation
    of financial data across national systems. Open banking APIs offer a technical
    route to aggregation, but the commercial case depends on lenders being willing
    to accept account-level transaction data from foreign institutions as a reliable
    underwriting input. Mifundo''s model positions it as an intermediary that normalises
    this data for credit decisions.


    The partnership sits within a broader pattern of open banking infrastructure being
    applied to lending rather than payments. The FCA''s September consultation on
    using rent payment data in mortgage affordability checks and the UK chancellor''s
    July announcement on open finance for SME lending both reflect the same logic:
    that account data, once accessible, finds its highest-value use in credit.

    '
  editorial_note: 'A concrete example of open banking data being used for cross-border
    credit, which is where much of the commercial value in open finance is expected
    to materialise.

    '
  sources: '[Estonia''s Mifundo partners with Yapily to build more complete cross-border
    credit profiles](https://bebeez.eu/2026/09/21/estonias-mifundo-partners-with-yapily-to-build-more-complete-cross-border-credit-profiles/)
    — Bebeez | [Estonia''s Mifundo partners with Yapily to build more complete cross-border
    credit profiles](https://arcticstartup.com/mifundo-and-yapily-partner/) — Arcticstartup'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (Mifundo) that is also named in
      the headline. Per rule [1], the standfirst should begin with the substantive
      point or action instead — eg, 'The partnership connects...' rather than naming
      Mifundo first.
    - Body text uses 'the FCA' before an acronym-only organisation name. Per rule
      (The MAS rule), use the acronym directly without 'the' — write 'FCA's September
      consultation' not 'The FCA's September consultation'.
  verification:
    verified: true
    stale: true
    duplicate: false
