- headline: Alchemy integrates with Mastercard Agent Pay for onchain agentic commerce
  standfirst: The integration gives blockchain developers a route to embed Mastercard
    payment credentials into AI agents, bridging onchain infrastructure with traditional
    card acceptance.
  body: 'Alchemy, a developer platform for blockchain applications, is integrating
    its AgentCard product with Mastercard''s Agent Pay service. The partnership allows
    developers building AI agents on blockchain infrastructure to embed Mastercard
    payment credentials, enabling those agents to complete purchases at merchants
    that accept Mastercard without requiring bespoke payment integrations.


    Mastercard launched Agent Pay as part of its broader push to standardise how AI
    agents authenticate and transact across its network. Alchemy''s integration extends
    that capability into the onchain economy, where AI agents are increasingly being
    built to manage wallets, execute transactions and interact with decentralised
    applications. By linking these agents to Mastercard''s existing merchant acceptance
    network, the partnership sidesteps the limited merchant footprint that constrains
    many crypto-native payment methods.


    Mastercard has been building out its agentic payments architecture over the past
    year, and Alchemy''s integration adds a blockchain-native distribution channel.
    Card networks are positioning onchain developers as a meaningful source of future
    transaction volume.'
  editorial_note: This extends the agentic payments infrastructure story into the
    intersection of card networks and blockchain platforms, a convergence relevant
    to European issuers and processors evaluating how AI agent commerce will settle.
  sources: '[Alchemy integrates with Mastercard''s Agent Pay](https://www.finextra.com/pressarticle/110970/alchemy-integrates-with-mastercards-agent-pay?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'Mastercard' which is also named in the headline.
      Rule 1 requires opening with the substantive point instead — begin with 'The
      integration gives…' or similar, avoiding redundant repetition of the subject.
    - Body paragraph 2 contains 'The move connects' which announces the significance
      before explaining it. Rule on 'never flag significance explicitly' — rewrite
      to state the substantive point directly without framing language.
    - Body paragraph 3 states 'Mastercard has been systematically building out its
      agentic payments architecture through 2026' — this is vague temporal reference.
      Rule requires specific time periods; clarify what period 'through 2026' covers
      or use a precise date if available.
    - Body paragraph 3 mentions 'Visa's rival efforts' — this is vague. The rule on
      'one of a growing number' and specificity requires either naming the rival efforts
      specifically or removing the vague reference.
