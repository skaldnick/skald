- headline: ECB official outlines payment strategy for a tokenised world
  standfirst: In an interview with Deutsche Bank's Flow magazine, Thomas Vlassopoulos,
    the ECB's head of market infrastructure development, has set out how the central
    bank sees its payment infrastructure evolving, including TIPS expansion linking
    the euro area with Denmark and Sweden and the new Project Pontes for tokenised
    asset settlement.
  body: 'In an interview published by Deutsche Bank''s Flow magazine, Vlassopoulos
    laid out the central bank''s strategic thinking on how European payment infrastructure
    must adapt to a tokenised financial landscape. He described a window of opportunity
    for Europe to shape the infrastructure connecting tokenised assets with central
    bank money, while warning that the window will not remain open indefinitely.


    The interview covers the ECB''s parallel workstreams: the recently launched Project
    Pontes, which aims to connect tokenised assets with central bank money settlement;
    the expansion of TIPS for cross-currency instant payments, which went live linking
    the euro area with Denmark and Sweden in June; and the pipeline for further interlinking,
    including the Swiss Interbank Clearing instant payments system and the Norwegian
    krone. Vlassopoulos framed these as complementary layers of a broader strategy
    to ensure European payment sovereignty extends into both real-time retail and
    wholesale tokenised markets.


    Vlassopoulos''s emphasis on urgency echoes the Bank of Finland''s earlier framing
    of payment autonomy as a geopolitical imperative, and aligns with the European
    Parliament''s recent vote to advance the digital euro to final negotiations. The
    ECB expects the transition from pilot to production across these programmes to
    move quickly, with the infrastructure official responsible for building these
    systems signalling that the current window for Europe to set the terms will not
    stay open.'
  editorial_note: A senior ECB infrastructure official setting out integrated strategy
    across Pontes, TIPS cross-currency expansion, and tokenisation provides a rare
    joined-up view of how European payment rails are being redesigned. Material for
    anyone planning around these initiatives.
  sources: '[Thomas Vlassopoulos on the ECB''s payment strategy in a tokenised world
    – Deutsche Bank](https://flow.db.com/Topics/cash-management/europe-has-a-window-of-opportunity-but-it-will-not-be-open-forever)
    — Flow'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming Thomas Vlassopoulos and his title, then repeats this
      information verbatim in the body's opening sentence ('Thomas Vlassopoulos, head
      of market infrastructure development at the ECB'). While the rule permits restating
      the standfirst's point in different wording in the body, near-identical repetition
      of the same phrasing across standfirst and body violates the spirit of avoiding
      redundancy. Consider varying the body's opening — eg, 'In an interview published
      by Deutsche Bank's Flow magazine, Vlassopoulos laid out...'
    - 'Third paragraph opens with ''The remarks carry weight because they come from
      the official responsible for building the infrastructure that underpins these
      initiatives.'' This explicitly flags significance before stating the substantive
      point, violating the rule against announcing importance (''This matters because'',
      ''The significance here is'', etc.). Recast as: ''Vlassopoulos''s emphasis on
      urgency echoes the Bank of Finland''s earlier framing...'' to lead directly
      with substance.'
    - Third paragraph states 'For banks and payment providers, the message is that
      the ECB expects the transition from pilot to production across these programmes
      to move quickly.' This frames relevance with an audience-address clause ('For
      banks and payment providers'), violating the rule against opening paragraphs
      with such constructions. Integrate the implication directly into the narrative
      instead — eg, 'Banks and payment providers should expect the ECB to accelerate
      the transition from pilot to production...'
    - 'Standfirst uses ''cross-currency instant payments'' without explaining what
      this expansion entails. Body clarifies it ''went live linking the euro area
      with Denmark and Sweden in June'', but the standfirst lacks this specificity.
      The standfirst must name the specific stakes or consequences rather than making
      a generic thematic claim. Consider: ''...the central bank sees its payment infrastructure
      evolving, including TIPS expansion linking the euro area with Denmark and Sweden''.'
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - 'Could not independently verify: The cited Deutsche Bank Flow interview with
      Vlassopoulos. The publication date of the source article itself could not be
      confirmed, only the existence of Deutsche Bank''s Flow magazine.'
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised body opening to lead with 'In an interview published by Deutsche Bank's
      Flow magazine, Vlassopoulos laid out…' to avoid near-verbatim repetition of
      the standfirst's naming and titling of Vlassopoulos.
    - Removed the explicit significance-flagging sentence ('The remarks carry weight
      because they come from the official responsible…') from the third paragraph
      and led directly with the substantive point about Vlassopoulos's emphasis on
      urgency.
    - Removed the audience-address clause 'For banks and payment providers, the message
      is that…' and recast the final sentence to state the ECB's expectation directly
      without framing it as a message to a named audience.
    - Revised standfirst to name specific stakes — TIPS expansion linking the euro
      area with Denmark and Sweden, and Project Pontes — rather than making a generic
      thematic claim about tokenised assets and cross-currency instant payments.
