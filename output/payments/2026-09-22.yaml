- headline: ECB to buy tokenised securities with its own funds, settled through Pontes
  standfirst: The decision to become a direct investor in tokenised debt, not just
    a provider of settlement infrastructure, turns the central bank into an active
    market participant in Europe's nascent digital asset ecosystem.
  body: 'The European Central Bank has begun preparatory work to invest a portion
    of its own funds portfolio in tokenised securities. Initial purchases will focus
    on euro-denominated debt issued by euro area governments, agencies and European
    supranational institutions, settled in central bank money through Pontes, the
    Eurosystem''s wholesale settlement system for distributed ledger technology transactions
    that went live on September 21.


    The own funds portfolio is a non-monetary policy portfolio used to generate income
    to cover operating expenses. By investing directly, the ECB says it will gain
    first-hand experience across the full investment lifecycle, from trade execution
    and settlement to systems and portfolio management. The central bank has not disclosed
    how much it will invest or when the first purchase will take place; ECB executive
    board member Piero Cipollone said Pontes would give the tokenised finance ecosystem
    "an important advantage to help it scale".


    Thirteen institutions, including Deutsche Bank, Santander, Societe Generale and
    the European Investment Bank, have completed onboarding and can transact on Pontes
    immediately. Enhanced features and longer operating hours are expected by 2028.
    A separate initiative, Appia, will deliver a blueprint for a broader DLT-based
    European financial ecosystem by the same date.'
  editorial_note: 'The Pontes infrastructure launch was covered on September 21 as
    a previously covered story. This piece focuses on the distinct and materially
    new announcement made the same day: the ECB''s decision to invest its own funds
    in tokenised securities — making it a direct market participant, not merely a
    settlement provider. This is a separate ECB press release with different implications
    for the market.'
  sources: '[ECB launches ''Pontes'' to settle tokenised assets in central bank money](https://www.euronews.com/business/2026/09/21/ecb-launches-pontes-to-settle-tokenised-assets-in-central-bank-money)
    — Euronews'
