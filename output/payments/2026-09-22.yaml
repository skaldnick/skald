title: 'Russian fintech sanctions evasion; GoCardless agentic A2A; Alchemy joins Mastercard
  Agent Pay

  '
social_post: 'A Kremlin-backed fintech allegedly moved $6.9bn through global banks
  using forged documents. Plus: GoCardless claims a UK first with agentic account-to-account
  payments, and agentic commerce''s infrastructure keeps filling in. {link}

  '
stories:
- headline: Russian fintech A7 allegedly laundered $6.9bn through global banks, says
    Financial Times
  standfirst: Forged documents allowed a Kremlin-controlled payments company to access
    the international banking system, raising fresh questions about sanctions enforcement
    across correspondent banking networks.
  body: 'A7, a Russian payments company established to bypass western financial infrastructure,
    allegedly used forged documentation to open correspondent banking relationships
    and funnel approximately $6.9 billion through some of the world''s largest banks.
    The Financial Times investigation, published on September 21, describes the scheme
    as relying on "old-fashioned money laundering" rather than sophisticated technological
    exploits to circumvent sanctions controls.


    The operation exploited weaknesses in banks'' onboarding and ongoing due diligence
    for correspondent relationships. A7 reportedly presented falsified credentials
    to gain access to the international financial system, then routed payments on
    behalf of Russian state companies subject to western sanctions. The banks involved
    have not been named in all cases, but the scale of the flows suggests that multiple
    institutions across several jurisdictions processed the transactions.


    The case lands as European and US regulators are already tightening expectations
    around real-time sanctions screening and correspondent banking controls. Banks
    have warned the EU''s Anti-Money Laundering Authority that the speed of instant
    payments makes real-time monitoring difficult. A7''s alleged success in exploiting
    more traditional vulnerabilities suggests that the compliance challenge extends
    well beyond transaction speed to the integrity of basic counterparty verification.'
  editorial_note: A $6.9 billion sanctions evasion case through mainstream correspondent
    banking channels is directly material to European payments compliance and reinforces
    live debates around AML controls for instant payments.
  sources: '[Russian fintech A7 exploited bank controls to funnel billion of dollars
    in sanctioned payments](https://www.finextra.com/newsarticle/48446/russian-fintech-a7-exploited-bank-controls-to-funnel-billion-of-dollars-in-sanctioned-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra | [Russian FinTech Allegedly Laundered $6.9 Billion Via Global Banks](https://www.pymnts.com/news/banking/2026/russian-fintech-allegedly-laundered-6-9-billion-via-global-banks/)
    — PYMNTS'
