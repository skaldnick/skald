    - Rule 35 requires naming the source organisation in the headline when a statistic
      or finding is attributed to a specific organisation. The headline attributes
      the allegation to A7 but does not explicitly name the source of the investigation
      (Financial Times). The headline 'Russian fintech A7 allegedly laundered $6.9bn
      through global banks' attributes the allegation to A7 itself rather than to
      the investigator. Consider whether the FT should be named in the headline to
      clarify the source of the claim.
    - The standfirst describes 'a Kremlin-controlled payments company' but the body
      text introduces 'A7, a Russian fintech established as an alternative to western
      payment systems'. These are near-verbatim repetitions of the same substance
      (Kremlin connection and description of A7) across standfirst and body. While
      some repetition is acceptable when developing a point in more depth, the phrasing
      here is too similar and should be varied in the body to avoid redundancy.
