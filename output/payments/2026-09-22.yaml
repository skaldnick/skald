    - The editorial note states 'The source is a Moldovan news outlet that appears
      to draw on official National Bank of Moldova communications.' Per the rule against
      including editorial notes about missing information or source limitations, this
      editorial commentary should not appear. If the source is uncertain, either omit
      the story or establish facts from a primary source; do not flag sourcing doubts
      in an editorial note.
    - The standfirst references 'a second non-EU country this year' but the context
      for this claim requires the reader to know Iceland joined in June. While the
      body does provide this, the standfirst's phrasing is vague about which countries
