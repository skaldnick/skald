- headline: GoCardless claims first agentic account-to-account payment in the UK
  standfirst: The transaction, an AI-driven charitable donation processed via open
    banking rails, marks a step toward agentic commerce operating beyond card networks.
  body: 'An AI agent has initiated and completed a charitable donation via open banking
    rails on the GoCardless website, in what the company describes as the first agentic
    account-to-account (A2A) payment in the UK. The donation was made for Trussell,
    the anti-poverty charity and food bank network, without a human interacting directly
    with a payment interface.


    The milestone sits within a rapidly developing agentic payments landscape in Europe.
    Over the past several months, Mastercard, Visa, Blik and Credit Agricole have
    each completed agentic payment transactions, but these have predominantly run
    over card rails or proprietary networks. GoCardless''s transaction is distinct
    in using open banking-based A2A infrastructure, suggesting that the emerging agentic
    commerce layer need not default to card-based settlement.


    If AI agents are to handle recurring payments, subscriptions and donations autonomously,
    the ability to initiate bank transfers without card credentials becomes a competitive
    differentiator for A2A providers. GoCardless, now owned by Mollie following the
    acquisition completed earlier this month, is positioning the combined group''s
    open banking infrastructure as ready for this shift.'
  editorial_note: Agentic payments have been a headline theme through 2026, but most
    demonstrations have used card rails. GoCardless claiming the first UK agentic
    account-to-account transaction signals open banking providers are entering the
    race directly.
  sources: '[GoCardless processes first agentic account-to-account transaction in
    the UK](https://www.finextra.com/pressarticle/110969/gocardless-processes-first-agentic-account-to-account-transaction-in-the-uk?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
