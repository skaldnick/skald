- headline: Airtel Money files for London IPO at up to $9bn valuation
  standfirst: A listing that could value the mobile payments business at up to $9
    billion would test whether London can still attract high-growth fintechs after
    a string of departures to New York.
  body: 'Airtel Money, the mobile payments arm of Airtel Africa, is preparing to file
    for a London initial public offering that could raise at least $800 million and
    value the business at up to $9 billion. The listing would separate the payments
    business from its parent and give it direct access to public capital markets.


    The IPO arrives at a sensitive moment for the London Stock Exchange, which has
    seen a succession of fintechs either move their primary listing to the US or choose
    New York over London for new offerings. Wise confirmed plans to shift its primary
    listing to the US in April. A successful Airtel Money debut would be a counterpoint,
    though the logic is different: Airtel Money''s core operations are across sub-Saharan
    Africa, and London has traditionally been a stronger listing venue for companies
    with African and emerging-market exposure than US exchanges.


    Airtel Money processes mobile payments across 14 African markets and has been
    growing transaction volumes rapidly as mobile money adoption deepens across the
    continent. The business sits at the intersection of mobile telecoms and payments
    infrastructure in markets where traditional banking penetration remains low.'
  editorial_note: ''
  sources: '[Airtel Money to launch London IPO](https://www.finextra.com/newsarticle/48457/airtel-money-to-launch-london-ipo?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens with ''The listing would be one of the largest fintech IPOs
      in London in years'' — this breaches the rule against opening with vague significance
      framing (''one of the largest''). The rule states: ''Do not describe a development
      as "one of a growing number" in a way that hedges its significance.'' This phrasing
      hedges rather than stating the substantive point directly.'
    - 'Editorial note states ''A potential $9 billion London fintech IPO is significant
      for the European capital markets landscape'' — this breaches the rule against
      flagging significance explicitly. The rule states: ''Never flag significance
      explicitly. Do not write sentences that announce importance before explaining
      it.'' Editorial notes should not be included in the final copy; this appears
      to be an instruction note that should be removed.'
    - Body text uses 'sub-Saharan Africa' — the rule requires avoiding foreign diacritics
      and accents where possible, but this is not a proper noun with diacritics. However,
      more importantly, the phrase 'one of the largest' appears implicitly in the
      standfirst ('one of the largest fintech IPOs') which violates the hedging rule
      noted above.
