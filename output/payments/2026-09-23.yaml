- headline: Russian fintech A7 funnelled billions in sanctioned payments through global
    banks
  standfirst: A Financial Times investigation reveals how a Kremlin-controlled fintech
    exploited weaknesses in bank compliance controls to process sanctions-busting
    payments for Russian state companies.
  body: 'A7, a Russian fintech with ties to the Kremlin, tricked international banks
    into handling billions of dollars in payments to Russian state companies subject
    to Western sanctions, according to an investigation by the Financial Times. The
    scheme exploited gaps in bank compliance controls, routing payments through intermediaries
    in ways that obscured their ultimate origin and destination.


    The scale of the operation raises pointed questions about the effectiveness of
    sanctions enforcement in the payments chain. Banks have invested heavily in sanctions
    screening since 2022, and regulators across Europe and the US have repeatedly
    tightened expectations around correspondent banking due diligence. The A7 case
    suggests that a determined, state-backed actor can still find systematic vulnerabilities,
    particularly where fintech intermediaries sit between sanctioned entities and
    the global banking system.


    The investigation is likely to intensify regulatory scrutiny of fintech counterparties
    and the adequacy of know-your-customer procedures applied to payment facilitators
    operating in or adjacent to sanctioned jurisdictions. The European Banking Authority
    and national regulators have already been pressing for stronger anti-money-laundering
    controls as instant payment volumes grow.'
  editorial_note: A massive sanctions-evasion scheme exploiting bank payment controls
    is directly relevant to European payments professionals dealing with compliance,
    correspondent banking and AML obligations.
  sources: '[Russian fintech A7 exploited bank controls to funnel billion of dollars
    in sanctioned payments](https://www.finextra.com/newsarticle/48446/russian-fintech-a7-exploited-bank-controls-to-funnel-billion-of-dollars-in-sanctioned-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Body opening: ''For European payment processors and correspondent banks, the
      investigation is likely to intensify regulatory scrutiny...'' — This opens a
      paragraph with ''For European [audience]'' which violates the rule: ''Do not
      frame a paragraph around its relevance to European readers by opening with "For
      European payments professionals, …" or equivalent constructions.'' Rewrite to
      state the point directly without the audience-address clause.'
    - 'Body paragraph three: ''For European payment processors and correspondent banks''
      is vague scene-setting that delays the substantive point. Lead directly with
      the substantive claim — e.g., ''European regulators are likely to intensify
      scrutiny...'' rather than framing it as a consequence for a named audience.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Rewrote the opening of the third paragraph to remove the audience-address clause
      'For European payment processors and correspondent banks,' and instead lead
      directly with the substantive claim about regulatory scrutiny.
- headline: Tink founders launch AI compliance startup after $2bn exit
  standfirst: Daniel Kjellen and Fredrik Hedberg, whose open banking platform Tink
    was acquired by Visa in 2022, have emerged from stealth with Freda, an AI-native
    compliance startup.
  body: 'Daniel Kjellen and Fredrik Hedberg, co-founders of the open banking platform
    Tink, have launched Freda, a bootstrapped AI-native compliance startup that has
    been operating in stealth. Tink was acquired by Visa for $1.9 billion in 2022
    and now forms part of Visa''s open banking infrastructure.


    Freda''s focus on compliance reflects a growing recognition that regulatory obligations,
    particularly around anti-money-laundering, fraud prevention and transaction monitoring,
    represent one of the most acute operational pain points for banks and payment
    providers. The founders chose to bootstrap rather than raise venture capital,
    an unusual approach at a time when many AI startups are raising large rounds,
    suggesting either a deliberate constraint on growth pace or confidence in reaching
    revenue quickly.


    Several successful European fintech founders have returned to build in adjacent
    categories. Kjellen and Hedberg appear to see AI-driven compliance tooling as
    an underdeveloped market with significant demand from the institutions they previously
    served as infrastructure providers.'
  editorial_note: The return of Tink's founders to the European fintech scene with
    a compliance-focused AI startup is relevant to the sector's ongoing challenges
    around regulatory burden and the potential for AI to reshape compliance operations.
  sources: '[From one of Europe''s biggest fintech exits to bootstrapping an AI startup:
    ''There''s no limitation''](https://sifted.eu/articles/tink-founders-launch-freda)
    — Sifted'
  style_check:
    compliant: false
    warnings:
    - 'Body paragraph 2, sentence 2: ''The founders'' decision to bootstrap rather
      than raise venture capital is notable at a time when many AI startups are raising
      large rounds'' — violates rule against explicitly flagging significance with
      ''is notable''. State the substantive point directly instead.'
    - 'Body paragraph 3, sentence 1: ''The venture is part of a broader pattern of
      successful European fintech founders returning to build in adjacent categories''
      — violates rule against framing with ''is part of a broader pattern''. State
      the substantive point directly.'
    - 'Body paragraph 3, sentence 2: ''the move signals that experienced operators
      see AI-driven compliance tooling as an underdeveloped market'' — violates rule
      against starting headline, standfirst, and body opening sentence with same word
      or phrase. The headline opens with ''Tink founders launch'', the standfirst
      opens with ''Daniel Kjellen and Fredrik Hedberg'', and the body opens with ''Daniel
      Kjellen and Fredrik Hedberg'' — but this paragraph then opens a new sentence
      with ''the move'', which echoes the standfirst''s ''the move signals''. Vary
      the opening.'
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - SEC filings state Tink was acquired for $1.9 billion, not approximately $2 billion
  revision:
    replaced: false
