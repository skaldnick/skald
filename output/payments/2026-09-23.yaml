title: 'GoCardless agentic payment; Airtel Money IPO; Russian sanctions evasion; Tink
  founders resurface

  '
social_post: 'GoCardless claims the UK''s first agentic account-to-account payment.
  Plus: Airtel Money eyes a London IPO, a Russian fintech exploited bank controls
  on a massive scale, and Tink''s founders are back. {link}

  '
stories:
- headline: GoCardless processes first agentic account-to-account payment in the UK
  standfirst: The transaction marks a milestone for account-to-account rails in the
    emerging agentic payments category, where most early activity has run over card
    networks.
  body: 'GoCardless has completed what it describes as the first agentic account-to-account
    payment in the UK, processing an AI-driven charitable donation to the anti-poverty
    charity Trussell. The transaction was initiated and executed by an AI agent on
    the GoCardless website without manual human intervention at the point of payment.


    Agentic payments, where AI systems autonomously initiate and complete transactions
    on behalf of users, have been gathering momentum across Europe since early 2026.
    Until now, the category has been dominated by card-based implementations. Mastercard,
    Visa and several European banks have run agentic pilots using card credentials,
    and EMVCo has drafted a framework specifically for card-based agentic transactions.
    GoCardless''s move extends the concept to bank-to-bank rails, opening a parallel
    track that could prove significant for recurring and subscription payments where
    card-on-file has traditionally dominated.


    GoCardless, which was among the founding providers on the UK Payments Initiative
    when it went live on June 2 and reported its first profitable quarter in April,
    continues to position itself at the intersection of open banking infrastructure
    and emerging payment categories. Whether agentic account-to-account payments gain
    traction beyond demonstration use cases will depend on the development of consent
    frameworks and liability models that are still largely unresolved.'
  editorial_note: First agentic account-to-account payment in the UK extends the agentic
    payments trend beyond card rails, relevant to readers tracking the competitive
    dynamics between card networks and bank-to-bank schemes.
  sources: '[GoCardless processes the first agentic account-to-account payment in
    the UK](https://www.openbankingexpo.com/news/gocardless-processes-the-first-agentic-account-to-account-payment-in-the-uk/)
    — Openbankingexpo | [GoCardless processes first agentic account-to-account transaction
    in the UK](https://www.finextra.com/pressarticle/110969/gocardless-processes-first-agentic-account-to-account-transaction-in-the-uk?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
