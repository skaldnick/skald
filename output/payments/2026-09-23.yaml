    summary:
    - Corrected acquisition price from 'approximately $2 billion' to '$1.9 billion'
      per SEC filings.
    - Rewrote sentence 2 of paragraph 2 to remove 'is notable' construction, replacing
      with a direct statement of the founders' choice and its context.
    - Rewrote paragraph 3 sentence 1 to remove 'is part of a broader pattern' framing,
      stating the trend directly.
    - Revised paragraph 3 sentence 2 to avoid echoing 'the move signals' phrasing,
