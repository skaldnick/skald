title: 'Bunq completes Wero rollout; Tink founders launch compliance startup; Kenya
  drafts open finance law

  '
social_post: 'Bunq becomes first bank to roll out Wero across four European markets.
  Plus: Tink''s founders resurface with an AI compliance venture, and Kenya drafts
  open finance legislation. {link}

  '
stories:
- headline: Bunq becomes first bank to roll out Wero across four markets
  standfirst: The move gives EPI its first pan-European retail footprint through a
    single institution, covering both peer-to-peer and online checkout payments.
  body: 'Bunq has made Wero available for person-to-person payments and online purchases
    across the Netherlands, Germany, France and Belgium, becoming the first bank to
    complete a four-market rollout of the European Payments Initiative''s (EPI) payment
    method.


    EPI is assembling Wero''s reach country by country, with Austrian banks joining
    in June and the Payconiq-to-Wero migration in Luxembourg now under way. But coverage
    has largely depended on domestic banking groups activating the service market
    by market. Bunq''s rollout is structurally different: a single neobank offering
    consistent Wero functionality across borders, demonstrating the cross-market interoperability
    that EPI has promised but few institutions have yet delivered.


    A pan-European neobank treating Wero as a standard feature, rather than a market-specific
    add-on, signals that the infrastructure is maturing beyond national pilot phases.
    Whether traditional banks follow at comparable speed will determine how quickly
    Wero can build the merchant and consumer network effects it needs.'
  editorial_note: First bank to complete a four-market Wero rollout is a concrete
    milestone for EPI's cross-border ambitions, advancing a continuing story about
    European payment sovereignty.
  sources: '[Bunq first to complete Wero rollout across four markets](https://www.finextra.com/pressarticle/110986/bunq-first-to-complete-wero-rollout-across-four-markets?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (EPI) also named in the headline
      context (Wero is EPI's payment method). Per rule [1], avoid redundant repetition
      of the subject across headline and standfirst by beginning with the substantive
      point instead of 'The milestone gives EPI...' — consider opening with 'The move
      gives' or 'This provides' and then introducing EPI.
    - Body paragraph 2 contains 'EPI has been assembling' which uses simple present
      'has been' where present continuous 'is assembling' would better signal the
      ongoing nature per rule [9]. Consider 'EPI is assembling Wero's reach country
      by country...'
    - Body paragraph 3 opens with 'For Wero's credibility as a genuine alternative
      to card scheme wallets at checkout, breadth matters as much as depth.' This
      is a thematic opener that frames significance before stating the substantive
      point. Per rule [5], avoid 'This matters because' framing and state the substantive
      point directly. The sentence should lead with the concrete claim, not the framing
      of why it matters.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Standfirst changed 'The milestone gives EPI' to 'The move gives EPI' to avoid
      redundant repetition of the headline subject per rule [1].
    - Body paragraph 2 changed 'EPI has been assembling' to 'EPI is assembling' to
      use present continuous for an ongoing arrangement per rule [9].
    - Body paragraph 3 removed the thematic framing opener 'For Wero's credibility
      as a genuine alternative to card scheme wallets at checkout, breadth matters
      as much as depth.' and opened directly with the substantive claim per rule [5].
- headline: Tink founders launch AI compliance startup after $2bn exit
  standfirst: An agentic compliance platform built by the team behind Tink's $2 billion
    sale to Visa signals where open banking expertise is migrating next.
  body: 'Daniel Kjellen and Fredrik Hedberg, co-founders of open banking platform
    Tink, have launched Freda, a bootstrapped startup building what they describe
    as an agentic operating system for regulatory compliance. The platform is designed
    to automate complex compliance workflows using AI agents rather than traditional
    rules-based systems.


    Tink was acquired by Visa in 2022 for approximately $2 billion, becoming a central
    part of Visa''s open banking infrastructure in Europe. The founders'' decision
    to move into compliance rather than return to payments or data aggregation reflects
    a broader pattern: the operational complexity that open banking and open finance
    create, particularly around data governance and cross-border regulatory obligations,
    is generating its own market for automation tools.


    Freda is entering a compliance technology market that has attracted significant
    venture capital in recent years, driven by the expanding scope of financial regulation
    across jurisdictions. The founders are bootstrapping rather than raising external
    capital, which limits the pace of scaling but avoids the growth-at-all-costs dynamic
    that has strained other fintech business models.'
  editorial_note: The Tink founders are among the most consequential figures in European
    open banking; their next venture and the direction it takes warrant close attention.
  sources: '[Tink Founders Launch Freda: The First Agentic Operating System for Global
    Compliance](https://ffnews.com/news/news-fintech-unicorn-tink-founders-launch-new-venture-in-compliance-1cc85623)
    — Ffnews | [From one of Europe''s biggest fintech exits to bootstrapping an AI
    startup: ''There''s no limitation''](https://sifted.eu/articles/tink-founders-launch-freda)
    — Sifted'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (Visa) that is also named in the
      headline context ('Visa's open banking acquisition'). Per rule 1, avoid redundant
      repetition of the subject across headline and standfirst by beginning with the
      substantive point instead — e.g., 'signals where open banking expertise is migrating
      next' should lead, with the Tink/Visa context introduced after.
    - Editorial note states 'their next venture and the direction it takes are significant
      signals for the sector' — this flags significance explicitly. Per the rule against
      never flagging significance explicitly, remove the announcement of importance
      and write the substantive point directly without 'are significant signals'.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with the substantive point ('An agentic compliance
      platform…') rather than naming the organisation from the headline context, per
      rule 1.
    - Revised editorial note to remove explicit significance flagging ('are significant
      signals for the sector') and replaced with a direct statement ('warrant close
      attention').
- headline: Kenya drafts open finance law requiring banks and M-Pesa to share data
  standfirst: The proposed National Payment System Bill would mandate customer-authorised
    data sharing across banks and mobile money operators, extending the open finance
    model to one of Africa's most advanced mobile money markets.
  body: 'Kenya''s Treasury and the Central Bank of Kenya have jointly prepared a National
    Payment System Bill that would require banks, mobile money operators including
    Safaricom''s M-Pesa, and other payment service providers to share customer data
    with licensed third parties when customers consent. The legislation would also
    introduce new capital and interoperability requirements for fintechs operating
    in the payments market.


    Kenya''s payments landscape is unusual: M-Pesa processes the majority of retail
    transactions, giving Safaricom a dominant position that traditional open banking
    frameworks, designed around bank account data, do not neatly address. By explicitly
    including mobile money operators in the data-sharing mandate, the bill goes further
    than many existing open finance regimes and tackles the platform that matters
    most to Kenyan consumers.


    The bill places interoperability and open finance at the centre of the proposed
    market structure, requiring payment service providers to enable connectivity with
    competing platforms. The Kenyan approach applies open finance logic to a mobile-money-dominated
    market, testing whether the model can work outside the bank-centric environments
    where it was first developed. The bill also strengthens consumer protections around
    dispute resolution and data security.'
  editorial_note: ''
  sources: '[New Bill forces banks, M-Pesa to share customer data](https://www.businessdailyafrica.com/bd/economy/new-bill-force-banks-m-pesa-to-share-customer-data-5605244)
    — Business Daily | [New payments bill could open Kenya''s banking data to licensed
    third parties](https://techpoint.africa/insight/techpoint-digest-1438/) — Techpoint
    | [New Payment Bill Wants to Force Banks and M-PESA to Open Up Their Data](https://techweez.com/2026/09/22/kenya-national-payment-system-bill-2026/)
    — Techweez | [Kenya''s new payments bill could force banks to share customer data](https://techcabal.com/2026/09/22/kenya-proposes-forcing-banks-to-share-customer-data/)
    — TechCabal | [Kenya Proposes New Capital, Interoperability Rules for Fintechs](https://kenyanwallstreet.com/national-payment-system-bill)
    — The Kenyan Wall Street'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'Treasury and central bank' which are also named
      in the headline ('Kenya drafts'). Per rule [1], avoid redundant repetition of
      the subject across headline and standfirst — the standfirst should begin with
      the substantive point (the data-sharing mandate or its consequences) rather
      than the organisations. Rewrite to open with 'The move would mandate…' or similar.
    - Body text contains 'For European payments professionals, the Kenyan approach
      is worth watching:' which violates the rule against framing a paragraph around
      its relevance to European readers by opening with 'For European payments professionals,
      …'. Per rule [frame-european-dimension], if the European dimension is relevant,
      state it directly as part of the narrative without prefacing it with an audience-address
      clause.
    - 'Body text uses ''including Safaricom''s M-Pesa, and other payment service providers''
      — a ''such as'' or ''including'' construction — but does not specify a count.
      This is acceptable per rule [non-exhaustive-lists], but the phrasing ''including''
      without a count is correct. However, the preceding phrase ''mobile money operators
      including Safaricom''s M-Pesa'' should be checked: if M-Pesa is the only mobile
      money operator named, this is acceptable; if intended to signal others exist,
      it is correct. No violation detected here.'
    - Editorial note states 'Kenya mandating data sharing from mobile money operators
      as well as banks is a genuinely novel application' — do not include editorial
      notes in the copy itself. The editorial note should not appear in the published
      story. If this is an internal note, it should be removed from the final copy
      before publication.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings:
    - 'Could not independently verify: explicit mention of ''dispute resolution''
      protections in the bill; sources confirm consumer protection and data security
      emphasis but do not specifically cite dispute resolution provisions'
  revision:
    replaced: false
    resolved: true
    summary:
    - Rewrote standfirst to open with 'The proposed National Payment System Bill would
      mandate…' rather than naming the Treasury and central bank, avoiding redundant
      repetition of the subject from the headline.
    - Removed 'For European payments professionals,' audience-address clause from
