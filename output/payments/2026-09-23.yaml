- headline: ACI Worldwide connects cloud payments hub to Swift's shared ledger
  standfirst: Intelligent routing for Swift ledger transactions is now available through
    ACI's cloud-native platform, extending practical access to tokenised settlement
    infrastructure beyond the largest banks.
  body: 'ACI Worldwide is integrating Swift''s shared ledger into ACI Connetic, its
    cloud-native payments hub, enabling intelligent routing for transactions on the
    ledger. The move gives ACI''s bank clients a path to access Swift''s tokenised
    settlement rails without building direct integrations themselves.


    The integration extends access beyond the handful of large institutions participating
    directly in Swift''s pilots to the broader universe of mid-tier and regional banks
    that rely on vendor platforms for their payments processing. ACI''s client base
    spans more than 80 countries. Swift''s shared ledger has been progressing from
    prototype to pilot since BNP Paribas and HSBC completed the first corporate payment
    on it in September.


    Infrastructure vendors are positioning themselves as the connective layer between
    legacy payment systems and emerging tokenised settlement rails. ACI agreed to
    acquire Cranium Ventures on September 1 for cloud-native card switching, with
    the deal expected to close in the third quarter, and the Swift integration continues
    the theme of building out Connetic as a multi-rail hub.'
  editorial_note: 'ACI''s Swift ledger integration is more than a vendor announcement:
    it broadens practical access to tokenised settlement infrastructure beyond the
    largest banks, advancing a story tracked since BNP Paribas and HSBC''s first corporate
    payment on the ledger.'
  sources: '[ACI Worldwide connects with Swift''s ledger](https://www.finextra.com/pressarticle/110976/aci-worldwide-connects-with-swifts-ledger?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the organisation from the headline: ''The integration
      brings intelligent routing for Swift ledger transactions into ACI''s cloud-native
      platform'' — this repeats the ACI Worldwide subject. Per rule [1], the standfirst
      should begin with the substantive point, not by naming the organisation identified
      in the headline. Consider: ''Intelligent routing for Swift ledger transactions
      is now available through ACI''s cloud-native platform, extending practical access
      to tokenised settlement infrastructure beyond the largest banks.'''
    - 'Body paragraph 2 contains: ''The ACI integration is significant because it
      extends access'' — this explicitly flags significance before making the substantive
      point. Per rule [5], never announce importance before explaining it. Rewrite
      directly: ''The ACI integration extends access beyond the handful of large institutions
      participating directly in Swift''s pilots to the broader universe of mid-tier
      and regional banks that rely on vendor platforms for their payments processing.'''
    - 'Body paragraph 3 contains: ''The timing aligns with a wider push by infrastructure
      vendors to position themselves as the connective layer'' — this is a scene-setting
      construction that delays the substantive point. Per rule [18], do not open a
      paragraph with hedging or timing-focused scene-setters. Lead directly with the
      substantive claim: ''Infrastructure vendors are positioning themselves as the
      connective layer between legacy payment systems and emerging tokenised settlement
      rails.'''
    - 'Body paragraph 3 contains: ''ACI acquired Cranium Ventures earlier in September''
      — this is an imprecise temporal reference. Per rule [16], avoid vague phrases
      like ''earlier in September'' when a specific date is available. Use the precise
      date instead.'
    - Standfirst uses 'Swift's tokenisation infrastructure' but body text uses 'Swift's
      tokenised settlement infrastructure' — near-verbatim repetition of the same
      phrasing across standfirst and body. Per rule [7], while the body restating
      the standfirst's point in more depth is expected, this particular phrasing should
      be varied to avoid redundancy.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Story states ACI 'acquired' Cranium Ventures in September, but the transaction
      was only announced/agreed on Sept. 1, 2026 with closing expected in Q3 2026
      — not yet completed
  revision:
    replaced: false
    resolved: true
    summary:
    - Changed standfirst to open with the substantive point ('Intelligent routing
      for Swift ledger transactions…') rather than naming ACI, per rule [1]
    - Removed 'is significant because' from body paragraph 2, writing the substantive
      point directly per rule [5]
    - Rewrote body paragraph 3 opening to lead with the substantive claim ('Infrastructure
      vendors are positioning themselves…') rather than a timing-focused scene-setter,
      per rule [18]
    - Changed 'ACI acquired Cranium Ventures earlier in September' to 'ACI agreed
      to acquire Cranium Ventures on September 1… with the deal expected to close
      in the third quarter' to reflect that the transaction was announced but not
      yet completed, and to use the precise date per rule [16]
    - Varied body phrasing from 'tokenised settlement infrastructure' to 'tokenised
      settlement rails' to avoid near-verbatim repetition of the standfirst's wording
      per rule [7]
