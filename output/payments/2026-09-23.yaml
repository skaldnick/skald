    - Removed editorial note from the final copy.
- headline: Reap and Visa launch stablecoin-linked card programme across 100 markets
  standfirst: Stablecoin holders will be able to spend directly through Visa's acceptance
    network, with conversion handled at the point of sale, bypassing manual exchange
    to fiat.
  body: 'Reap, a Singapore-based fintech building stablecoin-enabled payment infrastructure,
    is partnering with Visa to launch stablecoin-linked credit card programmes across
    more than 100 markets. The cards will allow holders of supported stablecoins to
    spend at any Visa-accepting merchant, with Reap''s infrastructure handling the
    conversion and settlement.


    The programme sits within a broader pattern of card networks absorbing stablecoin
    flows rather than competing with them. Mastercard added stablecoin settlement
    to its merchant network in June, and Visa, Mastercard and Google backed the Open
    USD stablecoin launch on June 30. Each move embeds stablecoins deeper into existing
    payment rails rather than positioning them as alternatives, effectively neutralising
    one strand of the disintermediation threat.


    Stablecoin card products have existed in limited markets, but a 100-plus market
    rollout through Visa''s acceptance network represents a step change in distribution.
    Consumer and merchant demand may not follow at the same pace, particularly in
    European markets where regulatory clarity under MiCA is still being tested in
    practice.'
  editorial_note: A 100-market stablecoin card programme through Visa is a material
    escalation in the integration of stablecoins with traditional payment infrastructure,
    relevant to European issuers and processors.
  sources: '[Reap and Visa collaborate to launch stablecoin card programme across
    100+ markets](https://www.finextra.com/pressarticle/110982/reap-and-visa-collaborate-to-launch-stablecoin-card-programme-across-100-markets?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (Reap and Visa) that is also named
      in the headline. Should open with the substantive point instead — violates rule
      1.
    - Body paragraph 3 opens with 'For European issuers and processors, the programme's
      scale is the notable element.' This frames the story around relevance to European
      readers with an audience-address clause and announces notability before making
      the substantive point — violates rules 22 and 13.
    - Body paragraph 3 contains 'the notable element' which announces significance
      explicitly before explaining it — violates rule 6.
    - Body paragraph 3 contains 'Whether consumer and merchant demand follows at the
      same pace remains the open question' — a paragraph opened with a binary question
      when the sentence can be recast with a preposition — violates rule 3.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Story says Open USD launch was 'in July' but it was announced June 30, 2026
    - Story describes Reap as 'Hong Kong-based' but sources indicate Singapore-based
  revision:
    replaced: false
    resolved: true
    summary:
    - Changed Reap's location from 'Hong Kong-based' to 'Singapore-based' per source
      indication.
    - Changed Open USD launch date from 'in July' to 'on June 30' per corrected date
      (year omitted as current year per house style).
    - Revised standfirst to open with the substantive point rather than naming Reap
      and Visa, avoiding repetition with the headline (rule 1).
    - Rewrote paragraph 3 opening to remove the audience-address clause 'For European
      issuers and processors' (rule 22) and the 'notable element' construction that
      announces significance explicitly (rules 6 and 13).
    - Recast the binary question 'Whether consumer and merchant demand follows…remains
      the open question' into a direct statement (rule 3).
