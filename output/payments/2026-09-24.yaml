- headline: Canada's largest banks team up to explore tokenised deposit system
  standfirst: A joint initiative to build a Canadian-dollar tokenised deposit platform
    adds to the growing body of central bank-adjacent experiments that could shape
    how European institutions approach programmable money.
  body: 'Canada''s largest banks have formed a consortium to explore a tokenised deposit
    system denominated in Canadian dollars, aimed at enabling faster and more efficient
    programmable payments. The initiative follows a series of similar projects globally,
    including the ECB''s Project Pontes and Swift''s shared ledger pilots involving
    BNP Paribas and HSBC.


    The Canadian project is distinct in its focus on commercial bank deposits rather
    than central bank digital currency. That positions it closer to the model being
    pursued by the global bank consortium announced in September, which is prioritising
    a euro-denominated stablecoin, and to the tokenised deposit trials run through
    the BIS''s Project Agora.


    The Canadian initiative serves as another data point in the contest between tokenised
    deposits, stablecoins and CBDCs as the settlement layer for next-generation payments.
    Each model carries different implications for monetary sovereignty, bank disintermediation
    and interoperability, and the choices made by major-economy consortia will shape
    the options available to European institutions weighing their own programmable
    money strategies.'
  editorial_note: A major-economy consortium exploring tokenised deposits adds comparative
    context for European professionals tracking the ECB's Pontes project and the broader
    debate over programmable money settlement models.
  sources: '[Canadian banks join forces on tokenised deposits](https://www.finextra.com/newsarticle/48456/canadian-banks-join-forces-on-tokenised-deposits?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
