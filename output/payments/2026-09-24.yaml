stories:
- headline: Trustly cuts a quarter of its workforce in profitability push
  standfirst: Around 200 roles are being shed as the pay-by-bank firm narrows its
    focus to profitable markets, a contraction that underscores the margin pressures
    facing mid-tier open banking infrastructure providers.
  body: 'Trustly is cutting roughly 200 jobs, approximately a quarter of its staff,
    as it moves to reduce costs and concentrate on markets where it can achieve sustainable
    profitability. The company has not disclosed which geographies or functions are
    most affected.


    The reductions come at a difficult moment for the pay-by-bank sector in Europe.
    While transaction volumes have continued to grow, converting volume growth into
    profitability has proved elusive for several infrastructure-layer providers that
    sit between banks and merchants. Trustly''s decision to prioritise margin over
    scale echoes similar moves across the sector, including GoCardless''s recent path
    to its first profitable quarter and the consolidation triggered by Mollie''s acquisition
    of GoCardless.


    The restructuring reinforces a pattern across European open banking: the firms
    that built out aggressively during the post-PSD2 expansion phase are now rationalising.
    The remaining question is about whether leaner operations will be enough or whether
    further consolidation is inevitable.'
  editorial_note: Previously covered on September 24 but the Finextra source published
    today provides the concrete detail (200 jobs, quarter of staff) that warrants
    a full briefing item. The story illustrates ongoing margin pressure in the European
    pay-by-bank sector.
  sources: '[Trustly slashes 200 jobs](https://www.finextra.com/newsarticle/48460/trustly-slashes-200-jobs?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
