- headline: 'Banca d''Italia tells payment firms to screen both parties on all transfers

    '
  standfirst: 'The directive tightens sanctions compliance for Italian payment service
    providers and crypto-asset firms, requiring dual-party screening even where EU
    instant payments rules create exemptions.

    '
  body: 'Banca d''Italia has instructed payment service providers and crypto-asset
    service providers to screen both the sender and recipient of every transfer for
    sanctions hits, going beyond the minimum requirements set by EU law. The directive
    addresses a gap created by the instant payments regulation, which bars PSPs from
    screening both parties on each individual instant transfer but requires them to
    vet their own customers.


    The Italian regulator''s position effectively sets a higher compliance bar for
    firms operating in Italy. By requiring dual-party screening on all transfers,
    including instant payments, it imposes an operational and technical burden that
    may require PSPs to invest in faster screening infrastructure capable of operating
    within instant payment processing windows.


    The move comes as European regulators are preparing for the Anti-Money Laundering
    Authority to assume supervisory powers. Italy''s decision to front-run harmonised
    standards with a stricter national interpretation creates a compliance patchwork
    that cross-border payment providers will need to navigate. It also highlights
    the tension between the speed requirements of instant payments and the thoroughness
    expected in sanctions screening, a friction point that banks flagged to the AMLA
    earlier this year.

    '
  editorial_note: 'Italy setting a higher sanctions screening standard than the EU
    minimum for instant payments creates immediate compliance implications for PSPs
    operating across borders and illustrates the regulatory fragmentation risk around
    the instant payments mandate.

    '
  sources: '[NEWS: Bank of Italy tells PSPs, CASPs to always screen both parties to
    transfers for sanctions hits](https://www.amlintelligence.com/2026/09/news-bank-of-italy-tells-psps-casps-to-always-screen-both-parties-to-transfers-for-sanctions-hits/)
    — Amlintelligence'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming ''The directive'' without first establishing what
      directive or which organisation issued it. Per rule on standfirst opening: avoid
      naming the organisation in the headline (Banca d''Italia) by opening with the
      substantive point. The standfirst should open with the action/consequence, not
      ''The directive'' which is vague without context.'
    - Body text uses 'earlier this year' ("a friction point that banks flagged to
      the AMLA earlier this year") which is a vague temporal reference. Rule requires
      specific time periods or precise dates when available.
    - 'Headline contains a diacritic in ''Banca d''Italia''. Per rule on foreign diacritics:
      use the accepted British English equivalent or closest unaccented rendering
      — should be ''Banca d''Italia'' rendered as ''Banca di''Italia'' or similar
      anglicisation, or use ''Bank of Italy'' if appropriate.'
  verification:
    verified: false
    stale: true
    duplicate: false
    warnings:
    - Core event (Banca d'Italia September 7 communication) is 17 days old, exceeding
      5-day recency threshold
    - Story frames as new directive but sources indicate it primarily reiterates existing
      EBA guidelines that took effect December 30, 2025; Banca d'Italia's September
      7 communication was a supervisory reminder, not a novel requirement
  revision:
    replaced: false
    resolved: false
    summary:
    - Flagged as stale but no unused feed or web candidate was available — kept as-is,
      editor should review.
