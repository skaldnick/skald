- headline: Solaris migrates SEPA instant payments to ACI's cloud-native platform
  standfirst: The migration to ACI's Connetic platform positions Solaris to meet the
    EU Instant Payments Regulation deadline, and signals how banking-as-a-service
    providers are retooling shared infrastructure ahead of the mandate.
  body: 'Solaris has consolidated its SEPA instant payments processing onto ACI Worldwide''s
    cloud-native Connetic platform. The migration brings Solaris''s instant payments
    capability onto infrastructure purpose-built for the scale and availability requirements
    of the EU Instant Payments Regulation, which mandates that eurozone payment service
    providers offer instant euro transfers.


    As a banking-as-a-service provider underpinning dozens of fintech and corporate
    programmes, Solaris''s payments infrastructure is a shared dependency for a wide
    range of downstream clients. Any compliance gap or processing limitation at the
    platform level would cascade across its partner ecosystem.


    ACI''s selection also reflects the company''s growing footprint in European instant
    payments infrastructure. ACI was chosen to process instant payments for the European
    Payments Initiative. The Solaris deal extends that reach into the embedded finance
    segment, where instant payment readiness has lagged behind traditional banks.'
  editorial_note: A concrete example of how banking-as-a-service providers are retooling
    ahead of the EU instant payments mandate, with implications for the broader embedded
    finance ecosystem.
  sources: '[Solaris goes live on ACI Connetic for instant payments](https://www.investing.com/news/company-news/solaris-goes-live-on-aci-connetic-for-instant-payments-93CH-4914818)
    — Investing.com | [Solaris Goes Live on ACI Worldwide''s ACI Connetic for SEPA
    Instant Payments](https://sg.finance.yahoo.com/news/solaris-goes-live-aci-worldwide-100000183.html)
    — Sg | [Solaris adopts ACI Worldwide''s Connetic for SEPA Instant payments](https://www.streetinsider.com/Corporate+News/Solaris+adopts+ACI+Worldwides+Connetic+for+SEPA+Instant+payments/27098354.html)
    — StreetInsider'
  style_check:
