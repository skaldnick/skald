- headline: Former Visa crypto lead launches open payments network with $13.5m
  standfirst: The launch adds another entrant to an increasingly crowded infrastructure
    competition that includes the Linux Foundation's x402 initiative and EMVCo's agentic
    payments framework, as incumbents and startups alike experiment with protocol-level
    alternatives to existing rails.
  body: 'Pete Cooling, formerly head of Visa''s crypto product team, has launched
    Atum, an open payments network, with $13.5 million in funding. The company has
    emerged from stealth positioning itself as infrastructure for a payments layer
    that operates independently of existing card and banking networks.


    The launch sits within a broader wave of protocol-level payments ventures. The
    Linux Foundation''s x402 initiative, EMVCo''s agentic payments framework and the
    growing number of stablecoin settlement pilots from incumbent networks all point
    toward a period of experimentation around what the next generation of payment
    rails might look like. Atum''s pitch is that an open network can achieve what
    proprietary systems cannot: interoperability without intermediation.


    The pedigree of the founding team and the timing of the launch, as both Visa and
    Mastercard invest heavily in tokenised and AI-native payment capabilities, suggest
    the competitive landscape for payment infrastructure is widening rather than consolidating.
    A startup gaining traction against entrenched networks is far from assured, but
    the volume of capital and talent flowing into alternative rails signals that incumbents
    can no longer define the terms of competition unchallenged.'
  editorial_note: A well-funded stealth launch by a credible payments technologist,
    relevant to European professionals tracking the emerging infrastructure competition
    beyond cards and traditional account-to-account rails.
  sources: '[Former Visa crypto lead launches open payments network](https://www.finextra.com/newsarticle/48462/former-visa-crypto-lead-launches-open-payments-network?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Headline and standfirst both open with the same subject/action framing ('Former
      Visa crypto lead launches' / 'Atum has emerged'). Vary the opening in at least
      one of the elements per rule on avoiding repetition across headline, standfirst,
      and body opening.
    - Body paragraph two uses 'Whether a startup can gain traction against entrenched
      networks remains an open question' which is a hedging scene-setter that delays
      the substantive point. Lead directly with the substantive claim per the rule
      against 'The deal is far from certain' constructions.
    - Standfirst does not name the specific stakes or consequences — it should name
      the initiatives, programmes or competitive dynamics affected rather than making
      a generic thematic claim about 'stablecoin settlement and open network design'.
      Consider naming x402, EMVCo's framework, or other affected parties to anchor
      reader in specific development.
    - 'Standfirst uses ''aiming to build'' (future-oriented) when the body states
      Atum ''has emerged from stealth positioning itself'' (present continuous describing
      newly announced ongoing arrangement). Align tense: prefer ''is building'' to
      signal currency per rule on present continuous for newly announced arrangements.'
