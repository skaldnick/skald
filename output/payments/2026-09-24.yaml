  '
stories:
- headline: 'Trustly cuts a quarter of its workforce in profitability push

    '
  standfirst: 'The Swedish pay-by-bank firm is shedding 200 roles as it narrows its
    focus to profitable markets, marking a sharp contraction for one of Europe''s
    most prominent open banking players.

    '
  body: 'Trustly is cutting roughly 200 jobs, approximately a quarter of its workforce,
    as part of a restructuring aimed at reducing costs and concentrating on markets
    where it can achieve profitable growth. The move represents a significant retrenchment
    for a company that had expanded aggressively across European and North American
    pay-by-bank markets.


    The restructuring comes at a moment of consolidation across the European open
    banking sector. Mollie completed its acquisition of GoCardless earlier this month,
    while several mid-tier players have struggled to translate transaction volume
    growth into sustainable margins. Trustly had previously reported growing pay-by-bank
    volumes but has evidently concluded that breadth of market coverage is no longer
    viable without a corresponding improvement in unit economics.


    For the wider sector, the cuts underscore a maturing dynamic: the open banking
    payments layer in Europe is moving past the phase where growth alone attracted
    capital and patience. Providers now face pressure to demonstrate that account-to-account
    payments can be operated profitably at scale, not merely processed at volume.

    '
  editorial_note: 'A 25% workforce reduction at one of Europe''s largest open banking
    payments firms is a significant signal about the commercial pressures facing the
    pay-by-bank sector as it matures.

    '
  sources: '[Trustly slashes 200 jobs](https://www.finextra.com/newsarticle/48460/trustly-slashes-200-jobs?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Body opening: ''The move represents a significant retrenchment'' — breaches
      rule against never flagging significance explicitly. Use ''Write the substantive
      point directly'' without announcing importance.'
    - 'Body paragraph two, sentence one: ''For the wider sector, the cuts underscore
      a maturing dynamic'' — breaches rule against framing a paragraph around relevance
      to European readers by opening with audience-address construction. State the
      substantive point directly without this framing.'
    - 'Body paragraph two, sentence two: ''Providers now face pressure to demonstrate
      that account-to-account payments can be operated profitably at scale, not merely
      processed at volume'' — breaches rule preferring preposition recast over colon-introduced
      binary question/construction. Consider recasting with preposition to avoid the
      ''not merely'' binary framing.'
    - Standfirst opens with 'The Swedish pay-by-bank firm' but headline names 'Trustly'
      — while standfirst doesn't repeat the exact name, it still names the organisation
      from headline immediately. Per rule [1], standfirst should begin with substantive
      point (the narrowing of focus to profitable markets) rather than reidentifying
      the company.
  verification:
    verified: true
    stale: true
    duplicate: false
    warnings:
