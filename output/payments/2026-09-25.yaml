title: 'ECB-Pix link; FedNow goes cross-border; Citi and HSBC back payment intelligence;
  Solaris meets instant payments mandate

  '
social_post: 'ECB moves to link TIPS with Brazil''s Pix, FedNow opens the door to
  cross-border instant payments, and Citi and HSBC back a payment intelligence startup.
  Today''s briefing: {link}

  '
stories:
- headline: ECB begins feasibility study on linking TIPS with Brazil's Pix
  standfirst: Moving from the exploratory discussions confirmed in September to a
    formal feasibility assessment marks a concrete step toward cross-border instant
    payment connectivity between Europe and Brazil.
  body: 'The European Central Bank has announced it will assess the feasibility of
    connecting its TARGET Instant Payment Settlement (TIPS) infrastructure with Pix,
    Brazil''s real-time payment system operated by the Banco Central do Brasil. The
    study will examine the technical, legal and operational requirements for enabling
    instant payments between the euro area and Brazil.


    The announcement follows an earlier signal in September 2026, when the ECB and
    Brazilian authorities confirmed exploratory discussions on linking the two systems.
    Moving from exploratory talks to a formal feasibility assessment represents a
    distinct escalation in commitment. Brazil''s Pix, which processes billions of
    transactions annually, is one of the world''s most successful instant payment
    platforms and has become a template for real-time payment adoption globally.


    The link would open a direct, low-cost channel to one of Europe''s largest trade
    and remittance corridors with Latin America. It would also reinforce the ECB''s
    broader strategy of positioning TIPS as a hub for international instant payment
    connectivity, following the launch of cross-currency settlement with Denmark and
    Sweden in September.'
  editorial_note: 'This advances a previously covered exploratory story (September
    4) to a new stage: the ECB has moved from informal discussions to a formal feasibility
    assessment, representing a meaningful escalation in a strategically important
    cross-border payments initiative.'
  sources: '[ECB to assess feasibility of interlinking with Brazil''s instant payment
    system Pix](https://www.ecb.europa.eu/press/intro/news/html/ecb.mipnews260924.en.html)
    — Ecb | [ECB to assess feasibility of interlinking with Brazil''s instant payment
    system Pix](https://www.ecb.europa.eu/press/intro/news/html/ecb.mipnews260924.fr.html)
    — Ecb'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming ''A formal assessment'' which avoids naming ECB
      (good), but the body''s opening sentence ''The European Central Bank has announced
      it will assess...'' repeats the subject and action from the headline. The body''s
      opening is weakened by avoiding direct repetition with the standfirst. Per rule
      on not weakening body''s opening to avoid repetition, the body should open strongly:
      ''TIPS will be assessed for feasibility of connecting with Pix'' or similar,
      and the standfirst should be revised instead.'
    - Standfirst uses vague temporal reference 'earlier this year' without specific
      date. Per rule on avoiding vague temporal references, use specific time period
      — the editorial note references September 4 (September 2026 in body), so standfirst
      should say 'in September' or 'on September 4'.
    - Body text contains 'For European payment providers, the link would open...'
      which frames the paragraph around relevance to a specific audience. Per rule
      on not framing paragraphs with 'For European [audience]...', state the European
      dimension directly as part of the narrative without the audience-address preface.
    - Body uses 'earlier this year' referring to September 2026 when discussing 'the
      launch of cross-currency settlement with Denmark and Sweden earlier this year'
      — this is vague. Per rule on avoiding vague temporal references, use the specific
      month or date when available.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to replace vague 'earlier this year' with 'in September'
      and reworded to avoid weakening the body's opening sentence.
    - Removed 'For European payment providers,' audience-address preface in third
      paragraph; recast to state the European dimension directly as part of the narrative.
    - Replaced 'earlier this year' in final sentence of body with 'in September' to
      use a specific time reference.
- headline: FedNow to support cross-border instant payments for the first time
  standfirst: Extending FedNow beyond US domestic payments creates a potential new
    counterpart for European instant payment systems and accelerates the global shift
    toward real-time cross-border settlement.
  body: 'Federal Reserve Financial Services has announced that FedNow, the US real-time
    payment system launched in July 2023, will soon support cross-border transactions.
    The move marks FedNow''s first extension beyond domestic payments and opens the
    path for direct interoperability with foreign instant payment infrastructures.


    The announcement lands as instant payment system interlinking is becoming a defining
    theme in global payments infrastructure. The ECB has just confirmed a feasibility
    study on connecting TIPS with Brazil''s Pix, while BIS-led projects such as Nexus
    have been prototyping multilateral instant payment links across jurisdictions.
    FedNow entering the cross-border arena adds the world''s largest economy to this
    dynamic and raises practical questions about which corridors and protocols will
    be prioritised first.


    European payment providers and scheme operators will need to assess how a cross-border-capable
    FedNow fits alongside existing correspondent banking channels and emerging real-time
    alternatives such as Swift''s retail payments framework. The US system''s technical
    choices on messaging standards, settlement mechanics and counterparty access will
    shape whether interoperability with European rails is straightforward or requires
    significant adaptation.'
  editorial_note: FedNow's expansion to cross-border has direct implications for European
    instant payment connectivity and competitive positioning against emerging interlink
    initiatives.
  sources: '[FedNow Opens Door to Cross-Border Instant Payments](https://www.pymnts.com/real-time-payments/2026/fednow-opens-door-to-cross-border-instant-payments/)
    — PYMNTS | [FedNow to enable cross-border payments](https://www.finextra.com/newsarticle/48472/fednow-to-enable-cross-border-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'The Federal Reserve's decision' when the headline
      already names 'FedNow'. Per rule 1, avoid opening the standfirst by naming the
      organisation also named in the headline; begin with the substantive point instead.
      Rephrase to open with 'The move creates...' or similar.
    - Body text uses 'which are' in 'Nexus have been prototyping' — should be 'which
      has been prototyping' as Nexus is singular. However, this is a grammar issue,
      not a house style breach.
    - Editorial note states 'FedNow's expansion to cross-border is a significant infrastructure
      development'. Per rule (flagging significance explicitly), do not announce importance
      before explaining it. Remove 'significant' or rephrase the note substantively
      rather than flagging significance.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Standfirst revised to open with 'Extending FedNow beyond US domestic payments…'
      instead of 'The Federal Reserve's decision to extend FedNow…', avoiding repetition
      of the organisation named in the headline per rule 1.
    - 'Grammar: ''Nexus have been prototyping'' corrected to ''Nexus has been prototyping''
      to reflect singular subject.'
    - 'Editorial note: removed ''significant infrastructure development'' framing
      that flagged significance explicitly, rephrased to state the substantive point
      directly.'
- headline: Citi and HSBC invest in payment intelligence firm IPID
  standfirst: Know-your-payee intelligence is becoming infrastructure-grade, with
    a $16m Series A backed by two of the world's largest correspondent banks signalling
    that counterparty identification in payments has moved beyond niche compliance
    tooling.
  body: 'IPID, a company that provides payment intelligence to help institutions verify
    who they are paying, has raised $16 million in a Series A round backed by Citi
    and HSBC. Both banks are among the world''s largest correspondent banking operators
    and handle significant volumes of cross-border transactions where counterparty
    identification is a persistent friction point.


    The investment reflects growing regulatory and operational pressure on payment
    firms to improve counterparty screening, particularly as instant payment mandates
    compress the time available for verification. In Europe, the delayed rollout of
    verification of payee across SEPA instant payments has left a gap that third-party
    intelligence providers are positioning to fill. Banca d''Italia''s recent instruction
    for payment firms to screen both parties on all transfers underlines the direction
    of travel.


    IPID''s backing by two globally systemically important banks rather than specialist
    venture investors suggests the product has moved beyond proof of concept. Banks
    facing tighter verification requirements under the instant payments regulation
    and the Payment Services Directive 3 will see a market forming around payment
    identity as a distinct service layer.'
  editorial_note: Strategic investment by two major correspondent banks in payment
    counterparty intelligence is directly relevant to European verification of payee
    requirements and instant payments compliance challenges.
  sources: '[Citi and HSBC back IPID Series A](https://www.finextra.com/newsarticle/48471/citi-and-hsbc-back-ipid-series-a?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'Two of the world's largest correspondent banks'
      which echoes the headline's 'Citi and HSBC' — this violates the rule to avoid
      redundant repetition of the subject across headline and standfirst. The standfirst
      should begin with the substantive point (e.g., 'Know-your-payee intelligence
      is becoming infrastructure-grade') rather than restating the investment backing.
    - 'Body text uses ''PSD3'' without spelling it out on first mention. Rule requires:
      ''On first use of an abbreviation that must be retained, spell it out in full
      followed by the abbreviation in parentheses.'' Should read ''Payment Services
      Directive 3 (PSD3)''.'
    - Sentence 'For European banks facing tighter verification requirements under
      the instant payments regulation and PSD3, the deal points toward a market forming
      around payment identity as a distinct service layer' opens with a frame 'For
      European banks' that risks violating the rule against framing paragraphs around
      relevance to European readers. While this is debatable, the phrasing comes close
      to the prohibited 'For European payments professionals, …' construction.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with the substantive point ('Know-your-payee intelligence
      is becoming infrastructure-grade') rather than echoing the headline's naming
      of Citi and HSBC.
    - Spelled out 'PSD3' as 'the Payment Services Directive 3' on first and only use
      in the body, removing the parenthetical abbreviation since 'PSD3' does not recur.
    - Removed the 'For European banks' opening frame from the final sentence to avoid
      the prohibited audience-address construction, recasting the sentence to lead
      directly with the substantive claim.
- headline: Solaris goes live on ACI platform to meet SEPA instant payments mandate
  standfirst: The migration to ACI's cloud-native payments infrastructure illustrates
    how the instant payments regulation is forcing operational upgrades across the
    banking-as-a-service sector.
  body: 'Solaris, the Berlin-based embedded finance platform, has gone live on ACI
    Worldwide''s Connetic cloud-native payments platform for SEPA instant payment
    processing. The migration was completed on schedule ahead of the regulatory deadline
    requiring eurozone payment service providers to both send and receive instant
    credit transfers.


    Solaris provides the banking infrastructure behind numerous European fintechs
    and digital brands. Its ability to process SEPA instant payments at the required
    speed and cost thresholds is a prerequisite for the businesses that rely on its
    platform. The choice of ACI''s cloud-native stack rather than legacy batch-processing
    infrastructure reflects the real-time throughput and scalability demands that
    the instant payments regulation imposes.


    The instant payments regulation is driving infrastructure upgrades across European
    banking-as-a-service providers. For fintechs and non-bank payment firms that depend
    on embedded banking platforms like Solaris, compliance is inherited rather than
    built directly, making the technical readiness of their infrastructure partners
    a material operational risk.'
  editorial_note: A concrete example of how the SEPA instant payments mandate is reshaping
    infrastructure choices for embedded finance platforms, relevant to the broad base
    of European fintechs relying on banking-as-a-service providers.
  sources: '[Solaris goes live on ACI Worldwide platform for Sepa instant payments](https://www.finextra.com/pressarticle/111020/solaris-goes-live-on-aci-worldwide-platform-for-sepa-instant-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra | [Solaris goes live on ACI Worldwide platform for Sepa instant payments](https://www.finextra.com/pressarticle/111020/solaris-goes-live-on-aci-worldwide-platform-for-sepa-instant-payments)
    — Finextra Research'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opening: ''Europe''s largest embedded finance platform completing
      its migration…'' names the organisation (Solaris, identifiable as Europe''s
      largest embedded finance platform) before the substantive point. Per rule 1,
      should open with the substantive point (e.g., ''The move illustrates how…'')
      rather than naming the subject also identified in the headline.'
    - 'Body paragraph 3: ''The go-live is one of a series of infrastructure upgrades…''
      uses the hedging phrase ''one of a series'' in a way that weakens the substantive
      claim. Per rule on hedging scene-setters, should lead directly with the substantive
      point about infrastructure upgrades being driven by regulation, allowing the
      specific Solaris example to illustrate it, rather than framing it as ''one of
      a series''.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with 'The migration to…' rather than identifying
      Solaris as 'Europe's largest embedded finance platform', avoiding naming the
      headline's subject at the start of the standfirst per rule 1.
    - Rewrote the opening of body paragraph 3 from 'The go-live is one of a series
      of infrastructure upgrades…' to 'The instant payments regulation is driving
      infrastructure upgrades…', stating the trend directly rather than using the
      hedging construction 'one of a series'.
