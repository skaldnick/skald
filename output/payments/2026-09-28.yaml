stories:
- headline: Cloudflare AI wallets test trust frameworks for agentic commerce
  standfirst: A major internet infrastructure provider entering agentic payments raises
    immediate questions about whether existing governance and liability frameworks
    can keep pace.
  body: 'Cloudflare has introduced AI wallets that allow autonomous software agents
    to initiate and settle payments on behalf of users, putting the nascent trust
    frameworks for agentic commerce under practical pressure. The product embeds payment
    capabilities into Cloudflare''s infrastructure layer, positioning the company
    not as a payment processor but as a connectivity provider through which AI agents
    access commercial services.


    The agentic payments conversation shifts here from bilateral arrangements between
    card networks and individual fintechs to the platform layer. Where previous agentic
    payment pilots from Visa, Mastercard and individual banks have operated within
    established scheme rules, Cloudflare''s approach sits outside those structures
    and raises questions about who bears liability when an agent transacts on a user''s
    behalf.


    The parallels with the early standardisation phases of contactless payments and
    open banking are instructive. In both cases, commercial deployment ran ahead of
    formal trust frameworks, and regulators had to retrofit governance. The Financial
    Conduct Authority''s ongoing AI governance work and the Payment Systems Regulator''s
    authorised push payment liability rules both touch the question of agent-initiated
    transactions, but neither yet provides a comprehensive answer for the model Cloudflare
    is testing.'
  editorial_note: Cloudflare's entry into agentic payments moves the conversation
    beyond card networks and fintechs to the infrastructure layer, a meaningful escalation
    for European professionals tracking governance and liability questions.
  sources: '[Cloudflare AI Wallets Put Agentic Commerce Trust Frameworks to the Test](https://thefintechtimes.com/cloudflare-ai-wallets-put-agentic-commerce-trust-frameworks-to-the-test/)
    — Thefintechtimes'
