- headline: OpenID Foundation opens conformance testing for digital identity wallets
  standfirst: Applying the same certification model already embedded in open banking
    security profiles, the programme extends standardised conformance testing to the
    EU digital identity wallet ecosystem.
  body: 'The OpenID Foundation has opened a conformance testing programme for digital
    identity wallets, allowing wallet providers to verify their implementations against
    OpenID for Verifiable Credentials specifications. The programme follows the model
    the foundation used for OpenID Connect and the Financial-grade API (FAPI) security
    profile, both of which underpin open banking ecosystems across Europe and beyond.


    The initiative arrives as the EU digital identity wallet (EUDI) framework moves
    toward large-scale pilots and eventual deployment. Interoperability and security
    certification are preconditions for wallets to be accepted across borders and
    sectors. By providing a standardised testing regime, the foundation is attempting
    to prevent the fragmentation that characterised early open banking implementations,
    where divergent national interpretations of the same standards created integration
    headaches for providers operating across multiple markets.


    For payments and open banking firms already building on FAPI profiles, the extension
    into identity wallets signals convergence between the identity and financial data
    layers. Firms such as Lissi, which raised funding to build EUDI wallet infrastructure
    for financial services, will need conformance certification to operate at scale.'
  editorial_note: ''
  sources: '[OpenID Foundation Opens Conformance Testing for Digital Identity Wallets](https://thefintechtimes.com/openid-foundation-opens-conformance-testing-for-digital-identity-wallets/)
    — Thefintechtimes'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the organisation also named in the headline (''The
      testing programme applies...'' should open with the substantive point rather
      than describing what ''the testing programme'' does). Rule: ''In the standfirst,
      do not open by naming the organisation that is also named in the headline.'''
    - 'Body text uses ''earlier this year'' which is a vague temporal reference. Replace
      with specific date or month: ''Lissi, which raised funding earlier this year
      to build EUDI wallet infrastructure''. Rule: ''Avoid vague temporal references
      such as "earlier this year". Use specific time periods...when a specific date
      is available.'''
    - Abbreviation 'OID4VC' is introduced but never recurs in the piece. Per rule,
      'Only include an abbreviation in parentheses after a term if that abbreviation
      is used again later in the same piece.' Either remove the abbreviation or use
      it again, or spell out in full without parentheses.
    - The editorial note should not be included in the copy check output as it is
      meta-commentary. However, the rule states 'Do not include editorial notes about
      missing information' — this note explains significance rather than flagging
      missing information, which may be acceptable, but the note itself reveals that
      the conformance testing is presented as a procedural step without the editorial
      framing integrated into the body text itself.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to avoid opening by naming the subject already named in the
      headline. Now leads with the substantive point about applying the certification
      model.
    - Removed parenthetical abbreviation '(OID4VC)' after 'OpenID for Verifiable Credentials'
      since the abbreviation never recurs in the piece.
    - Removed 'earlier this year' from the Lissi reference. The specific date of the
      funding round could not be confirmed from available information, so the temporal
