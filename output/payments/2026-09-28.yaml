- headline: US prosecutors seize bank accounts of Tether-linked payment firm
  standfirst: The seizure intensifies scrutiny of the infrastructure connecting Tether
    to the traditional banking system, with potential implications for euro-denominated
    stablecoin strategies.
  body: 'US federal prosecutors have seized bank accounts belonging to Capstone, a
    payments business that has been processing transactions on behalf of stablecoin
    issuer Tether and its sister exchange Bitfinex, according to the Financial Times.
    The action signals that US law enforcement is targeting not just stablecoin issuers
    directly but the payment intermediaries that connect them to traditional banking
    rails.


    The move comes as several European banking consortia are developing their own
    euro-denominated stablecoins, with one joint venture announced earlier this month
    making a euro token its priority. Tether''s USDT remains the dominant stablecoin
    globally, but its relationship with the regulated banking system has always been
    its principal vulnerability. Enforcement actions against its payment partners
    narrow the corridors through which Tether can access dollar clearing, potentially
    accelerating the shift toward regulated, bank-issued alternatives.


    European institutions developing stablecoin strategies under the Markets in Crypto-Assets
    Regulation face a sharpening regulatory premium attached to transparent, fully
    licensed issuance. The contrast between Tether''s intermediary-dependent model
    and the bank-backed structures emerging in Europe is becoming starker with each
    enforcement action.'
  editorial_note: The enforcement action against Tether's payment infrastructure is
    directly relevant to European stablecoin strategy, particularly as MiCA-compliant
    alternatives are being launched.
  sources: '[US prosecutors seize Tether-linked payment firm''s bank accounts - FT](https://www.finextra.com/newsarticle/48478/us-prosecutors-seize-tether-linked-payment-firms-bank-accounts---ft?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the organisation (Capstone) that is also named in
      the headline''s subject matter context. Per rule 1, avoid opening the standfirst
      by naming the organisation identified in the headline. Recast to begin with
      the substantive point: ''The seizure intensifies scrutiny…'' rather than ''The
      seizure of Capstone''s accounts intensifies…'''
    - Body text uses 'the Financial Times' as a source attribution mid-sentence. This
      is acceptable, but the sentence structure 'according to the Financial Times'
      at the end of a lede is weak. However, this is not a rule violation per se.
    - 'Standfirst uses ''MiCA'' without spelling it out on first mention. Per rule
      on abbreviations in standfirst: common abbreviations may be used without spelling
      out, but MiCA is not universally recognised as a common abbreviation in this
      context. Consider spelling out ''Markets in Crypto-Assets Regulation (MiCA)''
      or moving the abbreviation to body text where it is spelled out.'
    - 'The phrase ''For European institutions weighing stablecoin strategies under
      MiCA'' opens a paragraph with an audience-address construction similar to the
      prohibited ''For European payments professionals'' pattern. Per rule on avoiding
      audience-address framing, state the relevance directly as part of the narrative:
      ''European institutions developing MiCA-compliant stablecoins face a regulatory
      premium…'' rather than framing it as a direct address.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
