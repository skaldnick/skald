stories:
- headline: BNY launches cross-border pay-to-wallet capability using Swift rails
  standfirst: The service lets banks route international payments directly into retail
    digital wallets, bypassing local payout friction without requiring new messaging
    infrastructure.
  body: 'BNY has introduced a pay-to-wallet capability that enables banks to send
    cross-border payments from traditional bank accounts into participating retail
    digital wallets. The service uses existing Swift payment messages and correspondent
    banking infrastructure, meaning sending banks do not need to build new integrations
    to reach wallet endpoints.


    The product addresses a persistent gap in cross-border payouts: the final mile
    into mobile wallets, which are the primary financial interface for hundreds of
    millions of consumers in markets across Africa, Southeast Asia and Latin America.
    By embedding wallet delivery into the correspondent banking layer rather than
    requiring a separate payout network, BNY is positioning its existing infrastructure
    as a bridge between traditional rails and the wallet-based ecosystems that dominate
    emerging markets.


    European banks and payment service providers with cross-border remittance or disbursement
    flows stand to benefit most directly, as the offering reduces the need to contract
    separately with local mobile money or wallet operators. It also reflects a broader
    trend of incumbent infrastructure providers absorbing capabilities that were previously
    the domain of specialist fintechs and aggregators.'
  editorial_note: A major custody and correspondent bank embedding wallet payouts
    into Swift rails is a meaningful infrastructure development for cross-border payments,
    relevant to European banks managing remittance and disbursement flows.
  sources: '[BNY unveils Pay-to-Wallet technology option for banks](https://www.finextra.com/newsarticle/48487/bny-unveils-pay-to-wallet-technology-option-for-banks?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
