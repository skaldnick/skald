- headline: Adyen hires Klarna's Niclas Neglen as its next chief financial officer
  standfirst: The appointment fills a vacancy created when Adyen's previous CFO left
    for AI startup ElevenLabs, and comes as Klarna revised its growth outlook downward.
  body: 'Adyen has nominated Niclas Neglen, currently chief financial officer at Klarna,
    as its next CFO and a member of its statutory management board, effective February
    1, 2027. The appointment is subject to approval by the Dutch Central Bank and
    Adyen''s shareholders at an extraordinary general meeting.


    Neglen replaces Ethan Tandowsky, who left Adyen on August 31 to join AI company
    ElevenLabs. Hwa Tsao, Adyen''s senior vice president of group finance, has been
    serving as interim CFO and will continue in that role until Neglen arrives. Neglen
    joined Klarna as CFO in 2021, having previously served as CFO and chief operating
    officer for Europe, the Middle East and Africa at HSBC Private Bank, and spent
    13 years at General Electric in senior finance roles.


    Klarna announced Neglen''s planned departure on August 18, the same day it cut
    its full-year gross merchandise volume guidance to between $149 billion and $151
    billion, down from a prior forecast of more than $155 billion. For Adyen, which
    co-founder and co-CEO Pieter van der Does says is seeking a CFO who understands
    its growth stage, the hire brings in a finance leader who has steered a major
    European fintech through its IPO period. Adyen confirmed it had made no changes
    to its financial objectives.'
  editorial_note: 'Significant European payments personnel move: Adyen (Europe''s
    largest independent payment processor by market cap) hires the CFO of Klarna (Europe''s
    largest BNPL player). The story illuminates competitive dynamics in the sector
    — Adyen lost its previous CFO to an AI company, while Klarna''s CFO departed alongside
    a downward revision of growth forecasts. Not previously covered in the briefing.'
  sources: '[Adyen Names Klarna CFO Niclas Neglen as New Finance Chief](https://www.pymnts.com/personnel/2026/adyen-names-klarna-cfo-niclas-neglen-new-finance-chief/)
    — PYMNTS'
