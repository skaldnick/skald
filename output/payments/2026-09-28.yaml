- headline: Nubank in talks to acquire Monzo in deal worth up to £10bn
  standfirst: A takeover by Latin America's largest digital bank would be the biggest
    neobank acquisition to date, reshaping Monzo's recently launched European expansion
    and dealing a blow to London's IPO ambitions.
  body: 'Nu Holdings, the NYSE-listed parent of Brazilian digital bank Nubank, is
    in early-stage talks about acquiring Monzo in a deal that could value the UK challenger
    bank at between £8 billion and £10 billion. Sky News first reported the discussions
    on September 26, with Bloomberg and the Financial Times subsequently confirming
    that talks are under way.


    A Nubank acquisition is one of two paths Monzo''s board is weighing. The alternative
    is a new funding round, also expected to value the business at more than £8 billion,
    with proceeds earmarked for expansion into continental Europe. Monzo has separately
    been in discussions with private equity firms about selling up to a 15% stake.
    Both Monzo and Nubank declined to comment.


    The timing is pointed. Monzo posted pre-tax profit of £87.3 million for the year
    to March, with revenue growing 39% to £1.7 billion, and it has 16 million customers.
    It secured a full European banking licence from the Central Bank of Ireland last
    December and launched Irish operations in April, but its EU chief executive, Michael
    Carney, announced his departure on September 22 and chair Gary Hoffman left in
    early September. Nubank, with a market capitalisation of roughly $65.5 billion,
    would gain an immediate presence in UK and European retail banking. For London,
    losing Monzo to an overseas acquirer rather than a domestic IPO would underscore
    the continuing difficulty of retaining fast-growing fintechs on British public
    markets.'
  editorial_note: Story broke September 26 via Sky News and was confirmed by Bloomberg,
    Reuters and the Financial Times. It is the most significant European fintech M&A
    development this week. Monzo's open banking features, European banking licence,
    and position as a leading UK challenger make this directly relevant to European
    payments professionals. Not previously covered.
  sources: '[Nubank Weighs $13 Billion Bid for Monzo](https://www.pymnts.com/news/banking/2026/nubank-weighs-13-billion-bid-for-monzo/)
    — PYMNTS'
