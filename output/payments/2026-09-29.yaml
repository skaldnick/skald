- headline: European banks struggling to match fraud checks with instant payment speeds
  standfirst: Payment professionals rank the instant payments regulation and verification
    of payee as bigger compliance challenges than the EU AI Act, as banks scramble
    to align fraud controls with real-time settlement under the instant payments regulation.
  body: 'European banks are finding it difficult to run effective fraud screening
    at the speeds required by instant payments, according to a survey by identity
    verification firm Sumsub. Payment practitioners ranked the instant payments regulation
    (cited by 27% of respondents) and verification of payee (26%) as their most pressing
    compliance challenges, ahead of the EU AI Act (21%) and the EU anti-money laundering
    regulation (22%).


    The findings quantify a problem that has been building since the instant payments
    regulation took effect. Banks that previously had hours or days to flag suspicious
    transactions now have seconds, and legacy screening systems were not designed
    for that tempo. Verification of payee, which the European Payments Council is
    still rolling out unevenly across the single euro payments area, is intended to
    catch misdirected and fraudulent payments before they settle, but delays in implementation
    have left gaps that fraudsters exploit.


    For operational teams inside European banks, the immediate challenge of keeping
    fraud controls aligned with real-time settlement is more urgent than the broader
    regulatory questions posed by AI or AML harmonisation. That aligns with warnings
    from banking associations in July that instant payment speeds were outpacing real-time
    monitoring capabilities.'
  editorial_note: This survey adds quantitative evidence to a continuing story about
    the operational strain instant payments regulation is placing on European banks'
    fraud controls, building on earlier warnings from banking associations covered
    in July.
  sources: '[European Banks Struggling to Catch Fraud at Instant Payment Speeds, Finds
    Sumsub](https://financialit.net/news/payments/european-banks-struggling-catch-fraud-instant-payment-speeds-finds-sumsub)
    — Financialit'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'A new survey finds' when the headline names 'European
      banks' — this violates the rule against opening the standfirst by naming the
      organisation also named in the headline. The standfirst should begin with the
      substantive point (the compliance challenge ranking) rather than the source.
    - Body text uses 'earlier this year' which violates the rule against vague temporal
      references. The editorial note specifies 'July', so the body should use 'in
      July' or a specific date instead of 'earlier this year'.
    - The standfirst uses vague language 'as real-time settlement compresses the window'
      without naming the specific affected programmes or initiatives. Per the standfirst
      rule, it should name 'the instant payments regulation' or similar specific stakes
      rather than generic thematic framing.
    - Body paragraph beginning 'The survey's ranking is revealing' violates the rule
      against explicitly flagging significance. The sentence 'It suggests that for
      operational teams inside European banks, the immediate, practical challenge
      of keeping fraud controls aligned with real-time settlement is more urgent than
      the broader regulatory questions posed by AI or AML harmonisation' announces
      significance before making the substantive point directly.
  verification:
    verified: false
    stale: false
    duplicate: false
