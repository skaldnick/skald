- headline: PayPoint targets 20% compound growth in open banking at capital markets
    day
  standfirst: Open banking carries by far the most aggressive growth target among
    PayPoint's four divisions, with revenue expected to more than double over four
    years as the company positions the unit as central to its medium-term margin expansion.
  body: 'PayPoint held a capital markets day on September 29 at which it outlined
    a medium-term ambition of 5–8% annual net revenue growth across four divisions:
    Network Services, Digital Payments and Open Banking, Love2shop and Merchant Services.
    The open banking unit, which recorded £13.3 million in net revenue in the year
    to March 2026, carries the group''s most aggressive target at more than 20% compound
    annual growth, with revenue expected to more than double over four years.


    The targets position open banking as central to PayPoint''s margin story. PayPoint
    completed its acquisition of open banking data provider AperiData in June and
    has been integrating open banking-derived credit data into its merchant and consumer
    finance offerings. The capital markets day presentation framed the four divisions
    as complementary, but the growth arithmetic makes clear that open banking is doing
    the heavy lifting on the trajectory the company is selling to investors.


    PayPoint''s public commitment to these targets is a useful data point for the
    UK open banking sector. It suggests that established payment infrastructure companies
    now view open banking not as an experimental adjacency but as a core revenue line
    with enough commercial traction to anchor medium-term financial guidance.'
  editorial_note: PayPoint's capital markets day provides concrete financial targets
    for an open banking business line, offering a rare public benchmark for the sector's
    commercial maturity.
  sources: '[PayPoint sets out growth strategy and KPIs at Capital Markets Day](https://www.tipranks.com/news/company-announcements/paypoint-sets-out-growth-strategy-and-kpis-at-capital-markets-day)
    — TipRanks.com | [Capital Markets Day sets out growth drivers underpinning medium-term
    ambition](https://www.globenewswire.com/news-release/2026/09/29/3370398/0/en/capital-markets-day-sets-out-growth-drivers-underpinning-medium-term-ambition.html)
    — Globenewswire | [PayPoint Plc (PAY) Capital Markets Day Highlights 5-8% Annual
    Net Revenue Growth Goal ...](https://kalkinemedia.com/uk/news/announcements/paypoint-plc-pay-capital-markets-day-highlights-5-8-annual-net-revenue-growth-goal-across-four-key-divisions)
    — Kalkinemedia'
