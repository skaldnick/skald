title: 'Brite enters UK; PayPoint targets open banking growth; Swift links alias payments
  cross-border

  '
social_post: 'Brite Payments lands in the UK with a pan-European pay-by-bank network,
  PayPoint bets big on open banking growth, and Swift connects Bizum, PayID and Pix
  across borders. Today''s briefing: {link}

  '
stories:
- headline: 'Brite Payments enters UK market with pan-European pay-by-bank network

    '
  standfirst: 'The Swedish firm''s FCA-authorised launch adds another cross-border
    pay-by-bank competitor to a UK market already crowded with domestic and international
    players.

    '
  body: 'Brite Payments has launched in the UK after securing an Electronic Money
    Institution licence from the Financial Conduct Authority, extending its pay-by-bank
    network from continental Europe into one of open banking''s most developed markets.
    The network combines open banking connectivity with Brite''s proprietary Instant
    Payments Network infrastructure.


    The UK pay-by-bank market has attracted sustained investment over the past year.
    TrueLayer, Plaid and GoCardless are all active, while the UK Payments Initiative
    launched in June with account-to-account payments at its core. Brite''s proposition
    is cross-border coverage: it already operates across multiple European markets,
    and the UK licence lets it offer merchants a single integration for domestic and
    international bank-based payments.


    Brite''s entry reflects a broader pattern of European open banking firms treating
    the UK as a natural expansion market, despite its separate regulatory regime.
    For merchants weighing pay-by-bank against card rails, the growing number of providers
    competing on coverage, settlement speed and conversion rates is steadily improving
    the commercial case.

    '
  editorial_note: 'A concrete competitive move in the UK pay-by-bank market, relevant
    to professionals tracking the build-out of account-to-account payment alternatives
    to card networks.

    '
  sources: '[Brite Payments brings international Pay-by-Bank network to the UK](https://www.finextra.com/newsarticle/48489/brite-payments-brings-international-pay-by-bank-network-to-the-uk)
    — Finextra Research | [Brite Payments brings international Pay-by-Bank network
    to the UK](https://www.finextra.com/newsarticle/48489/brite-payments-brings-international-pay-by-bank-network-to-the-uk?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
