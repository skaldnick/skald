- headline: Bradesco completes first pilot on Bank of America's cross-border real-time
    platform
  standfirst: The transaction tests a cross-border real-time corridor via Hong Kong's
    Faster Payment System, as competition to connect Brazil's Pix to international
    rails intensifies.
  body: 'Bradesco has completed the first pilot transaction using Bank of America''s
    cross-border real-time payments solution, announced at Sibos 2026 in Miami. The
    pilot delivered a payment in Hong Kong dollars through Hong Kong''s Faster Payment
    System, using real-time settlement infrastructure rather than traditional batch
    processing.


    The pilot sits alongside a broader effort to connect Brazil''s instant payments
    system to international rails. The ECB disclosed in September that it is assessing
    the feasibility of linking its TIPS platform to Pix, which would create a direct
    euro-real instant payments corridor. Bank of America''s solution takes a different
    approach, using its own correspondent banking infrastructure to deliver real-time
    cross-border capability. Both routes point toward the same destination: faster,
    cheaper payments between Brazil and its major trading partners.


    The Bradesco pilot signals that cross-border real-time payments are moving from
    prototype to production on high-volume corridors. The parallel ECB-Pix exploration
    and the Bank of America commercial offering suggest that competition for these
    flows is intensifying, with implications for pricing, settlement models and the
    role of correspondent banks.'
  editorial_note: ''
  sources: '[Bradesco completes pilot transaction using BofA cross-border payments
    tech](https://www.finextra.com/pressarticle/111032/bradesco-completes-pilot-transaction-using-bofa-cross-border-payments-tech?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra | [Sibos 2026: BofA expands payments capabilities with new intelligence
    and real-time services](https://www.finextra.com/newsarticle/48483/sibos-2026-bofa-expands-payments-capabilities-with-new-intelligence-and-real-time-services?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
