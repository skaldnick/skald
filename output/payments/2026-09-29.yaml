      rule 5 (avoid ''This matters because'' equivalents).'
    - 'Paragraph 3 contains: ''The intersection of digital identity and open banking
      payments has been discussed in policy terms for some time. Token.io''s role
      in the German EUDI rollout is one of the first concrete commercial engagements
