- headline: ECB invites private sector to join digital euro innovation platform
  standfirst: The call for expressions of interest opens a formal channel for companies
    to shape value-added services on the digital euro, moving the project beyond policy
    design into practical product development.
  body: 'The European Central Bank is inviting private companies and organisations
    to join the digital euro innovation platform, where participants will collaborate
    on experiments with new value-added services and explore future technological
    developments. The call marks a shift from the closed pilot phase, which selected
    36 payment providers in July, toward broader private-sector engagement on what
    the digital euro can actually do beyond basic person-to-person and point-of-sale
    payments.


    Legislative momentum is running in parallel. The European Parliament''s July vote
    to advance the digital euro regulation to final negotiations has given the ECB
    room to ensure commercial applications are ready when, or if, the political process
    concludes. The innovation workstreams are designed to surface use cases that justify
    the digital euro''s existence to consumers and merchants who already have functioning
    payment options.


    The ECB faces persistent scepticism from commercial banks and payment providers
    who view the digital euro as a competitor rather than a complement. Bringing private
    firms inside the development process is partly a technical exercise and partly
    a political one, aimed at building the coalition needed to make the digital euro
    viable at launch.'
  editorial_note: This moves the digital euro story forward from the pilot selection
    phase previously covered, opening a new innovation track that signals the ECB's
    shift toward commercial product development alongside legislative progress.
  sources: '[ECB invites expressions of interest for digital euro innovation workstreams](https://www.finextra.com/newsarticle/48490/ecb-invites-expressions-of-interest-for-digital-euro-innovation-workstreams?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the ECB, which is also named in the headline. Rule
      1 requires opening with the substantive point instead — rewrite to begin 'The
      call for expressions of interest opens a formal channel…' rather than implicitly
      identifying the ECB first.
    - Body paragraph 3 opens with 'The open call is notable for its timing.' This
      violates the rule against announcing notability before making a substantive
      point. Recast directly with the substantive claim — eg, 'The ECB faces persistent
      scepticism from commercial banks…' without the notability announcement.
    - Body uses 'The initiative follows' and 'The open call is notable' — the opening
      words of consecutive paragraphs are too similar in structure. Vary the paragraph
      openings more distinctly.
