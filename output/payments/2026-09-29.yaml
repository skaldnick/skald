- headline: Token.io to support EUDI wallet rollout in Germany
  standfirst: Payment initiation rails are being positioned as a distribution channel
    for the European Digital Identity Wallet in Germany, connecting digital identity
    verification to account-to-account payments.
  body: 'Token.io is supporting the introduction of the European Digital Identity
    (EUDI) Wallet in Germany, linking its payment initiation infrastructure to the
    wallet''s identity verification capabilities. The EU''s push for a standardised
    digital identity framework and the existing open banking rails that already carry
    payment and account data converge here: the EUDI Wallet regulation requires member
    states to offer citizens a digital identity wallet by the end of 2026, and Germany
    has set a national launch target of January 2, 2027.


    Token.io''s involvement suggests that open banking providers see the wallet not
    just as an identity tool but as a potential gateway to payment initiation, where
    verified identity and payment consent converge in a single flow. Token.io is also
    a co-founder of the UK Payments Initiative, giving it a foothold on both sides
    of the Channel as open finance standards develop.


    Token.io''s role in the German EUDI rollout represents one of the first concrete
    commercial engagements linking digital identity and open banking payments, and
    could shape how open banking infrastructure providers position themselves as the
    wallet ecosystem takes shape across Europe.'
  editorial_note: First concrete link between an open banking payments provider and
    the EUDI Wallet rollout, relevant to professionals tracking how digital identity
    and payment initiation converge in practice.
  sources: '[Token.io supports introduction of the European Digital Identity Wallet
    in Germany](https://www.openbankingexpo.com/news/token-io-supports-introduction-of-the-european-digital-identity-wallet-in-germany/)
    — Openbankingexpo'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the organisation from the headline: ''The open banking
