- headline: BNY launches pay-to-wallet capability for cross-border bank transfers
  standfirst: Banks can now route cross-border payments directly into retail digital
    wallets using existing Swift infrastructure, targeting the growing population
    of consumers who hold balances in wallets rather than traditional bank accounts.
  body: 'BNY has launched a pay-to-wallet capability that enables banks to send cross-border
    payments from bank accounts directly into participating retail digital wallets.
    The service uses existing Swift payment messages and correspondent banking infrastructure,
    avoiding the need for new settlement or clearing arrangements.


    Remittance recipients in many markets, particularly in emerging economies, increasingly
    hold funds in digital wallets rather than bank accounts. Sending money from a
    bank account to a wallet has typically required the recipient to withdraw from
    a bank account into the wallet, adding a step, a delay and often a fee. BNY''s
    service removes that intermediary step for participating wallets.


    The launch sits alongside Swift''s own move to connect domestic payment aliases
    cross-border, announced the same day. Together, the two initiatives suggest that
    the correspondent banking layer is actively adapting to compete with newer cross-border
    rails such as stablecoin networks and bilateral instant payment links. European
    banks that rely on BNY as a correspondent gain a distribution channel they can
    offer corporate clients sending payroll or supplier payments to wallet-heavy markets.'
  editorial_note: BNY's pay-to-wallet capability addresses a structural gap in cross-border
    payments and, combined with Swift's alias initiative on the same day, signals
    a coordinated effort by the correspondent banking infrastructure to remain competitive
    against newer rails.
  sources: '[BNY unveils Pay-to-Wallet technology option for banks](https://www.finextra.com/newsarticle/48487/bny-unveils-pay-to-wallet-technology-option-for-banks?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (BNY) that is also named in the
      headline, violating rule 1. Should begin with 'The service lets banks…' or similar
      substantive point instead of 'The service lets banks route…' after naming BNY
      implicitly through 'The service'.
    - Body paragraph 2 opens with 'The product targets a specific gap' which weakly
      restates the standfirst's substantive point. While not a near-verbatim repetition,
      the phrasing is thin and could be stronger per the rule about not weakening
      the body's opening.
    - Editorial note is included in the copy provided. Per the rules, do not include
      editorial notes in the story itself; they should be separate metadata. The editorial
      note explaining the significance ('signals a coordinated effort') also violates
      the rule against explicitly flagging significance — this interpretation belongs
      in the story body, not in an editorial note.
    - Paragraph 3 contains 'For European banks that rely on BNY as a correspondent'
      — this frames relevance to European readers with an audience-address clause
      that should be avoided per the rule. Integrate the European angle directly into
      the narrative instead.
