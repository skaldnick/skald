title: 'Swift bridges domestic wallets; ECB opens digital euro innovation; banks struggle
  with instant payment fraud

  '
social_post: 'Swift just made Bizum, Pix and PayID work cross-border. Plus: ECB opens
  digital euro innovation workstreams, and European banks are failing to keep fraud
  checks up with instant payment speeds. {link}

  '
stories:
- headline: Swift connects Bizum, PayID and Pix for cross-border alias payments
  standfirst: Consumers in Spain, Australia and Brazil can now send money internationally
    using a mobile number or email, a model that could extend to other domestic schemes
    and reshape cross-border retail payments.
  body: 'Swift has launched a cross-border gateway that connects domestic instant
    payment schemes, starting with Spain''s Bizum, Australia''s PayID and Brazil''s
    Pix. The service lets consumers send money internationally using an alias such
    as a mobile number or email address rather than account details, layering a familiar
    domestic experience onto correspondent banking rails.


    The initiative uses existing Swift payment messages and correspondent banking
    infrastructure rather than requiring new settlement arrangements. That pragmatic
    approach distinguishes it from more ambitious interoperability projects such as
    mBridge or Project Nexus, which aim to bypass correspondent banking altogether.
    By working with what already exists, Swift can move faster, though the trade-off
    is that it inherits the cost and latency characteristics of correspondent banking.


    The inclusion of Bizum is the most immediate signal for Europe. If the model works,
    other European schemes including Wero could follow, giving Swift a route into
    the retail instant payments layer it has historically left to domestic operators.
    Domestic schemes, which have built their brands on speed and simplicity, face
    a strategic question about whether they will accept the friction that cross-border
    correspondent banking inevitably introduces.'
  editorial_note: Swift extending pay-by-alias to cross-border transactions is a strategically
    significant move that directly affects European domestic schemes such as Bizum
    and potentially Wero, and represents a new competitive dynamic in cross-border
    retail payments.
  sources: '[Swift provides cross-border gateway to Bizum, PayID and Pix users](https://www.finextra.com/newsarticle/48488/swift-provides-cross-border-gateway-to-bizum-payid-and-pix-users?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Paragraph 3 opens with 'For European payments professionals, the inclusion of
      Bizum is the most immediate signal.' This violates the rule against framing
      a paragraph around its relevance to European readers by opening with audience-address
      clauses such as 'For European payments professionals...' State the European
      dimension directly as part of the narrative without this prefacing construction.
    - Paragraph 3 contains 'The question is whether domestic schemes, which have built
      their brands on speed and simplicity, will accept the friction that cross-border
      correspondent banking inevitably introduces.' This violates the rule against
      opening a paragraph with a colon-introduced binary question when the sentence
      can be recast with a preposition. This should be reworded as 'Domestic schemes,
      which have built their brands on speed and simplicity, face a strategic question
      about whether they will accept the friction that cross-border correspondent
      banking inevitably introduces.'
