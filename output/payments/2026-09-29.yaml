    warnings:
    - Standfirst opens by naming the organisation from the headline ('The UK payments
      group') when it should begin with the substantive point instead. Per rule [1],
      avoid redundant repetition of the subject across headline and standfirst — begin
      with the interpretive point, e.g., 'The move signals…' rather than restating
      the subject.
    - Body uses 'The company completed its acquisition' when the subject (PayPoint)
      has not been introduced in that paragraph. The paragraph opens with 'The targets
      position open banking as central to PayPoint's margin story' but the next sentence
      introduces 'The company' without PayPoint being named in the immediately preceding
      context within that paragraph.
    - Standfirst uses vague framing 'signalling where it sees its medium-term margin
      expansion' which is a soft scene-setter. Per rule [on substantive points], the
      standfirst should name the specific stakes or consequences more directly rather
      than use interpretive framing like 'signalling'.
    - Body text includes '5–8%' as a range without a clear basis of measurement context
