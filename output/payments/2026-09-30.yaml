title: 'Brite enters UK; Circle-Volante stablecoin integration; SMEs shift cross-border
  providers; Sibos sovereignty debate

  '
social_post: 'Brite brings pay-by-bank to the UK, Circle and Volante wire stablecoins
  into bank ops, and SMEs are ditching their banks for cross-border payments. Plus:
  what sovereignty means in a multi-rail world. {link}

  '
stories:
- headline: Brite Payments launches pay-by-bank in the UK after securing FCA licence
  standfirst: The Swedish instant payments firm's UK entry adds another European competitor
    to a pay-by-bank market that is growing but still grappling with consumer awareness.
  body: 'Brite Payments has launched its pay-by-bank service in the UK after receiving
    an electronic money institution licence from the Financial Conduct Authority.
    The company, which connects to more than 3,800 banks across 27 European markets,
    is positioning itself as a cross-border instant payments network that bypasses
    card rails entirely.


    Brite''s own research, released alongside the launch, found that 47% of UK consumers
    experience frustration at online checkout, a finding the company frames as a case
    for simpler payment methods that draw directly from bank balances rather than
    extending credit. The UK already has more than 15 million open banking users,
    but awareness of pay-by-bank as a checkout option remains low relative to card
    payments.


    The move extends Brite''s footprint beyond its Nordic and continental European
    base into the UK''s more mature open banking market, where it will compete with
    established players such as TrueLayer and Plaid as well as newer entrants. Its
    entry comes as the UK consults on its next-generation payments infrastructure
    and commercial variable recurring payments gain traction, both of which could
    reshape how pay-by-bank scales.'
  editorial_note: A new European entrant securing FCA authorisation and launching
    in the UK pay-by-bank market is relevant given the competitive intensity and regulatory
    momentum around open banking payments in the UK.
  sources: '[Brite Payments Launches Pay by Bank in the UK as Research Reveals Almost
    Half of Brits ...](https://financialit.net/news/payments/brite-payments-launches-pay-bank-uk-research-reveals-almost-half-brits-are-suffering)
    — Financialit | [Brite Payments launches Pay by Bank in the UK after FCA EMI licence](https://thepaypers.com/payments/news/brite-payments-launches-pay-by-bank-in-the-uk-after-fca-emi-licence)
    — The Paypers | [Brite Payments brings international Pay-by-Bank network to the
    UK](https://www.finextra.com/newsarticle/48489/brite-payments-brings-international-pay-by-bank-network-to-the-uk)
    — Finextra Research'
