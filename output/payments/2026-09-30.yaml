- headline: Most SMEs plan to switch cross-border payment provider within two years
  standfirst: Small businesses trading internationally are increasingly dissatisfied
    with bank-provided cross-border payments, with fintechs the main beneficiaries,
    according to a Mastercard report.
  body: 'A majority of small and medium-sized businesses that trade internationally
    intend to change their cross-border payment provider within the next two years,
    according to a report published by Mastercard. The findings point to widespread
    dissatisfaction with the speed, cost and transparency of bank-provided cross-border
    payment services.


    The shift favours fintechs and specialist payment providers, which have built
    propositions around faster settlement, lower fees and more transparent FX pricing.
    Companies such as Airwallex, Wise and Payoneer have made cross-border payments
    a core battleground, and the report suggests their pitch is landing with the SME
    segment that banks have historically underserved.


    The findings reinforce a challenge that European banks have faced for several
    years but that is now accelerating. Cross-border payments remain one of the most
    profitable segments of transaction banking, and losing SME volume to non-bank
    providers erodes both revenue and the broader commercial relationship. The report
    lands as Swift, the European Payments Initiative and various national schemes
    are all investing in faster cross-border rails, but the gap between infrastructure
    upgrades and the SME experience at the point of payment remains wide.'
  editorial_note: A Mastercard-backed data point on SME switching intentions is material
    for European banks and payment firms competing for cross-border volume, and connects
    to multiple live infrastructure initiatives.
  sources: '[SMEs turn from banks to fintechs for cross-border payments](https://www.finextra.com/newsarticle/48497/smes-turn-from-banks-to-fintechs-for-cross-border-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
