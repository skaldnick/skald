    warnings:
    - Standfirst opens by naming the organisation (SEC) that frames the action, rather
      than opening with the substantive point. Should open with 'A formal denial ends
      days of speculation…' or similar, per rule [1].
    - Standfirst uses vague temporal reference 'days of speculation' without specific
      dates. Rule requires specific time periods or precise dates when available.
      Should specify 'speculation since September 26' or similar, per rule on temporal
      references.
    - Body text contains 'roughly 10%' which uses an imprecise qualifier for a metric
      that could be stated exactly. Rule requires precision in financial metrics.
    - The phrase 'The question now is which of its remaining options to pursue' is
      an introductory hedge that delays the substantive point. Rule [19] prohibits
      opening a paragraph with hedging scene-setters; should lead directly with Monzo's
      options rather than announcing the question first.
