      the headline. Rule 1 states: ''do not open by naming the organisation that is
      also named in the headline. Instead, begin with the substantive point or action''.
      Revise to open with ''The product delivers 500 bank transaction signals...''
      rather than naming Experian first.'
    - 'Body paragraph 2 contains vague temporal reference ''in July'' when a specific
      date is available. Rule on vague temporal references states: ''Avoid vague temporal
      references such as "in June" or "last month" when a specific date is available.
      Use the precise date (eg, "on July 9")''. Use the exact date of the chancellor''s
      announcement.'
    - 'Body paragraph 3 uses ''For lenders'' as a frame-setting opening that prefigures
      relevance before stating the substantive point. While not identical to the flagged
