- headline: Nubank rules out Monzo acquisition in securities filing
  standfirst: A formal SEC denial ends days of speculation over what would have been
    the largest acquisition of a UK digital bank, leaving Monzo to choose between
    a fresh funding round and a potential IPO.
  body: 'Nu Holdings, Nubank''s parent company, said on September 30 that it is not
    pursuing a transaction with Monzo. The statement, made in a securities filing
    with the US Securities and Exchange Commission, was unusually direct for a company
    that normally declines to comment on deal speculation. "While we have a great
    deal of respect for Monzo, the company is not pursuing a transaction with Monzo,"
    Nu said, adding that its capital allocation framework is unchanged and its focus
    remains on Brazil, Mexico, Colombia and its US expansion through Nu Global.


    The denial follows reports on September 26 that the two digital banks had held
    early-stage talks over a deal valuing Monzo at between £8 billion and £10 billion.
    Monzo had engaged Morgan Stanley and Slaughter & May to advise on its options.
    Nu Holdings shares had fallen roughly 10% on Monday as investors priced in the
    risk of a large overseas acquisition; the stock recovered nearly 7% after the
    filing.


    For Monzo, the question now is which of its remaining options to pursue. The bank
    reported £1.7 billion of revenue and £25.7 billion of deposits in its most recent
    fiscal year, and has 16 million accounts. A sale to Nu was one of two paths its
    board had been weighing alongside an equity fundraising at a valuation above £8
    billion to fund expansion into mainland Europe. A London IPO had been under discussion
    but remains unconfirmed, with a US listing also being considered given Monzo''s
    shareholder base.'
  editorial_note: This is a genuinely new development from the Nubank-Monzo story
    previously covered on September 28. The earlier story reported early-stage acquisition
    talks; this piece covers Nubank's formal SEC filing on September 30 explicitly
    ruling out the transaction — a materially different stage. The story is relevant
    to the European payments audience because Monzo is one of the UK's largest digital
    banks and its next move (IPO, funding round, or alternative acquirer) has direct
    implications for the UK fintech landscape.
  sources: '[Brazil''s Nubank says it is not pursuing deal with Monzo](https://www.sharecast.com/news/news-and-announcements/nubank-rules-out-multi-billion-pound-tie-up-with-monzo--23726066.html)
    — Sharecast'
  style_check:
