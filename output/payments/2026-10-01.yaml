- headline: Citi goes live on Swift's instant payments scheme across multiple markets
  standfirst: The deployment gives corporate clients access to cross-border instant
    payments in several countries through a single account structure, building on
    Swift's push to make real-time settlement the default for correspondent banking.
  body: 'Citi has activated multiple markets on Swift''s cross-border instant payments
    scheme, allowing bank clients to reach real-time payment networks in several jurisdictions
    through one account relationship. The move extends Citi''s earlier commitment
    to expanding its instant payments network, which reached 300 partner banks in
    July.


    Swift''s scheme connects national instant payment systems, such as SEPA Instant
    in Europe and equivalents elsewhere, through the existing correspondent banking
    infrastructure rather than requiring new bilateral connections. Citi''s multi-market
    go-live is among the more substantial deployments to date, given the bank''s scale
    in corporate treasury and trade finance.


    Cross-border instant payments are moving closer to a standard service offering
    for European corporate treasurers rather than a bespoke capability. The deployment
    also reinforces Swift''s position as the connective layer between national real-time
    systems, at a time when alternative approaches from BIS projects to stablecoin
    networks are competing for the same corridor.'
  editorial_note: Citi's multi-market activation on Swift's scheme is a meaningful
    step in making cross-border instant payments operational at scale, advancing a
    story that has been building with BBVA's go-live and Barclays/HSBC/Lloyds/NatWest
    adoption.
  sources: '[Citi launches multi-market instant payments on Swift scheme](https://www.finextra.com/newsarticle/48508/citi-launches-multi-market-instant-payments-on-swift-scheme?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming Swift, the same organisation named in the headline.
      Per rule [1], the standfirst should begin with the substantive point (e.g.,
      'The deployment gives corporate clients…') rather than repeating the subject.
      Revise to avoid naming Swift in the opening clause.
    - Body paragraph three opens with 'For European corporate treasurers,' which is
      a framing device addressing the audience. Per rule [framing clause rule], if
      the European dimension is relevant, state it directly as part of the narrative
      without prefacing with an audience-address clause.
    - Editorial note references 'through 2026' which appears to be a future date that
      seems inconsistent with the present-tense narrative of the story. This suggests
      either a dating error or unclear temporal framing, though editorial notes themselves
      should not appear in the final published text per rule [do not include editorial
      notes about missing information].
