- headline: Experian launches open banking cashflow product for SME lending decisions
  standfirst: The product delivers 500 bank transaction signals to commercial lenders,
    arriving weeks after the UK chancellor's open finance push prioritised SME credit
    access.
  body: 'Experian has launched Cashflow Attributes, a product that provides commercial
    lenders with 500 signals derived from business bank transaction data via open
    banking. The product is designed to give lenders a more granular picture of SME
    cash flow patterns than traditional credit bureau data alone, addressing a persistent
    gap in small business underwriting.


    The launch follows UK chancellor Rachel Reeves''s announcement on July 9 of an
    open finance push specifically focused on improving SME access to credit. Experian''s
    product is one of the first major commercial deployments to act on that policy
    signal, translating open banking data access into a structured lending tool rather
    than a raw data feed.


    The product reduces reliance on limited financial statement data that many small
    businesses struggle to provide. The 500-signal approach suggests Experian is positioning
    open banking data not as a supplement to existing credit scoring but as a primary
    input for commercial lending decisions, a shift that reshapes how SME creditworthiness
    is assessed across the UK market.'
  editorial_note: This is a concrete commercial product that connects the UK's open
    finance policy direction to actual lending infrastructure, making it relevant
    as evidence of how the market is responding to regulatory signals around SME credit.
  sources: '[Experian Gives Business Lenders 500 Bank Transaction Signals to Fill
    SME Credit Gap](https://www.techtimes.com/articles/328343/20260930/experian-gives-business-lenders-500-bank-transaction-signals-fill-sme-credit-gap.htm)
    — Techtimes | [Experian launches cashflow attributes for commercial lenders](https://www.openbankingexpo.com/news/experian-launches-cashflow-attributes-for-commercial-lenders/)
    — Open Banking Expo'
  style_check:
    compliant: false
