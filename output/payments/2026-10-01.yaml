title: 'European instant payments network picks Madrid; Citi goes live on Swift scheme;
  Experian targets SME credit

  '
social_post: 'Europe''s domestic payment schemes are building a joint network in Madrid
  to take on Visa and Mastercard. Plus: Citi goes live on Swift''s instant payments
  scheme and Experian brings open banking data to SME lending. {link}

  '
stories:
- headline: Bizum, Bancomat and EPI to build joint European payments network in Madrid
  standfirst: A shared interoperability network is planned to launch in Madrid by
    2027, extending instant payments across at least 13 countries and covering over
    70% of the EU population.
  body: 'Spain''s Bizum, Italy''s Bancomat, the European Payments Initiative (EPI)
    and Nordic mobile payments group Vipps have agreed to establish a shared network
    called EPN, headquartered in Madrid, with a target launch in 2027. The network
    is designed to connect domestic instant payment schemes across Europe, enabling
    cross-border person-to-person and eventually merchant payments without routing
    through Visa or Mastercard rails.


    Fernando Rodriguez, Bizum''s deputy general director of international expansion,
    described the initiative as an extension of Spain''s instant payments model into
    a wider European setting. The network would initially cover at least 13 countries,
    reaching more than 70% of the EU population. For Bizum, which already processes
    high volumes domestically, the move marks a shift from national utility to pan-European
    infrastructure partner.


    The initiative sits squarely within the broader European payment sovereignty agenda
    that has gained momentum since the Bank of Finland and French Banking Federation
    both framed domestic payment independence as a strategic priority. Where Wero
    is EPI''s consumer-facing wallet brand, EPN would provide the underlying interoperability
    layer connecting disparate national schemes, a piece of plumbing that has been
    missing from Europe''s fragmented instant payments landscape.'
  editorial_note: ''
  sources: '[Madrid will host the European hub for instant payments](https://www.democrata.es/en/economy/the-european-instant-payment-networks-choose-madrid-for-their-new-common-hub/)
    — Demócrata | [European payment groups to launch Madrid-based EPN network in 2027](https://www.telecompaper.com/news/european-payment-groups-to-launch-madrid-based-epn-network-in-2027--1584215)
    — Telecompaper | [European payments groups join forces to challenge US dominance](https://www.globalbankingandfinance.com/european-payments-groups-join-forces-lessen-us-reliance/)
    — Globalbankingandfinance | [Madrid to host new European network connecting Bizum
    with major payment systems](https://www.todoalicante.es/english/madrid-host-european-network-20260930020919-nt_amp.html)
    — Todoalicante'
