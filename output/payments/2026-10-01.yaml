title: 'European payments hub takes shape; Nubank drops Monzo bid; Experian targets
  SME lending

  '
social_post: 'Bizum, Bancomat and EPI are building a joint European payments network
  in Madrid. Plus: Nubank walks away from Monzo, Experian''s new open banking SME
  tool, and Citi goes live on Swift instant. {link}

  '
stories:
- headline: Zilch lines up banks for London IPO as BNPL provider eyes 2027 listing
  standfirst: A London listing would test the exchange's ability to attract fintech
    issuers after years of losing ground to New York, and comes just weeks after the
    FCA's new BNPL consumer protections took effect.
  body: 'Zilch has invited investment banks to pitch for roles on a planned initial
    public offering on the London Stock Exchange, according to the Financial Times.
    The UK buy-now-pay-later provider, founded in 2018 by Philip Belamant, favours
    London as the venue for a listing in the second half of 2027 or early 2028, though
    New York and continental Europe remain under consideration. Discussions are at
    an early stage and plans could change.


    Zilch was valued at $2 billion in a 2021 funding round and has maintained that
    figure in subsequent rounds, but sources told the FT it would be unlikely to reach
    the same level at IPO. In its financial year to March 2025, the company reported
    revenue of £110 million, up 93% year on year, and cut net losses by 79% to £10.5
    million. It aims to be profitable before listing. Earlier this year, Zilch acquired
    Lithuania''s Fjord Bank to secure a European banking licence and support expansion
    beyond the UK.


    The LSE has struggled to attract fintech listings in recent years. Wise moved
    its primary listing to the US, and Klarna chose New York for its IPO last year
    only to see its shares fall sharply after debut. Zilch choosing London would be
    a visible signal that the exchange can still compete for high-growth payments
    companies. The listing would also arrive in a changed regulatory environment:
    FCA rules on BNPL lending came into force on July 15, imposing new consumer protections
    on a sector that had operated largely outside formal regulation.'
  editorial_note: 'Replacement for dropped Bizum/EPN story. Fresh story broken by
    the FT on September 30, widely reported October 1. Relevant to European payments
    audience: Zilch is a significant UK BNPL player expanding into Europe via a Lithuanian
    banking licence, and a London listing would test the LSE''s competitiveness for
    fintech IPOs after losing Wise and missing Klarna. Broader context includes the
    new BNPL regulatory framework and Klarna''s post-IPO share decline. Not previously
    covered.'
  sources: '[Zilch reportedly engages banks for potential London IPO](https://www.fintechfutures.com/stock-exchange-ipos/zilch-reportedly-engages-banks-for-london-ipo)
    — FinTech Futures'
