title: 'European payments alliance forms; Bizum, Bancomat and Wero unite against card
  networks

  '
social_post: 'Five of Europe''s biggest domestic payment schemes just formalised their
  alliance in Madrid. Plus: Citi goes live on Swift instant, the Payments Association
  absorbs its EU counterpart, and payee verification diverges across markets. {link}

  '
stories:
- headline: Zilch lines up banks for London IPO as BNPL firm targets 2027 listing
  standfirst: The consumer lender's move to list in London rather than New York would
    test whether the UK capital markets reforms that followed Wise's departure are
    attracting the fintech listings they were designed to win.
  body: 'Zilch, the UK buy-now-pay-later firm founded by Philip Belamant, has invited
    investment banks to pitch for roles on a potential listing on the London Stock
    Exchange, according to the Financial Times. The company views London as the favoured
    venue, with a listing likely in the second half of 2027 or early 2028, though
    New York and other European exchanges are also under consideration. Discussions
    are at an early stage and plans remain subject to change.


    Zilch was last valued at $2 billion in a 2021 funding round and has held that
    figure through subsequent raises, most recently a $175 million debt-and-equity
    round led by KKCG in November 2025. People familiar with the IPO talks say it
    is unlikely to reach that peak valuation at listing. In its most recent financial
    year to March 2025, the company cut its pre-tax loss by 79% to £10.5 million on
    revenue of roughly £110 million, and is targeting profitability before going public.
    Its investor base includes eBay Ventures, Goldman Sachs and DMG Ventures.


    A London listing by Zilch would be one of the first sizeable UK fintech IPOs in
    several years and would arrive in a changed regulatory environment, with FCA authorisation
    of BNPL lending now in force since July 15. The company acquired Lithuania-based
    Fjord Bank earlier this year, giving it a European banking licence to support
    its continental expansion.'
  editorial_note: Genuinely new story reported September 30, not previously covered.
    Relevant to European payments audience as a signal of whether the UK fintech IPO
    pipeline is reopening and London can retain fintech listings after Wise's move
    to the US. Connects to BNPL regulation (FCA rules in force since July) and the
    broader competitive landscape. Primary source is the Financial Times; FinTech
    Futures article cited as the most detailed secondary source available via search.
  sources: '[Zilch reportedly engages banks for potential London IPO](https://www.fintechfutures.com/stock-exchange-ipos/zilch-reportedly-engages-banks-for-london-ipo)
    — FinTech Futures'
