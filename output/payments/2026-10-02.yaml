- headline: Citi goes live on Swift instant payments scheme across multiple markets
  standfirst: Corporate clients gain cross-border instant payment access through a
    single account structure, testing whether Swift's scheme can scale beyond early
    adopters.
  body: 'Citi has activated multiple markets on Swift''s instant payments scheme,
    enabling its corporate banking clients to reach cross-border instant payment networks
    through a unified account structure. The go-live makes Citi one of the first global
    banks to operationalise the Swift scheme at scale, following earlier pilots and
    single-market launches by BBVA and others.


    Swift''s retail and instant payments strategy is depending on major correspondent
    banks adopting its framework to connect domestic real-time networks internationally.
    Citi''s reach across corporate treasury and trade finance gives the scheme its
    most significant production footprint to date. Barclays, HSBC, Lloyds and NatWest
    adopted Swift''s retail payments framework in July, but Citi''s multi-market activation
    moves the scheme closer to production volumes.


    The practical test now is whether corporate treasurers use the capability at scale
    or continue to rely on existing cross-border channels. Instant settlement across
    borders introduces liquidity management complexity that corporates have yet to
    build into their treasury operations at scale.'
  editorial_note: Citi's multi-market go-live on Swift's instant payments scheme is
    a material step in the infrastructure's commercialisation, following earlier single-bank
    adoptions. It signals that the scheme is moving from pilot to production among
    tier-one correspondents.
  sources: '[Citi launches multi-market instant payments on Swift scheme](https://www.finextra.com/newsarticle/48508/citi-launches-multi-market-instant-payments-on-swift-scheme?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'The bank's activation' after headline names 'Citi' —
      this violates rule [1] which requires opening with the substantive point rather
      than restating the subject. Should begin with 'This move gives corporate clients…'
      or similar.
    - Body paragraph 2 contains 'Citi's participation is a meaningful validation of
      the model' — this announces significance before substantive point, violating
      the rule against 'This matters because' framing. Rephrase to lead directly with
      the substantive claim about the bank's role.
    - Body paragraph 2 uses present tense 'depends on' when describing Swift's strategy
      relative to the Citi announcement — should use present continuous 'is depending
      on' to signal the ongoing, currency-laden nature of this relationship in context
      of the news.
    - Final sentence 'Instant settlement across borders introduces liquidity management
      complexity that many corporates have not yet operationalised' uses vague attribution
      ('many corporates') without source or evidence — this appears to be editorial
      assertion rather than attributed reporting.
