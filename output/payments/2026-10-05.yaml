      around its relevance to European readers by opening with an audience-address
      clause. Remove this framing and state the strategic question directly as part
      of the narrative.
    - 'Body paragraph 3 opens with a colon-introduced binary question (''the question
      is whether these integrations coalesce around common protocols or fragment into
      proprietary agent-merchant relationships''), which violates the rule against
      opening paragraphs with colon-introduced binary questions. Recast with a preposition:
      ''These integrations face a strategic question about whether...'' or similar.'
