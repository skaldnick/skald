title: 'TrueLayer-SumUp partnership; Basware acquires Trustpair; open banking and
  financial inclusion

  '
social_post: 'TrueLayer and SumUp bring open banking to merchant account top-ups,
  Basware buys fraud prevention platform Trustpair, and open banking''s role in serving
  credit-invisible borrowers. Today''s briefing: {link}

  '
stories:
- headline: TrueLayer partners with SumUp to add open banking top-ups
  standfirst: The partnership extends pay-by-bank into SumUp's consumer ecosystem,
    giving personal account holders a card-free route to fund their accounts.
  body: 'TrueLayer is partnering with SumUp to enable account top-ups via open banking
    for users of SumUp''s consumer personal accounts. The integration allows account
    holders to add funds directly from their bank, bypassing card rails.


    SumUp serves more than four million merchants globally but has also built out
    consumer-facing financial services. Adding an open banking funding option to its
    personal accounts reduces the friction and cost associated with card-based top-ups,
    and gives TrueLayer distribution into a consumer segment adjacent to SumUp''s
    core merchant base.


    The deal fits a broader pattern of open banking providers seeking volume through
    embedded partnerships rather than direct merchant sales. For SumUp, it is a practical
    improvement to a core workflow. For TrueLayer, which has been expanding its European
    footprint through product launches and acquisitions, it represents another channel
    into everyday consumer payment flows.'
  editorial_note: Relevant as it shows open banking pay-by-bank extending into consumer
    account funding via a major payments platform, broadening beyond checkout use
    cases.
  sources: '[TrueLayer and SumUp partner to simplify account top-ups](https://www.finextra.com/pressarticle/111129/truelayer-and-sumup-partner-to-simplify-account-top-ups)
    — Finextra Research'
