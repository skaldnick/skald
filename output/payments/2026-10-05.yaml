- headline: Salad Finance uses open banking to underwrite borrowers excluded by credit
    scores
  standfirst: Direct analysis of bank account cashflows is replacing credit-score-based
    assessments for consumers whom traditional credit infrastructure systematically
    overlooks.
  body: 'Salad Finance is using open banking transaction data to underwrite consumers
    who lack conventional credit histories, replacing credit-score-based assessments
    with direct analysis of bank account cashflows. The firm''s model assesses an
    individual''s actual financial behaviour rather than relying on historical repayment
    records that may penalise people for short periods of financial difficulty.


    The UK''s financially excluded population remains substantial. Consumers with
    thin or impaired credit files face a circular problem: they cannot access credit
    products that would build a score, and without a score they cannot access credit.
    Open banking data offers a route out of that loop by providing lenders with a
    richer, more current picture of affordability and repayment capacity.


    The model aligns with the Financial Conduct Authority''s (FCA) broader direction
    of travel. The regulator signalled in September 2026 that it is exploring the
    use of rent payment data in mortgage affordability checks, and its open finance
    roadmap published in April 2026 explicitly scoped investment and pension data
    as areas where data sharing could improve outcomes. Salad Finance''s approach
    represents the lending-end application of that same logic.'
  editorial_note: Selected because it provides a concrete UK example of open banking
    data being used for financial inclusion, a theme that connects to the FCA's open
    finance roadmap and ongoing regulatory interest in alternative affordability data.
  sources: '[Community finance and open banking technology can support ''credit invisibles''](https://www.finextra.com/newsarticle/48515/community-finance-and-open-banking-technology-can-support-credit-invisibles--salad-finance)
    — Finextra Research'
  style_check:
    compliant: false
    warnings:
    - Headline and standfirst both open with the same substantive point (open banking
      being used/deployed). Vary the opening in at least one element per rule on not
      starting headline, standfirst, and body opening sentence with the same word
      or phrase.
    - Body text uses 'September 2026' and 'April 2026' — future dates that appear
      to be errors. Verify these dates are correct.
    - 'The standfirst uses ''FCA'' without spelling it out on first mention. Per the
      rule on abbreviations in standfirsts, common abbreviations like FCA may be used
      without spelling out, but the body must still introduce the full form on first
      use if the abbreviation recurs. The body does use ''FCA'' but does not spell
      it out on first reference as ''Financial Conduct Authority (FCA)'' — it assumes
      the standfirst has covered it. The rule states: ''When a company name has a
      recognisable short form... use the short form consistently after first mention''
      and separately requires spelling out abbreviations in body on first use if they
      recur. The body''s first use of FCA must spell it out: ''Financial Conduct Authority
      (FCA)''.'
  verification:
