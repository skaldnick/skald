- headline: Open banking data finds a role in serving credit-invisible borrowers
  standfirst: Transaction-level bank data is being used to underwrite borrowers excluded
    by conventional credit scoring, testing whether open banking can move beyond payments
    into meaningful credit access.
  body: 'Salad Finance is using open banking data to underwrite loans for borrowers
    who lack a conventional credit history, a group sometimes described as "credit
    invisibles". Rather than relying on credit bureau scores, the firm analyses bank
    transaction data to assess income stability, spending patterns and affordability.


    The approach addresses a structural gap in consumer lending. Borrowers with thin
    credit files, including recent immigrants, people recovering from financial difficulty
    and those who have avoided mainstream credit products, are routinely declined
    by automated scoring models regardless of their actual ability to repay. Open
    banking data provides an alternative signal that reflects current financial behaviour
    rather than historical credit events.


    Salad operates as a community finance provider, sitting outside the mainstream
    consumer lending market. The model is small-scale, but it illustrates a use case
    for open banking that extends beyond payments and into credit decisioning. The
    FCA''s recent signals around using open banking data in mortgage affordability
    checks point in the same direction, suggesting that transaction-level data is
    gaining regulatory as well as commercial credibility as an underwriting input.'
  editorial_note: Illustrates a concrete open banking use case in credit underwriting
    that connects to the FCA's broader open finance direction, relevant to professionals
    tracking where open banking data creates value beyond payments.
  sources: '[Community finance and open banking technology can support ''credit invisibles''](https://www.finextra.com/newsarticle/48515/community-finance-and-open-banking-technology-can-support-credit-invisibles--salad-finance)
