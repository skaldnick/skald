- headline: Basware acquires payment fraud prevention platform Trustpair
  standfirst: Real-time supplier verification is being folded into Basware's invoice
    lifecycle management suite, reflecting growing demand for fraud controls embedded
    within B2B payment workflows.
  body: 'Basware has acquired Trustpair, a payment fraud prevention platform that
    verifies supplier bank account details before payments are executed. Financial
    terms were not disclosed.


    Trustpair''s core product checks payee identity and account ownership in real
    time, targeting business email compromise and supplier impersonation fraud. Integrating
    this capability into Basware''s invoice-to-pay workflow means fraud checks can
    occur at the point of invoice processing rather than as a separate step, reducing
    the gap between approval and payment that fraudsters typically exploit.


    Verification of payee requirements are tightening across European instant payments,
    and B2B payment fraud continues to grow in sophistication. For corporates using
    Basware''s platform, native fraud prevention removes the need for a separate vendor
    integration, a practical consideration as real-time payment adoption compresses
    the window for manual checks.'
  editorial_note: ''
  sources: '[Basware buys payment fraud prevention platform Trustpair](https://www.finextra.com/newsarticle/48532/basware-buys-payment-fraud-prevention-platform-trustpair?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
