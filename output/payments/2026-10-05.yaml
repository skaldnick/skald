- headline: Lloyds settles $750,000 with Visa using stablecoins in live cross-border
    pilot
  standfirst: The first stablecoin settlement trial between Visa and a major UK bank
    tested whether USDC could cut overnight and weekend delays in cross-border fund
    transfers.
  body: 'Lloyds Banking Group and Visa have completed a seven-day live pilot using
    USDC to settle $750,000 in cross-border payment obligations. Funds reached Visa
    in under an hour, including over the weekend, compared with the day or more that
    traditional settlement can take when initiated outside banking hours. Lloyds purchased
    the USDC through Archax, a UK-regulated digital asset exchange, and booked the
    settlement through its Corporate Markets branch in Jersey before transferring
    to Visa in the US.


    The pilot tested interoperability between two different blockchain environments.
    Lloyds operated its own node on Canton, a network with configurable privacy features,
    while Visa supported settlement on a separate public blockchain. Peter Left, head
    of digital assets at Lloyds, said the trial allowed the bank to move beyond theory
    and test stablecoin capabilities with real payment obligations rather than a simulated
    model.


    The trial focused on settlement between financial institutions rather than the
    consumer payment layer. For European banks watching the stablecoin settlement
    space, the pilot is one of a series of signals that major institutions are moving
    from exploratory research to live testing with real money. Visa''s stablecoin
    settlement volume passed a $20 billion annualised run rate last month, and the
    network now supports settlement across nine blockchains after expanding its pilot
    in April.'
  editorial_note: This story was announced on September 30 by Lloyds Banking Group
    and widely reported October 1-3. It has not been previously covered in the briefing.
    It is significant because it represents the first live stablecoin settlement between
    Visa and a major UK banking group, moving from the theoretical to real-money testing.
    The primary source is the Lloyds Banking Group press release, with supporting
    reporting from The Paypers, Electronic Payments International, and The Block.
  sources: '[Lloyds and Visa test faster, round-the-clock cross-border settlement
    using stablecoins](https://www.lloydsbankinggroup.com/media/press-releases/2026/lloyds-banking-group/lloyds-and-visa-test-round-the-clock-cross-border-settlement-using-stablecoins.html)
    — Lloyds Banking Group'
