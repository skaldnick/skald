title: 'Trustly fundraise; ANZ tokenised payment; Basware acquires Trustpair

  '
social_post: 'Trustly raises fresh capital weeks after cutting a quarter of its staff.
  Plus: ANZ goes live on Swift''s shared ledger, and Basware buys fraud prevention
  platform Trustpair. {link}

  '
stories:
- headline: Trustly raises new capital to fund AI platform after deep restructuring
  standfirst: Weeks after cutting a quarter of its workforce, a capital raise will
    fund a real-time intelligence layer across the Swedish open banking payments firm's
    network.
  body: 'Trustly has secured new capital to fund what it describes as a shift from
    pure payment processing toward a real-time intelligence platform. The investment
    will support expansion of its open banking payments network, which currently spans
    the US, Canada and Europe.


    The fundraise comes barely two weeks after Trustly cut roughly 25% of its staff
    in a push toward profitability, a move that signalled the company was under pressure
    to demonstrate a sustainable business model. Neither Trustly nor its investors
    have publicly explained the relationship between the restructuring and the fundraise,
    though the proximity of the two events suggests the cuts were at minimum a precondition
    for new investment.


    The pivot toward intelligence and data services layered on top of payment flows
    mirrors a broader pattern among open banking infrastructure providers seeking
    to extract more value from their networks. Trustly must retain merchant and bank
    relationships through significant organisational disruption for the strategy to
    succeed, and the company''s ability to do so while simultaneously building out
    a new platform will test its operational capacity.'
  editorial_note: Follows up on Trustly's workforce reduction covered on September
    24, with the new angle being a capital raise that reframes the restructuring as
    part of a strategic pivot rather than a simple cost-cutting exercise.
  sources: '[Trustly Raises New Capital to Power the Next Era in Open Banking](https://finovate.com/trustly-raises-new-capital-to-power-the-next-era-in-open-banking/)
    — Finovate'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'the Swedish open banking payments firm' which is
      Trustly, the organisation named in the headline. Per rule 1, the standfirst
      should begin with the substantive point (the capital raise and its purpose)
      rather than identifying the organisation. Revise to open with 'Weeks after cutting
      a quarter of its workforce, a capital raise will fund…' or similar.
    - 'Body paragraph 2: ''Raising capital so quickly after a major restructuring
      suggests either that the cuts were a precondition for the investment or that
      the company is moving fast to reposition itself before market conditions shift
      further.'' This is speculation framed as analysis rather than a direct substantive
      point. The sentence hedges significance (''suggests either…or'') without reporting
      what Trustly or sources have actually said about the relationship between the
      cuts and the fundraise.'
    - 'Body paragraph 3: ''Whether the strategy delivers depends on Trustly''s ability
      to retain merchant and bank relationships through a period of significant organisational
      disruption.'' This opens a paragraph with a conditional question-framed hedge
      (''Whether the strategy delivers depends on…'') rather than leading with the
      substantive challenge. Reframe as ''Trustly must retain merchant and bank relationships
      through significant organisational disruption for the strategy to succeed''
      or move this as a supporting point after a stronger opening.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Standfirst revised to open with the substantive point ('Weeks after cutting
      a quarter of its workforce, a capital raise will fund…') rather than naming
      the organisation, per rule 1.
    - 'Body paragraph 2: replaced speculative ''suggests either…or'' construction
      with a more grounded observation that neither Trustly nor its investors have
      publicly explained the relationship, while noting the proximity suggests the
      cuts were at minimum a precondition.'
    - 'Body paragraph 3: reframed opening from conditional hedge (''Whether the strategy
      delivers depends on…'') to a direct substantive claim (''Trustly must retain
      merchant and bank relationships…'').'
- headline: ANZ completes live cross-border payment on Swift's shared ledger
  standfirst: The transaction marks another production milestone for the shared ledger
    infrastructure, following BNP Paribas and HSBC's corporate payment in September.
  body: 'ANZ has completed a live corporate treasury transaction using tokenised deposits
    settled on Swift''s blockchain-based shared ledger. The cross-border payment is
    the latest in a series of production transactions on the platform, which moved
    from pilot to live use in July.


    Swift''s shared ledger has been progressing through increasingly significant milestones.
    Banks piloted live transactions in July, BNP Paribas and HSBC completed the first
    corporate payment in September, and ACI Worldwide connected its cloud payments
    hub to the platform the same month. ANZ''s transaction extends the network''s
    geographic reach into the Asia-Pacific region and adds another major bank to the
    roster of active participants.


    The steady drumbeat of live transactions signals that tokenised settlement infrastructure
    is moving past proof-of-concept. Banks now face a practical challenge: how quickly
    they will route meaningful volumes through it, and what that means for existing
    correspondent banking arrangements.'
  editorial_note: Advances the Swift shared ledger story beyond the September milestones
    previously covered, with a new bank completing a live production transaction that
    extends the platform's geographic footprint.
  sources: '[ANZ completes cross-border tokenised deposit payment with Swift ledger](https://www.finextra.com/newsarticle/48534/anz-completes-cross-border-tokenised-deposit-payment-with-swift-ledger?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming Swift, which is also named in the headline. Per rule
      [1], the standfirst should open with the substantive point (e.g., 'The transaction
      marks another production milestone') rather than naming the organisation from
      the headline. Revise to avoid redundant repetition.
    - 'Body text contains ''For European payments professionals, the steady drumbeat
      of live transactions signals that tokenised settlement infrastructure is moving
      past proof-of-concept.'' This violates rule [21]: do not frame a paragraph around
      its relevance to European readers by opening with ''For European payments professionals…''
      If the European dimension is genuinely relevant, state it directly as part of
      the narrative without prefacing it with an audience-address clause.'
    - 'Body text opens paragraph with ''The question is shifting from whether the
      technology works to how quickly banks will route meaningful volumes through
      it, and what that means for existing correspondent banking arrangements.'' This
      violates rule [3]: do not open a paragraph with a colon-introduced binary question
      when the sentence can be recast with a preposition. The opening should avoid
      the ''The question is'' framing and state the substantive point directly.'
    - Body text uses vague temporal reference 'earlier this year' without specific
      time periods. Per rule [9], use specific time periods when referring to business
      developments. Replace with a specific month or quarter.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Standfirst revised to avoid naming Swift, which is already named in the headline,
      replacing 'Swift's distributed ledger infrastructure' with 'the shared ledger
      infrastructure'.
    - Removed 'For European payments professionals,' audience-address clause from
      the opening of the final paragraph per rule [21].
    - Recast 'The question is shifting from whether the technology works to how quickly…'
      to avoid the 'The question is' framing, stating the substantive point directly
      per rule [3].
    - Replaced vague 'earlier this year' with 'in July' to match the specific month
      mentioned later in the body per rule [9].
- headline: Basware acquires payment fraud prevention platform Trustpair
  standfirst: Growing corporate demand for fraud prevention at the point of payment
    initiation is driving consolidation in the B2B payment integrity space, with pre-payment
    verification now being embedded directly into invoice processing workflows.
  body: 'Basware, the invoice lifecycle management company, has acquired Trustpair,
    a platform that verifies supplier bank account details before payments are released.
    Financial terms were not disclosed.


    The acquisition sits at the intersection of two trends shaping European corporate
    payments. First, the SEPA instant payments regulation''s payee verification requirements
    are pushing all payment initiators to validate recipient details in real time.
    Second, invoice fraud and business email compromise remain among the most costly
    forms of payment fraud for corporates, and prevention increasingly depends on
    automated checks embedded in existing workflows rather than bolt-on solutions.


    By integrating Trustpair''s verification capabilities into its invoice processing
    platform, Basware is betting that corporates want fraud prevention built into
    the accounts payable process itself rather than handled separately. Basware''s
    core business is managing the full invoice lifecycle, so adding pre-payment verification
    is a logical extension that could also strengthen its position against competitors
    offering similar end-to-end propositions.'
  editorial_note: Relevant to European payments professionals because it connects
    corporate payment fraud prevention with the verification of payee requirements
    under the SEPA instant payments regulation, and signals consolidation in the B2B
    payment integrity space.
  sources: '[Basware buys payment fraud prevention platform Trustpair](https://www.finextra.com/newsarticle/48532/basware-buys-payment-fraud-prevention-platform-trustpair?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the action ('The deal embeds') rather than the substantive
      point or consequence. Per rule [1], the standfirst should avoid opening with
      the organisation named in the headline (Basware) and begin with the substantive
      point—here, the growing corporate demand for verification. Revise to open with
      'Growing corporate demand for fraud prevention at the point of payment initiation
      is driving…' or similar.
    - Body text uses 'SEPA instant payments regulation's verification of payee requirements'
      — this is unclear phrasing. The rule on 'SEPA instant payment regulation' (singular
      or plural) should be consistent, and 'verification of payee requirements' is
      awkward. Consider 'the SEPA instant payments regulation's payee verification
      requirements' for clarity.
    - The phrase 'For a company whose core business is managing the full invoice lifecycle'
      opens a paragraph with a prepositional phrase that is somewhat vague. While
      not explicitly prohibited, consider whether this could be tightened—eg, 'Basware's
      core business is managing the full invoice lifecycle, so adding pre-payment
      verification…' would be more direct.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with the substantive point ('Growing corporate demand
      for fraud prevention…') rather than 'The deal embeds', avoiding redundant repetition
      of the headline subject per rule [1].
    - Changed 'SEPA instant payments regulation's verification of payee requirements'
      to 'SEPA instant payments regulation's payee verification requirements' for
      clarity.
    - Restructured final paragraph's opening from 'For a company whose core business
      is managing the full invoice lifecycle, adding…' to 'Basware's core business
      is managing the full invoice lifecycle, so adding…' for directness.
- headline: TrueLayer and SumUp partner on open banking account top-ups
  standfirst: Pay-by-bank functionality is being added to SumUp's personal account
    top-ups, extending open banking deeper into the SME payments stack.
  body: 'TrueLayer is partnering with SumUp to enable open banking-powered account
    top-ups for SumUp''s personal account holders. The integration allows merchants
    using SumUp''s financial services to fund their accounts directly from their bank,
    bypassing card rails.


    SumUp has evolved from a card terminal provider into a broader financial services
    platform for small businesses, offering business accounts, invoicing and lending
    alongside its core payment acceptance product. Adding open banking top-ups through
    TrueLayer removes friction from a routine task, since merchants currently funding
    accounts via card or bank transfer face either interchange costs or slower settlement.


    Open banking payments are finding traction in Europe not by competing head-on
    with cards at the checkout, but by gaining ground in adjacent workflows where
    cost savings or speed improvements are more immediately apparent to the end user,
    particularly in B2B and merchant services contexts.'
  editorial_note: Illustrates the practical adoption pattern for open banking payments
    in Europe — gaining ground in merchant services workflows rather than consumer
    checkout — through a partnership between two significant European payments players.
  sources: '[TrueLayer and SumUp partner to simplify account top-ups](https://www.finextra.com/pressarticle/111129/truelayer-and-sumup-partner-to-simplify-account-top-ups)
    — Finextra Research'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the organisation also named in the headline: ''The
      integration brings...'' should avoid opening with the subject when TrueLayer
      is already in the headline. Recast to open with the substantive point — e.g.,
      ''Pay-by-bank functionality is being added to...'' (Rule 1)'
    - Body paragraph 3 opens with 'The partnership is a useful indicator' — this is
      a scene-setting sentence that announces significance before making the substantive
      point. Write the substantive claim directly about where open banking is finding
      traction, without the framing device (Rule on not announcing notability)
  verification:
