- headline: 'Bank of England selects three firms for digital pound lab experiments

    '
  standfirst: 'NOBO, Dun and Bradstreet and Polygon Labs will explore programmable
    payments and commercial data integration in the BoE''s latest digital pound sandbox
    round.

    '
  body: 'The Bank of England has selected three firms for the next phase of its digital
    pound lab: NOBO, Dun and Bradstreet, and Polygon Labs. Each will explore different
    aspects of how a retail central bank digital currency could work in practice,
    from consent-driven wallet transaction data to commercial intelligence integration.


    NOBO''s involvement centres on combining open finance signals with wallet transaction
    data, while Dun and Bradstreet brings commercial credit intelligence including
    its proprietary business datasets. Polygon Labs, a blockchain infrastructure firm,
    adds a distributed ledger dimension to the experiments. The mix of participants
    reflects the BoE''s interest in testing how a digital pound might interact with
    both traditional financial data and newer technology stacks.


    The selections come as the European Parliament has voted to advance the digital
    euro to final negotiations. While the UK''s digital pound remains at an earlier
    stage than its eurozone counterpart, the lab programme is the primary mechanism
    through which the BoE is testing design choices and use cases before any decision
    on whether to proceed.

    '
  editorial_note: 'The digital pound lab selections are a concrete step in UK CBDC
    development, relevant alongside the ECB''s parallel digital euro process. The
    participant mix, spanning open finance, commercial data and DLT, signals the breadth
    of design questions still being explored.

    '
  sources: '[BoE Digital Pound Lab Picks NOBO, D&B and Polygon Labs](https://thefintechtimes.com/boe-digital-pound-lab-picks-nobo-db-and-polygon-labs/)
    — The Fintech Times'
