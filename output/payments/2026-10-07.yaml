- headline: Mollie launches pay-by-bank in the Netherlands using GoCardless infrastructure
  standfirst: The first major product integration since the two companies combined
    tests whether a merged entity can challenge iDEAL and Wero on cost.
  body: 'Mollie has launched a pay-by-bank product in the Netherlands, connecting
    directly to Dutch consumer bank accounts using open banking technology inherited
    from its acquisition of GoCardless. Mollie CEO Koen Koppen has positioned the
    product as a lower-cost alternative to both iDEAL and Wero for Dutch merchants.


    The launch is the first significant commercial integration since Mollie completed
    its 1.1 billion euro acquisition of GoCardless in September. By routing payments
    through open banking rails rather than card networks or scheme-based systems,
    Mollie is betting that cost savings will be sufficient to shift merchant behaviour
    in a market where iDEAL already dominates online checkout. The competitive dynamics
    are sharpened by the ongoing migration of iDEAL volumes to Wero, which introduces
    its own pricing and governance structure.


    Mollie''s move illustrates how acquirers that have absorbed open banking infrastructure
    are beginning to deploy it commercially across Europe. Pay-by-bank''s ability
    to compete with entrenched local payment methods on conversion rates and consumer
    experience, not just price, remains the central question.'
  editorial_note: This is the first material product launch from the Mollie-GoCardless
    combination, previously covered as an acquisition story. The new angle is commercial
    deployment and its competitive positioning against iDEAL and Wero in the Dutch
    market.
  sources: '[Mollie Strengthens Pay by Bank to Power the Next Generation of European
    Payments](https://glenbrook.com/payments_news/mollie-strengthens-pay-by-bank-to-power-the-next-generation-of-european-payments/)
    — Glenbrook | [How Mollie''s Pay by Bank Powers Next Gen European Payments](https://fintechmagazine.com/news/how-mollies-pay-by-bank-powers-next-gen-european-payments)
    — FinTech Magazine'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the acquisition ('Mollie's acquisition of GoCardless')
      which is also named in the headline. Per rule [1], the standfirst should begin
      with the substantive point or action rather than restating the subject from
      the headline. Rewrite to open with 'The first major product integration tests
      whether...' or similar.
    - Body paragraph beginning 'For the broader European market, Mollie's move illustrates...'
      uses the framing construction 'For European readers' equivalent. Per rule [21],
      do not frame paragraph relevance this way; state the European dimension directly
      as part of the narrative instead.
    - The sentence 'Whether pay-by-bank can compete with entrenched local payment
      methods on conversion rates and consumer experience, not just price, remains
      the central question' opens a paragraph with a colon-introduced binary question
      (implicit through 'Whether'). Per rule [3], this sentence should be recast with
      a preposition — eg, 'The central question is whether pay-by-bank can compete...'
      or 'Pay-by-bank's ability to compete with entrenched local payment methods on
      conversion rates and consumer experience, not just price, remains uncertain.'
