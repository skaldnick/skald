- headline: GOV.UK One Login to add open banking as identity verification method
  standfirst: Citizens will be able to verify their identity via bank account data
    on the UK government's central digital identity platform, extending open banking
    into public services.
  body: 'The UK Government Digital Service is planning to add open banking as a verification
    method within GOV.UK One Login, the government''s central digital identity platform.
    Citizens will be able to confirm their identity by sharing verified bank account
    data, alongside existing methods such as passport and driving licence checks.
    The rollout is expected in 2027.


    The integration follows the government''s earlier adoption of Adyen for open banking
    payments on GOV.UK Pay, and broadens the role of open banking from a payment channel
    to an identity layer within public services. Using bank-held data for identity
    verification leverages the fact that banks have already completed KYC checks on
    their customers, effectively repurposing compliance data as a public good.


    Embedding open banking into the state''s own identity infrastructure creates a
    reference use case for the UK''s open finance trajectory, one that could accelerate
    adoption in adjacent sectors such as healthcare, local government and benefits
    administration.'
  editorial_note: 'This extends open banking from payments into identity verification
    within the UK''s core public services platform, a genuinely new use case with
    implications for the broader open finance agenda. Note: the cited source (''Monaco
    startup advances heartbeat biometric authentication'') is completely unrelated
    to this story. The original source for the GOV.UK One Login / open banking integration
    could not be identified from the materials provided.'
  sources: '[Monaco startup advances heartbeat biometric authentication](https://www.biometricupdate.com/202610/monaco-startup-advances-heartbeat-biometric-authentication)
    — Biometricupdate'
  style_check:
    compliant: false
