- headline: ACI and Cognizant validate cloud-native payments switching on AWS at scale
  standfirst: The system sustained double the target transaction load with zero failures
    in stress testing, with Solaris as the first live client on a related deployment.
  body: 'ACI Worldwide and Cognizant have completed a validation of ACI''s BASE24-eps
    payments processing and switching platform running on Amazon Web Services, sustaining
    double the target transaction load without a single failure. Separately, Solaris,
    Europe''s embedded finance platform, has gone live on ACI''s Connetic platform
    to handle the EU Instant Payments Regulation''s requirements for SEPA Instant
    payments.


    Payments switching infrastructure has been among the last critical components
    to move to public cloud. Banks and processors have long questioned whether cloud-hosted
    transaction switching can match the reliability of on-premise deployments at peak
    volumes. A zero-failure result at twice the expected load directly counters that
    objection.


    For ACI, the validation follows its September acquisition of Cranium Ventures
    for cloud-native switching capability. Running BASE24-eps on AWS in a stress test
    at production-grade scale positions ACI to compete for the wave of European bank
    modernisation projects driven by instant payments mandates and scheme compliance
    deadlines.'
  editorial_note: ''
  sources: '[ACI and Cognizant validate BASE24-eps on AWS with zero failures](https://scanx.trade/stock-market-news/companies/aci-worldwide-cognizant-sustain-double-target-load-aws/52139712)
    — ScanX'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst: ''Solaris is the first client live on the system'' — this names
      the organisation that is also named in the body opening. Per rule [1], the standfirst
      should open with the substantive point (the zero-failure stress test result)
      rather than naming Solaris. Revise to open with the action/result, e.g., ''The
      system sustained double the target transaction load with zero failures in stress
      testing, with Solaris as the first live client.'''
    - 'Body paragraph two: ''The test matters because'' — this explicitly flags significance
      before explaining it. Per the ''never flag significance explicitly'' rule, remove
      this framing and lead directly with the substantive point, e.g., ''Card switching
      infrastructure has been among the last payment components to move to public
      cloud.'''
    - 'Body paragraph two: ''The validation at twice the expected load addresses one
      of the core objections banks and processors raise against cloud-hosted transaction
      switching'' — this is weak hedging that delays the substantive claim. Per the
      hedging-scene-setter rule, lead with the direct claim about what the validation
      demonstrates, not what it ''addresses.'''
    - Editorial note included in submission — per rule on not including editorial
      notes in the story text, this should not appear in the copy submitted for publication.
      Remove it or mark it separately if internal only.
  verification:
    verified: false
    stale: false
