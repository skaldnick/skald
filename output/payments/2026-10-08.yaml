title: 'VoP gaps persist; ACI validates cloud switching; Plaid sharpens AI models

  '
social_post: 'A year into Europe''s verification of payee mandate, IBAN-level errors
  still slip through the cracks. Plus: ACI stress-tests cloud card switching, and
  Plaid deploys AI for lending and payment risk. {link}

  '
stories:
- headline: Verification of payee still misses key IBAN errors one year on
  standfirst: Persistent gaps in how banks match IBANs to account holders undermine
    the fraud prevention promise of the EU's mandatory verification of payee regime.
  body: 'One year after verification of payee (VoP) became mandatory under the EU
    Instant Payments Regulation, the check still fails to catch a category of IBAN
    errors that leave payers exposed to misdirected payments and social engineering
    fraud. The analysis identifies cases where formatting inconsistencies, transliteration
    mismatches and partial name entries allow payments to pass verification despite
    being directed to the wrong recipient.


    Standardised name-formatting rules across European banks remain absent, meaning
    the same individual can appear differently across institutions. VoP requires banks
    to match an IBAN against the account holder''s name before a payment is released,
    but where a bank''s records use abbreviated or transliterated names, the check
    may return a partial match or a false positive, giving the payer unwarranted confidence.


    The European Payments Council''s fraud data-sharing consultation, opened in September
    2024, may eventually address some of these shortcomings by improving the quality
    of reference data banks use. But the structural problem is clear: a verification
    regime is only as strong as the data it draws on, and Europe''s fragmented account-holder
    records remain a weak link in the instant payments chain.'
  editorial_note: This advances the verification of payee story covered on June 17
    and October 2 by identifying specific technical gaps that persist a year into
    the mandate, with direct implications for fraud prevention and bank compliance.
  sources: '[Verification of Payee (VoP) One Year On: The IBAN Errors Europe''s New
    Payment Check Still Misses](https://techbullion.com/verification-of-payee-vop-one-year-on-the-iban-errors-europes-new-payment-check-still-misses/)
    — Techbullion'
  style_check:
    compliant: false
    warnings:
