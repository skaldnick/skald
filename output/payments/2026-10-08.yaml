      the body''s opening sentence repeats this near-verbatim: ''VoP requires banks
      to match an IBAN against the account holder''s name''. Vary the opening in at
      least one element to avoid redundant repetition across standfirst and body (rule:
      Do not start the headline, standfirst, and body opening sentence with the same
      word or phrase).'
    - Body text uses 'verification of payee (VoP)' on first mention, but the standfirst
      already introduces 'VoP' without spelling it out. Per the rule on abbreviations
      in standfirsts, this is acceptable in the standfirst, but the body must still
      introduce the full form on first use if the abbreviation recurs — which it does.
      However, the body does spell it out correctly, so this is compliant. No flag
      needed here.
    - 'The phrase ''The issue sits at the implementation layer rather than the regulation
      itself'' opens a paragraph with a scene-setting qualifier before the substantive
      point. Consider leading directly with the substantive claim: ''Standardised
      name-formatting rules across European banks remain absent, meaning the same
      individual can appear differently across institutions.'' (rule: Do not open
      a paragraph with ''The deal is far from certain'' or equivalent hedging scene-setters
      that delay the substantive point).'
    - The standfirst states 'Persistent gaps in how banks match IBANs to account holders
      undermine the fraud prevention promise' but does not name the specific initiatives
      or programmes affected. Per the rule on standfirst stakes, it should name 'the
      EU's mandatory verification of payee regime' or similar — which it does mention.
      This is compliant.
    - 'Body text refers to ''The European Payments Council''s fraud data-sharing consultation,
      opened in September'' — this uses ''opened in September'' without specifying
      the year. For clarity, use a specific date (e.g., ''September 2024'') or month-year
      if the specific date is unknown (rule: Avoid vague temporal references such
      as ''in June'' or ''last month'' when a specific date is available).'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Rewrote the opening of the second paragraph to lead directly with the substantive
      claim ('Standardised name-formatting rules across European banks remain absent')
      rather than the hedging scene-setter 'The issue sits at the implementation layer
      rather than the regulation itself'.
    - Added '2024' to 'opened in September' to avoid a vague temporal reference without
      a year.
    - No change needed for standfirst/body repetition flag — the standfirst and body
