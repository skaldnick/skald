- headline: Plaid launches AI models to sharpen lending decisions and cut payment
    risk
  standfirst: New machine learning models aim to improve cashflow-based underwriting
    accuracy and reduce failed pay-by-bank transactions across the platform.
  body: 'Plaid has released a set of AI models designed to improve two areas central
    to its open banking business: credit risk assessment for lenders and payment success
    rates for pay-by-bank transactions. The models use transaction data flowing through
    Plaid''s network to generate more granular income and spending signals for underwriting,
    and to predict which payment attempts are likely to fail before they are initiated.


    On the lending side, the models build on Plaid''s existing cashflow data products
    by applying machine learning to detect patterns that rules-based systems miss,
    such as irregular income streams or spending behaviours that correlate with default
    risk. For pay-by-bank, the models assess account balance and transaction history
    in real time to flag payments at risk of insufficient funds, allowing merchants
    to intervene before a failed transaction damages conversion rates.


    The release reflects a broader trend among open banking infrastructure providers:
    moving from data access into data intelligence. As pay-by-bank scales in the UK
    and Europe, the reliability of individual payment attempts becomes a competitive
    differentiator. Plaid''s approach of absorbing payment risk, first signalled with
    its guaranteed ACH payments product launched in May, now extends to predictive
    failure prevention.'
  editorial_note: ''
  sources: '[Plaid unveils new AI models to improve lending decisions and reduce payment
    risk](https://www.openbankingexpo.com/news/plaid-unveils-new-ai-models-to-improve-lending-decisions-and-reduce-payment-risk/)
    — Openbankingexpo'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (Plaid) that is also named in the
      headline. Per rule [1], the standfirst should begin with the substantive point
      or action instead — eg, 'New machine learning models aim to improve...' rather
      than naming Plaid first.
    - Body text uses 'May' without a specific date when discussing the guaranteed
      pay-by-bank product launch. Per rule on vague temporal references, use the precise
      date (eg, 'on May 15') or acknowledge only a month is known; 'in May' is acceptable
      but 'May' alone as a temporal reference is vague.
    - Editorial note is included in the submission. Per house style rules, do not
      include editorial notes in the text provided for copy-editing — these should
      be removed before the story is finalised.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Plaid Guaranteed Payments (May launch) is an ACH payment guarantee product,
      not specifically a 'guaranteed pay-by-bank product' as stated in the draft
  revision:
    replaced: false
    resolved: true
    summary:
    - Standfirst already opened with 'New machine learning models…' rather than naming
      Plaid, so no change was needed — the flagged issue reflected the original draft
      but the text was already compliant.
