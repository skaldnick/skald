- headline: Visa and Mastercard face £700m claim over post-Brexit interchange fee
    rises
  standfirst: A new legal challenge argues that interchange fee increases on transactions
    between UK merchants and EEA-issued cards after Brexit were unjustified and anticompetitive.
  body: 'Visa and Mastercard are facing a £700 million legal claim over their decision
    to increase interchange fees on transactions between UK businesses and EEA-issued
    cards following Brexit. The claim argues that the fee increases, which took effect
    after the UK lost the protection of the EU''s Interchange Fee Regulation, were
    unjustified and anticompetitive.


    The Payment Systems Regulator found that Visa and Mastercard account for nine
    in 10 online transactions at UK businesses using EEA-issued cards, giving them
    substantial pricing power in the absence of the EU cap. Both schemes raised cross-border
    interchange fees after Brexit, with some rates increasing several-fold. The PSR''s
    earlier market review into scheme fees, and its May proposal to require mandatory
    profit reporting from both networks, form the regulatory backdrop to this litigation.


    The claim adds legal risk to the commercial and regulatory pressure already bearing
    on the card schemes'' UK fee structures. It arrives as alternative payment methods,
    including the newly launched UK Payments Initiative and growing pay-by-bank adoption,
    offer merchants potential routes to reduce card dependency.'
  editorial_note: The claim adds a legal dimension to the regulatory and competitive
    pressure on card scheme interchange economics in the UK following Brexit.
  sources: '[Visa and Mastercard face £700 million claim over post-Brexit card fees](https://iclg.com/news/visa-and-mastercard-face-700-million-claim-over-post-brexit-card-fees/)
    — ICLG'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'the card schemes' which are also named in the headline
      as 'Visa and Mastercard'. Per rule [1], the standfirst should begin with the
      substantive point rather than naming the organisation. Rephrase to open with
      'A new legal challenge argues that…' or similar.
    - Body text uses 'nine out of 10' which should be written as 'nine in 10' or 'nine
      of 10' to avoid the informal construction. More precisely, per rule [6], numbers
      one to nine should be words, and 'nine out of 10' uses 'ten' in digit form correctly,
      but 'out of' is colloquial; prefer 'nine in 10'.
    - Editorial note flags significance explicitly ('crystallises the post-Brexit
      interchange fee controversy into litigation') in a way that announces notability.
      Per rule [5], do not flag significance explicitly; the editorial note should
      not announce importance before explaining it or state what the claim 'adds'
      in terms of pressure or risk.
    - Body text states 'Both schemes raised cross-border interchange fees significantly
      after Brexit, in some cases quintupling rates.' The word 'quintupling' is vague
      without specific examples. This should be qualified with concrete figures or
      removed.
    - Standfirst uses 'cross-border interchange fees' but body text later specifies
      these are fees 'on transactions between UK businesses and EEA-issued cards'.
      The standfirst should clarify the direction and nature of these fees for precision.
