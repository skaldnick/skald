- headline: FCA taskforce maps open finance use cases and identifies infrastructure
    gaps
  standfirst: Governance and operating model choices matter as much as technical capability
    in scaling open finance beyond payments, according to the PRISM taskforce's findings.
  body: 'The Financial Conduct Authority''s PRISM taskforce has published findings
    from its assessment of open finance use cases, concluding that common infrastructure,
    governance and operating model choices are as important as the individual applications
    they support. The taskforce examined how open finance principles could extend
    beyond payment accounts into areas such as mortgages, pensions and insurance.


    The publication sits alongside a separate FCA report summarising outputs from
    its mortgages and open finance policy sprint, which examined how open finance
    data could reshape mortgage affordability assessments. Together, the documents
    advance the FCA''s open finance roadmap, published in April, by identifying specific
    barriers to adoption and areas where regulatory intervention or industry coordination
    may be needed.


    The emphasis on shared infrastructure and governance echoes a recurring theme
    in European open finance discussions: that technical connectivity alone is insufficient
    without agreed standards for data quality, liability and consumer consent. The
    FCA''s approach contrasts with the EU''s Financial Data Access regulation, which
    takes a more prescriptive legislative route to similar ends.'
  editorial_note: The PRISM taskforce findings move the FCA's open finance agenda
    from roadmap to specifics, identifying concrete infrastructure requirements and
    marking a further point of divergence from the EU's FiDA framework.
  sources: '[FCA''s PRISM Taskforce publishes Open Finance use case impact findings](https://www.openbankingexpo.com/news/fcas-prism-taskforce-publishes-open-finance-use-case-impact-findings/)
    — Openbankingexpo | [Open finance and the future of mortgage lending: FCA sprint
    outcomes for the industry](https://www.addleshawgoddard.com/en/insights/insights-briefings/2026/financial-regulation/financial-regulation-in-the-know-consumer-finance-october-2026/open-finance-future-mortgage-lending-fca-sprint-outcomes-industry/)
    — Addleshawgoddard'
  style_check:
