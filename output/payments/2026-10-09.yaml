title: 'TrueLayer raises $27m; Mastercard mandates offline payments; FCA publishes
  open finance findings

  '
social_post: 'TrueLayer raises $27m with Italian state backing, Mastercard mandates
  offline payments across Europe from 2027, and the FCA''s PRISM taskforce maps open
  finance use cases. Today''s briefing: {link}

  '
stories:
- headline: TrueLayer raises €23m with Italian state backing for pay-by-bank expansion
  standfirst: Italian state interest in building domestic open banking infrastructure
    is signalled by CDP Venture Capital's lead investment as TrueLayer prepares to
    scale in its founders' home market.
  body: 'TrueLayer has raised €23 million in a funding round led by CDP Venture Capital,
    the venture arm of Italy''s state-owned development bank Cassa Depositi e Prestiti.
    The round will support the company''s expansion into Italy alongside continued
    growth in the UK and wider Europe.


    The identity of the lead investor is as significant as the amount. CDP Venture
    Capital is an instrument of Italian industrial policy; its participation positions
    pay-by-bank as part of Italy''s broader push to modernise domestic payment infrastructure.
    TrueLayer was founded in London in 2016 by Italians Francesco Simoneschi and Luca
    Martinetti, and Italy represents a large, underpenetrated market for account-to-account
    payments.


    The raise comes after an active period for TrueLayer, which acquired Dutch BNPL
    firm Pelai and launched its bank-on-file product to challenge card-on-file at
    checkout. The company has also partnered with SumUp on open banking account top-ups.
    With Mollie''s completion of the GoCardless acquisition in September, the European
    pay-by-bank landscape is consolidating around a smaller number of well-capitalised
    players.'
  editorial_note: The involvement of Italy's state development bank elevates this
    beyond a routine funding round, signalling sovereign interest in open banking
    infrastructure at a time when European payments autonomy is a live policy theme.
  sources: '[TrueLayer Raises $27 Million to Expand Pay-by-Bank](https://finovate.com/truelayer-raises-27-million-to-expand-pay-by-bank/)
    — Finovate | [TrueLayer Raises $27M in Funding](https://www.finsmes.com/2026/10/truelayer-raises-27m-in-funding.html)
    — FinSMEs | [TrueLayer raises $27m to scale Pay by Bank](https://www.finextra.com/newsarticle/48559/truelayer-raises-27m-to-scale-pay-by-bank)
    — Finextra Research | [TrueLayer captures $27M investment, as targets Italy expansion](https://tech.eu/2026/10/08/truelayer-captures-27m-investment-as-targets-italy-expansion/)
    — Tech.eu | [CDP Venture Capital backs TrueLayer with EUR 23 mln investment](https://thepaypers.com/payments/news/cdp-venture-capital-backs-truelayer-with-eur-23-mln-investment)
    — The Paypers'
