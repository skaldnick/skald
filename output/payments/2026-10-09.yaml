    - The quotation 'no open banking, no open finance, no tokenised deposits, no stablecoins'
      runs longer than one clause and is embedded at the end of a paragraph. Per rule
      on direct quotations, break it into its own paragraph rather than embedding
      it at the end of the preceding paragraph.
