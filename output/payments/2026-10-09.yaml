- headline: FCA's David Geale outlines position on crypto rules, agentic AI liability
    and open finance
  standfirst: Sets out how the regulator is approaching the convergence of crypto,
    AI agents and open finance across several policy fronts simultaneously.
  body: 'David Geale, the FCA''s executive director of payments and digital finance,
    has outlined the regulator''s thinking on several converging fronts in an interview
    with FinTech Futures. Geale addressed the FCA''s approach to crypto asset regulation,
    the question of liability when AI agents initiate payments, and the path toward
    open finance in the UK.


    On agentic AI, Geale acknowledged that existing regulatory frameworks do not cleanly
    address scenarios where autonomous agents make financial decisions on behalf of
    consumers. The question of who bears liability when an AI agent initiates a payment
    that goes wrong remains unresolved, and the FCA is examining how its rules might
    need to adapt. The regulator published its AI review in July with agentic payments
    explicitly in scope.


    Geale''s comments on open finance reinforced the FCA''s incremental approach,
    contrasting the UK''s market-led model with the EU''s legislative route through
    the Financial Data Access regulation. He pointed to progress made since roughly
    2023, when none of these issues were on the regulatory agenda.


    "No open banking, no open finance, no tokenised deposits, no stablecoins," he
    said, framing the current moment as one of rapid convergence requiring careful
    but responsive oversight.'
  editorial_note: A senior FCA official speaking on the record about agentic AI liability
    and open finance strategy provides direct insight into regulatory thinking on
    issues that will shape the UK payments landscape.
  sources: '[Interview: The FCA''s David Geale on crypto rules, agentic AI liability,
    and open finance](https://www.fintechfutures.com/regulations-compliance/interview-the-fcas-david-geale-on-crypto-rules-agentic-ai-liability-and-open-finance)
    — Fintechfutures'
  style_check:
