- headline: Mastercard to mandate offline payment capability across Europe from 2027
  standfirst: Addressing growing concerns about digital payment resilience, the mandate
    will require terminals to process transactions during power and network outages
    from 2027.
  body: 'Mastercard is introducing offline payment requirements across Europe that
    will take effect from 2027, enabling consumers to complete card transactions during
    power cuts and network failures. The mandate will require terminals to process
    payments without a live connection, storing them for later settlement.


    The move responds directly to concerns that have intensified as cash usage declines.
    Several European countries have experienced payment disruptions during outages,
    most recently the Worldpay failure during a World Cup match in June. As card and
    digital payments become the default, the absence of a fallback mechanism becomes
    a systemic risk rather than an inconvenience. The European Central Bank and national
    central banks have repeatedly flagged payment resilience as a policy priority,
    and the digital euro proposal includes an offline capability for the same reason.


    Mastercard''s decision to impose the requirement through its own network rules,
    rather than waiting for regulation, gives it a first-mover position on an issue
    that legislators are likely to address eventually. It also adds a practical differentiator
    at a time when both card schemes face increasing competitive pressure from account-to-account
    alternatives and the growing Wero network.'
  editorial_note: Offline payment resilience is an emerging policy and operational
    concern across Europe. Mastercard is moving ahead of regulation to mandate it
    through scheme rules, setting a precedent for how network operators address infrastructure
    robustness.
  sources: '[Mastercard to enable offline payments across Europe](https://www.finextra.com/newsarticle/48560/mastercard-to-enable-offline-payments-across-europe?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
