- headline: EU and UK banks face one-year countdown to T+1 settlement
  standfirst: Treasury operations and liquidity management across European banks and
    payment processors with capital markets exposure must be overhauled before the
    October 2027 deadline for next-day securities settlement.
  body: 'The transition to T+1 settlement, which compresses the post-trade window
    from two business days to one, gives banks in the EU and the UK one year to demonstrate
    operational readiness. The deadline, set for October 2027, follows the US move
    to T+1 in May 2024 and brings European markets into alignment.


    The operational burden falls disproportionately on firms that operate across time
    zones or rely on manual processes for funding, foreign exchange and reconciliation.
    For payments firms with treasury or liquidity functions tied to securities settlement,
    the compressed cycle will tighten intraday liquidity requirements and demand more
    automation in cash positioning. Banks already under pressure from the SEPA instant
    payments regulation''s liquidity demands face a second, parallel squeeze.


    Unlike the US transition, which applied to a single market, the European move
    must be coordinated across multiple central securities depositories and national
    regulators simultaneously. The complexity is structural, not just technical.'
  editorial_note: ''
  sources: '[EU and UK banks face 1 year deadline for T+1](https://www.finextra.com/newsarticle/48564/eu-and-uk-banks-face-1-year-deadline-for-t1?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the action ('The shift to next-day securities settlement')
      rather than beginning with the substantive point or consequence. Per rule [1],
      when the headline names the subject (EU and UK banks), the standfirst should
      open with the interpretive or substantive point, not restate the action. Revise
      to open with the consequence — eg, 'This will force changes to treasury operations…'
      rather than 'The shift to next-day securities settlement…'
    - 'Body text uses ''two business days'' and ''one'' for numbers. Per the words-for-one-to-nine
      rule, ''one'' should be written as ''one'' (correct), but ''two'' should also
      be spelled out as ''two'' (correct as written). However, check: ''two business
      days to one'' mixes word and digit unnecessarily. The rule requires ''two''
      as a word, which is correct, but the phrasing is awkward. This is not a violation
      but note the style.'
    - 'Headline, standfirst, and body opening all begin with similar subject framing:
      headline ''EU and UK banks face'', standfirst ''The shift'', body ''Banks in
      the EU and the UK have''. Per rule on opening variety, at least one element
      should vary significantly. The body opens with ''Banks in the EU and the UK''
      which closely mirrors the headline''s ''EU and UK banks''. Revise body opening
      to vary — eg, ''Operational readiness must be demonstrated within one year…'''
    - Editorial note is included in the copy provided. Per the rules, editorial notes
      about context or reasoning should not appear in the final story. This note explains
      the relevance but should not be published as part of the piece itself. Remove
      the editorial note from the final version.
