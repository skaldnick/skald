title: 'Mastercard expands agentic commerce; T+1 deadline looms for EU and UK banks

  '
social_post: 'Mastercard builds out its agentic payments trust layer, and EU/UK banks
  have one year to prove T+1 readiness. Today''s briefing: {link}

  '
stories:
- headline: 'Mastercard adds trust and intelligence layer to agentic payments programme

    '
  standfirst: 'The expansion of Agent Pay moves beyond transaction execution to address
    the verification and context gaps that have slowed enterprise adoption of AI-initiated
    payments.

    '
  body: 'Mastercard has expanded Agent Pay, its agentic payments programme, with new
    trust and intelligence services designed to give merchants and financial institutions
    greater context about AI-initiated transactions. The services aim to verify the
    identity and authorisation of AI agents acting on behalf of consumers or businesses
    before a payment is processed.


    Agentic commerce has moved rapidly from concept to live pilots over the past six
    months, with Visa, Mastercard, Blik and several European banks all completing
    agentic transactions. The bottleneck is no longer whether agents can initiate
    payments but whether the surrounding infrastructure can authenticate them reliably.
    Mastercard''s move addresses this directly, building a verification layer on top
    of the payment rail rather than treating agent identity as someone else''s problem.


    The announcement follows EMVCo''s draft framework for card-based agentic payments
    published in September and the formation of a cross-industry agentic payments
    alliance. Trust infrastructure is emerging as the competitive battleground: whoever
    defines how agents are credentialled and monitored will shape the economics of
    the channel.

    '
  editorial_note: 'Agentic payments are moving from proof-of-concept to infrastructure
    build-out; Mastercard''s trust layer is a tangible step in that direction and
    relevant to European issuers and processors evaluating their own agentic strategies.

    '
  sources: '[Mastercard rolls out trust and intelligence services for agentic commerce](https://www.finextra.com/pressarticle/111213/mastercard-rolls-out-trust-and-intelligence-services-for-agentic-commerce?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
