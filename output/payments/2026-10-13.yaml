    - Integrated the editorial note's substantive content (EU accession context) into
      the final paragraph and removed the standalone editorial note.
- headline: Open finance fragmentation complicates banks' south-south trade ambitions
  standfirst: Divergent open finance rules across domestic systems are creating friction
    for banks pursuing fast-growing south-south corridors, according to an analysis
    by The Banker drawing on BIS research.
  body: 'Banks pursuing growth in south-south trade corridors face mounting friction
    from incompatible open finance frameworks, according to an analysis by The Banker.
    The piece draws on a May 2026 Bank for International Settlements (BIS) report
    that found differing rules and technical standards across domestic open finance
    systems can impede cross-border data sharing and payments.


    South-south trade — between emerging markets in Asia, Africa and Latin America
    — is one of the fastest-growing segments in global commerce, and banks are competing
    to serve it. But the absence of interoperable open finance standards between jurisdictions
    means that the data-sharing and payment initiation capabilities available domestically
    often cannot be extended across borders.


    The BIS finding reinforces the rationale behind projects such as Project Aperta,
    which prototyped cross-border open finance interoperability in May 2026. For European
    banks with correspondent banking relationships in these corridors, fragmentation
    risks stranding domestic open finance capabilities at national borders, while
    banks that can bridge incompatible regimes stand to capture intermediary flows
    that legacy correspondents cannot.'
  editorial_note: The Banker piece synthesises a meaningful structural challenge —
    open finance fragmentation in cross-border trade — drawing on BIS research. Relevant
    to European banks active in correspondent banking and cross-border payments.
  sources: '[Banks chase an edge in fast-growing south-south trade](https://www.thebanker.com/content/ef7e1a15-92da-4cd2-b1f7-7df1fdabf3ab)
    — The Banker'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'A Banker analysis' when the headline already identifies
      'Banker' as the source. Per rule [1], avoid redundant repetition of the subject
      across headline and standfirst. Begin with the substantive point instead — eg,
      'Divergent open finance rules across domestic systems are creating friction...'
    - Body text uses 'The Banker' but the official company name is 'The Banker' (a
      publication). However, the standfirst uses 'A Banker analysis' which is inconsistent
      with the body's 'The Banker'. Verify the correct official form and use it consistently.
    - Vague temporal reference 'earlier this year' violates the rule against vague
      temporal references. Use a specific date if available — eg, 'in May 2026' or
      'on [specific date]' rather than 'earlier this year'.
    - Phrase 'creates both a competitive risk and an opportunity' risks announcing
      significance without substantive explanation. The clause 'the fragmentation
      creates both a competitive risk and an opportunity to offer bridging infrastructure'
      should be more direct about what those risks and opportunities concretely are,
      rather than framing them generically.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
