    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with 'An agreement covering…' rather than naming
      the organisations already identified in the headline, per rule [1].
    - Removed 'For European payments professionals,' audience-address clause from
      the opening of the third paragraph and recast the sentence to state the European
