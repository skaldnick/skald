title: 'JPMorgan blocks AI agents; BCG forecasts €408bn European payments; UK Finance
  eyes G20 reform

  '
social_post: 'JPMorgan draws a line on AI agents accessing customer accounts — but
  says it''s building its own agentic connections. Plus BCG''s European payments forecast
  and UK Finance''s G20 pitch. {link}

  '
stories:
- headline: JPMorgan blocks outside AI agents from accessing customer accounts
  standfirst: The decision to shut out third-party AI agents while building proprietary
    agentic connections frames an emerging tension between open banking principles
    and banks' desire to control the AI access layer.
  body: 'JPMorgan Chase has blocked external AI agents from accessing customer account
    data, citing security and customer protection concerns. The bank said it supports
    authorised data sharing through regulated open banking providers but drew a distinction
    between those channels and the newer wave of AI agents seeking direct account
    access.


    The bank signalled it is not opposed to agentic connections in principle but intends
    to enable them on its own terms. The distinction matters: JPMorgan is positioning
    itself as a gatekeeper rather than a participant in an open ecosystem of AI-initiated
    financial interactions. For a bank of its scale, the stance is likely to influence
    how other large institutions approach the question.


    The move arrives as the agentic payments space accelerates rapidly. Visa, Mastercard,
    Stripe and others have launched or joined agentic payment programmes in recent
    months, and the Euro Banking Association has mapped agentic AI''s role in open
    finance. JPMorgan''s position suggests that while banks may welcome AI-driven
    payments and data sharing, they intend to set the terms on which those interactions
    occur, rather than ceding control to third-party AI platforms.'
  editorial_note: ''
  sources: '[JPMorgan blocks outside AI agents from customer accounts Q3 2026](https://qz.com/jpmorgan-blocking-outside-ai-agents-customer-accounts-101326)
    — Quartz'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (JPMorgan) that is also the subject
      of the headline. Per rule [1], the standfirst should open with the substantive
      point ('The decision to shut out...') rather than naming JPMorgan first. Recast
      to avoid redundant repetition of the subject.
    - 'Body paragraph 2 begins: ''The bank signalled it is not opposed to agentic
      connections in principle, stating it is committed to enabling what it called
      "agentic connections" on its own terms.'' This contains near-verbatim repetition
      of ''agentic connections'' within the same sentence. The second instance adds
      no new information and weakens the sentence.'
    - 'Body paragraph 3 states: ''JPMorgan''s position suggests that while banks may
      welcome AI-driven payments and data flows, they intend to set the terms on which
      those flows occur, rather than ceding control to third-party AI platforms.''
      The phrase ''data flows'' appears twice in consecutive clauses (''data flows''
      and ''those flows occur''). This is mechanical repetition that should be varied.'
    - The editorial note should not be included in the copy sent to production. Editorial
      notes are for internal coordination only and should not appear as flagged text
      in the final story file.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Standfirst already opens with 'The decision to shut out...' rather than naming
      JPMorgan, so no change was needed — the flagged issue did not apply to the actual
      text.
    - Rewrote body paragraph 2 opening sentence to remove near-verbatim repetition
      of 'agentic connections' within the same sentence.
    - Replaced 'data flows' / 'those flows occur' in body paragraph 3 with 'data sharing'
