      or consequences of the story — naming the initiatives, programmes or competitive
      dynamics affected'' rather than making a generic thematic claim. The white paper
      requirement should be framed in terms of what it blocks or enables, not merely
      stated as a procedural hurdle.'
    - 'Note: the replacement was also flagged — Body text uses ''roughly 728 million
      euros'' with a decimal-free number but this is correctly formatted. However,
      the phrase ''as of late September'' is a vague temporal reference. The rule
      requires specific dates when available: use ''on September 30'' or the specific
      date rather than ''late September''.'
    - 'Note: the replacement was also flagged — Headline and standfirst both open
