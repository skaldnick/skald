      opening in at least one of the elements.'' The body should be recast to vary
      this — for example, leading with the regulatory milestone or the consortium''s
      readiness rather than the bank''s action.'
    - 'Note: the replacement was also flagged — Body text names ''Jan-Oliver Sell,
      the company''s chief executive'' but the rule requires titles on first reference
