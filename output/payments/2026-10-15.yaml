      like FCA may be excepted). ''De Nederlandsche Bank (DNB)'' should be used, or
      the rule on common abbreviations should be applied if DNB qualifies.'
    - 'Note: the replacement was also flagged — Standfirst states ''a MiCA white paper
      must still be published'' without naming the specific stakes or consequences
