      headline, violating rule [1]. Should open with 'The single-API platform marks
      a concrete step toward...' instead.
    - Body paragraph three opens with 'For European payment professionals, ...' which
      violates the rule against framing paragraphs around relevance to European readers
      with audience-address clauses. State the European dimension directly as part
      of the narrative instead.
    - The abbreviation 'API' is used multiple times but introduced without spelling
      out on first use. Should read 'application programming interface (API)' on first
      mention in the body.
    - The abbreviation 'MiCA' is used without spelling out in full on first mention.
      Should read 'Markets in Crypto-Assets Regulation (MiCA)' or similar on first
      use.
    - Body paragraph one uses 'has launched' but this describes a newly announced
      arrangement; should use present continuous 'is launching' to signal currency,
      per rule on present continuous tense.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Story states 'September 2026 announcement' for stablecoin settlement; Mastercard
      announced this on June 3, 2026
  revision:
    replaced: false
    resolved: true
    summary:
    - Corrected 'September 2026 announcement' to 'June 2026 announcement' per the
      confirmed date of June 3, 2026.
    - Revised standfirst to remove 'Mastercard's' and open with 'The single-API platform
      marks a concrete step toward…' to avoid repeating the headline subject.
    - Removed 'For European payment professionals,' opening from paragraph three and
      restated the European dimension directly as part of the narrative.
    - Spelled out 'application programming interface (API)' on first use in the body,
