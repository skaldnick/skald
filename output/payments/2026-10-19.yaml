- headline: Japan's three largest banks complete joint stablecoin proof of concept
  standfirst: A coordinated test of jointly issued stablecoins for cross-border payments
    by Japan's banking establishment could influence how European banks approach collaborative
    digital money initiatives.
  body: 'Sumitomo Mitsui Banking Corporation, Mizuho Bank and MUFG Bank, together
    with Mitsubishi UFJ Trust and Banking Corporation and TISI, completed a proof
    of concept for jointly issued stablecoins and cross-border payments between July
    17 and July 23, 2024. The test explored how Japan''s three largest banking groups
    could co-issue a stablecoin and use it for international settlement.


    This model stands in contrast to the fragmented stablecoin strategies seen elsewhere.
    In Europe, a consortium of global banks announced plans for a joint stablecoin
    venture in September 2024 with a euro token as an early priority, but the initiative
    remains at an earlier stage. Japan''s proof of concept demonstrates that the joint-issuance
    model can reach technical validation, even if commercial deployment is some way
    off.


    The Japanese test also carries implications for the broader question of whether
    bank-issued stablecoins or central bank digital currencies will anchor future
    cross-border settlement. The ECB''s digital euro is advancing through legislative
    negotiations, while Project Pontes aims to connect tokenised assets with central
    bank money. Japan''s banks choosing to test a collaborative commercial model rather
    than wait for a CBDC suggests that at least some banking systems see private-sector
    stablecoins as the faster path to production use.'
  editorial_note: Japan's coordinated bank stablecoin test is relevant to European
    readers because it validates a model that European banks are pursuing earlier-stage
    versions of, and offers a direct comparison point for the EU's parallel CBDC and
    private stablecoin tracks.
  sources: '[Japanese banks complete stablecoin PoC](https://www.finextra.com/pressarticle/111311/japanese-banks-complete-stablecoin-poc?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
