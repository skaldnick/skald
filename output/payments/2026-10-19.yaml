- headline: Most SMEs see stablecoin potential for cross-border payments but few accept
    them
  standfirst: A stark gap exists between SME interest in stablecoins and actual adoption,
    with 88% of international SME finance professionals saying stablecoins could improve
    B2B collections yet only 27% currently accepting them.
  body: 'Research from Neo, a cross-border payments and treasury fintech, has found
    a stark gap between SME interest in stablecoins and actual adoption. Among senior
    finance professionals at internationally active SMEs, 88% said stablecoins could
    improve business-to-business (B2B) collections, but just 27% currently accept
    them for customer payments.


    The findings arrive as stablecoin infrastructure in Europe matures rapidly. USDC
    became the EU''s first significant e-money token designated under the Markets
    in Crypto-Assets regulation earlier this month, and several major banks have committed
    to a joint stablecoin venture with a euro-denominated token as an early priority.
    Mastercard integrated BVNK into its platform for unified fiat-stablecoin settlement,
    and Lloyds completed a live cross-border stablecoin payment with Visa in October.


    While the rails are being built, practical barriers remain for smaller firms.
    Integration complexity, regulatory uncertainty across jurisdictions and limited
    counterparty readiness are likely factors. The survey points to a distribution
    and onboarding problem rather than a demand problem: stablecoins will not displace
    traditional correspondent banking for cross-border B2B flows until accepting them
    is as straightforward as accepting card or bank transfer payments.'
  editorial_note: Quantifies the adoption gap for stablecoins among SMEs at a moment
    when European stablecoin infrastructure is scaling rapidly, making the disconnect
    between supply-side investment and demand-side uptake a relevant story.
  sources: '[Research reveals gaps in SME''s stablecoin adoption](https://www.finextra.com/pressarticle/111312/research-reveals-gaps-in-smes-stablecoin-adoption?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
