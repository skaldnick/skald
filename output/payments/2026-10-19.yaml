- headline: Equifax integrates Mastercard Open Finance into its credit decisioning
    tools
  standfirst: The partnership gives lenders a second open finance provider alongside
    Equifax's existing credit file, extending the reach of consumer-permissioned cashflow
    data in US lending decisions.
  body: 'Equifax is integrating consumer-permissioned insights from Mastercard Open
    Finance into its open banking solutions, giving lenders and fintechs the option
    to source cashflow data through Mastercard''s network alongside Equifax''s own
    consumer credit file. The arrangement lets lenders choose their open finance provider
    rather than being locked into a single data source.


    The tie-up reflects a broader trend in which credit bureaux are absorbing open
    banking data into their core products rather than treating it as a standalone
    offering. Experian launched a dedicated consumer reporting agency for cashflow-based
    underwriting earlier this month, and PayPoint completed its acquisition of AperiData
    in June to build open banking into credit data. Equifax''s move to partner with
    Mastercard rather than build or acquire its own open finance capability signals
    a different strategic approach, one that leverages Mastercard''s existing connectivity
    to bank accounts.


    The integration is US-focused but has implications for European markets where
    Mastercard Open Finance operates. As FCA''s open finance roadmap advances and
    the EU''s financial data access regulation takes shape, traditional credit infrastructure
    on both sides of the Atlantic is having to accommodate permissioned account data,
    reshaping how lenders approach underwriting.'
  editorial_note: Illustrates how credit bureaux are competing to embed open banking
    data into lending infrastructure, a trend playing out in both US and European
    markets.
  sources: '[Equifax taps Mastercard Open Finance to give lenders more consumer-permissioned
    insights](https://www.finextra.com/pressarticle/111317/equifax-taps-mastercard-open-finance-to-give-lenders-more-consumer-permissioned-insights?utm_medium=rssfinextra&utm_source=finextrafeed)
