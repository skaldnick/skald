title: 'Brite enters UK pay-by-bank; Equifax taps Mastercard open finance; SME stablecoin
  gap

  '
social_post: 'Swedish pay-by-bank provider Brite enters the UK, Equifax plugs Mastercard
  Open Finance into its credit file, and SMEs say they want stablecoins but aren''t
  accepting them yet. Today''s briefing: {link}

  '
stories:
- headline: 'Brite Payments launches pay-by-bank in the UK after FCA authorisation

    '
  standfirst: 'The Swedish instant payments provider''s UK entry adds another competitor
    to a market where pay-by-bank adoption is accelerating but reliability concerns
    persist.

    '
  body: 'Brite Payments has begun offering pay-by-bank services in the UK after securing
    authorisation from the Financial Conduct Authority. Lena Hackeloer, the company''s
    founder and chief executive, said the UK is one of the most mature open banking
    markets globally but that merchants still face gaps in the payment experience
    that Brite aims to address.


    The move positions Brite alongside established providers such as TrueLayer, Yapily
    and Plaid in a UK market that crossed one billion open banking payments in July.
    Brite''s model, built around instant settlement, is already live across several
    European markets and its UK entry signals continued confidence in account-to-account
    payments despite ongoing concerns about conversion rates and payment reliability
    that have dogged broader pay-by-bank adoption.


    The UK''s open banking payments market is becoming increasingly competitive. Recent
    months have seen Mollie acquire GoCardless, TrueLayer raise fresh capital with
    Italian state backing, and Nopan secure funding specifically to tackle payment
    reliability. Brite''s arrival adds a well-capitalised Nordic player to a crowded
    field at a time when commercial variable recurring payments and the UK Payments
    Initiative are expanding the addressable market.

    '
  editorial_note: 'A significant new entrant to the UK pay-by-bank market, arriving
    at a moment of consolidation and infrastructure expansion that makes the competitive
    dynamics worth tracking.

    '
  sources: '[Brite Payments rolls out Pay by Bank in UK after securing FCA licence](https://www.abcmoney.co.uk/2026/10/brite-payments-rolls-out-pay-by-bank-in-uk-after-securing-fca-licence/)
    — ABC Money'
