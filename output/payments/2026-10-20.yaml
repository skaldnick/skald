- headline: Prism Data raises $20m for open banking credit analytics in the US
  standfirst: Transaction-based risk scoring that works across aggregators offers
    a cross-border comparison point as European open finance moves toward cashflow-based
    lending.
  body: 'Prism Data, a US-based open banking analytics firm led by CEO Jason Rosen,
    has raised $20 million in Series A funding. The company provides transaction analytics
    software that generates proprietary risk scores from open banking data, designed
    to be compatible with data from any aggregator as well as banks'' own deposit
    account records and PDF statements.


    The round comes as cashflow-based underwriting gains traction on both sides of
    the Atlantic. In the UK, the Financial Conduct Authority has signalled that open
    banking data will reshape mortgage affordability checks, and Experian launched
    a consumer reporting agency for cashflow-based underwriting earlier this year.
    Prism''s aggregator-agnostic approach addresses a practical problem: lenders working
    across multiple data sources need scoring models that normalise transaction data
    regardless of its origin.


    Prism''s model offers a reference point as PSD3 and the Financial Data Access
    regulation expand the scope of data available to third parties in Europe. The
    challenge of turning raw transaction data into reliable, standardised credit signals
    is not unique to the US market and will intensify as open finance widens beyond
    payments accounts.'
  editorial_note: Though US-based, Prism's aggregator-agnostic credit scoring model
    is directly relevant to European open finance developments, particularly as cashflow-based
    lending becomes a regulatory and commercial priority in the UK and EU.
  sources: '[Prism Data Tecnologies Raises $20M in Series A Funding](https://www.finsmes.com/2026/10/prism-data-tecnologies-raises-20m-in-series-a-funding.html)
    — FinSMEs | [Prism Data raises $20m](https://www.finextra.com/pressarticle/111338/prism-data-raises-20m)
    — Finextra Research'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'Series A round' when the headline already identifies
      this as a fundraising story about Prism Data. Per rule [1], avoid redundant
      repetition of the subject across headline and standfirst. Open with the substantive
      point instead — eg, 'Transaction-based risk scoring that works across aggregators…'
      rather than 'The Series A round funds…'
    - 'Body paragraph 2: ''Experian launched a consumer reporting agency for cashflow-based
      underwriting earlier this month'' uses vague temporal reference ''this month''.
      Per rule on temporal references, use the specific date or month name. Change
      to ''on [specific date]'' or ''in [month name]''.'
    - Body paragraph 3 opens with 'For European observers, Prism's model offers a
      reference point…' which is audience-address framing. Per rule on European dimension,
      state the relevance directly as part of the narrative without prefacing with
      'For European observers'. Rewrite to integrate the European context naturally.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Standfirst revised to open with the substantive point ('Transaction-based risk
      scoring…') rather than redundantly referencing the Series A round already identified
      in the headline, per rule [1].
    - 'Body paragraph 2: replaced vague ''earlier this month'' with ''earlier this
      year'' as no specific date was available from the source material. The exact
      date could not be confirmed.'
    - 'Body paragraph 3: removed audience-address framing (''For European observers,'')
      and integrated the European context naturally by moving ''in Europe'' into the
      clause about PSD3 and FIDA.'
    - Spelled out 'FCA' as 'Financial Conduct Authority' since the abbreviation does
      not recur in the piece.
