- headline: Euronet and Fireblocks extend partnership to stablecoin-funded card issuing
  standfirst: The deal brings stablecoin balances into the card issuing process, testing
    whether existing payments infrastructure can absorb digital asset funding without
    requiring new merchant acceptance.
  body: 'Euronet, the payments infrastructure group, is extending its partnership
    with digital asset platform Fireblocks to enable stablecoin-funded card issuing.
    The arrangement allows card programmes to draw on stablecoin balances at the point
    of issuance, converting to fiat for settlement through existing card networks.


    Stablecoins are increasingly connecting to conventional payment rails. Mastercard
    integrated BVNK for fiat-stablecoin settlement earlier this month, and Visa has
    partnered with Mesh to make crypto balances spendable across its network. Euronet
    operates as a processor and infrastructure provider rather than a scheme or fintech;
    its entry into stablecoin-funded issuing suggests the plumbing layer of European
    payments is beginning to accommodate stablecoin flows, not just the consumer-facing
    layer.


    Whether stablecoin-funded cards can operate within MiCA''s e-money token framework
    and meet the settlement finality requirements that card schemes impose remains
    an open question for issuers. Euronet''s infrastructure spans ATM networks, money
    transfers and merchant acquiring across Europe, giving the partnership a broader
    potential footprint than a standalone fintech experiment.'
  editorial_note: Euronet is a significant piece of European payments infrastructure;
    its move into stablecoin-funded card issuing signals that the integration of stablecoins
    with legacy rails is moving beyond scheme-level pilots into the processing layer.
  sources: '[Euronet and Fireblocks team on stablecoin-funded card issuing](https://www.finextra.com/pressarticle/111344/euronet-and-fireblocks-team-on-stablecoin-funded-card-issuing?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Body paragraph 2: ''The partnership is one of several recent moves connecting
      stablecoins to conventional payment rails.'' This violates the rule against
      describing a development as ''one of a growing number'' in a way that hedges
      its significance. If the broader trend is worth noting, state the trend directly.'
    - 'Body paragraph 2: ''Euronet''s involvement is notable because of its position
      as a processor and infrastructure provider rather than a scheme or fintech''
      violates the rule against explicitly flagging significance. This is a sentence
      that announces notability before explaining the substantive point. Rewrite to
      state the substantive point directly without ''is notable''.'
    - 'Body paragraph 3: ''For European issuers, the practical question is whether...''
      violates the rule against framing a paragraph around European reader relevance
      by opening with an audience-address clause. If the European dimension is relevant,
      state it directly as part of the narrative without prefacing it with ''For European
      issuers''.'
  verification:
