title: 'EPC builds EUDI wallet framework; Euronet enters stablecoin card issuing;
  Brite launches UK pay-by-bank

  '
stories:
- headline: EPC launches initiative to standardise EUDI wallet acceptance for payments
  standfirst: A consistent rulebook for accepting EU Digital Identity Wallets could
    prevent fragmented adoption across the bloc, addressing a gap that payment service
    providers have lacked until now.
  body: 'The European Payments Council (EPC) has approved work on a standardisation
    initiative designed to ensure payment service providers accept EU Digital Identity
    wallets in a consistent way. The framework, known as SCARLET, will define how
    wallets interact with payment processes, covering both in-store and online use
    cases.


    EU Digital Identity wallets are a cornerstone of the EU''s digital identity regulation,
    but their integration with payments infrastructure has lacked a common technical
    and operational standard. Without one, there is a risk that wallet acceptance
    fragments along national or scheme-specific lines, replicating the interoperability
    problems the EU has spent years trying to resolve in payments. SCARLET is the
    EPC''s attempt to pre-empt that outcome by establishing shared rules before wallets
    reach mass deployment.


    The initiative sits alongside the EPC''s existing instant payments and SEPA rulebooks
    and signals the body''s expanding remit beyond traditional payment instruments.
    For banks and payment processors already preparing for PSD3 and the instant payments
    regulation, EU Digital Identity wallet readiness is becoming another compliance
    and product development workstream that requires early attention.'
  editorial_note: ''
  sources: '[EPC to create EU Digital Identity Wallet framework for PSPs](https://www.finextra.com/newsarticle/48606/epc-to-create-eu-digital-identity-wallet-framework-for-psps?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra | [EPC Launches SCARLET to Standardise EU Digital Identity Wallet Acceptance
    for Payments](https://ffnews.com/news/european-payments-council-launches-scarlet-initiative-on-eu-digital-identity-wal-2ae0f323)
    — Ffnews'
