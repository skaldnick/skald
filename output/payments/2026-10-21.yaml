      in the headline, per rule 1.
    - Removed editorial note entirely as it is metadata/out-of-scope commentary and
      should not appear in published copy.
- headline: Visa runs first live agentic payment between buyer and supplier platforms
  standfirst: Moving agentic commerce from consumer experiments into accounts payable,
    the pilot with Bill and Billtrust marks the first production test of AI agents
    completing end-to-end B2B invoice payments.
  body: 'AI agents are now initiating and completing approved buyer invoice payments
    end-to-end through supplier portals in a live pilot between Visa, Bill and Billtrust.
    The pilot is the first to move agentic payments into a production B2B environment,
    where agents handle the full cycle from invoice receipt to payment execution without
    manual intervention.


    The pilot sits within a rapidly filling competitive space. Mastercard, ING, Blik,
    GoCardless and Credit Agricole have all completed agentic payment transactions
    in recent months, but those have largely been consumer or proof-of-concept exercises.
    Visa''s move into accounts payable targets a segment where automation has obvious
    economic value: B2B invoice processing remains manual at many firms, and the potential
    to reduce processing costs is substantial.


    The deployment also tests trust and authorisation frameworks in a higher-stakes
    context than consumer purchases. B2B payments involve larger values, multi-party
    approval chains and contractual obligations, making the governance model around
    agent permissions more consequential than in retail settings.'
  editorial_note: This advances the agentic payments story into B2B — a meaningfully
    different use case from the consumer-facing agentic transactions previously covered,
    with distinct commercial implications for payment providers and corporate treasury
    teams.
  sources: '[Visa pilots AI agent payments between buyer and supplier platforms](https://www.finextra.com/newsarticle/48610/visa-pilots-ai-agent-payments-between-buyer-and-supplier-platforms?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens with ''The pilot with Bill and Billtrust'' — a near-verbatim
      repetition of the headline''s subject matter. Per the rule on avoiding repetition
      across headline, standfirst, and body, the standfirst should open with the substantive
      point or interpretation, not restate the headline''s specific detail. Consider
      opening with the significance: ''The move marks…'' or ''This represents…'' to
      establish the interpretive context before restating the transaction details.'
    - Body paragraph one opens with 'Visa has launched' — the same subject and verb
      as the headline's 'Visa runs'. Per the rule against starting the headline, standfirst,
      and body opening sentence with the same word or phrase, vary the opening. Consider
      'In the pilot with Bill and Billtrust, AI agents initiate…' or 'AI agents are
      now initiating…' to avoid repetition of the headline's construction.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with the substantive significance ('Moving agentic
      commerce from consumer experiments into accounts payable') rather than restating
      the headline's subject matter.
    - Revised body paragraph one to open with 'AI agents are now initiating…' instead
      of 'Visa has launched…', avoiding repetition of the headline's subject and verb
      while keeping Visa named in the same sentence.
- headline: Criminals exploit open banking APIs to verify stolen card and bank credentials
  standfirst: Open banking's account verification services are being exploited as
    a free, low-friction method for fraudsters to check whether stolen credentials
    are valid before monetising them.
  body: 'Criminals have begun using open banking services as a cost-free way to test
    whether stolen bank and card details are valid, according to a report from Cybersecurity
    News. The technique exploits the account verification and balance-check capabilities
    that open banking APIs provide, allowing attackers to confirm credentials without
    triggering the transaction-monitoring systems that would flag a conventional card
    test at a merchant.


    Traditional credential-testing methods — making small purchases or donations —
    carry costs and leave traces. Open banking''s read-only account information services,
    by contrast, require only that the attacker has enough data to pass authentication.
    Where stolen credentials include sufficient identity information to initiate a
    consent flow, attackers can verify account validity silently. According to Cybersecurity
    News, the technique is being combined with phishing campaigns impersonating the
    retailer Poshmark.


    Open banking''s account information APIs represent an expanding attack surface
    that consent and authentication models were not designed to defend against adversarial
    use. Open Banking Limited published data on July 8 showing open banking fraud
    rates sit below wider UK payment benchmarks, but that analysis focused on payment
    initiation rather than the account information side. As open banking scales, assumptions
    about the channel''s security relative to card payments will face increasing scrutiny.'
  editorial_note: ''
  sources: '[Hackers Exploit Open Banking Services to Test Stolen Credentials Without
    Paying a Cent](https://cybersecuritynews.com/hackers-exploit-open-banking-services/)
    — Cybersecuritynews'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the substantive point ('A newly documented attack
      technique uses...') but the headline names 'Criminals' as the subject. The standfirst
      should not repeat the headline's framing; it should add interpretive context.
      Consider opening with 'Open banking's account verification services are being
      exploited...' to avoid restating the headline's subject-action structure.
    - 'Body paragraph 2 contains ''The report describes this being combined with phishing
      campaigns impersonating the retailer Poshmark.'' This is vague attribution to
      ''the report'' when the source is Cybersecurity News, named in paragraph 1.
      Clarify: ''According to Cybersecurity News, the technique is being combined...''
      or name the report more specifically.'
    - Body paragraph 3 opens with 'The finding complicates the narrative...' This
      frames significance before the substantive point. Restructure to lead with the
      substantive claim directly—eg, 'Open banking's account information APIs represent
      an expanding attack surface that consent and authentication models were not
      designed to defend against adversarial use, complicating assumptions about the
      channel's security relative to card payments.'
    - Editorial note states 'This is a genuinely novel attack vector that challenges
      assumptions about open banking's security profile'. Do not include editorial
      notes explaining the significance or newsworthiness of a story in the submission.
      Remove this note; if the significance is real, it should be evident from the
      body text itself.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - 'Source attribution error: The open banking fraud data was published by Open
      Banking Limited on 8 July 2026, not by the FCA.'
  revision:
    replaced: false
    resolved: true
    summary:
    - Rewrote standfirst to open with 'Open banking's account verification services
      are being exploited...' rather than restating the headline's subject-action
      framing.
    - Corrected attribution of open banking fraud data from 'The FCA' to 'Open Banking
      Limited' and added the specific date 'on July 8' per the issue.
    - Replaced vague 'The report describes this being combined with...' with 'According
      to Cybersecurity News, the technique is being combined with...' for clearer
      attribution.
    - Restructured paragraph 3 to lead with the substantive claim about the expanding
      attack surface rather than opening with 'The finding complicates the narrative...'
      which framed significance before substance.
    - Removed the editorial note entirely, as house style does not permit editorial
      notes explaining a story's significance.
- headline: Evervault launches token framework to secure agentic commerce transactions
  standfirst: Developers building AI agent commerce tools now have a way to handle
    payments and sensitive data without exposing credentials to the agent or browser
    provider, addressing a core trust gap in the emerging agentic stack.
  body: 'Evervault has launched Browser Tokens, a product that allows AI agents and
    browser automations to make purchases, log into accounts and complete sensitive
    workflows without exposing payment cards, passwords or personal data to the agent
    or the browser provider. The launch, announced at Money20/20, targets developers
    building agentic commerce products who need a secure intermediary between the
    AI agent and the payment credential.


    The product sits in a gap that the payments industry has been circling for months.
    EMVCo drafted a framework for card-based agentic payments in September; Visa,
    Mastercard and others have launched agentic pilots; and JPMorgan moved in October
    to block outside AI agents from accessing customer accounts entirely. Each response
    reflects the same underlying problem: existing authentication and authorisation
    models assume a human is present. Evervault''s approach tokenises the sensitive
    data so the agent never handles it directly, keeping the trust boundary between
    the AI and the financial system.


    The question of whether Browser Tokens or a competing approach becomes the standard
    infrastructure layer remains open, but the product illustrates a clear market
    forming around agentic trust infrastructure. For payment providers and issuers,
    ensuring AI agents transact within a controllable security perimeter is now the
    focus rather than whether they will transact at all.'
  editorial_note: Selected because it represents a concrete infrastructure product
    addressing the agentic payments trust problem — moving the conversation from pilots
    and frameworks to deployable tooling that European issuers and processors will
    need to evaluate.
  sources: '[Evervault launches Browser Tokens, enabling secure agentic payments](https://www.finextra.com/pressarticle/111376/evervault-launches-browser-tokens-enabling-secure-agentic-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the product ('The product') rather than beginning
      with the substantive point or action. Per rule [1], avoid opening by naming
      the subject that appears in the headline. Rewrite to open with the action/consequence,
      e.g., 'Developers building AI agent commerce tools now have a way to handle
      payments…'
    - Body paragraph 2 opens with 'Whether Browser Tokens or a competing approach
      becomes the standard infrastructure layer is an open question' — a colon-introduced
      binary question framed as hedging. Per rule [7], do not open a paragraph with
      such a construction when the sentence can be recast with a preposition. Rewrite
      as 'The question of whether Browser Tokens or a competing approach becomes the
      standard infrastructure layer remains open, but…' or similar.
    - Body paragraph 2 contains 'the question is no longer whether AI agents will
      transact but how to ensure they do so within a controllable security perimeter'
      — a colon-introduced binary question. Per rule [7], recast this with a preposition,
      e.g., 'For payment providers and issuers, ensuring AI agents transact within
      a controllable security perimeter is now the focus rather than whether they
      will transact at all.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Rewrote standfirst to open with 'Developers building AI agent commerce tools
      now have a way…' instead of 'The product gives…', avoiding repetition of the
      headline subject per rule [1].
    - Recast paragraph 3 opening from 'Whether Browser Tokens or a competing approach
      becomes the standard infrastructure layer is an open question, but…' to 'The
      question of whether Browser Tokens or a competing approach becomes the standard
      infrastructure layer remains open, but…' per rule [7].
    - Recast final sentence from 'the question is no longer whether AI agents will
      transact but how to ensure they do so within a controllable security perimeter'
      to 'ensuring AI agents transact within a controllable security perimeter is
      now the focus rather than whether they will transact at all' per rule [7].
