title: 'CMA targets Apple NFC access; Visa pilots agentic B2B payments; hackers exploit
  open banking credentials

  '
social_post: 'UK wants to crack open Apple''s NFC monopoly — and the FCA sees it as
  an open banking accelerator. Plus: Visa''s first live agentic B2B payment pilot,
  and criminals using open banking to verify stolen cards. {link}

  '
stories:
- headline: UK competition authority proposes opening Apple's NFC chip to rivals
  standfirst: The proposed remedies would lower fees and remove technical barriers
    for Apple Pay competitors, with the FCA framing NFC access as a prerequisite for
    expanding open banking at the point of sale.
  body: 'The Competition and Markets Authority (CMA) has published proposals to unlock
    contactless payment technology on iPhones, requiring Apple to give rival payment
    providers access to its NFC chip on fair terms. The consultation sets out measures
    to reduce the fees Apple charges for NFC access and to remove technical restrictions
    that have kept competitors off the platform.


    David Geale, the Financial Conduct Authority''s executive director for payments
    and digital finance, said that opening up the technology would support the expansion
    of open banking by enabling more people to make payments directly from their bank
    accounts. That framing positions NFC access not just as a competition issue between
    wallet providers but as infrastructure for pay-by-bank at physical points of sale,
    where open banking has so far had negligible presence.


    The proposals follow the CMA''s market investigation into mobile payments, which
    found Apple''s control of NFC access on iOS restricted competition. Apple has
    argued that its restrictions protect user security and privacy. The consultation
    is open until November 17, after which the CMA will decide whether to impose binding
    remedies.'
  editorial_note: ''
  sources: '[UK sets out proposal to open up access to iPhone contactless payments](https://www.finextra.com/newsarticle/48618/uk-sets-out-proposal-to-open-up-access-to-iphone-contactless-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra | [Apple should open access to contactless payment systems, says regulator](https://www.standard.co.uk/news/tech/nfc-apple-pay-fca-press-association-b1301591.html)
    — The Standard | [CMA outlines proposals to unlock contactless technology on Apple
    iPhone](https://www.openbankingexpo.com/news/cma-outlines-proposals-to-unlock-contactless-technology-on-apple-iphone/)
    — Openbankingexpo'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'The CMA' which is also named in the headline 'UK
      competition authority'. Per rule 1, the standfirst should begin with the substantive
      point (the proposed remedies and their effects) rather than naming the organisation.
      Revise to open with 'The proposed remedies would lower fees…' or similar.
    - Body text uses 'account-to-account' in the editorial note. Per rule 2 (prefer
      spelling out non-standard abbreviations), this should be 'A2A' or the full form
      should be used consistently. However, the editorial note also violates rule
      about editorial notes flagging missing information — it should not be included
      as it adds interpretive framing rather than factual context.
    - Editorial note should not be included in the copy check. Editorial notes are
      metadata and should not appear in the published story. Remove this entirely
      or flag it as out-of-scope commentary.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Draft says consultation is 'open until early 2027'; CMA sources state consultation
      closes November 17, 2026
    - David Geale's title varies between sources; draft says 'executive director for
      consumers, payments and competition' but official FCA/PSR sources list his formal
      title as 'executive director for payments and digital finance'
  revision:
    replaced: false
    resolved: true
    summary:
    - Changed consultation closing date from 'early 2027' to 'November 17' per CMA
      source, omitting year per house style for current-year dates.
    - Corrected David Geale's title from 'executive director for consumers, payments
