- headline: Google Cloud outage triggers first real test of EU and UK critical third-party
    oversight
  standfirst: A power failure at a single London data centre disrupted banking services
    for millions across Europe, prompting the EBA, the FCA and the UK Treasury Committee
    to demand answers from Google under newly established cloud supervision regimes.
  body: 'A power event in Google Cloud''s London region on October 20 knocked out
    digital banking services at Revolut, Lloyds and HSBC for up to eight hours, disabling
    card payments, transfers and ATM withdrawals for millions of customers. Google
    attributed the disruption to a fault at a third-party facility in its europe-west2
    availability zone and said services had been restored by mid-afternoon.


    The European Banking Authority confirmed it had contacted Google Cloud to assess
    the incident''s implications for financial entities across the EU. In the UK,
    the Financial Conduct Authority said it was engaging with Google and affected
    firms, while Dame Meg Hillier, chair of the Treasury Committee, wrote to the Bank
    of England and FCA seeking details of the regulators'' response, the scale of
    disruption and any financial harm caused. The EBA underlined that designation
    as a critical third-party provider "does not transfer responsibility for incident
    management from the provider or relieve financial entities of their own regulatory
    obligations".


    The outage is the first major incident since both regimes came into force. The
    EU designated 19 technology firms as critical third-party providers under the
    Digital Operational Resilience Act in 2025, subjecting them to joint oversight
    by the EBA, ESMA and EIOPA. The UK designated Google Cloud, AWS, Microsoft and
    Oracle under its own critical third-party regime in July this year. That a single-zone
    power failure at one provider could simultaneously disable services at four banks
    underlines the concentration risk both frameworks were designed to address.'
  editorial_note: 'This is a genuinely new story: the outage occurred on October 20
    and regulatory responses from the EBA, FCA and UK Treasury Committee followed
    on October 21-22. It is the first real-world test of both the EU''s DORA critical
    third-party oversight framework and the UK''s parallel regime introduced in July
    2026. While a Lloyds/Barclays outage was covered on July 28, that was a different
    incident unrelated to cloud provider concentration risk. The Payward/Saldo Bank
    acquisition (October 14-15) was considered but is a week old and primarily a crypto
    licensing story rather than a European payments development.'
  sources: '[Europe''s financial regulators query Google over cloud outage that hit
    banks](https://www.investing.com/news/stock-market-news/europes-financial-regulators-query-google-over-cloud-outage-that-hit-banks-4963664)
    — Reuters via Investing.com'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'EBA, the FCA and the UK Treasury Committee' when
      the headline already identifies 'EU and UK critical third-party oversight'.
      Per rule [1], the standfirst should open with the substantive point (the disruption
      and its scale) rather than naming the organisations whose oversight is already
      identified in the headline.
    - Body text uses 'europe-west2' (lowercase) but this appears to be a proper noun/technical
      identifier that should be verified for correct capitalisation; however, if this
      is the official Google format, it is acceptable.
    - Editorial note states 'UK's parallel regime introduced in July 2026' but the
      body text says 'in July this year'. These dates conflict. If the current date
      context is October 2026, 'this year' is acceptable, but the editorial note's
      2026 reference to a July introduction creates ambiguity. The body should use
      a specific date or year (e.g., 'in July 2026') rather than 'this year' per rule
      on avoiding vague temporal references.
    - The standfirst names 'the EBA, the FCA and the UK Treasury Committee' as demanding
      answers, but 'the UK Treasury Committee' is not part of either regulatory regime
      mentioned in the headline. This specificity adds detail but risks obscuring
      the main point about the two critical third-party oversight regimes themselves.
