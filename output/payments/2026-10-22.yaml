- headline: Ninth Wave launches control layer governing AI agent access to bank data
  standfirst: 'A gap that banks and regulators have flagged but no one has yet standardised
    is now being addressed: how to govern what AI agents can see and do with financial
    account data.'
  body: 'Ninth Wave, a US open finance platform that connects financial institutions
    with third-party applications, has introduced what it calls an Agentic Control
    Layer, a framework for governing how AI agents access financial account data.
    The product is designed to give banks and data holders granular controls over
    AI-initiated data requests, including consent verification, scope limits and audit
    trails.


    The announcement arrives as agentic commerce moves rapidly from concept to production.
    European banks including ING, Danske Bank and Credit Agricole have completed live
    agentic payment transactions in recent months, and the Financial Conduct Authority''s
    chief information and digital officer, Jessica Rusu, outlined a framework for
    agentic finance in a speech on October 19 that envisaged future collaboration
    between regulators and industry. Yet most of that activity has focused on the
    payment leg. The data access side, where AI agents query account balances, transaction
    histories or identity attributes, remains largely ungoverned beyond existing open
    banking consent frameworks that were designed for human-initiated flows.


    Ninth Wave''s product is US-focused, but the problem it addresses is universal.
    European regulators working on PSD3 and open finance legislation will need to
    decide whether existing strong customer authentication and consent models are
    adequate when the "customer" initiating access is a software agent acting on a
    human''s behalf.'
  editorial_note: First dedicated product for governing AI agent access to bank data,
    directly relevant to the agentic finance frameworks European regulators are now
    developing.
  sources: '[Ninth Wave launches Agentic Control Layer to govern AI access to bank
    data](https://app.dealroom.co/news/feed/ninth-wave-launches-agentic-control-layer-to-govern-ai-access-to-bank-data)
    — Dealroom.co | [Ninth Wave Introduces Agentic Control Layer™ to Govern AI Access
    to Financial Account Data](https://finance.yahoo.com/technology/ai/articles/ninth-wave-introduces-agentic-control-120000144.html)
    — Finance | [Ninth Wave Introduces Agentic Control Layer™ to Govern AI Access
    to Financial Account Data](https://www.businesswire.com/news/home/20261021603767/en/Ninth-Wave-Introduces-Agentic-Control-Layer-to-Govern-AI-Access-to-Financial-Account-Data)
    — Businesswire'
  style_check:
    compliant: false
    warnings:
    - Headline opens with 'Ninth Wave' and standfirst then names 'The framework' —
      this violates the rule that opening words/phrases should vary across headline,
      standfirst, and body opening sentence. Consider revising the standfirst to open
      with a more substantive or action-oriented phrase.
    - Body text uses 'US' correctly, but the standfirst should also use 'US' not 'United
      States' for consistency (the rule applies across all text). However, the standfirst
      does not mention 'United States' explicitly, so this is not a violation.
    - 'The phrase ''most of that activity has focused on the payment leg. The data
      access side, where AI agents query account balances, transaction histories or
      identity attributes, remains largely ungoverned'' uses a dash-introduced phrase
      that should be recast. The rule states: ''Do not use an em-dash or en-dash to
      introduce a trailing participial or resultative clause'' — here the clause after
      the period works, but consider whether ''remains largely ungoverned beyond existing
      open banking consent frameworks'' could be tightened.'
    - Editorial note includes 'agentic commerce frameworks' but the body text uses
      'agentic finance' in the FCA reference and 'agentic payment transactions' —
      verify consistency of terminology or clarify whether these are distinct concepts.
  verification:
