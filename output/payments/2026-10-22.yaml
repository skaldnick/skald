title: 'BIS cost data; agentic data governance; credential-testing via open banking

  '
social_post: 'BIS research puts hard numbers on fintechs vs banks vs stablecoins for
  cross-border costs. Plus: criminals weaponise open banking APIs, and a new framework
  for AI agents accessing bank data. {link}

  '
stories:
- headline: BIS finds fintechs far cheaper than banks or stablecoins for cross-border
    payments
  standfirst: Fintechs such as Wise and Remitly cost substantially less than bank
    wires for cross-border retail payments, while stablecoins continue to suffer from
    on- and off-ramp friction that limits their competitiveness.
  body: 'The Bank for International Settlements has published research comparing the
    cost and speed of cross-border retail payments across traditional bank channels,
    fintech providers and stablecoins. The findings show that fintechs such as Wise
    and Remitly have substantially cut costs relative to bank wires, while stablecoins
    continue to suffer from friction that limits their competitiveness.


    The research provides an empirical baseline against which European policymakers
    and scheme operators can measure the ambitions of initiatives such as Swift''s
    retail payments scheme, the ECB''s cross-currency TIPS pilot and the various stablecoin
    ventures now seeking European licences. If fintechs already deliver materially
    cheaper cross-border payments, the case for new infrastructure rests less on cost
    reduction and more on reach, interoperability or sovereignty.


    For banks, the data underlines a competitive gap that regulatory modernisation
    alone is unlikely to close. Fintechs have built cost advantages through lean operating
    models and direct FX access, not simply through regulatory arbitrage. Tokenised
    money remains uncompetitive as a retail remittance solution while on- and off-ramp
    friction persists, undercutting the case made by stablecoin ventures positioning
    themselves in this space.'
  editorial_note: BIS research carrying hard cost comparisons across payment channels
    is rare and directly relevant to multiple live European infrastructure debates.
  sources: '[Fintechs top banks and stablecoins for cheap cross-border payment - BIS
    research](https://www.finextra.com/newsarticle/48630/fintechs-top-banks-and-stablecoins-for-cheap-cross-border-payment---bis-research?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
