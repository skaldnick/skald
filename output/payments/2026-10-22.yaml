- headline: 'Industry panel flags reliability and data gaps as barriers to pay-by-bank
    growth

    '
  standfirst: 'Executives from Plaid, Barclays, HSBC and Open Banking Limited identified
    payment success rates and post-payment data as the principal obstacles to scaling
    account-to-account payments in the UK.

    '
  body: 'A panel at Open Banking Expo brought together executives from Plaid, Barclays,
    HSBC and Open Banking Limited to assess the practical barriers preventing pay-by-bank
    from competing with cards at scale in the UK. The discussion centred on two persistent
    problems: payment reliability, where success rates still fall short of card benchmarks,
    and the data gap after payment initiation, where merchants lack the confirmation
    and reconciliation information they receive from card networks.


    The panel identified commercial variable recurring payments as a key measure of
    progress under the National Payments Vision, but cautioned that the commercial
    case for merchants remains difficult to make when reliability is inconsistent
    across banks and payment corridors. HSBC and Barclays representatives acknowledged
    that bank-side infrastructure improvements are needed, not just better front-end
    experiences.


    The discussion reflects a tension at the heart of the UK''s open banking payments
    ambitions. The UK Payments Initiative launched in June with GoCardless as its
    first provider and Moneyhub as its first non-shareholder participant, but scaling
    beyond early adopters requires solving operational problems that sit with the
    account-servicing banks rather than with the initiating fintechs.

    '
  editorial_note: 'Named industry executives identifying specific, practical barriers
    to pay-by-bank. Advances the continuing story on UK open banking payments adoption
    with fresh detail from a multi-bank panel.

    '
  sources: '[Open Banking payments face reliability and data barriers, industry warns](https://www.openbankingexpo.com/news/open-banking-payments-must-overcome-reliability-and-data-gaps-to-compete-with-cards-industry-leaders-warn/)
    — Openbankingexpo'
