- headline: Italy proposes instant payments project to connect Balkans with EU infrastructure
  standfirst: Euro instant payments rails would extend into the western Balkans under
    a new Italian proposal, using financial integration as a tool for EU enlargement
    policy.
  body: 'Italian foreign minister Antonio Tajani announced a project at a summit in
    Montenegro on October 22 to build instant payments infrastructure connecting western
    Balkan countries with the European payments network. The initiative frames payment
    system integration as part of the broader EU enlargement agenda for the region.


    The proposal follows a pattern of extending EU payment rails beyond the eurozone''s
    current borders. Iceland signed an agreement on June 24 to connect to TIPS, with
    implementation scheduled for 2028. Greece linked its domestic IRIS system to European
    instant payments in July, and Montenegro itself launched instant payments using
    SEPA standards the same month. The Italian project would go further by creating
    a structured programme across multiple Balkan states, rather than individual country-by-country
    connections.


    The project signals potential new volume on SEPA instant rails and fresh demand
    for compliance and connectivity services among payment infrastructure providers
    and banks active in south-east Europe. It also extends the geopolitical dimension
    of European payment autonomy that the Bank of Finland and others have been articulating
    throughout 2026.'
  editorial_note: A new infrastructure initiative with clear policy backing that extends
    the European instant payments footprint into the western Balkans, relevant to
    infrastructure providers and banks with regional exposure.
  sources: '[Balkan enlargement at the center of the summit in Montenegro: Tajani
    announces a project ...](https://www.agenzianova.com/en/news/balcani-allargamento-al-centro-del-vertice-in-montenegro-tajani-annuncia-un-progetto-sui-pagamenti-istantanei/)
    — Agenzianova'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the initiative without substantive framing: ''The
      initiative would extend euro instant payments rails into the western Balkans''
      — should open with the substantive point or action (eg, ''euro instant payments
      rails would extend into the western Balkans'') to avoid redundant repetition
      of the subject across headline and standfirst. Rule [1]'
    - Body text uses 'For European payment infrastructure providers and banks active
      in south-east Europe, the project signals potential new volume' — frames the
      paragraph around relevance to a specific European audience with an audience-address
      clause. Should state the relevance directly as part of the narrative without
      prefacing with 'For European…'. Rule [29]
    - Editorial note included in the submission but per rules should not flag missing
      information or editorial commentary in the final copy. This is a submission
      element, not copy to be edited, but notes should not appear in published pieces.
      Rule [15]
  verification:
