title: 'PSR formalises payee verification rules; pay-by-bank survey signals commercial
  VRP demand

  '
social_post: 'PSR locks in Confirmation of Payee rules, pay-by-bank demand for commercial
  VRPs surges, and Italy backs Balkan instant payments integration. Today''s briefing:
  {link}

