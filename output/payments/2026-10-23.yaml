- headline: Sweden's Riksbank presses parliament to begin e-krona preparations
  standfirst: The ECB's approaching digital euro pilot and dollar-denominated stablecoins
    are forcing Europe's most cashless nation to reopen a CBDC debate it shelved three
    years ago.
  body: 'Riksbank deputy governor Per Jansson said on October 22 that Sweden''s near-total
    shift away from cash makes a digital krona harder to defer. A Riksbank survey
    earlier this year found only 5% of Swedes had used cash for their most recent
    purchase. Jansson told Reuters that if the krona is not available in a usable
    digital form, it may struggle to compete with more convenient cross-border payment
    instruments.


    The Riksbank published a letter to parliament''s finance committee on October
    15 arguing that preparatory legislative work should begin now, even though Sweden
    has not decided whether to issue an e-krona. A 2023 government inquiry had concluded
    there was no urgent need for a CBDC, but the Riksbank now cites the ECB''s planned
    digital euro pilot in late 2027 and possible issuance in 2029, along with the
    growth of dollar-pegged stablecoins, as developments that have changed the calculation.
    Jansson estimated that legislation and implementation would take at least five
    years.


    The Riksbank also framed payment system resilience as part of Sweden''s total-defence
    strategy. Amanda Sundstroem, senior macro strategist at SEB, said the ability
    to pay during an attack or infrastructure failure is among the most vulnerable
    aspects of Swedish society. For European payment providers, the Riksbank''s shift
    illustrates a broader pattern: the digital euro is not only a euro area project
    but a catalyst forcing non-eurozone countries to define their own digital currency
    positions or risk ceding ground to foreign instruments.'
  editorial_note: 'New story not previously covered. Riksbank deputy governor Jansson''s
    comments to Reuters were made on October 22 at a conference, building on the Riksbank''s
    October 15 letter to parliament. This is a genuine policy shift: Sweden shelved
    e-krona plans after a 2023 inquiry but is now reopening the question under pressure
    from the ECB''s digital euro timeline and stablecoin competition. Relevant to
    European payments audience as it shows the digital euro''s spillover effects on
    non-eurozone payment policy.'
  sources: '[Swedish central bank revives e-krona debate as digital euro, stablecoin
    threat grows](https://www.globalbankingandfinance.com/swedish-central-bank-revives-e-krona-debate-digital-euro/)
    — Reuters (via Global Banking and Finance Review)'
  style_check:
