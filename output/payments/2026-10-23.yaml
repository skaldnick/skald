- headline: FCA chief Nikhil Rathi frames open finance transition in City of London
    speech
  standfirst: Rathi's remarks position the shift from open banking to open finance
    as part of the FCA's broader market integrity agenda, linking it to the regulator's
    digital-era priorities.
  body: 'The Financial Conduct Authority''s chief executive, Nikhil Rathi, addressed
    the transition from open banking to open finance in a speech on market integrity
    in the digital age, delivered in the City of London on October 22. The remarks
    placed open finance alongside AI and digital market conduct as pillars of the
    FCA''s forward agenda.


    The speech follows a sequence of FCA interventions on open finance this year.
    The regulator published its open finance roadmap in April with a 2030 target,
    consulted in June on mortgage rule flexibility, and in October its taskforce mapped
    open finance use cases and identified infrastructure gaps. Rathi''s public framing
    of the agenda in a high-profile City setting reinforces the signal that open finance
    is being treated as a regulatory programme, not an aspiration.


    The available summary of the speech does not include detailed new policy commitments.
    The FCA''s chief executive publicly linked open finance to market integrity, rather
    than treating it solely as a competition or innovation matter.'
  editorial_note: While the speech summary is thin, a public address by the FCA chief
    executive explicitly connecting open finance to the regulator's core market integrity
    mandate is worth flagging for an audience tracking UK regulatory direction.
  sources: '[Market Integrity In A Digital Age - Speech By Nikhil Rathi, UK Financial
    Conduct Authority ...](https://mondovisione.com/media-and-resources/news/speech-by-nikhil-rathi-uk-financial-conduct-authority-chief-executive-market-i-20261022/)
    — Mondovisione'
  style_check:
    compliant: false
    warnings:
    - 'Body opening: ''Nikhil Rathi, the Financial Conduct Authority''s chief executive,
      addressed...'' — Rule violation: do not start the headline, standfirst, and
      body opening sentence with the same word or phrase. Both headline and body start
      with ''Rathi'' / ''Nikhil Rathi''. Vary the opening in at least one of the elements.'
    - 'Body paragraph 2, sentence 2: ''Rathi''s public framing of the agenda in a
      high-profile City setting reinforces the signal that open finance is being treated
      as a regulatory programme, not an aspiration.'' — Rule violation: Do not use
      phrases that announce notability or significance before making a substantive
      point. ''The significance lies in the institutional positioning'' in the preceding
      sentence is flagged framing that should be removed, and the body should lead
      with the substantive claim directly rather than announcing its significance
      first.'
    - 'Body paragraph 3: ''The significance lies in the institutional positioning:
      the FCA''s chief executive publicly linking open finance to market integrity,
      rather than treating it solely as a competition or innovation matter.'' — Rule
      violation: Never flag significance explicitly. Do not write sentences that announce
      importance before explaining it. Remove ''The significance lies in'' and lead
      directly with the substantive point.'
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - The June 2026 claim states FCA 'signalled that open banking data would reshape
      mortgage affordability checks' — search results show June 2026 activity was
      consultation CP26/18 on mortgage rule flexibility and a Policy Sprint, not a
      specific signal about open banking data reshaping affordability checks
  revision:
    replaced: false
    resolved: true
    summary:
    - Changed body opening from 'Nikhil Rathi, the Financial Conduct Authority's chief
      executive' to 'The Financial Conduct Authority's chief executive, Nikhil Rathi'
      to vary the opening and avoid starting both headline and body with the same
      name.
    - Replaced the inaccurate claim that the FCA 'signalled in June that open banking
      data would reshape mortgage affordability checks' with the more accurate 'consulted
      in June on mortgage rule flexibility', reflecting the actual CP26/18 consultation.
    - Removed 'The significance lies in the institutional positioning:' from the final
      paragraph, leading directly with the substantive point about the FCA chief linking
      open finance to market integrity.
