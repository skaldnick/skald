- headline: PSR publishes binding direction on Confirmation of Payee requirements
  standfirst: Specific Direction 17 formalises the verification of payee obligations
    that UK payment firms must meet, moving the regime from expectation to enforceable
    rule.
  body: 'The Payment Systems Regulator (PSR) published Specific Direction 17 on October
    22, setting out binding requirements for Confirmation of Payee across UK payment
    service providers. The direction gives the PSR a formal enforcement tool for a
    service that has, until now, operated under a patchwork of industry commitments
    and regulatory expectations.


    Verification of payee gaps have been a persistent theme over the past year. IBAN
    errors still slip through existing checks, and the PSR''s own study found that
    mandatory APP fraud reimbursement cut losses by £73 million, partly by incentivising
    better prevention. Formalising the direction strengthens the PSR''s hand to act
    against firms whose checks remain inadequate, and creates a clearer compliance
    baseline for new entrants, including open banking providers increasingly active
    in payment initiation.


    The direction sits alongside the delayed verification of payee requirements under
    the EU''s instant payments regulation, where implementation timelines remain a
    point of contention. The UK is now ahead on the enforcement side, even as questions
    about the effectiveness of existing checks persist.'
  editorial_note: A concrete regulatory step that moves Confirmation of Payee from
    soft guidance to enforceable obligation, relevant to all UK PSPs and of comparative
    interest to European firms tracking verification of payee timelines.
  sources: '[PSR publishes Specific Direction 17 (Confirmation of Payee)](https://www.regulationtomorrow.com/2026/10/psr-publishes-specific-direction-17-confirmation-of-payee/)
    — Global Regulation Tomorrow'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (PSR) that is also the subject of
      the headline. Per rule [1], should begin with the substantive point instead
      — eg, 'Specific Direction 17 formalises…' rather than naming PSR.
    - Body paragraph 2 contains 'The move comes after' — this is a hedging scene-setter
      that delays the substantive point. Per rule on paragraph hedging, lead directly
      with the substantive claim.
    - Body paragraph 3 opens with 'For European observers, the direction sits alongside…'
      which frames relevance to European readers with an audience-address construction.
      Per rule, state the European dimension directly without prefacing with 'For
      European observers'.
    - Body paragraph 2 uses vague temporal reference 'Earlier coverage has highlighted'
      without specific dates or timeframes. Per rule on vague temporal references,
      avoid this construction or provide specific dates where available.
  verification:
