- headline: Checkout.com enters in-person payments through Mollie partnership
  standfirst: After 14 years as an online-only acquirer, the move into physical retail
    through Mollie's terminal infrastructure signals a broader consolidation of omnichannel
    acquiring in Europe.
  body: 'Checkout.com has extended its acquiring platform to physical stores, partnering
    with Mollie to combine its processing infrastructure with Mollie''s terminal hardware
    and 350,000-merchant base. Merchants will be able to run in-person and online
    payments through a single acquiring relationship, using one API, contract and
    settlement flow. The service launches first in the UK and European Economic Area
    before expanding to the US next year.


    The partnership''s structure is telling. Mollie retains control of its customer-facing
    experience and hardware strategy, while Checkout.com provides the underlying acquiring
    layer. The arrangement reflects a model increasingly common in European payments:
    specialist acquirers providing processing power to platforms that own the merchant
    relationship, rather than competing for it directly.


    Checkout.com says it expects to process $480 billion in global e-commerce payments
    this year. Entering physical commerce opens a second front in a market where enterprise
    merchants are pressing to consolidate their payment providers across channels.
    Mollie, which completed its acquisition of GoCardless in September, is building
    a pan-European payments group that now spans pay-by-bank, card acquiring and in-store
    acceptance.'
  editorial_note: Not covered in any previous briefing. The story is from October
    20-21 but is still within a reasonable recency window. It is editorially significant
    because Checkout.com's move into in-person payments marks a strategic shift for
    a major European acquirer and illustrates how acquiring consolidation is playing
    out post-Mollie/GoCardless merger. Source is Checkout.com's own announcement and
    supporting coverage from The Paypers and Finovate.
  sources: '[Checkout.com expands into in-person payments as merchant demand drives
    next phase of growth](https://www.checkout.com/newsroom/checkout-com-expands-into-in-person-payments)
    — Checkout.com'
