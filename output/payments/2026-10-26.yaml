title: 'Riksbank revives e-krona; NatWest flags open banking trust gap; Wells Fargo
  sets AI agent terms

  '
social_post: 'Sweden''s Riksbank reopens the e-krona question as stablecoins and the
  digital euro close in. Plus: NatWest surfaces a trust problem in open banking, and
  Wells Fargo draws a line on AI agents. {link}

  '
