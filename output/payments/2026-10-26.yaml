- headline: Wells Fargo sets customer liability terms for AI agent access to accounts
  standfirst: Customers bear responsibility for transactions initiated by AI agents
    acting on their behalf, marking an early attempt to define the liability boundary
    in agentic finance.
  body: 'Wells Fargo has published terms governing customer use of AI agents to interact
    with bank accounts, establishing that customers bear responsibility for actions
    taken by agents operating under their authorisation. The terms draw a distinction
    between the bank''s own data access rights and the limited read-only access available
    through open banking providers.


    Existing legal and regulatory frameworks offer little clarity on how liability
    applies to agentic commerce. The FCA published its framework for agentic finance
    and AI-driven payments earlier this month, while EMVCo has drafted a card-based
    agentic payments framework. Wells Fargo''s approach is among the first from a
    major bank to address the liability question through customer-facing contractual
    terms rather than waiting for regulatory prescription.


    European banks and payment firms designing agentic payment capabilities face the
    same fundamental question about where liability sits when an AI agent, rather
    than a human, initiates a transaction. Wells Fargo''s terms offer an early reference
    point, though European regulators may take a different view on the allocation
    of risk.'
  editorial_note: Wells Fargo's customer liability terms for AI agents are among the
    first from a major bank, providing a concrete reference point as European institutions
    design their own agentic payment frameworks and regulators consider liability
    allocation.
  sources: '[Wells Fargo Sets Customer Responsibility Terms for AI Agent Use](https://www.tokenpost.com/news/technology/40685)
    — TokenPost'
