- headline: NatWest survey finds businesses want open banking providers held to bank-level
    regulation
  standfirst: Equivalent regulatory oversight for open banking providers is regarded
    as essential by 93% of business respondents, surfacing a trust gap that could
    shape the UK's open finance framework.
  body: 'A NatWest survey has found that an overwhelming majority of businesses regard
    equivalent regulatory oversight as essential for open banking providers, with
    93% saying it is very or extremely important. Nearly half of respondents flagged
    ongoing concerns about the security and reliability of open banking services.


    The findings land as the UK''s regulatory landscape is in flux. The Treasury is
    consulting on a modernised payments regime, the Financial Conduct Authority is
    mapping open finance use cases, and the UK Payments Initiative is building out
    a domestic alternative to card networks. Each of these workstreams will need to
    address questions of trust and regulatory parity between banks and non-bank providers.


    The survey underscores a recurring tension in open banking''s expansion: adoption
    is growing, but business confidence has not kept pace. For providers seeking to
    move beyond consumer payments into areas such as invoice finance, payroll and
    treasury, the trust deficit is a commercial problem as much as a regulatory one.'
  editorial_note: The 93% figure on regulatory parity is a concrete data point that
    speaks directly to the open finance framework debate in the UK and the broader
    question of how non-bank providers earn institutional trust.
  sources: '[NatWest : As Open Banking adoption grows, trust becomes the next challenge
    for ...](https://www.marketscreener.com/news/natwest-as-open-banking-adoption-grows-trust-becomes-the-next-challenge-for-businesses-amid-ongoi-ce785cdcd88af025)
    — MarketScreener'
