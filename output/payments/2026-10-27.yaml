title: 'Token.io VRP demand; Noda card-to-bank routing; Riksbank e-krona; NatWest
  open banking survey

  '
social_post: '89% of UK providers report merchant demand for commercial VRPs. Plus:
  Noda routes card checkouts to open banking, Sweden''s e-krona debate revives, and
  NatWest finds trust is the next barrier. {link}

  '
stories:
- headline: Token.io survey finds strong merchant demand for commercial variable recurring
    payments
  standfirst: Merchant appetite for commercial variable recurring payments is running
    well ahead of availability, with 89% of UK providers reporting demand following
    the UK Payments Initiative launch.
  body: 'Token.io has published survey findings showing broad merchant interest in
    recurring pay-by-bank payments, with 89% of UK respondents reporting demand for
    commercial variable recurring payments (VRP). The results come as the UK Payments
    Initiative scheme, which launched in April, begins to create a live environment
    for commercial VRP beyond the original sweeping use case.


    The findings reinforce a pattern visible across the UK market: merchants want
    the lower cost and reduced chargeback exposure of account-to-account payments,
    but need the flexibility of card-like recurring billing to make them work at checkout.
    Commercial VRP is the mechanism designed to bridge that gap, allowing variable-amount
    collections with customer-consented mandates.


    Whether supply can match this stated demand depends on bank implementation. Modulr
    launched commercial VRP capability in June, and Ozone API released a product for
    non-CMA9 banks in July, but coverage remains patchy. The survey suggests the constraint
    is now infrastructure readiness, not merchant willingness.'
  editorial_note: Commercial VRP is a pivotal capability for scaling pay-by-bank beyond
    one-off transactions. Survey data quantifying merchant demand adds substance to
    a story that has so far been driven by provider announcements.
  sources: '[Token.io survey finds demand for recurring Pay by Bank payments](https://thepaypers.com/payments/news/tokenio-survey-finds-demand-for-recurring-pay-by-bank-payments)
    — The Paypers'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'Merchant appetite for commercial VRP is running well
      ahead of availability' but the headline names Token.io as the subject. Per rule
      [1], the standfirst should not open by naming the organisation that is also
      named in the headline. The standfirst should begin with the substantive point
      rather than repeating Token.io's action.
    - Body text uses 'earlier this year' when referring to the UK Payments Initiative
      launch. Per rule [avoid vague temporal references], use specific time periods
      or dates instead of 'earlier this year'.
    - Body text uses 'commercial VRP' in the second paragraph without introducing
      the full form in parentheses on first use in the body. Per rule [parenthetical
      abbreviation], the first use should be 'commercial variable recurring payments
      (VRP)' to establish the abbreviation for subsequent uses.
    - Standfirst uses 'commercial VRP' without spelling out the full term. Per rule
      [do not apply abbreviation-in-parentheses rule to standfirst], common abbreviations
      may be used in standfirst without spelling out, but 'commercial VRP' is non-standard.
      Per rule [do not use cVRP], 'commercial variable recurring payments' or 'commercial
      VRP' should be used, but the standfirst should spell this out or use the full
      form since 'VRP' alone is not a recognisable standalone abbreviation without
      context.
