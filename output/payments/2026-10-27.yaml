- headline: Noda launches product to route card checkouts to open banking payments
  standfirst: BIN-to-Bank intercepts card transactions at checkout and reroutes them
    as bank transfers, challenging the assumption that open banking must compete for
    a separate button alongside card schemes.
  body: 'Noda, a Cyprus-based open banking provider, has launched a product called
    BIN-to-Bank that identifies card payments eligible for conversion to bank transfers
    during checkout. The system uses the bank identification number on a customer''s
    card to determine whether an open banking payment can be initiated instead, routing
    the transaction accordingly without requiring the customer to leave the existing
    checkout flow.


    The product is available across 26 countries and targets merchants looking to
    reduce interchange fees and chargeback exposure. It represents a different tactical
    approach to the card-versus-account-to-account competition: rather than asking
    merchants to add a separate pay-by-bank button, it intercepts card transactions
    and diverts them where possible.


    The model carries risks. Customer consent and experience at the point of redirection
    will determine whether it feels seamless or disruptive. Strong customer authentication
    requirements in Europe also add friction that card-present transactions may not
    face. But embedding open banking within card checkout flows, rather than alongside
    them, is a distinct variation on the standard pay-by-bank proposition, and one
    that could reshape how merchants weigh the economics of each payment method.'
  editorial_note: This product takes a genuinely different approach to account-to-account
    conversion — intercepting card flows rather than adding a parallel button — which
    has broader implications for how open banking competes with cards at checkout.
  sources: '[Noda Launches BIN-to-Bank to Help Online Merchants Reduce Card Payment
    Costs](https://www.globenewswire.com/news-release/2026/10/27/3388798/0/en/noda-launches-bin-to-bank-to-help-online-merchants-reduce-card-payment-costs.html)
    — Globenewswire | [Noda launches BIN-to-Bank to move card checkouts to Open Banking
    in 26 countries](https://app.dealroom.co/news/feed/noda-launches-bin-to-bank-to-move-card-checkouts-to-open-banking-in-26-countries)
    — Dealroom | [Noda launches BIN-to-Bank to help online merchants reduce card payment
    costs](https://www.einpresswire.com/article/952369310/noda-launches-bin-to-bank-to-help-online-merchants-reduce-card-payment-costs)
    — Einpresswire'
  style_check:
    compliant: false
    warnings:
    - 'Body text uses ''account-to-account'' instead of spelling it out as ''A2A''
      or preferred form. Rule: ''Prefer spelling out non-standard abbreviations/acronyms,
      such as "account-to-account" instead of "A2A".'' The editorial note also uses
      ''account-to-account'' but body should spell out fully.'
    - Sentence 'But the concept of embedding open banking within card checkout flows,
      rather than alongside them, is a notable variation on the standard pay-by-bank
      proposition.' violates the rule against announcing notability explicitly. Remove
      'is a notable variation' and state the substantive point directly.
    - 'Standfirst uses ''A2A'' abbreviation without spelling it out first. Rule states:
      ''In the standfirst, common and recognisable abbreviations (such as FCA, EPI)
      may be used on first mention without spelling them out'' — but A2A (account-to-account)
      is not a common/recognisable abbreviation like FCA or EPI, so should be spelled
      out.'
    - 'The standfirst opens with a thematic claim about ''A new approach'' rather
      than naming specific stakes or consequences. Rule requires: ''The standfirst
      must name the specific stakes or consequences of the story — naming the initiatives,
      programmes or competitive dynamics affected'' — should name Noda or reference
      the product/competitive dynamic more specifically.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to name the product (BIN-to-Bank) and the specific competitive
      dynamic (competing for a separate button alongside card schemes) rather than
      opening with a generic thematic claim.
    - The standfirst previously did not use 'A2A' — it used 'open banking' and 'bank
      transfers' — so no A2A abbreviation issue existed there. Confirmed no change
      needed on that point.
    - Body text already uses 'account-to-account' spelled out in full, which is the
      preferred form per house style. No change needed.
    - Replaced 'is a notable variation' with 'is a distinct variation' and extended
      the sentence with a substantive claim, removing the explicit announcement of
      notability.
- headline: Checkout.com enters in-person payments through Mollie partnership
  standfirst: The move marks a significant shift for one of Europe's largest online-only
    acquirers, signalling that omnichannel capability is becoming a baseline expectation
    for enterprise payment processors.
  body: 'Checkout.com is expanding into in-person payment acceptance for the first
    time, partnering with Mollie to combine its acquiring infrastructure with Mollie''s
    terminal hardware and point-of-sale technology. The service will launch first
    in the UK and European Economic Area, followed by the US, with additional card
    schemes and markets planned for 2027. Mollie, which serves more than 350,000 businesses
    across Europe, will retain control of its hardware strategy and customer experience
    while Checkout.com provides the processing layer.


    The partnership reflects a broader convergence in European merchant acquiring.
    Enterprise merchants increasingly want a single provider for online and in-store
    transactions, reducing the operational complexity of managing separate systems
    for reporting, settlement and support. For Checkout.com, which expects to process
    $480 billion in global e-commerce payments this year, the expansion follows what
    the company describes as a period of sustained profitability.


    Antoine Nougue, chief revenue officer at Checkout.com, said the expansion was
    driven by merchant demand.


    "Our merchants know Checkout.com for our speed, reliability and pace of innovation,
    and they asked us to bring that to in-person payments," he said.'
  editorial_note: 'This story was announced on October 20 but received continued coverage
    through October 23. It has not been previously covered in the briefing. It qualifies
    because it goes beyond a vendor announcement: it signals a structural shift in
    European acquiring, where formerly online-only processors are entering physical
    commerce via partnerships rather than building terminal ecosystems from scratch.
    The Mollie partnership is also notable given Mollie''s recent acquisition of GoCardless,
    making it a significant European payments consolidator.'
  sources: '[Checkout.com launches in-person payments and partners with Mollie](https://thepaypers.com/payments/news/checkoutcom-launches-in-person-payments-and-partners-with-mollie)
    — The Paypers'
