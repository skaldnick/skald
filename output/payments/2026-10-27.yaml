- headline: NatWest research finds trust is the main barrier to open banking business
    adoption
  standfirst: More than nine in 10 UK businesses say they are open to trialling open
    banking payments, but trust and understanding remain the primary obstacles to
    conversion.
  body: 'Research published by Payit, NatWest''s open banking payments service, found
    that 94% of UK businesses are open to trialling open banking payments. But the
    same survey identified trust as the main barrier preventing trial from converting
    to adoption, with businesses citing concerns about security, reliability and unfamiliarity
    with the payment method.


    The gap between willingness to experiment and willingness to commit mirrors a
    pattern seen on the consumer side. In April, consumer warnings highlighted similar
    growing pains around pay-by-bank adoption in the UK, with users uncertain about
    payment protections and dispute resolution compared with card payments.


    The challenge facing open banking payments has shifted. Technical capability and
    regulatory frameworks are largely in place; the constraint is now commercial trust-building,
    which requires consistent reliability, clear consumer protections and merchant
    education rather than further product development.'
  editorial_note: Complements the consumer-side adoption friction story covered in
    April with a business-side data point. The 94% headline willingness figure paired
    with trust as the binding constraint is a useful framing for the industry's current
    phase.
  sources: '[Payit by NatWest research finds 94% of businesses open to trialling Open
    Banking payments](https://www.openbankingexpo.com/news/payit-by-natwest-research-finds-94-of-businesses-open-to-trialling-open-banking-payments/)
    — Openbankingexpo'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'Nine in 10' (90%) when the body states '94%' — these
      figures don't match. The standfirst should accurately reflect the research findings.
    - Body text uses 'Earlier this year' which violates the rule against vague temporal
      references. Replace with specific date or month (e.g., 'in April').
    - Paragraph opening with 'For the open banking payments sector, the finding underlines
      that the challenge has shifted' violates the rule against prefacing with audience-address
      clauses like 'For [sector/audience]'. State the point directly without this
      framing.
    - The phrase 'the finding underlines that' combined with 'the constraint is now
      commercial trust-building' risks announcing significance before the substantive
      point. Restructure to lead with the substantive claim directly rather than announcing
      what the finding 'underlines'.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Changed standfirst from 'Nine in 10' to 'More than nine in 10' to accurately
      reflect the 94% figure cited in the body.
    - Replaced 'Earlier this year' with 'In April' to provide a specific temporal
      reference.
    - Removed 'For the open banking payments sector, the finding underlines that'
      audience-address framing and rewrote the paragraph opening to lead directly
      with the substantive claim.
