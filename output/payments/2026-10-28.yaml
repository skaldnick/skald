title: 'Zen.com scales pay-by-bank; NatWest flags open banking trust gap; Ripple wins
  US bank charter

  '
social_post: 'NatWest says trust is now the barrier to open banking growth, Zen.com
  rolls pay-by-bank across nine European markets, and Ripple lands a US bank charter.
  Today''s briefing: {link}

  '
stories:
- headline: NatWest says trust, not technology, is the main barrier to open banking
    growth
  standfirst: Nearly half of UK businesses use open banking but most want providers
    regulated like banks, highlighting the gap between adoption and confidence.
  body: 'NatWest''s open banking payments unit Payit has published survey findings
    showing that while almost half of UK businesses now use open banking, the majority
    want third-party providers held to the same regulatory standards as banks. The
    results point to trust, rather than technical capability, as the primary constraint
    on further adoption.


    The UK''s open banking ecosystem is under increasing scrutiny over consumer protections
    and provider accountability. The FCA''s open finance roadmap, the emergence of
    the UK Payments Initiative, and the regulator''s recent work on agentic finance
    all assume deepening reliance on non-bank providers. If business users do not
    trust the framework those providers operate within, the commercial case for scaling
    pay-by-bank and variable recurring payments weakens.


    Regulatory parity, or at least perceived parity, may matter as much as product
    quality in determining which open banking services gain traction beyond early
    adopters.'
  editorial_note: This advances the continuing narrative around open banking adoption
    barriers in the UK, moving the discussion from technical reliability to regulatory
    trust, which has direct implications for the FCA's open finance agenda.
  sources: '[Payit by NatWest: trust is next hurdle for Open Banking adoption](https://thepaypers.com/fintech/news/payit-by-natwest-trust-is-next-hurdle-for-open-banking-adoption)
    — The Paypers'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (NatWest) that is also named in
      the headline. Per rule 1, the standfirst should begin with the substantive point,
      not 'A survey by NatWest's Payit finds...' — instead open with 'Nearly half
      of UK businesses use open banking but...'
    - Body paragraph 2 opens 'The finding lands at a moment when...' which is a vague
      temporal scene-setter that delays the substantive point. Per the rule against
      hedging scene-setters, lead directly with the substantive claim about regulatory
      scrutiny.
    - Body paragraph 3 opens 'For providers and banks alike, the implication is that...'
      which flags significance before stating the substantive point. Per the rule
      against never flagging significance explicitly, write the substantive point
      directly without 'the implication is that' framing.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Standfirst rewritten to open with the substantive point ('Nearly half of UK
      businesses...') rather than naming NatWest, per rule 1.
    - Body paragraph 2 revised to remove the vague temporal scene-setter ('The finding
      lands at a moment when...') and lead directly with the substantive claim about
      regulatory scrutiny.
    - Body paragraph 3 revised to remove the significance-flagging framing ('For providers
      and banks alike, the implication is that...') and state the substantive point
      directly.
- headline: Zen.com launches pay-by-bank across nine European markets via Mastercard
    Open Finance
  standfirst: The rollout brings pay-by-bank payment acceptance and wallet top-ups
    to Germany, Austria, Spain, Belgium, the Netherlands, Italy, Portugal, Ireland
    and Lithuania.
  body: 'Zen.com is deploying pay-by-bank capabilities through Mastercard Open Finance
    across nine European markets, enabling merchants to accept account-to-account
    payments and consumers to top up digital wallets directly from their bank accounts.
    The markets covered are Germany, Austria, Spain, Belgium, the Netherlands, Italy,
    Portugal, Ireland and Lithuania.


    Mastercard''s Open Finance platform, built on its Aiia acquisition, is becoming
    the distribution channel for a growing number of pay-by-bank services in continental
    Europe. Zen.com''s adoption across nine markets in a single rollout signals that
    the infrastructure is now mature enough for multi-market deployment without country-by-country
    integration, reducing the cost and complexity merchants face when adding account-to-account
    rails alongside cards.


    Mastercard is positioning itself on both sides of the payments aisle, maintaining
    its card network dominance while actively enabling the account-to-account rails
    that could eventually compete with it.'
  editorial_note: A multi-market pay-by-bank rollout via Mastercard Open Finance illustrates
    the maturing infrastructure for account-to-account payments in Europe and Mastercard's
    dual positioning across cards and open banking.
  sources: '[Zen.com and Mastercard expand Pay By Bank for merchants and consumers
    across Europe](https://www.finextra.com/newsarticle/48659/zencom-and-mastercard-expand-pay-by-bank-for-merchants-and-consumers-across-europe)
    — Finextra | [ZEN.COM introduces Pay by Bank to nine European markets via Mastercard
    Open Finance](https://www.openbankingexpo.com/news/zen-com-introduces-pay-by-bank-to-nine-european-markets-via-mastercard-open-finance/)
    — Openbankingexpo | [Zen.com and Mastercard expand Pay By Bank for merchants and
    consumers across Europe](https://www.finextra.com/newsarticle/48659/zencom-and-mastercard-expand-pay-by-bank-for-merchants-and-consumers-across-europe?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the action/rollout rather than the organisation
      from headline, but then repeats ''account-to-account payment acceptance'' which
      is near-verbatim repetition of the headline''s concept. However, this is acceptable
      as the standfirst provides the substantive point (which markets and what services).
      The real issue is: the standfirst should not spell out ''account-to-account''
      when the headline uses ''pay-by-bank'' — these are related but different concepts
      and the standfirst''s emphasis on A2A may confuse readers.'
    - Body paragraph 2 contains 'That matters for merchants' — this is explicit significance
      flagging that violates the rule against 'This matters because', 'The significance
      here is', etc. The sentence should be rewritten to state the substantive point
      directly without announcing its importance.
    - Body paragraph 3 contains 'The move also illustrates' — while not as egregious
      as 'The move is notable', opening with 'illustrates' still frames the paragraph
      around what the move demonstrates rather than stating the substantive claim
      directly. The sentence should lead with the substantive point about Mastercard's
      dual positioning.
    - Standfirst uses 'account-to-account' but the house style rule states to prefer
      spelling out non-standard abbreviations (like 'A2A'). However, 'account-to-account'
      is already spelled out, so this is compliant. But the body repeats 'account-to-account'
      multiple times — consistency is maintained but the first paragraph of the body
      repeats the headline/standfirst phrasing too closely ('account-to-account payments'
      appears in both).
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - 'Standfirst: replaced ''account-to-account payment acceptance'' with ''pay-by-bank
      payment acceptance'' to align terminology with the headline and avoid conceptual
      confusion.'
    - 'Body paragraph 2: removed ''That matters for merchants weighing the cost and
      complexity of adding account-to-account alongside cards'' (explicit significance
      flagging) and folded the substantive point into the preceding sentence as a
