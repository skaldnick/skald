- headline: Idemia achieves first EMVCo certification for quantum-resistant payment
    cards
  standfirst: Banks using Idemia's platform can now begin future-proofing card portfolios
    against quantum computing threats, after the French firm became the first card
    platform provider to meet EMVCo's post-quantum cryptography standards.
  body: 'Idemia has become the first company to achieve EMVCo certification for a
    payment card platform with access to post-quantum cryptography and crypto-agility
    services. The certification allows banks using Idemia''s platform to begin future-proofing
    their card portfolios against the eventual threat posed by quantum computers to
    current encryption standards.


    The timeline for quantum computers capable of breaking existing cryptographic
    protections remains uncertain, but major standards bodies and regulators have
    begun requiring migration plans. EMVCo''s decision to certify post-quantum capabilities
    signals that the card industry is moving from theoretical preparation to practical
    product availability. Card issuers now face a strategic question about when to
    begin deploying quantum resilience, not whether to plan for it.


    The French provider is one of the largest payment card platform vendors globally.
    Being first to certification gives it a commercial advantage in conversations
    with issuers who face pressure from regulators and scheme operators to demonstrate
    quantum readiness.'
  editorial_note: First EMVCo certification for post-quantum cryptography on a payment
    card platform is a concrete industry milestone, relevant to European issuers beginning
    to plan for quantum-era security requirements.
  sources: '[Idemia prepares payment cards for quantum threats with EMVCo certification](https://www.finextra.com/newsarticle/48666/idemia-prepares-payment-cards-for-quantum-threats-with-emvco-certification?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming 'The certification' which repeats the subject from
      the headline ('Idemia achieves first EMVCo certification'). Per rule 1, the
      standfirst should open with the substantive point or action, not restate the
      headline subject. Revise to open with 'Post-quantum cryptography standards...'
      or 'Banks using Idemia's platform can now...'
    - Body paragraph 2 contains 'For card issuers, the question shifts from whether
      to plan for quantum resilience to when to begin deploying it.' This is a colon-introduced
      binary question that can be recast with a preposition. Prefer 'Card issuers
      face a strategic question about when to begin deploying quantum resilience'
      per rule on binary questions.
    - Body paragraph 3 opens with 'Idemia' immediately after the previous paragraph
      also focuses on Idemia as subject. Use a pronoun or descriptive phrase ('The
      French provider', 'The platform vendor') to avoid mechanical repetition of the
      proper noun in consecutive paragraphs, per the rule on avoiding repeated grammatical
      subjects.
