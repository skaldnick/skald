title: 'Zen.com pay-by-bank rollout; Neonomics adds Nordic VoP; Ripple wins US bank
  charter

  '
social_post: 'Pay-by-bank keeps spreading across Europe, Neonomics tackles the VoP
  gap in the Nordics, and Ripple lands a US bank charter with BNY and Robinhood deals
  attached. Today''s briefing: {link}

  '
stories:
- headline: Zen.com launches pay-by-bank in nine European markets via Mastercard
  standfirst: The integration extends Mastercard's open finance platform into a mid-tier
    European fintech, a test case for whether the scheme's account-to-account distribution
    strategy can challenge standalone providers such as Tink and Token.
  body: 'Zen.com has enabled pay-by-bank for merchant payment acceptance and digital
    wallet top-ups across nine markets: Germany, Austria, Spain, Belgium, the Netherlands,
    Italy, Portugal, Ireland and Lithuania. The service runs on Mastercard Open Finance
    infrastructure.


    The deployment is part of Mastercard''s broader push to position its open finance
    platform as the connective layer for account-to-account payments across fragmented
    European banking systems. For Zen.com, which operates primarily in central and
    southern Europe, the move adds a non-card checkout option at a time when merchant
    interest in reducing card scheme fees continues to grow.


    Pay-by-bank adoption in Europe remains uneven. The UK leads by volume, but continental
    markets have been slower to move beyond domestic schemes such as iDEAL and Bizum.
    Mastercard''s strategy of embedding pay-by-bank within its existing merchant relationships
    offers a distribution channel that standalone open banking providers struggle
    to match. Zen.com''s transaction volumes will be a useful signal for whether that
    channel advantage converts at the mid-tier merchant level.'
  editorial_note: The rollout across nine markets is a concrete data point on how
    Mastercard is using its open finance platform to distribute pay-by-bank at scale,
    relevant to the ongoing European debate about card scheme versus account-to-account
    economics.
  sources: '[Zen.com and Mastercard expand Pay By Bank for merchants and consumers
    across Europe](https://www.finextra.com/newsarticle/48659/zencom-and-mastercard-expand-pay-by-bank-for-merchants-and-consumers-across-europe?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra | [ZEN.COM launches pay-by-bank in nine European markets via Mastercard](https://thepaypers.com/payments/news/zencom-launches-pay-by-bank-in-nine-european-markets-via-mastercard)
    — The Paypers | [Zen.com rolls out pay-by-bank in nine European markets with Mastercard](https://www.electronicpaymentsinternational.com/news/zen-com-pay-by-bank-european-markets/)
    — Electronicpaymentsinternational'
