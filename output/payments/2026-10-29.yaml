- headline: 'Neonomics integrates verification of payee into Finnish pay-by-bank service

    '
  standfirst: 'Nordic expansion of payee verification addresses a gap that European
    regulators have flagged as a fraud risk for instant payments.

    '
  body: 'Neonomics has integrated verification of payee technology from Movitz Payments
    into its Nello Pay service in Finland, with plans to extend the capability to
    Sweden, Denmark and Norway in 2027. The integration enables payers to confirm
    the identity of the recipient before a transaction completes.


    European regulators have repeatedly warned that the absence of payee verification
    in many markets undermines the fraud protections that should accompany the EU''s
    instant payments mandate. While the European Payments Council''s verification
    of payee framework applies to SEPA credit transfers and instant payments, implementation
    has been patchy. The Nordic markets, which have high instant payment adoption,
    have been among those where verification infrastructure has lagged.


    Neonomics raised €3.6 million from existing shareholders in October after a strategic
    pivot. The verification of payee integration signals a shift toward building differentiated
    infrastructure rather than competing purely on basic payment initiation, where
    margins have proved thin.

    '
  editorial_note: 'Verification of payee remains a live issue across Europe, with
    previous coverage noting delays and gaps. Neonomics extending this to Finland
    with Nordic expansion planned is a concrete step that advances this continuing
    story.

    '
  sources: '[Neonomics and Movitz Payments strengthen Pay by Bank security](https://www.finextra.com/pressarticle/111501/neonomics-and-movitz-payments-strengthen-pay-by-bank-security?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
