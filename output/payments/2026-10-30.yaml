- headline: ACI Worldwide and Circle integrate stablecoin settlement into bank payment
    rails
  standfirst: USDC settlement can slot into existing banking infrastructure in Latin
    America, with implications for how European banks approach stablecoin integration.
  body: 'ACI Worldwide and Circle have announced a collaboration to show how stablecoin
    settlement can be embedded into conventional banking and payment infrastructure.
    The initial focus is Latin America, where ACI''s payment processing platform connects
    banks and payment providers to domestic and cross-border rails.


    The integration uses Circle''s USDC stablecoin to settle transactions processed
    through ACI''s infrastructure, aiming to reduce the cost and delay associated
    with traditional correspondent banking in the region. Rather than requiring banks
    to build new systems, the approach layers stablecoin settlement onto existing
    payment workflows.


    ACI''s position as a major infrastructure provider to European banks and payment
    schemes, including its recent selection to process instant payments for the European
    Payments Initiative, means European banks using ACI''s platform could face pressure
    to adopt similar capabilities as USDC gains regulatory standing under the Markets
    in Crypto-Assets Regulation (MiCA). Circle''s USDC was designated as the EU''s
    first significant e-money token under MiCA earlier this month.'
  editorial_note: ''
  sources: '[ACI Worldwide and Circle collaborate on LatAm payments](https://www.finextra.com/pressarticle/111519/aci-worldwide-and-circle-collaborate-on-latam-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisations in the headline ('The collaboration
      demonstrates') rather than leading with the substantive point or action. Per
      rule 1, the standfirst should begin with the substantive point, not repeat the
      subject from the headline. Revise to open with the action—e.g., 'USDC settlement
      can slot into existing banking infrastructure in Latin America, with implications
      for how European banks approach stablecoin integration.'
    - Body text uses 'MiCA' without spelling out the full term on first use. Per rule
      20 (spell-out-on-first-use), the first mention should read 'Markets in Crypto-Assets
      Regulation (MiCA)' to establish the abbreviation before using it subsequently.
    - The phrase 'makes this more than a regional story' is a significance announcement
      that should be removed or rewritten to state the substantive point directly
      per rule 5. Revise to lead directly with the consequence—e.g., 'ACI's position
      as a major infrastructure provider to European banks means European banks using
      ACI's platform could face pressure to adopt similar capabilities as USDC gains
      regulatory standing under MiCA.'
    - Editorial note contains an instruction ('makes this stablecoin integration directly
      relevant to European payments infrastructure') that should not appear in the
      editorial note itself per rule 23 (do not include editorial notes about missing
      information or editorial direction). The editorial note should only provide
      context about sourcing or verification; strategic relevance should be evident
      in the story itself.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with the substantive point ('USDC settlement can
      slot into…') rather than repeating the collaboration named in the headline,
