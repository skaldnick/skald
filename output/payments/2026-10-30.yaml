- headline: Adyen scraps medium-term margin target as it invests beyond payments
  standfirst: A 12% share price drop and the withdrawal of the company's 2028 profitability
    goal signal a strategic pivot from pure-play processing to a broader commerce
    platform.
  body: 'Adyen has cut its 2026 EBITDA margin target to 50%, down from around 52%,
    and withdrawn its medium-term ambition to exceed 55% by 2028. The company said
    it was accelerating investment in staff, platform development and the integration
    of two recent acquisitions – billing platform Orb and loyalty technology provider
    Talon.One – to capture what it called a larger opportunity across payments, billing
    and financial products. Shares fell roughly 12% in Amsterdam trading on October
    28, extending year-to-date losses to approximately 40%.


    The margin cut overshadowed third-quarter results that beat analyst expectations.
    Net revenue rose 23% year on year to €738 million, while processed volume grew
    30% to €451 billion. Platforms, which now serves 312,000 businesses, was the fastest-growing
    segment: its revenue jumped 46% to €100 million. The two acquisitions contributed
    approximately two percentage points to constant-currency revenue growth.


    Adyen is effectively telling investors it will trade short-term profitability
    for scale in adjacent markets. Co-CEO Ingo Uytdehaage framed the shift around
    demand from merchants for a single provider covering payments, billing, loyalty
    and financial products. The risk is that Adyen ends up running at roughly the
    same margin as Nexi, which reported a first-half EBITDA margin of around 50% while
    growing merchant revenue less than 1%. Whether the growth rate justifies the margin
    compression will determine whether the market sees this as ambition or overreach.'
  editorial_note: Adyen is one of Europe's most significant independent payment processors
    and its decision to scrap its medium-term margin target while pivoting into billing
    and loyalty represents a notable strategic shift. The 12% share drop and 40% year-to-date
    decline make this genuinely notable under the house rule that results are only
    covered when they are remarkable at a significant company. Story published October
    28, within the recency window.
  sources: '[Adyen publishes Q3 2026 Business Update](https://www.adyen.com/press-and-media/adyen-publishes-q3-2026-business-update-6r9vz0)
    — Adyen'
