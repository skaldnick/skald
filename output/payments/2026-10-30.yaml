- headline: Idemia achieves first EMVCo certification for quantum-resistant payment
    cards
  standfirst: Banks can now begin issuing cards designed to resist quantum computing
    attacks, removing the argument that quantum-safe payment hardware is not yet commercially
    available.
  body: 'Idemia has become the first company to receive EMVCo certification for a
    payment card platform incorporating post-quantum cryptography and crypto-agility
    services. The certification means banks can begin issuing cards designed to resist
    attacks from quantum computers, which are expected eventually to break widely
    used encryption methods.


    The timeline for quantum threats to payment security remains uncertain, but the
    industry has been moving pre-emptively. EMVCo published security position statements
    on quantum computing in August 2026, and Idemia''s certification is the first
    product to demonstrate compliance with post-quantum expectations. Crypto-agility,
    the ability to switch between cryptographic algorithms without replacing hardware,
    is a central feature, allowing issuers to adapt as standards evolve.


    For European card issuers, the certification removes the argument that quantum-safe
    cards are not yet commercially available. Regulators including the ECB have flagged
    quantum preparedness as a supervisory expectation, and having a certified product
    on the market shifts the conversation from theoretical planning to procurement
    decisions.'
  editorial_note: First-of-its-kind certification for quantum-resistant payment cards
    is a concrete milestone in an area European regulators are increasingly focused
    on, making it directly relevant to card issuers and payment processors.
  sources: '[Idemia prepares payment cards for quantum threats with EMVCo certification](https://www.finextra.com/newsarticle/48666/idemia-prepares-payment-cards-for-quantum-threats-with-emvco-certification?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the substantive point (certification providing a
      migration path) rather than beginning with the action or consequence after naming
      the organisation. Per rule on standfirst opening: should lead with the action/consequence,
      not the organisation context. The organisation ''Idemia'' is named in the headline,
      so the standfirst should not begin by restating what the certification does
      without first establishing the news itself.'
    - 'Body paragraph beginning ''For European card issuers, the certification matters
      because...'' uses the framing ''the certification matters because'' which violates
      the rule against announcing significance explicitly before making the substantive
      point. Rewrite to state the substantive point directly: ''For European card
      issuers, the certification removes the argument that quantum-safe cards are
      not yet commercially available'' without the signposting phrase.'
    - Vague temporal reference 'earlier this year' should be replaced with a specific
      date or month. The rule requires avoiding vague temporal references like 'earlier
      this year' when a specific time period is available.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
