title: 'Visa-Tencent agentic deal; PSR makes CoP permanent; Idemia preps cards for
  quantum era

  '
social_post: 'Visa and Tencent team up on agentic commerce, the PSR locks in Confirmation
  of Payee permanently, and Idemia gets the first quantum-ready card certification.
  Today''s briefing: {link}

  '
stories:
- headline: Visa and Tencent partner on agentic commerce and cross-border payments
  standfirst: The partnership pairs Visa's Intelligent Commerce programme with Tencent's
    WeChat Pay ecosystem, opening a channel between Chinese consumers and international
    merchants as agentic payments move from pilots to high-volume commercial corridors.
  body: 'Visa has signed a memorandum of understanding (MoU) with Tencent covering
    cross-border payments and AI-powered commerce. The agreement comes weeks after
    Visa secured expanded regulatory approval for its operations in China, giving
    the partnership immediate operational scope.


    The MoU spans agentic commerce, where AI agents initiate and complete transactions
    on behalf of users, alongside more conventional cross-border payment flows. For
    Visa, the tie-up extends its agentic payments strategy into one of the world''s
    largest digital ecosystems. For Tencent, it adds an international payments layer
    to WeChat Pay and its broader platform.


    The partnership follows a string of agentic payment announcements across the industry
    in recent months, including Visa''s own live agentic transaction between buyer
    and supplier platforms in October. Linking that capability to Tencent''s scale
    in China suggests the technology is moving beyond controlled pilots toward commercial
    deployment in high-volume corridors.'
  editorial_note: This advances the agentic payments story materially by connecting
    Visa's programme to Tencent's massive Chinese consumer base, signalling the technology's
    shift toward commercial scale in a major cross-border corridor.
  sources: '[Visa and Tencent ink agentic commerce and cross-border payments MoU](https://www.finextra.com/newsarticle/48672/visa-and-tencent-ink-agentic-commerce-and-cross-border-payments-mou?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming Visa, which is also named in the headline. Rule 1
      requires opening with the substantive point instead — eg, 'The partnership pairs…'
      rather than 'The deal pairs Visa's…'
    - Body text uses 'MoU' without spelling out the full form on first use. Rule on
      abbreviations requires 'memorandum of understanding (MoU)' on first introduction
      in body text, even though it was spelled out in the previous sentence.
    - Standfirst does not name the specific stakes or consequences with sufficient
      precision. Rule requires naming 'the initiatives, programmes or competitive
      dynamics affected' — the standfirst should identify what Visa's agentic payments
      programme or Tencent's specific services are concretely advancing, not just
      describe the moment generically as 'when AI-initiated commerce is moving from
      pilots to production.'
