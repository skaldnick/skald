- headline: Bank of Canada consults on consumer-driven banking accreditation
  standfirst: Canada's central bank is designing accreditation guidelines for its
    open banking regime, offering a live comparison point for European regulators
    weighing similar frameworks.
  body: 'The Bank of Canada has opened a public consultation on accreditation guidelines
    for participants in its consumer-driven banking framework. The consultation invites
    stakeholders to comment on how third-party providers should be credentialed and
    supervised before gaining access to consumer financial data.


    Canada''s approach places accreditation design with the central bank rather than
    a dedicated conduct regulator or a market-led body. This contrasts with the UK
    model, where the FCA oversees open banking authorisation, and with the EU''s approach
    under PSD2 and PSD3, where national competent authorities handle licensing. The
    consultation''s scope and the central bank''s direct involvement reflect a conscious
    decision to treat data access as a systemic infrastructure question rather than
    purely a consumer protection matter.


    The Canadian consultation offers a useful comparison as the EU works toward its
    own open finance framework and the UK advances its FCA-led roadmap. The accreditation
    design choices Canada makes, particularly around liability allocation and ongoing
    supervision, will provide evidence for or against the different institutional
    models being debated in Europe.'
  editorial_note: Canada's central bank taking direct ownership of open banking accreditation
    is a genuinely different institutional design choice. European professionals tracking
    open finance implementation will find the comparison with UK and EU approaches
    instructive.
  sources: '[Bank of Canada opens consultation on consumer-driven banking accreditation
    guidelines](https://tradersunion.com/news/regulators/show/4064542-bank-canada-consultation-banking-guidelines/)
    — Tradersunion'
