- headline: Wandhoefer warns AI agents could make payment authentication obsolete
  standfirst: Existing strong customer authentication models were designed for human
    users and have no adequate answer for autonomous software agents initiating payments
    at scale.
  body: 'Ruth Wandhoefer, one of the payments industry''s most prominent regulatory
    voices, has warned that AI agents could render traditional payment authentication
    frameworks obsolete. Speaking at an industry event, she argued that strong customer
    authentication as currently designed assumes a human is present at the point of
    transaction, an assumption that breaks down when autonomous agents initiate payments
    on a user''s behalf.


    Wandhoefer suggested that agentic AI could accelerate the adoption of open finance
    by enabling automated financial management and lending decisions, but only if
    the infrastructure adapts. The challenge is not just technical but legal: current
    European regulations tie authentication to individual consent at the moment of
    payment, and delegating that consent to a software agent raises questions that
    neither PSD2 nor the forthcoming PSD3 framework has resolved.


    The warning lands as the agentic payments space is moving rapidly from proof-of-concept
    to early production. Visa and Mastercard have completed live agentic transactions
    in 2026, Blik has piloted its first agentic payment, and several European banks
    have run their own trials. An industry alliance with over 25 founding members
    launched in August. Wandhoefer''s point is that the plumbing is being built before
    the rules governing it are settled.'
  editorial_note: Wandhoefer is a recognised authority on European payments regulation.
    Her public warning about authentication obsolescence adds analytical weight to
    the agentic payments debate at a moment when multiple live implementations are
    running ahead of regulatory clarity.
  sources: '[AI agents threaten traditional payment authentication, warns Wandhöfer](https://www.openbankingexpo.com/news/ai-agents-could-render-traditional-payment-authentication-obsolete-warns-dr-ruth-wandhofer/)
    — Openbankingexpo'
