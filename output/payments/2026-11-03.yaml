title: 'Agentic payments liability; Wells Fargo terms; Wandhoefer authentication warning

  '
social_post: 'Wells Fargo puts AI agent liability squarely on customers. Meanwhile,
  Ruth Wandhoefer warns authentication frameworks aren''t ready. Today''s briefing
  unpacks what agentic payments mean for European open banking. {link}

  '
stories:
- headline: Wells Fargo makes customers liable for all AI agent transactions
  standfirst: Updated terms of service expose a gap in open banking consent frameworks
    that programmes such as PSD3 and the FCA's planned agentic finance standards will
    need to address as agentic commerce scales.
  body: 'Wells Fargo has updated its terms of service to make customers legally responsible
    for every transaction initiated by an AI agent acting on their behalf. The change
    applies regardless of whether the customer explicitly authorised the specific
    payment, shifting all risk from the bank to the consumer in a category of transactions
    that no existing regulatory framework fully contemplates.


    No current open banking standard includes a mechanism for a customer to grant
    an agent permission to execute a narrowly scoped action, such as paying a specific
    bill and nothing else. The absence of granular consent frameworks means banks
    face a binary choice: block AI agents entirely, as JPMorgan Chase did in October,
    or permit them and disclaim liability, as Wells Fargo has now done. Neither approach
    is sustainable as agentic commerce matures.


    Regulatory thinking is further ahead in Europe. The Financial Conduct Authority
    announced on October 19 that it would develop a trusted framework for agentic
    finance collaboratively with industry and other regulators, and EMVCo has drafted
    a card-based agentic payments standard. But the Wells Fargo move underscores how
    quickly commercial reality is outpacing regulatory design. The question of who
    bears liability when an agent acts beyond its intended scope is no longer theoretical
    for open banking providers building agent-initiated payment flows in Europe.'
  editorial_note: Wells Fargo's liability terms represent the first major US bank
    to formally allocate agentic payment risk to consumers, creating a concrete reference
    point for the European agentic payments debate that has so far been largely theoretical.
  sources: '[Wells Fargo Just Made You Legally Responsible for Every Transaction Your
    AI Agent Makes](https://www.techtimes.com/articles/329947/20261103/wells-fargo-just-made-you-legally-responsible-every-transaction-your-ai-agent-makes.htm)
    — Techtimes'
