- headline: InvestEngine reports 98% success rate with commercial variable recurring
    payments
  standfirst: A 98% success rate from a live deployment offers the first substantial
    evidence that commercial variable recurring payments can match or exceed card
    reliability for recurring financial services payments.
  body: 'InvestEngine has reported a 98% payment success rate using commercial variable
    recurring payments (VRP) as an open banking payment method. Nick Oeen, head of
    product for payments at InvestEngine, disclosed the figure at Open Banking Expo
    UK and Europe 2026.


    Commercial VRP has been positioned as the open banking successor to card-on-file
    for subscription and recurring payments, but adoption has been held back by questions
    about reliability and conversion rates compared with cards. A 98% success rate
    from a live deployment in financial services is rare. For context, card payment
    success rates for recurring transactions typically sit in a similar range, though
    they benefit from decades of retry logic and network-level optimisation.


    The result is particularly relevant as the UK Payments Initiative and commercial
    VRP frameworks continue to scale. Sceptics have argued that open banking payment
    methods cannot yet match card reliability in production. InvestEngine''s figures
    suggest that for at least some use cases, that gap has effectively closed.'
  editorial_note: Commercial VRP adoption has been hampered by reliability concerns;
    a concrete success-rate figure from a live financial services deployment is rare
    and directly relevant to the scaling debate.
  sources: '[InvestEngine achieves 98% payment success rate with commercial VRP](https://www.openbankingexpo.com/news/investengine-achieves-98-payment-success-rate-with-commercial-vrp/)
    — Openbankingexpo'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst: ''commercial VRP'' should be written as ''commercial variable recurring
      payments (VRP)'' on first mention, not using the abbreviation alone. The rule
      states: ''Do not apply the abbreviation-in-parentheses rule to the standfirst.
      In the standfirst, common and recognisable abbreviations (such as FCA, EPI)
      may be used on first mention without spelling them out.'' However, VRP is not
      listed as a ''common and recognisable abbreviation'' like FCA or EPI, so it
      must be spelled out.'
    - 'Standfirst opening: ''The investment platform''s results'' repeats the subject
      concept from the headline (''InvestEngine'') in a different form. The rule states:
      ''Do not start the headline, standfirst, and body opening sentence with the
      same word or phrase.'' While not identical, opening with ''The investment platform''
      immediately after the headline names InvestEngine creates near-identical framing.
      The standfirst should open with the substantive point directly.'
    - 'Body: ''commercial VRP'' in the second paragraph should use the established
      abbreviation ''VRP'' consistently, but it is spelled out again as ''commercial
      variable recurring payments'' without the parenthetical abbreviation. The rule
      states: ''When a parenthetical abbreviation is introduced (eg, "EU Digital Identity
      (EUDI)"), use that abbreviation on every subsequent occurrence in the same piece.''
      Since VRP was introduced with parentheses in the first paragraph, subsequent
      references should use ''commercial VRP'' consistently.'
    - 'Body: Phrase ''A 98% success rate from a live deployment in financial services
      is a meaningful data point'' uses ''meaningful'' which frames significance.
      The rule states: ''Never flag significance explicitly.'' The sentence should
      be rewritten without the significance-framing adjective.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - 'Standfirst: Rewrote opening to lead with the substantive point (''A 98% success
      rate from a live deployment'') rather than ''The investment platform''s results'',
      avoiding near-repetition of the headline''s subject.'
    - 'Standfirst: Spelled out ''commercial variable recurring payments'' instead
      of using the abbreviation ''commercial VRP'' alone, since VRP is not a commonly
      recognised abbreviation like FCA or EPI.'
    - 'Body: Changed ''commercial variable recurring payments'' in the second paragraph
      to ''Commercial VRP'', using the abbreviation consistently after its parenthetical
      introduction in the first paragraph.'
    - 'Body: Replaced ''is a meaningful data point'' with ''is rare'', removing the
      significance-framing adjective while retaining the substantive claim.'
- headline: Stripe launches Treasury product in the UK market
  standfirst: UK platforms can now hold, move and manage operational cash from the
    same Stripe dashboard they use to accept payments, intensifying competition with
    banking-as-a-service providers.
  body: 'Stripe has launched its Treasury product in the UK, enabling platform customers
    to manage funds from the same dashboard they use to accept payments. The product
    lets founders hold, move and manage money without needing a separate banking relationship
    for operational cash.


    Stripe Treasury has been available in the US since 2020, where it is offered in
    partnership with banks that hold the underlying deposits. The UK launch extends
    the same embedded finance model into a market where banking-as-a-service competition
    is already intense, with providers such as Modulr, ClearBank and Griffin operating
    in the same space.


    Platforms built on Stripe''s payment stack gain integrated cash management without
    additional operational friction. Stripe''s existing merchant base already uses
    its payment rails, making Treasury a natural upsell rather than a standalone product
    requiring its own acquisition effort. That distribution advantage poses a direct
    challenge to banking-as-a-service incumbents, which must win platform relationships
    from scratch.'
  editorial_note: ''
  sources: '[Stripe Treasury launches in the UK](https://www.finextra.com/pressarticle/111563/stripe-treasury-launches-in-the-uk?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'The move gives' which violates rule on not opening with
      significance-flagging phrases. Should open with the substantive point directly
      (e.g., 'Stripe has launched...') rather than announcing significance with 'The
      move'.
    - Body contains 'For platforms built on Stripe's payment stack, Treasury removes
      a layer of operational friction. For the banking-as-a-service sector, it represents
      a formidable new entrant' — this frames significance before the substantive
