      the 'For X, it represents' framing that announces importance.
    - Editorial note should not be included in the copy itself. Per the rules, do
      not include editorial notes about context or significance in the final published
      text.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Rewrote standfirst to open with the substantive point ('UK platforms can now
      hold, move and manage operational cash…') rather than the significance-flagging
      'The move gives'.
    - Rewrote third paragraph to state competitive and operational consequences directly,
      removing the 'For X, it represents…' framing that announced significance before
