- headline: Iceland plans domestic account-to-account scheme to reduce card network
    dependency
  standfirst: A procurement process is under way for infrastructure that would give
    Icelandic consumers and merchants a payment option outside Visa and Mastercard
    for the first time.
  body: 'The Central Bank of Iceland has begun procuring the core technology for a
    new domestic account-to-account payment scheme, built on request-to-pay messaging
    and the country''s existing instant credit transfer infrastructure. Tomas Brynjolfsson,
    the central bank''s deputy governor for financial stability, set out the plan
    at the MoneyLIVE Nordic Banking conference in Copenhagen on October 30, framing
    it as a response to Iceland''s near-total dependence on two international card
    networks for retail payments.


    Iceland''s payments landscape is highly digital but unusually concentrated. Virtually
    all retail transactions run through Visa and Mastercard, a structure the central
    bank says creates operational and strategic vulnerabilities, particularly if connectivity
    to external infrastructure is disrupted. The new scheme would allow customers
    to pay directly from bank accounts in shops, online and in person-to-person transfers.
    The central bank would provide shared infrastructure, operating standards and
    settlement, while leaving customer-facing products to commercial banks and payment
    firms.


    The domestic scheme is separate from Iceland''s planned participation in the Eurosystem''s
    TARGET Instant Payment Settlement service, agreed with the ECB in June, which
    has a readiness target in the second half of 2028. Brynjolfsson was explicit that
    payment sovereignty for a small economy does not mean self-sufficiency but rather
    ensuring alternatives exist alongside international networks. The initiative mirrors
    debates playing out across the Nordics and the wider European payments landscape
    over resilience, sovereignty and the role of domestic rails.'
  editorial_note: Distinct from the previously covered Iceland-joins-TIPS story (June
    25, 2026). That story concerned cross-border instant payments via the Eurosystem.
    This is a new domestic retail payment scheme to diversify away from card networks,
    announced publicly for the first time on October 30 and reported by Finextra today.
    The BIS published the full speech on November 2. Relevant to the broader European
    payment sovereignty debate.
  sources: '[Iceland prepares for domestic account-to-account payments infrastructure](https://www.finextra.com/newsarticle/48698/iceland-prepares-for-domestic-account-to-account-payments-infrastructure)
    — Finextra'
