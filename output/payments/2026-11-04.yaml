- headline: EPC publishes updated verification of payee matching recommendations
  standfirst: Updated rules on character handling and beneficiary name assessment
    sharpen the matching logic that underpins Europe's fraud prevention regime for
    instant payments.
  body: 'The European Payments Council (EPC) has published an updated set of recommendations
    for matching processes under its verification of payee scheme. The guidance covers
    how payment service providers should handle character variations and assess beneficiary
    names before initiating a payment, adding specificity to a process that has been
    live for barely a year.


    Verification of payee is a core element of the EU''s instant payments regulation,
    requiring providers to check whether the name given by the payer matches the account
    holder before executing a transfer. The scheme''s effectiveness depends on consistent
    matching logic across providers and jurisdictions. Divergent implementations have
    been a recurring concern since the rules took effect, and the EPC''s updated recommendations
    aim to narrow the scope for inconsistency.


    The publication comes as the industry continues to grapple with the operational
    detail of payee verification, with key IBAN-level errors still slipping through
    the system. More granular matching guidance should reduce false negatives that
    let fraudulent payments proceed and false positives that block legitimate ones.
    Uniform adoption across providers remains the outstanding question.'
  editorial_note: Verification of payee implementation quality remains a live concern;
    updated EPC matching guidance is operationally material for every provider subject
    to the instant payments regulation.
  sources: '[EPC publishes new Verification of Payee matching recommendations](https://www.finextra.com/newsarticle/48697/epc-publishes-new-verification-of-payee-matching-recommendations?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation from the headline ('New guidance')
      but should open with the substantive point instead. Per rule [1], avoid redundant
      repetition of the subject across headline and standfirst — rewrite to open with
      the action/consequence (e.g., 'Character handling and beneficiary name assessment
      rules are being sharpened...').
    - Body paragraph three uses vague temporal reference 'Earlier coverage' without
      specific date or publication. Per rule on avoiding vague temporal references,
      either cite a specific date or remove the vague phrase entirely.
    - Body paragraph three contains the phrase 'but the real test will be' which hedges
      significance before making a substantive point. Per the rule against hedging
      scene-setters, lead directly with the substantive claim rather than announcing
      what matters.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Rewrote standfirst to open with 'Updated rules' rather than implicitly echoing
