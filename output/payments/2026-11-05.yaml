- headline: Trading 212 adopts commercial VRP for automated investment deposits
  standfirst: The partnership with TrueLayer is among the first high-profile implementations
    of commercial variable recurring payments outside subscriptions, testing whether
    the mechanism can displace cards and direct debit for recurring investment top-ups.
  body: 'Trading 212, the UK-based investment platform, is using TrueLayer''s bank-on-file
    product to let customers set up automated deposits powered by commercial variable
    recurring payments. The feature allows users to authorise recurring transfers
    from their bank account to fund investment plans, replacing card payments and
    direct debit as the funding mechanism.


    The product went live in the UK on June 2, 2026, but adoption beyond subscriptions
    and utilities billing has been limited. Trading 212''s implementation is a test
    of whether commercial VRP can gain traction in investment and wealth management,
    where predictable recurring funding is central to the user experience but card-based
    top-ups carry interchange costs and direct debit involves slower settlement.


    The move builds on TrueLayer''s bank-on-file proposition, which stores a customer''s
    bank account as a persistent payment credential in the same way card-on-file works
    for card networks. For the broader open banking payments ecosystem, the question
    is whether commercial VRP can accumulate enough merchant and platform adoption
    to become a credible alternative to established recurring payment methods.'
  editorial_note: Commercial VRP adoption beyond early pilots is a key indicator for
    open banking's commercial viability. Trading 212's use for automated investment
    deposits extends the product into a new vertical and tests its real-world appeal
    against cards and direct debit.
  sources: '[Trading 212 launches instant automated deposits powered by TrueLayer](https://fxnewsgroup.com/forex-news/retail-forex/trading-212-launches-instant-automated-deposits-powered-by-truelayer/)
    — FX News Group | [Trading 212 launches automated deposits with TrueLayer''s Bank
    on File](https://thepaypers.com/fintech/news/trading-212-launches-automated-deposits-with-truelayers-bank-on-file)
    — The Paypers'
  style_check:
    compliant: false
    warnings:
    - 'Headline uses ''commercial VRPs'' — the rule states: ''Do not use "cVRP" as
      an abbreviation for "commercial variable recurring payments". Write out "commercial
      VRP" or "commercial variable recurring payments (VRP)" instead.'' The headline
      should use ''commercial VRP'' (singular or as a category) not the plural ''commercial
      VRPs''.'
    - 'Body text: ''commercial variable recurring payments (VRP)'' — abbreviation
      introduced in parentheses but ''VRP'' does not recur after this first use in
      the body. Per rule: ''Only include an abbreviation in parentheses after a term
      if that abbreviation is used again later in the same piece.'' The parenthetical
      should be removed.'
    - 'Body text: ''Commercial VRP went live in the UK in May 2026'' — This sentence
      opens a paragraph with the same term (''Commercial VRP'') used as the grammatical
      subject immediately after the previous paragraph ended with ''commercial VRP''.
      Per rule on avoiding mechanical repetition: ''Avoid repeating the specific country
      or organisation name as the grammatical subject of consecutive sentences when
      a pronoun or descriptive noun phrase serves clearly.'' Use a referring expression
      such as ''The product went live…'' instead.'
    - 'Standfirst: ''commercial variable recurring payments'' — This is spelled out
      in the standfirst, but per rule: ''When an abbreviation such as "EPI" is spelled
      out in the standfirst, the body must still introduce the full form on first
      use — eg, "the European Payments Initiative (EPI)" — if the abbreviation recurs
      in the body.'' Since ''VRP'' recurs in the body, the body''s first introduction
      of the full term is correct, but the abbreviation should not be placed in parentheses
      in the body because it does not recur after that sentence.'
