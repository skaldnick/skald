stories:
- headline: European Commission withdraws open finance regulation in competitiveness
    pivot
  standfirst: The decision to abandon the Financial Data Access regulation removes
    the EU's only planned framework for extending open banking-style data sharing
    to savings, investments, pensions and insurance.
  body: 'The European Commission has confirmed it will withdraw the Financial Data
    Access (FiDA) regulation within six months. The proposal, first tabled in June
    2023, was listed for withdrawal in the Commission''s 2027 work programme, published
    on November 4. FiDA would have required financial institutions to share customer
    data across savings, investments, mortgages, pensions and insurance with authorised
    third parties, subject to customer consent.


    The withdrawal marks the end of a prolonged standoff. FiDA faced sustained opposition
    from banks, insurers and several member states over implementation costs, data
    security concerns and the commercial obligations it would impose on data holders.
    The proposal had nearly been dropped from the 2025 work programme before being
    rescued at the last minute by supporters within the Commission; trilogue negotiations
    then stalled through 2026. The broader 2027 programme reflects a sharp reduction
    in new legislative ambition, with just 23 initiatives compared to 38 in 2026 and
    45 in 2025, as the Commission prioritises simplification and competitiveness over
    new regulation.


    Without FiDA, there is no EU-wide mechanism to mandate data sharing beyond payment
    accounts. Open finance in Europe will depend on bilateral agreements, voluntary
    industry standards and fragmented national approaches. The UK, by contrast, continues
    to build out its open finance framework under the Financial Conduct Authority.
    For fintechs and third-party providers whose business models assumed regulated
    access to broader financial data, the withdrawal narrows the addressable market.
    For incumbents, it preserves control over customer information across non-payment
    products.'
  editorial_note: 'The European Commission''s 2027 work programme, published November
    4, confirms the withdrawal of the FiDA open finance regulation — a story not previously
    covered in the briefing. This is a first-order regulatory shift: Europe''s only
    planned legislative framework for open finance beyond payment accounts has been
    abandoned. The story was broken by MLex on November 3 from the draft programme
    and confirmed by multiple sources on November 4. It is distinct from the May 14
    story on the EU investor data-sharing proposal, which covered a separate capital-markets
    initiative.'
  sources: '[EU Commission to withdraw financial data access proposal, draft shows
    (update*)](https://www.mlex.com/mlex/financial-services/articles/2545816) — MLex'
