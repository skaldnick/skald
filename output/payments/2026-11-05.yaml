- headline: Stripe launches Treasury product in the UK market
  standfirst: The expansion brings Stripe's embedded finance capabilities to UK platforms,
    intensifying competition with specialist banking-as-a-service providers.
  body: 'Stripe has launched its Treasury product in the UK, enabling platforms and
    marketplaces to offer their business customers integrated cash management features
    including stored balances and money movement. The product embeds banking-like
    functionality directly into third-party software without requiring those platforms
    to hold their own banking licences.


    Treasury has been available in the US since 2020, where it underpins financial
    features for platforms such as Shopify. The UK launch positions Stripe against
    established banking-as-a-service providers including Modulr, ClearBank and Griffin,
    all of which serve the embedded finance segment through different models. Stripe''s
    scale and existing merchant relationships give it a distribution advantage, but
    the UK''s regulatory environment and competitive landscape differ materially from
    the US market.


    The launch comes as embedded finance becomes a more contested space in the UK.
    Platforms increasingly expect financial services to be built into their core product
    rather than bolted on, and the providers that can offer the simplest integration
    with the broadest capabilities stand to capture significant share of the SME and
    marketplace banking stack.'
  editorial_note: Stripe entering the UK embedded finance market with Treasury is
    competitively significant. It pits a global payments infrastructure company directly
    against UK banking-as-a-service specialists in a segment that is becoming central
    to how platforms serve business customers.
  sources: '[easyShop and Clearpay partner on BNPL for UK shoppers](https://thepaypers.com/payments/news/easyshop-partners-with-clearpay-to-offer-bnpl-instalments-in-the-uk)
    — The Paypers'
