- headline: UK and Switzerland discuss open finance cooperation in bilateral dialogue
  standfirst: Both countries exchanged positions on open finance at their annual financial
    dialogue, adding a bilateral dimension to two frameworks developing in parallel.
  body: 'The UK and Switzerland held their annual financial dialogue in November,
    with open finance among the topics discussed, according to a joint statement published
    by the UK government. Switzerland presented its ongoing work on open finance in
    the financial sector, while both delegations discussed their respective priorities
    and approaches.


    Switzerland extended its open finance framework to cover pension data earlier
    this year, while the Financial Conduct Authority published its open finance roadmap
    in April with a 2030 target. Both countries are developing open finance regimes
    outside the EU''s legislative framework, creating potential for alignment or divergence
    that could affect cross-border data flows and service provision.


    The inclusion of open finance alongside topics such as sustainable finance and
    market access suggests it is becoming a standing item in bilateral financial diplomacy
    rather than a niche technical discussion, though the joint statement is light
    on specific commitments.'
  editorial_note: The UK-Switzerland dialogue placing open finance on the agenda is
    a modest but real signal about how non-EU jurisdictions are approaching regulatory
    coordination. Relevant to readers tracking the fragmentation risk in European
    open finance.
  sources: '[UK-Switzerland Financial Dialogue Joint Statement - November 2026](https://www.gov.uk/government/publications/uk-switzerland-financial-dialogue-2026-joint-statement/uk-switzerland-financial-dialogue-joint-statement-november-2026)
    — GOV.UK'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation ('joint statement from the annual
      UK-Switzerland financial dialogue') that is also named/identified in the headline.
      Per rule 1, the standfirst should open with the substantive point or action,
      not the organisation. Consider opening with 'Both countries exchanged positions
      on open finance…' instead.
    - 'Body paragraph 2 contains ''The bilateral exchange is notable as both countries
      are developing open finance regimes outside the EU''s legislative framework,
      creating potential for alignment or divergence that could affect cross-border
      data flows and service provision.'' This violates the rule against explicitly
      flagging significance. Remove ''is notable as'' and lead directly with the substantive
      point: ''Both countries are developing open finance regimes outside the EU''s
      legislative framework, creating potential for alignment or divergence that could
      affect cross-border data flows and service provision.'''
    - Body paragraph 3 opens with 'The joint statement is light on specific commitments,
      but the inclusion of open finance alongside topics such as sustainable finance
      and market access suggests it is becoming a standing item in bilateral financial
      diplomacy rather than a niche technical discussion.' This hedges the substantive
      point ('light on specific commitments') before making it. Per rule about not
      opening with hedging scene-setters, lead directly with the substantive claim
      about open finance becoming a standing item, rather than starting with the lack
      of specificity.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - 'Could not independently verify: Article states ''Switzerland extended its open
      finance framework to cover pension data earlier this year.'' Search results
      show Switzerland is working toward Open Pension through pilots and initiatives
      (including a September 2026 pilot), but no formal extension of an open finance
      regulatory framework with mandatory pension data requirements has been confirmed.
      As of December 2025, Switzerland had no legal obligation for data sharing.'
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with 'Both countries exchanged positions on open
      finance' rather than naming the joint statement, avoiding redundant repetition
      of the subject from the headline.
    - Removed 'is notable as' from body paragraph 2 and restructured to lead directly
      with the substantive point about both countries developing regimes outside the
      EU framework.
    - Restructured body paragraph 3 to lead with the substantive claim about open
      finance becoming a standing item in bilateral diplomacy, moving the hedge about
      lack of specific commitments to the end of the sentence.
- headline: BioCatch survey finds 68% of Italian bank leaders report rising fraud
    losses
  standfirst: A survey of 100 Italian banking leaders highlights growing fraud pressures
    tied to instant payments and mobile channels, as the sector prepares for PSD3
    and tighter verification requirements.
  body: 'A BioCatch survey of 100 Italian banking leaders found that 68% report rising
    fraud losses, with concerns concentrated around Single Euro Payments Area (SEPA)
    risk, mobile scams and the operational demands of preparing for the third Payment
    Services Directive (PSD3). The findings land as European instant payments volumes
    continue to grow and verification of payee requirements remain unevenly implemented
    across the bloc.


    Italy''s payments market has seen rapid digitalisation, with digital payment volumes
    more than doubling between 2018 and 2025. That growth has expanded the attack
    surface for fraud, particularly through mobile channels where social engineering
    scams are harder to detect with traditional controls. Banca d''Italia in September
    directed payment firms to screen both parties on all transfers, adding compliance
    burden alongside the fraud risk.


    The survey results underscore a tension running through European instant payments:
    the same speed and accessibility that drives adoption also compresses the window
    available for fraud detection. With PSD3 preparation timelines tightening and
    verification of payee still patchy in several markets, Italian banks appear to
    be feeling the pressure more acutely than the headline adoption figures suggest.'
  editorial_note: Italian banking fraud data tied to SEPA instant payments and PSD3
    preparation is relevant context for tracking how the instant payments mandate
    is playing out in practice across different national markets.
  sources: '[BioCatch: 68 percent of Italian bank leaders see rising fraud losses](https://thepaypers.com/fraud-and-fincrime/news/biocatch-68-percent-of-italian-bank-leaders-see-rising-fraud-losses)
    — The Paypers'
  style_check:
    compliant: false
    warnings:
    - Standfirst uses 'SEPA instant payments' without spelling out the abbreviation.
      Per the rule preferring spelling out non-standard abbreviations, this should
      be 'Single Euro Payments Area (SEPA) instant payments' or descriptively as 'Europe's
      instant payment system' on first use.
    - Body text uses 'SEPA risk' without having introduced the full form 'Single Euro
      Payments Area' in parentheses on first use in the body. The standfirst's use
      does not establish the abbreviation for body text; the body must introduce it
      independently.
    - Standfirst names 'PSD3' without spelling it out. Per the rule on abbreviations
      in standfirsts, common recognisable abbreviations may be used without spelling
      out, but PSD3 is not universally recognised enough to assume without context;
      it should be spelled out as 'Payment Services Directive 3 (PSD3)' or similar.
    - The editorial note begins with 'Italian banking fraud data tied to SEPA instant
      payments and PSD3 preparation is relevant to European payments professionals…'
      This violates the rule against framing European relevance with an audience-address
      clause. The editorial note should not address 'European payments professionals'
      directly; European relevance should be integral to the story itself, not flagged
      in a note.
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - 'Standfirst: replaced ''SEPA instant payments'' with ''instant payments'' to
      avoid using an unspelled abbreviation in the standfirst while keeping it concise.'
    - 'Body: spelled out ''Single Euro Payments Area (SEPA)'' on first use in body
      text, replacing bare ''SEPA''.'
    - 'Body: spelled out ''the third Payment Services Directive (PSD3)'' on first
      use in body text, replacing bare ''PSD3''.'
    - 'Editorial note: removed the audience-address clause ''is relevant to European
      payments professionals tracking'' and reworded to avoid directly addressing
      the audience.'
