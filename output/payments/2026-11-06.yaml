title: 'JPMorgan and Mastercard back agentic commerce; Trading 212 adopts commercial
  VRP; UK-Swiss dialogue covers open finance

  '
social_post: 'JPMorgan Payments and Mastercard put $15m behind an agentic commerce
  startup. Plus: commercial VRP gets a real-world test case, and the UK-Switzerland
  financial dialogue touches open finance. {link}

  '
stories:
- headline: JPMorgan Payments and Mastercard invest in agentic commerce platform Firmly
  standfirst: A joint $15m Series A bet on a no-code agentic commerce startup signals
    that the race to own the infrastructure layer for AI-initiated transactions is
    accelerating.
  body: 'JPMorgan Payments and Mastercard have co-invested in a $15 million Series
    A round for Firmly, a no-code platform designed to enable agentic commerce. The
    investment places two of the industry''s most influential infrastructure providers
    behind a single startup building tools for AI agents to initiate and complete
    transactions.


    The round follows a string of agentic payments announcements from both firms over
    recent months. Mastercard launched its Wallet Pay product in September, added
    a trust layer to its agentic programme in October, and provided Agent Pay infrastructure
    for a live agentic transaction with Danske Bank. JPMorgan, meanwhile, took the
    opposite tack in October by blocking outside AI agents from accessing customer
    accounts, indicating it intends to control how agentic commerce interfaces with
    its own rails.


    Jointly backing Firmly suggests both firms see value in a shared infrastructure
    layer sitting between AI agents and payment networks, rather than each building
    proprietary solutions. Incumbents are determined to shape the plumbing of agentic
    commerce rather than cede it to new entrants, and co-investing in a single platform
    points to a bet that interoperability across networks will matter more than proprietary
    lock-in.'
  editorial_note: JPMorgan Payments and Mastercard co-investing in the same agentic
    commerce startup is a meaningful signal about where incumbents see the category
    heading, and worth covering for a European payments audience tracking the agentic
    payments build-out.
  sources: '[JP Morgan Payments and Mastercard invest in agentic commerce startup
    firmly](https://www.finextra.com/newsarticle/48712/jp-morgan-payments-and-mastercard-invest-in-agentic-commerce-startup-firmly?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisations also named in the headline ('JPMorgan
      Payments and Mastercard'), breaking rule [1]. Should open with the substantive
      point instead — e.g., 'Two of the largest players in global payments have jointly
      backed...' or restructure to begin with the action/consequence.
    - Headline and standfirst both start with the same grammatical construction ('JPMorgan
      Payments and Mastercard' / 'Two of the largest players'), violating rule [49]
      which requires variation across headline, standfirst, and body opening. At least
      one element must open differently.
    - Body paragraph three contains 'For the broader market, it reinforces that agentic
      commerce is moving from proof-of-concept to investable category' — this uses
      'it reinforces' which frames significance before stating the substantive point,
      approaching rule [6] violation territory. The framing is also vague about what
      'it' means. Consider restructuring to state the substantive point directly.
    - The phrase 'reinforces that agentic commerce is moving from proof-of-concept
      to investable category' announces a trend without grounding it in specific evidence
      or consequences. The body should anchor this claim more directly to the investment's
      concrete implications rather than making a general observational statement.
