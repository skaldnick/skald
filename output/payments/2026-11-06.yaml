      - sources show Mastercard provided Agent Pay infrastructure and PayOS handled
      execution, but no evidence of co-investment. Danske Bank transaction was announced
      September 21, 2026, not October as contextual placement suggests.
  revision:
    replaced: false
    resolved: true
