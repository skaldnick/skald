- headline: Trading 212 adopts TrueLayer's bank-on-file product with 97% success rate
  standfirst: The deployment of commercial variable recurring payments for deposits
    on a well-known investment platform offers an early real-world performance benchmark
    for a product category still seeking merchant traction.
  body: 'Trading 212 has integrated TrueLayer''s bank-on-file product for customer
    deposits, reporting a 97% payment success rate. The product uses the UK''s commercial
    variable recurring payments (VRP) framework, allowing customers to authorise recurring
    payments within agreed parameters without re-authenticating each time.


    TrueLayer launched bank-on-file in June as a direct challenge to card-on-file
    at checkout. Commercial VRP has been live under the UK Payments Initiative since
    June 2, with Modulr following on June 19 as an early participant. Trading 212''s
    adoption provides the first published performance figure from a recognisable consumer
    brand, giving the market a concrete data point on whether commercial VRP can match
    or exceed card reliability in practice.


    A 97% success rate directly challenges the persistent industry objection, voiced
    by card networks and acquirers among others, that open banking payment conversion
    rates lag behind cards. The deployment also illustrates how commercial VRP is
    finding early traction in financial services and investment platforms, where recurring
    funding flows are a natural fit, rather than in retail e-commerce where card habits
    are more entrenched.'
  editorial_note: Commercial VRP is a closely watched development in UK open banking,
    and published success-rate data from a well-known platform is rare enough to merit
    coverage. This advances the story from product launch to real-world performance.
  sources: '[Trading 212 Adds Bank on File Deposits: 97% Success Rate](https://financefeeds.com/trading-212-adds-automated-bank-deposits-as-97-success-claim-tests-open-banking-adoption/)
    — FinanceFeeds'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (Trading 212) that appears in the
      headline, violating rule 1. Should begin with 'The deployment of commercial
      variable recurring payments...' or similar substantive point instead.
    - Body text uses 'commercial VRP' in first paragraph without the full spelling
      introduced in parentheses on first use. Rule requires 'commercial variable recurring
      payments (VRP)' on first body use, even though standfirst spells it out.
    - Sentence 'Trading 212's adoption is one of the first published performance figures
      from a recognisable consumer brand' uses hedging language ('one of the first')
      that weakens the claim. If it is a notable first or early example, state that
      directly rather than using 'one of' which softens significance.
    - Paragraph opening 'A 97% success rate, if sustained at scale, would address...'
      uses conditional framing ('if sustained') that delays the substantive point.
      Should state the direct claim more forcefully.
    - The phrase 'That open banking payment conversion rates lag behind cards' in
      the final paragraph uses vague attribution. Should specify who makes this objection
      or cite a source.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Draft states 'commercial VRP has been live under the UK Payments Initiative
