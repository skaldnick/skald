    - Revised standfirst to avoid opening by naming the ECB, which is already named
      in the headline, per rule [1].
    - Introduced 'Single Euro Payments Area (SEPA)' with parenthetical abbreviation
      on first use in the body to align with headline usage, per rule [11].
    - Similarly introduced 'European Central Bank (ECB)' with parenthetical abbreviation
      on first use in the body.
    - Changed 'took full effect' to 'took effect' to fix awkward phrasing.
    - Reframed final paragraph opening to remove explicit significance-flagging language
      ('signals that regulatory patience...may be limited'), replacing with direct
