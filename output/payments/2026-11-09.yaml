- headline: ECB urges wider SEPA adoption as costly transfers persist across Europe
  standfirst: Despite the instant payments mandate now in force, high-cost transfers
    remain common in several member states, with Cyprus among those where the central
    bank wants faster progress.
  body: 'The European Central Bank (ECB) has called on banks and consumers to make
    greater use of Single Euro Payments Area (SEPA) transfers, citing persistent reliance
    on expensive legacy payment methods despite the instant payments regulation requiring
    banks to offer round-the-clock instant transfers since October 2025. In Cyprus,
    the proportion of instant transfers among all credit transfers has reached almost
    32 per cent by volume, but the ECB regards this as insufficient.


    The intervention comes roughly a year after the instant payments regulation took
    effect. While the regulation mandated that banks receive and send instant payments
    at no premium to standard transfers, the ECB''s concern suggests that behavioural
    and commercial barriers continue to slow adoption. Banks in some markets have
    been slow to promote instant payments or to retire higher-cost alternatives.


    Payment service providers and fintechs building on euro instant rails face tightening
    regulatory expectations. The European Commission opened its first enforcement
    cases under the regulation in June, and continued pressure from the ECB points
    toward further supervisory attention.'
  editorial_note: The ECB publicly pressing for faster SEPA instant adoption signals
    regulatory impatience that could lead to tighter enforcement, directly relevant
    to banks and PSPs still adjusting their pricing and product strategies.
  sources: '[ECB urges greater use of SEPA as costly money transfers persist across
    Europe](https://cyprus-mail.com/2026/11/09/ecb-urges-greater-use-of-sepa-as-costly-money-transfers-persist-across-europe)
    — Cyprus-mail | [ECB urges wider use of SEPA amid costly transfers — Cyprus Mail](https://ua.news/en/dovkolo-svitu/etsb-zaklikav-aktivnishe-koristuvatisia-sepa-cherez-dorogi-perekazi-cyprus-mail)
    — UA.NEWS'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (ECB) that is also named in the
      headline. Per rule [1], the standfirst should begin with the substantive point
      or action instead — e.g., 'Despite the instant payments mandate now in force,
      high-cost transfers remain common…' rather than naming the ECB.
    - Body text uses 'SEPA' in the headline and 'Single Euro Payments Area' in the
      first body paragraph without introducing the abbreviation in parentheses. Per
      rule [11], when an abbreviation is introduced in parentheses on first use in
      the body, it must be used consistently thereafter. Here, 'SEPA' appears in the
      headline but 'Single Euro Payments Area' is spelled out in full in the body
      without the parenthetical abbreviation being established.
    - Body text describes the regulation as having 'took full effect' which is awkward
      phrasing. The sentence 'The intervention comes roughly a year after the instant
      payments regulation took full effect' should read 'took effect' not 'took full
      effect'.
    - The phrase 'For payment service providers and fintechs building on euro instant
      rails, the ECB's push signals that regulatory patience with sluggish adoption
      may be limited' frames the significance explicitly by stating 'signals that
      regulatory patience...may be limited.' Per rule [5], do not flag significance
      explicitly; write the substantive point directly. This should be reframed as
      'Payment service providers and fintechs building on euro instant rails face
      tightening regulatory expectations…' or similar.
    - Editorial note should not be included in the copy check output per rule [19]
      — editorial notes about context should not appear in the final text. However,
      if this note is meant as metadata for the editor, it is acceptable but should
      not appear in the published piece.
  verification:
