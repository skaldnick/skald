      migration phases occur if dates are known, or acknowledge the phased timeline
      more explicitly.'
- headline: Affirm acquires Nexi's Ratepay to enter Germany's pay-by-invoice market
  standfirst: The deal gives the US buy now, pay later provider an established position
    in German-speaking Europe's distinctive invoice payments segment, while Nexi sheds
    another non-core asset.
  body: 'Nexi has agreed to sell Ratepay, a Berlin-based pay-by-invoice specialist
    serving merchants in Germany, Austria and Switzerland, to Affirm. The two companies
    have also signed a memorandum of understanding to expand their existing commercial
    partnership across the DACH region. Financial terms were not disclosed. Completion
    is expected in the first half of 2027, subject to regulatory approvals.


    Bernardo Mingrone, chief executive of Nexi, said the divestment was "in line with
    our strategy focused on core activities and optimized portfolio". Nexi had already
    classified Ratepay as non-core and restructured the business, reducing its workforce
    by roughly 20%. The sale continues the pattern set at Nexi''s capital markets
    day: disciplined disposal of peripheral operations in favour of payment processing
    and acquiring.


    For Affirm, Ratepay offers a ready-made route into a market where paying after
    receiving goods remains a dominant checkout method. Pat Suh, Affirm''s senior
    vice president and managing director of global markets, said the company''s focus
    is on expanding merchant and consumer trust. Under Affirm''s ownership, Ratepay
    plans to add instalment products alongside its existing invoice capability. Affirm
    said the acquisition is not expected to materially affect its financial results
    or its outlook for the 2027 financial year.'
  editorial_note: 'Genuinely new story announced November 9, 2026. Nexi''s disposal
    of Ratepay to Affirm illuminates two broader trends: European payments infrastructure
    groups streamlining around core acquiring and processing, and US BNPL providers
    using M&A to enter distinctive European payment segments rather than building
    from scratch. Nexi''s earlier first-half results were covered July 29 but that
    piece dealt with financial performance, not portfolio strategy. This is a distinct
    corporate action.'
  sources: '[Nexi agrees Ratepay sale to Affirm, signs MoU on DACH partnership](https://thepaypers.com/mergers-aquisitions-and-investments/news/nexi-agrees-ratepay-sale-to-affirm-signs-mou-on-dach-partnership)
    — The Paypers'
  style_check:
    compliant: false
    warnings:
    - 'Body text uses ''US'' in headline form in standfirst: ''the US buy now, pay
      later provider'' should be ''the US buy-now-pay-later provider'' or similar,
      but more importantly, per rule on acronyms in standfirst: ''BNPL'' appears in
      editorial note but is introduced without spelling out in body text. First use
      in body should be ''buy-now-pay-later (BNPL)'' if the acronym recurs.'
    - Standfirst opens by naming organisation from headline (Nexi) indirectly via
      'the US buy now, pay later provider' reference to Affirm, which is acceptable,
      but the structure 'The deal gives the US buy now, pay later provider' opens
      with 'The deal' rather than the substantive point. Per rule [1], should begin
      with substantive point or action, not 'The deal gives'.
    - 'Body text: ''Bernardo Mingrone, chief executive of Nexi'' — per rule on possessive
      constructions with initialised organisations, this should be restructured to
      avoid possessive, but the organisation name is not being initialised here, so
      this is acceptable. However, the rule on leading with name rather than title
      has been followed correctly.'
    - 'Body text: ''Affirm said the acquisition is not expected to materially affect
      its financial results'' — this is a hedging statement that weakens the claim.
      The rule against hedging scene-setters suggests stating substantive points directly,
      but this is Affirm''s own qualifier, so it may be reportage rather than editorial
      hedging. Acceptable as direct attribution.'
    - 'Potential issue: ''first half of 2027'' — rule requires specific time periods
      for financial/business results, eg ''(April-June)''. The phrase ''first half
      of 2027'' is vague without specification of which months. Should be ''the first
      half of 2027 (January-June)'' or similar.'
    - 'Body text: ''reducing its workforce by roughly 20%'' — ''roughly'' is vague.
      If the exact figure is available, use it; if not, this may be acceptable as
      reported, but ''around 20%'' or a specific number would be clearer.'
