- headline: ECB approves Revolut's partial transfer of Lithuanian banking operations
    to France
  standfirst: The approval formalises a dual-hub model that will see Western European
    customers migrate from Vilnius to Paris, reshaping Revolut's regulatory footprint
    across the EU.
  body: 'The European Central Bank has approved the cross-border reorganisation of
    Revolut Bank UAB, enabling the fintech to transfer part of its Lithuanian entity''s
    assets and liabilities to Revolut Bank SA, the French banking subsidiary licensed
    in August. The Bank of Lithuania''s Legal and Licensing Department submitted the
    formal notice to Lithuania''s Centre of Registers on November 6, following the
    ECB''s approval on October 22.


    French customers will be the first to migrate to Revolut Bank SA, with Germany,
    Ireland, Italy, Portugal and Spain to follow in subsequent phases. Revolut Bank
    UAB will continue serving customers across the rest of the European Economic Area.
    Revolut has said that neither Lithuanian employees nor Lithuanian customers will
    be affected, and that its plans to expand and launch new services in Lithuania
    remain unchanged.


    The restructuring marks a significant evolution in how Europe''s largest neobank
    organises itself within the single market. Rather than passporting services from
    a single licence — the approach most fintechs have used since PSD2 — Revolut is
    building a two-centre model with separate supervised entities in Vilnius and Paris.
    With more than 75 million customers globally, the company''s decision to anchor
    its Western European operations under direct French and ECB supervision reflects
    both the scale it has reached and the regulatory complexity that comes with it.'
  editorial_note: 'This story is genuinely new — published today (November 10) by
    The Paypers and yesterday by Lithuanian news agency BNS via LRT. It moves forward
    the Revolut licensing story from August (French licence granted) to a concrete
    next stage: ECB-approved cross-border restructuring and formal customer migration.
    Not previously covered in the briefing.'
  sources: '[ECB clears partial move of Revolut''s Lithuanian operations to France](https://thepaypers.com/fintech/news/ecb-clears-partial-move-of-revoluts-lithuanian-operations-to-france)
    — The Paypers'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation ('The approval') that is also named
      in the headline ('ECB'). Per rule on standfirst structure, should open with
      the substantive point or action instead — e.g., 'The move formalises a dual-hub
      model...' rather than 'The approval formalises...'
    - Body contains 'This marks a significant evolution' — this flags significance
      explicitly before making the substantive point. Per rule on never flagging significance
      explicitly, should state the substantive point directly without the hedging
      framing.
    - Standfirst uses vague temporal reference 'will see' without grounding in specific
      time. Should specify when customer migration phases occur if dates are known,
      or acknowledge the phased timeline more explicitly.
