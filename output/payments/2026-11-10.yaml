title: 'Euro area VoP coverage; UK benefits surveillance dropped; PSD3 compliance
  looms

  '
social_post: 'Euro area verification of payee nears full coverage, the UK quietly
  drops open banking benefits surveillance, and PSD3''s compliance clock is ticking.
  Today''s briefing: {link}

  '
stories:
- headline: Most euro area payment providers now respond to verification of payee
    checks
  standfirst: The instant payments regulation's verification of payee mandate is being
    met across most of the euro area, though gaps remain in smaller markets.
  body: 'The majority of euro area payment service providers are now answering verification
    of payee requests, according to data reported by The Paypers. The figures indicate
    that the mechanism, which matches a payee''s name to their IBAN before a transfer
    is executed, has reached broad operational coverage ahead of the regulation''s
    full enforcement timeline.


    Coverage varies by market. Larger euro area economies appear to have achieved
    near-complete participation, while some smaller or more recently integrated markets
    still show gaps. The data provides the first clear picture of how far the industry
    has come since the instant payments regulation mandated the service, and where
    remediation work remains.


    The practical question is now shifting from whether providers can answer checks
    to how accurately they do so. Persistent matching errors in IBAN-name verification
    have been a recurring concern, and the quality of responses will matter as much
    as their availability once enforcement intensifies.'
  editorial_note: Follows up on earlier coverage of verification of payee delays and
    matching errors with new data on actual euro area coverage levels, advancing the
    story from policy to implementation.
  sources: '[Most euro area payment providers now answer VoP checks, data shows](https://thepaypers.com/payments/news/most-euro-area-payment-providers-now-answer-vop-checks-data-shows)
    — The Paypers'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens with 'Coverage data suggests' when the headline names the subject
      (euro area payment providers). Per rule [1], the standfirst should open with
      the substantive point or action, not a vague scene-setter. Rewrite to lead with
      the concrete finding — eg, 'The instant payments regulation's verification of
      payee mandate is being met across most of the euro area, though gaps remain
      in smaller markets.'
    - 'Body text: ''earlier reporting flagged'' uses vague temporal reference. Per
      rule on vague temporal references, avoid ''earlier'' without specifics. Either
      provide a specific date/period or restructure without temporal hedging.'
    - 'Body text: ''For payment service providers and their compliance teams, the
      practical question is shifting from whether they can answer checks to how accurately
      they do so.'' This frames the paragraph around relevance to a specific audience
      using a prefatory clause. Per the rule against ''For European payments professionals…''
      constructions, state the substantive point directly without audience-address
      framing.'
  verification:
