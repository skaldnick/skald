title: 'Affirm buys Ratepay; Klarna rebuilds open banking API; Mastercard enters mortgage
  data

  '
social_post: 'Affirm picks up Nexi''s Ratepay to crack the German market, Klarna rebuilds
  its open banking API from scratch, and Mastercard pushes open finance into mortgages.
  Today''s briefing: {link}

  '
stories:
- headline: Bank of England sets design direction for UK retail payments overhaul
  standfirst: A layered architecture built on ISO 20022, settling in central bank
    money and supporting payment types from account-to-account at point of sale to
    agentic payments, will form the blueprint for the system that replaces Faster
    Payments and Bacs.
  body: 'The Bank of England has outlined prospective design proposals for the next-generation
    retail payments infrastructure that will succeed the clearing and messaging layers
    behind Faster Payments and Bacs. The Retail Payments Infrastructure Board (RPIB),
    chaired by the Bank, published its response to a June consultation on November
    4, drawing on 121 submissions from banks, fintechs, infrastructure providers,
    merchants and consumer groups.


    Respondents broadly supported the proposed direction, including a single modular
    architecture, settlement in central bank money and a phased migration that manages
    disruption across the wider ecosystem. Some questioned whether alternatives to
    central bank money settlement should be available for blockchain-based payments
    and whether all retail transactions, including certain tokenised deposits, would
    need to clear through the new infrastructure. The Bank indicated that most product-level
    arrangements could continue to settle on a prefunded net basis, with more frequent
    settlement cycles now technically feasible following its real-time gross settlement
    renewal programme.


    The response also confirmed that the infrastructure should support new payment
    types identified by respondents, including account-to-account payments at point
    of sale, payments between different forms of money, alias-based instant payments,
    agentic payments and embedded finance. Co-creation work between the Bank and industry
    began this month, with the RPIB due to hand over a completed blueprint to an industry-owned
    delivery company in spring 2027.'
  editorial_note: 'This advances a continuing story — the UK retail payments infrastructure
    consultation was covered on June 26 when it launched. The November 4 response
    is a genuinely subsequent stage: the consultation has closed, 121 responses have
    been assessed, prospective design proposals have been identified, and a timeline
    for co-creation and blueprint handover has been set. Written from the Bank of
    England''s primary publication.'
  sources: '[Response to the RPIB consultation on the Design of the Future Retail
    Payments Infrastructure](https://www.bankofengland.co.uk/paper/2026/cp/response-to-the-rpib-consultation)
    — Bank of England'
