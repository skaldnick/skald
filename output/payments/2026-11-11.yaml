- headline: Klarna prepares XS2A v2 to replace its legacy open banking API
  standfirst: The rebuilt API signals a shift from compliance-driven open banking
    infrastructure toward a platform designed for commercial scale and reliability.
  body: 'Klarna is preparing the second version of its XS2A open banking API, which
    will replace the legacy interface that has underpinned its account information
    and payment initiation services across Europe. The new API is designed to address
    long-standing reliability and developer experience shortcomings in the original
    platform.


    Klarna''s open banking infrastructure, which originated from its 2014 acquisition
    of SOFORT and was later consolidated under its Kosma unit launched in March 2022,
    serves as the connectivity layer for third parties accessing bank data and initiating
    payments. The original XS2A API was built primarily to meet PSD2 compliance obligations,
    and its architecture reflects that origin. A ground-up rebuild suggests Klarna
    sees open banking connectivity as a commercial product line, not merely a regulatory
    obligation.


    The timing aligns with broader industry moves to professionalise open banking
    infrastructure ahead of PSD3. As the European Commission prepares to extend data-sharing
    obligations and tighten API performance standards, providers with modern, scalable
    interfaces will be better positioned to compete for both fintech and bank clients.'
  editorial_note: Klarna rebuilding its core open banking API is a meaningful infrastructure
    development, reflecting the shift from compliance-era APIs to commercial-grade
    platforms as PSD3 approaches.
  sources: '[Klarna prepares XS2A v2 to replace its legacy open banking API](https://thepaypers.com/fintech/news/klarna-prepares-xs2a-v2-to-replace-its-legacy-open-banking-api)
    — The Paypers'
