- headline: Mastercard integrates open finance data into mortgage lending via Tidalwave
  standfirst: The partnership extends open finance capabilities into the mortgage
    origination process, where permissioned bank data could displace manual income
    verification.
  body: 'Mastercard is integrating its open finance data capabilities into Tidalwave''s
    mortgage platform, giving lenders access to permissioned consumer financial data
    during the origination process. The partnership is aimed at replacing manual document-based
    income and expenditure checks with real-time bank data.


    Mortgage lending has been slower than consumer credit to adopt open banking data,
    partly because of the higher regulatory burden around affordability assessments
    and partly because the existing broker-led process is deeply entrenched. The UK''s
    Financial Conduct Authority (FCA) published a consultation on mortgage lending
    rule reforms on June 9, and a separate open finance policy sprint the same week
    explored how bank data could support affordability checks, but lender adoption
    has remained limited.


    The payments company has been building its open finance business as a distinct
    commercial line since its acquisition of Finicity, and this partnership extends
    that strategy into one of the largest consumer lending segments. The move follows
    the open finance taskforce of the FCA identifying mortgage origination as a priority
    use case, and positions Mastercard alongside credit reference agencies as a data
    intermediary in the underwriting chain.'
  editorial_note: Extends the open finance narrative into a major lending vertical,
    following the FCA's earlier signals on mortgage affordability. Mastercard's positioning
    as a data intermediary in mortgage origination has competitive implications for
    incumbents.
  sources: '[Mastercard, Tidalwave bring Open Finance to mortgages](https://thepaypers.com/fintech/news/mastercard-and-tidalwave-partner-on-open-finance-for-mortgage-lenders)
    — The Paypers'
