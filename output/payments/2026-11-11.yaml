- headline: Bottomline adds stablecoin payments to its corporate treasury platform
  standfirst: USDC-based cross-border payments through an established corporate treasury
    platform mark a step toward stablecoin normalisation in mainstream B2B payment
    workflows.
  body: 'Bottomline has completed cross-border stablecoin payments through its Global
    Payments Hub and Cash Management platform using Circle''s USDC. The integration
    allows corporate treasury teams to initiate and settle cross-border payments in
    stablecoins alongside conventional fiat rails within the same platform.


    The distribution channel matters more here than the technology. Bottomline''s
    platform is used by banks and corporates for high-volume payment processing, and
    embedding stablecoin settlement within that workflow removes the need for separate
    crypto-native infrastructure. It follows a pattern that has emerged across the
    payments industry over the past year, where established platforms such as Mastercard
    and Visa have added stablecoin settlement options to existing merchant and bank
    networks.


    Settlement speed and cost on specific corridors where correspondent banking remains
    slow and expensive provide the practical appeal. Whether adoption follows will
    depend on counterparty willingness to receive stablecoin-denominated payments
    and on the regulatory treatment of USDC in recipient jurisdictions, particularly
    after its designation as the EU''s first significant e-money token under MiCA.'
  editorial_note: Stablecoin settlement reaching established corporate treasury platforms
    represents a meaningful distribution milestone, distinct from crypto-native announcements.
    The USDC-MiCA context adds European regulatory relevance.
  sources: '[Bottomline brings USDC stablecoin payments into platform](https://www.finextra.com/pressarticle/111632/bottomline-brings-usdc-stablecoin-payments-into-platform?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
