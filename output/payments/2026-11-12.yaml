- headline: Bank of Finland ties digital euro to European economic security
  standfirst: A speech by the Bank of Finland frames payment infrastructure independence,
    including the digital euro and instant payments, as essential to Europe's strategic
    resilience.
  body: 'Olli Rehn, governor of the Bank of Finland, is framing European payment infrastructure
    autonomy as a core element of economic security. Speaking on strategic resilience
    in Finland and Europe, Rehn argued that the digital euro and the instant payments
    regulation together represent the means by which Europe can reduce its dependence
    on non-European payment networks.


    The speech echoes themes raised by the Bank of Finland in May 2026, when the central
    bank framed European payment autonomy as a geopolitical imperative, and by the
    French Banking Federation in July. Rehn''s intervention adds weight at a moment
    when the European Parliament has advanced the digital euro legislation to final
    negotiations and when the ECB has selected network service providers for the platform.
    The consistent framing from Nordic, Southern European and now Finnish central
    bankers suggests a durable political consensus behind the sovereignty argument.


    Rehn cautioned that economic security should not become a pretext for protectionism,
    a nuance that distinguishes his position from more hawkish interventions elsewhere.
    The speech positions instant payments infrastructure and the digital euro as complements
    rather than competitors to private-sector innovation, a framing that aligns with
    the ECB''s own messaging under Piero Cipollone, the executive board member responsible
    for the digital euro.'
  editorial_note: Reinforces the European payment sovereignty narrative at a critical
    legislative moment, with a notable Nordic voice adding to the consensus ahead
    of final digital euro negotiations.
  sources: '[Economic Security and Strategic Resilience in Finland and in Europe](https://www.suomenpankki.fi/en/news-and-topical/speeches-and-interviews2/2026/economic-security-and-strategic-resilience-in-finland-and-in-europe/)
    — Suomen Pankki'
  style_check:
    compliant: false
    warnings:
    - 'Body opening: ''Olli Rehn, governor of the Bank of Finland, has delivered a
      speech'' — uses ''has delivered'' (simple past with perfect aspect) rather than
      preferred ''is delivering'' (present continuous) for a newly announced speech.
      Rule: ''Prefer the present continuous tense ("is partnering") over the simple
      present ("has partnered") when describing a newly announced or ongoing arrangement.'''
    - 'Body paragraph two: ''when it framed'' — should be ''when the Bank of Finland
      framed'' on second reference or use ''the central bank framed'' rather than
      ''it'' to avoid unclear pronoun reference after multiple organisations mentioned.'
    - 'Body paragraph three: ''under Piero Cipollone'' — missing title/context on
      first reference to individual. Rule requires ''Nikhil Rathi, chief executive
      of the Financial Conduct Authority (FCA)'' style introduction with name leading,
      title following.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
