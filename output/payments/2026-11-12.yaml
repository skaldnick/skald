- headline: Deutsche Bank and Ant map agentic AI roadmap for wholesale banking
  standfirst: A joint research report identifies institutional treasury, cross-border
    payments and trade finance as the domains where autonomous AI agents could first
    reshape wholesale banking operations.
  body: 'Deutsche Bank and Ant Digital Technologies have published a joint research
    report setting out how agentic AI could be integrated into wholesale banking.
    The report identifies three priority domains: institutional treasury management,
    cross-border payments and trade finance, each characterised by high volumes of
    structured data and repetitive decision-making that lend themselves to autonomous
    processing.


    European banks are moving from pilots to production deployments of agentic payments.
    Credit Agricole completed France''s first production agentic payment in June,
    and ING, Worldline and Mastercard ran Europe''s first agentic transaction the
    same month. Deutsche Bank''s report focuses on the wholesale side, where operational
    complexity and value per transaction are both higher.


    The report frames agentic AI less as a consumer-facing novelty and more as a back-office
    transformation tool. The wholesale emphasis suggests that the near-term commercial
    case for agentic AI in banking may lie in cost reduction and speed improvements
    on existing workflows rather than in new product categories.'
  editorial_note: A major European bank publishing a detailed agentic AI roadmap for
    wholesale payments signals that the technology is moving from concept to implementation
    planning at tier-one institutions.
  sources: '[Deutsche Bank and Ant set out roadmap for integrating agentic AI into
    wholesale banking](https://www.finextra.com/newsarticle/48740/deutsche-bank-and-ant-set-out-roadmap-for-integrating-agentic-ai-into-wholesale-banking?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Standfirst opens by naming the organisations also named in the headline (''Deutsche
      Bank and Ant''), violating rule [1]. Should open with substantive point: ''A
      joint research report identifies institutional treasury...'' rather than attributing
      the identification to the named organisations.'
    - Body paragraph two uses 'The report arrives as' as a vague temporal opener and
      contains 'Deutsche Bank's contribution here is notable for focusing on the wholesale
      side' which violates the rule against framing significance explicitly. Rewrite
      to state the substantive point directly without announcing notability.
    - Body paragraph three opens with 'For payments professionals, the report frames
      agentic AI...' which violates the rule against framing by audience address.
      Remove this construction and state the point directly.
    - Editorial note should not be included in the copy check output as it is editorial
      guidance only, not copy to be checked. However, if treated as part of the piece,
      it contains redundant framing of significance ('signals that the technology
      is moving') which should be stated more directly.
  verification:
    verified: true
    stale: false
