    - Editorial note left unchanged as it is editorial guidance, not body copy.
- headline: Revolut adds Uber to its growing European account-to-account payments
    network
  standfirst: The integration across more than 25 markets follows similar deals with
    Just Eat, Glovo, Booking.com and Amazon, turning Revolut Pay into a proprietary
    challenger to card networks at checkout.
  body: 'Revolut is integrating Revolut Pay as a native checkout option on Uber and
    Uber Eats across the UK and Europe, giving more than five million shared customers
    an account-to-account alternative to card payments. Customers authorise each transaction
    via biometric authentication in the Revolut app, bypassing card details entirely.
    Revolut claims an average authorisation rate of 98.5% and is using a promotional
    RevPoints multiplier, running from November 11 to January 6, 2027, to drive adoption.


    The deal is one of a series that together amount to a distribution strategy: Revolut
    Pay is now embedded in the checkout flows of Just Eat, Glovo, Booking.com and
    Amazon across European markets. For Uber, the appeal is lower payment costs and
    fewer failed transactions. For Revolut, each integration extends its acquiring
    footprint into high-frequency consumer spending categories without needing the
    kind of broad merchant acceptance that open banking-based pay-by-bank services
    have struggled to achieve.


    The approach diverges from the open banking model. Rather than relying on standardised
    APIs and bank-initiated payment flows, Revolut Pay operates as a closed-loop system
    routed through its own app and accounts. The commercial question is whether rewards-driven
    adoption persists once promotional incentives taper, and whether the model scales
    beyond Revolut''s existing customer base.'
  editorial_note: 'This is a vendor announcement, but the broader pattern is editorially
    significant: Revolut is systematically embedding its proprietary A2A payment method
    across Europe''s largest consumer platforms, building a parallel checkout network
    that competes with both card schemes and open banking-based pay-by-bank. It is
    the accumulation of deals (Just Eat, Glovo, Booking.com, Amazon, now Uber across
    25+ markets) that makes this newsworthy, not the individual partnership. Not previously
    covered in the briefing.'
  sources: '[Uber adds Revolut Pay in big boost for A2A payments](https://paymentexpert.com/2026/11/11/uber-revolut-pay-boost-a2a-payments/)
    — Payment Expert'
