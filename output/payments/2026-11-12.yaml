title: 'Commercial VRP adoption; Deutsche Bank agentic AI; DWP drops open banking
  checks

  '
social_post: 'Commercial VRPs edge toward everyday payments, Deutsche Bank maps agentic
  AI for wholesale banking, and the UK government quietly drops its open banking benefits
  surveillance plan. Today''s briefing: {link}

  '
stories:
- headline: Commercial VRP expands beyond subscriptions toward everyday payments
  standfirst: Industry leaders at Open Banking Expo flagged bill payments, e-commerce
    and account top-ups as the next growth areas for commercial VRP, with adoption
    now tied to the UK Payments Initiative's ability to bring banks beyond the original
    mandated providers on board.
  body: 'Payments specialists speaking at Open Banking Expo UK and Europe 2026 outlined
    how commercial variable recurring payments (VRP) are entering a new adoption phase,
    with use cases extending into utility bill payments, retail e-commerce and investment
    account top-ups. Panellists pointed to recent live deployments, including InvestEngine''s
    reported 98% success rate and Modulr''s launch under the UK Payments Initiative,
    as evidence that the infrastructure is now mature enough for broader merchant
    adoption.


    The discussion highlighted that instant settlement and lower transaction costs
    give commercial VRP a structural advantage over card-on-file for recurring but
    variable-amount payments. However, speakers acknowledged that consumer awareness
    remains low and that merchant integration requires effort to match the frictionless
    experience card networks offer.


    The conversation also touched on the role of the UK''s new domestic payments scheme
    in driving adoption. With GoCardless and Moneyhub already participating in the
    UK Payments Initiative, commercial VRP has a distribution channel that did not
    exist six months ago. Whether banks beyond the original mandated providers will
    support commercial VRP voluntarily remains the open question for the product''s
    trajectory.'
  editorial_note: Advances the commercial VRP story beyond individual launches to
    an industry-wide assessment of readiness and use cases, relevant to product teams
    evaluating pay-by-bank strategies.
  sources: '[Commercial VRP approaches wider adoption as industry highlights new payment
    opportunities](https://www.openbankingexpo.com/news/commercial-vrp-approaches-wider-adoption-as-industry-highlights-new-payment-opportunities/)
    — Openbankingexpo'
  style_check:
