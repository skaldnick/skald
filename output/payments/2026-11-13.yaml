- headline: Germany's three largest banking groups pool fraud data in new joint venture
  standfirst: A shared platform for cross-institutional fraud intelligence positions
    Germany's banking sector ahead of incoming EU requirements on payment fraud data
    sharing.
  body: 'Commerzbank, Deutsche Bank and the German Savings Banks Association (DSGV)
    are establishing a joint venture to let financial institutions exchange fraud
    intelligence securely and in compliance with data protection rules. The platform''s
    first application will cover phishing, investment fraud, merchandise fraud and
    romance scams, with plans to extend to broader financial crime prevention over
    time. The venture intends to open its services to other banks and obliged entities.


    Bernd Spalt, chief risk officer at Commerzbank, said financial crime is becoming
    increasingly professional and does not stop at institutional boundaries. Joachim
    Schmalzl, executive board member of DSGV, described the initiative as putting
    fraud prevention on a broader footing. The platform uses privacy-preserving techniques
    that allow institutions to compare selected fraud indicators without disclosing
    all underlying data.


    The venture reflects a shift in the European regulatory landscape. Forthcoming
    EU payments rules are expected to require institutions to share information to
    tackle fraud and money laundering, and the three founding partners have already
    been piloting cross-institution data matching through the state-backed EuroDaT
    data trustee in Hesse since June 2025. The joint venture reads as the commercial
    scaling of that experiment, and its timing positions the partners well ahead of
    obligations that will apply across the bloc.'
  editorial_note: 'Genuinely new story announced November 11, not previously covered.
    Significant because it is the first major cross-pillar fraud data-sharing venture
    among German banks, anticipating EU-wide requirements under the evolving PSD3/PSR
    framework and the EU''s anti-money laundering package. The story has clear European
    payments relevance: it illustrates how banks are building shared infrastructure
    ahead of regulatory mandates, and connects to the EPC''s own consultation on pan-European
    fraud data-sharing (covered September 11). Source is FinTech Futures, with Deutsche
    Bank''s own press release and Financex Magazine providing additional detail on
    the safeAML pilot and regulatory context.'
  sources: '[Commerzbank, Deutsche Bank and DSGV form anti-financial crime JV](https://www.fintechfutures.com/financial-crime-fraud-prevention/commerzbank-deutsche-bank-dsgv-anti-financial-crime-joint-venture)
    — FinTech Futures'
