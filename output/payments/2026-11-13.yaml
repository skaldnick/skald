- headline: Uber adds Revolut Pay as account-to-account payments enter mobility
  standfirst: Revolut's account-to-account payment method is expanding into ride-hailing
    and delivery, testing whether pay-by-bank can displace cards in high-frequency,
    low-friction use cases.
  body: 'Uber is adding Revolut Pay as a payment option across its ride-hailing and
    delivery platforms, giving Revolut''s 80 million customers the ability to pay
    directly from their Revolut accounts. The integration spans Uber''s operations
    across roughly 70 countries, though the account-to-account payment flow will be
    most immediately relevant in European markets where Revolut has its largest customer
    base.


    Mobility and delivery represent a demanding test case for account-to-account payments.
    Transactions are frequent, often small-value, and occur in time-sensitive contexts
    where any friction at checkout is commercially costly. Card payments have dominated
    these use cases precisely because tokenised cards eliminate the need for active
    authentication on each transaction. Revolut Pay will need to replicate that seamlessness
    to shift meaningful volume away from card rails.


    The deal follows Revolut''s earlier addition of Uber to its European account-to-account
    payments network, reported in November. This broader partnership formalises and
    extends that relationship across Uber''s global footprint.'
  editorial_note: This is a meaningful expansion of the previously covered Revolut-Uber
    relationship, with Uber now formally adding Revolut Pay as a payment option across
    its global platform. High-frequency mobility payments are a commercially significant
    test for account-to-account adoption beyond e-commerce.
  sources: '[Uber adds Revolut Pay as A2A payments push into mobility](https://fintech.global/2026/11/13/uber-adds-revolut-pay-as-a2a-payments-push-into-mobility/)
    — FinTech Global | [Uber adds Revolut Pay option](https://www.finextra.com/pressarticle/111658/uber-adds-revolut-pay-option?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Headline and standfirst both open with the same subject and action ('Uber adds
      Revolut Pay' / 'The partnership extends Revolut's'). Rule requires varying the
      opening in at least one element to avoid identical framing.
    - Standfirst uses 'account-to-account' spelled out, but headline uses 'account-to-account'
      — this is consistent, not a violation. However, the rule on spelling out non-standard
      abbreviations is being followed correctly here.
    - Body text uses 'account-to-account' repeatedly without abbreviation (A2A), which
