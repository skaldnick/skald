title: 'Kuwait open banking; Visa stablecoin settlement; Uber adds Revolut Pay

  '
social_post: 'Kuwait goes live with open banking, Visa brings Western Union''s stablecoin
  onto its settlement network, and Uber''s Revolut Pay deal extends A2A into mobility.
  Today''s briefing: {link}

  '
stories:
- headline: Kuwait launches open banking framework as Gulf adoption widens
  standfirst: A fourth Gulf state now has a live open banking regime, intensifying
    competitive pressure on European providers such as Wero and reinforcing the region's
    emergence as a rival regulatory bloc.
  body: 'The Central Bank of Kuwait (CBK) has published its open banking regulatory
    framework, setting out the security, technical and operational standards that
    will govern data-sharing between banks and licensed third parties. The framework
    covers account information services and is expected to extend to payment initiation
    in subsequent phases.


    Kuwait joins Bahrain, Saudi Arabia and the UAE in establishing a formal open banking
    regime, though each market has taken a different approach to scope and pace. Bahrain
    made open banking mandatory in 2020; Saudi Arabia followed in 2022; the UAE''s
    framework went operational in 2025, producing licensed players including Tarabut
    and Lean Technologies.


    The Gulf''s collective momentum on open banking contrasts with the slower rollout
    in parts of Europe and signals growing competitive pressure on incumbents across
    the region to open their infrastructure. The Gulf now represents four live markets
    with broadly aligned regulatory intent, a concentration that European open banking
    providers with cross-border ambitions cannot afford to ignore.'
  editorial_note: A new national open banking framework going live is a material regulatory
    development; the Gulf is becoming a significant open banking bloc and the pattern
    is relevant to European providers eyeing international expansion.
  sources: '[HUMAIN''s Saudi AI fund, Kuwait goes live with open banking](https://www.fwdstart.me/p/humain-saudi-ai-fund-kuwait-goes-live-with-open-banking)
    — FWDStart | [Central Bank of Kuwait issues Open Banking regulatory framework](https://www.openbankingexpo.com/news/central-bank-of-kuwait-issues-open-banking-regulatory-framework/)
    — Openbankingexpo'
