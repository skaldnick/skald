- headline: Visa brings Western Union stablecoin onto its settlement network
  standfirst: The integration marks a further step in the network's strategy to support
    stablecoins as native settlement assets alongside traditional currencies.
  body: 'Visa is working with Anchorage Digital to support select stablecoins as settlement
    assets on its network, beginning with Western Union''s USDPT token. The arrangement
    allows USDPT to be used for settlement between participants on Visa''s network
    rather than requiring conversion to fiat before funds move.


    Visa has been building out its stablecoin infrastructure over the past year, having
    previously integrated BVNK into its platform and participated in Singapore''s
    stablecoin settlement pilot. Adding a remittance-focused stablecoin from Western
    Union is a different proposition: it connects Visa''s settlement rails to a token
    designed specifically for cross-border money movement, a segment where stablecoins
    have been gaining traction as an alternative to correspondent banking.


    The stablecoin landscape in Europe is meanwhile being shaped by the MiCA framework,
    under which Circle''s USDC was designated the first significant e-money token
    in October. European payment firms evaluating stablecoin settlement options now
    face a network effects question: whether scheme-level integration by Visa and
    Mastercard will consolidate the market around a small number of tokens or whether
    the proliferation of issuer-specific coins will fragment it.'
  editorial_note: Visa expanding stablecoin settlement to include a remittance-specific
    token from Western Union is a meaningful development in how card networks are
    positioning themselves in the stablecoin infrastructure layer, with direct implications
    for European settlement and cross-border payments.
  sources: '[Visa and Anchorage Digital bring Western Union stablecoin to settlement
    network](https://www.finextra.com/newsarticle/48752/visa-and-anchorage-digital-bring-western-union-stablecoin-to-settlement-network?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
