- headline: Bank of England confirms industry support for UK retail payments redesign
  standfirst: A total of 121 consultation responses back the core design direction
    set out earlier this year, moving the Retail Payments Infrastructure Board closer
    to its next phase.
  body: 'Victoria Cleland, the Bank of England''s executive director for payments,
    has confirmed that all 121 responses to the central bank''s consultation supported
    the proposed design direction for the UK''s next-generation retail payments infrastructure.
    The consultation, which followed the Retail Payments Infrastructure Board''s (RPIB)
    design paper published in the summer, asked whether the outlined approach struck
    the right balance between modernisation and continuity.


    The RPIB, which includes industry participants alongside the UK''s Financial Conduct
    Authority and Payment Systems Regulator as observers, is now expected to move
    into more detailed specification work. The breadth of support removes a significant
    procedural hurdle, though the harder questions around technical architecture,
    migration timelines and funding remain ahead.


    The confirmation comes as the UK government consults separately on modernising
    payments regulation more broadly, including the future roles of Pay.UK and the
    PSR. The two workstreams are running in parallel but will need to converge: the
    regulatory framework under which a new infrastructure operates matters as much
    as its design.'
  editorial_note: This is a genuinely new development advancing the previously covered
    UK retail payments consultation story (June 26 and November 11). The earlier coverage
    reported the Bank of England setting a design direction; this story reports the
    consultation outcome — 121 responses backing that direction — which is a subsequent
    stage. Source is Financial News reporting Cleland's confirmation.
  sources: '[Bank of England''s Cleland says 121 consultation replies back UK payments
    core design](https://www.financial-news.co.uk/bank-of-englands-cleland-says-121-consultation-replies-back-uk/)
    — Financial-news'
