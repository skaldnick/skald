- headline: Swift finds domestic delays consume 80% of cross-border payment journey
    times
  standfirst: New data shifts attention from interbank messaging speed to domestic
    processing bottlenecks, with implications for Europe's instant payments infrastructure
    and the G20's 2027 target.
  body: 'Swift has published its latest Spotlight on Speed report, revealing that
    half of cross-border payments on its network reach recipient banks within 40 seconds
    and 75% arrive within 10 minutes. The interbank leg of the journey is now ahead
    of the G20''s target for one-hour end-to-end processing by 2027. But the report
    makes clear that speed gains in cross-border messaging are being undermined by
    what happens next: the last mile, from receiving institution to beneficiary account,
    accounts for around 80% of total processing time. In a third of the 40 receiving
    markets analysed, median last-mile processing sits at around one hour.


    Thierry Chilosi, Swift''s chief business officer, said the challenge now is to
    "tackle the inconsistency that we see in the last mile in markets around the world".
    Swift''s retail payments framework, launched in June with more than 100 banks,
    has demonstrated end-to-end processing in seconds on some corridors, including
    Turkey to Spain in 15 seconds and Australia to India in 37 seconds. These routes
    use one-leg-out arrangements that connect international transfers directly into
    domestic instant payment systems.


    The findings carry practical weight for European banks and payment providers.
    Europe''s investment in instant payments infrastructure through TIPS and the instant
    payments regulation was designed in part to eliminate precisely these domestic
    delays. The report suggests that markets which have not modernised their domestic
    crediting processes risk becoming bottlenecks in an otherwise fast cross-border
    system, regardless of how quickly interbank messaging operates.'
  editorial_note: This story was published on November 13 and has not been previously
    covered in the briefing. It is based on Swift's own primary source report. The
    story is relevant to European payments professionals because it directly addresses
    the last-mile crediting problem that Europe's SEPA instant and TIPS infrastructure
    is designed to solve. The CD&R/Global Payments withdrawal (November 12) was also
    considered but the initial pursuit was already covered on November 2, and the
    withdrawal — while a genuine follow-up — is primarily a US private equity financing
    story rather than a European payments development.
  sources: '[Unlocking last mile speed in cross-border payments](https://www.swift.com/insights/news/unlocking-last-mile-speed-cross-border-payments)
    — Swift'
