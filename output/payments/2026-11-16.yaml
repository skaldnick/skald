- headline: Planky raises €6.9m to build AI credit decisioning on open banking data
  standfirst: A pivot from open banking analytics toward real-time AI-powered lending
    decisions reflects broader market convergence between open banking data access
    and automated credit infrastructure.
  body: 'Planky is raising €6.9 million to transform its open banking analytics platform
    into a real-time AI credit decisioning layer for lenders and digital platforms.
    The funding positions the company at the intersection of two trends reshaping
    European lending: cashflow-based underwriting using open banking data and AI-driven
    automation of credit decisions.


    The raise sits alongside a string of similar moves in recent months. Experian
    launched a consumer reporting agency for cashflow-based underwriting in October,
    Plaid released AI models for lending decisions the same month, and PayPoint completed
    its acquisition of open banking credit data firm AperiData in June. The pattern
    suggests open banking''s role in lending is shifting from supplementary data source
    to primary decisioning input.


    For banks and payment providers, the competitive implication is that the infrastructure
    connecting account data to credit decisions is becoming a distinct product category.
    Firms that treat open banking APIs as compliance obligations rather than commercial
    assets risk ceding the credit decisioning layer to specialist intermediaries.'
  editorial_note: ''
  sources: '[AI in Finance – News on AI in Banking & Payments](https://ffnews.com/ai-in-finance)
    — Ffnews'
  style_check:
    compliant: false
    warnings:
    - Headline uses '€6.9m' but body text uses '6.9 million euros' — inconsistent
      formatting of the same figure. Per house style, headlines should abbreviate
      to 'm' (€6.9m) and body should spell out in full (6.9 million euros), which
      is correct, but the headline abbreviation should match the body's currency style.
    - 'Standfirst opens with ''The round funds a pivot'' — this violates the rule
      against opening the standfirst by naming/describing the organisation''s action
      when the headline already identifies Planky. The standfirst should open with
      the substantive point or consequence, not repeat the funding action. Consider:
      ''The pivot funds a shift toward real-time AI-powered lending decisions…'' or
      lead with the market implication.'
    - Body text uses 'Planky has raised 6.9 million euros' in the opening sentence
      — this directly repeats the headline's core claim ('Planky raises €6.9m'). Per
      house style, the body's opening must be strong and direct, but avoid weakening
      it to sidestep repetition with the headline; instead, revise the standfirst.
      The body opening is appropriately strong here, so the issue is the standfirst
      repeating the funding action rather than establishing context.
    - Editorial note states 'While a single funding round, this illustrates the broader
      convergence...' — this is a scene-setter that hedges significance before making
      the substantive point. Per house style, do not include editorial notes explaining
      the newsworthiness or significance of a story; report the facts directly. This
      note should be removed.
    - 'Body text: ''Planky has raised 6.9 million euros'' — should use present continuous
      per house style for newly announced arrangements. Correct to: ''Planky is raising
      6.9 million euros'' to signal currency without implying the action is already
      complete.'
  verification:
    verified: true
    stale: false
    duplicate: false
