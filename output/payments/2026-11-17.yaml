- headline: Digital euro trilogue faces make-or-break round on merchant fees
  standfirst: Merchant fee methodology and business holding limits remain unresolved
    as the Irish EU presidency targets a political agreement on November 18, with
    the ECB's 2029 issuance timeline at stake.
  body: 'EU negotiators are attempting to close a deal on the digital euro regulation
    on November 18 after four months of trilogue talks between the European Parliament,
    the Council and the Commission. The Irish presidency, which chairs the negotiations
    for member states, has set the date as its target for a political agreement. If
    reached, lawyers would finalise the text and both institutions would vote in 2027.
    A miss would push the process into a new Council presidency and jeopardise the
    ECB''s planned 2029 first issuance.


    The central sticking point is how merchant fees are calculated. Both institutions
    want uniform fee caps across the euro area, starting with a transitional model
    and later moving to cost-based charges plus a margin. France is opposing a "no
    worse off" clause sought by Parliament, under which digital euro transaction fees
    would have to be at least as favourable as those for other existing payment types.
    A French finance ministry source said the reference to other payments raises problems
    because it would include domestic European schemes, which charge less than international
    card networks. The two sides also diverge on business holding limits: Parliament
    favours a near-total ban on holdings by legal persons written into the regulation,
    while the Council would leave the matter to the ECB.


    Piero Cipollone, the ECB executive board member leading the digital euro project,
    told Parliament''s economic affairs committee on November 10 that legislative
    delay could postpone introduction beyond 2029 and deepen Europe''s dependence
    on non-EU payment providers. The ECB plans a 12-month pilot starting in the second
    half of 2027 with 36 selected payment service providers, but can only set an issuance
    date after the regulation is adopted.'
  editorial_note: This moves the digital euro story forward from Parliament's July
    2026 vote (previously covered July 10) and the ECB's pilot provider selection
    (covered July 15-16). The new development is the November 18 target date for a
    political deal in trilogue, with specific detail on the unresolved merchant fee
    dispute between France and Parliament. Source is The European Post's analysis
    from November 7, corroborated by Euronews (November 11) and Agence Europe (November
    6).
  sources: '[Merchant Fees Test The Digital Euro Negotiations Ahead Of 18 November](https://theeuropeanpost.eu/research-analysis/merchant-fees-test-the-digital-euro-negotiations-ahead-of-18-november/)
    — The European Post'
