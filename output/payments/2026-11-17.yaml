- headline: Milan court places Revolut under year-long judicial oversight for AML
    failures
  standfirst: The order exposes the gap between rapid customer growth across EU borders
    and the compliance infrastructure needed to support it, with Italy's fifth-largest
    bank by customer numbers found to have filed none of the suspicious transaction
    reports that other banks flagged on the same individuals.
  body: 'A Milan court has placed Revolut Bank UAB''s Italian branch under judicial
    administration for one year after finding that at least 24 individuals under investigation
    or convicted of money laundering and organised crime offences had moved approximately
    €41.9 million through the bank''s accounts between 2021 and 2026. Other banks
    filed 265 suspicious transaction reports on those same individuals over the period;
    Revolut filed none. The court cited "serious deficiencies" in the bank''s anti-money
    laundering controls and appointed two judicial administrators with broad oversight
    and inspection powers.


    Revolut must now implement a 15-point remediation plan, appoint an internal liaison
    officer within five days and submit a detailed compliance action plan within 60
    days. The administrators will file a preliminary report within 30 days and a full
    assessment within 90. The measure is preventive rather than punitive under Italian
    law – Revolut is not under criminal investigation, and its Italian retail and
    commercial services continue to operate normally.


    The ruling follows an €11.5 million fine from Italy''s competition authority in
    April and a separate 2024 inspection by Milan''s Guardia di Finanza into Revolut
    Digital Assets Europe, the entity handling cryptocurrency services for European
    users. With more than five million customers in Italy, Revolut is the country''s
    largest foreign bank by client numbers. The case underscores a recurring tension
    in European financial services: digital banks licensed in one member state and
    operating across the bloc through passporting can grow their customer base far
    faster than their local compliance operations.'
  editorial_note: Selected as a replacement story. This is breaking news from November
    16 – a Milan court placing Revolut's EU banking entity under judicial administration
    for AML failures. It is directly relevant to European payments professionals as
    it touches on cross-border passporting, AML supervision gaps across the EU, and
    the compliance challenges facing fast-scaling digital banks. Not previously covered
    in the briefing.
  sources: '[Exclusive-Italian court places Revolut unit under supervision over money-laundering
    failings](https://live.euronext.com/en/financial-news/exclusive-italian-court-places-revolut-unit-under-supervision-over-money-laundering)
    — Reuters (via Euronext)'
