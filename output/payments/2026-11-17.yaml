- headline: Capital One warns banks are becoming default absorber of online fraud
    losses
  standfirst: Liability frameworks in payments increasingly concentrate fraud costs
    on banks rather than the platforms where fraud originates, a tension sharpened
    by the UK's mandatory reimbursement rules.
  body: 'Capital One has warned that banks are becoming the "default shock absorber"
    for online fraud, bearing losses that originate on platforms and marketplaces
    beyond their control. The argument, made through Open Banking Expo, points to
    a structural imbalance in how fraud liability is distributed across the payments
    chain.


    The warning resonates in the UK context, where the Payment Systems Regulator''s
    mandatory reimbursement regime for authorised push payment fraud has been in force
    since late 2024. Monzo reported an 85% surge in fraud reimbursement costs under
    the regime in the first quarter of 2025, and UK fraud losses have climbed to £1.3
    billion. Banks argue they are absorbing costs for scams that originate on social
    media platforms, online marketplaces and telecommunications networks, none of
    which currently bear equivalent liability.


    The bank''s framing adds a transatlantic voice to a debate that is intensifying
    in both the UK and Europe. The European Commission''s instant payments regulation
    requires verification of payee but does not impose the same reimbursement obligations
    that the UK has adopted. How liability is shared between banks, platforms and
    payment providers remains one of the most contested policy questions in payments
    regulation.'
  editorial_note: Capital One's warning crystallises a live policy debate about fraud
    liability distribution that is directly relevant to both UK mandatory reimbursement
    rules and European instant payments regulation.
  sources: '[Banks becoming ''default shock absorber'' for online fraud, warns Capital
    One](https://www.openbankingexpo.com/news/banks-becoming-default-shock-absorber-for-online-fraud-warns-capital-one/)
    — Openbankingexpo'
  style_check:
    compliant: false
    warnings:
    - Body text uses vague temporal reference 'earlier this year' when discussing
      Monzo's fraud reimbursement costs. Use specific time periods (eg, 'the first
      quarter of 2025') per rule on avoiding vague temporal references.
    - Standfirst opens by naming the substance ('The warning highlights') but the
      headline also names Capital One. Per rule [1], avoid redundant repetition of
      the subject across headline and standfirst. Consider revising the standfirst
      opening to avoid near-duplication of the warning concept.
    - Paragraph beginning 'Capital One's framing adds a transatlantic voice...' uses
      'Capital One' as the grammatical subject after already establishing it in the
      opening sentence of the body. Per the pronoun rule, use a referring expression
      ('The bank') or 'The warning' to avoid mechanical repetition of the proper noun
      within the same section.
