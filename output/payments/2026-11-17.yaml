- headline: Starling founder Anne Boden launches agent-native banking venture Lockwood
  standfirst: The new UK challenger, designed from scratch for AI agents to initiate
    payments within user-set limits, plans to seek an e-money licence in 2027 before
    converting to a full bank.
  body: 'Anne Boden, founder of Starling Bank, is building Lockwood, a current account
    platform designed for customers who delegate spending decisions to AI agents.
    Boden told The Sunday Times the venture would be "built by agents, to serve customers
    that want to use agents, and then be defended by agents". She is self-funding
    the early stage with proceeds from selling her roughly 5% Starling stake.


    Lockwood will offer a free current account but no lending or savings products,
    earning revenue from interest on deposits. It will seek authorisation as an electronic
    money institution in 2027 before converting to a full banking licence, with a
    planned launch in 2028 and a target of one million customers in its first year.
    Boden said she also plans to convene a working party of banks and regulators to
    establish how agentic banking should operate.


    The venture arrives as major UK banks remain reluctant to grant AI agents access
    to customer accounts over concerns about unauthorised transactions. By building
    agent access and transaction controls into the infrastructure from the outset
    rather than retrofitting them, Boden is betting that the next generation of digital
    banking will be shaped by how well institutions accommodate machine-initiated
    payments, not just human ones.'
  editorial_note: New story published November 15-16, not previously covered. Anne
    Boden is a significant figure in UK/European fintech, and the launch of an agent-native
    bank directly connects to the agentic payments theme that has featured prominently
    across the briefing in recent months (JPMorgan blocking agents, Wells Fargo liability
    policy, FCA agentic finance framework, etc). This is not a routine vendor announcement
    — it represents a named, credible founder making a concrete bet on how banking
    infrastructure needs to change for AI agents, at a time when most incumbents are
    still blocking agent access.
  sources: '[Starling founder Anne Boden unveils new agentic AI-focused banking venture
    Lockwood](https://www.fintechfutures.com/fintech-start-ups/starling-founder-anne-boden-unveils-new-banking-venture-lockwood)
    — Fintech Futures'
