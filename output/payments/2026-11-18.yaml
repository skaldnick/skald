    - 'Note: the replacement was also flagged — Headline opens with ''EU''s'' – a
      possessive acronym without the full name established first. Restructure to avoid
      possessive construction with an initialised organisation name.'
    - 'Note: the replacement was also flagged — Body paragraph 1: ''The directive,
      known as CCD2'' – introduces abbreviation in parentheses but CCD2 recurs later
      (''CCD2, a significant EU regulatory event'' in the editorial note), so the
      parenthetical format is correct here, but the phrasing ''known as'' is informal.
      Use standard ''the Consumer Credit Directive (CCD2)'' format on first introduction
      in body.'
    - 'Note: the replacement was also flagged — Body paragraph 2: ''Klarna is restructuring
      its EU offerings, issuing new credit agreements and routing subscriptions through
      reusable credit lines to comply'' – the phrase ''to comply'' at the end is a
      dangling resultative clause introduced without a preposition. Rewrite as ''issuing
      new credit agreements and routing subscriptions through reusable credit lines
      in order to comply'' or use a comma-separated structure.'
    - 'Note: the replacement was also flagged — Body paragraph 3: ''The directive
      landing one week before Black Friday sharpens the operational pressure'' – opening
      with ''The directive landing'' uses a bare participial phrase as the grammatical
      subject. Rewrite as ''The directive''s implementation one week before Black
      Friday sharpens...'' or ''Because the directive lands one week before Black
      Friday, it sharpens...'''
    - 'Note: the replacement was also flagged — Standfirst uses ''CCD2'' without spelling
