- headline: 'TPG nears deal to take payments automation firm Bill Holdings private

    '
  standfirst: 'The potential acquisition would be the latest in a series of private
    equity moves into payments infrastructure, following CD&R''s pursuit of Global
    Payments and Pollen Street''s carve-out of Finastra''s banking unit.

    '
  body: 'TPG is close to agreeing a deal to acquire Bill Holdings, the US payments
    automation company, according to the Financial Times. Bill''s shares rose more
    than 9% on the report. The company, which provides accounts payable, accounts
    receivable and expense management tools primarily for small and mid-sized businesses,
    would be taken private under the deal.


    The acquisition would continue a pattern of private equity firms targeting payments
    infrastructure assets. Clayton, Dubilier and Rice has been pursuing Global Payments,
    while Pollen Street carved out Finastra''s universal banking division earlier
    this year. These deals reflect a view that payments businesses, once consolidated
    and restructured, can generate reliable returns through recurring revenue and
    embedded financial services.


    Bill Holdings processes payments for over 400,000 businesses and had been publicly
    listed since 2019. Its software sits at the intersection of accounting, payments
    and business finance, a segment that has attracted increasing interest from acquirers
    looking to control the workflow around payment initiation rather than just the
    transaction itself.

    '
  editorial_note: 'Fits into a clear pattern of PE consolidation in payments infrastructure
    that European readers are tracking, with direct relevance to competitive dynamics
    for European B2B payments platforms.

    '
  sources: '[TPG closes in on Bill Holdings acquisition - FT](https://www.finextra.com/newsarticle/48774/tpg-closes-in-on-bill-holdings-acquisition---ft?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
