title: 'World Bank stablecoin pilot; TPG eyes Bill Holdings; FDX sets AI data access
  standards

  '
social_post: 'The World Bank is testing stablecoins for development payments with
  Citi and Circle. Plus: TPG nears a Bill Holdings buyout and FDX weighs in on AI
  access to financial data. {link}

  '
stories:
- headline: World Bank tests stablecoins for development payments with Citi and Circle
  standfirst: Dollar-denominated stablecoins could reduce the cost and delay of multilateral
    development disbursements, with a pilot that may set precedents for how public
    institutions use digital money at scale.
  body: 'The World Bank Group is working with Citi and Circle, the issuer of USDC,
    to examine how stablecoins might modernise payments and free up resources for
    development work. The pilot focuses on whether dollar-denominated stablecoins
    can cut the cost and delay of cross-border disbursements that currently flow through
    correspondent banking chains.


    While commercial banks and fintechs have been integrating stablecoins into settlement
    and treasury flows for over a year, multilateral development institutions have
    largely stayed on the sidelines. The World Bank''s direct involvement lends credibility
    to the asset class as a payment rail rather than a speculative instrument.


    The pilot sits at the intersection of two live debates: whether stablecoins can
    compete with instant payment networks for cross-border transfers, and how public-sector
    actors will engage with privately issued digital money. The Bank of Italy''s finding
    that stablecoins offer no cost or speed advantage for remittances makes the World
    Bank''s own assessment worth watching closely.'
  editorial_note: ''
  sources: '[World Bank partners Citi and Circle to test stablecoins for development
    payments](https://www.finextra.com/newsarticle/48780/world-bank-partners-citi-and-circle-to-test-stablecoins-for-development-payments?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
