- headline: Apicunia and PayPoint extend payee verification coverage across Europe
  standfirst: Multichannel name-matching checks are being pushed beyond the UK, where
    confirmation of payee is established, into European markets still building out
    verification of payee under the instant payments regulation.
  body: 'European payee verification is gaining a new cross-border offering as Apicunia
    and PayPoint partner to extend name-matching services across the continent, building
    on PayPoint''s existing confirmation of payee and open banking capabilities in
    the UK. The partnership aims to broaden multichannel verification coverage as
    Europe''s instant payments regulation requires payment providers to offer verification
    of payee checks.


    European adoption of payee verification has been uneven. The European Payments
    Council updated its matching recommendations in October, and most euro area providers
    now respond to verification checks, but coverage gaps remain. A Finextra analysis
    in June found that verification of payee delays were still leaving European instant
    payments exposed to fraud, and a follow-up in October noted that key IBAN errors
    were still being missed a year after the regulation took effect.


    PayPoint acquired open banking verification firm AperiData in June and has been
    building out its data capabilities. The Apicunia partnership extends that effort
    into cross-border payee verification, a segment where few providers currently
    offer comprehensive coverage and where the regulatory mandate is creating commercial
    opportunity.'
  editorial_note: ''
  sources: '[Apicunia and PayPoint extend European payee verification](https://www.finextra.com/pressarticle/111713/apicunia-and-paypoint-extend-european-payee-verification)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Headline and standfirst both open with the same subject and action: ''Apicunia
      and PayPoint extend/widens''. Vary the opening in at least one of these elements
      per rule on varying opening words.'
    - Body opens with 'Apicunia and PayPoint are partnering', which repeats the same
      subject-verb construction as the headline. The body's opening sentence must
      be strong and direct, but restructuring to avoid this mechanical repetition
      would strengthen it — consider leading with the substantive point (the coverage
      expansion or its impact) rather than the partnership announcement itself.
    - Standfirst contains 'earlier this month' which is a vague temporal reference.
      Use the specific date or month name instead per the rule requiring specific
