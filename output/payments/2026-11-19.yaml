- headline: Financial Data Exchange sets standards for AI agent access to bank accounts
  standfirst: A set of consent and API standards governing how AI tools interact with
    consumer financial data addresses a gap that JPMorgan, Wells Fargo and others
    have tried to fill unilaterally.
  body: 'Financial Data Exchange (FDX), the standards body behind much of North America''s
    open banking data-sharing framework, has published guidance on how AI tools should
    access consumer financial data. The intervention addresses growing tension between
    AI platforms seeking bank account connectivity and financial institutions concerned
    about uncontrolled data access.


    Several major US banks have taken divergent positions on AI agent access. JPMorgan
    blocked outside AI agents from accessing customer accounts while permitting read-only
    access through regulated open banking platforms. Wells Fargo made customers liable
    for all AI agent transactions. Citi, PNC and Citizens have adopted similar customer-liability
    positions. FDX''s framework attempts to establish common ground by focusing on
    scoped, revocable API access with explicit consumer consent.


    The standards could influence how European regulators approach the same question.
    The FCA published its own AI review in July with agentic payments in scope, and
    the Euro Banking Association mapped agentic AI''s role in open finance in May.
    As AI assistants from Google and OpenAI gain financial data access through Plaid
    and similar intermediaries, the question of who sets the rules for that access
    is becoming urgent on both sides of the Atlantic.'
  editorial_note: ''
  sources: '[Leading Standards Body Weighs in on How AI Tools Access Financial Data](https://www.globenewswire.com/news-release/2026/11/18/3406052/0/en/leading-standards-body-weighs-in-on-how-ai-tools-access-financial-data.html)
    — Globenewswire'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation (FDX) that is also named in the
      headline. Rule 1 requires opening with the substantive point instead — 'A set
      of consent and API standards governing how AI tools interact with consumer financial
      data addresses a gap that JPMorgan, Wells Fargo and others have tried to fill
      unilaterally' would be stronger.
    - 'Body paragraph two: ''The move comes after several major US banks took divergent
      positions on AI agent access in recent months.'' This opens with ''The move''
      which mirrors the hedging scene-setter pattern. Restructure to lead directly
      with the substantive claim — ''JPMorgan blocked outside AI agents from accessing
      customer accounts while permitting read-only access through regulated open banking
      platforms'' — without the prefatory framing.'
    - Editorial note should be removed entirely per house style rules. Editorial notes
      about missing information or editorial commentary should not be included in
      copy.
    - 'Body paragraph three: ''Euro Banking Association mapped agentic AI''s role
      in open finance earlier this year'' uses the vague temporal reference ''earlier
      this year''. Use a specific date or month instead.'
    - 'Body paragraph three: ''As AI assistants from Google, OpenAI and others gain
      financial data access'' — this uses ''others'' in a way that could signal a
