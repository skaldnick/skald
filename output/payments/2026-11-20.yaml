- headline: Singapore proposes first regulatory protocol for verifying AI agents in
    payments
  standfirst: The "know your agent" framework could set a template for European regulators
    grappling with how to authenticate AI-initiated transactions across open banking
    and instant payment rails.
  body: 'Chia Der Jiun, managing director of the Monetary Authority of Singapore (MAS),
    announced on November 19 that the regulator will develop a common "know your agent"
    protocol enabling banks and payment providers to verify an AI agent''s identity,
    the customer it represents, the authority it has been granted and the limits of
    its mandate. The protocol builds on MAS''s Safeguards for Agentic Finance at Runtime
    framework, published in July and developed with Ant International, Circle, HSBC,
    JPMorgan, Mastercard and Visa among others.


    Chia warned that some users are already handing AI agents their bank login credentials,
    leaving financial institutions unable to determine whether the agent is authorised
    or whether a given transaction falls within its mandate. The protocol is intended
    to give institutions a structured basis for deciding which agent-initiated instructions
    to accept, reject or escalate for human review. MAS is also establishing an agentic
    money sandbox with the Future of Finance Institute to test AI agents using tokenised
    deposits and stablecoins in corporate treasury and payment scenarios.


    The announcement arrives as European regulators work through similar questions.
    The UK''s Financial Conduct Authority published its own agentic finance framework
    in October, while Visa has expanded its Agentic Ready programme to more than 85
    European acceptance participants. MAS''s protocol, if adopted, would give the
    industry its first standardised verification layer for agent-initiated transactions,
    a problem no jurisdiction has yet solved at the protocol level.'
  editorial_note: Selected because MAS is the first regulator globally to propose
    a formal identity verification protocol for AI agents in financial services, directly
    relevant to the European agentic payments work underway at the FCA, ECB, Visa
    and Mastercard. The story is from November 19, 2026 (yesterday). It is not a duplicate
    of any previously covered story.
  sources: '["Advancing the Future of Finance: From Foundation to Scale" - Keynote
    Address by Mr Chia Der Jiun, Managing Director, Monetary Authority of Singapore,
    at the Singapore FinTech Festival 2026 on 19 November 2026](https://www.mas.gov.sg/news/speeches/2026/keynote-address-by-md-at-the-singapore-fintech-festival-2026)
    — Monetary Authority of Singapore'
