- headline: Alipay+ connects global e-wallets to Brazil's Pix instant payments network
  standfirst: The integration links more than 50 digital wallets to Latin America's
    largest instant payments system, testing whether wallet-to-domestic-rail interoperability
    can work at cross-border scale.
  body: 'Ant International has connected Alipay+, its cross-border wallet gateway,
    to Pix, Brazil''s national instant payment system. The integration allows users
    of more than 50 digital wallets and banking apps linked to the Alipay+ network
    to make payments at Pix-accepting merchants in Brazil.


    Connecting foreign digital wallets directly to domestic instant payment rails,
    rather than routing cross-border retail payments through card networks, is a model
    that European policymakers and scheme operators are watching closely. The European
    Payments Initiative (EPI), whose Wero wallet is building its own cross-border
    capability, faces analogous design questions about interoperability with non-European
    payment instruments.


    Nearly 80 billion transactions were processed by Pix in 2025, making it one of
    the world''s most heavily used instant payment systems. For Ant International,
    the connection extends the commercial reach of its wallet network into a market
    where digital payments adoption is already high. For European observers, the question
    is whether similar integrations between wallet platforms and domestic instant
    payment schemes will emerge as the cross-border retail payments model matures.'
  editorial_note: The Alipay+-Pix link is a concrete example of wallet-to-instant-payment-rail
    interoperability at cross-border scale, directly relevant to European debates
    around Wero, TIPS cross-currency settlement and retail payment sovereignty.
  sources: '[Alipay+ connects global e-wallets with Brazil''s Pix](https://www.finextra.com/pressarticle/111734/alipay-connects-global-e-wallets-with-brazils-pix?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Body paragraph 2 opens with ''The move is a practical test…'' which announces
      significance before making the substantive point. Rule states: ''Do not use
      phrases such as "The timing is notable", "This is notable", or any equivalent
      sentence that announces notability or significance before making a point.'''
    - Body paragraph 2 contains 'faces analogous design questions' but earlier in
      the same paragraph introduces 'The European Payments Initiative's Wero' without
      the parenthetical abbreviation (EPI). The rule requires 'When an individual
      or organisation name will be initialised in parentheses on first use' — this
      should read 'The European Payments Initiative (EPI)' on first mention, then
      'Wero' or 'EPI' subsequently.
    - 'Body paragraph 3 states ''Pix processed nearly 80 billion transactions in 2025''
      — this uses digits to start the sentence violating the rule: ''Apply the standard
      words-for-one-to-nine / digits-from-10 rule but avoid starting a headline, standfirst
      or sentence with digits.'' Should be ''Nearly 80 billion transactions were processed
      by Pix in 2025'' or similar.'
