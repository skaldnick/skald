stories:
- headline: FCA launches AI observatory to track adoption across financial services
  standfirst: The platform aggregates real-world examples of AI use by regulated firms,
    offering the UK's first structured view of how the technology is being deployed
    in practice.
  body: 'The UK''s Financial Conduct Authority (FCA) has launched what it describes
    as a world-first platform cataloguing how financial services firms are using artificial
    intelligence. The resource draws together case studies and data on AI adoption
    patterns across the sector, intended to help firms benchmark their own use against
    emerging market practice.


    The observatory sits alongside the FCA''s broader regulatory programme on AI,
    which has already included a review scoping AI''s implications for open finance
    and agentic payments, published in July, and the regulator''s decision in July
    to select Anthropic for the second phase of its AI sandbox. The new platform shifts
    the emphasis from experimental oversight to systematic market intelligence.


    The resource offers an early signal of what the FCA considers normal versus novel
    in AI deployment. That distinction will shape how the regulator approaches supervision
    as AI-driven decisioning becomes embedded in areas from fraud detection to credit
    underwriting.'
  editorial_note: A primary-source announcement from the FCA that extends its AI regulatory
    programme into structured market surveillance, relevant to any firm deploying
    AI in payments or open finance.
  sources: '[FCA launches world-first platform giving firms new insight into AI innovation](https://www.fca.org.uk/news/press-releases/fca-launches-world-first-platform-giving-firms-new-insight-ai-innovation)
    — Fca'
