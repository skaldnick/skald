- headline: Devengo raises €5m to scale instant payments infrastructure across Europe
  standfirst: A €5 million round adds Mutua Madrilena as a shareholder alongside new
    funding, as the firm builds on its certification as the first company authorised
    for cross-border instant payouts.
  body: 'Devengo has closed a €5 million funding round, bringing in Mutua Madrilena
    as a new shareholder as the company accelerates its expansion of instant payments
    account infrastructure beyond Spain. The raise follows the company''s certification
    as the first firm authorised for cross-border instant payouts under the Single
    Euro Payments Area framework.


    The investment arrives as Europe''s instant payments regulation forces banks and
    payment providers to overhaul their infrastructure for mandatory 10-second euro
    transfers. Devengo''s positioning as a specialist in instant payment account rails
    gives it a narrow but significant role in a market where many incumbents are still
    struggling with the operational demands of the regulation.


    Mutua Madrilena''s entry as a shareholder, rather than a purely financial investor,
    suggests the insurer sees value in the underlying infrastructure for its own payment
    flows. The round is modest in absolute terms, but for a company operating at the
    infrastructure layer of instant payments, the strategic backing may matter more
    than the quantum.'
  editorial_note: Devengo's raise is small but strategically positioned at the infrastructure
    layer of Europe's instant payments buildout, and the involvement of a major Spanish
    insurer as shareholder signals broader demand for the capability.
  sources: '[Devengo Closes €5 Million Funding Round](https://financialit.net/news/fundraising-news/devengo-closes-eu5-million-funding-round)
    — Financial IT | [Devengo adds 5 million and to Mutua Madrileña](https://www.democrata.es/en/economy/the-fintech-devengo-raises-5-million-and-adds-mutua-madrilena-as-a-new-shareholder/amp/)
    — Demócrata'
