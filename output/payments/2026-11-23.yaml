title: 'Canada names open banking standards body; Italian digital euro build begins;
  Worldline shares tumble

  '
social_post: 'Canada finally picks FDX as its open banking standards body, Italy''s
  payments heavyweights start building digital euro infrastructure, and Worldline
  drops 20% on a damaging FT report. Plus: Monzo''s ex-fraud team raises for a new
  venture. {link}

  '
stories:
- headline: Canada appoints FDX as technical standards body for open banking
  standfirst: Selecting an existing North American data-sharing standard over a bespoke
    national approach gives the country's long-delayed open banking regime a concrete
    technical foundation and positions FDX as a cross-border standard-setter.
  body: 'Canada''s federal government has appointed Financial Data Exchange (FDX)
    as the technical standards authority for the country''s emerging open banking
    system. FDX, which already underpins data-sharing standards for most major US
    financial institutions, will define the API specifications and security protocols
    that Canadian banks and fintechs must follow.


    The appointment follows years of delays in Canada''s open banking programme, which
    has repeatedly slipped past announced timelines. Naming a standards body is a
    prerequisite for the accreditation and licensing regime that will govern third-party
    access to consumer financial data. Canada''s choice of FDX over a bespoke national
    standard reflects a preference for North American interoperability, an approach
    that contrasts with Europe''s more fragmented API landscape under PSD2.


    The decision adds weight to FDX''s position as the dominant open banking standard
    outside Europe. It also comes 11 days after Canada launched its Real-Time Rail
    instant payments system on November 9, suggesting the country is now moving on
    multiple fronts to modernise its payments infrastructure after a prolonged period
    of inaction.'
  editorial_note: ''
  sources: '[Canada gives open banking its rulebook as FDX becomes technical standards
    authority](https://www.digitaljournal.com/article/canada-gives-open-banking-its-rulebook-as-fdx-becomes-technical-standards-authority/)
    — Digitaljournal'
  style_check:
    compliant: false
    warnings:
