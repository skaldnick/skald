- headline: Worldline shares fall 20% after report on delayed supplier payments
  standfirst: A Financial Times investigation into cash management practices at Worldline
    has triggered a sharp sell-off, deepening concerns about the French processor's
    financial health.
  body: 'The Financial Times reported on November 20 that Worldline delayed payments
    to suppliers and sought cash advances from customers in the years preceding its
    2023 profit warning, sending shares down by as much as 20%. The report raises
    questions about Worldline''s working capital management and the transparency of
    its financial reporting during that period.


    Worldline has been under sustained pressure since its October 2023 profit warning,
    which wiped billions from its market capitalisation and triggered a leadership
    change. The company has since undertaken restructuring under chairman Wilfried
    Verstraete and CEO Pierre-Antoine Vacheron, including asset disposals and cost-cutting
    measures. Credit Agricole''s decision earlier this year to take full ownership
    of its joint merchant payments venture with Worldline further reduced the firm''s
    operational footprint.


    Worldline remains one of Europe''s largest independent payment processors, and
    European policymakers and industry bodies have cited it as a pillar of the continent''s
    payments sovereignty ambitions. Its financial stability has implications for the
    merchants and banks that rely on its infrastructure across dozens of markets.'
  editorial_note: ''
  sources: '[Worldline shares plummet on FT report on cash advances](https://www.finextra.com/newsarticle/48791/worldline-shares-plummet-on-ft-report-on-cash-advances?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - 'Body opening: ''Shares in Worldline fell by as much as 20% on November 20''
      — avoids a strong substantive lede by leading with the share price movement
      rather than the Financial Times investigation and its findings about delayed
      supplier payments. Per rule on body openings: ''Do not weaken the body''s opening
      sentence in order to avoid repetition with the standfirst. The body''s first
      sentence is the most important element and must always be strong and direct.''
      The investigation itself—the revelations about cash management practices—is
      the substantive point; the share price is a consequence.'
    - 'Third paragraph: ''The sell-off is a setback for a company that European policymakers
      and industry bodies have cited as a pillar of the continent''s payments sovereignty
      ambitions.'' This frames significance before making a substantive point. Per
      rule: ''Do not state a development is a setback, challenge, or problem without
      explaining why first.'' Lead directly with the substantive claim (Worldline''s
      role in European payments infrastructure and the implications of the investigation),
      not with a significance-announcing frame.'
    - 'Editorial note included in submission. Per rule: ''Do not include editorial
      notes about missing information.'' Editorial notes should not appear in the
      final copy provided for review; if included here for context, it should be noted
      that such commentary does not belong in published material.'
