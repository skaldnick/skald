- headline: 'Former Monzo fraud team raises £1.8m for scam prevention startup

    '
  standfirst: 'Acorda''s pre-seed round signals growing investor appetite for specialist
    fraud tools as mandatory reimbursement rules increase the cost of scams for payment
    providers.

    '
  body: 'The former leaders of Monzo''s scam detection team have raised £1.8 million
    in pre-seed funding for Acorda, a startup that helps payment providers detect
    and prevent fraud. The founding team built the fraud systems at Monzo during a
    period when the neobank''s fraud reimbursement costs surged 85% following the
    introduction of mandatory reimbursement rules by the Payment Systems Regulator.


    The timing reflects a broader market dynamic: since the PSR''s mandatory reimbursement
    framework took effect, UK payment firms face direct financial liability for authorised
    push payment fraud losses. That shift has turned fraud prevention from a compliance
    function into a bottom-line concern, creating demand for specialist tooling that
    sits outside the capabilities of most in-house teams.


    Acorda enters a market where UK fraud losses have risen to £1.3 billion, with
    authorised push payment scams rebounding sharply. The startup''s focus on helping
    payment providers, rather than end consumers, positions it as infrastructure rather
    than a consumer-facing product.

    '
  editorial_note: 'This story connects the PSR''s mandatory reimbursement regime to
    commercial consequences — fraud prevention startups emerging because payment firms
    now bear the cost directly.

    '
  sources: '[Ex-Monzo scam fighting team raises £1.8m for startup Acorda](https://www.finextra.com/newsarticle/48794/ex-monzo-scam-fighting-team-raises-18m-for-startup-acorda?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
