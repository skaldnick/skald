- headline: CBI, Bancomat and Nexi team up to build Italy's digital euro infrastructure
  standfirst: Three of Italy's core payments organisations are collaborating to prepare
    the domestic plumbing needed if the ECB proceeds with a digital euro, as trilogue
    negotiations continue in Brussels.
  body: 'CBI, Bancomat and Nexi have agreed to jointly build the Italian infrastructure
    required to support a digital euro. The partnership covers the technical systems
    that would connect Italian payment service providers to the ECB''s digital euro
    platform, including distribution, acceptance and settlement components.


    The collaboration brings together CBI''s interbank network, Bancomat''s domestic
    card and payment scheme, and Nexi''s processing capabilities. Italy is the first
    euro area market where three major domestic payments organisations have publicly
    committed to a coordinated digital euro build, moving beyond the pilot participation
    phase into infrastructure preparation.


    The initiative comes as the European Parliament''s trilogue negotiations on digital
    euro legislation enter a critical phase, with merchant compensation and holding
    limits among the unresolved issues. Italy''s early infrastructure commitment suggests
    its payments industry is positioning on the assumption that the digital euro will
    proceed, regardless of the final legislative details. It also reflects Bancomat''s
    February memorandum of understanding with Bizum and EPI to build a joint European
    payments network, further embedding Italian infrastructure into broader continental
    initiatives.'
  editorial_note: Italy's coordinated infrastructure build is the first national-level
    commitment of its kind and signals how the payments industry is preparing for
    the digital euro despite ongoing legislative uncertainty.
  sources: '[CBI, Bancomat and Nexi  to build Italian digital euro infrastructure](https://www.finextra.com/newsarticle/48792/cbi-bancomat-and-nexi--to-build-italian-digital-euro-infrastructure?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
