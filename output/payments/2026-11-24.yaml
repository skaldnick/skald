- headline: ECB opens collateral framework to tokenised assets on licensed DLT platforms
  standfirst: Qualifying securities issued under the EU's DLT Pilot Regime can be
    pledged for Eurosystem credit operations from June 2027, the second step in the
    central bank's roadmap toward accepting natively tokenised collateral.
  body: 'The ECB''s Governing Council on Monday (November 23) approved the acceptance
    of marketable assets issued on distributed ledger technology platforms licensed
    under the EU DLT Pilot Regime as eligible Eurosystem collateral, subject to specific
    requirements. The assets must meet all standard collateral eligibility criteria
    and be made available through an eligible link to a central securities depository
    settling on the TARGET2-Securities platform. Executive Board member Isabel Schnabel
    said the Eurosystem would "support innovation without lowering our standards".
    Fellow board member Piero Cipollone framed the decision as part of the broader
    Pontes and Appia programmes, which are designed to deliver a model for a tokenised
    European financial ecosystem.


    The decision builds on a January 27 announcement that the Eurosystem would accept
    collateral issued in central securities depositories using DLT-based services,
    a framework that took effect on March 30. That earlier step covered assets held
    in conventional depositories that happened to use distributed ledger infrastructure;
    this one extends eligibility to assets issued directly on licensed DLT platforms.
    The ECB described it as a new milestone in its roadmap toward accepting and mobilising
    tokenised assets in their native form.


    Detailed eligibility requirements are expected in spring 2027 ahead of a June
    2027 implementation date. For euro area banks exploring tokenised bond issuance,
    the practical effect is that a DLT Pilot Regime licence now offers a conditional
    route into the Eurosystem collateral framework, provided the settlement infrastructure
    connects to TARGET2-Securities. The ECB said it is still exploring whether assets
    issued and settled entirely on DLT networks, without passing through a central
    securities depository, could eventually become eligible.'
  editorial_note: New ECB Governing Council decision announced November 23 — the second
    step in the ECB's staged DLT collateral roadmap, extending eligibility from CSD-held
    DLT assets (January 2026) to assets on licensed DLT Pilot Regime platforms. Not
    previously covered. The earlier Project Pontes story (September 21) was about
    connecting tokenised assets to central bank money; this is a distinct decision
    expanding the collateral framework. Source is the ECB's own press release.
  sources: '[ECB expands acceptance of DLT-based assets as eligible Eurosystem collateral](https://www.ecb.europa.eu/press/pr/date/2026/html/ecb.pr261123~76b6f57b74.en.html)
    — European Central Bank'
