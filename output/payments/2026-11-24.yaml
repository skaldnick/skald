title: 'FIDA withdrawal; Western Balkans instant payments; Experian cashflow bureau;
  ECON PSD3 recommendations

  '
social_post: 'Brussels shelved open finance legislation — now Europe''s fintechs must
  build it on contracts alone. Plus: Western Balkans go live on TIPS, Experian''s
  cashflow bureau, and ECON''s PSD3 second reading. {link}

  '
