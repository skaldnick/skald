- headline: ECON publishes draft recommendations for PSD3 and payment services regulation
    second reading
  standfirst: Draft recommendations for the second reading of PSD3 and the accompanying
    payment services regulation approve the Council's first-reading position without
    amendments, moving the payments framework overhaul toward formal adoption.
  body: 'The European Parliament''s Committee on Economic and Monetary Affairs (ECON)
    has published draft recommendations for the second reading of PSD3 and the proposed
    payment services regulation. The recommendations endorse the Council''s first-reading
    position without amendments, reflecting the text already agreed during trilogue
    negotiations that concluded in November 2025.


    The Council of the EU formally adopted its first-reading position on the PSD3
    and payment services regulation package on October 29. ECON''s draft recommendations
    now clear the path for Parliament to approve that position at second reading,
    the final legislative stage before the new framework is formally adopted. The
    package covers a broad range of provisions including strong customer authentication
    requirements, liability rules, open banking access conditions and the treatment
    of electronic money services.


    The timeline aligns with broader momentum on European payments legislation: the
    digital euro regulation is also advancing through trilogue, and the instant payments
    regulation is already in its enforcement phase. For payment service providers,
    the ECON recommendations confirm that the text agreed in trilogue will pass through
    Parliament without further changes, removing a remaining source of uncertainty
    over the final shape of the framework.'
  editorial_note: ''
  sources: '[ECON draft recommendations for second reading on proposed PSD3 and PSR](https://www.regulationtomorrow.com/2026/11/econ-draft-recommendations-for-second-reading-on-proposed-psd3-and-psr/)
    — Regulationtomorrow | [EU Lets Shops Dispense Cash Without Purchase](https://wisevoter.com/world/2026/11/23/eu-shops-dispense-cash-without-purchase)
    — Wisevoter'
  style_check:
    compliant: false
