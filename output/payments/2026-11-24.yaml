      recommendations for the second reading of PSD3...' or similar.
    - 'Body text uses ''The European Parliament''s Committee on Economic and Monetary
      Affairs (ECON)'' but the standfirst already established ''The European Parliament''s
      economic affairs committee'' without the abbreviation. Per rule [23], when an
      abbreviation is introduced in parentheses on first use in the body, it should
