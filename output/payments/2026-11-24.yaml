- headline: Western Balkans launch TIPS-based instant payments across five economies
  standfirst: A regional instant payment system has gone live across five Western
    Balkan economies, extending euro-area payment rails into non-EU markets using
    the ECB's settlement infrastructure.
  body: 'Five Western Balkan economies have launched a regional instant payment system
    based on the ECB''s TARGET Instant Payment Settlement (TIPS) platform, enabling
    cross-border bank transfers to settle within seconds. Kosovo and Montenegro are
    among the first markets to go live, with the system designed to support both consumer
    and business payments across the region.


    The project connects Western Balkan payment systems to European instant payments
    infrastructure without requiring EU membership or eurozone participation. It follows
    the same model as Iceland''s earlier connection to TIPS and Albania''s preparations,
    extending the reach of euro-denominated instant settlement beyond the bloc''s
    formal borders. The ECB has framed such connections as contributing to Europe''s
    economic security and financial independence.


    The expansion widens the geography over which TIPS-based settlement is available
    and creates new corridors for real-time cross-border payments. The system could
    also serve as a template for other non-EU markets seeking interoperability with
    European payment infrastructure.'
  editorial_note: This extends the TIPS footprint into five new non-EU markets simultaneously,
    a meaningful expansion of European instant payments infrastructure with practical
    implications for cross-border payment routing.
  sources: '[Regional instant payment system TIPS Clone launched](https://en.vijesti.me/news-b/economy-d/837753/regional-instant-payment-system-launched-tips-clone)
    — Vijesti | [Bank transfers within seconds launch in Kosovo: How does the new
    system work?](https://kohajone.com/en/kosova/nisin-transferet-bankare-brenda-sekondash-ne-kosove-si-funksionon-sistemi-i-ri/)
    — Kohajone'
