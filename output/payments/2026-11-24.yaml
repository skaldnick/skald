- headline: GTCR revives $50bn Global Payments bid days after joint pursuit collapsed
  standfirst: The solo approach by its largest shareholder reopens the question of
    private equity control over Europe's biggest merchant acquirer, now at a higher
    price.
  body: 'GTCR is exploring a takeover of Global Payments worth approximately $50 billion
    including debt, according to Bloomberg, citing people familiar with the matter.
    GTCR, which holds a 16% stake in Global Payments after selling its majority interest
    in Worldpay to the company in January, is working with a group of other private
    equity firms to finance the deal. No formal offer has been made and GTCR has not
    decided whether to proceed.


    The approach comes barely a week after GTCR and Clayton, Dubilier and Rice abandoned
    a joint pursuit of Global Payments on November 12, reportedly because of the difficulty
    of financing a transaction of this scale. GTCR has now returned without its former
    partner, at a valuation roughly $10 billion above the enterprise value discussed
    in the earlier consortium effort. Global Payments'' shares rose more than 10%
    on the report.


    Global Payments is the parent of Worldpay, which processes more than $2 trillion
    in annual transaction volume across 146 countries and ranks among the largest
    merchant acquirers operating in Europe. A shareholder agreement signed during
    the Worldpay acquisition restricts GTCR from buying additional shares, meaning
    any takeover would require a negotiated deal. For European payments professionals,
    the ownership structure of a processor of this scale has direct implications for
    pricing, integration strategy and competitive dynamics across the continent.'
  editorial_note: New angle on previously covered story (CD&R targets buyout, November
    2). The joint CD&R-GTCR bid collapsed on November 12; GTCR revived a solo approach
    on November 20 at a materially higher valuation ($50bn vs ~$40bn), with a different
    PE consortium. This is a genuinely subsequent stage. European relevance is natural
    through Worldpay, one of Europe's largest merchant acquirers.
  sources: '[Global Payments shares jump on report of $50B GTCR deal](https://uk.finance.yahoo.com/news/global-payments-shares-jump-report-193410757.html)
    — Yahoo Finance (via Investing.com)'
