- headline: Adyen co-founder Pieter van der Does retires as sole CEO takes charge
  standfirst: Single leadership at one of Europe's largest independent payment processors
    follows a period of active dealmaking and competitive pressure from Stripe.
  body: 'Pieter van der Does, co-founder and co-CEO of Adyen, is retiring from the
    Dutch payments processor, leaving Ingo Uytdehaage as sole chief executive. Van
    der Does co-founded Adyen in 2006 and has led the company through its 2018 Amsterdam
    listing and its expansion into a full-stack platform serving global merchants.


    The transition comes during a period of active dealmaking for Adyen, which agreed
    a $335 million acquisition of billing platform Orb in June and recently appointed
    Klarna''s Niclas Neglen as chief financial officer. The sole CEO structure consolidates
    decision-making as the company integrates acquisitions and competes with Stripe,
    which is itself pursuing large-scale M&A including its reported $53 billion approach
    for PayPal.


    Adyen''s market capitalisation stands at roughly €28 billion. Van der Does''s
    departure removes one of the last founder-executives still running a major European
    payments company and marks a generational shift in leadership at the continent''s
    largest independent payment processor.'
  editorial_note: A founder departure at this scale reshapes Adyen's governance from
    founder-led to institutionally managed, with implications for strategic direction
    during a period of consolidation across European payments.
  sources: '[Adyen co-CEO van der Does retires](https://www.finextra.com/newsarticle/48801/adyen-co-ceo-van-der-does-retires?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Standfirst opens by naming the organisation ('Adyen') which is also the subject
      of the headline. Rule 1 requires opening with the substantive point instead
      — e.g., 'Single leadership simplifies decision-making...' rather than naming
      the company upfront.
    - Body paragraph 2 uses 'Moving to a single CEO structure simplifies decision-making'
      — a weak opening that hedges significance before stating the point. Rule 21
      requires leading directly with substantive claims rather than qualifying phrases
      like 'moving to' that delay the main point.
    - Editorial note states 'A founder departure at Europe's largest independent payments
      processor is a significant leadership event' — this explicitly flags significance
      ('significant leadership event'). Rule 11 prohibits announcing importance before
      explaining it; the note should state the substantive consequences directly without
      the significance framing.
  verification:
    verified: false
    stale: false
    duplicate: false
    warnings:
    - Market capitalisation stated as €50bn but sources show approximately €26-30bn
      as of November 2026
  revision:
    replaced: false
    resolved: true
    summary:
    - Revised standfirst to open with the substantive point ('Single leadership…')
      rather than naming Adyen, per rule 1.
    - Corrected market capitalisation from '€50 billion' to '€28 billion' to reflect
      approximate current valuation range (€26-30bn) indicated by fact-check sources.
    - Rewrote body paragraph 2 opening to lead with the substantive claim ('The sole
      CEO structure consolidates decision-making…') rather than the hedging 'Moving
      to' construction.
    - Revised editorial note to remove explicit significance framing ('significant
      leadership event') and instead state the substantive consequence directly, per
      rule 11.
