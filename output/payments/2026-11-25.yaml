stories:
- headline: UK authorised push payment fraud losses rise 22% to £316m in first half
    of 2026
  standfirst: The increase reverses early signs that mandatory reimbursement was suppressing
    fraud volumes, raising questions about the PSR regime's deterrent effect.
  body: 'UK Finance figures show a 22% year-on-year increase in authorised push payment
    fraud losses, which reached £316 million in the first half of 2026.


    PSR''s mandatory reimbursement framework, which took effect in late 2024, initially
    appeared to be reducing fraud volumes. A PSR study published in July found that
    the rules had cut losses by £73 million in their first months of operation. The
    latest figures suggest that effect may have been temporary, or that fraudsters
    have adapted their methods to circumvent the controls that banks put in place
    to comply with the new regime.


    The reimbursement model''s core premise was that shifting liability to sending
    banks would create stronger incentives to prevent fraud. With losses climbing
    despite those incentives, regulators are examining whether the scheme''s calibration,
    including the £85,000 reimbursement cap, needs revisiting.'
  editorial_note: Follows the previously covered PSR study from July showing early
    success of mandatory reimbursement. The new angle is that H1 2026 data now shows
    losses rebounding sharply, challenging the narrative that the regime is working.
  sources: '[UK APP fraud losses continue to rise](https://www.finextra.com/newsarticle/48799/uk-app-fraud-losses-continue-to-rise?utm_medium=rssfinextra&utm_source=finextrafeed)
    — Finextra'
  style_check:
    compliant: false
    warnings:
    - Headline uses 'APP fraud' without spelling out the abbreviation. Per rule on
      avoiding industry abbreviations, should use 'authorised push payment fraud'
      or introduce as 'authorised push payment (APP) fraud' if the abbreviation will
      recur in body.
    - Body opens with 'Losses from authorised push payment fraud' — this is a near-verbatim
      restatement of the headline's substantive point. Per rule on varying opening
      across headline and body, the body's first sentence should lead with a stronger,
      more direct angle rather than repeating the headline's framing.
    - Paragraph 2 uses 'The PSR's mandatory reimbursement framework' — 'The PSR' is
      an acronym-only organisation name and should not take 'The' as an article per
      rule. Should read 'PSR's mandatory reimbursement framework'.
    - Paragraph 3 opens 'The data will intensify scrutiny' — this is a weakened opening
      that announces significance ('intensify scrutiny') before making the substantive
      point. Per rule, lead directly with the substantive claim rather than framing
      it as a matter of heightened attention.
    - Paragraph 3 uses 'regulators face pressure to consider whether' — this hedges
      the substantive point with 'face pressure' language. Per rule against opening
      with hedging scene-setters, lead directly with the substantive claim — e.g.,
      'regulators are examining whether the scheme's calibration needs revisiting.'
  verification:
    verified: true
    stale: false
    duplicate: false
    warnings: []
  revision:
    replaced: false
    resolved: true
    summary:
    - Spelled out 'authorised push payment fraud' in headline instead of abbreviation
      'APP fraud', per rule on avoiding unexpanded industry abbreviations.
    - Rewrote body's opening sentence to lead with the UK Finance attribution and
      percentage increase rather than near-verbatim repeating the headline's framing.
    - Removed article 'The' before 'PSR's' in paragraph 2, per rule that acronym-only
