title: 'Cards overtake cash in euro area; BIS examines big tech in open finance; Fabrick
  builds digital euro platform

  '
social_post: 'Cards just edged past cash in euro area shops for the first time — but
  consumers aren''t ready to give up either. Plus: BIS on big tech''s open finance
  leverage, and Fabrick''s digital euro prep. {link}

  '
stories:
- headline: Sparkassen add subscriptions, one-click and buyer protection to Wero
  standfirst: Germany's largest banking group is rolling out the checkout features
    Wero needs to compete with card networks, but fragmented adoption across individual
    savings banks could limit the impact.
  body: 'Subscription payments, one-click checkout and optional buyer protection are
    now available or imminent for Sparkassen customers using Wero, following an announcement
    on Monday (November 24) by S-Payment, the payments subsidiary of the German savings
    banks group. Subscription billing has been technically possible since late September,
    but S-Payment''s announcement confirmed the capability for Sparkassen customers,
    with one-click checkout due by the end of November. An optional online buyer protection
    programme has been live since early November, supplementing Wero''s standard complaints
    process with insurance-backed cover for non-delivery and returns. Each Sparkasse
    decides independently whether to offer the buyer protection, creating uneven coverage
    across the network.


    The features address a clear gap. Wero''s e-commerce proposition in Germany has
    lacked the subscription billing, stored-credential checkout and consumer guarantees
    that card networks offer as standard. Without them, merchants had little reason
    to prefer Wero over Visa or Mastercard at checkout. One-click payments, which
    store a customer''s details after the first purchase and remove the need for repeated
    strong customer authentication, are particularly important for conversion rates.


    Sparkassen account for more than seven million of Wero''s 11 million German registrations,
    according to figures from late October. The savings banks also plan to give customers
    access to the standalone Wero app from the European Payments Initiative (EPI),
    alongside the existing integration in the Sparkasse banking app. Wero''s broader
    momentum is building: Valve added Wero as a payment method on Steam in Germany
    this week, and neobank bunq extended Wero to customers across all 27 EU member
    states on November 20. The question is whether feature parity at the Sparkassen
    translates into merchant adoption quickly enough to give Wero commercial traction
    before the novelty of its European sovereignty pitch wears thin.'
  editorial_note: Selected as the most significant uncovered European payments story
    from the last two days. The S-Payment press release (November 24) is the primary
    source; supplementary details on German registrations come from borncity.com reporting
    on November 26. The story has not been previously covered in this briefing. It
    illuminates Wero's progression from P2P to a commercially viable e-commerce checkout
    option, which is structurally significant for the European payments sovereignty
    debate that is a continuing thread in this briefing.
  sources: '[Sparkassen bringen neue Wero-Funktionen für E- und M-Commerce](https://www.s-payment.com/newsroom/pressemeldungen/PM2026-sparkassen-wero-neue-features.html)
    — S-Payment'
