- headline: FCA to open targeted engagement on UK open finance framework early next
    year
  standfirst: Roundtables and bilateral meetings will draw on findings from the Smart
    Data Accelerator, the Prism Taskforce and the Mills AI review as the regulator
    moves from roadmap to practical policy design.
  body: 'Targeted stakeholder engagement on open finance will begin at the start of
    2027, Andrew Self, head of open banking and open finance at the UK''s Financial
    Conduct Authority (FCA), told delegates at Open Banking Expo UK and Europe 2026
    in London on Sunday (November 24). The engagement will not present a settled regulatory
    model but will instead explore the choices facing policymakers and invite further
    evidence from industry.


    The announcement comes as the government prepares to consult in 2027 on how to
    deliver the benefits of open finance, initially focusing on SME lending. Self
    said the forthcoming engagement would bring together findings from the FCA''s
    Smart Data Accelerator, its broader industry engagement, the Prism Taskforce and
    the Mills AI review examining AI''s impact on financial services. He pointed to
    progress already made in open banking, including the June launch of the UK Payments
    Initiative and commercial variable recurring payments (VRP), and industry-led
    work to establish a future open banking entity.


    Self framed trust as the central constraint on scaling open finance. "Trust is
    what allows it to scale," he told delegates, while acknowledging that further
    work is needed to establish a sustainable long-term regulatory framework for open
    banking alongside the development of open finance. "This isn''t an invitation
    for firms to wait until every part of open finance is settled," he added. "It''s
    an invitation to engage now and help shape the future of open finance."'
  editorial_note: This is a genuinely new development from November 24 at Open Banking
    Expo UK. It moves the FCA open finance story forward from the roadmap and taskforce
    stages previously covered (April and October 2026) to concrete engagement starting
    early 2027. The story was published by Open Banking Expo on November 24, 2026.
  sources: '[FCA sets out next steps on Open Finance as regulatory plans gather pace](https://www.openbankingexpo.com/news/fca-sets-out-next-steps-on-open-finance-as-regulatory-plans-gather-pace/)
    — Open Banking Expo'
  style_check:
    compliant: false
    warnings:
    - Headline and standfirst both open with 'FCA'/'the regulator' naming the same
      organisation. Per rule [1], the standfirst should open with the substantive
      point (e.g., 'Roundtables and bilateral meetings will…') rather than repeating
      the subject already named in the headline.
    - Body text uses 'commercial variable recurring payments' without the standard
      abbreviation introduction. Per rule on cVRP, this should be introduced as 'commercial
      variable recurring payments (VRP)' on first use, since VRP recurs or may recur
      in payments coverage.
    - Standfirst names 'Mills AI review' but body text refers to 'Mills Review examining
      AI's impact'. These are inconsistent phrasings of the same entity; use one consistent
      form throughout.
    - Date reference 'on November 24' lacks day of week. Per rule on specific dates
      from the past week, include the day of the week in parentheses — e.g., 'on Sunday
      (November 24)' — provided it is known.
    - Headline and body both begin with 'FCA'/'The UK's Financial Conduct Authority'.
      Per rule on varying opening across headline/standfirst/body, do not start both
      headline and body opening sentence with the same subject. Revise the body to
      vary the opening.
