      standfirst adds context to the headline — the interpretive point, a summary,
      or added explanation — but it is not the opening sentence of the story. The
      body must be self-contained. The final sentence should be moved to the body
      or removed.
    - The body paragraph beginning 'Sparkassen account for more than seven million…'
      contains 'according to figures from the end of October.' Per rule [19], avoid
      vague temporal references such as 'earlier this year'. Use 'from late October
      2025' or similar specific time period rather than 'from the end of October'.
