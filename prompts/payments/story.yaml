task: |
  You will be given a list of news items from today's feed. Your job is to:
  1. Select the 3-5 most significant stories for an audience of European payments
     and open banking professionals
  2. For each selected story, produce a briefing item following the house format
  3. For each selection, include a brief editorial note explaining why you chose it

selection_criteria: |
  Prioritise stories that:
  - Signal a regulatory or policy shift with practical implications
  - Reveal how companies or sectors are responding to industry trends
  - Move a continuing story forward in a meaningful way

  Deprioritise:
  - Vendor announcements with no broader implication
  - Stories duplicating something covered in recent issues. A different outlet
    reporting the same underlying fact (same date, same law, same actors) is
    not a new angle, even from a local or previously-unseen source — a new
    angle requires a materially different fact: a changed date or figure, a
    new party involved, or a genuinely subsequent stage of the same process
    (e.g. law passed -> regulator approval -> go-live) that the earlier
    coverage did not report. If in doubt, treat it as the same story and skip it.
  - Items where the feed summary is too thin to write from with confidence
  - Analysis or commentary pieces by law firms, consultancies, or advisers
    explaining a regulatory development — these are client briefings, not news.
    Do not include them unless the analysis itself has generated significant
    industry reaction or the author is a named, genuinely authoritative voice
    (not a standard firm client update). A law firm explaining what PSD3 means
    for clients is not a story. A notable regulator or policymaker offering
    a consequential new interpretation could be.

  Before selecting a story, check three things:
  - Is it actually new? Check the publication date. A story reporting on a survey
    or report from weeks ago is not today's news — it is commentary on older news.
    If the original event is stale, skip it or find a more recent source covering
    the same development.
  - What is the real source? Feed items often report on original content published
    elsewhere (a regulator's speech, an industry body's report, a company
    announcement). Identify the feed item that is the primary source and cite its
    ID in `source_ids`, not an aggregator covering the same news. Where multiple
    feed items cover the same underlying story, list all their IDs in `source_ids`
    rather than picking just one. Each item in "Today's stories" below is numbered
    with an `ID:` field — cite only IDs that appear there, and never cite an ID
    from the "Previously covered" list (those aren't numbered and have no ID).
  - For personnel appointments: is the role new, or is this a replacement? If
    the source does not say, you cannot characterise it as an organisational
    investment or strategic elevation. Note the gap honestly rather than
    filling it with inference.

output_format: |
  Respond with a valid YAML document using the structure below. Use literal block
  scalars (the | character) for every free-text field, exactly as shown — never
  double-quoted strings. Free text routinely contains quotation marks (e.g. quoting
  a source directly) which break double-quoted YAML scalars; block scalars need no
  escaping. `source_ids` is the one exception: it is a YAML flow-style list of
  integers (e.g. [3] or [3, 7]), never free text — never write a URL, title, or
  publication name yourself; see the "What is the real source?" guidance above for
  what to put there. Do not wrap the output in code fences.

  title: |
    Four to eight words summarising today's stories — e.g. GoCardless profits; pay-by-bank friction; PSD3 delay.
    Never editorialise about the feed itself (e.g. "Thin feed", "Quiet day") — describe the news, not the day.
  social_post: |
    One post for X promoting today's briefing. Write no more than 235 characters of your own text — the {link} placeholder is replaced with a fixed 45-character URL when published, bringing the total to 280. Punchy and engaging — personality and dry humour welcome. Does not need to mention every story; lead with the most interesting angle. Never apologise for or flag the number of stories (e.g. 'thin' day, 'just one story') — a single strong story stands on its own. Written to make a payments professional want to click. End with {link}.
  stories:
    - headline: |
        Story headline — plain text, no markdown
      standfirst: |
        One sentence that frames the story for a professional audience. No markdown.
      body: |
        First paragraph written in the house voice.

        Second paragraph. Add further paragraphs as needed, separated by blank lines.
      editorial_note: |
        One sentence explaining why this story was selected and merits a reader's attention.
        If it follows up on something in the "Previously covered" list, state the new angle here.
      source_ids: [3]
    - headline: |
        ...
      standfirst: |
        ...
      body: |
        ...
      editorial_note: |
        ...
      source_ids: [...]

input: |
  Today's stories:
  {stories}
