task: |
  You will be given a list of news items from today's feed. Your job is to:
  1. Select the 3-5 most significant stories for an audience of European payments
     and open banking professionals
  2. For each selected story, produce a briefing item following the house format
  3. For each selection, include a brief editorial note explaining why you chose it

selection_criteria: |
  Prioritise stories that:
  - Signal a regulatory or policy shift with practical implications
  - Reveal how companies or sectors are responding to industry trends
  - Move a continuing story forward in a meaningful way

  Deprioritise:
  - Vendor announcements with no broader implication
  - Stories duplicating something covered in recent issues
  - Items where the feed summary is too thin to write from with confidence
  - Analysis or commentary pieces by law firms, consultancies, or advisers
    explaining a regulatory development — these are client briefings, not news.
    Do not include them unless the analysis itself has generated significant
    industry reaction or the author is a named, genuinely authoritative voice
    (not a standard firm client update). A law firm explaining what PSD3 means
    for clients is not a story. A notable regulator or policymaker offering
    a consequential new interpretation could be.

  Before selecting a story, check three things:
  - Is it actually new? Check the publication date. A story reporting on a survey
    or report from weeks ago is not today's news — it is commentary on older news.
    If the original event is stale, skip it or find a more recent source covering
    the same development.
  - What is the real source? Feed items often report on original content published
    elsewhere (a regulator's speech, an industry body's report, a company
    announcement). Identify the primary source and cite that, not the aggregator.
    Where multiple feed items cover the same underlying story, treat them as one
    item and draw on all sources.
  - For personnel appointments: is the role new, or is this a replacement? If
    the source does not say, you cannot characterise it as an organisational
    investment or strategic elevation. Note the gap honestly rather than
    filling it with inference.

output_format: |
  Respond with a valid YAML document using the structure below. Use literal block
  scalars (the | character) for the body field. Do not wrap the output in code fences.

  title: "Four to eight words summarising today's stories — e.g. GoCardless profits; pay-by-bank friction; PSD3 delay"
  social_post: "One post for X promoting today's briefing. Max 280 characters including {link}. Punchy and engaging — personality and dry humour welcome. Does not need to mention every story; lead with the most interesting angle. Never apologise for or flag the number of stories (e.g. 'thin' day, 'just one story') — a single strong story stands on its own. Written to make a payments professional want to click. End with {link}."
  stories:
    - headline: "Story headline — plain text, no markdown"
      standfirst: "One sentence that frames the story for a professional audience. No markdown."
      body: |
        First paragraph written in the house voice.

        Second paragraph. Add further paragraphs as needed, separated by blank lines.
      editorial_note: "One sentence explaining why this story was selected and merits a reader's attention."
      sources: "[Article title](https://example.com) — Publication name | [Second title](https://example.com) — Publication name"
    - headline: "..."
      standfirst: "..."
      body: |
        ...
      editorial_note: "..."
      sources: "..."

input: |
  Today's stories:
  {stories}
