# House style rules extracted from editorial feedback.
# Populated by: python tools/extract_learning.py
# Each rule has a stable id. A proposal that revises an existing rule carries
# supersedes: <id> and replaces that rule in place (same id, new date/text) rather
# than appending alongside it — see tools/extract_learning.py and the dashboard's
# 'Proposed style rules' section. Rules with no supersede history are still subject
# to the old convention: more recent rules take precedence on conflict.
- id: 1
  date: '2026-07-30'
  rule: In the standfirst, do not open by naming the organisation that is also named
    in the headline. Instead, begin with the substantive point or action — eg, if
    the headline identifies the ECB, the standfirst should open with "The move signals…"
    rather than "The European Central Bank has published…". This avoids redundant
    repetition of the subject across headline and standfirst.
- id: 2
  date: '2026-04-13'
  rule: Prefer spelling out non-standard abbreviations/acronyms, such as "account-to-account"
    instead of "A2A".
- id: 3
  date: '2026-08-21'
  rule: 'Do not restructure a colon or dash-introduced list mid-sentence into a separate
    clause when the surrounding sentence can absorb it cleanly with a preposition.
    For example, prefer "reflects a growing pattern among digital banks of embedding
    AI directly into the banking interface" over "reflects a growing pattern among
    digital banks: embedding AI directly into the banking interface".'
- id: 4
  date: '2026-04-14'
  rule: Use "US" not "United States" in body text.
- id: 5
  date: '2026-06-04'
  rule: Never flag significance explicitly. Do not write sentences that announce importance
    before explaining it — no "This matters because", "The significance here is",
    "What this means is", "Why this is notable", or equivalent framing. Write the
    substantive point directly; if it belongs in the briefing, the reader will recognise
    its significance without being told.
- id: 6
  date: '2026-07-08'
  rule: Write numbers one to nine as words (one, two, three...); use digits from 10
    upward (10, 11, 12...).
- id: 7
  date: '2026-07-09'
  rule: 'The standfirst adds context to the headline — the interpretive point, a summary,
    or added explanation — but it is not the opening sentence of the story. The body
    must be self-contained: it explains the story from the beginning (who, what, where,
    when, why, how), not a continuation of the standfirst''s sentence. Avoid near-verbatim
    repetition of the same phrasing across headline, standfirst, and body (eg, headline
    "Company does X", standfirst "Company something", body "Company does X") — but
    the body restating or developing the standfirst''s point in more depth and different
    wording is expected, not a violation.'
- id: 8
  date: '2026-07-09'
  rule: Apply the standard words-for-one-to-nine / digits-from-10 rule but avoid starting
    a headline, standfirst or sentence with digits.
- id: 9
  date: '2026-07-09'
  rule: On first use of an abbreviation that must be retained, spell it out in full
    followed by the abbreviation in parentheses — eg, "distributed ledger technology
    (DLT)" — then use the abbreviation alone for subsequent references. This rule
    can be ignored for some very common abbreviations (eg, US, UK, UN).
- id: 10
  date: '2026-07-09'
  rule: Prefer the present continuous tense ("is partnering") over the simple present
    ("has partnered") when describing a newly announced or ongoing arrangement, to
    signal currency without implying the action is already complete.
- id: 11
  date: '2026-07-13'
  rule: Do not use phrases such as "The timing is notable", "This is notable", or
    any equivalent sentence that announces notability or significance before making
    a point. Write the substantive point directly.
- id: 12
  date: '2026-07-13'
  rule: Use "judgment" not "judgement".
- id: 13
  date: '2026-08-28'
  rule: 'Only include an abbreviation in parentheses after a term if that abbreviation
    is used again later in the same piece. If the short form never recurs, spell out
    the term in full without adding the abbreviation in brackets. Apply this at the
    sentence level: if "FCA" appears only once in the body, write "Financial Conduct
    Authority" without the parenthetical "(FCA)".'
- id: 14
  date: '2026-07-14'
  rule: Use people's names alongside their titles on first reference — eg, "Rachel
    Reeves, the UK chancellor" rather than just "the UK chancellor". Name individuals
    wherever possible to personalise the writing.
- id: 15
  date: '2026-07-15'
  rule: When naming an individual on first reference, include their title immediately
    — eg, "chancellor Rachel Reeves" or "Rachel Reeves, the chancellor" — when the
    title is needed for context.
- id: 16
  date: '2026-07-15'
  rule: Do not use "The move is notable", "The move is significant", or equivalent
    constructions that announce notability before making a substantive point. Write
    the substantive point directly.
- id: 17
  date: '2026-07-15'
  rule: Avoid vague temporal references such as "earlier this year". Use specific
    time periods (eg, "the last quarter of 2025 (April-June)") when referring to financial
    or business results.
- id: 18
  date: '2026-07-15'
  rule: When citing financial metrics such as profitability, qualify them with the
    basis of measurement where relevant — eg, "(based on adjusted Ebitda)" — so the
    claim is precise rather than unqualified.
- id: 19
  date: '2026-07-16'
  rule: Avoid vague temporal references such as "in June" or "last month" when a specific
    date is available. Use the precise date (eg, "on July 9") or, where only a month
    is known, the month name. Reserve "last month" only when the specific date cannot
    be established.
- id: 20
  date: '2026-07-16'
  rule: When introducing a named individual, include their title and, where relevant,
    the date or context of their appointment — eg, "CEO Enrique Lores has already
    begun restructuring after taking the job in March" rather than "its new CEO has
    already begun restructuring".
- id: 21
  date: '2026-07-16'
  rule: Do not open a paragraph with "The deal is far from certain" or equivalent
    hedging scene-setters that delay the substantive point. Lead directly with the
    substantive claim — eg, "intense regulatory scrutiny is expected".
- id: 22
  date: '2026-07-17'
  rule: Do not describe a development as "one of a growing number" in a way that hedges
    its significance. If the broader trend is worth noting, state the trend directly
    and let the specific item illustrate it.
- id: 23
  date: '2026-07-20'
  rule: Prefer "say" (or "said", "says") over "believe" or "believes" when attributing
    views to individuals or organisations. Use verbs that report what people have
    stated rather than asserting their internal beliefs.
- id: 24
  date: '2026-07-20'
  rule: Do not include editorial notes about missing information — eg, "Whether this
    is a newly created position is not stated in the source" or "The appointee's background
    was not available." If information is absent, simply omit it; do not flag its
    absence in the text.
- id: 25
  date: '2026-07-21'
  rule: Do not state a specific count of participants (eg, "nine payment service providers")
    when the named examples are introduced with "such as" or "including" — that phrasing
    signals the list isn't exhaustive, and a precise count contradicts it.
- id: 26
  date: '2026-07-24'
  rule: For stories originating outside Europe that are relevant to a European audience,
    the opening sentence (lede) should frame the story in terms of its broader or
    global relevance — eg, 'could shape how regulators worldwide respond to X'. Mention
    the specific geographic origin (eg, North America) in the following sentence,
    not the lede.
- id: 27
  date: '2026-07-24'
  rule: Do not start the headline, standfirst, and body opening sentence with the
    same word or phrase. Vary the opening in at least one of the elements.
- id: 28
  date: '2026-07-24'
  rule: Do not apply the abbreviation-in-parentheses rule to the standfirst. In the
    standfirst, common and recognisable abbreviations (such as FCA, EPI) may be used
    on first mention without spelling them out. Spell-out-plus-parenthetical is only
    required in the body text.
- id: 29
  date: '2026-08-26'
  rule: When an abbreviation such as "EPI" is spelled out in the standfirst, the body
    must still introduce the full form on first use — eg, "the European Payments Initiative
    (EPI)" — if the abbreviation recurs in the body. Do not rely on the standfirst's
    spelling to cover the body's first use.
- id: 30
  date: '2026-07-24'
  rule: When a company name has a recognisable short form (eg, 'Viva' from 'Viva.com'),
    use the short form consistently after first mention rather than repeating the
    full branded name each time.
- id: 31
  date: '2026-07-28'
  rule: Refer to HM Treasury as "the Treasury" in body text, not "HM Treasury".
- id: 32
  date: '2026-07-29'
  rule: In headlines and standfirsts, abbreviate million, billion and trillion to
    m, bn, and tn respectively — eg, "10k", "$10m", "£10bn", "€10tn", and only for
    currency or numeric amounts. In body copy, always spell out "million", "billion",
    and "trillion" in full.
- id: 33
  date: '2026-07-29'
  rule: When using dashes in body text, use en-dashes (–) rather than em-dashes (—).
- id: 34
  date: '2026-07-29'
  rule: Do not include a decimal place for round or whole numbers. Write "£7 million"
    not "£7.0 million", "£10 billion" not "£10.0 billion", and so on.
- id: 35
  date: '2026-08-04'
  rule: Do not weaken the body's opening sentence in order to avoid repetition with
    the standfirst. The body's first sentence is the most important element and must
    always be strong and direct. If repetition is a problem, revise the standfirst
    instead.
- id: 36
  date: '2026-07-30'
  rule: Avoid foreign diacritics and accents in names and proper nouns. Use the accepted
    British English equivalent where one exists — for example, replace the German
    umlaut in "Börse" with "Boerse", or the Norwegian ring in "Håland" with "Haaland".
    Where no standard anglicisation exists, use the closest unaccented rendering.
- id: 37
  date: '2026-07-30'
  rule: When a product or service name is introduced, lead with the parent company
    and the verb describing the launch or announcement, then introduce the product
    name as its subject — eg, "MoonPay has launched PayBox, a payment vault…" rather
    than "MoonPay's new product, PayBox, is a payment vault…". This keeps the company
    as the active agent and avoids burying the action inside a noun phrase.
- id: 38
  date: '2026-07-31'
  rule: Do not use "cVRP" as an abbreviation for "commercial variable recurring payments".
    Write out "commercial VRP" or "commercial variable recurring payments (VRP)" instead.
    The "c" prefix abbreviation is non-standard; prefer the adjective "commercial"
    spelled out in full before the standard abbreviation.
- id: 39
  date: '2026-08-03'
  rule: Do not base a story on a summary or snippet when the primary source document
    is available. Use the actual source — the full letter, report, or statement —
    and write the story from its content directly. If the original source contains
    named individuals, specific arguments, and concrete claims, these must be reflected
    in the body rather than paraphrased vaguely as "a letter from an open banking
    payments company".
- id: 40
  date: '2026-08-18'
  rule: The standfirst must name the specific stakes or consequences of the story
    — naming the initiatives, programmes or competitive dynamics affected — rather
    than making a generic thematic claim. For example, prefer "The decline in cash
    acceptance among euro area businesses has stalled, challenging assumptions that
    underpin initiatives from Wero to the digital euro" over "Fresh survey findings
    challenge the assumption that the pandemic permanently shifted European businesses
    toward digital-only acceptance."
- id: 41
  date: '2026-08-18'
  rule: When the standfirst opens without naming the organisation from the headline
    (per rule [1]), it may still use a short descriptive clause that identifies the
    action and its consequences directly. The standfirst should not be a vague scene-setter;
    it must anchor the reader in the specific development and name the affected parties
    or programmes where they add precision.
- id: 42
  date: '2026-08-18'
  rule: Do not lead a story on a non-European market development primarily as a comparative
    lesson for European readers. If the development is relevant to a European audience,
    cover it on its own merits first. Framing the entire story as "what Europe can
    learn from X" reduces the story to an editorial opinion piece rather than a news
    item.
- id: 43
  date: '2026-08-26'
  rule: Do not use "The" before an acronym-only organisation name such as "MAS" (Monetary
    Authority of Singapore). Use the acronym directly as a proper noun — eg, "MAS
    has positioned…" not "The MAS has positioned…".
- id: 44
  date: '2026-08-27'
  rule: Do not cover the publication of quarterly or annual results as a story in
    its own right. Results are only worth covering if they are genuinely notable —
    for example, a record profit, a surprising turnaround, or an unexpected loss —
    and even then only if the company is a large or particularly significant player
    in the payments sector.
